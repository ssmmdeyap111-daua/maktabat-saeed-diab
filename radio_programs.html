<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البرامج الإذاعية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --accent-blue: #add8e6; --gold: #d4af37; --prayer-bg: #fdfae7; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #fff; }

        /* شريط المعلومات العلوي */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; background: var(--prayer-bg); border-bottom: 2px solid var(--accent-blue); }
        .date-info { font-weight: 900; color: var(--primary); font-size: 1rem; }
        .prayer-times { display: flex; gap: 8px; }
        .p-box { background: white; border: 1px solid #ddd; padding: 5px; border-radius: 8px; text-align: center; min-width: 60px; }
        .p-n { display: block; font-size: 0.7rem; color: #666; font-weight: bold; }
        .p-t { font-weight: 900; color: #1b5e20; font-size: 0.85rem; }

        /* الهيدر واللوجو */
        .site-header { text-align: center; padding: 20px; background: var(--accent-blue); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 500px; width: 100%; mix-blend-mode: multiply; }

        /* التنقل 3D */
        .main-nav { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .nav-btn-3d { 
            padding: 12px 25px; border-radius: 12px; font-weight: 900; text-decoration: none; color: white; 
            background: var(--primary); box-shadow: 0 6px 0 #1a3a54; transition: 0.2s; min-width: 140px; text-align: center;
        }
        .nav-btn-3d:active { transform: translateY(4px); box-shadow: 0 2px 0 #1a3a54; }
        .btn-gold { background: var(--gold); box-shadow: 0 6px 0 #8c6d1a; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .page-title { text-align: center; color: var(--primary); font-weight: 900; font-size: 2.2rem; margin-bottom: 40px; border-bottom: 3px solid var(--gold); display: table; margin: 0 auto 40px; }

        /* الأكورديون */
        .accordion-item { background: white; border-radius: 15px; margin-bottom: 15px; border: 2px solid var(--accent-blue); overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .accordion-header { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #fff; border-right: 10px solid var(--gold); }
        .accordion-header span { font-weight: 900; color: var(--primary); font-size: 1.3rem; }
        .accordion-content { display: none; padding: 15px; background: #fcfdfe; border-top: 1px solid #eee; }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: #eef7fb; }

        /* صفوف الدروس */
        .lesson-row { padding: 15px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .lesson-title { font-weight: 700; color: var(--primary); flex: 1.5; }
        audio { height: 35px; flex: 4; }
        .btn-dl { color: #1b5e20; font-size: 1.5rem; text-decoration: none; }

        footer { text-align: center; padding: 25px; background: var(--accent-blue); color: var(--primary); font-weight: bold; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="date-now" class="date-info">جاري التحميل...</div>
        <div id="prayer-list" class="prayer-times"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" class="site-logo">
    </header>

    <nav class="main-nav">
        <a href="index.html" class="nav-btn-3d">الرئيسية</a>
        <a href="tafseer_index.html" class="nav-btn-3d">التفسير</a>
        <a href="lessons.html" class="nav-btn-3d btn-gold">الصوتيات</a>
    </nav>

    <div class="container">
        <h1 class="page-title">البرامج الإذاعية</h1>

        <div class="accordion-item" id="sec-radio1">
            <div class="accordion-header" onclick="toggleSec('radio1')">
                <span><i class="fas fa-radio"></i> حلقات برنامج إذاعة قطر</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-content" id="list-radio1"></div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        // هنا نضع إعدادات الملفات (الاسم المرجح للملفات الصوتية وعددها)
        const config = {
            radio1: { prefix: "radio-program", count: 15 } 
        };

        function toggleSec(id) {
            const el = document.getElementById('sec-' + id);
            el.classList.toggle('active');
            const list = document.getElementById('list-' + id);
            
            if (list.innerHTML === "") {
                let html = "";
                for (let i = 1; i <= config[id].count; i++) {
                    html += `
                    <div class="lesson-row">
                        <div class="lesson-title">حلقة رقم (${i})</div>
                        <audio controls preload="none"><source src="audio/${config[id].prefix}-${i}.mp3"></audio>
                        <a href="audio/${config[id].prefix}-${i}.mp3" download class="btn-dl"><i class="fas fa-circle-down"></i></a>
                    </div>`;
                }
                list.innerHTML = html;
            }
        }

        async function init() {
            const n = new Date();
            document.getElementById('date-now').innerText = new Intl.DateTimeFormat('ar-EG', {day:'numeric', month:'long', year:'numeric'}).format(n) + " م";
            try {
                const r = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const j = await r.json();
                const t = j.data.timings;
                const p = [{n:"الفجر",v:t.Fajr},{n:"الظهر",v:t.Dhuhr},{n:"العصر",v:t.Asr},{n:"المغرب",v:t.Maghrib},{n:"العشاء",v:t.Isha}];
                document.getElementById('prayer-list').innerHTML = p.map(x => `<div class="p-box"><span class="p-n">${x.n}</span><span class="p-t">${x.v}</span></div>`).join('');
            } catch(e){}
        }
        init();
    </script>
</body>
</html>
