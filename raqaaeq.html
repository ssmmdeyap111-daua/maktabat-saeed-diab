<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرقائق والزهد - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="site-header">
    <h1>دروس الرقائق والزهد</h1>
</header>

<div class="nav-bar">
    <a href="lessons.html" class="btn-3d"><i class="fas fa-arrow-right"></i> الفهرس</a>
    <a href="index.html" class="btn-3d"><i class="fas fa-home"></i> الرئيسية</a>
</div>

<div class="container">

    <div class="accordion-item">
        <div class="accordion-header" onclick="toggleAccordion(this)">
            <span><i class="fas fa-heart"></i> أسباب محبة الله للعباد (18 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div class="lessons-list" id="mahba-list"></div>
        </div>
    </div>

    <div class="accordion-item">
        <div class="accordion-header" onclick="toggleAccordion(this)">
            <span><i class="fas fa-pray"></i> سلسلة أنوار الأذكار (30 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div class="lessons-list" id="azkar-list"></div>
        </div>
    </div>

    <div class="accordion-item">
        <div class="accordion-header" onclick="toggleAccordion(this)">
            <span><i class="fas fa-sun"></i> سلسلة مكارم الأخلاق (30 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div class="lessons-list" id="mkarem-list"></div>
        </div>
    </div>

    <div class="accordion-item">
        <div class="accordion-header" onclick="toggleAccordion(this)">
            <span><i class="fas fa-cloud-sun"></i> سلسلة وصف الجنة (30 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div class="lessons-list" id="wasf-list"></div>
        </div>
    </div>

</div>

<script>
    function toggleAccordion(header) {
        header.parentElement.classList.toggle('active');
    }

    function generate(id, prefix, count, extension) {
        const container = document.getElementById(id);
        let html = '';
        for (let i = 1; i <= count; i++) {
            html += `
            <div class="lesson-card">
                <span>درس ${i}</span>
                <audio controls preload="none">
                    <source src="audio/${prefix}-${i}.${extension}" type="audio/mpeg">
                </audio>
            </div>`;
        }
        container.innerHTML = html;
    }

    generate('mahba-list', 'mahba', 18, 'mp3');
    generate('azkar-list', 'al-azkar', 30, 'mp3');
    generate('mkarem-list', 'mkarem', 30, 'MP3');
    generate('wasf-list', 'wasf-algana', 30, 'MP3');
</script>

<footer style="text-align: center; padding: 40px; color: #888;">
    جميع الحقوق محفوظة &copy; 2026
</footer>

</body>
</html>
