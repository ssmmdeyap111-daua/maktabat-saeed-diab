<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>الرقائق والزهد - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --gold: #d4af37; --bg: #f4f7f9; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); }
        .site-header { background: white; padding: 30px; text-align: center; border-bottom: 4px solid var(--primary); }
        .series-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .series-card { background: white; padding: 25px; border-radius: 20px; text-align: center; text-decoration: none; color: var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid #eee; }
        .series-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .series-card i { font-size: 3.5rem; margin-bottom: 15px; display: block; }
        .series-card h3 { margin: 0; font-size: 1.3rem; font-weight: 900; }
        .count { background: #f0f4f8; padding: 4px 12px; border-radius: 50px; font-size: 0.8rem; margin-top: 10px; display: inline-block; }
        .nav-bar { display: flex; justify-content: center; padding: 20px; }
    </style>
</head>

<div class="nav-bar"><a href="lessons.html" style="text-decoration:none; color:var(--primary); font-weight:bold;"><i class="fas fa-arrow-right"></i> العودة للفهرس العام</a></div>

<div class="series-grid">
    <a href="raq_azkar.html" class="series-card">
        <i class="fas fa-pray" style="color: #3498db;"></i>
        <h3>أنوار الأذكار</h3>
        <span class="count">30 درساً</span>
    </a>
    <a href="raq_mahba.html" class="series-card">

    </a>

    <a href="raq_ganah.html" class="series-card">
