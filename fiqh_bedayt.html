<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بداية العابد - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-blue: #2c5d87; --bg: #f8fafc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); }
        .site-header { background: white; padding: 20px; text-align: center; border-bottom: 3px solid var(--primary-blue); }
        .container { width: 98%; max-width: 1600px; margin: 20px auto; }
        
        .lesson-row {
            display: flex; align-items: center; background: white; 
            margin-bottom: 8px; padding: 15px 30px; border-radius: 10px;
            border: 1px solid #e2e8f0; transition: 0.3s;
        }
        .lesson-row:hover { background: #f1f5f9; border-right: 6px solid var(--primary-blue); }
        .lesson-info { flex: 2; font-weight: 700; font-size: 1.2rem; color: #334155; }
        .audio-player { flex: 4; display: flex; justify-content: center; }
        audio { width: 95%; height: 40px; }
        .actions { flex: 1; display: flex; justify-content: flex-end; gap: 20px; }
        .actions a { color: #10b981; font-size: 1.4rem; text-decoration: none; }
        
        .pagination { display: flex; justify-content: center; margin: 30px; gap: 10px; }
        .page-btn { padding: 10px 20px; background: white; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; }
        .page-btn.active { background: var(--primary-blue); color: white; }
    </style>
</head>
<body>

<header class="site-header">
    <div style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
        <a href="fiqh.html" style="text-decoration:none; color:var(--primary-blue); font-weight:bold;"><i class="fas fa-chevron-right"></i> عودة لسلاسل الفقه</a>
        <h2 style="margin:0;">سلسلة: بداية العابد وكفاية الزاهد</h2>
        <span></span>
    </div>
</header>

<div class="container" id="lesson-list"></div>
<div class="pagination" id="pagination"></div>

<script>
    const count = 24;
    const prefix = "bedayt";
    const perPage = 12;
    let currentPage = 1;

    function render(page) {
        const list = document.getElementById('lesson-list');
        list.innerHTML = "";
        let start = (page - 1) * perPage + 1;
        let end = Math.min(start + perPage - 1, count);

        for (let i = start; i <= end; i++) {
            const row = document.createElement('div');
            row.className = 'lesson-row';
            row.innerHTML = `
                <div class="lesson-info">الدرس رقم ${i}</div>
                <div class="audio-player">
                    <audio controls preload="none"><source src="audio/${prefix}-${i}.mp3"></audio>
                </div>
                <div class="actions">
                    <a href="audio/${prefix}-${i}.mp3" download><i class="fas fa-download"></i></a>
                </div>`;
            list.appendChild(row);
        }
        renderPagination();
    }

    function renderPagination() {
        const pag = document.getElementById('pagination');
        pag.innerHTML = "";
        const pages = Math.ceil(count / perPage);
        for (let i = 1; i <= pages; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            btn.onclick = () => { currentPage = i; render(i); window.scrollTo(0,0); };
            pag.appendChild(btn);
        }
    }
    render(1);
</script>
</body>
</html>
