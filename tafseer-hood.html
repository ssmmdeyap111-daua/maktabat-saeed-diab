
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة هود - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #f4f7f9; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); color: #333; }

        /* الهيدر الموحد */
        .site-header { text-align: center; padding: 15px; background: var(--header-bg); border-bottom: 4px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; height: auto; mix-blend-mode: multiply; }

        /* شريط التنقل العلوي */
        .main-nav { display: flex; justify-content: center; gap: 8px; padding: 12px; background: #fff; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-item-small {
            padding: 8px 15px; background: var(--accent-blue); color: white; text-decoration: none;
            border-radius: 8px; font-weight: bold; font-size: 0.85rem;
            box-shadow: 0 4px 0 var(--dark-blue); transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .nav-item-small:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--dark-blue); background: #5a9bd5; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px 50px; }
        .page-title { text-align: center; color: var(--dark-blue); font-weight: 900; margin-bottom: 25px; font-size: 1.8rem; border-bottom: 2px solid var(--gold-color); display: inline-block; padding-bottom: 10px; width: 100%; }

        /* تنسيق الدروس */
        .lesson-row { 
            background: white; border: 1px solid #edf2f7; border-radius: 8px; 
            padding: 10px 15px; margin-bottom: 8px; display: flex; 
            align-items: center; justify-content: space-between; gap: 10px;
            transition: 0.3s;
        }
        .lesson-row:hover { border-color: var(--accent-blue); background: #fcfdfe; }
        
        .lesson-right { flex: 1.2; display: flex; align-items: center; gap: 8px; color: var(--dark-blue); font-weight: 700; font-size: 0.95rem; text-align: right; }
        .audio-player { flex: 2; display: flex; justify-content: center; }
        audio { width: 95%; height: 32px; }
        .download-left { flex: 0.5; text-align: left; }
        .btn-download { color: #27ae60; font-size: 1.4rem; text-decoration: none; transition: 0.3s; }
        .btn-download:hover { color: var(--dark-blue); transform: scale(1.1); }

        /* الترقيم */
        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 30px; padding: 10px; flex-wrap: wrap; }
        .page-num { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 5px; cursor: pointer; font-weight: bold; background: #fff; border: 1px solid #ddd; color: var(--dark-blue); font-size: 0.9rem; transition: 0.2s; }
        .page-num.active { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

        footer { text-align: center; padding: 30px; background: #e0f2f7; color: var(--dark-blue); font-weight: bold; margin-top: 50px; }

        @media (max-width: 768px) {
            .lesson-row { flex-direction: column; text-align: center; }
            .lesson-right { justify-content: center; }
            .download-left { text-align: center; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
</header>

<nav class="main-nav">
    <a href="index.html" class="nav-item-small"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="tafseer.html" class="nav-item-small"><i class="fas fa-list-ul"></i> فهرس السور</a>
    <a href="lessons.html" class="nav-item-small"><i class="fas fa-microphone"></i> الصوتيات</a>
</nav>

<div class="container">
    <h1 class="page-title">تفسير سورة هود</h1>
    
    <div id="lessons-container"></div>
    <div class="pagination" id="pagination-container"></div>
</div>

<footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

<script>
    /* --- إعدادات سورة هود --- */
    const config = {
        title: "تفسير سورة هود",
        prefix: "hood",   // ليتطابق مع ملف الصوت hood-1.mp3
        total: 22,        // بناءً على الفهرس العام
        perPage: 12
    };

    let currentPage = 1;

    function renderLessons(page) {
        const container = document.getElementById('lessons-container');
        container.innerHTML = "";
        
        const start = (page - 1) * config.perPage + 1;
        const end = Math.min(page * config.perPage, config.total);

        for (let i = start; i <= end; i++) {
            const fileUrl = `audio/${config.prefix}-${i}.mp3`;
            container.innerHTML += `
                <div class="lesson-row">
                    <div class="lesson-right">
                        <i class="fas fa-headphones" style="font-size:0.8rem; color:#ccc;"></i>
                        <span>الدرس رقم ${i}</span>
                    </div>
                    <div class="audio-player">
                        <audio controls preload="none">
                            <source src="${fileUrl}" type="audio/mpeg">
                        </audio>
                    </div>
                    <div class="download-left">
                        <a href="${fileUrl}" download class="btn-download" title="تحميل الدرس">
                            <i class="fas fa-cloud-arrow-down"></i>
                        </a>
                    </div>
                </div>`;
        }
        renderPagination();
    }

    function renderPagination() {
        const container = document.getElementById('pagination-container');
        container.innerHTML = "";
        const totalPages = Math.ceil(config.total / config.perPage);

        if (totalPages > 1) {
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('div');
                btn.className = `page-num ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => {
                    currentPage = i;
                    renderLessons(i);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                container.appendChild(btn);
            }
        }
    }

    window.onload = () => renderLessons(1);
</script>

</body>
</html>
