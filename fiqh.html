<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم الفقه الإسلامي - الشيخ سعيد مصطفى دياب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root { 
    --light-sky: #f4f7f9;
    --accent-blue: #87ceeb;
    --dark-blue: #2c5d87;
    --gold-color: #d4af37;
    --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
}

body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background: var(--light-sky);
    color: #333;
}

/* ===== TOP BAR ===== */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: #fdfae7;
    border-bottom: 2px solid var(--accent-blue);
    font-size: 0.9rem;
    font-weight: bold;
}

/* ===== LOGO ===== */
.site-header {
    text-align: center;
    padding: 18px;
    background: var(--header-bg);
}

.site-logo {
    max-width: 320px;
    width: 100%;
    height: auto;
}

/* ===== NAV (بدون أيقونات) ===== */
.main-nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.nav-item {
    padding: 10px 18px;
    background: var(--accent-blue);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 0.95rem;
    transition: 0.2s;
}

.nav-item:hover {
    filter: brightness(1.05);
    transform: translateY(-2px);
}

.nav-gold {
    background: var(--gold-color);
}

/* ===== CONTAINER ===== */
.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px 50px;
    text-align: center;
}

.page-title {
    font-size: 1.8rem;
    color: var(--dark-blue);
    font-weight: 900;
    margin-bottom: 25px;
}

/* ===== GRID ===== */
.series-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
}

/* ===== CARDS (بدون أيقونات) ===== */
.series-card {
    background: white;
    padding: 14px 10px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--dark-blue);
    border: 1px solid #eee;
    border-bottom: 3px solid var(--gold-color);
    transition: 0.25s;
}

.series-card:hover {
    transform: translateY(-4px);
    border-bottom-color: var(--dark-blue);
}

/* النص فقط */
.series-card h3 {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 700;
    line-height: 1.4;
}

/* عدد الدروس */
.series-count {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.75rem;
    color: #666;
    background: #f1f1f1;
    padding: 3px 8px;
    border-radius: 20px;
}

/* ===== FOOTER ===== */
footer {
    text-align: center;
    padding: 25px;
    background: #e0f2f7;
    font-weight: bold;
    color: var(--dark-blue);
}

/* ===== MOBILE ===== */
@media(max-width:768px){
    .top-bar { flex-direction: column; gap: 8px; }
}
</style>
</head>

<body>

<div class="top-bar">
    <div id="current-date">جاري التحميل...</div>
</div>

<header class="site-header">
    <!-- تأكد أن المسار صحيح -->
    <img src="images/logo.png" class="site-logo" alt="logo">
</header>

<nav class="main-nav">
    <a href="index.html" class="nav-item">الرئيسية</a>
    <a href="lessons.html" class="nav-item nav-gold">الفهرس العام</a>
    <a href="khutab.html" class="nav-item">الخطب</a>
    <a href="books.html" class="nav-item">الكتب</a>
    <a href="articles.html" class="nav-item">المقالات</a>
</nav>

<div class="container">

    <h1 class="page-title">قسم الفقه الإسلامي</h1>

    <div class="series-grid">

        <a href="fiqh_bedayt.html" class="series-card">
            <h3>بداية العابد وكفاية الزاهد</h3>
            <span class="series-count">24 درساً</span>
        </a>

        <a href="fiqh_akhasar.html" class="series-card">
            <h3>شرح أخصر المختصرات</h3>
            <span class="series-count">26 درساً</span>
        </a>

        <a href="fiqh_alhady-alnabwy.html" class="series-card">
            <h3>الهدي النبوي في العبادات</h3>
            <span class="series-count">40 درساً</span>
        </a>

        <div class="series-card" style="opacity:0.6; cursor:default;">
            <h3>قريباً شروح فقهية أخرى</h3>
            <span class="series-count">قيد التحضير</span>
        </div>

    </div>
</div>

<footer>
جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب © 2026
</footer>

<script>
// التاريخ الهجري
document.getElementById("current-date").innerText =
new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {
    weekday:'long',
    day:'numeric',
    month:'long',
    year:'numeric'
}).format(new Date()) + " هـ";
</script>

</body>
</html>
