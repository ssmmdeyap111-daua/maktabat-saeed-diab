<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس الفقه - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg-color: #f4f7f9; --header-bg: #ffffff; --primary-blue: #2c5d87; --item-bg: #fdfdfd; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background-color: var(--bg-color); }

        /* الهيدر */
        .site-header { background: var(--header-bg); padding: 20px; text-align: center; border-bottom: 2px solid #eee; }
        .site-header h1 { color: var(--primary-blue); margin: 0; font-size: 1.8rem; }

        /* حاوي الدروس - ممتد بعرض الشاشة */
        .container { width: 95%; max-width: 1400px; margin: 20px auto; }
        
        .lesson-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--item-bg);
            margin-bottom: 8px;
            padding: 12px 25px;
            border-radius: 5px;
            border: 1px solid #e1e1e1;
            transition: 0.2s;
        }
        .lesson-row:hover { background: #f9f9f9; }

        .lesson-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .lesson-title { font-weight: bold; color: #444; font-size: 1.1rem; }

        /* مشغل الصوت - عرض أكبر */
        .audio-player { flex: 2; display: flex; justify-content: center; }
        audio { width: 100%; max-width: 600px; height: 35px; }

        .actions { display: flex; gap: 20px; flex: 0.5; justify-content: flex-end; }
        .actions i { color: #888; cursor: pointer; font-size: 1.2rem; }
        .actions i:hover { color: var(--primary-blue); }

        /* نظام الترقيم (Pagination) */
        .pagination {
            display: flex;
            justify-content: center;
            margin: 40px 0;
            gap: 5px;
            direction: ltr; /* لضمان ترتيب الأرقام من اليسار لليمين */
        }
        .page-link {
            padding: 8px 16px;
            background: white;
            border: 1px solid #ddd;
            text-decoration: none;
            color: var(--primary-blue);
            font-weight: bold;
            border-radius: 4px;
        }
        .page-link.active { background: var(--primary-blue); color: white; border-color: var(--primary-blue); }
        .page-link:hover:not(.active) { background: #eee; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>بداية العابد وكفاية الزاهد</h1>
</header>

<div class="container" id="lessons-container">
    </div>

<div class="pagination" id="pagination">
    <a href="#" class="page-link">&laquo;</a>
    <a href="#" class="page-link active">1</a>
    <a href="#" class="page-link">2</a>
    <a href="#" class="page-link">3</a>
    <a href="#" class="page-link">4</a>
    <a href="#" class="page-link">&raquo;</a>
</div>

<script>
    // بيانات الدروس (مثال لـ 15 درساً للصفحة الأولى)
    const lessonsCount = 15; 
    const prefix = "bedayt";
    const container = document.getElementById('lessons-container');

    for (let i = 1; i <= lessonsCount; i++) {
        const row = document.createElement('div');
        row.className = 'lesson-row';
        row.innerHTML = `
            <div class="lesson-info">
                <div class="actions" style="justify-content: flex-start; flex: none;">
                    <i class="fas fa-play-circle"></i>
                    <i class="fas fa-download"></i>
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <span class="lesson-title">بداية العابد وكفاية الزاهد - الدرس ${i}</span>
            </div>
            <div class="audio-player">
                <audio controls preload="none">
                    <source src="audio/${prefix}-${i}.mp3" type="audio/mpeg">
                </audio>
            </div>
        `;
        container.appendChild(row);
    }
</script>

</body>
</html>
