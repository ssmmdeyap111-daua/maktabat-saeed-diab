<div class="series-box">
    <h2 class="series-title">أخصر المختصرات (26 درساً)</h2>
    <div class="lessons-grid" id="akhasar-list"></div>
</div>

<script>
    const container = document.getElementById('akhasar-list');
    for (let i = 1; i <= 26; i++) {
        container.innerHTML += `
        <div class="lesson-item">
            <span>الدرس ${i}</span>
            <audio controls preload="none">
                <source src="audio/akhasar-${i}.mp3" type="audio/mpeg">
            </audio>
        </div>`;
    }
</script>
