<!DOCTYPE html>
<html lang="ar" dir="rtl">
<!-- سيتم إدراج header.html تلقائيًا -->
<body>

<div id="content">
    <div class="container">
        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion(this)">
                <span><i class="fas fa-book"></i> شرح أخصر المختصرات (26 درساً)</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-content"><div class="lessons-list" id="akhasar-list"></div></div>
        </div>
    </div>
</div>

<script>
    function toggleAccordion(header) { header.parentElement.classList.toggle('active'); }
    
    function generate(id, prefix, count) {
        const container = document.getElementById(id);
        if(!container) return;
        let html = '';
        for (let i = 1; i <= count; i++) {
            html += `<div class="lesson-card">
                        <span>درس ${i}</span>
                        <audio controls preload="none">
                            <source src="audio/${prefix}-${i}.mp3">
                        </audio>
                        <a href="audio/${prefix}-${i}.mp3" download class="dl-icon"><i class="fas fa-download"></i></a>
                     </div>`;
        }
        container.innerHTML = html;
    }

    window.onload = function() {
        generate('akhasar-list', 'akhasar', 26);
    };
</script>

<!-- إدراج Header المشترك -->
<script>
fetch('header.html')
  .then(response => response.text())
  .then(data => {
    document.body.insertAdjacentHTML('afterbegin', data);
  });
</script>

</body>
</html>
