<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس الفقه - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-blue: #2c5d87; --gold: #d4af37; --bg: #f4f7f9; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); }
        .site-header { background: white; padding: 30px; text-align: center; border-bottom: 4px solid var(--primary-blue); }
        .site-header h1 { color: var(--primary-blue); margin: 0; }
        
        /* شبكة الأيقونات */
        .series-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
            padding: 40px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .series-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            text-decoration: none;
            color: var(--primary-blue);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: 0.3s;
            border: 1px solid #eee;
        }
        .series-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-color: var(--gold); }
        .series-card i { font-size: 4rem; color: var(--gold); margin-bottom: 20px; }
        .series-card h3 { margin: 0; font-size: 1.5rem; font-weight: 900; }
        .series-count { background: #f0f4f8; padding: 5px 15px; border-radius: 50px; font-size: 0.9rem; margin-top: 10px; display: inline-block; }

        .nav-bar { display: flex; justify-content: center; padding: 20px; }
        .btn-home { padding: 10px 20px; background: white; border-radius: 10px; text-decoration: none; color: var(--primary-blue); font-weight: bold; border: 1px solid #ddd; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>قسم الفقه الإسلامي</h1>
</header>

<div class="nav-bar">
    <a href="lessons.html" class="btn-home"><i class="fas fa-arrow-right"></i> العودة للفهرس العام</a>
</div>

<div class="series-grid">
    <a href="fiqh_bedayt.html" class="series-card">
        <i class="fas fa-book-open"></i>
        <h3>بداية العابد وكفاية الزاهد</h3>
        <span class="series-count">24 درساً</span>
    </a>

    <a href="fiqh_akhasar.html" class="series-card">
        <i class="fas fa-scroll"></i>
        <h3>شرح أخصر المختصرات</h3>
        <span class="series-count">26 درساً</span>
    </a>
</div>

</body>
</html>
