<script src="fiqhData.js"></script>

<script>

const container = document.getElementById("fiqhContainer");

/* ترتيب الدروس حسب رقم الدرس */
fiqhLessons.sort((a,b) => a.lessonNumber - b.lessonNumber);

fiqhLessons.forEach(lesson => {

container.innerHTML += `
<div class="lesson-card">

<h3>${lesson.title}</h3>

<p>📖 الباب: ${lesson.book}</p>
<p>🎧 مدة الدرس: ${lesson.duration}</p>

<audio controls>
<source src="audio/${lesson.file}" type="audio/mpeg">
</audio>

<a href="audio/${lesson.file}" download class="download-btn">
تحميل الدرس
</a>

</div>
`;

});

</script>
