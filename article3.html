    <div class="article-content">
        أَلتَّفْسِيرُ لغة: "تَفْعِيلٌ" مِنَ الْفَسْرِ، وَهُوَ الْبَيَانُ وَالْكَشْفُا...
        <!--التَّفْسِيرُ لغة: "تَفْعِيلٌ" مِنَ الْفَسْرِ، وَهُوَ الْبَيَانُ وَالْكَشْفُ. 
وَاصْطِلَاحًا: عِلْمٌ يُفْهَمُ بِهِ كِتَابُ اللَّهِ الْمُنَزَّلِ عَلَى نَبِيِّهِ مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ وَبَيَانَ مَعَانِيهِ، وَاسْتِخْرَاجِ أَحْكَامِهِ وَحِكَمِهِ.  
وَأَكْثَرُ اسْتِعْمَالِهِ فِي الْأَلْفَاظِ وَمُفْرَدَاتِهَا. 
وَالتَّدَبُرُ لغةً: النَّظَرُ فِي عَوَاقِبِ الأمورِ وَأَدْبَارِهَا، مُشْتَقٌّ مِنَ الدُّبُرِ وقيل:
لَا يَعْرِفُونَ الْأَمْرَ إلَّا تَدَبُّرًا
أَيْ: لَا يَعْرِفُونَ الْأَمْرَ إلا بَعْدَ مَا مَضَى.
واصطلاحًا: 
تأملُ دلالات معاني الآيات، بإجالةِ الفكرِ وإمعان النظر فيها، وربطها بغيرها من الآيات، لاستنباط المعنى المراد، وتنزيله على الواقع.
قال ابن عاشور: التَّدَبُّرُ مُشْتَقٌّ مِنَ الدُّبُرِ، أَيِ الظَّهْرِ، اشْتَقُّوا مِنَ الدُّبُرِ فِعْلًا، فَقَالُوا: تَدَبَّرَ إِذَا نَظَرَ فِي دُبُرِ الْأَمْرِ، أَيْ فِي غَائِبِهِ أَوْ فِي عَاقِبَتِهِ، فَمَعْنَى: ﴿يَتَدَبَّرُونَ الْقُرْآنَ﴾: يَتَأَمَّلُونَ دَلَالَتَهُ، عَلَى مَقَاصِدِهِ الَّتِي أَرْشَدَ إِلَيْهَا الْمُسْلِمِينَ.
