        .lesson-name { color: var(--dark-blue); font-weight: 700; font-size: 0.95rem; text-decoration: none; }
        
        .audio-player { flex: 2; display: flex; justify-content: center; }
        audio { height: 32px; width: 100%; max-width: 350px; }

        .btn-download { color: var(--green-dl); font-size: 1.3rem; text-decoration: none; transition: 0.3s; }
        .btn-download:hover { transform: scale(1.1); }

        footer { text-align: center; color: white; padding: 20px; font-weight: bold; font-size: 0.9rem; text-shadow: 1px 1px 2px black; }
        @media (max-width: 768px) { .lesson-row { flex-direction: column; gap: 10px; } .audio-player { width: 100%; } }
