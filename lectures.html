<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاضرات عامة - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; --green: #27ae60; }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: url('images/library-bg.jpg') no-repeat center center fixed; background-size: cover; }
        
        /* الهيدر العلوي */
        .site-header { padding: 30px; text-align: center; }
        .site-header h1 { font-size: 1.8rem; color: white; background: #6c8eb0; display: inline-block; padding: 12px 35px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .container { max-width: 850px; margin: 0 auto; padding: 20px; }

        /* الصندوق الرئيسي */
        .main-box { background: white; border-radius: 12px; border: 1px solid #ddd; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .box-header { padding: 18px 25px; background: #fff; border-right: 8px solid var(--gold); border-bottom: 2px solid #eee; display: flex; align-items: center; gap: 12px; }
        .box-header span { font-weight: 900; color: var(--dark-blue); font-size: 1.2rem; }

        /* صف الدرس */
        .lesson-item { padding: 15px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .lesson-item:last-child { border-bottom: none; }
        
        .lesson-title { flex: 1; color: var(--dark-blue); font-weight: 700; text-align: right; font-size: 1rem; }
        .audio-part { flex: 2; display: flex; justify-content: center; }
        audio { height: 35px; width: 100%; max-width: 300px; }
        
        .dl-icon { color: var(--green); font-size: 1.4rem; text-decoration: none; }
        .headphone-icon { color: var(--dark-blue); font-size: 1.2rem; }

        footer { text-align: center; color: white; padding: 30px; font-weight: bold; text-shadow: 1px 1px 3px black; }

        @media (max-width: 768px) {
            .lesson-item { flex-direction: column; text-align: center; }
            .lesson-title { order: 1; }
            .audio-part { order: 2; width: 100%; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>محاضرات عامة ومتفرقة</h1>
</header>

<div class="container">
    <div class="main-box">
        <div class="box-header">
            <i class="fas fa-microphone" style="color: var(--gold); font-size: 1.5rem;"></i>
            <span>قائمة المحاضرات المتاحة</span>
        </div>

        <div class="lesson-item">
            <a href="audio/al-ashr-1.mp3" download class="dl-icon"><i class="fas fa-cloud-download-alt"></i></a>
            <div class="audio-part"><audio controls preload="none"><source src="audio/al-ashr-1.mp3" type="audio/mpeg"></audio></div>
            <div class="lesson-title">من صور الاجتهاد في العشر الأواخر من رمضان</div>
            <i class="fas fa-headphones headphone-icon"></i>
        </div>

        <div class="lesson-item">
            <a href="audio/fdl-alsiam-2.MP3" download class="dl-icon"><i class="fas fa-cloud-download-alt"></i></a>
            <div class="audio-part"><audio controls preload="none"><source src="audio/fdl-alsiam-2.MP3" type="audio/mpeg"></audio></div>
            <div class="lesson-title">فضل الصيام 2</div>
            <i class="fas fa-headphones headphone-icon"></i>
        </div>

        <div class="lesson-item">
            <a href="audio/fdl-alsiam-1.mp3" download class="dl-icon"><i class="fas fa-cloud-download-alt"></i></a>
            <div class="audio-part"><audio controls preload="none"><source src="audio/fdl-alsiam-1.mp3" type="audio/mpeg"></audio></div>
            <div class="lesson-title">فضل الصيام 1</div>
            <i class="fas fa-headphones headphone-icon"></i>
        </div>

        <div class="lesson-item">
            <a href="audio/adab-alsiam.mp3" download class="dl-icon"><i class="fas fa-cloud-download-alt"></i></a>
            <div class="audio-part"><audio controls preload="none"><source src="audio/adab-alsiam.mp3" type="audio/mpeg"></audio></div>
            <div class="lesson-title">آداب الصيام</div>
            <i class="fas fa-headphones headphone-icon"></i>
        </div>

        <div class="lesson-item">
            <a href="audio/akhlaq-hamela-quran.mp3" download class="dl-icon"><i class="fas fa-cloud-download-alt"></i></a>
            <div class="audio-part"><audio controls preload="none"><source src="audio/akhlaq-hamela-quran.mp3" type="audio/mpeg"></audio></div>
            <div class="lesson-title">أخلاق حامل القرآن</div>
            <i class="fas fa-headphones headphone-icon"></i>
        </div>

        <div class="lesson-item">
            <a href="audio/esteghfar.mp3" download class="dl-icon"><i class="fas fa-cloud-download-alt"></i></a>
            <div class="audio-part"><audio controls preload="none"><source src="audio/esteghfar.mp3" type="audio/mpeg"></audio></div>
            <div class="lesson-title">فضل الاستغفار</div>
            <i class="fas fa-headphones headphone-icon"></i>
        </div>

    </div>
</div>

<footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

</body>
</html>
