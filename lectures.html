<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاضرات عامة - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; --green: #27ae60; }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: url('images/library-bg.jpg') no-repeat center center fixed; background-size: cover; }
        
        .site-header { padding: 30px; text-align: center; }
        .site-header h1 { font-size: 2rem; color: white; background: rgba(44, 93, 135, 0.85); display: inline-block; padding: 12px 50px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        /* توسيع مساحة العرض لتأخذ مساحة أكبر من الشاشة */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .main-box { background: rgba(255, 255, 255, 0.98); border-radius: 15px; border: 1px solid #ddd; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .box-header { padding: 20px 30px; background: #fff; border-right: 10px solid var(--gold); border-bottom: 2px solid #eee; display: flex; align-items: center; gap: 15px; }
        .box-header span { font-weight: 900; color: var(--dark-blue); font-size: 1.4rem; }

        .lesson-item { padding: 15px 30px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 20px; }
        .lesson-item:hover { background: #f9fbff; }
        
        /* اسم الدرس جهة اليمين */
        .lesson-title-area { flex: 1; display: flex; align-items: center; gap: 15px; justify-content: flex-start; }
        .lesson-title { color: var(--dark-blue); font-weight: 800; font-size: 1.1rem; text-align: right; }
        
        /* مشغل الصوت في المنتصف */
        .audio-part { flex: 1; display: flex; justify-content: center; }
        audio { height: 38px; width: 100%; max-width: 400px; }
        
        /* أيقونة التحميل جهة اليسار */
        .download-area { flex: 0.2; display: flex; justify-content: flex-end; }
        .dl-icon { color: var(--green); font-size: 1.7rem; text-decoration: none; transition: 0.3s; }
        .dl-icon:hover { transform: scale(1.2); }

        footer { text-align: center; color: white; padding: 40px; font-weight: bold; text-shadow: 1px 1px 3px black; }

        @media (max-width: 992px) {
            .lesson-item { flex-direction: column; text-align: center; }
            .lesson-title-area { justify-content: center; }
            .download-area { justify-content: center; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>محاضرات عامة ومتفرقة</h1>
</header>

<div class="container">
    <div class="main-box">
        <div class="box-header">

        </div>

        <div class="lesson-item">

            </div>
            <div class="audio-part"><audio controls preload="none"><source src="audio/al-ashr-1.mp3" type="audio/mpeg"></audio></div>
            <div class="download-area">
                <a href="audio/al-ashr-1.mp3" download class="dl-icon" title="تحميل الدرس"><i class="fas fa-cloud-download-alt"></i></a>

                <span class="lesson-title">قيام ليلة القدر من أسباب المغفرة</span>
            </div>
            <div class="audio-part"><audio controls preload="none"><source src="audio/qyam-laylat-alqadr.mp3" type="audio/mpeg"></audio></div>
            <div class="download-area">

        </div>

        <div class="lesson-item">

                <i class="fas fa-headphones" style="color: var(--dark-blue)"></i>
                <span class="lesson-title">فضل الصيام 2</span>
            </div>
            <div class="audio-part"><audio controls preload="none"><source src="audio/fdl-alsiam-2.MP3" type="audio/mpeg"></audio></div>
            <div class="download-area">
                <a href="audio/fdl-alsiam-2.MP3" download class="dl-icon" title="تحميل الدرس"><i class="fas fa-cloud-download-alt"></i></a>
            </div>
        </div>

        <div class="lesson-item">
            <div class="lesson-title-area">
                <i class="fas fa-headphones" style="color: var(--dark-blue)"></i>
                <span class="lesson-title">فضل الصيام 1</span>
            </div>
            <div class="audio-part"><audio controls preload="none"><source src="audio/fdl-alsiam-1.mp3" type="audio/mpeg"></audio></div>
            <div class="download-area">
                <a href="audio/fdl-alsiam-1.mp3" download class="dl-icon" title="تحميل الدرس"><i class="fas fa-cloud-download-alt"></i></a>
            </div>
        </div>

        <div class="lesson-item">
            <div class="lesson-title-area">
                <i class="fas fa-headphones" style="color: var(--dark-blue)"></i>
                <span class="lesson-title">آداب الصيام</span>
            </div>
            <div class="audio-part"><audio controls preload="none"><source src="audio/adab-alsiam.mp3" type="audio/mpeg"></audio></div>
            <div class="download-area">
                <a href="audio/adab-alsiam.mp3" download class="dl-icon" title="تحميل الدرس"><i class="fas fa-cloud-download-alt"></i></a>
            </div>
        </div>

    </div>
</div>

<footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

</body>
</html>
