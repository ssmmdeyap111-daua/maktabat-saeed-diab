<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير القرآن الكريم - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; --light-bg: #f8fafc; --green-dl: #27ae60; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-bg); direction: rtl; }
        
        /* الهيدر العلوي */
        .site-header { background: #e3effb; padding: 40px; text-align: center; border-bottom: 5px solid var(--dark-blue); }
        .site-header h1 { margin: 0; color: var(--dark-blue); font-size: 2.2rem; font-weight: 900; }

        /* شريط التنقل */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .btn-link { padding: 8px 20px; border: 1px solid #ddd; border-radius: 8px; text-decoration: none; color: var(--dark-blue); font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .btn-link:hover { background: var(--dark-blue); color: white; }

        /* حاوية الدروس (نفس تنسيق الصورة 6d7c6c) */
        .lessons-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        .lesson-row { 
            background: white; 
            border: 1px solid #e0e6ed; 
            border-radius: 10px; 
            padding: 12px 20px; 
            margin-bottom: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .lesson-right { display: flex; align-items: center; gap: 15px; flex: 1; justify-content: flex-end; }
        .lesson-name { color: var(--dark-blue); font-weight: 700; font-size: 1.1rem; }
        .lesson-icon { color: #cfd8dc; font-size: 1.2rem; }

        .audio-player { flex: 2; display: flex; justify-content: center; }
        audio { height: 35px; width: 100%; max-width: 400px; }

        .download-side { flex: 0.5; display: flex; justify-content: flex-start; }
        .btn-download { color: var(--green-dl); font-size: 1.5rem; text-decoration: none; transition: 0.3s; }
        .btn-download:hover { transform: scale(1.1); }

        /* نظام ترقيم الصفحات (Pagination) */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 30px; padding-bottom: 50px; }
        .page-num { 
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; 
            border: 1px solid #ddd; border-radius: 5px; cursor: pointer; text-decoration: none;
            color: var(--dark-blue); font-weight: bold; transition: 0.3s;
        }
        .page-num.active { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }
        .page-num:hover:not(.active) { background: #eee; }

        @media (max-width: 768px) {
            .lesson-row { flex-direction: column; gap: 15px; text-align: center; }
            .lesson-right { order: 1; }
            .audio-player { order: 2; width: 100%; }
            .download-side { order: 3; justify-content: center; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1 id="sura-title">تفسير سورة الأنعام</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link">العودة للرئيسية <i class="fas fa-home"></i></a>
    <a href="tafseer.html" class="btn-link">الفهرس <i class="fas fa-list"></i></a>
</div>

<div class="lessons-container" id="lessons-list">
    </div>

<div class="pagination" id="pagination">
    </div>

<script>
    // --- إعدادات الصفحة (قم بتغييرها لكل سورة) ---
    const config = {
        suraName: "المائدة",      // اسم السورة
        prefix: "maeda",     // بداية اسم الملف الصوتي في مجلد audio
        extension: "mp3",       // الامتداد (mp3 صغير)
        totalLessons: 36,       // إجمالي عدد الدروس
        lessonsPerPage: 10      // عدد الدروس في كل صفحة (مثل سورة البقرة)
    };

    document.getElementById('sura-title').innerText = `تفسير سورة ${config.suraName}`;

    let currentPage = 1;

    function displayLessons(page) {
        const listElement = document.getElementById('lessons-list');
        listElement.innerHTML = "";
        
        const start = (page - 1) * config.lessonsPerPage;
        const end = Math.min(start + config.lessonsPerPage, config.totalLessons);

        for (let i = start + 1; i <= end; i++) {
            const fileUrl = `audio/${config.prefix}-${i}.${config.extension}`;
            const row = `
                <div class="lesson-row">
                    <div class="download-side">
                        <a href="${fileUrl}" download class="btn-download" title="تحميل الدرس">
                            <i class="fas fa-cloud-download-alt"></i>
                        </a>
                    </div>
                    <div class="audio-player">
                        <audio controls preload="none">
                            <source src="${fileUrl}" type="audio/mpeg">
                        </audio>
                    </div>
                    <div class="lesson-right">
                        <span class="lesson-name">الدرس رقم ${i}</span>
                        <i class="fas fa-book-open lesson-icon"></i>
                    </div>
                </div>
            `;
            listElement.innerHTML += row;
        }
        setupPagination();
    }

    function setupPagination() {
        const pageCount = Math.ceil(config.totalLessons / config.lessonsPerPage);
        const paginationElement = document.getElementById('pagination');
        paginationElement.innerHTML = "";

        for (let i = 1; i <= pageCount; i++) {
            const btn = document.createElement('a');
            btn.innerText = i;
            btn.classList.add('page-num');
            if (i === currentPage) btn.classList.add('active');
            
            btn.addEventListener('click', () => {
                currentPage = i;
                displayLessons(currentPage);
                window.scrollTo(0, 0); // للعودة لأعلى الصفحة عند التنقل
            });
            paginationElement.appendChild(btn);
        }
    }

    // التشغيل المبدئي
    displayLessons(currentPage);
</script>

<footer>
    <p style="text-align: center; color: #888; padding: 20px;">جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</p>
</footer>

</body>
</html>
