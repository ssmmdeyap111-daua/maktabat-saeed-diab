<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة البقرة - الشيخ سعيد دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --dark-blue: #2c5d87; --accent-blue: #87ceeb; --light-bg: #f4f9ff; }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: var(--light-bg); color: #333; }
        .header-area { text-align: center; padding: 40px 20px; background: #add8e6; border-bottom: 4px solid white; }
        .nav-links { display: flex; justify-content: center; gap: 10px; padding: 20px; }
        .nav-item { padding: 8px 20px; background: var(--dark-blue); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .title-box { text-align: center; margin: 30px 0; }
        .title-box h2 { color: var(--dark-blue); font-weight: 900; }
        .lessons-list { max-width: 800px; margin: auto; padding: 0 20px; }
        .card { background: white; margin-bottom: 15px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-right: 6px solid var(--dark-blue); }
        .card h3 { margin: 0 0 15px 0; color: var(--dark-blue); font-size: 1.1rem; }
        .player-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        audio { flex: 1; min-width: 250px; height: 40px; }
        .dl-link { background: #27ae60; color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; }
        .fixed-back { position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px; background: var(--dark-blue); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 20px; }
    </style>
</head>
<body>

<div class="header-area">
    <h1>الشيخ سعيد مصطفى دياب</h1>
</div>

<div class="nav-links">
    <a href="index.html" class="nav-item">الرئيسية</a>
    <a href="tafseer.html" class="nav-item">الفهرس</a>
</div>

<div class="title-box">
    <h2>📖 تفسير سورة البقرة</h2>
</div>

<div class="lessons-list">
    <script>
        const localLessons = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        localLessons.forEach(num => {
            document.write(`
                <div class="card">
                    <h3>تفسير سورة البقرة - الدرس ${num}</h3>
                    <div class="player-box">
                        <audio controls preload="none"><source src="audio/bakara-${num}.mp3" type="audio/mpeg"></audio>
                        <a href="audio/bakara-${num}.mp3" download class="dl-link">تحميل MP3</a>
                    </div>
                </div>
            `);
        });
    </script>

    <div class="card">
        <h3>تفسير سورة البقرة - الدرس 10</h3>
        <div class="player-box">
            <audio controls preload="none"><source src="https://archive.org/download/bakara-10_202602/bakara-10.mp3" type="audio/mpeg"></audio>
            <a href="https://archive.org/download/bakara-10_202602/bakara-10.mp3" download class="dl-link">تحميل MP3</a>
        </div>
    </div>

    <div class="card">
        <h3>تفسير سورة البقرة - الدرس 11</h3>
        <div class="player-box">
            <audio controls preload="none"><source src="https://archive.org/download/bakara-11_202602/bakara-11.mp3" type="audio/mpeg"></audio>
            <a href="https://archive.org/download/bakara-11_202602/bakara-11.mp3" download class="dl-link">تحميل MP3</a>
        </div>
    </div>

    <div class="card">
        <h3>تفسير سورة البقرة - الدرس 12</h3>
        <div class="player-box">
            <audio controls preload="none"><source src="https://archive.org/download/bakara-10_202602/bakara-12.mp3" type="audio/mpeg"></audio>
            <a href="https://archive.org/download/bakara-10_202602/bakara-12.mp3" download class="dl-link">تحميل MP3</a>
        </div>
    </div>

    <div class="card">
        <h3>تفسير سورة البقرة - الدرس 13</h3>
        <div class="player-box">
            <audio controls preload="none"><source src="https://archive.org/download/bakara-10_202602/bakara-13.mp3" type="audio/mpeg"></audio>
            <a href="https://archive.org/download/bakara-10_202602/bakara-13.mp3" download class="dl-link">تحميل MP3</a>
        </div>
    </div>
</div>

<a href="tafseer.html" class="fixed-back">🔙</a>

</body>
</html>
