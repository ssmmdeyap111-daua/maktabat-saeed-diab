<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة البقرة - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --dark-blue: #2c5d87; --accent-blue: #87ceeb; --bg: #f4f9ff; }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: #333; }
        .header { text-align: center; padding: 40px 20px; background: #add8e6; border-bottom: 5px solid white; }
        .header h1 { margin: 0; color: var(--dark-blue); font-weight: 900; }
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; background: white; }
        .nav-bar a { padding: 8px 20px; background: var(--dark-blue); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .container { max-width: 850px; margin: 30px auto; padding: 0 20px; }
        .lesson-card { background: white; margin-bottom: 20px; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-right: 10px solid var(--dark-blue); }
        .lesson-card h3 { margin: 0 0 15px 0; color: var(--dark-blue); border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .player-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        audio { flex: 1; min-width: 250px; height: 45px; }
        .download-btn { background: #27ae60; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .back-btn { position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px; background: var(--dark-blue); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 20px; }
    </style>
</head>
<body>

<div class="header">
    <h1>الشيخ سعيد مصطفى دياب</h1>
    <h2 style="color: #555;">📖 تفسير سورة البقرة</h2>
</div>

<div class="nav-bar">
    <a href="index.html">الرئيسية</a>
    <a href="tafseer.html">فهرس التفسير</a>
    <a href="lessons.html">كافة الدروس</a>
</div>

<div class="container" id="baqara-list">
    </div>

<script>
    // هذه هي القائمة المعتمدة فقط (13 درساً)
    const myLessons = [
        {t: "1", f: "audio/bakara-1.mp3"},
        {t: "2", f: "audio/bakara-2.mp3"},
        {t: "3", f: "audio/bakara-3.mp3"}, // تم التأكد من المسار
        {t: "4", f: "audio/bakara-4.mp3"},
        {t: "5", f: "audio/bakara-5.mp3"},
        {t: "6", f: "audio/bakara-6.mp3"},
        {t: "7", f: "audio/bakara-7.mp3"}, // تم التأكد من المسار
        {t: "8", f: "audio/bakara-8.mp3"},
        {t: "9", f: "audio/bakara-9.mp3"},
        {t: "10", f: "https://archive.org/download/bakara-10_202602/bakara-10.mp3"},
        {t: "11", f: "https://archive.org/download/bakara-11_202602/bakara-11.mp3"},
        {t: "12", f: "https://archive.org/download/bakara-10_202602/bakara-12.mp3"},
        {t: "13", f: "https://archive.org/download/bakara-10_202602/bakara-13.mp3"}
    ];

    const listContainer = document.getElementById('baqara-list');
    
    // مسح أي محتوى قديم قد يكون عالقاً
    listContainer.innerHTML = "";

    myLessons.forEach(lesson => {
        listContainer.innerHTML += `
            <div class="lesson-card">
                <h3>تفسير سورة البقرة - الدرس ${lesson.t}</h3>
                <div class="player-row">
                    <audio controls preload="none">
                        <source src="${lesson.f}" type="audio/mpeg">
                        متصفحك لا يدعم المشغل.
                    </audio>
                    <a href="${lesson.f}" download class="download-btn">📥 تحميل</a>
                </div>
            </div>
        `;
    });
</script>

<a href="tafseer.html" class="back-btn">🔙</a>

</body>
</html>
