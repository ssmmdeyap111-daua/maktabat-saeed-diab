<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة النحل - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #2c5d87; 
            --gold: #cd950c; 
            --bg: #f4f7f9; 
        }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); text-align: center; }
        
        /* الهيدر العلوي */
        .site-header { padding: 20px; background: #fff; border-bottom: 1px solid #eee; }
        .site-logo { max-width: 350px; width: 100%; mix-blend-mode: multiply; }

        /* شريط التنقل الذهبي بالأيقونات */
        .nav-bar { 
            display: flex; justify-content: center; gap: 10px; padding: 15px; 
            flex-wrap: wrap; background: #f8f9fa; border-bottom: 5px solid var(--gold);
        }
        .btn-nav { 
            min-width: 120px; padding: 10px 15px; border-radius: 8px; font-weight: 700; 
            text-decoration: none; color: white; background: var(--gold);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.3s; box-shadow: 0 4px 0 #9e7309; font-size: 0.9rem;
        }
        .btn-nav:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #9e7309; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        /* بطاقة المحتوى */
        .tafseer-card { 
            background: white; border-radius: 25px; padding: 40px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.05); border: 1px solid #eee;
        }

        /* تكبير العنوان بشكل بارز جداً */
        .surah-title { 
            color: var(--primary); 
            font-weight: 900; 
            font-size: 3.5rem; /* حجم كبير جداً */
            margin-bottom: 5px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }
        .surah-subtitle { 
            color: var(--gold); 
            font-size: 1.5rem; 
            font-weight: 700; 
            margin-bottom: 40px; 
            display: block;
        }

        /* مشغل الصوت */
        .audio-section {
            background: #fdfaf0;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #f1e3c4;
            margin-bottom: 30px;
        }
        .audio-title { 
            font-weight: 900; 
            color: var(--primary); 
            margin-bottom: 15px; 
            font-size: 1.3rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
        }
        audio { width: 100%; filter: sepia(20%) saturate(70%) grayscale(10%) contrast(90%); }

        /* زر العودة للفهرس العام */
        .back-to-index {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-to-index:hover { background: var(--gold); transform: scale(1.05); }

        footer { padding: 30px; margin-top: 50px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="btn-nav"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="lessons.html" class="btn-nav"><i class="fas fa-microphone"></i> الدروس</a>
        <a href="books.html" class="btn-nav"><i class="fas fa-book"></i> الكتب</a>
        <a href="articles.html" class="btn-nav"><i class="fas fa-pen-nib"></i> المقالات</a>
    </nav>

    <div class="container">
        <div class="tafseer-card">
            <h1 class="surah-title">سورة النحل</h1>
            <span class="surah-subtitle">سلسلة دروس التفسير</span>

            <div class="audio-section">
                <div class="audio-title">
                    <i class="fas fa-play-circle" style="color: var(--gold);"></i>
                    الدرس الأول: من الآية 1 إلى الآية 20
                </div>
                <audio controls>
                    <source src="alnahl-6.mp3" type="audio/mpeg">
                    متصفحك لا يدعم تشغيل الصوت.
                </audio>
            </div>

            <a href="tafseer.html" class="back-to-index">
                <i class="fas fa-th-list"></i> العودة لفهرس التفسير العام
            </a>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

</body>
</html>
