<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة النحل - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --gold: #cd950c; --bg: #f4f7f9; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); text-align: center; }
        
        .site-header { padding: 15px; background: #fff; }
        .site-logo { max-width: 600px; width: 100%; mix-blend-mode: multiply; }

        /* شريط التنقل الذهبي بأيقونات أكبر */
        .nav-bar { 
            display: flex; justify-content: center; gap: 12px; padding: 15px; 
            flex-wrap: wrap; background: #f8f9fa; border-bottom: 5px solid var(--gold);
        }
        .btn-nav { 
            min-width: 120px; padding: 12px 18px; border-radius: 10px; font-weight: 700; 
            text-decoration: none; color: white; background: var(--gold);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s; box-shadow: 0 4px 0 #9e7309; font-size: 1rem; /* تكبير الخط والأيقونة */
        }
        .btn-nav i { font-size: 1.2rem; } /* تكبير الأيقونات داخل الأزرار */
        .btn-nav:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #9e7309; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        /* ضبط عنوان السورة */
        .main-surah-title { 
            color: var(--primary); 
            font-weight: 900; 
            font-size: 3rem; /* تصغير العنوان ليكون متوازناً */
            margin: 20px 0 5px;
        }
        .sub-header { color: var(--gold); font-size: 1.4rem; font-weight: bold; margin-bottom: 30px; }

        /* توسيع نطاق الدروس ليتناسب مع عرض الصفحة */
        .lessons-list { 
            display: flex; flex-direction: column;
            gap: 20px; margin-bottom: 40px; 
        }
        .lesson-item {
            background: white; padding: 25px; border-radius: 15px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-right: 10px solid var(--gold);
            transition: 0.3s; flex-wrap: wrap; gap: 20px;
        }
        .lesson-item:hover { border-right-color: var(--primary); background: #fafafa; }
        
        .lesson-info { 
            display: flex; align-items: center; gap: 20px; 
            color: var(--primary); font-weight: 800; font-size: 1.3rem;
            flex: 1; text-align: right;
        }
        .lesson-info i { color: var(--gold); font-size: 1.8rem; } /* تكبير أيقونة الدرس */

        /* مشغل الصوت بعرض مناسب */
        .audio-wrapper { flex: 1; min-width: 300px; }
        audio { width: 100%; height: 45px; border-radius: 30px; background: #f1f3f4; }

        /* الترقيم */
        .pagination { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .page-btn { 
            padding: 12px 22px; background: #fff; border: 2px solid var(--primary); 
            color: var(--primary); cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 1.1rem;
        }
        .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .back-link { 
            display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; 
            color: var(--primary); text-decoration: none; font-weight: bold; font-size: 1.2rem;
        }
        footer { padding: 30px; margin-top: 50px; color: var(--primary); font-weight: bold; border-top: 1px solid #ddd; }

        @media (max-width: 768px) {
            .lesson-item { flex-direction: column; text-align: center; }
            .lesson-info { justify-content: center; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="btn-nav"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="lessons.html" class="btn-nav"><i class="fas fa-microphone"></i> الدروس</a>
        <a href="khutbah.html" class="btn-nav"><i class="fas fa-bullhorn"></i> الخطب</a>
        <a href="books.html" class="btn-nav"><i class="fas fa-book"></i> الكتب</a>
        <a href="articles.html" class="btn-nav"><i class="fas fa-pen-nib"></i> المقالات</a>
    </nav>

    <div class="container">
        <h1 class="main-surah-title">سورة النحل</h1>
        <div class="sub-header">سلسلة دروس التفسير الشاملة</div>

        <div id="lessons-container" class="lessons-list">
            </div>

        <div class="pagination" id="pagination"></div>

        <a href="tafseer.html" class="back-link"><i class="fas fa-arrow-right"></i> العودة لفهرس السور العام</a>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        // مصفوفة الدروس الـ 30
        const lessonsData = [];
        for (let i = 1; i <= 30; i++) {
            lessonsData.push({
                title: `تفسير سورة النحل - الدرس رقم (${i})`,
                file: `audio/alnahl-${i}.mp3` // تأكد من وجود المجلد audio والملفات داخله
            });
        }

        const perPage = 12;
        let currentPage = 1;

        function renderLessons(page) {
            const container = document.getElementById('lessons-container');
            container.innerHTML = "";
            const start = (page - 1) * perPage;
            const end = start + perPage;
            const slice = lessonsData.slice(start, end);

            slice.forEach(lesson => {
                container.innerHTML += `
                    <div class="lesson-item">
                        <div class="lesson-info">
                            <i class="fas fa-play-circle"></i>
                            <span>${lesson.title}</span>
                        </div>
                        <div class="audio-wrapper">
                            <audio controls preload="none">
                                <source src="${lesson.file}" type="audio/mpeg">
                                متصفحك لا يدعم الصوت.
                            </audio>
                        </div>
                    </div>
                `;
            });
            renderNav();
        }

        function renderNav() {
            const nav = document.getElementById('pagination');
            nav.innerHTML = "";
            const total = Math.ceil(lessonsData.length / perPage);
            for (let i = 1; i <= total; i++) {
                nav.innerHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }
        }

        function changePage(p) {
            currentPage = p;
            renderLessons(p);
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        renderLessons(1);
    </script>
</body>
</html>
