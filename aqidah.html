<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس العقيدة والتوحيد - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #eef5ff; 
            --accent-blue: #87ceeb; 
            --dark-blue: #2c5d87;
            --gold-color: #d4af37;
            --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: var(--light-sky); color: #333;
        }

        /* الهيدر الموحد */
        .site-header { text-align: center; padding: 20px; background: var(--header-bg); border-bottom: 4px solid #fff; }
        .site-logo { max-width: 400px; width: 100%; height: auto; mix-blend-mode: multiply; }

        /* شريط التنقل العلوي 3D */
        .main-nav {
            display: flex; justify-content: center; gap: 15px; padding: 15px;
            background: rgba(255, 255, 255, 0.5); flex-wrap: wrap;
        }
        .nav-item-3d {
            padding: 10px 20px; background: var(--accent-blue); color: white; text-decoration: none;
            border-radius: 12px; font-weight: bold; font-size: 1rem;
            box-shadow: 0 5px 0 var(--dark-blue); transition: 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .nav-item-3d:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--dark-blue); background: #9cdfff; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px 50px; }
        .page-title { text-align: center; color: var(--dark-blue); font-weight: 900; margin-bottom: 30px; font-size: 2.2rem; }

        /* الأكورديون المطور */
        .accordion-item { background: white; border-radius: 15px; margin-bottom: 20px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .accordion-header { padding: 25px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-right: 8px solid var(--gold-color); transition: 0.3s; background: #fff; }
        .accordion-header span { font-weight: 900; color: var(--dark-blue); font-size: 1.3rem; display: flex; align-items: center; gap: 12px; }
        .accordion-content { display: none; padding: 20px; background: #fcfdfe; border-top: 1px solid #eee; }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: #f0f8ff; border-right-color: var(--dark-blue); }

        /* صفوف الدروس */
        .lesson-row { 
            background: white; border: 1px solid #edf2f7; border-radius: 12px; 
            padding: 12px 20px; margin-bottom: 10px; display: flex; 
            align-items: center; justify-content: space-between; gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .lesson-info { display: flex; align-items: center; gap: 10px; color: var(--dark-blue); font-weight: 700; min-width: 120px; }
        .audio-player { flex-grow: 1; display: flex; justify-content: center; }
        audio { width: 95%; height: 35px; }
        .btn-download { color: #27ae60; font-size: 1.6rem; transition: 0.3s; padding: 0 10px; }
        .btn-download:hover { transform: scale(1.2); color: var(--dark-blue); }

        /* الترقيم */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .page-num { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; font-weight: bold; background: #fff; border: 2px solid var(--accent-blue); color: var(--dark-blue); }
        .page-num.active { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

        footer { text-align: center; padding: 40px; background: var(--header-bg); color: var(--dark-blue); font-weight: bold; border-top: 4px solid #fff; }

        @media (max-width: 768px) {
            .lesson-row { flex-direction: column; text-align: center; gap: 10px; }
            .audio-player { width: 100%; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <img src="images/logo.png.jpg" alt="المخطوطة الشريفة" class="site-logo">
</header>

<nav class="main-nav">
    <a href="index.html" class="nav-item-3d"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="lessons.html" class="nav-item-3d"><i class="fas fa-microphone"></i> الدروس</a>
    <a href="khutbah.html" class="nav-item-3d"><i class="fas fa-mosque"></i> الخطب</a>
    <a href="books.html" class="nav-item-3d"><i class="fas fa-book"></i> الكتب</a>
</nav>

<div class="container">
    <h1 class="page-title">دروس العقيدة والتوحيد</h1>

    <div class="accordion-item" id="item-tahawiya">
        <div class="accordion-header" onclick="toggleAccordion('tahawiya')">
            <span><i class="fas fa-book-open"></i> شرح العقيدة الطحاوية (21 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div id="tahawiya-list"></div>
            <div class="pagination" id="tahawiya-pagination"></div>
        </div>
    </div>

    <div class="accordion-item" id="item-wastya">
        <div class="accordion-header" onclick="toggleAccordion('wastya')">
            <span><i class="fas fa-landmark"></i> شرح العقيدة الواسطية (26 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div id="wastya-list"></div>
            <div class="pagination" id="wastya-pagination"></div>
        </div>
    </div>

    <div class="accordion-item" id="item-tawheed">
        <div class="accordion-header" onclick="toggleAccordion('tawheed')">
            <span><i class="fas fa-sun"></i> شرح كتاب التوحيد (23 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div id="tawheed-list"></div>
            <div class="pagination" id="tawheed-pagination"></div>
        </div>
    </div>
</div>

<footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

<script>
    const books = {
        tahawiya: { prefix: 'tahawiya', count: 21, currentPage: 1 },
        wastya: { prefix: 'wastya', count: 26, currentPage: 1 },
        tawheed: { prefix: 'tawheed', count: 23, currentPage: 1 }
    };
    const lessonsPerPage = 10;

    function toggleAccordion(bookKey) {
        const item = document.getElementById('item-' + bookKey);
        const isActive = item.classList.contains('active');
        document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
        if (!isActive) { 
            item.classList.add('active'); 
            renderBook(bookKey); 
        }
    }

    function renderBook(key) {
        const book = books[key];
        const listContainer = document.getElementById(key + '-list');
        const pagContainer = document.getElementById(key + '-pagination');
        listContainer.innerHTML = "";
        
        const start = (book.currentPage - 1) * lessonsPerPage;
        const end = Math.min(start + lessonsPerPage, book.count);

        for (let i = start + 1; i <= end; i++) {
            const fileUrl = `audio/${book.prefix}-${i}.mp3`;
            listContainer.innerHTML += `
                <div class="lesson-row">
                    <div class="lesson-info">
                        <span>الدرس ${i}</span>
                    </div>
                    <div class="audio-player">
                        <audio controls preload="none">
                            <source src="${fileUrl}" type="audio/mpeg">
                        </audio>
                    </div>
                    <a href="${fileUrl}" download class="btn-download" title="تحميل الدرس">
                        <i class="fas fa-cloud-download-alt"></i>
                    </a>
                </div>`;
        }
        
        pagContainer.innerHTML = "";
        const pageCount = Math.ceil(book.count / lessonsPerPage);
        if(pageCount > 1) {
            for (let p = 1; p <= pageCount; p++) {
                const btn = document.createElement('div');
                btn.className = `page-num ${p === book.currentPage ? 'active' : ''}`;
                btn.innerText = p;
                btn.onclick = (e) => { 
                    e.stopPropagation(); 
                    book.currentPage = p; 
                    renderBook(key); 
                };
                pagContainer.appendChild(btn);
            }
        }
    }
    window.onload = () => toggleAccordion('tahawiya');
</script>

</body>
</html>
