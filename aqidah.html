<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس العقيدة والتوحيد - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --light-blue: #e3effb; --dark-blue: #2c5d87; --gold: #b59410; --bg-body: #f4f7f9; --green-dl: #27ae60; }
        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: url('library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }

        /* شريط التنقل العلوي الموحد (الأيقونات الكبيرة) */
        .main-nav {
            background: rgba(255, 255, 255, 0.95);
            display: flex; justify-content: center; gap: 40px;
            padding: 20px; border-bottom: 4px solid var(--dark-blue);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000;
        }
        .nav-item {
            text-decoration: none; color: var(--dark-blue);
            font-weight: 900; font-size: 1.1rem;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            transition: 0.3s;
        }
        .nav-item i { font-size: 2.2rem; color: var(--gold); }
        .nav-item:hover { transform: translateY(-5px); color: var(--gold); }

        .site-header { padding: 40px 20px; text-align: center; }
        .site-header h1 { 
            font-size: 2.3rem; color: white; margin: 0; font-weight: 900; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: rgba(44, 93, 135, 0.8); display: inline-block; padding: 10px 40px; border-radius: 50px;
        }

        /* حاوية الأكورديون */
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; padding-bottom: 50px; }

        .accordion-item { background: rgba(255, 255, 255, 0.95); border-radius: 12px; margin-bottom: 25px; border: 1px solid #e2e8f0; overflow: hidden; }
        .accordion-header { padding: 25px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-right: 8px solid var(--gold); transition: 0.3s; }
        .accordion-header span { font-weight: 900; color: var(--dark-blue); font-size: 1.3rem; display: flex; align-items: center; gap: 15px; }
        .accordion-content { display: none; padding: 20px; background: #fff; border-top: 1px solid #eee; }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: var(--light-blue); }

        /* تنسيق الدروس */
        .lesson-row { 
            background: white; border: 1px solid #edf2f7; border-radius: 10px; 
            padding: 12px 20px; margin-bottom: 10px; display: flex; 
            align-items: center; justify-content: space-between;
        }
        .lesson-right { display: flex; align-items: center; gap: 12px; flex: 1; justify-content: flex-end; }
        .lesson-name { color: var(--dark-blue); font-weight: 700; font-size: 1rem; }
        .audio-player { flex: 2; display: flex; justify-content: center; }
        audio { height: 35px; width: 90%; }
        .btn-download { color: var(--green-dl); font-size: 1.5rem; text-decoration: none; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; padding: 10px; }
        .page-num { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; font-weight: bold; color: var(--dark-blue); }
        .page-num.active { background: var(--dark-blue); color: white; }

        footer { text-align: center; color: white; padding: 30px; text-shadow: 1px 1px 3px black; font-weight: bold; }

        @media (max-width: 768px) {
            .main-nav { gap: 15px; }
            .nav-item { font-size: 0.8rem; }
            .nav-item i { font-size: 1.6rem; }
            .lesson-row { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

<nav class="main-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i>الرئيسية</a>
    <a href="lessons.html" class="nav-item"><i class="fas fa-microphone"></i>الدروس</a>
    <a href="khotab.html" class="nav-item"><i class="fas fa-mosque"></i>الخطب</a>
    <a href="articles.html" class="nav-item"><i class="fas fa-pen-nib"></i>المقالات</a>
    <a href="books.html" class="nav-item"><i class="fas fa-book-open"></i>الكتب</a>
</nav>

<header class="site-header">
    <h1>دروس العقيدة والتوحيد</h1>
</header>

<div class="container">
    <div class="accordion-item" id="item-tahawiya">
        <div class="accordion-header" onclick="toggleAccordion('tahawiya')">
            <span><i class="fas fa-book-quran"></i> شرح العقيدة الطحاوية (21 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content"><div id="tahawiya-list"></div><div class="pagination" id="tahawiya-pagination"></div></div>
    </div>

    <div class="accordion-item" id="item-wastya">
        <div class="accordion-header" onclick="toggleAccordion('wastya')">
            <span><i class="fas fa-landmark"></i> شرح العقيدة الواسطية (26 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content"><div id="wastya-list"></div><div class="pagination" id="wastya-pagination"></div></div>
    </div>

    <div class="accordion-item" id="item-tawheed">
        <div class="accordion-header" onclick="toggleAccordion('tawheed')">
            <span><i class="fas fa-sun"></i> شرح كتاب التوحيد (23 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content"><div id="tawheed-list"></div><div class="pagination" id="tawheed-pagination"></div></div>
    </div>
</div>

<script>
    const books = {
        tahawiya: { prefix: 'tahawiya', count: 21, currentPage: 1 },
        wastya: { prefix: 'wastya', count: 26, currentPage: 1 },
        tawheed: { prefix: 'tawheed', count: 23, currentPage: 1 }
    };
    const lessonsPerPage = 10;

    function toggleAccordion(bookKey) {
        const item = document.getElementById('item-' + bookKey);
        const isActive = item.classList.contains('active');
        document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
        if (!isActive) { item.classList.add('active'); renderBook(bookKey); }
    }

    function renderBook(key) {
        const book = books[key];
        const listContainer = document.getElementById(key + '-list');
        const pagContainer = document.getElementById(key + '-pagination');
        listContainer.innerHTML = "";
        const start = (book.currentPage - 1) * lessonsPerPage;
        const end = Math.min(start + lessonsPerPage, book.count);

        for (let i = start + 1; i <= end; i++) {
            const fileUrl = `audio/${book.prefix}-${i}.mp3`;
            listContainer.innerHTML += `
                <div class="lesson-row">
                    <div class="download-side"><a href="${fileUrl}" download class="btn-download"><i class="fas fa-cloud-download-alt"></i></a></div>
                    <div class="audio-player"><audio controls preload="none"><source src="${fileUrl}" type="audio/mpeg"></audio></div>
                    <div class="lesson-right"><span class="lesson-name">الدرس ${i}</span><i class="fas fa-file-audio" style="color:#2c5d87"></i></div>
                </div>`;
        }
        pagContainer.innerHTML = "";
        const pageCount = Math.ceil(book.count / lessonsPerPage);
        for (let p = 1; p <= pageCount; p++) {
            const btn = document.createElement('div');
            btn.className = `page-num ${p === book.currentPage ? 'active' : ''}`;
            btn.innerText = p;
            btn.onclick = (e) => { e.stopPropagation(); book.currentPage = p; renderBook(key); };
            pagContainer.appendChild(btn);
        }
    }
    window.onload = () => toggleAccordion('tahawiya');
</script>

<footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>
</body>
</html>
