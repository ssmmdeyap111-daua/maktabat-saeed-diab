<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس العقيدة - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --light-blue: #e3effb; --dark-blue: #2c5d87; --gold: #b59410; --bg-body: #f8fafc; --green-dl: #27ae60; }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: var(--bg-body); color: #333; }

        /* الهيدر */
        .site-header { background: var(--light-blue); padding: 50px 20px; text-align: center; border-bottom: 5px solid var(--dark-blue); }
        .site-header h1 { font-size: 2.3rem; color: var(--dark-blue); margin: 0; font-weight: 900; }

        /* شريط التنقل */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-3d { padding: 10px 25px; color: var(--dark-blue); text-decoration: none; font-weight: bold; border-radius: 8px; border: 1px solid #ddd; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-3d:hover { background: var(--dark-blue); color: white; }

        /* حاوية الأكورديون الواسعة */
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        .accordion-item { background: white; border-radius: 12px; margin-bottom: 25px; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; }
        .accordion-header { padding: 25px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-right: 8px solid var(--gold); background: #fff; transition: 0.3s; }
        .accordion-header:hover { background: #f8fbff; }
        .accordion-header span { font-weight: 900; color: var(--dark-blue); font-size: 1.4rem; display: flex; align-items: center; gap: 15px; }
        
        .accordion-content { display: none; padding: 20px; background: #fcfdfe; border-top: 1px solid #eee; }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: var(--light-blue); }

        /* تنسيق الدروس الموحد (مثل الفقه والبقرة) */
        .lesson-row { 
            background: white; border: 1px solid #edf2f7; border-radius: 10px; 
            padding: 12px 20px; margin-bottom: 10px; display: flex; 
            align-items: center; justify-content: space-between;
        }
        .lesson-right { display: flex; align-items: center; gap: 12px; flex: 1; justify-content: flex-end; }
        .lesson-name { color: var(--dark-blue); font-weight: 700; font-size: 1.1rem; }
        
        .audio-player { flex: 2; display: flex; justify-content: center; }
        audio { height: 35px; width: 100%; max-width: 400px; }

        .download-side { flex: 0.5; display: flex; justify-content: flex-start; }
        .btn-download { color: var(--green-dl); font-size: 1.5rem; text-decoration: none; }

        /* الترقيم أسفل كل قسم */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; padding: 10px; }
        .page-num { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; font-weight: bold; color: var(--dark-blue); }
        .page-num.active { background: var(--dark-blue); color: white; }

        @media (max-width: 768px) {
            .lesson-row { flex-direction: column; gap: 15px; text-align: center; }
            .audio-player { width: 100%; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>دروس العقيدة والتوحيد</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-3d"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="lessons.html" class="btn-3d"><i class="fas fa-arrow-right"></i> فهرس الدروس</a>
</div>

<div class="container">

    <div class="accordion-item" id="item-tahawiya">
        <div class="accordion-header" onclick="toggleAccordion('tahawiya')">
            <span><i class="fas fa-mosque"></i> شرح العقيدة الطحاوية (21 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div id="tahawiya-list"></div>
            <div class="pagination" id="tahawiya-pagination"></div>
        </div>
    </div>

    <div class="accordion-item" id="item-wastya">
        <div class="accordion-header" onclick="toggleAccordion('wastya')">
            <span><i class="fas fa-landmark"></i> شرح العقيدة الواسطية (26 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div id="wastya-list"></div>
            <div class="pagination" id="wastya-pagination"></div>
        </div>
    </div>

    <div class="accordion-item" id="item-tawheed">
        <div class="accordion-header" onclick="toggleAccordion('tawheed')">
            <span><i class="fas fa-star"></i> شرح كتاب التوحيد (23 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div id="tawheed-list"></div>
            <div class="pagination" id="tawheed-pagination"></div>
        </div>
    </div>

</div>

<script>
    const books = {
        tahawiya: { prefix: 'tahawiya', count: 21, currentPage: 1 },
        wastya: { prefix: 'wastya', count: 26, currentPage: 1 },
        tawheed: { prefix: 'tawheed', count: 23, currentPage: 1 }
    };

    const lessonsPerPage = 10;

    function toggleAccordion(bookKey) {
        const item = document.getElementById('item-' + bookKey);
        const isActive = item.classList.contains('active');
        
        // غلق الكل أولاً
        document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
        
        if (!isActive) {
            item.classList.add('active');
            renderBook(bookKey);
        }
    }

    function renderBook(key) {
        const book = books[key];
        const listContainer = document.getElementById(key + '-list');
        const pagContainer = document.getElementById(key + '-pagination');
        
        listContainer.innerHTML = "";
        const start = (book.currentPage - 1) * lessonsPerPage;
        const end = Math.min(start + lessonsPerPage, book.count);

        for (let i = start + 1; i <= end; i++) {
            const fileUrl = `audio/${book.prefix}-${i}.mp3`;
            listContainer.innerHTML += `
                <div class="lesson-row">
                    <div class="download-side">
                        <a href="${fileUrl}" download class="btn-download"><i class="fas fa-cloud-download-alt"></i></a>
                    </div>
                    <div class="audio-player">
                        <audio controls preload="none"><source src="${fileUrl}" type="audio/mpeg"></audio>
                    </div>
                    <div class="lesson-right">
                        <span class="lesson-name">الدرس ${i}</span>
                        <i class="fas fa-book-open" style="color:#cfd8dc"></i>
                    </div>
                </div>`;
        }

        // إنشاء الترقيم
        pagContainer.innerHTML = "";
        const pageCount = Math.ceil(book.count / lessonsPerPage);
        for (let p = 1; p <= pageCount; p++) {
            const btn = document.createElement('div');
            btn.className = `page-num ${p === book.currentPage ? 'active' : ''}`;
            btn.innerText = p;
            btn.onclick = (e) => {
                e.stopPropagation();
                book.currentPage = p;
                renderBook(key);
            };
            pagContainer.appendChild(btn);
        }
    }

    // فتح أول واحد تلقائياً عند التحميل
    window.onload = () => toggleAccordion('tahawiya');
</script>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>
</body>
</html>
