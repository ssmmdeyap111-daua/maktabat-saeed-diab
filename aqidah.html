<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العقيدة والتوحيد - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #add8e6; --dark-blue: #2c5d87; --accent-blue: #5a9bd5; 
            --gold-color: #c5a03d; 
        }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f4f7f9; color: #333; }

        /* الهيدر */
        .site-header { text-align: center; padding: 15px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 350px; width: 100%; height: auto; mix-blend-mode: multiply; }

        /* شريط العودة */
        .top-nav { background: #fff; padding: 15px; border-bottom: 1px solid #eee; text-align: center; }
        .back-link { 
            text-decoration: none; color: var(--dark-blue); font-weight: bold; 
            display: inline-flex; align-items: center; gap: 8px; 
            padding: 8px 20px; border: 2px solid var(--light-sky); border-radius: 25px;
            transition: 0.2s;
        }
        .back-link:hover { background: var(--light-sky); }

        /* حاوية المحتوى */
        .content-container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .section-box { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        
        .series-title { 
            color: var(--dark-blue); font-size: 1.5rem; margin-bottom: 20px; 
            border-right: 5px solid var(--gold-color); padding-right: 15px;
        }

        /* الجدول الكلاسيكي */
        .lesson-table { width: 100%; border-collapse: collapse; }
        .lesson-table th { background: #f8f9fa; color: var(--dark-blue); padding: 15px; border-bottom: 2px solid var(--light-sky); text-align: center; }
        .lesson-table td { padding: 12px; border-bottom: 1px solid #f0f0f0; text-align: center; font-weight: bold; }
        .lesson-table tr:hover { background: #fcfcfc; }

        .audio-player { width: 260px; height: 35px; }
        .btn-download { color: var(--dark-blue); font-size: 1.4rem; }

        footer { text-align: center; padding: 25px; background: #e0f2f7; font-weight: bold; margin-top: 50px; }

        @media (max-width: 768px) { .audio-player { width: 150px; } }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <div class="top-nav">
        <a href="lessons.html" class="back-link"><i class="fas fa-arrow-right"></i> العودة لصفحة الدروس الرئيسية</a>
    </div>

    <div class="content-container">

        <div class="section-box">
            <h2 class="series-title">شرح العقيدة الطحاوية</h2>
            <table class="lesson-table">
                <thead>
                    <tr><th width="40%">عنوان الدرس</th><th width="45%">الاستماع</th><th width="15%">تحميل</th></tr>
                </thead>
                <tbody>
                    <tr><td>الدرس الأول</td><td><audio controls class="audio-player"><source src="audio/aqidah/tahawiya-1.mp3"></audio></td><td><a href="audio/aqidah/tahawiya-1.mp3" download class="btn-download"><i class="fas fa-download"></i></a></td></tr>
                    <tr><td>الدرس الثاني</td><td><audio controls class="audio-player"><source src="audio/aqidah/tahawiya-2.mp3"></audio></td><td><a href="audio/aqidah/tahawiya-2.mp3" download class="btn-download"><i class="fas fa-download"></i></a></td></tr>
                </tbody>
            </table>
        </div>

        <div class="section-box">
            <h2 class="series-title">شرح العقيدة الواسطية</h2>
            <table class="lesson-table">
                <tbody>
                    <tr><td width="40%">الدرس الأول</td><td width="45%"><audio controls class="audio-player"><source src="audio/aqidah/wasitiya-1.mp3"></audio></td><td width="15%"><a href="#" class="btn-download"><i class="fas fa-download"></i></a></td></tr>
                </tbody>
            </table>
        </div>

        <div class="section-box">
            <h2 class="series-title">شرح كتاب التوحيد</h2>
            <table class="lesson-table">
                <tbody>
                    <tr><td width="40%">الدرس الأول</td><td width="45%"><audio controls class="audio-player"><source src="audio/aqidah/tawheed-1.mp3"></audio></td><td width="15%"><a href="#" class="btn-download"><i class="fas fa-download"></i></a></td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

</body>
</html>
