<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس العقيدة - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --dark-blue: #2c5d87; --gold: #d4af37; --shadow: #5da0bc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); }
        .site-header { text-align: center; padding: 40px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-family: 'Reem Kufi', sans-serif; color: var(--dark-blue); font-size: 2.2rem; }
        .nav-bar { display: flex; justify-content: center; padding: 20px; gap: 15px; }
        .btn-3d { padding: 10px 20px; background: white; border-radius: 12px; text-decoration: none; color: var(--dark-blue); font-weight: bold; box-shadow: 0 4px 0 var(--shadow); transition: 0.1s; display: flex; align-items: center; gap: 8px; }
        .container { max-width: 1000px; margin: 30px auto; padding: 15px; }
        .series-box { background: white; border-radius: 20px; padding: 25px; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-right: 8px solid var(--dark-blue); }
        .series-title { color: var(--dark-blue); font-size: 1.4rem; font-weight: 900; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; display: flex; align-items: center; gap: 12px; }
        .series-title i { color: var(--gold); }
        .lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .lesson-item { background: #f9fbfd; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #edf2f7; }
        audio { height: 28px; width: 140px; }
        .dl-link { color: #27ae60; font-size: 1.1rem; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>دروس العقيدة والتوحيد</h1>
</header>

<div class="nav-bar">
    <a href="lessons.html" class="btn-3d"><i class="fas fa-arrow-right"></i> الفهرس</a>
    <a href="index.html" class="btn-3d"><i class="fas fa-home"></i> الرئيسية</a>
</div>

<div class="container">
    <div class="series-box">
        <div class="series-title"><i class="fas fa-mosque"></i> شرح العقيدة الطحاوية (21 درساً)</div>
        <div class="lessons-grid" id="tahawiya-list"></div>
    </div>

    <div class="series-box">
        <div class="series-title"><i class="fas fa-landmark"></i> شرح العقيدة الواسطية (26 درساً)</div>
        <div class="lessons-grid" id="wasitiya-list"></div>
    </div>

    <div class="series-box">
        <div class="series-title"><i class="fas fa-star"></i> شرح كتاب التوحيد (23 درساً)</div>
        <div class="lessons-grid" id="tawheed-list"></div>
    </div>
</div>

<script>
    function generate(id, prefix, count) {
        const container = document.getElementById(id);
        let html = '';
        for (let i = 1; i <= count; i++) {
            html += `
            <div class="lesson-item">
                <span>الدرس ${i}</span>
                <audio controls preload="none">
                    <source src="audio/${prefix}-${i}.mp3" type="audio/mpeg">
                </audio>
                <a href="audio/${prefix}-${i}.mp3" download class="dl-link"><i class="fas fa-download"></i></a>
            </div>`;
        }
        container.innerHTML = html;
    }

    // توليد الدروس بناءً على الأعداد التي ذكرتها
    generate('tahawiya-list', 'tahawiya', 21);
    generate('wasitiya-list', 'wasitiya', 26);
    generate('tawheed-list', 'tawheed', 23);
</script>

<footer style="text-align: center; padding: 40px; color: #888;">
    جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب الرسمي &copy; 2026
</footer>

</body>
</html>
