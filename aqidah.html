<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس العقيدة - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --accent-blue: #add8e6; --gold: #d4af37; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #fff; }
        .site-header { text-align: center; padding: 20px; background: var(--accent-blue); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 600px; width: 100%; mix-blend-mode: multiply; }
        .main-nav { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .nav-btn-3d { 
            padding: 12px 25px; border-radius: 12px; font-weight: 900; text-decoration: none; color: white; 
            background: var(--primary); box-shadow: 0 6px 0 #1a3a54; transition: 0.2s; min-width: 140px; text-align: center;
        }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .page-title { text-align: center; color: var(--primary); font-weight: 900; font-size: 2rem; margin-bottom: 40px; }
        .accordion-item { background: white; border-radius: 15px; margin-bottom: 15px; border: 2px solid var(--accent-blue); overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .accordion-header { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #fff; border-right: 10px solid var(--gold); }
        .accordion-header span { font-weight: 900; color: var(--primary); font-size: 1.25rem; }
        .accordion-content { display: none; padding: 15px; background: #fcfdfe; border-top: 2px solid var(--accent-blue); }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: #eef7fb; }
        .lesson-row { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .lesson-name { font-weight: 700; color: var(--primary); flex: 2; }
        audio { height: 35px; flex: 4; }
        .btn-dl { color: #1b5e20; font-size: 1.5rem; text-decoration: none; }
        footer { text-align: center; padding: 25px; background: var(--accent-blue); color: var(--primary); font-weight: bold; margin-top: 50px; }
    </style>
</head>
<body>

    <header class="site-header"><img src="images/logo.png.jpg" class="site-logo"></header>

    <nav class="main-nav">
        <a href="index.html" class="nav-btn-3d">الرئيسية</a>
        <a href="lessons.html" class="nav-btn-3d">الصوتيات</a>
    </nav>

    <div class="container">
        <h1 class="page-title">دروس العقيدة والتوحيد</h1>

        <div class="accordion-item" id="sec-wasitya">
            <div class="accordion-header" onclick="toggleSec('wasitya')">
                <span><i class="fas fa-scroll"></i> شرح العقيدة الواسطية</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-content" id="list-wasitya"></div>
        </div>

        <div class="accordion-item" id="sec-tahawiya">
            <div class="accordion-header" onclick="toggleSec('tahawiya')">
                <span><i class="fas fa-book"></i> شرح العقيدة الطحاوية</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-content" id="list-tahawiya"></div>
        </div>

        <div class="accordion-item" id="sec-tawheed">
            <div class="accordion-header" onclick="toggleSec('tawheed')">
                <span><i class="fas fa-sun"></i> شرح كتاب التوحيد</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-content" id="list-tawheed"></div>
        </div>

        <div class="accordion-item" id="sec-gbreel">
            <div class="accordion-header" onclick="toggleSec('gbreel')">
                <span><i class="fas fa-person-praying"></i> شرح حديث جبريل</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-content" id="list-gbreel"></div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        // تحديث الأعداد والأسماء حسب طلبك
        const config = {
            wasitya: { prefix: "wastya", count: 26 },
            tahawiya: { prefix: "tahawiya", count: 21 },
            tawheed: { prefix: "tawheed", count: 23 },
            gbreel: { prefix: "gbreel", count: 13 }
        };

        function toggleSec(id) {
            const item = document.getElementById('sec-' + id);
            item.classList.toggle('active');
            const list = document.getElementById('list-' + id);
            
            if (list.innerHTML === "") {
                let html = "";
                for (let i = 1; i <= config[id].count; i++) {
                    const filePath = `audio/${config[id].prefix}-${i}.mp3`;
                    html += `
                    <div class="lesson-row">
                        <div class="lesson-name">الدرس رقم (${i})</div>
                        <audio controls preload="none"><source src="${filePath}"></audio>
                        <a href="${filePath}" download class="btn-dl"><i class="fas fa-download"></i></a>
                    </div>`;
                }
                list.innerHTML = html;
            }
        }
    </script>
</body>
</html>
