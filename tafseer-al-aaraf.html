<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الأعراف - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #f4f7f9; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
            --prayer-bg: #fdfae7;
        }

        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); color: #333; }

        /* شريط المعلومات العلوي */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; background: var(--prayer-bg); border-bottom: 2px solid var(--accent-blue); font-size: 0.85rem; }
        .date-info { font-weight: 700; color: var(--dark-blue); }
        .prayer-times { display: flex; gap: 8px; }
        .prayer-item { background: #fff; border: 1px solid #ddd; padding: 3px 10px; border-radius: 6px; text-align: center; }
        .prayer-time { font-weight: 900; color: #1b5e20; }

        .site-header { text-align: center; padding: 15px; background: var(--header-bg); border-bottom: 4px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; height: auto; mix-blend-mode: multiply; }

        .main-nav { display: flex; justify-content: center; gap: 8px; padding: 12px; background: #fff; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-item-small {
            padding: 8px 15px; background: var(--accent-blue); color: white; text-decoration: none;
            border-radius: 8px; font-weight: bold; font-size: 0.85rem;
            box-shadow: 0 4px 0 var(--dark-blue); transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .nav-item-small:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--dark-blue); }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px 50px; }
        .page-title { text-align: center; color: var(--dark-blue); font-weight: 900; margin-bottom: 25px; font-size: 1.8rem; border-bottom: 2px solid var(--gold-color); display: inline-block; padding-bottom: 10px; width: 100%; }

        .lesson-row { 
            background: white; border: 1px solid #edf2f7; border-radius: 8px; 
            padding: 10px 15px; margin-bottom: 8px; display: flex; 
            align-items: center; justify-content: space-between; gap: 10px;
        }
        
        .lesson-right { flex: 1.2; display: flex; align-items: center; gap: 8px; color: var(--dark-blue); font-weight: 700; }
        .audio-player { flex: 2; display: flex; justify-content: center; }
        audio { width: 95%; height: 32px; }
        .download-left { flex: 0.5; text-align: left; }
        .btn-download { color: #27ae60; font-size: 1.4rem; text-decoration: none; }

        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 30px; flex-wrap: wrap; }
        .page-num { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 5px; cursor: pointer; font-weight: bold; background: #fff; border: 1px solid #ddd; color: var(--dark-blue); }
        .page-num.active { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

        footer { text-align: center; padding: 30px; background: #e0f2f7; color: var(--dark-blue); font-weight: bold; margin-top: 50px; }

        @media (max-width: 768px) {
            .lesson-row { flex-direction: column; }
            .top-bar { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="date-info" id="hijri-date">جاري التحميل...</div>
    <div class="prayer-times" id="prayers"></div>
</div>

<header class="site-header">
    <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
</header>

<nav class="main-nav">
    <a href="index.html" class="nav-item-small"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="tafseer.html" class="nav-item-small"><i class="fas fa-list-ul"></i> فهرس السور</a>
</nav>

<div class="container">
    <h1 class="page-title">تفسير سورة الأعراف</h1>
    <div id="lessons-container"></div>
    <div class="pagination" id="pagination-container"></div>
</div>

<footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

<script>
    const config = {
        prefix: "al-aaraf",
        total: 41,
        perPage: 12
    };

    let currentPage = 1;

    function renderLessons(page) {
        const container = document.getElementById('lessons-container');
        container.innerHTML = "";
        const start = (page - 1) * config.perPage + 1;
        const end = Math.min(page * config.perPage, config.total);

        for (let i = start; i <= end; i++) {
            // ملاحظة: تأكد أن الملف في مجلد audio مسمى بالضبط al-aaraf-36.mp3
            const fileUrl = `audio/${config.prefix}-${i}.mp3`;
            container.innerHTML += `
                <div class="lesson-row">
                    <div class="lesson-right"><span>الدرس رقم ${i}</span></div>
                    <div class="audio-player">
                        <audio controls preload="none">
                            <source src="${fileUrl}" type="audio/mpeg">
                        </audio>
                    </div>
                    <div class="download-left">
                        <a href="${fileUrl}" download class="btn-download"><i class="fas fa-cloud-arrow-down"></i></a>
                    </div>
                </div>`;
        }
        renderPagination();
    }

    function renderPagination() {
        const container = document.getElementById('pagination-container');
        container.innerHTML = "";
        const totalPages = Math.ceil(config.total / config.perPage);
        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('div');
            btn.className = `page-num ${i === currentPage ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => { currentPage = i; renderLessons(i); window.scrollTo(0,0); };
            container.appendChild(btn);
        }
    }

    // جلب التاريخ والمواقيت
    async function initInfo() {
        const now = new Date();
        document.getElementById('hijri-date').innerText = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now) + " هـ";
        
        try {
            const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
            const d = await res.json();
            const t = d.data.timings;
            const p = [{n:"الفجر",v:t.Fajr}, {n:"الظهر",v:t.Dhuhr}, {n:"العصر",v:t.Asr}, {n:"المغرب",v:t.Maghrib}, {n:"العشاء",v:t.Isha}];
            document.getElementById('prayers').innerHTML = p.map(x => `<div class="prayer-item"><span>${x.n}</span> <span class="prayer-time">${x.v}</span></div>`).join('');
        } catch(e) {}
    }

    window.onload = () => { renderLessons(1); initInfo(); };
</script>
</body>
</html>
