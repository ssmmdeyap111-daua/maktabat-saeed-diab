<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الإسراء - الدرس ١ - الشيخ سعيد دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { margin: 0; font-family: 'Cairo', sans-serif; background-color: #f8fcff; text-align: center; }
        
        /* شريط المواقيت الموحد */
        .top-info-bar { background-color: #fdfae9; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #ddd; }
        .prayer-times { display: flex; gap: 6px; flex-wrap: wrap; }
        .prayer-box { text-align: center; background: #4f814f; color: white; border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; min-width: 60px; }
        .time-val { background: white; color: #4f814f; margin-top: 3px; border-radius: 4px; font-weight: bold; }
        .date-box { background: white; border: 1px solid #c59d31; border-radius: 25px; padding: 7px 20px; color: #333; font-weight: bold; font-size: 0.9rem; }

        /* الهيدر المدمج */
        .site-header { background-color: #e0f2f7; padding: 30px 0; border-bottom: 5px solid #72bcd4; }
        .site-header img { max-width: 600px; width: 90%; height: auto; display: block; margin: 0 auto; mix-blend-mode: multiply; }

        .main-wrapper { max-width: 800px; margin: 50px auto; padding: 0 15px; }
        
        /* كرت الدرس الصوتي */
        .audio-card {
            background: white; border-radius: 20px; padding: 40px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e0f2f7;
        }
        .lesson-badge { background: #c59d31; color: white; padding: 5px 20px; border-radius: 50px; font-weight: bold; margin-bottom: 20px; display: inline-block; }
        .lesson-title { color: #2c5d87; font-weight: 900; font-size: 1.8rem; margin-bottom: 35px; }
        
        audio { width: 100%; max-width: 500px; height: 50px; margin-bottom: 30px; }
        
        .action-btns { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn-action {
            text-decoration: none; padding: 12px 25px; border-radius: 10px; font-weight: bold;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .btn-download { background: #72bcd4; color: white; box-shadow: 0 4px 0 #2c5d87; }
        .btn-download:hover { background: #2c5d87; transform: translateY(-2px); }
        .btn-back { background: #f0f0f0; color: #666; border: 1px solid #ddd; }
        .btn-back:hover { background: #ddd; }

        footer { padding: 45px; background: #222; color: #bbb; margin-top: 80px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <div class="top-info-bar">
        <div class="prayer-times">
            <div class="prayer-box"><div>الفجر</div><div class="time-val">03:26</div></div>
            <div class="prayer-box"><div>الظهر</div><div class="time-val">11:30</div></div>
            <div class="prayer-box"><div>العصر</div><div class="time-val">14:57</div></div>
            <div class="prayer-box"><div>المغرب</div><div class="time-val">18:09</div></div>
            <div class="prayer-box"><div>العشاء</div><div class="time-val">19:39</div></div>
        </div>
        <div class="date-box">الأربعاء | ٢٦ ذو القعدة ١٤٤٧ هـ | ١٣ مايو ٢٠٢٦ م</div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد دياب">
    </header>

    <div class="main-wrapper">
        <div class="audio-card">
            <div class="lesson-badge">تفسير سورة الإسراء</div>
            <h1 class="lesson-title">الدرس الأول</h1>
            
            <audio controls>
                <source src="audio/israa-1.mp3" type="audio/mpeg">
                متصفحك لا يدعم تشغيل الملفات الصوتية.
            </audio>

            <div class="action-btns">
                <a href="audio/israa-1.mp3" download class="btn-action btn-download">
                    <i class="fas fa-download"></i> تحميل الدرس (MP3)
                </a>
                <a href="israa.html" class="btn-action btn-back">
                    <i class="fas fa-arrow-right"></i> العودة لفهرس السورة
                </a>
            </div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>
</body>
</html>
