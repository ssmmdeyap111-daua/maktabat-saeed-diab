<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الإسراء - الشيخ سعيد دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #2c5d87;
            --gold: #c59d31;
            --tafseer-blue: #72bcd4;
            --beige-light: #fdfae9;
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background-color: #f0f4f7; text-align: center; }
        
        /* شريط المعلومات العلوي */
        .top-info-bar { background-color: var(--beige-light); padding: 10px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; flex-wrap: wrap; gap: 10px; }
        .date-box { background: white; border: 1px solid var(--gold); border-radius: 25px; padding: 7px 25px; color: #333; font-weight: bold; font-size: 0.9rem; }
        .prayer-times { display: flex; gap: 6px; flex-wrap: wrap; }
        .prayer-box { text-align: center; background: #4f814f; color: white; border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; min-width: 60px; }
        .time-val { background: white; color: #4f814f; margin-top: 3px; border-radius: 4px; font-weight: bold; }

        .site-header { background-color: #e0f2f7; padding: 30px 0; border-bottom: 5px solid var(--tafseer-blue); }
        .site-header img { max-width: 600px; width: 90%; mix-blend-mode: multiply; margin: 0 auto; display: block; }

        .main-wrapper { max-width: 800px; margin: 40px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .section-title { color: var(--primary); border-bottom: 3px solid var(--gold); display: inline-block; padding-bottom: 5px; margin-bottom: 20px; font-weight: 900; }

        .series-info-box {
            display: inline-block; background: #f9fbfd; padding: 6px 20px; border-radius: 20px;
            font-weight: bold; color: var(--primary); border: 1px solid #eef2f5; margin-bottom: 30px; font-size: 0.95rem;
        }

        /* صندوق القائمة المنسدلة والمشغل */
        .dropdown-container {
            background: #f9fbfd; padding: 25px; border-radius: 12px;
            border: 1px solid #eef2f5; border-top: 4px solid var(--tafseer-blue);
        }
        .dropdown-label { display: block; font-weight: bold; color: var(--primary); margin-bottom: 10px; font-size: 1.1rem; }
        
        .lessons-dropdown {
            width: 100%; padding: 12px; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 1.05rem;
            border: 2px solid #ddd; border-radius: 8px; background-color: white; color: #333; outline: none; cursor: pointer;
            margin-bottom: 20px; text-align: right;
        }
        .lessons-dropdown:focus { border-color: var(--tafseer-blue); }

        .player-box { display: flex; align-items: center; justify-content: center; gap: 20px; background: white; padding: 12px; border-radius: 8px; border: 1px solid #ddd; }
        .player-box audio { flex-grow: 1; height: 38px; width: 100%; }
        .download-icon { color: #28a745; font-size: 1.6rem; text-decoration: none; transition: 0.2s; }
        .download-icon:hover { color: var(--gold); }

        /* أزرار الصفحات السفلية الملونة والموحدة */
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 40px; flex-wrap: wrap; }
        .page-btn {
            cursor: pointer; border: none; padding: 12px 35px; border-radius: 10px;
            font-weight: 900; font-size: 1.1rem; color: white; transition: 0.3s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15); font-family: 'Cairo', sans-serif;
        }
        .page-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,0,0,0.1); }
        
        /* تلوين الصفحات لتتناسق مع ألوان الموقع الثابتة */
        .page-num-1 { background: var(--gold); }
        .page-num-2 { background: var(--tafseer-blue); }
        .page-num-3 { background: #6eb6d1; }

        .page-btn.active { outline: 3px solid var(--primary); outline-offset: 2px; }

        footer { padding: 40px; background-color: var(--beige-light); color: #555; margin-top: 60px; border-top: 1px solid #ddd; font-weight: bold; }
        @media(max-width:768px){
            .player-box { flex-direction: column; }
            .page-btn { width: 100%; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="top-info-bar">
        <div class="date-box" id="live-date">جاري تحميل التاريخ...</div>
        
        <div class="prayer-times">
            <div class="prayer-box"><div>الفجر</div><div class="time-val">03:40</div></div>
            <div class="prayer-box"><div>الظهر</div><div class="time-val">11:55</div></div>
            <div class="prayer-box"><div>العصر</div><div class="time-val">03:32</div></div>
            <div class="prayer-box"><div>المغرب</div><div class="time-val">06:48</div></div>
            <div class="prayer-box"><div>العشاء</div><div class="time-val">08:18</div></div>
        </div>
    </div>

    <header class="site-header"><img src="images/logo.png.jpg" alt="الشيخ سعيد دياب"></header>

    <div class="main-wrapper">
        <h2 class="section-title">تفسير سورة الإسراء</h2>
        <br>
        <div class="series-info-box" id="count-box">جاري حساب الدروس...</div>

        <!-- صندوق القائمة المنسدلة والمشغل الصوتي الموحد -->
        <div class="dropdown-container">
            <label class="dropdown-label" for="israaSelect">اختر الدرس من القائمة المنسدلة:</label>
            <select id="israaSelect" class="lessons-dropdown" onchange="playSelectedLesson()">
                <!-- الخيارات تتغير برمجياً هنا -->
            </select>

            <div class="player-box">
                <audio id="mainAudioPlayer" controls preload="none">
                    <source id="audioSource" src="" type="audio/mpeg">
                </audio>
                <a id="downloadBtn" href="#" download class="download-icon" title="تحميل الدرس الحالي">
                    <i class="fas fa-cloud-download-alt"></i>
                </a>
            </div>
        </div>

        <!-- أزرار الصفحات المقسمة (كل صفحة 10 دروس) -->
        <div class="pagination" id="pagination-controls"></div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        const totalLessons = 30;
        const allFiles = [];
        
        // 💡 تلميح: إذا كانت ملفات الـ MP3 داخل مجلد اسمه audio، اجعلها: `audio/israa-${i}.mp3`
        for(let i = 1; i <= totalLessons; i++) {
            allFiles.push(`israa-${i}.mp3`);
        }

        const itemsPerPage = 10; 
        let currentPage = 1;

        const selectEl = document.getElementById("israaSelect");
        const audioPlayer = document.getElementById("mainAudioPlayer");
        const audioSource = document.getElementById("audioSource");
        const downloadBtn = document.getElementById("downloadBtn");
        const paginationControls = document.getElementById("pagination-controls");

        function renderDropdown() {
            selectEl.innerHTML = "";
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = allFiles.slice(start, end);

            pageItems.forEach((file) => {
                const realIndex = allFiles.indexOf(file);
                const option = document.createElement("option");
                option.value = file; 
                option.innerText = `الدرس رقم ${realIndex + 1}`;
                selectEl.appendChild(option);
            });

            document.getElementById("count-box").innerText = `عرض الدروس من ${start + 1} إلى ${Math.min(end, allFiles.length)} من أصل ${allFiles.length}`;
            
            playSelectedLesson();
            setupPagination();
        }

        function playSelectedLesson() {
            const selectedFile = selectEl.value;
            if (selectedFile) {
                // تحديث السورس والمشغل معاً لضمان العمل على الهواتف والمتصفحات الحديثة
                audioSource.src = selectedFile;
                audioPlayer.src = selectedFile; 
                audioPlayer.load(); 
                downloadBtn.href = selectedFile;
            }
        }

        function setupPagination() {
            paginationControls.innerHTML = "";
            const pageCount = Math.ceil(allFiles.length / itemsPerPage);

            for (let i = 1; i <= pageCount; i++) {
                const btn = document.createElement("button");
                btn.innerText = `الصفحة ${i}`;
                btn.classList.add("page-btn");
                btn.classList.add(`page-num-${i}`); 
                
                if (i === currentPage) btn.classList.add("active");
                
                btn.addEventListener("click", () => {
                    currentPage = i;
                    renderDropdown();
                    window.scrollTo({ top: 350, behavior: 'smooth' });
                });
                paginationControls.appendChild(btn);
            }
        }

        window.onload = () => {
            renderDropdown();
            updateLiveDate();
        };

        function updateLiveDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', calendar: 'gregory' };
            const today = new Date();
            const formatter = new Intl.DateTimeFormat('ar-EG', options);
            document.getElementById('live-date').innerText = formatter.format(today);
        }
    </script>
</body>
</html>
