<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس تفسير القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --blue: #2c5d87; --3d-green: #2ecc71; --dark-green: #27ae60; --gold: #d4af37; --bg: #f4f7f9; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); text-align: center; }
        
        .site-header { padding: 25px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 4px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; height: auto; mix-blend-mode: multiply; }

        .main-nav { display: flex; justify-content: center; gap: 10px; padding: 15px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-item { padding: 8px 20px; background: var(--3d-green); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; box-shadow: 0 4px 0 var(--dark-green); transition: 0.2s; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .page-title { color: var(--blue); font-weight: 900; font-size: 2.2rem; margin-bottom: 40px; border-bottom: 3px solid var(--gold); display: inline-block; padding-bottom: 10px; }

        /* شبكة السور بنظام 3D */
        .surah-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
        }

        .surah-item-3d { 
            background: var(--3d-green); 
            color: white; 
            text-decoration: none; 
            padding: 20px 10px; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 1.2rem;
            box-shadow: 0 6px 0 var(--dark-green); 
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .surah-item-3d:hover { transform: translateY(-3px); box-shadow: 0 9px 0 var(--dark-green); }
        .surah-item-3d:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--dark-green); }

        footer { padding: 40px; background: white; color: var(--blue); font-weight: bold; margin-top: 50px; border-top: 1px solid #eee; }

        @media (max-width: 600px) {
            .surah-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <img src="images/logo.png" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
</header>

<nav class="main-nav">

</nav>

<div class="container">

    <div class="surah-grid">
        <a href="tafseer-fatiha.html" class="surah-item-3d">الفاتحة</a>
        <a href="tafseer-baqara.html" class="surah-item-3d">البقرة</a>
        <a href="tafseer-imran.html" class="surah-item-3d">آل عمران</a>
        <a href="tafseer-al-nesa.html" class="surah-item-3d">النساء</a>
        <a href="tafseer-maeda.html" class="surah-item-3d">المائدة</a>
        <a href="tafseer-anaam.html" class="surah-item-3d">الأنعام</a>
        
        <a href="al-aaraf.html" class="surah-item-3d">الأعراف</a>
        
        <a href="tauba.html" class="surah-item-3d">التوبة</a>
        <a href="yones.html" class="surah-item-3d">يونس</a>
        <a href="hood.html" class="surah-item-3d">هود</a>
        <a href="tafseer-yusef.html" class="surah-item-3d">يوسف</a>
        <a href="tafseer-rad.html" class="surah-item-3d">الرعد</a>
        <a href="tafseer-ibrahim.html" class="surah-item-3d">إبراهيم</a>
        <a href="tafseer-hijr.html" class="surah-item-3d">الحجر</a>
        <a href="tafseer-nahl.html" class="surah-item-3d">النحل</a>
    </div>
</div>

<footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

</body>
</html>
