<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفهرس الشامل - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2c5d87; --accent: #87ceeb; --gold: #d4af37; --bg: #f4f7f9; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); text-align: center; }
        
        .site-header { padding: 25px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; mix-blend-mode: multiply; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        .page-section { margin-bottom: 60px; padding: 20px; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .section-title { color: var(--gold); font-weight: 900; font-size: 1.8rem; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        /* شبكة السور: 6 أعمدة */
        .surah-grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 20px; 
        }

        .surah-item-3d {
            background: #fff; border: 1px solid #ddd; border-radius: 12px;
            padding: 22px 5px; text-decoration: none; color: var(--primary);
            font-weight: 800; font-size: 1.15rem;
            box-shadow: 0 6px 0 #cbd5e0, 0 10px 15px rgba(0,0,0,0.05);
            transition: all 0.2s ease; display: block;
        }

        .surah-item-3d:hover { transform: translateY(2px); box-shadow: 0 4px 0 #cbd5e0; background: #f0f9ff; color: var(--gold); }
        .surah-item-3d:active { transform: translateY(6px); box-shadow: none; }

        footer { padding: 40px; color: var(--primary); font-weight: bold; }

        @media (max-width: 1000px) { .surah-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .surah-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <div class="container">
        <h1 style="color: var(--primary); font-weight: 900; margin-bottom: 40px;">فهرس تفسير القرآن الكريم</h1>

<div class="surah-grid">
    <a href="./al-aaraf.html" class="surah-item-3d">الأعراف</a>
    <a href="./ebrahem.html" class="surah-item-3d">إبراهيم</a>
    <a href="./al-hegr.html" class="surah-item-3d">الحجر</a>
    
    <a href="./fatiha.html" class="surah-item-3d">الفاتحة</a>
    <a href="./baqara.html" class="surah-item-3d">البقرة</a>
    <a href="./yousef.html" class="surah-item-3d">يوسف</a>
</div>
      

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

</body>
</html>
