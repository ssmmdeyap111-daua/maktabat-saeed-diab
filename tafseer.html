<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التفسير</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* ===== صورة القرآن ===== */
.quran-header {
    text-align: center;
    margin: 40px 0;
}

.quran-header img {
    width: 120px;
}

/* ===== شبكة السور ===== */
.tafseer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
    gap: 20px;
    padding: 20px;
    max-width: 900px;
    margin: auto;
}

/* ===== تصميم الأيقونة ===== */
.surah-card {
    text-decoration: none;
    background: linear-gradient(145deg,#ffffff,#e6e6e6);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    font-weight: bold;
    color: #333;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.2),
                -5px -5px 15px rgba(255,255,255,0.7);
    transition: 0.3s;
}

/* تأثير ثلاثي */
.surah-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 25px rgba(0,0,0,0.3);
}

/* رقم السورة */
.surah-number {
    font-size: 13px;
    color: #777;
    margin-bottom: 5px;
}

</style>

</head>
<body>

<!-- ===== صورة القرآن ===== -->
<div class="quran-header">
    <img src="images/quran.png">
</div>

<!-- ===== قائمة السور ===== -->
<div class="tafseer-grid" id="tafseerList"></div>

<script>

const surahs = [

{ name:"الفاتحة", link:"tafseer-fatiha.html" },
{ name:"البقرة", link:"tafseer-baqara.html" },
{ name:"آل عمران", link:"tafseer-aal-imran.html" },
{ name:"النساء", link:"tafseer-nisa.html" },
{ name:"المائدة", link:"tafseer-maidah.html" },
{ name:"الأنعام", link:"tafseer-anaam.html" },
{ name:"الأعراف", link:"tafseer-aaraf.html" },
{ name:"الأنفال", link:"tafseer-anfal.html" },
{ name:"التوبة", link:"tafseer-tawbah.html" },
{ name:"يونس", link:"tafseer-yunus.html" },
{ name:"هود", link:"tafseer-hud.html" },
{ name:"يوسف", link:"tafseer-yusuf.html" }

];

const container = document.getElementById("tafseerList");

surahs.forEach((surah,index) => {

container.innerHTML += `
<a href="${surah.link}" class="surah-card">
<div class="surah-number">سورة ${index + 1}</div>
${surah.name}
</a>
`;

});

</script>

</body>
</html>
