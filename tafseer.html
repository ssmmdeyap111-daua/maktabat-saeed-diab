<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس التفسير - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }
        
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; 
            background: linear-gradient(to bottom, var(--light-sky), #d0e4ff);
            min-height: 100vh;
        }

        /* الهيدر الموحد بالمخطوطة */
        .site-header { text-align: center; padding: 60px 20px 30px; background: var(--header-bg); border-bottom: 4px solid #fff; }
        .site-logo {
            max-width: 500px;
            width: 100%;
            height: auto;
            margin-top: 20px;
            mix-blend-mode: multiply;
        }

        /* شريط التنقل الموحد */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; background: rgba(255,255,255,0.3); }
        .nav-link-3d { 
            padding: 10px 18px; background: var(--accent-blue); color: white; text-decoration: none; 
            border-radius: 12px; font-weight: bold; min-width: 100px; text-align: center;
            box-shadow: 0 5px 0 var(--dark-blue); transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .nav-link-3d:hover { transform: translateY(-2px); background: #9cdfff; }
        .active-link { background: var(--gold-color); box-shadow: 0 5px 0 #b38f2d; }

        /* عنوان القسم */
        .section-title {
            text-align: center; color: var(--dark-blue); font-weight: 900;
            font-size: 2rem; margin: 40px 0 20px; position: relative;
        }
        .section-title::after {
            content: ""; display: block; width: 80px; height: 4px; background: var(--gold-color);
            margin: 10px auto; border-radius: 2px;
        }

        /* شبكة السور */
        .container { 
            max-width: 1200px; margin: 20px auto 60px; 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 20px; padding: 0 20px; 
        }

        .surah-card { 
            background: white; padding: 30px 15px; border-radius: 20px; text-align: center; 
            text-decoration: none; border-bottom: 6px solid var(--gold-color); transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 140px; gap: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }
        .surah-card i { font-size: 2.8rem; color: var(--dark-blue); transition: 0.3s; }
        .surah-card h3 { margin: 0; color: var(--dark-blue); font-size: 1.3rem; font-weight: 800; }
        
        .surah-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 12px 25px rgba(0,0,0,0.1); 
            border-bottom-color: var(--dark-blue);
        }
        .surah-card:hover i { color: var(--gold-color); transform: scale(1.1); }

        footer { text-align: center; padding: 40px; color: var(--dark-blue); font-weight: bold; }

        @media (max-width: 992px) { .container { grid-template-columns: repeat(2, 1fr); } .site-logo { max-width: 350px; } }
        @media (max-width: 480px) { .container { grid-template-columns: 1fr; } .site-logo { max-width: 280px; } }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png" alt="المخطوطة الشريفة - الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="nav-link-3d"><i class="fas fa-home"></i>الرئيسية</a>

        <a href="khutbah.html" class="nav-link-3d"><i class="fas fa-mosque"></i>الخطب</a>
        <a href="articles.html" class="nav-link-3d"><i class="fas fa-pen-nib"></i>المقالات</a>
        <a href="books.html" class="nav-link-3d"><i class="fas fa-book-open"></i>الكتب</a>
    </nav>

    <h2 class="section-title">فهرس تفسير القرآن الكريم</h2>

    <div class="container">
        <a href="tafseer-fatiha.html" class="surah-card"><i class="fas fa-quran"></i><h3>سورة الفاتحة</h3></a>
        <a href="tafseer-baqara.html" class="surah-card"><i class="fas fa-quran"></i><h3>سورة البقرة</h3></a>
        <a href="tafseer-imran.html" class="surah-card"><i class="fas fa-quran"></i><h3>سورة آل عمران</h3></a>
        <a href="tafseer-al-nesa.html" class="surah-card"><i class="fas fa-quran"></i><h3>سورة النساء</h3></a>
        <a href="tafseer-maeda.html" class="surah-card"><i class="fas fa-quran"></i><h3>سورة المائدة</h3></a>
        <a href="tafseer-anaam.html" class="surah-card"><i class="fas fa-quran"></i><h3>سورة الأنعام</h3></a>
        <a href="al-aaraf.html" class="surah-card"><i class="fas fa-quran"></i><h3>سورة الأعراف</h3></a>
        <a href="al-anfal.html" class="surah-card"><i class="fas fa-quran"></i><h3>سورة الأنفال</h3></a>
        <a href="tauba.html" class="surah-card"><i class="fas fa-quran"></i><h3>سورة التوبة</h3></a>
    </div>

    <footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>
</body>
</html>
