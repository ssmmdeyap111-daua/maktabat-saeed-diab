<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس تفسير القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; --light-bg: #f8fafc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-bg); direction: rtl; }
        
        /* الهيدر العلوي */
        .site-header { background: #e3effb; padding: 45px 20px; text-align: center; border-bottom: 5px solid var(--dark-blue); }
        .site-header h1 { margin: 0; color: var(--dark-blue); font-size: 2.3rem; font-weight: 900; }

        /* شريط التنقل */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-link { padding: 10px 20px; border: 2px solid #ddd; border-radius: 10px; text-decoration: none; color: var(--dark-blue); font-weight: bold; transition: 0.3s; }
        .btn-link:hover { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

        /* شبكة السور المربعة */
        .series-grid { 
            max-width: 1100px; margin: 40px auto; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 25px; padding: 0 20px;
        }

        .series-card { 
            background: white; border-radius: 15px; border: 1px solid #eee; 
            padding: 30px 20px; text-align: center; text-decoration: none; 
            transition: 0.3s; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.03);
        }
        .series-card:hover { 
            transform: translateY(-8px); 
            border-color: var(--gold); 
            box-shadow: 0 12px 20px rgba(0,0,0,0.1); 
        }

        .series-card i { font-size: 2.8rem; color: var(--gold); margin-bottom: 15px; }
        .series-card h3 { margin: 10px 0; color: var(--dark-blue); font-size: 1.4rem; font-weight: 800; }
        .series-card .count { 
            background: #f0f4f8; color: var(--dark-blue); 
            padding: 5px 15px; border-radius: 20px; 
            font-size: 0.9rem; font-weight: bold; margin-top: 10px;
        }

        footer { text-align: center; padding: 60px; color: #888; font-weight: bold; }

        /* استجابة الشاشات الصغيرة */
        @media (max-width: 600px) {
            .series-grid { grid-template-columns: 1fr; }
            .site-header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>فهرس تفسير القرآن الكريم</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="books.html" class="btn-link"><i class="fas fa-book"></i> المؤلفات والكتب</a>
</div>

<div class="series-grid">
    
    <a href="tafseer-fatiha.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة الفاتحة</h3>
        <span class="count">درسان</span>
    </a>

    <a href="tafseer-baqara.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة البقرة</h3>
        <span class="count">75 درساً</span>
    </a>

    <a href="tafseer-imran.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة آل عمران</h3>
        <span class="count">52 درساً</span>
    </a>

    <a href="tafseer-al-nesa.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة النساء</h3>
        <span class="count">53 درساً</span>
    </a>

    <a href="tafseer-maeda.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة المائدة</h3>
        <span class="count">34 درساً</span>
    </a>

    <a href="tafseer-anaam.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة الأنعام</h3>
        <span class="count">40 درساً</span>
    </a>

</div>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
