<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس التفسير - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --dark-blue: #2c5d87; --accent-blue: #87ceeb; --gold-color: #d4af37;
            --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #fff; }
        .site-header { text-align: center; padding: 20px; background: var(--header-bg); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 400px; width: 100%; mix-blend-mode: multiply; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; text-align: center; }
        .page-title { color: var(--dark-blue); font-weight: 900; margin-bottom: 30px; font-size: 1.8rem; border-bottom: 2px solid var(--gold-color); display: inline-block; padding-bottom: 5px; }

        /* شبكة الأيقونات 3D الصغيرة */
        .surah-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 20px; 
        }

        /* زر 3D صغير مطابق تماماً لتصميمك المفضل */
        .btn-3d-surah {
            background: #87ceeb; color: white; padding: 15px 10px; border-radius: 12px;
            font-weight: 900; font-size: 1.1rem; text-decoration: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 6px 0 var(--dark-blue); 
            border: 1px solid rgba(255,255,255,0.2); transition: 0.2s;
        }
        .btn-3d-surah:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn-3d-surah:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--dark-blue); }
        .surah-num { font-size: 0.8rem; opacity: 0.9; margin-bottom: 5px; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px; }

        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 50px; }
        .page-link { padding: 10px 18px; background: #fff; border: 2px solid var(--accent-blue); color: var(--dark-blue); text-decoration: none; border-radius: 10px; font-weight: bold; }
        .page-link.active { background: var(--gold-color); border-color: var(--gold-color); color: white; box-shadow: 0 4px 0 #8c6d1a; }
        footer { text-align: center; padding: 25px; background: var(--header-bg); font-weight: bold; margin-top: 50px; }
    </style>
</head>
<body>

    </header>

        <h2 class="page-title">تفسير القرآن الكريم - الصفحة ١</h2>

        <div class="surah-grid">
            <a href="tafseer-fateha.html" class="btn-3d-surah"><span class="surah-num">١</span>الفاتحة</a>
            <a href="tafseer-baqara.html" class="btn-3d-surah"><span class="surah-num">٢</span>البقرة</a>

            <a href="tafseer-nisa.html" class="btn-3d-surah"><span class="surah-num">٤</span>النساء</a>
            <a href="tafseer-maedah.html" class="btn-3d-surah"><span class="surah-num">٥</span>المائدة</a>
            <a href="tafseer-anaam.html" class="btn-3d-surah"><span class="surah-num">٦</span>الأنعام</a>
            <a href="tafseer-araaf.html" class="btn-3d-surah"><span class="surah-num">٧</span>الأعراف</a>
            <a href="tafseer-anfal.html" class="btn-3d-surah"><span class="surah-num">٨</span>الأنفال</a>

            <a href="tafseer-hijr.html" class="btn-3d-surah"><span class="surah-num">١٥</span>الحجر</a>
            <a href="tafseer-nahl.html" class="btn-3d-surah"><span class="surah-num">١٦</span>النحل</a>
            </div>

        <div class="pagination">
