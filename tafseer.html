<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس التفسير الشامل - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #2c5d87; 
            --accent: #add8e6; 
            --gold: #cd950c; /* اللون المطلوب */
            --bg: #f4f7f9; 
        }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); text-align: center; color: #333; }
        
        /* الهيدر العلوي المدمج (التاريخ والمواقيت) */
        .top-info-bar { 
            background: var(--primary); color: weight padding: 10px 0; 
            font-size: 0.85rem; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .dates-flex, .prayer-flex { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .prayer-item { border-left: 1px dashed rgba(255,255,255,0.3); padding-left: 15px; }
        .prayer-item:last-child { border: none; }
        .prayer-item span { color: var(--accent); font-weight: bold; margin-right: 5px; }

        /* شعار الموقع */
        .site-header { padding: 15px; background: #add8e6; }
        .site-logo { max-width: 600px; width: 100%; mix-blend-mode: multiply; }

        /* شريط التنقل الجديد باللون الذهبي المحدد */
        .nav-bar { 
            display: flex; justify-content: center; gap: 10px; padding: 15px; 
            flex-wrap: wrap; background: #f8f9fa; border-top: 1px solid #eee;
        }
        .btn-nav { 
            min-width: 130px; padding: 10px 15px; border-radius: 8px; font-weight: 700; 
            text-decoration: none; color: white; background: var(--gold);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.3s; box-shadow: 0 4px 0 #9e7309;
        }
        .btn-nav:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #9e7309; opacity: 0.9; }

        .container { max-width: 1300px; margin: 30px auto 60px; padding: 0 20px; }
        
        /* شبكة السور 7 أفقياً */
        .surah-grid { 
            display: grid; grid-template-columns: repeat(7, 1fr); 
            gap: 12px; margin: 30px 0;
        }
        .surah-item-3d {
            background: #fff; border: 1px solid #ddd; border-radius: 10px;
            padding: 20px 2px; text-decoration: none; color: var(--primary);
            font-weight: 800; font-size: 1.05rem;
            box-shadow: 0 5px 0 #cbd5e0, 0 8px 12px rgba(0,0,0,0.05);
            transition: all 0.2s ease; display: block;
        }
        .surah-item-3d:hover { transform: translateY(2px); box-shadow: 0 3px 0 #cbd5e0; background: #f0f9ff; color: var(--gold); border-color: var(--gold); }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 40px; }
        .page-btn { 
            padding: 10px 18px; background: #fff; border: 2px solid var(--gold); 
            color: var(--gold); cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s;
        }
        .page-btn.active { background: var(--gold); color: #fff; }

        @media (max-width: 1100px) { .surah-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 700px) { .surah-grid { grid-template-columns: repeat(2, 1fr); } }
        
        footer { padding: 30px; background: #e0f2f7; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-info-bar">
        <div class="dates-flex">
            <div id="hijri-date"><i class="fas fa-moon"></i> جاري التحميل...</div>
            <div id="gregorian-date"><i class="far fa-calendar-alt"></i> </div>
        </div>
        <div class="prayer-flex">
            <div class="prayer-item">الفجر <span id="fajr">-</span></div>
            <div class="prayer-item">الشروق <span id="sunrise">-</span></div>
            <div class="prayer-item">الظهر <span id="dhuhr">-</span></div>
            <div class="prayer-item">العصر <span id="asr">-</span></div>
            <div class="prayer-item">المغرب <span id="maghrib">-</span></div>
            <div class="prayer-item">العشاء <span id="isha">-</span></div>
        </div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="btn-nav"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="lessons.html" class="btn-nav"><i class="fas fa-microphone"></i> الدروس</a>
        <a href="books.html" class="btn-nav"><i class="fas fa-book"></i> الكتب</a>
        <a href="articles.html" class="btn-nav"><i class="fas fa-pen-nib"></i> المقالات</a>
    </nav>

    <div class="container">
        <h1 style="color: var(--primary); font-weight: 900; margin-bottom: 5px;">فهرس دروس التفسير</h1>
        <p style="color: var(--gold); font-weight: bold;">توقيت الدوحة، دولة قطر</p>

        <div id="surah-container" class="surah-grid"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        const allSurahs = [
            {n:"الفاتحة", u:"tafseer-fatiha.html"}, {n:"البقرة", u:"tafseer-baqara.html"}, {n:"آل عمران", u:"tafseer-imran.html"}, {n:"النساء", u:"tafseer-al-nesa.html"}, {n:"المائدة", u:"tafseer-maeda.html"}, {n:"الأنعام", u:"tafseer-anaam.html"}, {n:"الأعراف", u:"tafseer-al-aaraf.html"},
            {n:"الأنفال", u:"al-anfal.html"}, {n:"التوبة", u:"tauba.html"}, {n:"يونس", u:"yones.html"}, {n:"هود", u:"tafseer-hood.html"}, {n:"يوسف", u:"tafseer-yusef.html"}, {n:"الرعد", u:"tafseer-rad.html"}, {n:"إبراهيم", u:"tafseer-ebrahem.html"},
            {n:"الحجر", u:"tafseer-al-hegr.html"}, {n:"النحل", u:"tafseer-alnah.html", audio:"alnahl-6.mp3"}, {n:"الإسراء", u:"tafseer-israa.html"}, {n:"الكهف", u:"tafseer-kahf.html"}, {n:"مريم", u:"tafseer-maryam.html"}, {n:"طه", u:"tafseer-taha.html"}, {n:"الأنبياء", u:"tafseer-anbiya.html"},
            {n:"الحج", u:"tafseer-hajj.html"}, {n:"المؤمنون", u:"tafseer-moamenon.html"}, {n:"النور", u:"tafseer-noor.html"}, {n:"الفرقان", u:"tafseer-forqan.html"}, {n:"الشعراء", u:"tafseer-shoaraa.html"}, {n:"النمل", u:"tafseer-naml.html"}, {n:"القصص", u:"tafseer-qasas.html"},
            {n:"العنكبوت", u:"tafseer-ankabot.html"}, {n:"الروم", u:"tafseer-room.html"}, {n:"لقمان", u:"tafseer-loqman.html"}, {n:"السجدة", u:"tafseer-sajda.html"}, {n:"الأحزاب", u:"tafseer-ahzab.html"}, {n:"سبأ", u:"tafseer-saba.html"}, {n:"فاطر", u:"tafseer-fater.html"},
            {n:"يس", u:"tafseer-yaseen.html"}, {n:"الصافات", u:"tafseer-saffat.html"}, {n:"ص", u:"tafseer-sad.html"}, {n:"الزمر", u:"tafseer-zomar.html"}, {n:"غافر", u:"tafseer-ghafer.html"}, {n:"فصلت", u:"tafseer-fusselat.html"}, {n:"الشورى", u:"tafseer-shora.html"},
            {n:"الزخرف", u:"tafseer-zokhrof.html"}, {n:"الدخان", u:"tafseer-dokhan.html"}, {n:"الجاثية", u:"tafseer-jathiya.html"}, {n:"الأحقاف", u:"tafseer-ahqaf.html"}, {n:"محمد", u:"tafseer-mohammad.html"}, {n:"الفتح", u:"tafseer-fath.html"}, {n:"الحجرات", u:"tafseer-hojorat.html"},
            {n:"ق", u:"tafseer-qaf.html"}, {n:"الذاريات", u:"tafseer-dhariyat.html"}, {n:"الطور", u:"tafseer-toor.html"}, {n:"النجم", u:"tafseer-najm.html"}, {n:"القمر", u:"tafseer-qamar.html"}, {n:"الرحمن", u:"tafseer-rahman.html"}, {n:"الواقعة", u:"tafseer-waqia.html"},
            {n:"الحديد", u:"tafseer-hadeed.html"}, {n:"المجادلة", u:"tafseer-mojadila.html"}, {n:"الحشر", u:"tafseer-hashr.html"}, {n:"الممتحنة", u:"tafseer-momtahina.html"}, {n:"الصف", u:"tafseer-saff.html"}, {n:"الجمعة", u:"tafseer-jomuah.html"}, {n:"المنافقون", u:"tafseer-monafiqon.html"},
            {n:"التغابن", u:"tafseer-taghabon.html"}, {n:"الطلاق", u:"tafseer-talaq.html"}, {n:"التحريم", u:"tafseer-tahreem.html"}, {n:"الملك", u:"tafseer-molk.html"}, {n:"القلم", u:"tafseer-qalam.html"}, {n:"الحاقة", u:"tafseer-haqqa.html"}, {n:"المعارج", u:"tafseer-maarij.html"},
            {n:"نوح", u:"tafseer-nooh.html"}, {n:"الجن", u:"tafseer-jinn.html"}, {n:"المزمل", u:"tafseer-mozammil.html"}, {n:"المدثر", u:"tafseer-modatthir.html"}, {n:"القيامة", u:"tafseer-qiyama.html"}, {n:"الإنسان", u:"tafseer-insan.html"}, {n:"المرسلات", u:"tafseer-morselat.html"},
            {n:"النبأ", u:"tafseer-nabaa.html"}, {n:"النازعات", u:"tafseer-naziat.html"}, {n:"عبس", u:"tafseer-abasa.html"}, {n:"التكوير", u:"tafseer-takweer.html"}, {n:"الانفطار", u:"tafseer-infitar.html"}, {n:"المطففين", u:"tafseer-motaffefin.html"}, {n:"الانشقاق", u:"tafseer-inshiqaq.html"},
            {n:"البروج", u:"tafseer-boroj.html"}, {n:"الطارق", u:"tafseer-tariq.html"}, {n:"الأعلى", u:"tafseer-aala.html"}, {n:"الغاشية", u:"tafseer-ghashiya.html"}, {n:"الفجر", u:"tafseer-fajr.html"}, {n:"البلد", u:"tafseer-balad.html"}, {n:"الشمس", u:"tafseer-shams.html"},
            {n:"الليل", u:"tafseer-layl.html"}, {n:"الضحى", u:"tafseer-doha.html"}, {n:"الشرح", u:"tafseer-sharh.html"}, {n:"التين", u:"tafseer-teen.html"}, {n:"العلق", u:"tafseer-alaq.html"}, {n:"القدر", u:"tafseer-qadr.html"}, {n:"البينة", u:"tafseer-bayyina.html"},
            {n:"الزلزلة", u:"tafseer-zalzala.html"}, {n:"العاديات", u:"tafseer-adiyat.html"}, {n:"القارعة", u:"tafseer-qaria.html"}, {n:"التكاثر", u:"tafseer-takathor.html"}, {n:"العصر", u:"tafseer-asr.html"}, {n:"الهمزة", u:"tafseer-homaza.html"}, {n:"الفيل", u:"tafseer-feel.html"},
            {n:"قريش", u:"tafseer-qoraish.html"}, {n:"الماعون", u:"tafseer-maoon.html"}, {n:"الكوثر", u:"tafseer-kawthar.html"}, {n:"الكافرون", u:"tafseer-kaferon.html"}, {n:"النصر", u:"tafseer-nasr.html"}, {n:"المسد", u:"tafseer-masad.html"}, {n:"الإخلاص", u:"tafseer-ikhlas.html"}, {n:"الفلق", u:"tafseer-falaq.html"}, {n:"الناس", u:"tafseer-nas.html"}
        ];

        const surahsPerPage = 28; 
        let currentPage = 1;

        function displaySurahs(page) {
            const container = document.getElementById('surah-container');
            container.innerHTML = "";
            const start = (page - 1) * surahsPerPage;
            const end = start + surahsPerPage;
            const currentSet = allSurahs.slice(start, end);

            currentSet.forEach(s => {
                container.innerHTML += `<a href="${s.u}" class="surah-item-3d">${s.n}</a>`;
            });
            renderPagination();
        }

        function renderPagination() {
            const nav = document.getElementById('pagination');
            nav.innerHTML = "";
            const totalPages = Math.ceil(allSurahs.length / surahsPerPage);
            for (let i = 1; i <= totalPages; i++) {
                nav.innerHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
        }

        function goToPage(p) {
            currentPage = p;
            displaySurahs(p);
            window.scrollTo({ top: 350, behavior: 'smooth' });
        }

        async function updateQatarInfo() {
            const now = new Date();
            document.getElementById('gregorian-date').innerHTML += now.toLocaleDateString('ar-QA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            try {
                // ضبط الإحداثيات على الدوحة، قطر
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const data = await res.json();
                const d = data.data;
                
                document.getElementById('hijri-date').innerHTML = `<i class="fas fa-moon"></i> ${d.date.hijri.day} ${d.date.hijri.month.ar} ${d.date.hijri.year} هـ`;
                
                document.getElementById('fajr').innerText = d.timings.Fajr;
                document.getElementById('sunrise').innerText = d.timings.Sunrise;
                document.getElementById('dhuhr').innerText = d.timings.Dhuhr;
                document.getElementById('asr').innerText = d.timings.Asr;
                document.getElementById('maghrib').innerText = d.timings.Maghrib;
                document.getElementById('isha').innerText = d.timings.Isha;
            } catch (e) { console.log("Error fetching prayer times"); }
        }

        updateQatarInfo();
        displaySurahs(1);
    </script>
</body>
</html>
