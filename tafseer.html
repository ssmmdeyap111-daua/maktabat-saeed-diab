<!DOCTYPE html>

<title>التفسير - موقع الشيخ سعيد مصطفى دياب</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { font-family: 'Noto Kufi Arabic', sans-serif; background: linear-gradient(to bottom,#eef5ff,#d0e4ff); margin:0; }

.header-bar {
    background: linear-gradient(to right,#3fa1d6,#70c0e8);
    color:white;
    padding:60px 20px;
    text-align:center;
    font-size:28px;
}

/* أيقونات السور ثلاثية الأبعاد */
.icons-container {
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
    margin:50px 0;
}

.icon-box{
    width:180px;
    height:180px;
    background: linear-gradient(145deg, #ffffff, #e6e6e6);
    border-radius: 20px;
    box-shadow: 8px 8px 20px rgba(0,0,0,0.2),
                -8px -8px 20px rgba(255,255,255,0.7);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    transition:0.4s;
    position: relative;
    overflow: hidden;
    animation: floatIcon 3s ease-in-out infinite;
}

.icon-box:hover{
    transform: translateY(-10px);
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
}

.icon-box img{
    width:70px;
    margin-bottom:10px;
    transition:0.4s;
}

.icon-box:hover img{
    transform:scale(1.1);
}

.icon-box span{
    font-size:18px;
    color:#333;
    font-weight:bold;
    text-align:center;
}

@keyframes floatIcon {
    0% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0); }
}

</style>
</head>
