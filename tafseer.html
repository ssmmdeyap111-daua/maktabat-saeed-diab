<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفهرس الشامل لتفسير القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --accent: #87ceeb; --gold: #d4af37; --bg: #f4f7f9; --prayer-bg: #fdfae7; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; background: var(--prayer-bg); border-bottom: 2px solid var(--accent); }
        .site-header { text-align: center; padding: 25px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; mix-blend-mode: multiply; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .page-title { color: var(--primary); font-weight: 900; font-size: 2.2rem; margin-bottom: 30px; border-bottom: 3px solid var(--gold); display: inline-block; padding-bottom: 10px; }

        /* شبكة السور: 6 أعمدة */
        .surah-grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 20px; padding: 20px 0; 
            min-height: 450px;
        }

        .surah-item-3d {
            background: #fff; border: 1px solid #ddd; border-radius: 12px;
            padding: 22px 5px; text-decoration: none; color: var(--primary);
            font-weight: 800; font-size: 1.1rem; position: relative;
            box-shadow: 0 6px 0 #cbd5e0, 0 10px 15px rgba(0,0,0,0.05);
            transition: all 0.2s ease; display: block;
        }

        .surah-item-3d:hover { transform: translateY(2px); box-shadow: 0 4px 0 #cbd5e0; background: #f0f9ff; color: var(--gold); }
        .surah-item-3d:active { transform: translateY(6px); box-shadow: none; }

        /* أزرار التنقل بين الصفحات */
        .pagination { margin: 50px 0; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .page-btn { 
            padding: 12px 25px; background: white; border: 2px solid var(--primary); 
            color: var(--primary); cursor: pointer; border-radius: 10px; font-weight: 900; 
            transition: 0.3s; font-size: 1.1rem;
        }
        .page-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(44,93,135,0.3); }
        .page-btn:hover:not(.active) { background: var(--accent); color: white; border-color: var(--accent); }

        footer { text-align: center; padding: 40px; background: #e0f2f7; color: var(--primary); font-weight: bold; border-top: 2px solid white; margin-top: 50px; }

        @media (max-width: 1000px) { .surah-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 700px) { .surah-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="current-date" style="font-weight: bold; color: var(--primary);"></div>
        <div id="prayer-api" style="font-weight: bold; color: var(--dark-green);"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <div class="container">
        <h1 class="page-title">فهرس تفسير القرآن الكريم</h1>
        
        <div class="surah-grid" id="surahContainer"></div>

        <div class="pagination" id="pagination"></div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        // مصفوفة الـ 114 سورة كاملة
        const allSurahs = [
            {n:"الفاتحة", l:"fatiha.html"}, {n:"البقرة", l:"baqara.html"}, {n:"آل عمران", l:"imran.html"}, {n:"النساء", l:"al-nesa.html"},
            {n:"المائدة", l:"maeda.html"}, {n:"الأنعام", l:"anaam.html"}, {n:"الأعراف", l:"al-aaraf.html"}, {n:"الأنفال", l:"al-anfal.html"},
            {n:"التوبة", l:"tauba.html"}, {n:"يونس", l:"younes.html"}, {n:"هود", l:"hood.html"}, {n:"يوسف", l:"yousef.html"},
            {n:"الرعد", l:"rad.html"}, {n:"إبراهيم", l:"ebrahem.html"}, {n:"الحجر", l:"al-hegr.html"}, {n:"النحل", l:"nahl.html"},
            {n:"الإسراء", l:"israa.html"}, {n:"الكهف", l:"kahf.html"}, {n:"مريم", l:"maryam.html"}, {n:"طه", l:"taha.html"},
            {n:"الأنبياء", l:"anbiya.html"}, {n:"الحج", l:"hajj.html"}, {n:"المؤمنون", l:"moamenon.html"}, {n:"النور", l:"noor.html"},
            {n:"الفرقان", l:"forqan.html"}, {n:"الشعراء", l:"shoaraa.html"}, {n:"النمل", l:"naml.html"}, {n:"القصص", l:"qasas.html"},
            {n:"العنكبوت", l:"ankabot.html"}, {n:"الروم", l:"room.html"}, {n:"لقمان", l:"loqman.html"}, {n:"السجدة", l:"sajda.html"},
            {n:"الأحزاب", l:"ahzab.html"}, {n:"سبأ", l:"saba.html"}, {n:"فاطر", l:"fater.html"}, {n:"يس", l:"yaseen.html"},
            {n:"الصافات", l:"saffat.html"}, {n:"ص", l:"sad.html"}, {n:"الزمر", l:"zomar.html"}, {n:"غافر", l:"ghafer.html"},
            {n:"فصلت", l:"fusselat.html"}, {n:"الشورى", l:"shora.html"}, {n:"الزخرف", l:"zokhrof.html"}, {n:"الدخان", l:"dokhan.html"},
            {n:"الجاثية", l:"jathiya.html"}, {n:"الأحقاف", l:"ahqaf.html"}, {n:"محمد", l:"mohammad.html"}, {n:"الفتح", l:"fath.html"},
            {n:"الحجرات", l:"hojorat.html"}, {n:"ق", l:"qaf.html"}, {n:"الذاريات", l:"dhariyat.html"}, {n:"الطور", l:"toor.html"},
            {n:"النجم", l:"najm.html"}, {n:"القمر", l:"qamar.html"}, {n:"الرحمن", l:"rahman.html"}, {n:"الواقعة", l:"waqia.html"},
            {n:"الحديد", l:"hadeed.html"}, {n:"المجادلة", l:"mojadila.html"}, {n:"الحشر", l:"hashr.html"}, {n:"الممتحنة", l:"momtahina.html"},
            {n:"الصف", l:"saff.html"}, {n:"الجمعة", l:"jomuah.html"}, {n:"المنافقون", l:"monafiqon.html"}, {n:"التغابن", l:"taghabon.html"},
            {n:"الطلاق", l:"talaq.html"}, {n:"التحريم", l:"tahreem.html"}, {n:"الملك", l:"molk.html"}, {n:"القلم", l:"qalam.html"},
            {n:"الحاقة", l:"haqqa.html"}, {n:"المعارج", l:"maarij.html"}, {n:"نوح", l:"nooh.html"}, {n:"الجن", l:"jinn.html"},
            {n:"المزمل", l:"mozammil.html"}, {n:"المدثر", l:"modatthir.html"}, {n:"القيامة", l:"qiyama.html"}, {n:"الإنسان", l:"insan.html"},
            {n:"المرسلات", l:"morselat.html"}, {n:"النبأ", l:"nabaa.html"}, {n:"النازعات", l:"naziat.html"}, {n:"عبس", l:"abasa.html"},
            {n:"التكوير", l:"takweer.html"}, {n:"الانفطار", l:"infitar.html"}, {n:"المطففين", l:"motaffefin.html"}, {n:"الانشقاق", l:"inshiqaq.html"},
            {n:"البروج", l:"boroj.html"}, {n:"الطارق", l:"tariq.html"}, {n:"الأعلى", l:"aala.html"}, {n:"الغاشية", l:"ghashiya.html"},
            {n:"الفجر", l:"fajr.html"}, {n:"البلد", l:"balad.html"}, {n:"الشمس", l:"shams.html"}, {n:"الليل", l:"layl.html"},
            {n:"الضحى", l:"doha.html"}, {n:"الشرح", l:"sharh.html"}, {n:"التين", l:"teen.html"}, {n:"العلق", l:"alaq.html"},
            {n:"القدر", l:"qadr.html"}, {n:"البينة", l:"bayyina.html"}, {n:"الزلزلة", l:"zalzala.html"}, {n:"العاديات", l:"adiyat.html"},
            {n:"القارعة", l:"qaria.html"}, {n:"التكاثر", l:"takathor.html"}, {n:"العصر", l:"asr.html"}, {n:"الهمزة", l:"homaza.html"},
            {n:"الفيل", l:"feel.html"}, {n:"قريش", l:"qoraish.html"}, {n:"الماعون", l:"maoon.html"}, {n:"الكوثر", l:"kawthar.html"},
            {n:"الكافرون", l:"kaferon.html"}, {n:"النصر", l:"nasr.html"}, {n:"المسد", l:"masad.html"}, {n:"الإخلاص", l:"ikhlas.html"},
            {n:"الفلق", l:"falaq.html"}, {n:"الناس", l:"nas.html"}
        ];

        const itemsPerPage = 24;
        let currentPage = 1;

        function displaySurahs(page) {
            const container = document.getElementById('surahContainer');
            container.innerHTML = "";
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = allSurahs.slice(start, end);

            paginatedItems.forEach(s => {
                container.innerHTML += `<a href="${s.l}" class="surah-item-3d">${s.n}</a>`;
            });

            updatePagination();
            window.scrollTo(0, 300);
        }

        function updatePagination() {
            const nav = document.getElementById('pagination');
            nav.innerHTML = "";
            const pageCount = Math.ceil(allSurahs.length / itemsPerPage);

            for (let i = 1; i <= pageCount; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.onclick = () => { currentPage = i; displaySurahs(i); };
                nav.appendChild(btn);
            }
        }

        // التاريخ الهجري
        const now = new Date();
        document.getElementById('current-date').innerText = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now) + " هـ";

        // تشغيل الصفحة الأولى
        displaySurahs(currentPage);
    </script>
</body>
</html>
