<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير القرآن الكريم - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --dark-blue: #2c5d87; --gold: #d4af37; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); }
        .site-header { text-align: center; padding: 40px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-family: 'Reem Kufi', sans-serif; color: var(--dark-blue); font-size: 2.2rem; }
        .nav-bar { display: flex; justify-content: center; padding: 20px; gap: 15px; }
        .btn-3d { padding: 10px 20px; background: white; border-radius: 12px; text-decoration: none; color: var(--dark-blue); font-weight: bold; box-shadow: 0 4px 0 #5da0bc; transition: 0.1s; }
        .container { max-width: 900px; margin: 20px auto; padding: 15px; }

        /* تنسيق القائمة المنسدلة */
        .surah-accordion {
            background: white; border-radius: 12px; margin-bottom: 10px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee;
        }
        .surah-header {
            padding: 20px; background: #fff; cursor: pointer; display: flex;
            justify-content: space-between; align-items: center; transition: 0.3s;
            font-weight: 900; color: var(--dark-blue); font-size: 1.2rem;
        }
        .surah-header:hover { background: #f0faff; }
        .surah-header i.fa-chevron-down { font-size: 0.9rem; transition: 0.3s; }
        
        .surah-content {
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out;
            background: #f9fbfd; border-top: 1px solid #eee;
        }
        .lessons-list { padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
        .lesson-item { 
            background: white; padding: 10px; border-radius: 8px; border: 1px solid #edf2f7;
            display: flex; justify-content: space-between; align-items: center;
        }
        audio { height: 28px; width: 140px; }

        /* حالة الفتح */
        .active .surah-content { max-height: 2000px; padding-bottom: 20px; }
        .active i.fa-chevron-down { transform: rotate(180deg); }
    </style>
</head>
<body>

<header class="site-header">
    <h1>سلاسل تفسير القرآن الكريم</h1>
</header>

<div class="nav-bar">
    <a href="lessons.html" class="btn-3d"><i class="fas fa-arrow-right"></i> الرجوع</a>
    <a href="index.html" class="btn-3d">الرئيسية</a>
</div>

<div class="container">

    <div class="surah-accordion">
        <div class="surah-header" onclick="toggleSurah(this)">
            <span><i class="fas fa-book-open"></i> تفسير سورة الفاتحة</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="surah-content">
            <div class="lessons-list" id="fatiha-list"></div>
        </div>
    </div>

    <div class="surah-accordion">
        <div class="surah-header" onclick="toggleSurah(this)">
            <span><i class="fas fa-book-open"></i> تفسير سورة البقرة</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="surah-content">
            <div class="lessons-list" id="bakara-list"></div>
        </div>
    </div>

    <div class="surah-accordion">
        <div class="surah-header" onclick="toggleSurah(this)">
            <span><i class="fas fa-book-open"></i> تفسير سورة آل عمران</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="surah-content">
            <div class="lessons-list" id="imran-list"></div>
        </div>
    </div>

</div>

<script>
    // وظيفة فتح وإغلاق القوائم
    function toggleSurah(header) {
        header.parentElement.classList.toggle('active');
    }

    // وظيفة توليد الدروس بالأسماء التي حددتها
    function generate(id, prefix, count) {
        const container = document.getElementById(id);
        let html = '';
        for (let i = 1; i <= count; i++) {
            html += `
            <div class="lesson-item">
                <span>درس ${i}</span>
                <audio controls preload="none">
                    <source src="audio/${prefix}-${i}.mp3" type="audio/mpeg">
                </audio>
            </div>`;
        }
        container.innerHTML = html;
    }

    // التنفيذ الفعلي بالأسماء التي ذكرتها:
    generate('fatiha-list', 'fatiha', 2);   // سيبحث عن fatiha-1.mp3, fatiha-2.mp3
    generate('bakara-list', 'bakara', 75); // سيبحث عن bakara-1.mp3 إلى bakara-75.mp3
    generate('imran-list', 'imran', 52);   // سيبحث عن imran-1.mp3 إلى imran-52.mp3
</script>

</body>
</html>
