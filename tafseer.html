<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس التفسير - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --accent: #87ceeb; --gold: #d4af37; --bg: #f4f7f9; --prayer-bg: #fdfae7; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; background: var(--prayer-bg); border-bottom: 2px solid var(--accent); }
        .site-header { text-align: center; padding: 20px; background: linear-gradient(to right, #add8e6, #e0f2f7); }
        .site-logo { max-width: 450px; width: 100%; mix-blend-mode: multiply; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; text-align: center; }
        
        /* شبكة السور ثلاثية الأبعاد المزدحمة لتعرض كل السور */
        .surah-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; padding: 20px 0; 
        }

        .surah-item-3d {
            background: #fff; border: 1px solid #ddd; border-radius: 12px;
            padding: 20px 10px; text-decoration: none; color: var(--primary);
            font-weight: 800; font-size: 1.25rem; position: relative;
            box-shadow: 0 6px 0 #cbd5e0, 0 10px 15px rgba(0,0,0,0.1);
            transition: all 0.2s ease; display: block;
        }

        .surah-item-3d:hover { transform: translateY(2px); box-shadow: 0 4px 0 #cbd5e0, 0 8px 12px rgba(0,0,0,0.1); background: #f0f9ff; }
        .surah-item-3d:active { transform: translateY(6px); box-shadow: none; }

        footer { text-align: center; padding: 40px; background: #e0f2f7; color: var(--primary); font-weight: bold; border-top: 2px solid white; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="current-date" style="font-weight: bold; color: var(--primary);">جاري التحميل...</div>
        <div id="prayer-api"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <div class="container">
        <h1 style="color: var(--primary); font-weight: 900; margin-bottom: 30px;">فهرس تفسير القرآن الكريم</h1>
        
        <div class="surah-grid">
            <a href="fatiha.html" class="surah-item-3d">الفاتحة</a>
            <a href="baqara.html" class="surah-item-3d">البقرة</a>
            <a href="imran.html" class="surah-item-3d">آل عمران</a>
            <a href="al-nesa.html" class="surah-item-3d">النساء</a>
            <a href="maeda.html" class="surah-item-3d">المائدة</a>
            <a href="anaam.html" class="surah-item-3d">الأنعام</a>
            <a href="al-aaraf.html" class="surah-item-3d">الأعراف</a>
            <a href="al-anfal.html" class="surah-item-3d">الأنفال</a>
            <a href="tauba.html" class="surah-item-3d">التوبة</a>
            <a href="younes.html" class="surah-item-3d">يونس</a>
            <a href="hood.html" class="surah-item-3d">هود</a>
            <a href="yousef.html" class="surah-item-3d">يوسف</a>
            <a href="rad.html" class="surah-item-3d">الرعد</a>
            <a href="ebrahem.html" class="surah-item-3d">إبراهيم</a>
            <a href="al-hegr.html" class="surah-item-3d">الحجر</a>
            <a href="nahl.html" class="surah-item-3d">النحل</a>
            <a href="israa.html" class="surah-item-3d">الإسراء</a>
            <a href="kahf.html" class="surah-item-3d">الكهف</a>
            <a href="maryam.html" class="surah-item-3d">مريم</a>
            <a href="taha.html" class="surah-item-3d">طه</a>
            <a href="anbiya.html" class="surah-item-3d">الأنبياء</a>
            <a href="hajj.html" class="surah-item-3d">الحج</a>
            <a href="moamenon.html" class="surah-item-3d">المؤمنون</a>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        // دالة التاريخ والمواقيت الموحدة
        function updateAll() {
            const now = new Date();
            document.getElementById('current-date').innerText = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now) + " هـ";
            
            fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4')
                .then(res => res.json())
                .then(data => {
                    const t = data.data.timings;
                    const p = [{n:"الفجر",v:t.Fajr},{n:"الظهر",v:t.Dhuhr},{n:"العصر",v:t.Asr},{n:"المغرب",v:t.Maghrib},{n:"العشاء",v:t.Isha}];
                    document.getElementById('prayer-api').innerHTML = p.map(x => `<span style="margin:0 5px; font-size:0.8rem;"><b>${x.n}:</b> ${x.v}</span>`).join('');
                }).catch(e => console.log("error"));
        }
        updateAll();
    </script>
</body>
</html>
