<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس تفسير القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --dark-blue: #2c5d87; 
            --gold: #b59410; 
            --light-blue: #e3effb; 
            /* درجة شفافية البطاقات */
            --card-transparent: rgba(255, 255, 255, 0.88); 
        }

        body { 
            margin: 0; 
            font-family: 'Cairo', sans-serif; 
            direction: rtl; 
            /* تطبيق صورة المكتبة كخلفية ثابتة */
            background-image: url('library-bg.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        
        /* الهيدر الشفاف */
        .site-header { 
            background: rgba(227, 239, 251, 0.9); 
            padding: 40px 20px; 
            text-align: center; 
            border-bottom: 5px solid var(--dark-blue); 
            backdrop-filter: blur(5px);
        }
        .site-header h1 { margin: 0; color: var(--dark-blue); font-size: 2.3rem; font-weight: 900; }

        /* شريط التنقل الشفاف */
        .nav-bar { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            padding: 15px; 
            background: rgba(255, 255, 255, 0.8); 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            backdrop-filter: blur(5px);
        }
        .btn-link { 
            padding: 10px 20px; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            text-decoration: none; 
            color: var(--dark-blue); 
            font-weight: bold; 
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            background: white;
        }
        .btn-link:hover { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

        /* شبكة السور المربعة */
        .series-grid { 
            max-width: 1100px; 
            margin: 40px auto; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
            padding: 0 20px;
        }

        /* تنسيق بطاقة السورة الشفافة */
        .series-card { 
            background: var(--card-transparent); 
            border-radius: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            padding: 20px 10px; 
            text-align: center; 
            text-decoration: none; 
            transition: 0.3s; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }
        
        .series-card:hover { 
            transform: translateY(-8px); 
            border-color: var(--gold); 
            background: rgba(255, 255, 255, 0.95);
        }

        /* أيقونة مصغرة ورشيقة */
        .series-card i { font-size: 2.2rem; color: var(--gold); margin-bottom: 12px; }
        .series-card h3 { margin: 8px 0; color: var(--dark-blue); font-size: 1.2rem; font-weight: 800; }
        .series-card .count { 
            background: var(--dark-blue); 
            color: white; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: bold; 
            margin-top: 5px;
        }

        footer { text-align: center; padding: 60px; color: #fff; font-weight: bold; text-shadow: 1px 1px 3px #000; }

        /* للهواتف الذكية */
        @media (max-width: 600px) {
            .series-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .series-card h3 { font-size: 1rem; }
            .site-header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>فهرس تفسير القرآن الكريم</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="lessons.html" class="btn-link"><i class="fas fa-list-ul"></i> فهرس الدروس الشامل</a>
    <a href="books.html" class="btn-link"><i class="fas fa-book"></i> المؤلفات والكتب</a>
</div>

<div class="container">
    <div class="series-grid">
