<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلاسل التفسير - الشيخ سعيد مصطفى دياب الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; --shadow-color: #5da0bc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); }
        .site-header { text-align: center; padding: 40px 20px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-family: 'Reem Kufi', sans-serif; color: var(--dark-blue); font-size: 2.2rem; }
        .nav-bar { display: flex; justify-content: center; padding: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-3d { padding: 10px 20px; background: white; border-radius: 12px; text-decoration: none; color: var(--dark-blue); font-weight: bold; box-shadow: 0 4px 0 var(--shadow-color); transition: 0.1s; }
        .active-btn { background: var(--bright-blue); color: white; box-shadow: 0 4px 0 var(--dark-blue); }
        .container { max-width: 1100px; margin: 20px auto; padding: 15px; }
        .surah-section { background: white; border-radius: 15px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-right: 6px solid #d4af37; }
        .surah-title { color: var(--dark-blue); font-size: 1.4rem; font-weight: 900; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .lesson-card { background: #fdfdfd; border: 1px solid #eee; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        audio { height: 28px; width: 140px; }
        .dl-icon { color: #27ae60; font-size: 1.1rem; }
    </style>
</head>
<body>
    <header class="site-header"><h1>سلاسل تفسير القرآن الكريم</h1></header>
    <div class="nav-bar">
        <a href="index.html" class="btn-3d">الرئيسية</a>
        <a href="lessons.html" class="btn-3d active-btn">رجوع للدروس</a>
    </div>
    <div class="container">
        <div class="surah-section"><div class="surah-title"><i class="fas fa-book-quran"></i> تفسير سورة البقرة (75 درساً)</div><div class="lessons-grid" id="baqarah-list"></div></div>
        <div class="surah-section"><div class="surah-title"><i class="fas fa-book-quran"></i> تفسير سورة آل عمران (52 درساً)</div><div class="lessons-grid" id="imran-list"></div></div>
        <div class="surah-section"><div class="surah-title"><i class="fas fa-book-quran"></i> تفسير سورة النساء (53 درساً)</div><div class="lessons-grid" id="nisa-list"></div></div>
        <div class="surah-section"><div class="surah-title"><i class="fas fa-book-quran"></i> تفسير سورة المائدة (34 درساً)</div><div class="lessons-grid" id="maidah-list"></div></div>
    </div>
    <script>
        function generate(containerId, prefix, count) {
            const container = document.getElementById(containerId);
            let html = '';
            for (let i = 1; i <= count; i++) {
                let num = i < 10 ? '0' + i : i;
                html += `<div class="lesson-card"><span>درس ${num}</span><audio controls preload="none"><source src="audio/tafseer/${prefix}-${num}.mp3"></audio><a href="audio/tafseer/${prefix}-${num}.mp3" download class="dl-icon"><i class="fas fa-download"></i></a></div>`;
            }
            container.innerHTML = html;
        }
        generate('baqarah-list', 'baqarah', 75);
        generate('imran-list', 'imran', 52);
        generate('nisa-list', 'nisa', 53);
        generate('maidah-list', 'maidah', 34);
    </script>
</body>
</html>
