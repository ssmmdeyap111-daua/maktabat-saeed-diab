<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس تفسير القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --dark-blue: #2c5d87; 
            --gold: #b59410; 
            --card-transparent: rgba(255, 255, 255, 0.88); 
        }

        body { 
            margin: 0; 
            font-family: 'Cairo', sans-serif; 
            direction: rtl; 
            /* تم تعديل المسار هنا ليكون داخل مجلد images */
            background: #2c5d87 url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }
        
        .site-header { 
            background: rgba(44, 93, 135, 0.85); 
            padding: 40px 20px; 
            text-align: center; 
            border-bottom: 5px solid var(--gold); 
            backdrop-filter: blur(10px);
        }
        .site-header h1 { margin: 0; color: white; font-size: 2.3rem; font-weight: 900; }

        .nav-bar { 
            display: flex; justify-content: center; gap: 15px; padding: 15px; 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(5px);
        }
        .btn-link { 
            padding: 10px 20px; border: 1px solid #ddd; border-radius: 10px; 
            text-decoration: none; color: var(--dark-blue); font-weight: bold; 
            background: white; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .btn-link:hover { background: var(--dark-blue); color: white; }

        .series-grid { 
            max-width: 1100px; 
            margin: 40px auto; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
            padding: 0 20px;
        }

        .series-card { 
            background: var(--card-transparent); 
            border-radius: 15px; 
            padding: 20px 10px; 
            text-align: center; 
            text-decoration: none; 
            transition: 0.3s; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }
        
        .series-card:hover { transform: translateY(-8px); border: 1px solid var(--gold); }
        .series-card i { font-size: 2.2rem; color: var(--gold); margin-bottom: 12px; }
        .series-card h3 { margin: 8px 0; color: var(--dark-blue); font-size: 1.2rem; font-weight: 800; }
        .series-card .count { 
            background: var(--dark-blue); color: white; 
            padding: 4px 12px; border-radius: 20px; 
            font-size: 0.8rem; font-weight: bold; 
        }

        footer { text-align: center; padding: 60px; color: #fff; font-weight: bold; text-shadow: 1px 1px 3px #000; }

        @media (max-width: 600px) {
            .series-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>فهرس تفسير القرآن الكريم</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="lessons.html" class="btn-link"><i class="fas fa-list-ul"></i> الفهرس العام</a>
    <a href="books.html" class="btn-link"><i class="fas fa-book"></i> المؤلفات</a>
</div>

<div class="series-grid">
    <a href="tafseer-fatiha.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة الفاتحة</h3>
        <span class="count">درسان</span>
    </a>
    <a href="tafseer-baqara.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة البقرة</h3>
        <span class="count">75 درساً</span>
    </a>
    <a href="tafseer-imran.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة آل عمران</h3>
        <span class="count">52 درساً</span>
    </a>
    <a href="tafseer-al-nesa.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة النساء</h3>
        <span class="count">53 درساً</span>
    </a>
    <a href="tafseer-maeda.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة المائدة</h3>
        <span class="count">34 درساً</span>
    </a>
    <a href="tafseer-anaam.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة الأنعام</h3>
        <span class="count">40 درساً</span>
    </a>
    <a href="al-aaraf.html" class="series-card">
        <i class="fas fa-quran"></i>
        <h3>سورة الأعراف</h3>
        <span class="count">41 درساً</span>
    </a>
</div>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
