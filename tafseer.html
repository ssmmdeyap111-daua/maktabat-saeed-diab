<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس التفسير - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #2c5d87; 
            --3d-green: #2ecc71;
            --dark-green: #27ae60;
            --bg: #f4f7f9; 
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); text-align: center; color: #333; }

        /* الهيدر */
        .site-header { 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            padding: 30px 20px; 
            border-bottom: 4px solid #fff; 
        }
        .site-header h1 { margin: 0; color: var(--primary); font-size: 2rem; font-weight: 900; }

        /* شريط التنقل */
        .nav-bar { padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn-home { 
            text-decoration: none; color: var(--primary); font-weight: bold; 
            border: 2px solid var(--primary); padding: 8px 25px; border-radius: 10px; 
            font-size: 0.9rem; transition: 0.3s;
        }
        .btn-home:hover { background: var(--primary); color: white; }

        /* شبكة السور بنمط المستطيلات الخضراء 3D */
        .surah-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; 
            max-width: 1100px; 
            margin: 20px auto; 
            padding: 20px;
        }

        .surah-item-3d { 
            background: var(--3d-green); 
            color: white; 
            text-decoration: none; 
            padding: 18px 10px; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 1.1rem;
            box-shadow: 0 6px 0 var(--dark-green); /* تأثير العمق 3D */
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
        }

        .surah-item-3d:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 0 var(--dark-green);
            background: #2abf69;
        }

        .surah-item-3d:active {
            transform: translateY(3px); 
            box-shadow: 0 2px 0 var(--dark-green);
        }

        footer { padding: 40px; color: var(--primary); font-weight: bold; background: white; margin-top: 50px; border-top: 1px solid #eee; }

        @media (max-width: 768px) {
            .surah-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 10px; }
            .site-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <a href="tafseer-anaam.html" class="surah-item-3d">الأنعام</a>
    <a href="al-aaraf.html" class="surah-card">

</a>
    <a href="tauba.html" class="surah-item-3d">التوبة</a>
