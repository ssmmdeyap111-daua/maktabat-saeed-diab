<head>

    <title>فهرس التفسير - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --gold: #b59410; --white: rgba(255, 255, 255, 0.92); }
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; 
            background: #2c5d87 url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }
        .site-header { 
            background: rgba(255, 255, 255, 0.95); padding: 25px; text-align: center; 
            border-bottom: 4px solid var(--primary); backdrop-filter: blur(5px);
        }
        .nav-bar { 
            display: flex; justify-content: center; gap: 15px; padding: 15px; 
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(5px); border-bottom: 1px solid #ddd;
        }
        .btn-link { 
            padding: 8px 15px; border: 1px solid var(--primary); border-radius: 8px; 
            text-decoration: none; color: var(--primary); font-weight: bold; background: white; transition: 0.3s;
        }
        .container { 
            max-width: 1200px; margin: 40px auto; display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 0 20px; 
        }
        .surah-card { 
            background: var(--white); padding: 30px 15px; border-radius: 15px; text-align: center; 
            text-decoration: none; border: 1px solid #e2e8f0; transition: 0.3s; backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .surah-card:hover { transform: translateY(-5px); border-color: var(--gold); background: #fff; }
        .surah-card i { font-size: 2.5rem; color: var(--gold); margin-bottom: 15px; }
        .surah-card h3 { margin: 0; color: var(--primary); font-size: 1.3rem; font-weight: 800; }
        footer { text-align: center; padding: 40px; color: white; text-shadow: 2px 2px 4px black; font-weight: bold; }
    </style>
</head>
