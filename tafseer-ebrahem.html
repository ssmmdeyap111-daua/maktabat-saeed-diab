<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفسير سورة إبراهيم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f4f7f9; margin: 0; text-align: center; }
        .site-header { padding: 20px; background: #e0f2f7; border-bottom: 4px solid #fff; }
        .site-logo { max-width: 400px; mix-blend-mode: multiply; }
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; }
        .lesson-row { 
            background: white; border-radius: 12px; padding: 15px 25px; margin-bottom: 10px; 
            display: flex; align-items: center; justify-content: space-between; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.05); 
        }
        .lesson-name { font-weight: 800; color: #2c5d87; flex: 1; text-align: right; }
        .audio-player { flex: 2; }
        audio { width: 90%; }
        .btn-nav { 
            display: inline-block; padding: 10px 20px; background: #2c5d87; 
            color: white; text-decoration: none; border-radius: 8px; margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" class="site-logo">
    </header>

    <div class="container">
        <a href="tafseer.html" class="btn-nav">العودة للفهرس</a>
        <h1 style="color: #2c5d87;">تفسير سورة إبراهيم</h1>
        
        <div id="list"></div>
    </div>

    <script>
        const list = document.getElementById('list');
        // تأكد أن عدد الدروس 10 وأنها تبدأ بكلمة ebrahem
        for (let i = 1; i <= 10; i++) {
            const audioPath = `audio/ebrahem-${i}.mp3`;
            list.innerHTML += `
                <div class="lesson-row">
                    <div class="lesson-name">الدرس ${i}</div>
                    <div class="audio-player">
                        <audio controls><source src="${audioPath}" type="audio/mpeg"></audio>
                    </div>
                    <div style="flex:0.3">
                        <a href="${audioPath}" download style="color: #1b5e20; font-size: 1.5rem;"><i class="fas fa-download"></i></a>
                    </div>
                </div>`;
        }
    </script>
</body>
</html>
