<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مكارم الأخلاق - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --sky: #87CEEB; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f0f7fa; }
        .site-header { text-align: center; padding: 20px; background: #add8e6; }
        .site-logo { max-width: 400px; width: 100%; mix-blend-mode: multiply; }
        .container { max-width: 900px; margin: 30px auto; padding: 20px; }
        .lesson-row { background: white; margin-bottom: 10px; padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border-right: 6px solid var(--sky); }
        .pagination { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .page-btn { padding: 8px 15px; border: 2px solid var(--sky); background: white; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .page-btn.active { background: var(--sky); color: white; }
        audio { height: 35px; }
        .back-btn { display: block; width: fit-content; margin: 20px auto; padding: 10px 20px; background: var(--primary); color: white; border-radius: 8px; text-decoration: none; }
    </style>
</head>
<body>
    <header class="site-header"><img src="images/logo.png.jpg" class="site-logo"></header>
    <div class="container">
        <h2 style="text-align:center; color:var(--primary)">سلسلة مكارم الأخلاق</h2>
        <div id="lessons"></div>
        <div class="pagination">
            <button class="page-btn active" onclick="showPage(1)">1</button>
            <button class="page-btn" onclick="showPage(2)">2</button>
            <button class="page-btn" onclick="showPage(3)">3</button>
            <button class="page-btn" onclick="showPage(4)">4</button>
        </div>
        <a href="raqaeq.html" class="back-btn">عودة لقسم الرقائق</a>
    </div>
    <script>
        function showPage(p) {
            const cont = document.getElementById('lessons'); cont.innerHTML = "";
            document.querySelectorAll('.page-btn').forEach((b,i)=> b.classList.toggle('active', i+1===p));
            let start = (p-1)*10+1; let end = p*10;
            for(let i=start; i<=end; i++){
                let file = `audio/mkarem${i}.mp3`;
                cont.innerHTML += `<div class="lesson-row"><span style="font-weight:bold">الدرس ${i}</span><audio controls preload="none"><source src="${file}"></audio><a href="${file}" download style="color:#27ae60; font-size:1.4rem"><i class="fas fa-circle-down"></i></a></div>`;
            }
        }
        window.onload = () => showPage(1);
    </script>
</body>
</html>
