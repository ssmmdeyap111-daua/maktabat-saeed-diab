<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكارم الأخلاق - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --accent-blue: #add8e6; --sky-blue: #87CEEB; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f0f7fa; }

        .site-header { text-align: center; padding: 20px; background: var(--accent-blue); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; mix-blend-mode: multiply; }
        
        .main-nav { display: flex; justify-content: center; gap: 15px; padding: 20px; background: white; }
        .nav-btn-3d { padding: 10px 25px; border-radius: 12px; font-weight: 900; text-decoration: none; color: white; background: var(--primary); box-shadow: 0 5px 0 #1a3a54; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .series-header { text-align: center; background: white; padding: 30px; border-radius: 20px; border-bottom: 5px solid var(--sky-blue); margin-bottom: 30px; }
        .series-title { color: var(--primary); font-weight: 900; font-size: 2rem; margin: 0; }

        /* تنسيق صفوف الدروس */
        .lesson-row { 
            background: white; margin-bottom: 12px; padding: 15px 25px; border-radius: 15px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03); border-right: 8px solid var(--sky-blue);
        }
        .lesson-info { flex: 1; display: flex; align-items: center; gap: 15px; }
        .lesson-number { background: var(--sky-blue); color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        .lesson-text { font-weight: 700; color: var(--primary); }
        audio { height: 35px; flex: 2; }
        .btn-download { color: #2e7d32; font-size: 1.6rem; text-decoration: none; }

        /* تنسيق أرقام الصفحات (Pagination) */
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .page-btn { 
            padding: 10px 18px; background: white; border: 2px solid var(--sky-blue); 
            color: var(--primary); cursor: pointer; border-radius: 8px; font-weight: 900; transition: 0.3s;
        }
        .page-btn.active { background: var(--sky-blue); color: white; }
        .page-btn:hover:not(.active) { background: #e0f2f7; }

        footer { text-align: center; padding: 30px; background: var(--accent-blue); color: var(--primary); font-weight: bold; margin-top: 60px; }
    </style>
</head>
<body>

    <header class="site-header"><img src="images/logo.png.jpg" class="site-logo"></header>

    <nav class="main-nav">
        <a href="index.html" class="nav-btn-3d">الرئيسية</a>
        <a href="raqaeq.html" class="nav-btn-3d" style="background:var(--sky-blue); box-shadow: 0 5px 0 #5f9ea0;">عودة للرقائق</a>
    </nav>

    <div class="container">
        <div class="series-header">
            <h1 class="series-title">سلسلة مكارم الأخلاق</h1>
        </div>

        <div id="lessons-container"></div>

        <div class="pagination">
            <button class="page-btn active" onclick="showPage(1)">1</button>
            <button class="page-btn" onclick="showPage(2)">2</button>
            <button class="page-btn" onclick="showPage(3)">3</button>
            <button class="page-btn" onclick="showPage(4)">4</button>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        const totalLessons = 40;
        const lessonsPerPage = 10;
        const prefix = "mkarem"; // تأكد أن ملفاتك في audio تبدأ بـ mkarem-1.mp3

        function showPage(pageNumber) {
            const container = document.getElementById('lessons-container');
            container.innerHTML = ""; // مسح الدروس الحالية

            // تحديث أزرار الصفحات
            document.querySelectorAll('.page-btn').forEach((btn, index) => {
                btn.classList.toggle('active', index + 1 === pageNumber);
            });

            // حساب النطاق (مثلاً من 1 إلى 10)
            const start = (pageNumber - 1) * lessonsPerPage + 1;
            const end = Math.min(pageNumber * lessonsPerPage, totalLessons);

            let html = "";
            for (let i = start; i <= end; i++) {
                const fileName = `audio/${prefix}-${i}.mp3`;
                html += `
                <div class="lesson-row">
                    <div class="lesson-info">
                        <div class="lesson-number">${i}</div>
                        <div class="lesson-text">الدرس رقم (${i})</div>
                    </div>
                    <audio controls preload="none">
                        <source src="${fileName}" type="audio/mpeg">
                    </audio>
                    <a href="${fileName}" download class="btn-download">
                        <i class="fas fa-circle-down"></i>
                    </a>
                </div>`;
            }
            container.innerHTML = html;
            window.scrollTo(0, 400); // رفع الصفحة قليلاً عند التبديل
        }

        // تشغيل الصفحة الأولى عند الفتح
        window.onload = () => showPage(1);
    </script>
</body>
</html>
