<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس الرقائق - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --bg: #f8fafc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); }
        .site-header { background: white; padding: 20px; text-align: center; border-bottom: 3px solid var(--primary); }
        .container { width: 98%; max-width: 1600px; margin: 20px auto; }
        .lesson-row { display: flex; align-items: center; background: white; margin-bottom: 8px; padding: 15px 30px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .lesson-row:hover { background: #f1f5f9; border-right: 6px solid var(--primary); }
        .lesson-info { flex: 2; font-weight: 700; font-size: 1.2rem; color: #334155; }
        .audio-player { flex: 4; display: flex; justify-content: center; }
        audio { width: 95%; height: 40px; }
        .actions { flex: 1; display: flex; justify-content: flex-end; gap: 20px; }
        .actions a { color: #10b981; font-size: 1.4rem; text-decoration: none; }
        .pagination { display: flex; justify-content: center; margin: 30px; gap: 10px; direction: ltr; }
        .page-btn { padding: 10px 20px; background: white; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .page-btn.active { background: var(--primary); color: white; }
    </style>
</head>
<body>
<header class="site-header">
    <div style="max-width:1400px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
        <a href="raqaaeq.html" style="text-decoration:none; color:var(--primary); font-weight:bold;"><i class="fas fa-chevron-right"></i> عودة لقسم الرقائق</a>
        <h2 id="series-title" style="margin:0; color:var(--primary);">تحميل الدروس...</h2>
        <div style="width:100px;"></div>
    </div>
</header>
<div class="container" id="lesson-list"></div>
<div class="pagination" id="pagination"></div>

<script>
    // --- إعدادات السلسلة (قم بتغييرها لكل ملف) ---
    const count = 40;            // عدد الدروس
    const prefix = "mkarem";   // بريفكس الملف الصوتي
    const ext = "mp3";           // الامتداد (mp3 أو MP3)
    const title = "سلسلة مكارم الأخلاق"; // عنوان الصفحة
    // ------------------------------------------

    document.getElementById('series-title').innerText = title;
    const perPage = 10;
    let currentPage = 1;

    function render(page) {
        const list = document.getElementById('lesson-list');
        list.innerHTML = "";
        let start = (page - 1) * perPage + 1;
        let end = Math.min(start + perPage - 1, count);

        for (let i = start; i <= end; i++) {
            const fileName = `audio/${prefix}-${i}.${ext}`;
            const row = document.createElement('div');
            row.className = 'lesson-row';
            row.innerHTML = `<div class="lesson-info">الدرس رقم ${i}</div>
                <div class="audio-player"><audio controls preload="none"><source src="${fileName}"></audio></div>
                <div class="actions"><a href="${fileName}" download><i class="fas fa-cloud-arrow-down"></i></a></div>`;
            list.appendChild(row);
        }
        renderPagination();
    }

    function renderPagination() {
        const pag = document.getElementById('pagination');
        pag.innerHTML = "";
        const pages = Math.ceil(count / perPage);
        for (let i = 1; i <= pages; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            btn.onclick = () => { currentPage = i; render(i); window.scrollTo(0,0); };
            pag.appendChild(btn);
        }
    }
    render(1);
</script>
</body>
</html>
