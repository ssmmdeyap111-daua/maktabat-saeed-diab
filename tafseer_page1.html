        /* القائمة الرئيسية - مطابقة تماماً لحجم أزرار الرئيسية في صورك */
        .main-navigation { display: flex; justify-content: center; gap: 12px; padding: 20px; flex-wrap: wrap; }

            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #2c5d87;
            transition: 0.2s;
            min-height: 50px;
            border: none;
        }
        .surah-card:hover { background-color: #2c5d87; transform: translateY(-3px); }
    </style>
