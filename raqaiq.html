<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الرقائق - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #eef5ff;
            --main-blue: #add8e6;
            --dark-blue: #2c5d87;
            --accent-blue: #87ceeb;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(to bottom, var(--light-blue), #d0e4ff);
            min-height: 100vh;
            padding-bottom: 120px;
        }

        .site-header { 
            text-align: center; padding: 50px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }

        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .nav-link { 
            padding: 10px 18px; background: var(--accent-blue); color: white; 
            text-decoration: none; border-radius: 10px; font-weight: bold;
            box-shadow: 0 4px 0 #5f9ea0; transition: 0.2s;
        }

        .page-intro { text-align: center; margin: 40px 0; }
        .page-intro h2 { color: var(--dark-blue); font-weight: 700; }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .lesson-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-right: 6px solid #9b59b6; /* لون بنفسجي هادئ للرقائق */
            transition: 0.3s ease;
        }

        .lesson-card h3 { color: var(--dark-blue); margin-bottom: 10px; font-size: 1.2rem; }
        .series-tag { background: #f3e5f5; color: #9b59b6; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        audio { width: 100%; height: 40px; margin: 15px 0; }

        .btn-download {
            display: inline-block; background: var(--accent-blue); color: white;
            padding: 8px 20px; border-radius: 10px; text-decoration: none;
            font-weight: bold; box-shadow: 0 4px 0 #5f9ea0; transition: 0.1s;
        }
        .btn-download:active { transform: translateY(3px); box-shadow: 0 0 0; }

        .back-fixed {
            position: fixed; bottom: 30px; left: 30px;
            width: 60px; height: 60px;
            background: var(--dark-blue); color: white;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            text-decoration: none; font-size: 24px; box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 style="margin:0; color: var(--dark-blue);">الشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">الرئيسية</a>
        <a href="lessons.html" class="nav-link">الدروس</a>
        <a href="articles.html" class="nav-link">المقالات</a>
    </div>

    <div class="page-intro">
        <h2>✨ قسم الرقائق وأعمال القلوب</h2>
        <p style="color: #666;">مواعظ ودروس لترقيق القلوب وتزكية النفوس</p>
    </div>

    <div class="lessons-grid" id="raqaiqContainer">
        </div>

    <a href="lessons.html" class="back-fixed">⬅️</a>

    <script src="raqaiqData.js"></script>
    <script>
        const container = document.getElementById("raqaiqContainer");

        if (typeof raqaiqLessons !== 'undefined') {
            raqaiqLessons.forEach(lesson => {
                container.innerHTML += `
                    <div class="lesson-card">
                        <span class="series-tag">${lesson.series}</span>
                        <h3>${lesson.title}</h3>
                        <p style="font-size: 13px; color: #888;">⏱ المدة: ${lesson.duration}</p>
                        <audio controls>
                            <source src="audio/${lesson.file}" type="audio/mpeg">
                        </audio>
                        <a href="audio/${lesson.file}" download class="btn-download">📥 تحميل الدرس</a>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
