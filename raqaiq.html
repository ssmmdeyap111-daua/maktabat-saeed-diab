<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرقائق والمواعظ - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #eef5ff;
            --main-blue: #add8e6;
            --dark-blue: #2c5d87;
            --accent-blue: #87ceeb;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(to bottom, var(--light-blue), #d0e4ff);
            min-height: 100vh;
            padding-bottom: 120px;
        }

        /* الهيدر الموحد */
        .site-header { 
            text-align: center; padding: 60px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }
        .sheikh-title { font-size: 2.2rem; color: var(--dark-blue); margin: 0; font-weight: 700; }

        /* شريط التنقل العلوي */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; background: rgba(255,255,255,0.2); }
        .nav-link { 
            padding: 10px 18px; background: var(--accent-blue); color: white; 
            text-decoration: none; border-radius: 10px; font-weight: bold;
            box-shadow: 0 4px 0 #5f9ea0; transition: 0.2s;
        }
        .nav-link:hover { transform: translateY(-2px); }

        /* أيقونة القسم وعنوانه */
        .page-intro { text-align: center; margin: 40px 0; }
        .page-intro .icon-box { font-size: 60px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); }
        .page-intro h2 { color: var(--dark-blue); margin-top: 10px; font-weight: 700; }

        /* شبكة دروس الرقائق */
        .raqaiq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .raqaiq-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
            transition: 0.3s ease;
        }

        .raqaiq-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .raqaiq-card h3 { color: var(--dark-blue); font-size: 1.2rem; margin-bottom: 15px; }

        audio { width: 100%; height: 35px; margin-bottom: 15px; }

        .btn-download {
            display: inline-block;
            background: #ffffff;
            color: var(--dark-blue);
            padding: 8px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border: 2px solid var(--main-blue);
            transition: 0.2s;
        }
        .btn-download:hover { background: var(--main-blue); color: white; }

        /* أيقونة العودة الدائرية */
        .back-fixed {
            position: fixed; bottom: 30px; left: 30px;
            width: 65px; height: 65px;
            background: linear-gradient(145deg, #add8e6, #87ceeb);
            color: var(--dark-blue); text-decoration: none;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 28px; box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border: 2px solid #ffffff; transition: 0.3s; z-index: 1000;
        }
        .back-fixed:hover { transform: scale(1.1); }

        footer { text-align: center; padding: 40px; color: var(--dark-blue); font-weight: bold; }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="sheikh-title">الموقع الرسمي للشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">الرئيسية</a>
        <a href="books.html" class="nav-link">الكتب</a>
        <a href="lessons.html" class="nav-link">الدروس</a>
        <a href="khutbah.html" class="nav-link">الخطب</a>
        <a href="articles.html" class="nav-link">المقالات</a>
    </div>

    <div class="page-intro">
        <div class="icon-box">✨</div>
        <h2>الرقائق والمواعظ</h2>
        <p style="color: var(--dark-blue);">دروس إيمانية لتهذيب النفوس وإصلاح القلوب</p>
    </div>

    <div class="raqaiq-grid">
        <div class="raqaiq-card">
            <h3>أعمال القلوب</h3>
            <audio controls>
                <source src="audio/raqaiq1.mp3" type="audio/mpeg">
                متصفحك لا يدعم مشغل الصوت.
            </audio>
            <a href="audio/raqaiq1.mp3" download class="btn-download">📥 تحميل الدرس</a>
        </div>

        <div class="raqaiq-card">
            <h3>الإخلاص والصدق</h3>
            <audio controls>
                <source src="audio/raqaiq2.mp3" type="audio/mpeg">
            </audio>
            <a href="audio/raqaiq2.mp3" download class="btn-download">📥 تحميل الدرس</a>
        </div>

        <div class="raqaiq-card">
            <h3>التوبة النصوح</h3>
            <audio controls>
                <source src="audio/raqaiq3.mp3" type="audio/mpeg">
            </audio>
            <a href="audio/raqaiq3.mp3" download class="btn-download">📥 تحميل الدرس</a>
        </div>
    </div>

    <a href="lessons.html" class="back-fixed" title="العودة للدروس">⬅️</a>

    <footer>
        جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب &copy; 2026
    </footer>

</body>
</html>
