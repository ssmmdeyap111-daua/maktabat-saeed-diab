<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* التعريفات الأساسية */
        :root { 
            --dark-blue: #2c5d87; 
            --gold: #b59410; 
            /* خلفية بديلة في حال لم تفتح الصورة */
            --light-bg: #f8fafc; 
            --success-green: #27ae60; 
            /* لون شفاف للبطاقات */
            --card-transparent: rgba(255, 255, 255, 0.85); 
        }

        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Cairo', sans-serif; 
            color: #333; 
            direction: rtl;
            /* ======================================================== */
            /* تطبيق صورة المكتبة كخلفية كاملة للصفحة */
            /* ======================================================== */
            background-image: url('library-bg.jpg'); /* اسم ملف الصورة الخاصة بك */
            background-size: cover; /* تجعل الصورة تغطي كامل الشاشة */
            background-position: center; /* تمركز الصورة */
            background-attachment: fixed; /* تثبيت الخلفية عند التمرير */
            background-repeat: no-repeat;
            /* ======================================================== */
        }
        
        /* تلوين الهيدر ليكون شفافاً أيضاً */
        .site-header { 
            background: rgba(227, 239, 251, 0.85); 
            padding: 50px 20px; 
            text-align: center; 
            border-bottom: 6px solid var(--dark-blue); 
            backdrop-filter: blur(5px); /* تأثير ضبابي اختياري */
        }
        .site-header h1 { margin: 0; color: var(--dark-blue); font-size: 2.5rem; font-weight: 900; }

        /* شريط التنقل الشفاف */
        .nav-bar { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            padding: 15px; 
            background: rgba(255, 255, 255, 0.8); 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            backdrop-filter: blur(3px);
        }
        .btn-link { padding: 8px 20px; border: 1px solid #ddd; border-radius: 8px; text-decoration: none; color: var(--dark-blue); font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.9); }
        .btn-link:hover { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

        /* حاوية الشريط المتحرك */
        .slider-wrapper { position: relative; max-width: 95%; margin: 40px auto; padding: 0 60px; }

        .books-slider { 
            display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth;
            padding: 20px 5px; scrollbar-width: none;
        }
        .books-slider::-webkit-scrollbar { display: none; }

        /* ======================================================== */
        /* التعديل الجوهري: جعل بطاقة الكتاب شفافة */
        /* ======================================================== */
        .book-card { 
            flex: 0 0 180px; 
            /* استخدام لون شفاف */
            background: var(--card-transparent); 
            border-radius: 12px; 
            border: 1px solid rgba(226, 232, 240, 0.6); 
            padding: 15px; 
            text-align: center; 
            transition: 0.3s;
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.15); /* زيادة الظل للوضوح */
            backdrop-filter: blur(3px); /* تأثير ضبابي خفيف */
        }
        /* ======================================================== */
        
        .book-card:hover { transform: translateY(-8px); border-color: var(--gold); box-shadow: 0 12px 25px rgba(0,0,0,0.25); }

        .book-img { 
            width: 100%; height: 250px; object-fit: contain; 
            background-color: #fff; margin-bottom: 12px;
            border-radius: 4px; border: 1px solid #f0f0f0;
        }

        .book-title { 
            font-weight: 700; color: var(--dark-blue); font-size: 0.95rem; 
            margin-bottom: 15px; line-height: 1.4; height: 45px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .actions { display: flex; flex-direction: column; gap: 8px; }
        
        .btn-read { background: var(--dark-blue); color: white; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
        .btn-dl { background: var(--success-green); color: white; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }

        /* أزرار التنقل الشفافة */
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(44, 93, 135, 0.8); 
            color: white; border: none;
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer;
            z-index: 10; font-size: 1.2rem; transition: 0.3s;
            backdrop-filter: blur(2px);
        }
        .nav-btn:hover { background: var(--gold); }
        .prev { right: 5px; }
        .next { left: 5px; }

        footer { text-align: center; padding: 40px; color: #fff; font-weight: bold; text-shadow: 1px 1px 2px #000; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>المؤلفات والكتب العلمية</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="lessons.html" class="btn-link"><i class="fas fa-list-ul"></i> الفهرس العام</a>
</div>

<div class="slider-wrapper">
    <button class="nav-btn prev" onclick="scrollSlider(300)"><i class="fas fa-chevron-right"></i></button>
    
    <div class="books-slider" id="books-container">
        </div>

    <button class="nav-btn next" onclick="scrollSlider(-300)"><i class="fas fa-chevron-left"></i></button>
</div>

<script>
    // بيانات الكتب (تأكد من مطابقة الأسماء للملفات لديك)
    const books = [
        { name: "الأربعون في الأمثال", img: "al-arbon-veal-amthal.jpg.jpg", pdf: "al-arbon-veal-amthal.pdf" },
        { name: "الاعتبار بطرائف الأخبار", img: "al-eatbaar-ptraef-alakbaar.jpg.jpg", pdf: "al-eatbaar-ptraef-alakbaar.pdf" },
        { name: "الإلمام بالصيام", img: "al-ilmam-siyam.jpg.jpg", pdf: "al-ilmam-siyam.pdf" },
        { name: "الإرشاد", img: "al-irshad.jpg", pdf: "al-irshad.pdf" },
        { name: "اللآلئ والدرر", img: "allaalea-wa-aldorr.jpg.jpg", pdf: "allaalea-wa-aldorr.pdf" },
        { name: "تدبر", img: "tadabor.jpg", pdf: "tadabor.pdf" },
        { name: "أساليب القرآن", img: "asaleeb-alquran.jpg", pdf: "asaleeb-alquran.pdf" },
        { name: "فضل الدعاء", img: "fadhl-duaa.jpg", pdf: "fadhl-duaa.pdf" },
        { name: "إتحاف أهل الرسوخ", img: "ithaf-ahl-alrusoukh.jpg.jpg", pdf: "ithaf-ahl-alrusoukh.pdf" },
        { name: "خبر الآحاد", img: "kabar-al-ahad.jpg.jpg", pdf: "kabar-al-ahad.pdf" },
        { name: "كشف النقاب", img: "kashf-alnqab.jpg.jpg", pdf: "kashf-alnqab.pdf" },
        { name: "قطر الربا", img: "katar-al-reba.jpg.jpg", pdf: "katar-al-reba.pdf" },
        { name: "وقفات تدبرية", img: "waqfat-tdaboria.jpg", pdf: "waqfat-tdaboria.pdf" },
        { name: "معالم التربية", img: "malm-al-trbia.jpg", pdf: "malm-al-trbia.pdf" },
        { name: "تذكير الأبات", img: "tzker-alobat.jpg", pdf: "tzker-alobat.pdf" },
        { name: "أنوار", img: "anwar.jpeg", pdf: "anwar.pdf" },
        { name: "واجب المسلمين", img: "wageb-al-muslmeen.jpg", pdf: "wageb-al-muslmeen.pdf" },
        { name: "السلسبيل", img: "al-slsapel.jpg.jpg", pdf: "al-slsapel.pdf" },
        { name: "شمائل الرسول", img: "shmael-al-rasool.jpg.jpg", pdf: "shmael-al-rasool.pdf" }
    ];

    const container = document.getElementById('books-container');
    
    books.forEach(book => {
        const pdfPath = `pdf/${book.pdf}`;
        const imgPath = `images/${book.img}`;
        
        container.innerHTML += `
            <div class="book-card">
                <img src="${imgPath}" class="book-img" onerror="this.src='https://via.placeholder.com/150x250?text=خطأ+في+الصورة'">
                <div class="book-title">${book.name}</div>
                <div class="actions">
                    <a href="${pdfPath}" target="_blank" class="btn-read">فتح للقراءة</a>
                    <a href="${pdfPath}" download="${book.pdf}" class="btn-dl">تحميل مباشر</a>
                </div>
            </div>
        `;
    });

    function scrollSlider(amount) {
        container.scrollBy({ left: amount, behavior: 'smooth' });
    }
</script>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>
</body>
</html>
