<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root { --gold: #b59410; --primary: #2c5d87; }
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; 
            background: url('library-bg.jpg') no-repeat center center fixed; 
            background-size: cover; overflow-x: hidden;
        }

        /* القائمة العلوية بالأيقونات */
        .main-nav {
            background: rgba(255, 255, 255, 0.9);
            display: flex; justify-content: center; gap: 20px;
            padding: 15px; border-bottom: 3px solid var(--primary);
            backdrop-filter: blur(10px);
        }
        .nav-item {
            text-decoration: none; color: var(--primary);
            font-weight: bold; font-size: 0.9rem;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            transition: 0.3s;
        }
        .nav-item i { font-size: 1.5rem; color: var(--gold); }
        .nav-item:hover { transform: translateY(-3px); color: var(--gold); }

        .slider-section { padding: 40px 0; margin-top: 20px; }
        
        .swiper { width: 98%; padding-bottom: 50px; }

        /* تنسيق الكتاب العائم */
        .book-card {
            display: flex; flex-direction: column; align-items: center;
            transition: 0.4s;
        }
        .book-card img {
            width: 150px; /* حجم الكتاب */
            height: 210px;
            object-fit: cover;
            border-radius: 3px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6); /* ظل الكتاب */
            border: 1px solid rgba(255,255,255,0.1);
        }
        .book-card:hover { transform: scale(1.05); }

        /* أزرار التحميل والقراءة (صغيرة وشفافة) */
        .book-btns {
            margin-top: 10px; display: flex; gap: 5px;
        }
        .btn-action {
            background: rgba(0,0,0,0.7); color: white;
            text-decoration: none; font-size: 0.7rem;
            padding: 4px 10px; border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;
        }
        .btn-action:hover { background: var(--gold); }

        .swiper-button-next, .swiper-button-prev { color: white; transform: scale(0.7); }
    </style>
</head>
<body>

<nav class="main-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i>الرئيسية</a>
    <a href="lessons.html" class="nav-item"><i class="fas fa-microphone"></i>الدروس</a>
    <a href="khotab.html" class="nav-item"><i class="fas fa-mosque"></i>الخطب</a>
    <a href="articles.html" class="nav-item"><i class="fas fa-pen-nib"></i>المقالات</a>
    <a href="books.html" class="nav-item"><i class="fas fa-book-open"></i>الكتب</a>
</nav>

<div class="slider-section">
    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="books-list">
            </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    // تم ضبط الأسماء بناءً على قائمة الملفات التي أرفقتها بدقة
    const books = [
        { title: "أنوار الأذكار", img: "anwar.jpeg", pdf: "anwar.pdf" },
        { title: "تذكير الأباة", img: "tzker-alobat.jpg", pdf: "tazkirat-al-abaha.pdf.pdf" },
        { title: "خطر الربا", img: "katar-al-reba.jpg.jpg", pdf: "katar-al-reba.pdf.pdf" },
        { title: "فضل الدعاء", img: "fadhl-duaa.jpg.jpg", pdf: "fadhl-duaa.pdf.pdf" },
        { title: "معالم التربية", img: "malm-al-trbia.jpg", pdf: "h1.pdf" },
        { title: "وقفات تدبرية", img: "waqfat-tdaboria.jpg", pdf: "ar-alqasas.pdf" },
        { title: "كشف النقاب", img: "kashf-alnqab.jpg.jpg", pdf: "al-irshad.pdf.pdf" },
        { title: "خبر الآحاد", img: "kabar-al-ahad.jpg.jpg", pdf: "kabar-al-ahad.pdf.pdf" },
        { title: "واجب المسلمين", img: "wageb-al-muslmeen.jpg", pdf: "wageb-al-muslmeen.pdf.pdf" },
        { title: "الإلمام بأحكام الصيام", img: "al-ilmam-siyam.jpg.jpg", pdf: "al-ilmam-pahkam.al. siyam.pdf.pdf" },
        { title: "الاعتبار بطرائف الأخبار", img: "al-eatbaar-ptraef-alakbaar.jpg.jpg", pdf: "al-eatbaar-ptraef-alakbaar.pdf.pdf" },
        { title: "تمام المنة", img: "tamam-al-minah.jpg.jpg", pdf: "tamam-al-minah.pdf.pdf" },
        { title: "اللآلئ والدرر", img: "allaalea-wa-aldorr.jpg.jpg", pdf: "allaalea-wa-aldorr.pdf.pdf" },
        { title: "حياة القلوب", img: "haiat-alqolob.jpg.jpg", pdf: "haiat-alqolob.pdf" },
        { title: "السلاسل", img: "al-slsapel.jpg.jpg", pdf: "alslsapel.pdf" },
        { title: "شمائل الرسول", img: "shmael-al-rasool.jpg.jpg", pdf: "shmael-al-rasool.pdf.pdf" },
        { title: "الأربعون", img: "arbauon.jpg", pdf: "h2.pdf" },
        { title: "العقود الفضية", img: "al-uqud-al-fadheya.jpg", pdf: "h3.pdf" },
        { title: "أمثال القرآن", img: "al-arbon-veal-amthal.jpg.jpg", pdf: "al-irshad.pdf.pdf" }
    ];

    const container = document.getElementById('books-list');
    books.forEach(b => {
        container.innerHTML += `
            <div class="swiper-slide">
                <div class="book-card">
                    <img src="${b.img}" alt="${b.title}">
                    <div class="book-btns">
                        <a href="${b.pdf}" target="_blank" class="btn-action">قراءة</a>
                        <a href="${b.pdf}" download class="btn-action">تحميل</a>
                    </div>
                </div>
            </div>`;
    });

    var swiper = new Swiper(".mySwiper", {
        slidesPerView: 2,
        spaceBetween: 5, // فواصل صغيرة جداً كما طلبت
        loop: true,
        navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
        breakpoints: {
            768: { slidesPerView: 5 },
            1024: { slidesPerView: 7 },
            1400: { slidesPerView: 9 }
        }
    });
</script>
</body>
</html>
