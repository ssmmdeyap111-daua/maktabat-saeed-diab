<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; --light-bg: #f8fafc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background-color: var(--light-bg); direction: rtl; }
        
        .site-header { background: #e3effb; padding: 40px 20px; text-align: center; border-bottom: 5px solid var(--dark-blue); }
        .site-header h1 { margin: 0; color: var(--dark-blue); font-size: 2rem; font-weight: 900; }

        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-link { padding: 8px 18px; background: white; border: 1px solid #ddd; border-radius: 8px; text-decoration: none; color: var(--dark-blue); font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .btn-link:hover { background: var(--dark-blue); color: white; }

        /* حاوية الكتب - عرض مكثف جداً */
        .books-grid { 
            max-width: 1200px; 
            margin: 30px auto; 
            display: grid; 
            /* عرض الكتاب 160px ليظهر أكبر عدد ممكن بجانب بعضه */
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
            padding: 0 15px;
        }

        .book-card { 
            background: white; 
            border-radius: 10px; 
            border: 1px solid #e2e8f0; 
            padding: 12px; 
            text-align: center; 
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .book-card:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        .book-icon-box { 
            width: 100%; 
            height: 180px; 
            background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
            border-radius: 6px; 
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            color: var(--dark-blue);
            font-size: 3.5rem;
        }

        .book-title { 
            font-weight: 700; 
            color: var(--dark-blue); 
            font-size: 0.95rem; 
            margin-bottom: 12px;
            line-height: 1.3;
            min-height: 40px;
        }

        .download-book { 
            display: block;
            background: var(--gold); 
            color: white; 
            text-decoration: none; 
            padding: 8px; 
            border-radius: 5px; 
            font-size: 0.85rem; 
            font-weight: bold;
        }
        .download-book:hover { background: var(--dark-blue); }

        footer { text-align: center; padding: 40px; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>المؤلفات والكتب العلمية</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="articles.html" class="btn-link"><i class="fas fa-file-alt"></i> المقالات</a>
</div>

<div class="books-grid" id="books-container">
    </div>

<script>
    // قائمة بأسماء الكتب الـ 15 (يرجى تعديل الأسماء هنا لتطابق كتبك)
    const books = [
        { title: "كتاب 1", file: "book1.pdf" },
        { title: "كتاب 2", file: "book2.pdf" },
        { title: "كتاب 3", file: "book3.pdf" },
        { title: "كتاب 4", file: "book4.pdf" },
        { title: "كتاب 5", file: "book5.pdf" },
        { title: "كتاب 6", file: "book6.pdf" },
        { title: "كتاب 7", file: "book7.pdf" },
        { title: "كتاب 8", file: "book8.pdf" },
        { title: "كتاب 9", file: "book9.pdf" },
        { title: "كتاب 10", file: "book10.pdf" },
        { title: "كتاب 11", file: "book11.pdf" },
        { title: "كتاب 12", file: "book12.pdf" },
        { title: "كتاب 13", file: "book13.pdf" },
        { title: "كتاب 14", file: "book14.pdf" },
        { title: "كتاب 15", file: "book15.pdf" }
    ];

    const container = document.getElementById('books-container');
    books.forEach(book => {
        container.innerHTML += `
            <div class="book-card">
                <div class="book-icon-box"><i class="fas fa-book-reader"></i></div>
                <div class="book-title">${book.title}</div>
                <a href="pdf/${book.file}" class="download-book" download>
                    <i class="fas fa-download"></i> تحميل
                </a>
            </div>
        `;
    });
</script>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
