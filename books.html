<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ - التحميل</title>
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600&family=Noto+Kufi+Arabic:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Kufi Arabic', sans-serif; background: linear-gradient(to bottom, #eef5ff, #d0e4ff); min-height: 100vh; position: relative; padding-bottom: 100px; }
        .header-books { text-align: center; padding: 60px; background: linear-gradient(to right, #70c0e8, #a2d9ff); border-bottom: 4px solid #ffffff; }
        
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; width: 90%; margin: 40px auto; }
        .book-card { background: white; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .book-card img { width: 100%; border-radius: 8px; margin-bottom: 15px; }
        .download-btn { display: inline-block; background: #27ae60; color: white; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 0 #1e8449; }

        /* الأيقونة ثلاثية الأبعاد أسفل اليسار */
        .back-fixed {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #70c0e8, #4aa3d6);
            color: white;
            text-decoration: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 8px 8px 16px #b1c9d4, -4px -4px 10px #ffffff;
            border: 2px solid #ffffff;
            transition: 0.3s;
            z-index: 1000;
        }
        .back-fixed:hover { transform: translateY(-5px) rotate(360deg); box-shadow: 2px 2px 5px #b1c9d4; }

        footer { text-align: center; padding: 30px; background: #3fa1d6; color: white; position: absolute; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div class="header-books"><h1 style="font-family:'Reem Kufi'; color:#1a508b; font-size: 3.5rem;">المكتبة الرسمية</h1></div>
    
    <div class="books-grid">
        <div class="book-card"><img src="images/al-arbon-veal-amthal.jpg.jpg"><span>الأربعون في الأمثال</span><br><br><a href="#" class="download-btn">📥 تحميل الكتاب</a></div>
        <div class="book-card"><img src="images/al-eatbaar-ptraef-alakbaar.jpg.jpg"><span>الاعتبار بطرائف الأخبار</span><br><br><a href="#" class="download-btn">📥 تحميل الكتاب</a></div>
        <div class="book-card"><img src="images/al-ilmam-siyam.jpg.jpg"><span>الإلمام بالصيام</span><br><br><a href="#" class="download-btn">📥 تحميل الكتاب</a></div>
        <div class="book-card"><img src="images/al-irshad.jpg"><span>الإرشاد</span><br><br><a href="#" class="download-btn">📥 تحميل الكتاب</a></div>
    </div>

    <a href="index.html" class="back-fixed" title="الرئيسية">🏠</a>

    <footer>&copy; 2026 جميع الحقوق محفوظة لـ موقع الشيخ سعيد مصطفى دياب</footer>
</body>
</html>
