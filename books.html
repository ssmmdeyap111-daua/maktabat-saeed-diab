<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المؤلفات والكتب - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root { --primary: #2c5d87; --gold: #b59410; }
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; 
            /* خلفية المكتبة ثابتة */
            background: url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }

        .site-header { 
            background: rgba(255, 255, 255, 0.9); padding: 20px; text-align: center; 
            border-bottom: 3px solid var(--primary); backdrop-filter: blur(5px);
        }

        /* شريط الكتب الشفاف */
        .books-section {
            background: rgba(255, 255, 255, 0.15); /* شفافية لإظهار الخلفية */
            backdrop-filter: blur(8px); /* تأثير ضبابي فخم */
            padding: 50px 0;
            margin: 50px 0;
            border-top: 1px solid rgba(255,255,255,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .swiper { width: 95%; padding-bottom: 50px; }

        .book-item {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .book-item:hover { transform: translateY(-10px); }

        /* ضبط حجم الغلاف ليكون كاملاً ومتناسقاً */
        .book-cover {
            width: 100%;
            height: 250px; /* حجم موحد */
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        .book-cover img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* يضمن عدم قص أي جزء من الكتاب */
        }

        /* أزرار التحميل والقراءة */
        .book-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 1px solid #eee;
        }

        .action-btn {
            padding: 10px 5px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
            transition: 0.3s;
        }

        .btn-read { color: var(--primary); background: #f9f9f9; border-left: 1px solid #eee; }
        .btn-down { color: white; background: var(--gold); }
        .action-btn:hover { filter: brightness(0.9); }

        .swiper-button-next, .swiper-button-prev { color: white; }
        footer { text-align: center; color: white; padding: 20px; text-shadow: 1px 1px 3px black; }
    </style>
</head>
<body>

<header class="site-header">
    <h1 style="margin:0; color:var(--primary);">مؤلفات فضيلة الشيخ سعيد مصطفى دياب</h1>
</header>

<div class="books-section">
    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="books-container">
            </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
    </div>
</div>

<footer>جميع الحقوق محفوظة &copy; 2026</footer>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    // قائمة الكتب مع روابطها
    // ملاحظة: استبدل رابط الـ PDF بالرابط الحقيقي لكي يعمل التحميل
    const books = [
        { title: "أنوار الأذكار", img: "images/anwar.jpeg", pdf: "files/anwar.pdf" },
        { title: "تذكير الأباة", img: "images/tzker-alobat.jpg", pdf: "files/tzker.pdf" },
        { title: "خطر الربا", img: "images/katar-al-reba.jpg.jpg", pdf: "files/riba.pdf" },
        { title: "فضل الدعاء", img: "images/fadhl-duaa.jpg", pdf: "files/duaa.pdf" },
        { title: "معالم التربية", img: "images/malm-al-trbia.jpg", pdf: "files/trbia.pdf" },
        { title: "وقفات تدبرية", img: "images/waqfat-tdaboria.jpg", pdf: "files/waqfat.pdf" },
        { title: "كشف النقاب", img: "images/kashf-alnqab.jpg.jpg", pdf: "files/kashf.pdf" },
        { title: "خبر الآحاد", img: "images/kabar-al-ahad.jpg.jpg", pdf: "files/ahad.pdf" }
    ];

    const container = document.getElementById('books-container');

    books.forEach(book => {
        container.innerHTML += `
            <div class="swiper-slide">
                <div class="book-item">
                    <div class="book-cover">
                        <img src="${book.img}" alt="${book.title}">
                    </div>
                    <div class="book-actions">
                        <a href="${book.pdf}" target="_blank" class="action-btn btn-read">قراءة</a>
                        <a href="${book.pdf}" download class="action-btn btn-down"><i class="fas fa-download"></i> تحميل</a>
                    </div>
                </div>
            </div>`;
    });

    var swiper = new Swiper(".mySwiper", {
        slidesPerView: 2,
        spaceBetween: 20,
        navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
        breakpoints: {
            768: { slidesPerView: 4 },
            1200: { slidesPerView: 7 } // عرض 7 كتب كما في الصورة
        }
    });
</script>
</body>
</html>
