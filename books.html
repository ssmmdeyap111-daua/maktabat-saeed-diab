<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; }
        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: #f4f7f9 url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover; overflow-x: hidden;
        }

        .main-nav {
            background: white !important; display: flex; justify-content: center; gap: 40px;
            padding: 15px 0; border-bottom: 4px solid var(--dark-blue);
            position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
        }
        .nav-item {
            text-decoration: none; color: var(--dark-blue); font-weight: 900;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .nav-item i { font-size: 2rem; color: var(--gold); }

        .header-box { margin-top: 130px; text-align: center; margin-bottom: 50px; }
        .header-box h1 {
            background: var(--dark-blue); color: white; display: inline-block;
            padding: 12px 50px; border-radius: 50px; font-size: 2.2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* تنسيق السلايدر */
        .swiper { width: 90%; max-width: 1200px; padding: 50px 0; }
        
        .book-card {
            background: rgba(255, 255, 255, 0.98); border-radius: 15px; overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); border: 1px solid #ddd;
            height: 100%; display: flex; flex-direction: column;
        }

        .book-img-wrapper { width: 100%; height: 350px; background: #eee; }
        .book-img-wrapper img { width: 100%; height: 100%; object-fit: fill; }

        .book-details { padding: 20px; text-align: center; flex-grow: 1; }
        .book-details h3 { font-size: 1.1rem; color: var(--dark-blue); margin-bottom: 20px; min-height: 50px; }

        .btn-group { display: flex; gap: 10px; }
        .action-btn {
            flex: 1; padding: 10px; text-decoration: none; font-weight: bold;
            border-radius: 8px; font-size: 0.9rem; text-align: center;
        }
        .btn-read { background: #eef2f7; color: var(--dark-blue); border: 1px solid #ccc; }
        .btn-down { background: var(--gold); color: white; }

        /* أزرار التنقل */
        .swiper-button-next, .swiper-button-prev { color: var(--dark-blue) !important; font-weight: bold; }
        .swiper-pagination-bullet-active { background: var(--gold) !important; }

        footer { text-align: center; padding: 40px; color: white; font-weight: bold; text-shadow: 1px 1px 3px #000; }
    </style>
</head>
<body>

<nav class="main-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i>الرئيسية</a>
    <a href="lessons.html" class="nav-item"><i class="fas fa-microphone"></i>الدروس</a>
    <a href="khotab.html" class="nav-item"><i class="fas fa-mosque"></i>الخطب</a>
    <a href="articles.html" class="nav-item"><i class="fas fa-pen-nib"></i>المقالات</a>
    <a href="books.html" class="nav-item"><i class="fas fa-book-open"></i>الكتب</a>
</nav>

<div class="header-box">
    <h1>مؤلفات الشيخ سعيد مصطفى دياب</h1>
</div>

<div class="swiper mySwiper">
    <div class="swiper-wrapper" id="books-wrapper">
        </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    const myBooks = [
        { title: "أنوار الأذكار", img: "images/anwar.jpeg", pdf: "anwar.pdf" },
        { title: "تذكير الأباة", img: "images/tzker-alobat.jpg", pdf: "tazkirat-al-abaha.pdf.pdf" },
        { title: "خطر الربا على الأمة", img: "images/katar-al-reba.jpg.jpg", pdf: "katar-al-reba.pdf.pdf" },
        { title: "فضل الدعاء وآدابه", img: "images/fadhl-duaa.jpg.jpg", pdf: "fadhl-duaa.pdf.pdf" },
        { title: "معالم التربية في السنة", img: "images/malm-al-trbia.jpg", pdf: "h1.pdf" },
        { title: "وقفت تدبرية في سورة القصص", img: "images/waqfat-tdaboria.jpg", pdf: "ar-alqasas.pdf" },
        { title: "كشف النقاب عن الإرشاد", img: "images/kashf-alnqab.jpg.jpg", pdf: "al-irshad.pdf.pdf" },
        { title: "خبر الآحاد في الأحكام", img: "images/kabar-al-ahad.jpg.jpg", pdf: "kabar-al-ahad.pdf.pdf" },
        { title: "واجب المسلمين تجاه دينهم", img: "images/wageb-al-muslmeen.jpg", pdf: "wageb-al-muslmeen.pdf.pdf" },
        { title: "الإلمام بأحكام الصيام", img: "images/al-ilmam-siyam.jpg.jpg", pdf: "al-ilmam-pahkam.al. siyam.pdf.pdf" },
        { title: "الاعتبار بطرائف الأخبار", img: "images/al-eatbaar-ptraef-alakbaar.jpg.jpg", pdf: "al-eatbaar-ptraef-alakbaar.pdf.pdf" },
        { title: "تمام المنة في التعليق", img: "images/tamam-al-minah.jpg.jpg", pdf: "tamam-al-minah.pdf.pdf" },
        { title: "اللآلئ والدرر", img: "images/allaalea-wa-aldorr.jpg.jpg", pdf: "allaalea-wa-aldorr.pdf.pdf" },
        { title: "حياة القلوب", img: "images/haiat-alqolob.jpg.jpg", pdf: "haiat-alqolob.pdf" },
        { title: "السلاسل الذهبية", img: "images/al-slsapel.jpg.jpg", pdf: "alslsapel.pdf" },
        { title: "شمائل الرسول ﷺ", img: "images/shmael-al-rasool.jpg.jpg", pdf: "shmael-al-rasool.pdf.pdf" },
        { title: "الأربعون حديثاً في عظمة الله", img: "images/arbauon.jpg", pdf: "h2.pdf" },
        { title: "العقود الفضية", img: "images/al-uqud-al-fadheya.jpg", pdf: "h3.pdf" },
        { title: "أمثال القرآن الكريم", img: "images/al-arbon-veal-amthal.jpg.jpg", pdf: "al-irshad.pdf.pdf" }
    ];

    const wrapper = document.getElementById('books-wrapper');

    myBooks.forEach(b => {
        wrapper.innerHTML += `
            <div class="swiper-slide">
                <div class="book-card">
                    <div class="book-img-wrapper">
                        <img src="${b.img}" alt="${b.title}">
                    </div>
                    <div class="book-details">
                        <h3>${b.title}</h3>
                        <div class="btn-group">
                            <a href="${b.pdf}" target="_blank" class="action-btn btn-read">قراءة</a>
                            <a href="${b.pdf}" download class="action-btn btn-down">تحميل</a>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });

    // تشغيل السلايدر
    var swiper = new Swiper(".mySwiper", {
        slidesPerView: 1,
        spaceBetween: 20,
        loop: true,
        autoplay: { delay: 3000, disableOnInteraction: false },
        pagination: { el: ".swiper-pagination", clickable: true },
        navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
        breakpoints: {
            640: { slidesPerView: 2 },
            1024: { slidesPerView: 3 },
        }
    });
</script>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
