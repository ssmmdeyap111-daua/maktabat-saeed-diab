<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الإسلامية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; }
        
        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            /* تم تعديل مسار الخلفية ليكون داخل مجلد images */
            background: #f4f7f9 url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }

        /* تثبيت الهيدر العلوي */
        .main-nav {
            background: white !important;
            display: flex; justify-content: center; gap: 40px;
            padding: 15px 0; border-bottom: 4px solid var(--dark-blue);
            position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .nav-item {
            text-decoration: none; color: var(--dark-blue);
            font-weight: 900; font-size: 1rem;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .nav-item i { font-size: 2rem; color: var(--gold); }

        .header-box { 
            margin-top: 130px; 
            text-align: center; margin-bottom: 30px;
        }
        .header-box h1 {
            background: var(--dark-blue); color: white;
            display: inline-block; padding: 12px 50px;
            border-radius: 50px; font-size: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .books-container {
            max-width: 1200px; margin: 0 auto; padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: rgba(255, 255, 255, 0.98); border-radius: 12px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s ease; border: 1px solid #ddd;
            display: flex; flex-direction: column;
        }
        .book-card:hover { transform: translateY(-5px); }

        .book-img-wrapper {
            width: 100%; height: 280px; background: #eee;
        }
        .book-img-wrapper img {
            width: 100%; height: 100%; object-fit: fill;
        }

        .book-details { padding: 15px; text-align: center; }
        .book-details h3 { 
            font-size: 1rem; color: var(--dark-blue); margin: 0 0 15px; 
            height: 45px; overflow: hidden; line-height: 1.4;
        }

        .btn-group { display: flex; gap: 5px; }
        .action-btn {
            flex: 1; padding: 8px; text-decoration: none; font-weight: bold; font-size: 0.85rem;
            border-radius: 5px; text-align: center;
        }
        .btn-read { background: #f0f4f8; color: var(--dark-blue); border: 1px solid #ccc; }
        .btn-down { background: var(--gold); color: white; }

        footer { text-align: center; padding: 40px; color: white; font-weight: bold; text-shadow: 1px 1px 3px #000; }

        @media (max-width: 768px) {
            .main-nav { gap: 15px; }
            .books-container { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .book-img-wrapper { height: 210px; }
        }
    </style>
</head>
<body>

<nav class="main-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i>الرئيسية</a>
    <a href="lessons.html" class="nav-item"><i class="fas fa-microphone"></i>الدروس</a>
    <a href="khotab.html" class="nav-item"><i class="fas fa-mosque"></i>الخطب</a>
    <a href="articles.html" class="nav-item"><i class="fas fa-pen-nib"></i>المقالات</a>
    <a href="books.html" class="nav-item"><i class="fas fa-book-open"></i>الكتب</a>
</nav>

<div class="header-box">
    <h1>مؤلفات الشيخ سعيد مصطفى دياب</h1>
</div>

<div class="books-container" id="books-grid">
    </div>

<script>
    // تم إضافة "images/" قبل كل اسم صورة
    const myBooks = [
        { title: "أنوار الأذكار", img: "images/anwar.jpeg", pdf: "anwar.pdf" },
        { title: "تذكير الأباة", img: "images/tzker-alobat.jpg", pdf: "tazkirat-al-abaha.pdf.pdf" },
        { title: "خطر الربا على الأمة", img: "images/katar-al-reba.jpg.jpg", pdf: "katar-al-reba.pdf.pdf" },
        { title: "فضل الدعاء وآدابه", img: "images/fadhl-duaa.jpg.jpg", pdf: "fadhl-duaa.pdf.pdf" },
        { title: "معالم التربية في السنة", img: "images/malm-al-trbia.jpg", pdf: "h1.pdf" },
        { title: "وقفت تدبرية في سورة لقمان", img: "images/waqfat-tdaboria.jpg", pdf: "ar-alqasas.pdf" },
        { title: "كشف النقاب ", img: "images/kashf-alnqab.jpg.jpg", pdf: "al-irshad.pdf.pdf" },
        { title: "خبر الآحاد ", img: "images/kabar-al-ahad.jpg.jpg", pdf: "kabar-al-ahad.pdf.pdf" },
        { title: "واجب المسلمين ", img: "images/wageb-al-muslmeen.jpg", pdf: "wageb-al-muslmeen.pdf.pdf" },
        { title: "الإلمام بأحكام الصيام", img: "images/al-ilmam-siyam.jpg.jpg", pdf: "al-ilmam-pahkam.al. siyam.pdf.pdf" },
        { title: "الاعتبار بطرائف الأخبار", img: "images/al-eatbaar-ptraef-alakbaar.jpg.jpg", pdf: "al-eatbaar-ptraef-alakbaar.pdf.pdf" },
        { title: "تمام المنة ", img: "images/tamam-al-minah.jpg.jpg", pdf: "tamam-al-minah.pdf.pdf" },
        { title: "اللآلئ والدرر", img: "images/allaalea-wa-aldorr.jpg.jpg", pdf: "allaalea-wa-aldorr.pdf.pdf" },
        { title: "حياة القلوب", img: "images/haiat-alqolob.jpg.jpg", pdf: "haiat-alqolob.pdf" },
        { title: "السلسبيل ", img: "images/al-slsapel.jpg.jpg", pdf: "alslsapel.pdf" },
        { title: "شمائل الرسول ﷺ", img: "images/shmael-al-rasool.jpg.jpg", pdf: "shmael-al-rasool.pdf.pdf" },
        { title: "الأربعون حديثاً ", img: "images/arbauon.jpg", pdf: "h2.pdf" },
        { title: "العقود الفضية", img: "images/al-uqud-al-fadheya.jpg", pdf: "h3.pdf" },
        { title: "أمثال القرآن الكريم", img: "images/al-arbon-veal-amthal.jpg.jpg", pdf: "al-irshad.pdf.pdf" }
    ];

    const grid = document.getElementById('books-grid');

    myBooks.forEach(b => {
        grid.innerHTML += `
            <div class="book-card">
                <div class="book-img-wrapper">
                    <img src="${b.img}" alt="${b.title}">
                </div>
                <div class="book-details">
                    <h3>${b.title}</h3>
                    <div class="btn-group">
                        <a href="${b.pdf}" target="_blank" class="action-btn btn-read">قراءة</a>
                        <a href="${b.pdf}" download class="action-btn btn-down">تحميل</a>
                    </div>
                </div>
            </div>
        `;
    });
</script>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
