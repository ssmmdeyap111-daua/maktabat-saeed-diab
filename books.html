<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المؤلفات والكتب - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root { --primary: #2c5d87; --gold: #b59410; --white: rgba(255, 255, 255, 0.95); }
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; 
            background: #2c5d87 url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
            overflow-x: hidden;
        }
        .site-header { 
            background: rgba(255, 255, 255, 0.95); padding: 25px; text-align: center; 
            border-bottom: 4px solid var(--primary); backdrop-filter: blur(5px);
        }
        .nav-bar { 
            display: flex; justify-content: center; gap: 20px; padding: 15px; 
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(5px);
        }
        .btn-link { padding: 8px 20px; border: 1px solid var(--primary); border-radius: 8px; text-decoration: none; color: var(--primary); font-weight: bold; transition: 0.3s; }

        /* تنسيق منطقة السلايدر */
        .swiper { width: 90%; max-width: 1400px; padding: 50px 0; }
        
        .book-card { 
            background: var(--white); border-radius: 15px; overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3);
            height: 100%; transition: 0.4s;
        }
        .book-cover-wrap { width: 100%; height: 400px; overflow: hidden; border-bottom: 4px solid var(--gold); }
        .book-img { width: 100%; height: 100%; object-fit: cover; }
        
        .book-footer { display: flex; background: white; }
        .book-btn { flex: 1; padding: 12px; text-decoration: none; text-align: center; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .btn-read { color: var(--primary); border-left: 1px solid #eee; }
        .btn-download { background: var(--gold); color: white; }
        .btn-download:hover { background: var(--primary); }

        /* أزرار التحكم في السلايدر */
        .swiper-button-next, .swiper-button-prev { color: var(--gold); background: rgba(255,255,255,0.8); width: 50px; height: 50px; border-radius: 50%; }
        
        footer { text-align: center; padding: 50px; color: white; text-shadow: 2px 2px 4px black; font-weight: bold; }
    </style>
</head>
<body>

<header class="site-header">
    <h1 style="margin:0; color:var(--primary);">المؤلفات والكتب العلمية</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link">الرئيسية</a>
    <a href="lessons.html" class="btn-link">الفهرس العام</a>
</div>

<div class="swiper mySwiper">
    <div class="swiper-wrapper" id="books-wrapper">
        </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
</div>

<footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    // قائمة الصور التي أرسلتها أنت يا شيخنا
    const bookImages = [
        "al-arbon-veal-amthal.jpg.jpg", "al-eatbaar-ptraef-alakbaar.jpg.jpg", "al-ilmam-siyam.jpg.jpg",
        "al-irshad.jpg", "allaalea-wa-aldorr.jpg.jpg", "tadabor.jpg", "asaleeb-alquran.jpg",
        "fadhl-duaa.jpg", "ithaf-ahl-alrusoukh.jpg.jpg", "kabar-al-ahad.jpg.jpg", "kashf-alnqab.jpg.jpg",
        "katar-al-reba.jpg.jpg", "waqfat-tdaboria.jpg", "malm-al-trbia.jpg", "tzker-alobat.jpg",
        "anwar.jpeg", "wageb-al-muslmeen.jpg", "al-slsapel.jpg.jpg", "shmael-al-rasool.jpg.jpg"
    ];

    const wrapper = document.getElementById('books-wrapper');

    bookImages.forEach(imgName => {
        const slide = `
            <div class="swiper-slide">
                <div class="book-card">
                    <div class="book-cover-wrap"><img src="images/${imgName}" class="book-img"></div>
                    <div class="book-footer">
                        <a href="#" class="book-btn btn-read">قراءة</a>
                        <a href="#" class="book-btn btn-download">تحميل</a>
                    </div>
                </div>
            </div>`;
        wrapper.innerHTML += slide;
    });

    // تشغيل السلايدر
    var swiper = new Swiper(".mySwiper", {
        slidesPerView: 1,
        spaceBetween: 20,
        loop: true,
        autoplay: { delay: 3000, disableOnInteraction: false },
        pagination: { el: ".swiper-pagination", clickable: true },
        navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
        breakpoints: {
            640: { slidesPerView: 2 },
            1024: { slidesPerView: 3 },
            1400: { slidesPerView: 4 }
        }
    });
</script>

</body>
</html>
