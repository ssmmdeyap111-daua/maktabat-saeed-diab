<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; --light-bg: #f8fafc; --success-green: #27ae60; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-bg); direction: rtl; }
        
        .site-header { background: #e3effb; padding: 40px 20px; text-align: center; border-bottom: 6px solid var(--dark-blue); }
        .site-header h1 { margin: 0; color: var(--dark-blue); font-size: 2.5rem; font-weight: 900; }

        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-link { padding: 8px 20px; border: 1px solid #ddd; border-radius: 8px; text-decoration: none; color: var(--dark-blue); font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-link:hover { background: var(--dark-blue); color: white; }

        .slider-wrapper { position: relative; max-width: 95%; margin: 30px auto; padding: 0 50px; }

        .books-slider { 
            display: flex; gap: 15px; overflow-x: auto; scroll-behavior: smooth;
            padding: 20px 5px; scrollbar-width: none;
        }
        .books-slider::-webkit-scrollbar { display: none; }

        .book-card { 
            flex: 0 0 170px; background: white; border-radius: 12px; border: 1px solid #e2e8f0; 
            padding: 12px; text-align: center; transition: 0.3s;
            display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        }
        .book-card:hover { transform: translateY(-5px); border-color: var(--gold); }

        .book-img { 
            width: 100%; height: 230px; object-fit: contain; 
            background-color: #fff; margin-bottom: 10px; border-radius: 4px;
        }

        .book-title { 
            font-weight: 700; color: var(--dark-blue); font-size: 0.9rem; 
            margin-bottom: 12px; height: 40px; display: flex; align-items: center; justify-content: center;
        }

        .actions { display: flex; flex-direction: column; gap: 5px; }
        
        .btn-read { background: var(--dark-blue); color: white; text-decoration: none; padding: 6px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; }
        .btn-dl { background: var(--success-green); color: white; text-decoration: none; padding: 6px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; }

        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: var(--dark-blue); color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10;
        }
        .prev { right: 5px; } .next { left: 5px; }

        footer { text-align: center; padding: 30px; color: #888; font-weight: bold; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>المؤلفات والكتب العلمية</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="lessons.html" class="btn-link"><i class="fas fa-list-ul"></i> الفهرس العام</a>
</div>

<div class="slider-wrapper">
    <button class="nav-btn prev" onclick="scrollSlider(300)"><i class="fas fa-chevron-right"></i></button>
    <div class="books-slider" id="books-container"></div>
    <button class="nav-btn next" onclick="scrollSlider(-300)"><i class="fas fa-chevron-left"></i></button>
</div>

<script>
    // مصفوفة الكتب مع تصحيح الامتدادات
    const books = [
        { name: "الأربعون في الأمثال", img: "al-arbon-veal-amthal.jpg.jpg", pdf: "al-arbon-veal-amthal.pdf" },
        { name: "الاعتبار بطرائف الأخبار", img: "al-eatbaar-ptraef-alakbaar.jpg.jpg", pdf: "al-eatbaar-ptraef-alakbaar.pdf" },
        { name: "الإلمام بالصيام", img: "al-ilmam-siyam.jpg.jpg", pdf: "al-ilmam-siyam.pdf" },
        { name: "الإرشاد", img: "al-irshad.jpg", pdf: "al-irshad.pdf" },
        { name: "اللآلئ والدرر", img: "allaalea-wa-aldorr.jpg.jpg", pdf: "allaalea-wa-aldorr.pdf" },
        { name: "تدبر", img: "tadabor.jpg", pdf: "tadabor.pdf" },
        { name: "أساليب القرآن", img: "asaleeb-alquran.jpg", pdf: "asaleeb-alquran.pdf" },
        { name: "فضل الدعاء", img: "fadhl-duaa.jpg", pdf: "fadhl-duaa.pdf" },
        { name: "إتحاف أهل الرسوخ", img: "ithaf-ahl-alrusoukh.jpg.jpg", pdf: "ithaf-ahl-alrusoukh.pdf" },
        { name: "خبر الآحاد", img: "kabar-al-ahad.jpg.jpg", pdf: "kabar-al-ahad.pdf" },
        { name: "كشف النقاب", img: "kashf-alnqab.jpg.jpg", pdf: "kashf-alnqab.pdf" },
        { name: "قطر الربا", img: "katar-al-reba.jpg.jpg", pdf: "katar-al-reba.pdf" },
        { name: "وقفات تدبرية", img: "waqfat-tdaboria.jpg", pdf: "waqfat-tdaboria.pdf" },
        { name: "معالم التربية", img: "malm-al-trbia.jpg", pdf: "malm-al-trbia.pdf" },
        { name: "تذكير الأبات", img: "tzker-alobat.jpg", pdf: "tzker-alobat.pdf" },
        { name: "أنوار", img: "anwar.jpeg", pdf: "anwar.pdf" },
        { name: "واجب المسلمين", img: "wageb-al-muslmeen.jpg", pdf: "wageb-al-muslmeen.pdf" },
        { name: "السلسبيل", img: "al-slsapel.jpg.jpg", pdf: "al-slsapel.pdf" },
        { name: "شمائل الرسول", img: "shmael-al-rasool.jpg.jpg", pdf: "shmael-al-rasool.pdf" }
    ];

    const container = document.getElementById('books-container');
    
    books.forEach(book => {
        // المسارات - تأكد أن المجلدات بنفس هذه الأسماء وبجانب ملف الـ html
        const pdfPath = "pdf/" + book.pdf;
        const imgPath = "images/" + book.img;
        
        container.innerHTML += `
            <div class="book-card">
                <img src="${imgPath}" class="book-img" onerror="this.src='https://via.placeholder.com/150x230?text=خطأ+في+الصورة'">
                <div class="book-title">${book.name}</div>
                <div class="actions">
                    <a href="${pdfPath}" target="_blank" class="btn-read">فتح للقراءة</a>
                    <a href="${pdfPath}" download="${book.pdf}" class="btn-dl">تحميل مباشر</a>
                </div>
            </div>
        `;
    });

    function scrollSlider(amount) {
        container.scrollBy({ left: amount, behavior: 'smooth' });
    }
</script>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>
</body>
</html>
