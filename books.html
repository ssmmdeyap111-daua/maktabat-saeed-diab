<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الشيخ سعيد مصطفى دياب الرسمي</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic&family=Amiri:wght@700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">

    <style>
        /* ... (نفس التنسيقات السابقة للعنوان والبحث) ... */
        body { margin: 0; font-family: 'Noto Kufi Arabic', sans-serif; background: #eef5ff; }
        
        .site-header { text-align: center; padding: 50px 20px; background-color: #fdfcf9; border-bottom: 2px solid #8e6d13; }
        .sheikh-title { font-family: 'Aref Ruqaa', serif; font-size: 4rem; color: #2c3e50; margin: 0; }
        .site-subtitle { display: block; font-family: 'Aref Ruqaa', serif; font-size: 1.8rem; color: #8e6d13; }

        /* ===== تنسيق قسم الكتب المطور ===== */
        .books-wrapper {
            width: 90%;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .book-card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 180px;
            transition: 0.3s;
        }

        .book-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .book-card img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .book-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            height: 45px; /* لتوحيد الارتفاع */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* زر التحميل الجديد */
        .download-btn {
            display: inline-block;
            background: linear-gradient(145deg, #27ae60, #2ecc71);
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 0 #1e8449;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: #2ecc71;
            transform: scale(1.05);
        }

        .download-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e8449;
        }

        footer { text-align: center; padding: 30px; background: #3fa1d6; color: white; margin-top: 50px; }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="sheikh-title">سعيد مصطفى دياب</h1>
        <span class="site-subtitle">الموقع الرسمي للشيخ</span>
    </header>

    <h2 style="text-align:center; margin-top:50px; color:#2c3e50;">مؤلفات وإصدارات الشيخ</h2>

    <div class="books-wrapper">
        <div class="book-card">
            <img src="images/al-arbon.jpg" alt="اسم الكتاب">
            <div class="book-title">الأربعون في الأمثال</div>
            <a href="pdf/book1.pdf" class="download-btn">📥 تحميل الكتاب</a>
        </div>

        <div class="book-card">
            <img src="images/al-eatbaar.jpg" alt="اسم الكتاب">
            <div class="book-title">كتاب الاعتبار</div>
            <a href="pdf/book2.pdf" class="download-btn">📥 تحميل الكتاب</a>
        </div>

        <div class="book-card">
            <img src="images/al-ilmam.jpg" alt="اسم الكتاب">
            <div class="book-title">الإلمام بالصيام</div>
            <a href="pdf/book3.pdf" class="download-btn">📥 تحميل الكتاب</a>
        </div>
        
        </div>

    <footer>
        &copy; 2026 جميع الحقوق محفوظة لـ موقع الشيخ سعيد مصطفى دياب
    </footer>

</body>
</html>
