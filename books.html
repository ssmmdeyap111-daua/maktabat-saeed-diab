<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; --light-bg: #f8fafc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-bg); direction: rtl; }
        
        /* 1. الشريط الرئيسي (الهيدر) مضاعف الحجم */
        .site-header { 
            background: #e3effb; 
            padding: 80px 20px; /* مضاعفة الحجم */
            text-align: center; 
            border-bottom: 8px solid var(--dark-blue); 
        }
        .site-header h1 { margin: 0; color: var(--dark-blue); font-size: 3rem; font-weight: 900; }

        /* 2. أزرار التنقل مع أيقونات بحجم مضاعف */
        .nav-bar { display: flex; justify-content: center; gap: 30px; padding: 30px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-link { 
            padding: 15px 30px; 
            border: 2px solid #ddd; 
            border-radius: 12px; 
            text-decoration: none; 
            color: var(--dark-blue); 
            font-weight: 900; 
            font-size: 1.4rem; /* تكبير الخط */
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .btn-link i { font-size: 2rem; } /* تكبير الأيقونة للضعف */
        .btn-link:hover { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

        /* 3. حاوية الشريط المتحرك المجهزة لـ 9 كتب */
        .slider-wrapper {
            position: relative;
            max-width: 95%; /* استهلاك عرض الصفحة بالكامل تقريباً */
            margin: 60px auto;
            padding: 0 50px;
        }

        .books-slider { 
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 20px 5px;
            scrollbar-width: none;
        }
        .books-slider::-webkit-scrollbar { display: none; }

        .book-card { 
            /* حساب العرض ليظهر 9 كتب (100% تقسيم 9 مع طرح المسافات) */
            flex: 0 0 calc(11% - 15px); 
            min-width: 130px; /* لضمان عدم صغرها جداً على الشاشات المتوسطة */
            background: white; border-radius: 10px; border: 1px solid #e2e8f0; 
            padding: 10px; text-align: center; transition: 0.3s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .book-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }

        .book-img { 
            width: 100%; height: 180px; background: #eee; 
            border-radius: 6px; object-fit: cover; margin-bottom: 10px;
        }

        .book-title { 
            font-weight: 700; color: var(--dark-blue); font-size: 0.8rem; 
            margin-bottom: 10px; line-height: 1.3; height: 35px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .btn-dl { 
            background: var(--gold); color: white; text-decoration: none; 
            padding: 6px; border-radius: 5px; font-size: 0.75rem; font-weight: bold;
        }

        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: var(--dark-blue); color: white; border: none;
            width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
            z-index: 10; font-size: 1.5rem; transition: 0.3s;
        }
        .nav-btn:hover { background: var(--gold); }
        .prev { right: 0; }
        .next { left: 0; }

        footer { text-align: center; padding: 60px; color: #888; font-weight: bold; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>المؤلفات والكتب العلمية</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="lessons.html" class="btn-link"><i class="fas fa-list-ul"></i> الفهرس</a>
</div>

<div class="slider-wrapper">
    <button class="nav-btn prev" onclick="scrollSlider(400)"><i class="fas fa-chevron-right"></i></button>
    
    <div class="books-slider" id="books-container">
        </div>

    <button class="nav-btn next" onclick="scrollSlider(-400)"><i class="fas fa-chevron-left"></i></button>
</div>

<script>
    const books = [
        { name: "الأربعون في الأمثال", img: "al-arbon-veal-amthal.jpg.jpg", pdf: "al-arbon-veal-amthal.pdf" },
        { name: "الاعتبار بطرائف الأخبار", img: "al-eatbaar-ptraef-alakbaar.jpg.jpg", pdf: "al-eatbaar-ptraef-alakbaar.pdf" },
        { name: "الإلمام بالصيام", img: "al-ilmam-siyam.jpg.jpg", pdf: "al-ilmam-siyam.pdf" },
        { name: "الإرشاد", img: "al-irshad.jpg", pdf: "al-irshad.pdf" },
        { name: "اللآلئ والدرر", img: "allaalea-wa-aldorr.jpg.jpg", pdf: "allaalea-wa-aldorr.pdf" },
        { name: "تدبر", img: "tadabor.jpg", pdf: "tadabor.pdf" },
        { name: "أساليب القرآن", img: "asaleeb-alquran.jpg", pdf: "asaleeb-alquran.pdf" },
        { name: "فضل الدعاء", img: "fadhl-duaa.jpg", pdf: "fadhl-duaa.pdf" },
        { name: "إتحاف أهل الرسوخ", img: "ithaf-ahl-alrusoukh.jpg.jpg", pdf: "ithaf-ahl-alrusoukh.pdf" },
        { name: "خبر الآحاد", img: "kabar-al-ahad.jpg.jpg", pdf: "kabar-al-ahad.pdf" },
        { name: "كشف النقاب", img: "kashf-alnqab.jpg.jpg", pdf: "kashf-alnqab.pdf" },
        { name: "قطر الربا", img: "katar-al-reba.jpg.jpg", pdf: "katar-al-reba.pdf" },
        { name: "وقفات تدبرية", img: "waqfat-tdaboria.jpg", pdf: "waqfat-tdaboria.pdf" },
        { name: "معالم التربية", img: "malm-al-trbia.jpg", pdf: "malm-al-trbia.pdf" },
        { name: "تذكير الأبات", img: "tzker-alobat.jpg", pdf: "tzker-alobat.pdf" },
        { name: "أنوار", img: "anwar.jpeg", pdf: "anwar.pdf" },
        { name: "واجب المسلمين", img: "wageb-al-muslmeen.jpg", pdf: "wageb-al-muslmeen.pdf" },
        { name: "السلسبيل", img: "al-slsapel.jpg.jpg", pdf: "al-slsapel.pdf" },
        { name: "شمائل الرسول", img: "shmael-al-rasool.jpg.jpg", pdf: "shmael-al-rasool.pdf" }
    ];

    const container = document.getElementById('books-container');
    books.forEach(book => {
        container.innerHTML += `
            <div class="book-card">
                <img src="images/${book.img}" class="book-img" onerror="this.src='https://via.placeholder.com/130x180/e3effb/2c5d87?text=كتاب'">
                <div class="book-title">${book.name}</div>
                <a href="pdf/${book.pdf}" class="btn-dl" download>تحميل PDF</a>
            </div>
        `;
    });

    function scrollSlider(amount) {
        container.scrollBy({ left: amount, behavior: 'smooth' });
    }
</script>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>
</body>
</html>
