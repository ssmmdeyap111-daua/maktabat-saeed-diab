<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --dark-blue: #2c5d87;
            --gold: #b59410;
            --light-bg: #f8fafc;
        }

        body { 
            margin: 0; 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--light-bg); 
            direction: rtl;
        }

        .site-header { 
            background: #e3effb; 
            padding: 40px 20px; 
            text-align: center; 
            border-bottom: 5px solid var(--dark-blue); 
        }
        .site-header h1 { margin: 0; color: var(--dark-blue); font-size: 2.2rem; font-weight: 900; }

        .nav-bar { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            padding: 20px; 
            background: white; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .btn-link { 
            padding: 10px 20px; 
            background: white; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            text-decoration: none; 
            color: var(--dark-blue); 
            font-weight: bold; 
            transition: 0.3s;
        }
        .btn-link:hover { background: var(--dark-blue); color: white; }

        /* تعديل مساحة عرض الكتب ليظهر عدد أكبر */
        .books-grid { 
            max-width: 1100px; 
            margin: 40px auto; 
            display: grid; 
            /* هنا التعديل: جعلنا أقل عرض للكتاب 200px بدلاً من 300px لزيادة العدد في الصف الواحد */
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
            padding: 0 20px;
        }

        .book-card { 
            background: white; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            padding: 15px; 
            text-align: center; 
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .book-card:hover { 
            transform: translateY(-5px); 
            border-color: var(--gold); 
            box-shadow: 0 10px 15px rgba(0,0,0,0.05);
        }

        .book-img { 
            width: 100%; 
            height: 250px; /* طول ثابت وموحد للغلاف */
            background: #eee; 
            border-radius: 8px; 
            object-fit: cover; 
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .book-title { 
            font-weight: 900; 
            color: var(--dark-blue); 
            font-size: 1.1rem; 
            margin-bottom: 10px;
            min-height: 50px; /* لتوحيد الارتفاع بين الكروت */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .download-book { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            background: var(--gold); 
            color: white; 
            text-decoration: none; 
            padding: 8px 15px; 
            border-radius: 5px; 
            font-size: 0.9rem; 
            font-weight: bold;
            transition: 0.3s;
        }
        .download-book:hover { background: var(--dark-blue); }

        footer { text-align: center; padding: 50px; color: #888; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>المؤلفات والكتب العلمية</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="articles.html" class="btn-link"><i class="fas fa-file-alt"></i> المقالات</a>
</div>

<div class="books-grid">
    <div class="book-card">
        <img src="images/book1.jpg" alt="غلاف الكتاب" class="book-img">
        <div class="book-title">عنوان الكتاب الأول</div>
        <a href="pdf/book1.pdf" class="download-book" download>
            <i class="fas fa-file-pdf"></i> تحميل PDF
        </a>
    </div>

    <div class="book-card">
        <img src="images/book2.jpg" alt="غلاف الكتاب" class="book-img">
        <div class="book-title">عنوان الكتاب الثاني</div>
        <a href="pdf/book2.pdf" class="download-book" download>
            <i class="fas fa-file-pdf"></i> تحميل PDF
        </a>
    </div>

    <div class="book-card">
        <img src="images/book3.jpg" alt="غلاف الكتاب" class="book-img">
        <div class="book-title">عنوان الكتاب الثالث</div>
        <a href="pdf/book3.pdf" class="download-book" download>
            <i class="fas fa-file-pdf"></i> تحميل PDF
        </a>
    </div>

    <div class="book-card">
        <img src="images/book4.jpg" alt="غلاف الكتاب" class="book-img">
        <div class="book-title">عنوان الكتاب الرابع</div>
        <a href="pdf/book4.pdf" class="download-book" download>
            <i class="fas fa-file-pdf"></i> تحميل PDF
        </a>
    </div>

    </div>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
