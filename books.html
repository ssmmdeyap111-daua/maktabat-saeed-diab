<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المؤلفات والكتب - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root { --primary: #2c5d87; --gold: #b59410; }
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; 
            background: #2c5d87 url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover; overflow-x: hidden;
        }
        .site-header { 
            background: rgba(255, 255, 255, 0.95); padding: 15px; text-align: center; 
            border-bottom: 4px solid var(--primary); backdrop-filter: blur(5px);
        }
        .nav-bar { display: flex; justify-content: center; gap: 20px; padding: 10px; background: rgba(255, 255, 255, 0.85); }
        .btn-link { padding: 5px 15px; border: 1px solid var(--primary); border-radius: 8px; text-decoration: none; color: var(--primary); font-weight: bold; font-size: 0.9rem; }

        /* تعديل عرض السلايدر ليكون متناسقاً */
        .swiper { width: 95%; padding: 30px 0 60px 0; }
        
        .book-card { 
            background: white; border-radius: 10px; overflow: hidden; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); height: auto; transition: 0.3s;
            display: flex; flex-direction: column;
        }
        
        /* جعل الغلاف يظهر كاملاً دون قص */
        .book-cover-wrap { 
            width: 100%; 
            height: 280px; /* طول مناسب ليظهر 7 كتب بشكل متناسق */
            background: #f9f9f9; 
            display: flex; align-items: center; justify-content: center;
            padding: 10px; box-sizing: border-box;
        }
        .book-img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; /* هذا يضمن ظهور الغلاف كاملاً مهما كان مقاسه */
        }
        
        .book-footer { display: flex; flex-direction: column; border-top: 1px solid #eee; }
        .book-btn { 
            padding: 8px; text-decoration: none; text-align: center; 
            font-weight: bold; font-size: 0.8rem; transition: 0.3s; 
        }
        .btn-read { color: var(--primary); background: #f0f4f8; border-bottom: 1px solid #eee; }
        .btn-download { background: var(--gold); color: white; }
        .btn-download:hover { background: var(--primary); }

        .swiper-button-next, .swiper-button-prev { color: var(--gold); transform: scale(0.6); }
        .swiper-pagination-bullet-active { background: var(--gold) !important; }
        
        footer { text-align: center; padding: 20px; color: white; text-shadow: 1px 1px 3px black; font-size: 0.9rem; }
    </style>
</head>
<body>

<header class="site-header">
    <h1 style="margin:0; color:var(--primary); font-size: 1.6rem;">المؤلفات والكتب العلمية</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link">الرئيسية</a>
    <a href="lessons.html" class="btn-link">الفهرس العام</a>
</div>

<div class="swiper mySwiper">
    <div class="swiper-wrapper" id="books-wrapper">
        </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
</div>

<footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    // هذه قائمة الصور التي أرسلتها
    const bookData = [
        { img: "al-arbon-veal-amthal.jpg.jpg", link: "#", pdf: "#" },
        { img: "al-eatbaar-ptraef-alakbaar.jpg.jpg", link: "#", pdf: "#" },
        { img: "al-ilmam-siyam.jpg.jpg", link: "#", pdf: "#" },
        { img: "al-irshad.jpg", link: "#", pdf: "#" },
        { img: "allaalea-wa-aldorr.jpg.jpg", link: "#", pdf: "#" },
        { img: "tadabor.jpg", link: "#", pdf: "#" },
        { img: "asaleeb-alquran.jpg", link: "#", pdf: "#" },
        { img: "fadhl-duaa.jpg", link: "#", pdf: "#" },
        { img: "ithaf-ahl-alrusoukh.jpg.jpg", link: "#", pdf: "#" },
        { img: "kabar-al-ahad.jpg.jpg", link: "#", pdf: "#" },
        { img: "kashf-alnqab.jpg.jpg", link: "#", pdf: "#" },
        { img: "katar-al-reba.jpg.jpg", link: "#", pdf: "#" },
        { img: "waqfat-tdaboria.jpg", link: "#", pdf: "#" },
        { img: "malm-al-trbia.jpg", link: "#", pdf: "#" },
        { img: "tzker-alobat.jpg", link: "#", pdf: "#" },
        { img: "anwar.jpeg", link: "#", pdf: "#" },
        { img: "wageb-al-muslmeen.jpg", link: "#", pdf: "#" },
        { img: "al-slsapel.jpg.jpg", link: "#", pdf: "#" },
        { img: "shmael-al-rasool.jpg.jpg", link: "#", pdf: "#" }
    ];

    const wrapper = document.getElementById('books-wrapper');

    bookData.forEach(book => {
        const slide = `
            <div class="swiper-slide">
                <div class="book-card">
                    <div class="book-cover-wrap"><img src="images/${book.img}" class="book-img"></div>
                    <div class="book-footer">
                        <a href="${book.link}" class="book-btn btn-read">فتح الكتاب</a>
                        <a href="${book.pdf}" download class="book-btn btn-download"><i class="fas fa-download"></i> تحميل PDF</a>
                    </div>
                </div>
            </div>`;
        wrapper.innerHTML += slide;
    });

    var swiper = new Swiper(".mySwiper", {
        slidesPerView: 2,
        spaceBetween: 15,
        loop: true,
        centeredSlides: false,
        autoplay: { delay: 3000 },
        pagination: { el: ".swiper-pagination", clickable: true },
        navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
        breakpoints: {
            768: { slidesPerView: 4 },
            1200: { slidesPerView: 7 } // عرض 7 كتب متناسقة
        }
    });
</script>
</body>
</html>
