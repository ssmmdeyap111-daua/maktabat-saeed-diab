<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ===== الشريط الأخضر الكبير ===== */
.header-bar {
    background: linear-gradient(to bottom, #0b7a2e, #006400, #004d26);
    color: white;
    text-align: center;
    padding: 80px 20px;
    font-size: 3rem;
    font-weight: bold;
    position: relative;
}
.header-bar .site-name-hand {
    font-size: 3rem;
    font-weight: bold;
    margin-bottom: 20px;
}

/* ===== أيقونات الشريط الأخضر ===== */
.header-icons {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}
.header-icons .icon-item {
    width: 140px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: bold;
    background: linear-gradient(to bottom, #eaffea, #c8f0c8);
    border: 2px solid #006400;
    border-radius: 12px;
    text-decoration: none;
    color: #006400;
    text-align: center;
}
.header-icons .icon-item:hover {
    background: #1f7a4d;
    color: white;
}

/* ===== شبكة الكتب PDF ===== */
.pdf-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin: 40px 0;
}
.pdf-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    width: 200px;
    background: linear-gradient(to bottom, #eaffea, #c8f0c8);
    border: 2px solid #006400;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    transition: transform 0.3s, background 0.3s;
}
.pdf-item:hover {
    transform: translateY(-5px);
    background: #1f7a4d;
    color: white;
}
.pdf-item span {
    margin-top: 10px;
    font-size: 1.6rem;
    text-align: center;
    color: #006400;
    font-weight: bold;
}

/* ===== أيقونة العودة للصفحة الرئيسية أسفل الصفحة ===== */
.back-home {
    display: flex;
    justify-content: flex-start;
    margin: 50px 0 20px 20px;
}
.back-home a {
    width: 160px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: bold;
    background: linear-gradient(to bottom, #eaffea, #c8f0c8);
    border: 2px solid #006400;
    border-radius: 12px;
    text-decoration: none;
    color: #006400;
    transition: transform 0.3s, background 0.3s;
}
.back-home a:hover {
    transform: translateY(-3px);
    background: #1f7a4d;
    color: white;
}
</style>
</head>
<body>

<!-- الشريط الأخضر الكبير -->
<div class="header-bar">
    <div class="site-name-hand">موقع الشيخ سعيد مصطفى دياب الرسمي</div>
    <div class="header-icons">
        <a href="books.html" class="icon-item">الكتب والمؤلفات</a>
        <a href="articles.html" class="icon-item">المقالات</a>
        <a href="lessons.html" class="icon-item">الدروس</a>
        <a href="#" class="icon-item">خطب الجمعة</a>
        <a href="#" class="icon-item">تواصل معنا</a>
    </div>
</div>

<!-- شبكة الكتب PDF -->
<div class="pdf-grid">

  </a>

  <a href="pdfs/al-eatbaar-ptraef-alakbaar.pdf" class="pdf-item" target="_blank">

    <span>الاعتبار بطرائف الأخبار</span>
  </a>

  <a href="pdfs/katar-al-reba.pdf" class="pdf-item" target="_blank">

  </a>

  <!-- أضف باقي الكتب بنفس الطريقة -->
</div>

<!-- أيقونة العودة للصفحة الرئيسية أسفل الصفحة -->

</div>

</body>
