<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; --light-bg: #f8fafc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-bg); direction: rtl; }
        .site-header { background: #e3effb; padding: 35px 20px; text-align: center; border-bottom: 5px solid var(--dark-blue); }
        .site-header h1 { margin: 0; color: var(--dark-blue); font-size: 1.8rem; font-weight: 900; }
        .nav-bar { display: flex; justify-content: center; gap: 12px; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-link { padding: 8px 15px; border: 1px solid #ddd; border-radius: 8px; text-decoration: none; color: var(--dark-blue); font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .btn-link:hover { background: var(--dark-blue); color: white; }

        .books-grid { 
            max-width: 1200px; margin: 30px auto; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 20px; padding: 0 15px;
        }

        .book-card { 
            background: white; border-radius: 10px; border: 1px solid #e2e8f0; 
            padding: 10px; text-align: center; transition: 0.3s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .book-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 8px 15px rgba(0,0,0,0.08); }

        .book-img { 
            width: 100%; height: 210px; background: #eee; 
            border-radius: 6px; object-fit: cover; margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .book-title { 
            font-weight: 700; color: var(--dark-blue); font-size: 0.85rem; 
            margin-bottom: 12px; line-height: 1.4; min-height: 40px;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-dl { 
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--gold); color: white; text-decoration: none; 
            padding: 8px; border-radius: 5px; font-size: 0.8rem; font-weight: bold;
        }
        .btn-dl:hover { background: var(--dark-blue); }
        footer { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>

<header class="site-header"><h1>المؤلفات والكتب العلمية</h1></header>
<div class="nav-bar">
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="lessons.html" class="btn-link"><i class="fas fa-arrow-right"></i> الفهرس</a>
</div>

<div class="books-grid" id="books-container">
    </div>

<script>
    // تم استخراج الأسماء الحقيقية من الروابط التي أرسلتها
    const books = [
        { name: "الأربعون في الأمثال", img: "al-arbon-veal-amthal.jpg.jpg", pdf: "al-arbon-veal-amthal.pdf" },
        { name: "الاعتبار بطرائف الأخبار", img: "al-eatbaar-ptraef-alakbaar.jpg.jpg", pdf: "al-eatbaar-ptraef-alakbaar.pdf" },
        { name: "الإلمام بالصيام", img: "al-ilmam-siyam.jpg.jpg", pdf: "al-ilmam-siyam.pdf" },
        { name: "الإرشاد", img: "al-irshad.jpg", pdf: "al-irshad.pdf" },
        { name: "اللآلئ والدرر", img: "allaalea-wa-aldorr.jpg.jpg", pdf: "allaalea-wa-aldorr.pdf" },
        { name: "تدبر", img: "tadabor.jpg", pdf: "tadabor.pdf" },
        { name: "أساليب القرآن", img: "asaleeb-alquran.jpg", pdf: "asaleeb-alquran.pdf" },
        { name: "فضل الدعاء", img: "fadhl-duaa.jpg", pdf: "fadhl-duaa.pdf" },
        { name: "إتحاف أهل الرسوخ", img: "ithaf-ahl-alrusoukh.jpg.jpg", pdf: "ithaf-ahl-alrusoukh.pdf" },
        { name: "خبر الآحاد", img: "kabar-al-ahad.jpg.jpg", pdf: "kabar-al-ahad.pdf" },
        { name: "كشف النقاب", img: "kashf-alnqab.jpg.jpg", pdf: "kashf-alnqab.pdf" },
        { name: "قطر الربا", img: "katar-al-reba.jpg.jpg", pdf: "katar-al-reba.pdf" },
        { name: "وقفات تدبرية", img: "waqfat-tdaboria.jpg", pdf: "waqfat-tdaboria.pdf" },
        { name: "معالم التربية", img: "malm-al-trbia.jpg", pdf: "malm-al-trbia.pdf" },
        { name: "تذكير الأبات", img: "tzker-alobat.jpg", pdf: "tzker-alobat.pdf" },
        { name: "أنوار", img: "anwar.jpeg", pdf: "anwar.pdf" },
        { name: "واجب المسلمين", img: "wageb-al-muslmeen.jpg", pdf: "wageb-al-muslmeen.pdf" },
        { name: "السلسبيل", img: "al-slsapel.jpg.jpg", pdf: "al-slsapel.pdf" },
        { name: "شمائل الرسول", img: "shmael-al-rasool.jpg.jpg", pdf: "shmael-al-rasool.pdf" }
    ];

    const container = document.getElementById('books-container');
    books.forEach(book => {
        container.innerHTML += `
            <div class="book-card">
                <img src="images/${book.img}" class="book-img" onerror="this.src='https://via.placeholder.com/160x210?text=غلاف+الكتاب'">
                <div class="book-title">${book.name}</div>
                <a href="pdf/${book.pdf}" class="btn-dl" download>
                    <i class="fas fa-file-pdf"></i> تحميل PDF
                </a>
            </div>
        `;
    });
</script>

<footer>جميع الحقوق محفوظة &copy; 2026</footer>
</body>
</html>
