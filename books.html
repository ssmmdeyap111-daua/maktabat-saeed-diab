<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --accent: #10b981; --bg: #f4f7f9; --gold: #d4af37; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        /* الشريط العلوي */
        .site-header { 
            background: white; 
            padding: 25px; 
            text-align: center; 
            border-bottom: 4px solid var(--primary); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .site-header h1 { margin: 0; color: var(--primary); font-size: 2rem; }

        #content { max-width: 1200px; margin: 30px auto; padding: 20px; }
        
        .back-nav { text-align: center; margin-bottom: 30px; }
        .back-nav a { text-decoration: none; color: var(--primary); font-weight: bold; display: inline-flex; align-items: center; gap: 8px; }

        /* شبكة الكتب */
        .books-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
        }
        
        /* بطاقة الكتاب */
        .book-card { 
            background: #fff; 
            border-radius: 15px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
            padding: 20px; 
            text-align: center; 
            transition: 0.3s ease;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }
        .book-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        
        .book-card img { 
            width: 100%; 
            height: 350px; 
            object-fit: cover; 
            border-radius: 10px; 
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .book-card p { 
            font-weight: 900; 
            color: var(--primary); 
            font-size: 1.2rem; 
            margin: 10px 0 20px;
            min-height: 45px;
            line-height: 1.4;
        }
        
        /* الأزرار */
        .btn-group { display: flex; gap: 10px; }
        .btn { 
            flex: 1; 
            padding: 12px 5px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: bold; 
            transition: 0.3s; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .read-btn { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .read-btn:hover { background: #e2e8f0; }
        
        .down-btn { background: var(--primary); color: #fff; }
        .down-btn:hover { background: #1e405e; }
    </style>
</head>
<body>

<header class="site-header">
    <h1><i class="fas fa-book" style="color: var(--gold);"></i> مؤلفات وتحقيقات الشيخ</h1>
</header>

<div id="content">
    <div class="back-nav">
        <a href="index.html"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
    </div>

    <div class="books-grid">
        <div class="book-card">

            <div class="btn-group">
                <a href="pdfs/kashf-alnqab.pdf" target="_blank" class="btn read-btn"><i class="fas fa-eye"></i> عرض</a>
                <a href="pdfs/kashf-alnqab.pdf" download class="btn down-btn"><i class="fas fa-download"></i> تحميل</a>
            </div>
        </div>

        <div class="book-card">

        <div class="book-card">

        <div class="book-card">
            <img src="images/al-ilmam-siyam.jpg">
            <p>الإلمام بالصيام</p>
            <div class="btn-group">
                <a href="pdfs/al-ilmam-pahkam.al. siyam.pdf.pdf" target="_blank" class="btn read-btn"><i class="fas fa-eye"></i> عرض</a>
                <a href="pdfs/al-ilmam-pahkam.al. siyam.pdf.pdf" download class="btn down-btn"><i class="fas fa-download"></i> تحميل</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
