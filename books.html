<style>
body {
    margin:0;
    font-family: 'Noto Kufi Arabic', sans-serif;
    background: linear-gradient(to bottom, #eef5ff, #d0e4ff);
}

/* شريط العنوان */
.header-bar{
    background: linear-gradient(to right,#3fa1d6,#70c0e8);
    color:white;
    padding:50px 20px;
    text-align:center;
}

.site-title {
    font-size:28px;
    margin-bottom:10px;
}

/* أيقونات الصفحات الفرعية */
.main-icons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    margin: 20px 0;
}

.icon-btn {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 140px;
    height: 60px;
    background: #4aa3d6;
    color:white;
    text-decoration:none;
    font-weight:bold;
    border-radius:12px;
    box-shadow:0 6px 12px rgba(0,0,0,0.3);
    transition: all 0.3s;
}

.icon-btn:hover {
    transform: translateY(-5px);
    box-shadow:0 12px 20px rgba(0,0,0,0.35);
    background:#3a8ec2;
}

/* شريط الكتب الأفقي */
.books-wrapper {
    position: relative;
    overflow: hidden;
    width: 90%;
    margin: auto;
    padding: 20px 0;
    border-radius:12px;
    background:#eef5ff;
}

.books-slider {
    display: flex;
    transition: transform 0.3s ease-in-out;
}

.book-slide {
    flex: 0 0 auto;
    width: 150px;
    margin: 0 10px;
    text-align:center;
}

.book-slide img {
    width:100%;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}

.book-slide img:hover {
    transform: scale(1.08);
}

/* الأسهم */
.book-prev, .book-next {
    position: absolute;
    top:50%;
    transform: translateY(-50%);
    background:#4aa3d6;
    color:white;
    font-size:24px;
    width:45px;
    height:45px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
    z-index:10;
}

.book-prev:hover, .book-next:hover {
    background:#3a8ec2;
}

.book-prev { left:10px; }
.book-next { right:10px; }

/* زر العودة للصفحة الرئيسية */
.back-home {
    display:inline-block;
    margin:20px;
    padding:10px 20px;
    background:#70c0e8;
    color:white;
    border-radius:12px;
    text-decoration:none;
    box-shadow:0 6px 12px rgba(0,0,0,0.3);
    transition: all 0.2s;
}

.back-home:hover {
    transform: translateY(-3px);
    box-shadow:0 12px 20px rgba(0,0,0,0.35);
}

</style>
</head>

<script>
const slider = document.querySelector('.books-slider');
const prev = document.querySelector('.book-prev');
const next = document.querySelector('.book-next');
let scrollAmount = 0;
const slideWidth = 174;

prev.addEventListener('click', () => {
    scrollAmount = Math.max(scrollAmount - slideWidth, 0);
    slider.scrollTo({ left: scrollAmount, behavior: 'smooth' });
});

next.addEventListener('click', () => {
    scrollAmount = Math.min(scrollAmount + slideWidth, slider.scrollWidth - slider.clientWidth);
    slider.scrollTo({ left: scrollAmount, behavior: 'smooth' });
});
</script>
