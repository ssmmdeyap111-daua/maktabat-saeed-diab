<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الإسلامية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; }
        
        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            /* إصلاح الخلفية - تأكد من وجود ملف library-bg.jpg بجانب ملف HTML */
            background: #f4f7f9 url('library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }

        /* تثبيت الهيدر العلوي ومنع اختفائه */
        .main-nav {
            background: #ffffff !important;
            display: flex; justify-content: center; gap: 40px;
            padding: 15px 0; border-bottom: 4px solid var(--dark-blue);
            position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .nav-item {
            text-decoration: none; color: var(--dark-blue);
            font-weight: 900; font-size: 1rem;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .nav-item i { font-size: 2rem; color: var(--gold); }

        /* العنوان الرئيسي بشكل بارز */
        .header-box { 
            margin-top: 130px; /* لترك مسافة تحت الهيدر الثابت */
            text-align: center; margin-bottom: 30px;
        }
        .header-box h1 {
            background: var(--dark-blue); color: white;
            display: inline-block; padding: 15px 60px;
            border-radius: 50px; font-size: 2.2rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); margin: 0;
        }

        /* شبكة الكتب - ملء عرض الصفحة */
        .books-container {
            max-width: 1400px; margin: 0 auto; padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .book-card {
            background: white; border-radius: 15px; overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: 0.3s ease; border: 1px solid #eee;
            display: flex; flex-direction: column;
        }
        .book-card:hover { transform: translateY(-10px); }

        .book-img-wrapper {
            width: 100%; height: 320px; background: #f0f0f0;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border-bottom: 4px solid var(--gold);
        }
        .book-img-wrapper img {
            width: 100%; height: 100%; object-fit: fill;
        }

        .book-details { padding: 15px; text-align: center; flex-grow: 1; }
        .book-details h3 { 
            font-size: 1.1rem; color: var(--dark-blue); margin: 0 0 15px; 
            min-height: 50px; line-height: 1.5; font-weight: 800;
        }

        .btn-group { display: flex; gap: 8px; }
        .action-btn {
            flex: 1; padding: 10px; text-decoration: none; font-weight: bold; font-size: 0.9rem;
            border-radius: 8px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-read { background: #eef2f7; color: var(--dark-blue); border: 1px solid #d1d9e6; }
        .btn-down { background: var(--gold); color: white; }
        .action-btn:hover { filter: brightness(0.9); }

        footer { text-align: center; padding: 50px; color: white; text-shadow: 1px 1px 5px #000; font-weight: bold; }

        @media (max-width: 768px) {
            .main-nav { gap: 15px; }
            .nav-item { font-size: 0.8rem; }
            .nav-item i { font-size: 1.5rem; }
            .header-box h1 { font-size: 1.5rem; padding: 10px 30px; }
            .books-container { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
            .book-img-wrapper { height: 230px; }
        }
    </style>
</head>
<body>

<nav class="main-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i>الرئيسية</a>
    <a href="lessons.html" class="nav-item"><i class="fas fa-microphone"></i>الدروس</a>
    <a href="khotab.html" class="nav-item"><i class="fas fa-mosque"></i>الخطب</a>
    <a href="articles.html" class="nav-item"><i class="fas fa-pen-nib"></i>المقالات</a>
    <a href="books.html" class="nav-item"><i class="fas fa-book-open"></i>الكتب والمؤلفات</a>
</nav>

<div class="header-box">
    <h1>المكتبة الإسلامية</h1>
</div>

<div class="books-container" id="books-grid">
    </div>

<script>
    const myBooks = [
        { title: "أنوار الأذكار", img: "anwar.jpeg", pdf: "anwar.pdf" },
        { title: "تذكير الأباة", img: "tzker-alobat.jpg", pdf: "tazkirat-al-abaha.pdf.pdf" },
        { title: "خطر الربا على الأمة", img: "katar-al-reba.jpg.jpg", pdf: "katar-al-reba.pdf.pdf" },
        { title: "فضل الدعاء وآدابه", img: "fadhl-duaa.jpg.jpg", pdf: "fadhl-duaa.pdf.pdf" },
        { title: "معالم التربية في السنة", img: "malm-al-trbia.jpg", pdf: "h1.pdf" },
        { title: "وقفت تدبرية في سورة القصص", img: "waqfat-tdaboria.jpg", pdf: "ar-alqasas.pdf" },
        { title: "كشف النقاب عن الإرشاد", img: "kashf-alnqab.jpg.jpg", pdf: "al-irshad.pdf.pdf" },
        { title: "خبر الآحاد في الأحكام", img: "kabar-al-ahad.jpg.jpg", pdf: "kabar-al-ahad.pdf.pdf" },
        { title: "واجب المسلمين تجاه دينهم", img: "wageb-al-muslmeen.jpg", pdf: "wageb-al-muslmeen.pdf.pdf" },
        { title: "الإلمام بأحكام الصيام", img: "al-ilmam-siyam.jpg.jpg", pdf: "al-ilmam-pahkam.al. siyam.pdf.pdf" },
        { title: "الاعتبار بطرائف الأخبار", img: "al-eatbaar-ptraef-alakbaar.jpg.jpg", pdf: "al-eatbaar-ptraef-alakbaar.pdf.pdf" },
        { title: "تمام المنة في التعليق", img: "tamam-al-minah.jpg.jpg", pdf: "tamam-al-minah.pdf.pdf" },
        { title: "اللآلئ والدرر", img: "allaalea-wa-aldorr.jpg.jpg", pdf: "allaalea-wa-aldorr.pdf.pdf" },
        { title: "حياة القلوب", img: "haiat-alqolob.jpg.jpg", pdf: "haiat-alqolob.pdf" },
        { title: "السلاسل الذهبية", img: "al-slsapel.jpg.jpg", pdf: "alslsapel.pdf" },
        { title: "شمائل الرسول ﷺ", img: "shmael-al-rasool.jpg.jpg", pdf: "shmael-al-rasool.pdf.pdf" },
        { title: "الأربعون حديثاً في عظمة الله", img: "arbauon.jpg", pdf: "h2.pdf" },
        { title: "العقود الفضية", img: "al-uqud-al-fadheya.jpg", pdf: "h3.pdf" },
        { title: "أمثال القرآن الكريم", img: "al-arbon-veal-amthal.jpg.jpg", pdf: "al-irshad.pdf.pdf" }
    ];

    const grid = document.getElementById('books-grid');

    myBooks.forEach(b => {
        grid.innerHTML += `
            <div class="book-card">
                <div class="book-img-wrapper">
                    <img src="${b.img}" alt="${b.title}" onerror="this.src='https://via.placeholder.com/220x320?text=كتاب'">
                </div>
                <div class="book-details">
                    <h3>${b.title}</h3>
                    <div class="btn-group">
                        <a href="${b.pdf}" target="_blank" class="action-btn btn-read"><i class="fas fa-eye"></i> قراءة</a>
                        <a href="${b.pdf}" download class="action-btn btn-down"><i class="fas fa-download"></i> تحميل</a>
                    </div>
                </div>
            </div>
        `;
    });
</script>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
