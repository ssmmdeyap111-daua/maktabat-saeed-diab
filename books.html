<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ</title>
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500&family=Noto+Kufi+Arabic:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Kufi Arabic', sans-serif; background: linear-gradient(to bottom, #eef5ff, #d0e4ff); }
        .header-books { text-align: center; padding: 30px; background: linear-gradient(to right, #70c0e8, #a2d9ff); }
        
        /* زر العودة ثلاثي الأبعاد */
        .back-3d {
            display: inline-block;
            margin: 20px;
            padding: 12px 25px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            color: #1a508b;
            text-decoration: none;
            font-weight: bold;
            border-radius: 15px;
            box-shadow: 6px 6px 12px #c5ced1, -6px -6px 12px #ffffff;
            transition: 0.3s;
        }
        .back-3d:hover { transform: scale(1.05); box-shadow: 3px 3px 6px #c5ced1; }

        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; width: 90%; margin: 30px auto; }
        .book-card { background: white; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .book-card img { width: 100%; border-radius: 5px; }
        .download-btn { display: inline-block; margin-top: 10px; background: #27ae60; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; }
        
        footer { text-align: center; padding: 30px; background: #3fa1d6; color: white; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="header-books"><h1 style="font-family:'Reem Kufi'; color:#1a508b;">المكتبة الرسمية</h1></div>
    
    <div style="text-align: center;">
        <a href="index.html" class="back-3d">🏠 العودة للرئيسية</a>
    </div>

    <div class="books-grid">
        <div class="book-card"><img src="images/al-arbon-veal-amthal.jpg.jpg"><p>الأربعون في الأمثال</p><a href="#" class="download-btn">تحميل PDF</a></div>
        <div class="book-card"><img src="images/al-eatbaar-ptraef-alakbaar.jpg.jpg"><p>الاعتبار بطرائف الأخبار</p><a href="#" class="download-btn">تحميل PDF</a></div>
        <div class="book-card"><img src="images/al-ilmam-siyam.jpg.jpg"><p>الإلمام بالصيام</p><a href="#" class="download-btn">تحميل PDF</a></div>
    </div>

    <footer>&copy; جميع الحقوق محفوظة للشيخ سعيد مصطفى دياب</footer>
</body>
</html>
