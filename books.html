<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root { 
            --primary: #2c5d87; 
            --light-blue: #e3effb; /* الأزرق الفاتح المطللوب */
            --gold: #d4af37; 
            --white: #ffffff; 
        }
        body { font-family: 'Cairo', sans-serif; background: #f8fafc; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* الشريط العلوي الواسع */
        .site-header { 
            background: var(--light-blue); 
            padding: 60px 20px; /* زيادة التوسعة للضعف */
            text-align: center; 
            border-bottom: 5px solid var(--primary); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .site-header h1 { margin: 0; color: var(--primary); font-size: 2.5rem; font-weight: 900; }
        .site-header p { color: var(--primary); margin-top: 10px; font-size: 1.2rem; opacity: 0.8; }

        .container { max-width: 95%; margin: 50px auto; padding: 20px; }

        /* تنسيق الشريط المتحرك Swiper */
        .swiper { width: 100%; padding: 50px 0; }
        
        .book-card { 
            background: var(--white); 
            border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.08); 
            padding: 15px; 
            text-align: center; 
            transition: 0.4s; 
            border: 1px solid #eee;
            height: 480px; /* حجم موحد وأصغر قليلاً */
            display: flex;
            flex-direction: column;
        }
        .book-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        
        .book-card img { 
            width: 100%; 
            height: 280px; /* تقليل حجم الصورة لتظهر بالكامل */
            object-fit: contain; /* لضمان ظهور غلاف الكتاب كاملاً دون قص */
            background: #f9f9f9;
            border-radius: 8px; 
            margin-bottom: 15px;
        }
        
        .book-card p { 
            font-weight: 700; 
            color: var(--primary); 
            font-size: 1rem; 
            margin: 10px 0; 
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-group { display: flex; gap: 8px; }
        .btn { 
            flex: 1; padding: 10px 5px; border-radius: 6px; 
            text-decoration: none; font-size: 0.85rem; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .read-btn { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .down-btn { background: var(--primary); color: white; transition: 0.3s; }
        .down-btn:hover { background: var(--gold); }

        /* أسهم التنقل */
        .swiper-button-next, .swiper-button-prev { color: var(--primary); }
    </style>
</head>
<body>

<header class="site-header">
    <h1><i class="fas fa-book-reader"></i> مكتبة الشيخ سعيد مصطفى دياب</h1>
    <p>مؤلفات، تحقيقات، ومقالات علمية</p>
</header>

<div class="container">
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="index.html" style="text-decoration: none; color: var(--primary); font-weight: bold;">
            <i class="fas fa-home"></i> العودة للرئيسية
        </a>
    </div>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            
            <div class="swiper-slide">
                <div class="book-card">
                    <img src="images/kashf-alnqab.jpg.jpg">
                    <p>كشف النقاب عن أحكام الحجاب</p>
                    <div class="btn-group">
                        <a href="pdfs/kashf-alnqab.pdf" target="_blank" class="btn read-btn"><i class="fas fa-eye"></i> عرض</a>
                        <a href="pdfs/kashf-alnqab.pdf" download class="btn down-btn"><i class="fas fa-download"></i></a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide">
                <div class="book-card">
                    <img src="images/shmael-al-rasool.jpg.jpg">
                    <p>شمائل الرسول</p>
                    <div class="btn-group">
                        <a href="pdfs/shmael-al-rasool.pdf.pdf" target="_blank" class="btn read-btn"><i class="fas fa-eye"></i> عرض</a>
                        <a href="pdfs/shmael-al-rasool.pdf.pdf" download class="btn down-btn"><i class="fas fa-download"></i></a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide">
                <div class="book-card">
                    <img src="images/allaalea-wa-aldorr.jpg.jpg">
                    <p>اللآلئ والدرر</p>
                    <div class="btn-group">
                        <a href="pdfs/allaalea-wa-aldorr.pdf.pdf" target="_blank" class="btn read-btn"><i class="fas fa-eye"></i> عرض</a>
                        <a href="pdfs/allaalea-wa-aldorr.pdf.pdf" download class="btn down-btn"><i class="fas fa-download"></i></a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide">
                <div class="book-card">
                    <img src="images/katar-al-reba.jpg.jpg">
                    <p>خطر الربا</p>
                    <div class="btn-group">
                        <a href="pdfs/katar-al-reba.pdf.pdf" target="_blank" class="btn read-btn"><i class="fas fa-eye"></i> عرض</a>
                        <a href="pdfs/katar-al-reba.pdf.pdf" download class="btn down-btn"><i class="fas fa-download"></i></a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide">
                <div class="book-card">
                    <img src="images/tzker-alobat.jpg">
                    <p>تذكير الأباة</p>
                    <div class="btn-group">
                        <a href="pdfs/tzker-alobat.pdf" target="_blank" class="btn read-btn"><i class="fas fa-eye"></i> عرض</a>
                        <a href="pdfs/tzker-alobat.pdf" download class="btn down-btn"><i class="fas fa-download"></i></a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide">
                <div class="book-card">
                    <img src="images/haiat-alqolob.jpg">
                    <p>حياة القلوب</p>
                    <div class="btn-group">
                        <a href="pdfs/h1.pdf" target="_blank" class="btn read-btn"><i class="fas fa-eye"></i> عرض</a>
                        <a href="pdfs/h1.pdf" download class="btn down-btn"><i class="fas fa-download"></i></a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide">
                <div class="book-card">
                    <img src="images/waqfat-tdaboria.jpg">
                    <p>وقفات تدبرية</p>
                    <div class="btn-group">
                        <a href="pdfs/h3.pdf" target="_blank" class="btn read-btn"><i class="fas fa-eye"></i> عرض</a>
                        <a href="pdfs/h3.pdf" download class="btn down-btn"><i class="fas fa-download"></i></a>
                    </div>
                </div>
            </div>

        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    var swiper = new Swiper(".mySwiper", {
        slidesPerView: 1,
        spaceBetween: 20,
        loop: true,
        autoplay: { delay: 3000, disableOnInteraction: false },
        pagination: { el: ".swiper-pagination", clickable: true },
        navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
        breakpoints: {
            640: { slidesPerView: 2 },
            1024: { slidesPerView: 4 }, // يظهر 4 كتب بجانب بعض في الشاشات الكبيرة
            1400: { slidesPerView: 5 }  // يظهر 5 كتب بجانب بعض في الشاشات الواسعة جداً
        },
    });
</script>

</body>
</html>
