<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلفات الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; --light-bg: #f8fafc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-bg); }
        .site-header { background: #e3effb; padding: 30px; text-align: center; border-bottom: 5px solid var(--dark-blue); }
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; background: white; }
        .btn-link { padding: 8px 15px; border: 1px solid #ddd; border-radius: 8px; text-decoration: none; color: var(--dark-blue); font-weight: bold; font-size: 0.9rem; }
        
        /* شبكة عرض الكتب المكثفة */
        .books-grid { 
            max-width: 1200px; margin: 30px auto; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; padding: 0 15px; 
        }
        .book-card { 
            background: white; border-radius: 10px; border: 1px solid #e2e8f0; 
            padding: 10px; text-align: center; transition: 0.3s;
        }
        .book-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .book-img { width: 100%; height: 210px; border-radius: 5px; object-fit: cover; margin-bottom: 8px; background: #eee; }
        .book-title { font-weight: 700; color: var(--dark-blue); font-size: 0.85rem; height: 35px; overflow: hidden; margin-bottom: 10px; }
        .btn-dl { display: block; background: var(--gold); color: white; text-decoration: none; padding: 6px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<header class="site-header"><h1>المؤلفات والكتب</h1></header>
<div class="nav-bar">
    <a href="index.html" class="btn-link">الرئيسية</a>
    <a href="lessons.html" class="btn-link">الفهرس</a>
</div>

<div class="books-grid">
    <div class="book-card">
        <img src="images/book1.jpg" class="book-img" onerror="this.src='https://via.placeholder.com/160x210?text=الغلاف'">
        <div class="book-title">اكتب هنا اسم الكتاب 1</div>
        <a href="pdf/book1.pdf" class="btn-dl" download>تحميل PDF</a>
    </div>

    <div class="book-card">
        <img src="images/book2.jpg" class="book-img" onerror="this.src='https://via.placeholder.com/160x210?text=الغلاف'">
        <div class="book-title">اكتب هنا اسم الكتاب 2</div>
        <a href="pdf/book2.pdf" class="btn-dl" download>تحميل PDF</a>
    </div>

    </div>

<footer><p style="text-align:center; padding:30px; color:#888;">&copy; 2026 الشيخ سعيد مصطفى دياب</p></footer>

</body>
</html>
