<style>
    :root { 
        --dark-blue: #2c5d87; 
        --gold: #b59410; 
        --success-green: #27ae60; 
    }

    body { 
        margin: 0; 
        padding: 0;
        font-family: 'Cairo', sans-serif; 
        direction: rtl;
        min-height: 100vh;
        
        /* محاولة تشغيل الخلفية بأكثر من امتداد محتمل */
        background-image: url('library-bg.jpg'); 
        
        /* إذا لم يجد الصورة، سيستخدم هذا اللون كخلفية */
        background-color: var(--dark-blue); 
        
        background-size: cover;
        background-position: center center;
        background-attachment: fixed;
        background-repeat: no-repeat;
    }

    /* لإصهار المحتوى فوق الخلفية بشكل واضح */
    .site-header { 
        background: rgba(44, 93, 135, 0.8); 
        padding: 40px 20px; 
        text-align: center; 
        border-bottom: 5px solid var(--gold); 
        backdrop-filter: blur(8px);
        color: white;
    }
    
    .book-card { 
        flex: 0 0 180px; 
        background: rgba(255, 255, 255, 0.92); /* شفافية بيضاء أنيقة */
        border-radius: 12px; 
        padding: 15px; 
        text-align: center; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        backdrop-filter: blur(5px);
        transition: 0.3s;
    }
    /* ... بقية التنسيقات السابقة ... */
</style>
