<script>

/* التاريخ */

function updateDate(){

    const now = new Date();

    const hijri = new Intl.DateTimeFormat(
        'ar-SA-u-ca-islamic-umalqura',
        {
            weekday:'long',
            day:'numeric',
            month:'long',
            year:'numeric'
        }
    ).format(now);

    const miladi = new Intl.DateTimeFormat(
        'ar-EG',
        {
            weekday:'long',
            day:'numeric',
            month:'long',
            year:'numeric'
        }
    ).format(now);

    document.getElementById('current-date').innerHTML =
        `${hijri} هـ | ${miladi} م`;
}

/* مواقيت الصلاة */

async function getPrayers(){

    try{

        const res = await fetch(
            'https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4'
        );

        const data = await res.json();

        const t = data.data.timings;

        document.getElementById('prayer-api').innerHTML = `

            <div class="prayer-item">
                <span class="prayer-name">الفجر</span>
                <span class="prayer-time">${t.Fajr}</span>
            </div>

            <div class="prayer-item">
                <span class="prayer-name">الظهر</span>
                <span class="prayer-time">${t.Dhuhr}</span>
            </div>

            <div class="prayer-item">
                <span class="prayer-name">العصر</span>
                <span class="prayer-time">${t.Asr}</span>
            </div>

            <div class="prayer-item">
                <span class="prayer-name">المغرب</span>
                <span class="prayer-time">${t.Maghrib}</span>
            </div>

            <div class="prayer-item">
                <span class="prayer-name">العشاء</span>
                <span class="prayer-time">${t.Isha}</span>
            </div>

        `;

    }catch(e){

        console.log("تعذر تحميل مواقيت الصلاة");
    }
}

window.onload = () => {

    updateDate();

    getPrayers();
};

</script>
