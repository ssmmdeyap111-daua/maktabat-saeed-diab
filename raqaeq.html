<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرقائق والزهد - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #f4f7f9; --accent-blue: #add8e6; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
            --sky-blue: #87CEEB; /* اللون الموحد المطلوب */
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); color: #333; }

        /* شريط المعلومات العلوي */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; background: #fdfae7; border-bottom: 2px solid var(--accent-blue); font-size: 0.85rem; }
        .date-info { font-weight: 700; color: var(--dark-blue); }
        .prayer-item { background: #fff; border: 1px solid #ddd; padding: 3px 10px; border-radius: 6px; text-align: center; margin-left: 5px; }
        .prayer-time { font-weight: 900; color: #1b5e20; }

        /* الهيدر */
        .site-header { text-align: center; padding: 25px; background: var(--header-bg); border-bottom: 4px solid #fff; }
        .site-logo { max-width: 600px; width: 100%; mix-blend-mode: multiply; }

        /* شريط التنقل */
        .nav-bar { display: flex; justify-content: center; gap: 12px; padding: 15px; background: #fff; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-link-3d { 
            padding: 10px 20px; background: var(--dark-blue); color: white; text-decoration: none;
            border-radius: 10px; font-weight: bold; font-size: 0.9rem;
            box-shadow: 0 4px 0 #1a3a54; transition: 0.2s;
        }

        .section-info { text-align: center; margin: 40px 0 20px; }
        .section-title { color: var(--dark-blue); font-weight: 900; font-size: 2rem; margin: 0; }

        /* شبكة المستطيلات الموحدة */
        .series-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); 
            gap: 20px; 
            padding: 20px; 
            max-width: 1100px; 
            margin: 0 auto 60px; 
        }
        
        .series-card { 
            background: var(--sky-blue); 
            padding: 20px; 
            border-radius: 15px; 
            text-align: center; 
            text-decoration: none; 
            color: white !important; 
            transition: 0.3s; 
            box-shadow: 0 6px 0 #5f9ea0;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            height: 80px; /* ارتفاع مستطيل متوسط */
        }
        .series-card:hover { transform: translateY(-5px); box-shadow: 0 8px 0 #5f9ea0; }
        .series-card h3 { margin: 0; font-size: 1.2rem; font-weight: 900; }
        .count { font-size: 0.75rem; font-weight: bold; opacity: 0.9; margin-top: 5px; }

        footer { text-align: center; padding: 35px; color: var(--dark-blue); font-weight: bold; background: #e0f2f7; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="date-info" id="hijri-date">جاري التحميل...</div>
        <div class="prayer-times" id="prayers-header" style="display: flex;"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="nav-link-3d">الرئيسية</a>
        <a href="lessons.html" class="nav-link-3d">المكتبة الصوتية</a>
        <a href="books.html" class="nav-link-3d">الكتب</a>
    </nav>

    <div class="section-info">
        <h2 class="section-title">قسم الرقائق والزهد</h2>
    </div>

    <div class="series-grid">
        <a href="raq_azkar.html" class="series-card">
            <h3>أنوار الأذكار</h3>
            <span class="count">30 درساً</span>
        </a>
        <a href="mahba.html" class="series-card"> <h3>أسباب محبة الله</h3>
            <span class="count">30 درساً</span>
        </a>
        <a href="raq_mkarem.html" class="series-card">
            <h3>مكارم الأخلاق</h3>
            <span class="count">40 درساً</span>
        </a>
        <a href="raq_ganah.html" class="series-card">
            <h3>وصف الجنة ونعيمها</h3>
            <span class="count">15 درساً</span>
        </a>
    </div>

    <footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        async function initHeader() {
            const now = new Date();
            document.getElementById('hijri-date').innerText = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now) + " هـ";
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const d = await res.json();
                const t = d.data.timings;
                const p = [{v:t.Fajr}, {v:t.Dhuhr}, {v:t.Asr}, {v:t.Maghrib}, {v:t.Isha}];
                document.getElementById('prayers-header').innerHTML = p.map(x => `<div class="prayer-item"><span class="prayer-time">${x.v}</span></div>`).join('');
            } catch(e) {}
        }
        window.onload = initHeader;
    </script>
</body>
</html>
