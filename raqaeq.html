<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرقائق والزهد - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #eef5ff; 
            --accent-blue: #87ceeb; 
            --dark-blue: #2c5d87;
            --gold-color: #d4af37;
            --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { 
            margin: 0; font-family: 'Cairo', sans-serif; 
            background: linear-gradient(to bottom, var(--light-sky), #d0e4ff);
            min-height: 100vh;
        }

        /* الهيدر: يعتمد المخطوطة كعنوان رئيسي */
        .site-header { 
            text-align: center; 
            padding: 50px 20px; 
            background: var(--header-bg); 
            border-bottom: 4px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .site-logo {
            max-width: 750px; /* حجم المخطوطة ليكون بارزاً كعنوان */
            width: 100%;
            height: auto;
            mix-blend-mode: multiply; /* لجعل خلفية الصورة مندمجة مع الموقع */
        }

        /* شريط التنقل */
        .nav-bar { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            padding: 20px; 
            flex-wrap: wrap; 
            background: rgba(255,255,255,0.3); 
        }

        .nav-link-3d { 
            padding: 10px 18px; 
            background: var(--accent-blue); 
            color: white; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: bold; 
            min-width: 100px; 
            text-align: center;
            box-shadow: 0 5px 0 var(--dark-blue); 
            transition: 0.2s; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 5px;
        }
        .nav-link-3d:hover { transform: translateY(-2px); background: #9cdfff; }
        .active-link { background: var(--gold-color); box-shadow: 0 5px 0 #b38f2d; }

        .section-info { text-align: center; margin: 40px 0 20px; }
        .section-title { color: var(--dark-blue); font-weight: 900; font-size: 2.2rem; margin: 0; }
        .section-subtitle { color: #555; font-weight: bold; margin-top: 5px; display: block; }

        /* شبكة البطاقات */
        .series-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
            padding: 20px; 
            max-width: 1200px; 
            margin: 0 auto 60px; 
        }
        
        .series-card { 
            background: white; 
            padding: 40px 20px; 
            border-radius: 25px; 
            text-align: center; 
            text-decoration: none; 
            color: var(--dark-blue); 
            transition: 0.4s; 
            border-bottom: 6px solid var(--gold-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px;
        }
        .series-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-bottom-color: var(--dark-blue); }
        .series-card i { font-size: 3.8rem; }
        .count { background: var(--light-sky); padding: 6px 20px; border-radius: 50px; font-size: 0.9rem; font-weight: bold; color: var(--dark-blue); border: 1px solid var(--accent-blue); }

        footer { text-align: center; padding: 40px; color: var(--dark-blue); font-weight: bold; border-top: 4px solid #fff; background: var(--header-bg); }

        @media (max-width: 768px) {
            .site-logo { max-width: 90%; }
            .section-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="مخطوطة الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="nav-link-3d"><i class="fas fa-home"></i>الرئيسية</a>
        <a href="lessons.html" class="nav-link-3d active-link"><i class="fas fa-microphone"></i>الدروس</a>
        <a href="khutbah.html" class="nav-link-3d"><i class="fas fa-mosque"></i>الخطب</a>
        <a href="articles.html" class="nav-link-3d"><i class="fas fa-pen-nib"></i>المقالات</a>
        <a href="books.html" class="nav-link-3d"><i class="fas fa-book-open"></i>الكتب</a>
    </nav>

    <div class="section-info">
        <h2 class="section-title">قسم الرقائق والزهد</h2>
        <span class="section-subtitle">سلاسل دروس إيمانية تلامس القلوب</span>
    </div>

    <div class="series-grid">
        <a href="raq_azkar.html" class="series-card">
            <i class="fas fa-pray" style="color: #3498db;"></i>
            <h3>أنوار الأذكار</h3>
            <span class="count">30 درساً</span>
        </a>
        <a href="raq_mahba.html" class="series-card">
            <i class="fas fa-heart" style="color: #e74c3c;"></i>
            <h3>أسباب محبة الله</h3>
            <span class="count">30 درساً</span>
        </a>
        <a href="raq_mkarem.html" class="series-card">
            <i class="fas fa-star" style="color: #f1c40f;"></i>
            <h3>مكارم الأخلاق</h3>
            <span class="count">40 درساً</span>
        </a>
        <a href="raq_ganah.html" class="series-card">
            <i class="fas fa-cloud-sun" style="color: #2ecc71;"></i>
            <h3>وصف الجنة ونعيمها</h3>
            <span class="count">15 درساً</span>
        </a>
    </div>

    <footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

</body>
</html>
