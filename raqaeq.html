<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قسم الرقائق والزهد - الشيخ سعيد مصطفى دياب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap" rel="stylesheet">

<style>
:root{
    --primary:#2d5f8b;
    --gold:#c8a44d;
    --green:#4f7f49;
    --beige-light:#efe6d6;
    --beige-dark:#d8c7a8;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    font-family:'Cairo',sans-serif;
    background:#eef1f4;
    color:#333;
}

/* الشريط العلوي الموحد */
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 25px;
    background:var(--beige-light);
    border-bottom:2px solid var(--beige-dark);
    flex-wrap:wrap;
    gap:10px;
}

.date-info{
    font-size:0.95rem;
    font-weight:700;
    color:#555;
}

.prayer-times{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.prayer-item{
    background:white;
    padding:5px 10px;
    border-radius:8px;
    border:1px solid #ddd;
    text-align:center;
}

.prayer-name{
    display:block;
    font-size:0.7rem;
    color:#777;
    font-weight:bold;
}

.prayer-time{
    font-weight:900;
    color:var(--primary);
    font-size:0.85rem;
}

/* الهيدر */
.site-header{
    text-align:center;
    padding:30px 10px;
    background:#dce7ea;
}

.site-logo{
    max-width:650px;
    width:100%;
    height:auto;
    mix-blend-mode:multiply;
    background:transparent;
    display:inline-block;
    filter:brightness(1.02) contrast(1.05);
}

/* القائمة الرئيسية */
.main-nav{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
    padding:22px;
    background:var(--beige-light);
    border-top:1px solid #ddd;
    border-bottom:1px solid #ddd;
    flex-wrap:wrap;
}

.nav-link{
    text-decoration:none;
    color:white;
    padding:15px 45px;
    border-radius:12px;
    font-weight:900;
    transition:0.3s;
    font-size:1.25rem;
    box-shadow:0 5px 0 rgba(0,0,0,0.2);
}

.nav-link:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 0 rgba(0,0,0,0.15);
}

.btn-home{ background:#caa230; }
.btn-tafseer{ background:#73b8d4; }
.btn-audio{ background:#6eb6d1; }
.btn-khutab{ background:#5b90cb; }
.btn-articles{ background:#4f7f49; }

/* المحتوى */
.container{
    max-width:1200px;
    margin:auto;
    padding:60px 20px;
    text-align:center;
}

.section-title{
    color:var(--primary);
    font-size:2.4rem;
    font-weight:900;
    margin-bottom:10px;
}

.title-line{
    width:200px;
    height:5px;
    background:#caa230;
    margin:0 auto 50px;
    border-radius:10px;
}

/* بطاقات الأقسام */
.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:22px;
}

.card-link{
    text-decoration:none;
}

.card{
    min-width:280px;
    padding:35px 25px;
    border-radius:16px;
    color:white;
    font-weight:900;
    font-size:1.4rem;
    transition:0.3s;
    box-shadow:0 6px 0 rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 110px;
    cursor: pointer;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 0 rgba(0,0,0,0.15);
}

.card-blue{ background:#6eb6d1; }
.card-gold{ background:#caa230; }
.card-green{ background:#4f7f49; }

/* الفوتر */
footer{
    background:var(--beige-light);
    color:#555;
    text-align:center;
    padding:35px 15px;
    font-weight:700;
    margin-top:50px;
    border-top:2px solid var(--beige-dark);
}

/* الجوال */
@media(max-width:768px){
    .main-nav{ gap:12px; padding:15px; }
    .nav-link{ width:100%; text-align:center; padding:12px 20px; font-size:1.1rem; }
    .card{ width:100%; min-height: auto; padding:25px 20px; font-size:1.25rem; }
    .top-bar{ justify-content:center; }
    .section-title{ font-size:1.8rem; }
}
</style>
</head>

<body>

    <div class="date-info" id="current-date">جاري التحميل...</div>

</div>

<header class="site-header">
    <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
</header>

<nav class="main-nav">
    <a href="index.html" class="nav-link btn-home">الرئيسية</a>
    <a href="tafseer.html" class="nav-link btn-tafseer">التفسير</a>
    <a href="lessons.html" class="nav-link btn-audio">الصوتيات</a>
    <a href="khutab.html" class="nav-link btn-khutab">الخطب</a>
    <a href="articles.html" class="nav-link btn-articles">المقالات</a>
</nav>

<div class="container">

    <h1 class="section-title">قسم الرقائق والزهد</h1>
    <div class="title-line"></div>

    <div class="cards">

        <!-- تم إبقاء هذا الرابط ليعمل مباشرة -->
        <a href="raq_mashahed.html" class="card-link">
            <div class="card card-blue">
                <span>من مشاهد يوم القيامة</span>
            </div>
        </a>

        <!-- الروابط المتبقية تم تحويلها مؤقتاً لتعطي تنبيهاً بدلاً من خطأ 404 -->
        <a href="javascript:void(0)" onclick="comingSoon('فضائل الأعمال')" class="card-link">
            <div class="card card-green">
                <span>فضائل الأعمال</span>
            </div>
        </a>

        <a href="javascript:void(0)" onclick="comingSoon('قصص القرآن')" class="card-link">
            <div class="card card-gold">
                <span>قصص القرآن</span>
            </div>
        </a>

       <a href="raq_azkar.html" class="card-link">
    <div class="card card-blue">
        <span>أنوار الأذكار</span>
    </div>
</a>

       <a href="raq_mahba.html" class="card-link">
    <div class="card card-blue">
        <span>أسباب محبة الله</span>
    </div>
</a>

        <a href="javascript:void(0)" onclick="comingSoon('مكارم الأخلاق')" class="card-link">
            <div class="card card-blue">
                <span>مكارم الأخلاق</span>
            </div>
        </a>

      <a href="raq_ganah.html" class="card-link">
    <div class="card card-blue">
        <span>وصف الجنة ونعيمها</span>
    </div>
</a>
        
    </div>

</div>

<footer>
    جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب © 2026
</footer>

<script>
function comingSoon(sectionName) {
    alert("قسم (" + sectionName + ") سيتم تفعيله وإضافة المواد الصوتية الخاصة به قريباً بإذن الله.");
}

function updateDate(){
    const now = new Date();
    const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now);
    const miladi = new Intl.DateTimeFormat('ar-EG', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now);
    document.getElementById('current-date').innerHTML = `${hijri} هـ | ${miladi} م`;
}

async function getPrayers(){
    try{
        const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
        const data = await res.json();
        const t = data.data.timings;
        document.getElementById('prayer-api').innerHTML = `
            <div class="prayer-item"><span class="prayer-name">الفجر</span><span class="prayer-time">${t.Fajr}</span></div>
            <div class="prayer-item"><span class="prayer-name">الظهر</span><span class="prayer-time">${t.Dhuhr}</span></div>
            <div class="prayer-item"><span class="prayer-name">العصر</span><span class="prayer-time">${t.Asr}</span></div>
            <div class="prayer-item"><span class="prayer-name">المغرب</span><span class="prayer-time">${t.Maghrib}</span></div>
            <div class="prayer-item"><span class="prayer-name">العشاء</span><span class="prayer-time">${t.Isha}</span></div>`;
    }catch(e){ console.log("تعذر تحميل مواقيت الصلاة"); }
}

window.onload = () => { updateDate(); getPrayers(); };
</script>

</body>
</html>
