<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرقائق والزهد - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #f4f7f9; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
            --prayer-bg: #fdfae7;
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); color: #333; }

        /* شريط المعلومات العلوي */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; background: var(--prayer-bg); border-bottom: 2px solid var(--accent-blue); font-size: 0.85rem; }
        .date-info { font-weight: 700; color: var(--dark-blue); }
        .prayer-times { display: flex; gap: 8px; }
        .prayer-item { background: #fff; border: 1px solid #ddd; padding: 3px 10px; border-radius: 6px; text-align: center; }
        .prayer-time { font-weight: 900; color: #1b5e20; }

        /* الهيدر */
        .site-header { text-align: center; padding: 25px; background: var(--header-bg); border-bottom: 4px solid #fff; }
        .site-logo { max-width: 480px; width: 100%; height: auto; mix-blend-mode: multiply; }

        /* شريط التنقل */
        .nav-bar { display: flex; justify-content: center; gap: 12px; padding: 15px; background: #fff; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-link-3d { 
            padding: 8px 18px; background: var(--accent-blue); color: white; text-decoration: none;
            border-radius: 10px; font-weight: bold; font-size: 0.9rem;
            box-shadow: 0 4px 0 var(--dark-blue); transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .nav-link-3d:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--dark-blue); }
        .active-link { background: var(--gold-color); box-shadow: 0 4px 0 #b38f2d; }

        .section-info { text-align: center; margin: 40px 0 20px; }
        .section-title { color: var(--dark-blue); font-weight: 900; font-size: 2rem; margin: 0; border-bottom: 3px solid var(--gold-color); display: inline-block; padding-bottom: 10px; }
        .section-subtitle { color: #555; font-weight: bold; margin-top: 10px; display: block; }

        /* شبكة البطاقات */
        .series-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
            padding: 20px; 
            max-width: 1100px; 
            margin: 0 auto 60px; 
        }
        
        .series-card { 
            background: white; 
            padding: 30px 20px; 
            border-radius: 20px; 
            text-align: center; 
            text-decoration: none; 
            color: var(--dark-blue); 
            transition: 0.4s; 
            border-right: 6px solid var(--gold-color);
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px;
        }
        .series-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-right-color: var(--dark-blue); }
        .series-card i { font-size: 3rem; }
        .count { background: var(--light-sky); padding: 5px 15px; border-radius: 50px; font-size: 0.85rem; font-weight: bold; color: var(--dark-blue); border: 1px solid var(--accent-blue); }

        footer { text-align: center; padding: 35px; color: var(--dark-blue); font-weight: bold; background: #e0f2f7; margin-top: 50px; }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; gap: 10px; }
            .series-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="date-info" id="hijri-date">جاري التحميل...</div>
        <div class="prayer-times" id="prayers-header"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="nav-link-3d"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="lessons.html" class="nav-link-3d active-link"><i class="fas fa-microphone"></i> المكتبة الصوتية</a>
        <a href="books.html" class="nav-link-3d"><i class="fas fa-book-open"></i> الكتب</a>
    </nav>

    <div class="section-info">
        <h2 class="section-title">قسم الرقائق والزهد</h2>
        <span class="section-subtitle">سلاسل دروس إيمانية تلامس القلوب</span>
    </div>

    <div class="series-grid">
        <a href="raq_azkar.html" class="series-card">
            <i class="fas fa-pray" style="color: #3498db;"></i>
            <h3>أنوار الأذكار</h3>
            <span class="count">30 درساً</span>
        </a>
        <a href="raq_mahba.html" class="series-card">
            <i class="fas fa-heart" style="color: #e74c3c;"></i>
            <h3>أسباب محبة الله</h3>
            <span class="count">30 درساً</span>
        </a>
        <a href="raq_mkarem.html" class="series-card">
            <i class="fas fa-star" style="color: #f1c40f;"></i>
            <h3>مكارم الأخلاق</h3>
            <span class="count">40 درساً</span>
        </a>
        <a href="raq_ganah.html" class="series-card">
            <i class="fas fa-cloud-sun" style="color: #2ecc71;"></i>
            <h3>وصف الجنة ونعيمها</h3>
            <span class="count">15 درساً</span>
        </a>
    </div>

    <footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        // التاريخ والمواقيت
        async function initHeader() {
            const now = new Date();
            document.getElementById('hijri-date').innerText = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now) + " هـ";
            
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const d = await res.json();
                const t = d.data.timings;
                const p = [{n:"الفجر",v:t.Fajr}, {n:"الظهر",v:t.Dhuhr}, {n:"العصر",v:t.Asr}, {n:"المغرب",v:t.Maghrib}, {n:"العشاء",v:t.Isha}];
                document.getElementById('prayers-header').innerHTML = p.map(x => `<div class="prayer-item"><span class="prayer-time">${x.v}</span></div>`).join('');
            } catch(e) {}
        }
        window.onload = initHeader;
    </script>
</body>
</html>
