<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الفاتحة - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #2c5d87; 
            --accent-light-blue: #add8e6; 
            --gold: #d4af37; 
            --prayer-bg: #fdfae7; 
            --dark-green: #1b5e20;
        }

        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover; 
        }

        /* الهيدر واللوجو الشفاف */
        .site-header { 
            text-align: center; padding: 25px 0; 
            background-color: var(--accent-light-blue); 
            border-bottom: 3px solid #fff; 
        }
        .site-logo { 
            max-width: 420px; width: 85%; height: auto; display: inline-block;
            mix-blend-mode: multiply; /* لجعل الخلفية البيضاء للصور شفافة */
        }

        /* شريط التنقل الأفقي */
        .main-nav { 
            display: flex; justify-content: center; align-items: center;
            gap: 12px; padding: 12px; background: rgba(255, 255, 255, 0.95); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-wrap: nowrap; overflow-x: auto;
        }
        .nav-link { 
            text-decoration: none; padding: 8px 18px; border-radius: 8px; 
            font-weight: 700; color: white; display: flex; align-items: center; 
            gap: 8px; background: var(--primary); transition: 0.3s; font-size: 0.9rem; white-space: nowrap;
        }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px 60px; }
        
        /* صندوق الدروس */
        .main-box { background: rgba(255, 255, 255, 0.98); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .box-header { padding: 20px; background: #fff; border-right: 12px solid var(--gold); border-bottom: 2px solid #eee; font-weight: 900; color: var(--primary); font-size: 1.4rem; }

        .lesson-row { 
            padding: 15px 25px; border-bottom: 1px solid #f0f0f0; display: flex; 
            align-items: center; justify-content: space-between; gap: 20px; 
        }
        .lesson-right { flex: 1.5; font-weight: 700; color: var(--primary); }
        .audio-part { flex: 4; }
        audio { width: 100%; max-width: 700px; height: 35px; }

        /* نظام الترقيم (الصفوف) */
        .pagination { 
            display: flex; justify-content: center; align-items: center; 
            gap: 10px; padding: 20px; background: #f9f9f9; 
        }
        .page-btn { 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; 
            border-radius: 50%; border: 2px solid var(--primary); color: var(--primary); 
            font-weight: bold; cursor: pointer; transition: 0.3s; 
        }
        .page-btn.active { background: var(--primary); color: white; }
        .page-btn:hover:not(.active) { background: var(--accent-light-blue); }

        footer { text-align: center; padding: 40px; color: white; font-weight: bold; text-shadow: 1px 1px 4px #000; }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="اللوجو" class="site-logo">
    </header>

    <nav class="main-nav">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="tafseer.html" class="nav-link"><i class="fas fa-book-open"></i> التفسير</a>
        <a href="lessons.html" class="nav-link"><i class="fas fa-volume-high"></i> الصوتيات</a>
    </nav>

    <div class="container">
        <div class="main-box">
            <div class="box-header">قائمة دروس سورة الفاتحة</div>
            <div id="lessons-container">
                </div>
            <div class="pagination" id="pagination-controls">
                </div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة &copy; 2026</footer>

    <script>
        const lessons = [
            { id: 1, title: "تفسير سورة الفاتحة - الدرس 1", file: "audio/fatiha-1.mp3" },
            { id: 2, title: "تفسير سورة الفاتحة - الدرس 2", file: "audio/fatiha-2.mp3" }
            // يمكنك إضافة أي عدد من الدروس هنا وسيقوم الكود بتقسيمها تلقائياً
        ];

        const lessonsPerPage = 10; // عدد الدروس في كل صفحة
        let currentPage = 1;

        function displayLessons(page) {
            const container = document.getElementById('lessons-container');
            container.innerHTML = "";
            page--;

            let start = lessonsPerPage * page;
            let end = start + lessonsPerPage;
            let paginatedItems = lessons.slice(start, end);

            paginatedItems.forEach(item => {
                container.innerHTML += `
                    <div class="lesson-row">
                        <div class="lesson-right">${item.title}</div>
                        <div class="audio-part"><audio controls><source src="${item.file}" type="audio/mpeg"></audio></div>
                        <div><a href="${item.file}" download style="color:var(--dark-green); font-size:1.5rem;"><i class="fas fa-circle-down"></i></a></div>
                    </div>`;
            });
        }

        function setupPagination() {
            const controls = document.getElementById('pagination-controls');
            controls.innerHTML = "";
            let pageCount = Math.ceil(lessons.length / lessonsPerPage);

            if (pageCount <= 1) return; // لا تظهر الأرقام إذا كان هناك صفحة واحدة فقط

            for (let i = 1; i <= pageCount; i++) {
                let btn = document.createElement('div');
                btn.innerText = i;
                btn.classList.add('page-btn');
                if (currentPage === i) btn.classList.add('active');
                
                btn.addEventListener('click', () => {
                    currentPage = i;
                    displayLessons(currentPage);
                    setupPagination();
                });
                controls.appendChild(btn);
            }
        }

        window.onload = () => {
            displayLessons(currentPage);
            setupPagination();
        };
    </script>
</body>
</html>
