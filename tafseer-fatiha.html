<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الفاتحة - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #eef5ff;
            --main-blue: #add8e6;
            --dark-blue: #2c5d87;
            --accent-blue: #87ceeb;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(to bottom, var(--light-blue), #d0e4ff);
            min-height: 100vh;
            padding-bottom: 120px;
        }

        .site-header { 
            text-align: center; padding: 40px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }

        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; flex-wrap: wrap; }
        .nav-link { 
            padding: 8px 15px; background: var(--accent-blue); color: white; 
            text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 0 #5f9ea0; transition: 0.2s;
        }
        .nav-link:hover { transform: translateY(-2px); }

        .page-title { text-align: center; color: var(--dark-blue); margin: 30px 0; font-weight: 900; }

        .lessons-container { max-width: 800px; margin: auto; padding: 0 20px; }

        .lesson-card {
            background: white;
            margin-bottom: 25px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-right: 8px solid var(--dark-blue);
            transition: 0.3s;
        }

        .lesson-card h3 { margin: 0 0 10px 0; color: var(--dark-blue); font-size: 1.3rem; }
        .duration-tag { color: #888; font-size: 14px; display: block; margin-bottom: 15px; font-weight: bold; }

        audio { width: 100%; height: 40px; margin-bottom: 15px; }

        .download-btn {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 0 #1e8449;
        }

        .back-fixed {
            position: fixed; bottom: 25px; left: 25px;
            width: 60px; height: 60px;
            background: var(--dark-blue); color: white;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            text-decoration: none; font-size: 26px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 style="margin:0; color: var(--dark-blue); font-weight: 900;">الشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">الرئيسية</a>
        <a href="books.html" class="nav-link">الكتب</a>
        <a href="tafseer.html" class="nav-link" style="background: var(--dark-blue);">التفسير</a>
    </div>

    <h2 class="page-title">📖 تفسير سورة الفاتحة</h2>

    <div class="lessons-container" id="fatihaContainer"></div>

    <a href="tafseer.html" class="back-fixed" title="عودة">🔙</a>

    <script src="tafseerData.js"></script>

    <script>
        const container = document.getElementById("fatihaContainer");

        // التأكد من تحميل مصفوفة البيانات
        if (typeof tafseerLessons !== 'undefined') {
            // تصفية الدروس الخاصة بسورة الفاتحة فقط
            const lessons = tafseerLessons.filter(l => l.surah === "الفاتحة");

            if (lessons.length > 0) {
                lessons.forEach(lesson => {
                    container.innerHTML += `
                        <div class="lesson-card">
                            <h3>${lesson.title}</h3>
                            <span class="duration-tag">⏱ المدة: ${lesson.duration}</span>
                            <audio controls preload="none">
                                <source src="audio/${lesson.file}" type="audio/mpeg">
                                متصفحك لا يدعم مشغل الصوت.
                            </audio>
                            <br>
                            <a href="audio/${lesson.file}" download class="download-btn">📥 تحميل الدرس (MP3)</a>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = "<p style='text-align:center;'>لم يتم إضافة دروس لهذه السورة بعد.</p>";
            }
        } else {
            container.innerHTML = "<p style='text-align:center; color:red;'>خطأ: تعذر الوصول لملف البيانات tafseerData.js</p>";
        }
    </script>
</body>
</html>
