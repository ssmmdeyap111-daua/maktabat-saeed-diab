<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الفاتحة - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #eef5ff;
            --main-blue: #add8e6;
            --dark-blue: #2c5d87;
            --accent-blue: #87ceeb;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(to bottom, var(--light-blue), #d0e4ff);
            min-height: 100vh;
            padding-bottom: 120px;
        }

        .site-header { 
            text-align: center; padding: 40px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }

        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; flex-wrap: wrap; }
        .nav-link { 
            padding: 8px 15px; background: var(--accent-blue); color: white; 
            text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px;
        }

        .page-title { text-align: center; color: var(--dark-blue); margin: 30px 0; }

        /* حاوية الدروس */
        .lessons-container { max-width: 800px; margin: auto; padding: 0 20px; }

        .lesson-card {
            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-right: 6px solid var(--accent-blue);
        }

        .lesson-card h3 { margin: 0 0 10px 0; color: var(--dark-blue); font-size: 1.2rem; }
        .duration-tag { color: #888; font-size: 13px; display: block; margin-bottom: 15px; }

        audio { width: 100%; height: 35px; margin-bottom: 15px; }

        .download-btn {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 8px 18px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        /* زر العودة الثابت */
        .back-fixed {
            position: fixed; bottom: 20px; left: 20px;
            width: 55px; height: 55px;
            background: var(--dark-blue); color: white;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            text-decoration: none; font-size: 24px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 style="margin:0; color: var(--dark-blue);">الشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">الرئيسية</a>
        <a href="lessons.html" class="nav-link">الدروس</a>
        <a href="tafseer.html" class="nav-link">التفسير</a>
    </div>

    <h2 class="page-title">📖 تفسير سورة الفاتحة</h2>

    <div class="lessons-container" id="fatihaContainer">
        </div>

    <a href="tafseer.html" class="back-fixed">⬅️</a>

    <script src="tafseerData.js"></script>

    <script>
        const container = document.getElementById("fatihaContainer");

        // التأكد من أن ملف البيانات محمل
        if (typeof tafseerLessons !== 'undefined') {
            // فلترة دروس الفاتحة فقط
            const lessons = tafseerLessons.filter(l => l.surah === "الفاتحة");

            lessons.forEach(lesson => {
                container.innerHTML += `
                    <div class="lesson-card">
                        <h3>${lesson.title}</h3>
                        <span class="duration-tag">⏱ المدة: ${lesson.duration}</span>
                        <audio controls>
                            <source src="audio/${lesson.file}" type="audio/mpeg">
                        </audio>
                        <br>
                        <a href="audio/${lesson.file}" download class="download-btn">📥 تحميل الدرس</a>
                    </div>
                `;
            });
        } else {
            container.innerHTML = "<p style='text-align:center;'>عذراً، تعذر تحميل بيانات الدروس.</p>";
        }
    </script>

</body>
</html>
