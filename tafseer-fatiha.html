<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الفاتحة - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #2c5d87; 
            --accent-light-blue: #add8e6; /* اللون الأزرق الفاتح المطلوب */
            --gold: #d4af37; 
            --prayer-bg: #fdfae7; 
            --dark-green: #1b5e20;
        }

        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover; color: #333; 
        }

        /* شريط المعلومات العلوي */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 8px 30px; background: var(--prayer-bg); border-bottom: 2px solid var(--accent-light-blue); 
        }
        .date-info { font-weight: 700; color: var(--primary); font-size: 0.95rem; }
        .prayer-times { display: flex; gap: 10px; }
        .prayer-item { background: white; border: 1px solid #ddd; padding: 4px 10px; border-radius: 6px; text-align: center; }
        .prayer-name { display: block; font-size: 0.7rem; color: #666; font-weight: bold; }
        .prayer-time { font-weight: 900; color: var(--dark-green); font-size: 0.85rem; }

        /* الهيدر باللون الأزرق الفاتح الموحد */
        .site-header { 
            text-align: center; 
            padding: 25px 0; 
            background-color: var(--accent-light-blue); /* تطبيق اللون هنا */
            border-bottom: 3px solid #fff; 
        }
        .site-logo { 
            max-width: 450px; 
            width: 90%; 
            height: auto; 
            display: inline-block;
            /* للتأكد من ظهور اللوجو حتى لو كانت خلفيته بيضاء */
            mix-blend-mode: multiply; 
        }

        /* شريط التنقل الأفقي */
        .main-nav { 
            display: flex; justify-content: center; align-items: center;
            gap: 12px; padding: 12px; background: rgba(255, 255, 255, 0.95); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-wrap: nowrap; overflow-x: auto;
        }
        .nav-link { 
            text-decoration: none; padding: 8px 18px; border-radius: 8px; 
            font-weight: 700; color: white; display: flex; align-items: center; 
            gap: 8px; background: var(--primary); transition: 0.3s; font-size: 0.9rem; white-space: nowrap;
        }
        .nav-link:hover { transform: translateY(-3px); filter: brightness(1.2); }
        .nav-gold { background: var(--gold); }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px 60px; }
        .page-title { 
            text-align: center; color: white; font-weight: 900; font-size: 2.2rem; 
            margin-bottom: 35px; background: rgba(44, 93, 135, 0.85); 
            display: block; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* صندوق الدروس */
        .main-box { background: rgba(255, 255, 255, 0.98); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid #ddd; }
        .box-header { padding: 20px 30px; background: #fff; border-right: 12px solid var(--gold); border-bottom: 2px solid #eee; display: flex; align-items: center; gap: 20px; }
        .box-header span { font-weight: 900; color: var(--primary); font-size: 1.5rem; }

        .lesson-row { 
            padding: 18px 30px; border-bottom: 1px solid #f0f0f0; display: flex; 
            align-items: center; justify-content: space-between; gap: 30px; 
        }
        .lesson-row:hover { background: #f8fbff; border-right: 6px solid var(--primary); }
        .lesson-right { flex: 1.5; display: flex; align-items: center; gap: 15px; color: var(--primary); font-weight: 800; font-size: 1.1rem; }
        
        .audio-part { flex: 4; display: flex; justify-content: center; }
        audio { width: 100%; max-width: 800px; height: 42px; }

        .download-side { flex: 0.3; text-align: left; }
        .btn-download { color: var(--dark-green); font-size: 1.8rem; text-decoration: none; transition: 0.3s; }

        footer { text-align: center; padding: 40px; color: white; font-weight: bold; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }

        /* التجاوب للجوال */
        @media (max-width: 900px) {
            .lesson-row { flex-direction: column; text-align: center; gap: 15px; }
            .audio-part { width: 100%; }
            .main-nav { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="date-info" id="current-date"></div>
        <div class="prayer-times" id="prayer-api"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="main-nav">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="tafseer.html" class="nav-link nav-gold"><i class="fas fa-book-open"></i> فهرس التفسير</a>
        <a href="khutab.html" class="nav-link"><i class="fas fa-microphone-lines"></i> الخطب</a>
        <a href="lessons.html" class="nav-link"><i class="fas fa-volume-high"></i> الصوتيات</a>
        <a href="books.html" class="nav-link"><i class="fas fa-book"></i> الكتب</a>
        <a href="articles.html" class="nav-link"><i class="fas fa-pen-nib"></i> المقالات</a>
    </nav>

    <div class="container">
        <h1 class="page-title">تفسير سورة الفاتحة</h1>

        <div class="main-box">
            <div class="box-header">
                <i class="fas fa-play-circle" style="color: var(--gold); font-size: 2rem;"></i>
                <span>قائمة المحاضرات</span>
            </div>

            <div id="fatiha-list">
                </div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        function updateDate() {
            const now = new Date();
            const h = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now);
            const m = new Intl.DateTimeFormat('ar-EG', {day:'numeric', month:'long', year:'numeric'}).format(now);
            document.getElementById('current-date').innerText = `${h} هـ | ${m} م`;
        }

        async function getPrayers() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const data = await res.json();
                const t = data.data.timings;
                const prayers = [{n:"الفجر", v:t.Fajr}, {n:"الظهر", v:t.Dhuhr}, {n:"العصر", v:t.Asr}, {n:"المغرب", v:t.Maghrib}, {n:"العشاء", v:t.Isha}];
                document.getElementById('prayer-api').innerHTML = prayers.map(p => `
                    <div class="prayer-item"><span class="prayer-name">${p.n}</span><span class="prayer-time">${p.v}</span></div>
                `).join('');
            } catch (e) { }
        }

        // وظيفة عرض دروس سورة الفاتحة (درسان)
        function renderFatiha() {
            const list = document.getElementById('fatiha-list');
            list.innerHTML = "";
            for (let i = 1; i <= 2; i++) {
                list.innerHTML += `
                    <div class="lesson-row">
                        <div class="lesson-right">
                            <i class="fas fa-play-circle" style="color: var(--gold)"></i>
                            <span>تفسير سورة الفاتحة - الدرس ${i}</span>
                        </div>
                        <div class="audio-part">
                            <audio controls preload="none">
                                <source src="audio/fatiha-${i}.mp3" type="audio/mpeg">
                            </audio>
                        </div>
                        <div class="download-side">
                            <a href="audio/fatiha-${i}.mp3" download class="btn-download"><i class="fas fa-circle-down"></i></a>
                        </div>
                    </div>`;
            }
        }

        // تشغيل كل شيء عند تحميل الصفحة
        window.addEventListener('load', () => {
            updateDate();
            getPrayers();
            renderFatiha();
        });
    </script>
</body>
</html>
