<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير القرآن الكريم - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #2c5d87; --accent-blue: #87ceeb; --gold: #d4af37; 
            --prayer-bg: #fdfae7; --dark-green: #1b5e20;
            --header-gradient: linear-gradient(to right, #add8e6, #e0f2f7);
        }

        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover; color: #333; 
        }

        /* إصلاح شريط المعلومات العلوي */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 8px 30px; background: var(--prayer-bg); border-bottom: 2px solid var(--accent-blue); 
        }
        .date-info { font-weight: 700; color: var(--primary); font-size: 0.95rem; }
        .prayer-times { display: flex; gap: 10px; }
        .prayer-item { background: white; border: 1px solid #ddd; padding: 4px 10px; border-radius: 6px; text-align: center; }
        .prayer-name { display: block; font-size: 0.7rem; color: #666; font-weight: bold; }
        .prayer-time { font-weight: 900; color: var(--dark-green); font-size: 0.85rem; }

        /* إصلاح الهيدر واللوجو */
        .site-header { text-align: center; padding: 20px 0; background: var(--header-gradient); border-bottom: 3px solid #fff; }
        .site-logo { max-width: 450px; width: 90%; height: auto; mix-blend-mode: multiply; }

        /* إصلاح شريط التنقل (الأيقونات) ليكون أفقياً */
        .main-nav { 
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 12px; 
            padding: 12px; 
            background: rgba(255, 255, 255, 0.95); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .nav-link { 
            text-decoration: none; 
            padding: 8px 18px; 
            border-radius: 8px; 
            font-weight: 700; 
            color: white; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            background: var(--primary); 
            transition: 0.3s;
            font-size: 0.9rem;
            white-space: nowrap; /* يمنع نزول النص لسطر جديد */
        }
        .nav-link i { font-size: 1.1rem; }
        .nav-link:hover { transform: translateY(-3px); filter: brightness(1.2); }
        .nav-gold { background: var(--gold); }

        /* حاوية الدروس */
        .container { max-width: 1300px; margin: 30px auto; padding: 0 20px 60px; }
        .page-title { 
            text-align: center; color: white; font-weight: 900; font-size: 2rem; 
            margin-bottom: 30px; background: rgba(44, 93, 135, 0.9); 
            padding: 15px; border-radius: 12px;
        }

        .main-box { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .box-header { padding: 20px 30px; background: #fcfcfc; border-right: 10px solid var(--gold); border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px; }
        .box-header span { font-weight: 900; color: var(--primary); font-size: 1.4rem; }

        /* تنسيق الأسطر وتوسيع الصوت */
        .lesson-row { 
            padding: 15px 30px; border-bottom: 1px solid #f5f5f5; display: flex; 
            align-items: center; justify-content: space-between; gap: 20px; 
        }
        .lesson-right { flex: 1.5; display: flex; align-items: center; gap: 12px; color: var(--primary); font-weight: 700; }
        .audio-part { flex: 4; display: flex; justify-content: center; }
        audio { width: 100%; max-width: 750px; height: 38px; }
        .download-side { flex: 0.5; text-align: left; }
        .btn-download { color: var(--dark-green); font-size: 1.7rem; transition: 0.3s; }

        @media (max-width: 850px) {
            .main-nav { flex-wrap: wrap; }
            .lesson-row { flex-direction: column; text-align: center; }
            .audio-part { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="date-info" id="current-date"></div>
        <div class="prayer-times" id="prayer-api"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="main-nav">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="tafseer.html" class="nav-link nav-gold"><i class="fas fa-book-open"></i> فهرس التفسير</a>
        <a href="khutab.html" class="nav-link"><i class="fas fa-microphone-lines"></i> الخطب</a>
        <a href="lessons.html" class="nav-link"><i class="fas fa-volume-high"></i> الصوتيات</a>
        <a href="books.html" class="nav-link"><i class="fas fa-book"></i> الكتب</a>
        <a href="articles.html" class="nav-link"><i class="fas fa-pen-nib"></i> المقالات</a>
    </nav>

    <div class="container">
        <h1 class="page-title">تفسير سورة آل عمران</h1> <div class="main-box">
            <div class="box-header">
                <i class="fas fa-play-circle" style="color: var(--gold); font-size: 1.8rem;"></i>
                <span>قائمة المحاضرات</span>
            </div>

            <div id="lessons-area">
                </div>
        </div>
    </div>

    <script>
        // كود التاريخ والمواقيت
        function updateDate() {
            const now = new Date();
            const h = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now);
            const m = new Intl.DateTimeFormat('ar-EG', {day:'numeric', month:'long', year:'numeric'}).format(now);
            document.getElementById('current-date').innerText = `${h} هـ | ${m} م`;
        }
        async function getPrayers() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const data = await res.json();
                const t = data.data.timings;
                const prayers = [{n:"الفجر", v:t.Fajr}, {n:"الظهر", v:t.Dhuhr}, {n:"العصر", v:t.Asr}, {n:"المغرب", v:t.Maghrib}, {n:"العشاء", v:t.Isha}];
                document.getElementById('prayer-api').innerHTML = prayers.map(p => `
                    <div class="prayer-item"><span class="prayer-name">${p.n}</span><span class="prayer-time">${p.v}</span></div>
                `).join('');
            } catch (e) { }
        }
        updateDate(); getPrayers();
    </script>
</body>
</html>
