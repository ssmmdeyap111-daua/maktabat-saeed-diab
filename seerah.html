<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السيرة النبوية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --gold: #d4af37; --bg: #f4f7f9; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); }
        .site-header { background: white; padding: 30px; text-align: center; border-bottom: 4px solid var(--primary); }
        .series-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .series-card { background: white; padding: 30px; border-radius: 20px; text-align: center; text-decoration: none; color: var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid #eee; }
        .series-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .series-card i { font-size: 4rem; color: var(--gold); margin-bottom: 20px; display: block; }
        .series-card h3 { margin: 0; font-size: 1.5rem; font-weight: 900; }
        .count { background: #f0f4f8; padding: 5px 15px; border-radius: 50px; font-size: 0.9rem; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>
<header class="site-header"><h1>قسم السيرة النبوية</h1></header>
<div style="text-align:center; padding:20px;"><a href="lessons.html" style="text-decoration:none; color:var(--primary); font-weight:bold;"><i class="fas fa-arrow-right"></i> العودة للفهرس العام</a></div>

<div class="series-grid">
    <a href="seerah_lessons.html" class="series-card">
        <i class="fas fa-mosque"></i>
        <h3>السيرة النبوية المطهرة</h3>
        <span class="count">30 درساً</span>
    </a>
</div>
</body>
</html>
