<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علم الفرائض - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --light-blue: #e3effb;
            --dark-blue: #2c5d87;
            --gold: #b59410;
            --bg-body: #f8fafc;
            --success-green: #2ecc71;
        }

        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: var(--bg-body); color: #333; }

        /* الهيدر */
        .site-header { background: var(--light-blue); padding: 50px 20px; text-align: center; border-bottom: 5px solid var(--dark-blue); }
        .site-header h1 { font-size: 2.3rem; color: var(--dark-blue); margin: 0; font-weight: 900; }

        /* شريط التنقل */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-3d { 
            padding: 10px 25px; color: var(--dark-blue); text-decoration: none; font-weight: bold; 
            border-radius: 8px; background: #fff; border: 1px solid #ddd; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-3d:hover { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }

        /* الأكورديون */
        .accordion-item {
            background: white; border-radius: 12px; margin-bottom: 20px;
            border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden;
        }

        .accordion-header {
            padding: 22px 25px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            background: #fff; transition: 0.3s; border-right: 6px solid var(--gold);
        }
        .accordion-header:hover { background: #f0f7ff; }
        .accordion-header span { font-weight: 900; color: var(--dark-blue); font-size: 1.3rem; display: flex; align-items: center; gap: 12px; }
        .accordion-header i.fa-chevron-down { transition: 0.3s; color: #cbd5e1; }

        .accordion-content { display: none; padding: 20px; background: #fafbfc; border-top: 1px solid #eee; }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: var(--light-blue); }
        .active .accordion-header i.fa-chevron-down { transform: rotate(180deg); color: var(--dark-blue); }

        /* قائمة الدروس */
        .lessons-list { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 12px; 
        }
        
        .lesson-card {
            background: white; padding: 15px 20px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #edf2f7; transition: 0.2s;
        }
        .lesson-card:hover { border-color: var(--gold); background: #fffdf5; }
        .lesson-card span { font-weight: bold; color: #475569; font-size: 1.1rem; }

        .audio-group { display: flex; align-items: center; gap: 15px; }
        audio { height: 32px; width: 180px; }

        .dl-icon { 
            color: var(--success-green); text-decoration: none; font-size: 1.3rem; 
            transition: 0.2s; padding: 5px;
        }
        .dl-icon:hover { color: var(--dark-blue); transform: translateY(-2px); }

        footer { text-align: center; padding: 60px 20px; color: #94a3b8; font-weight: bold; }

        /* توافق الجوال */
        @media (max-width: 650px) {
            .lesson-card { flex-direction: column; gap: 15px; text-align: center; }
            .audio-group { width: 100%; flex-direction: column; }
            audio { width: 100%; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>علم الفرائض والمواريث</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-3d"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="lessons.html" class="btn-3d"><i class="fas fa-arrow-right"></i> فهرس الدروس</a>
</div>

<div class="container">
    <div class="accordion-item">
        <div class="accordion-header" onclick="toggleAccordion(this)">
            <span><i class="fas fa-balance-scale"></i> شرح متن الرحبية (11 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div class="lessons-list" id="rahpiah-list"></div>
        </div>
    </div>
</div>

<script>
    function toggleAccordion(header) {
        header.parentElement.classList.toggle('active');
    }

    function generateLessons(id, prefix, count) {
        const container = document.getElementById(id);
        if (!container) return;
        
        let html = '';
        for (let i = 1; i <= count; i++) {
            // التعديل المطلوب: Prefix ملتصق بالرقم مباشرة al-rhapih1.mp3
            const fileUrl = `audio/${prefix}${i}.mp3`;
            html += `
            <div class="lesson-card">
                <span>الدرس ${i}</span>
                <div class="audio-group">
                    <audio controls preload="none">
                        <source src="${fileUrl}" type="audio/mpeg">
                        متصفحك لا يدعم الصوت.
                    </audio>
                    <a href="${fileUrl}" download class="dl-icon" title="تحميل الدرس">
                        <i class="fas fa-cloud-download-alt"></i>
                    </a>
                </div>
            </div>`;
        }
        container.innerHTML = html;
    }

    window.addEventListener('DOMContentLoaded', () => {
        // البريفكس al-rhapih لينتج al-rhapih1.mp3, al-rhapih2.mp3...
        generateLessons('rahpiah-list', 'al-rhapih', 11);
    });
</script>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
