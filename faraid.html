<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفرائض - الشيخ سعيد مصطفى دياب</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<!-- الهيدر -->
<script>
fetch('header.html')
  .then(response => response.text())
  .then(data => {
    document.body.insertAdjacentHTML('afterbegin', data);
  });
</script>

<div id="content">

<div class="section-title">
    <h2>الفرائض</h2>
</div>

<div class="container">

    <!-- شرح الرحبية -->
    <div class="accordion-item">
        <div class="accordion-header" onclick="toggleAccordion(this)">
            <span><i class="fas fa-book-open"></i> شرح متن الرحبية (11 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div class="lessons-list" id="rahbiya-list"></div>
        </div>
    </div>

</div>
</div>

<script>
function toggleAccordion(header) {
    header.parentElement.classList.toggle('active');
}

function generate(id, prefix, count) {
    const container = document.getElementById(id);
    let html = '';
    for (let i = 1; i <= count; i++) {
        html += `
        <div class="lesson-card">
            <span>الدرس ${i}</span>
            <audio controls preload="none">
                <source src="audio/${prefix}-${i}.mp3" type="audio/mpeg">
            </audio>
            <a href="audio/${prefix}-${i}.mp3" download class="download-btn">
                <i class="fas fa-download"></i>
            </a>
        </div>`;
    }
    container.innerHTML = html;
}

generate('rahbiya-list', 'rahbiya', 11);
</script>

<footer class="main-footer">
جميع الحقوق محفوظة © 2026
</footer>

</body>
</html>
