<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علم الفرائض والمواريث - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #f4f7f9; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
            --prayer-bg: #fdfae7;
        }

        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); color: #333; }

        /* شريط المعلومات العلوي */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; background: var(--prayer-bg); border-bottom: 2px solid var(--accent-blue); }
        .date-info { font-weight: 700; color: var(--dark-blue); font-size: 0.9rem; }
        .prayer-times { display: flex; gap: 8px; }
        .prayer-item { background: white; border: 1px solid #ddd; padding: 5px 12px; border-radius: 8px; text-align: center; min-width: 60px; }
        .prayer-name { display: block; font-size: 0.75rem; color: #666; font-weight: bold; }
        .prayer-time { font-weight: 900; color: #1b5e20; font-size: 0.9rem; }

        /* الهيدر */
      <header class="site-header">
    <img src="images/logo.png" alt="فضيلة الشيخ سعيد مصطفى دياب" class="site-logo">
</header>

        /* شريط التنقل */
        .main-nav { display: flex; justify-content: center; gap: 10px; padding: 15px; background: #fff; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-item {
            padding: 10px 20px; background: var(--accent-blue); color: white; text-decoration: none;
            border-radius: 10px; font-weight: bold; font-size: 0.9rem;
            box-shadow: 0 4px 0 var(--dark-blue); transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .nav-item:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--dark-blue); filter: brightness(1.05); }
        .nav-gold { background: var(--gold-color); box-shadow: 0 4px 0 #8c6d1a; }

        /* الحاوية */
        .container { max-width: 1050px; margin: 40px auto; padding: 0 20px 60px; }
        .page-title { text-align: center; color: var(--dark-blue); font-weight: 900; margin-bottom: 30px; font-size: 2rem; }

        /* الأكورديون */
        .accordion-item { background: white; border-radius: 15px; margin-bottom: 20px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .accordion-header { padding: 22px 28px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-right: 8px solid var(--gold-color); transition: 0.3s; }
        .accordion-header span { font-weight: 800; color: var(--dark-blue); font-size: 1.25rem; display: flex; align-items: center; gap: 12px; }
        .accordion-content { display: none; padding: 20px; background: #fcfdfe; border-top: 1px solid #eee; }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: #f0f8ff; border-right-color: var(--dark-blue); }

        /* تنسيق الدروس */
        .lesson-row { 
            background: white; border: 1px solid #edf2f7; border-radius: 10px; 
            padding: 12px 20px; margin-bottom: 10px; display: flex; 
            align-items: center; justify-content: space-between; gap: 15px;
        }
        .lesson-right { flex: 1.5; display: flex; align-items: center; gap: 12px; color: var(--dark-blue); font-weight: 700; font-size: 1rem; }
        .audio-player { flex: 2; display: flex; justify-content: center; }
        audio { width: 100%; height: 35px; }
        .download-left { flex: 0.5; text-align: left; }
        .btn-download { color: #27ae60; font-size: 1.6rem; text-decoration: none; transition: 0.3s; }
        .btn-download:hover { transform: scale(1.1); color: var(--dark-blue); }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .page-num { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; font-weight: bold; background: #fff; border: 1px solid #ddd; color: var(--dark-blue); }
        .page-num.active { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

        footer { text-align: center; padding: 40px; background: #e0f2f7; color: var(--dark-blue); font-weight: bold; margin-top: 50px; }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; gap: 10px; }
            .lesson-row { flex-direction: column; text-align: center; }
            .lesson-right { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="date-info" id="current-date">جاري التحميل...</div>
    <div class="prayer-times" id="prayer-api"></div>
</div>

<header class="site-header">
    <img src="images/logo.png" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
</header>

<nav class="main-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="lessons.html" class="nav-item"><i class="fas fa-microphone"></i> الصوتيات</a>
    <a href="khutab.html" class="nav-item"><i class="fas fa-bullhorn"></i> الخطب</a>
    <a href="books.html" class="nav-item nav-gold"><i class="fas fa-book"></i> الكتب</a>
    <a href="articles.html" class="nav-item"><i class="fas fa-pen-nib"></i> المقالات</a>
</nav>

<div class="container">
    <h1 class="page-title">علم الفرائض والمواريث</h1>

    <div class="accordion-item" id="item-rahpiah">
        <div class="accordion-header" onclick="toggleAccordion('rahpiah')">
            <span><i class="fas fa-balance-scale"></i> شرح متن الرحبية (11 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div id="rahpiah-list"></div>
            <div class="pagination" id="rahpiah-pagination"></div>
        </div>
    </div>
</div>

<footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

<script>
    // التاريخ الهجري
    const dateDisplay = document.getElementById('current-date');
    dateDisplay.innerText = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}).format(new Date()) + " هـ";

    // مواقيت الصلاة (الدوحة)
    async function getPrayers() {
        try {
            const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
            const data = await response.json();
            const t = data.data.timings;
            const prayers = [{n: "الفجر", v: t.Fajr}, {n: "الظهر", v: t.Dhuhr}, {n: "العصر", v: t.Asr}, {n: "المغرب", v: t.Maghrib}, {n: "العشاء", v: t.Isha}];
            document.getElementById('prayer-api').innerHTML = prayers.map(p => `
                <div class="prayer-item"><span class="prayer-name">${p.n}</span><span class="prayer-time">${p.v}</span></div>
            `).join('');
        } catch (e) { }
    }
    getPrayers();

    // نظام الدروس
    const books = {
        rahpiah: { prefix: 'al-rhapih', count: 11, currentPage: 1 }
    };
    const lessonsPerPage = 12;

    function toggleAccordion(bookKey) {
        const item = document.getElementById('item-' + bookKey);
        const isActive = item.classList.contains('active');
        document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
        if (!isActive) {
            item.classList.add('active');
            renderBook(bookKey);
        }
    }

    function renderBook(key) {
        const book = books[key];
        const listContainer = document.getElementById(key + '-list');
        const pagContainer = document.getElementById(key + '-pagination');
        listContainer.innerHTML = "";
        const start = (book.currentPage - 1) * lessonsPerPage;
        const end = Math.min(start + lessonsPerPage, book.count);

        for (let i = start + 1; i <= end; i++) {
            const fileUrl = `audio/${book.prefix}${i}.mp3`;
            listContainer.innerHTML += `
                <div class="lesson-row">
                    <div class="lesson-right">
                        <i class="fas fa-book-open-reader" style="color:var(--gold-color)"></i>
                        <span class="lesson-name">شرح الرحبية - الدرس رقم (${i})</span>
                    </div>
                    <div class="audio-player">
                        <audio controls preload="none"><source src="${fileUrl}" type="audio/mpeg"></audio>
                    </div>
                    <div class="download-left">
                        <a href="${fileUrl}" download class="btn-download" title="تحميل الملف">
                            <i class="fas fa-file-arrow-down"></i>
                        </a>
                    </div>
                </div>`;
        }

        pagContainer.innerHTML = "";
        const pageCount = Math.ceil(book.count / lessonsPerPage);
        if (pageCount > 1) {
            for (let p = 1; p <= pageCount; p++) {
                const btn = document.createElement('div');
                btn.className = `page-num ${p === book.currentPage ? 'active' : ''}`;
                btn.innerText = p;
                btn.onclick = (e) => { e.stopPropagation(); book.currentPage = p; renderBook(key); };
                pagContainer.appendChild(btn);
            }
        }
    }
    window.onload = () => toggleAccordion('rahpiah');
</script>

</body>
</html>
