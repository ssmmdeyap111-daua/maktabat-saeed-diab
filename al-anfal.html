<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الأنفال - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --gold: #b59410; --white: rgba(255, 255, 255, 0.98); }
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; 
            background: #2c5d87 url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }
        .site-header { 
            background: rgba(255, 255, 255, 0.95); padding: 25px; text-align: center; 
            border-bottom: 4px solid var(--primary); backdrop-filter: blur(5px);
        }
        .nav-bar { 
            display: flex; justify-content: center; gap: 15px; padding: 15px; 
            background: rgba(255, 255, 255, 0.85); border-bottom: 1px solid #ddd;
        }
        .btn-link { 
            padding: 8px 15px; border: 1px solid var(--primary); border-radius: 8px; 
            text-decoration: none; color: var(--primary); font-weight: bold; background: white; transition: 0.3s;
        }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        
        .lessons-table-card {
            background: var(--white); border-radius: 15px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .table-header { background: var(--primary); color: white; padding: 20px; text-align: center; font-size: 1.5rem; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; color: var(--primary); padding: 15px; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; text-align: center; }
        tr:hover { background: #f1f5f9; }

        .audio-player { width: 200px; height: 35px; vertical-align: middle; }
        
        .btn-download { 
            color: var(--gold); text-decoration: none; font-size: 1.2rem; transition: 0.3s;
        }
        .btn-download:hover { color: var(--primary); transform: scale(1.2); }

        .lesson-name { text-align: right; font-weight: bold; color: #333; padding-right: 25px; }

        footer { text-align: center; padding: 40px; color: white; text-shadow: 2px 2px 4px black; }
    </style>
</head>
<body>

<header class="site-header">
    <h1 style="margin:0; color:var(--primary);">تفسير سورة الأنفال</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link">الرئيسية</a>
    <a href="lessons.html" class="btn-link">الفهرس العام</a>
    <a href="tafseer.html" class="btn-link">قسم التفسير</a>
</div>

<div class="container">
    <div class="lessons-table-card">
        <div class="table-header"><i class="fas fa-book-quran"></i> قائمة دروس سورة الأنفال</div>
        <table>
            <thead>
                <tr>
                    <th>اسم الدرس</th>
                    <th>استماع</th>
                    <th>تحميل</th>
                </tr>
            </thead>
            <tbody id="lessons-list">
                </tbody>
        </table>
    </div>
</div>

<footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

<script>
    // توليد الدروس الـ 16 تلقائياً لتسهيل الكود
    const lessonsList = document.getElementById('lessons-list');
    for (let i = 1; i <= 16; i++) {
        const row = `
            <tr>
                <td class="lesson-name">تفسير سورة الأنفال - الدرس ${i}</td>
                <td>
                    <audio controls class="audio-player">
                        <source src="audio/al-anfal-${i}.mp3" type="audio/mpeg">
                    </audio>
                </td>
                <td>
                    <a href="audio/al-anfal-${i}.mp3" download class="btn-download">
                        <i class="fas fa-file-download"></i>
                    </a>
                </td>
            </tr>
        `;
        lessonsList.innerHTML += row;
    }
</script>
</body>
</html>
