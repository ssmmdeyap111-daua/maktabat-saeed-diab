
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الأنفال - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --gold: #b59410; --white: rgba(255, 255, 255, 0.95); }
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; 
            background: #2c5d87 url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }
        .site-header { 
            background: rgba(255, 255, 255, 0.95); padding: 25px; text-align: center; 
            border-bottom: 4px solid var(--primary); backdrop-filter: blur(5px);
        }
        .nav-bar { 
            display: flex; justify-content: center; gap: 20px; padding: 10px; 
            background: rgba(255, 255, 255, 0.85); border-bottom: 1px solid #ddd;
        }
        .btn-link { 
            padding: 8px 20px; border: 1px solid var(--primary); border-radius: 8px; 
            text-decoration: none; color: var(--primary); font-weight: bold; transition: 0.3s;
        }
        .btn-link:hover { background: var(--primary); color: white; }

        .container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        
        .lesson-card {
            background: var(--white); border-radius: 15px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-right: 8px solid var(--gold);
        }
        .lesson-title { color: var(--primary); font-size: 1.8rem; margin-bottom: 20px; font-weight: 900; }
        
        .audio-player { width: 100%; margin: 20px 0; border-radius: 10px; background: #f1f3f4; }
        
        .download-box { margin-top: 20px; text-align: left; }
        .btn-download { 
            display: inline-flex; align-items: center; gap: 10px; 
            background: var(--primary); color: white; padding: 12px 25px; 
            border-radius: 50px; text-decoration: none; font-weight: bold; transition: 0.3s;
        }
        .btn-download:hover { background: var(--gold); transform: scale(1.05); }

        footer { text-align: center; padding: 40px; color: white; text-shadow: 2px 2px 4px black; }
    </style>
</head>
<body>

<header class="site-header">
    <h1 style="margin:0; color:var(--primary);">تفسير القرآن الكريم</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link">الرئيسية</a>
    <a href="lessons.html" class="btn-link">الفهرس العام</a>
    <a href="tafseer.html" class="btn-link">قسم التفسير</a>
</div>

<div class="container">
    <div class="lesson-card">
        <div class="lesson-title">
            <i class="fas fa-book-quran"></i> تفسير سورة الأنفال
        </div>
        
        <p style="color: #555; font-size: 1.1rem;">استمع للدرس أو قم بتحميله عبر الروابط أدناه:</p>

        <audio controls class="audio-player">
            <source src="audio/al-anfal-1.mp3" type="audio/mpeg">
            متصفحك لا يدعم مشغل الصوت.
        </audio>

        <div class="download-box">
            <a href="audio/al-anfal-1.mp3" download class="btn-download">
                <i class="fas fa-cloud-download-alt"></i> تحميل ملف MP3
            </a>
        </div>
    </div>
</div>

<footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>
</body>
</html>
