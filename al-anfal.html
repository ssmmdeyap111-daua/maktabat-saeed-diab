<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الأنفال - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --gold: #27ae60; --bg: #f4f7f9; }
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: #333; 
        }
        .site-header { 
            background: white; padding: 20px; text-align: center; border-bottom: 3px solid var(--primary); 
        }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; }
        
        /* تنسيق بطاقة الدرس الواحد */
        .lesson-card {
            background: white; border-radius: 10px; padding: 10px 20px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; border: 1px solid #e0e6ed;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        
        .lesson-info { display: flex; align-items: center; gap: 10px; order: 3; width: 150px; justify-content: flex-end; }
        .lesson-info h3 { margin: 0; font-size: 0.95rem; color: var(--primary); }
        .lesson-info i { color: #ccc; font-size: 0.8rem; }

        .audio-wrapper { flex-grow: 1; display: flex; justify-content: center; order: 2; }
        audio { width: 90%; height: 35px; }

        .download-wrapper { order: 1; width: 50px; }
        .btn-down { 
            color: var(--gold); font-size: 1.2rem; transition: 0.3s; 
            display: inline-block; padding: 5px;
        }
        .btn-down:hover { transform: scale(1.1); }

        /* أرقام الصفحات */
        .pagination { 
            display: flex; justify-content: center; gap: 8px; margin-top: 30px; padding-bottom: 40px;
        }
        .page-num { 
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
            border: 1px solid #ddd; border-radius: 4px; text-decoration: none; color: var(--primary);
            background: white; font-weight: bold; font-size: 0.9rem;
        }
        .page-num.active { background: var(--primary); color: white; border-color: var(--primary); }
        .page-num:hover:not(.active) { background: #f0f4f8; }

        @media (max-width: 768px) {
            .lesson-card { flex-direction: column; gap: 15px; text-align: center; }
            .lesson-info, .audio-wrapper, .download-wrapper { width: 100%; order: unset; justify-content: center; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h2 style="margin:0; color:var(--primary);">تفسير سورة الأنفال</h2>
</header>

<div class="container">
    <div id="lessons-container">
        <div class="lesson-card">
            <div class="lesson-info"><h3>الدرس رقم 1</h3><i class="fas fa-file-audio"></i></div>
            <div class="audio-wrapper"><audio controls preload="none"><source src="audio/al-anfal-1.mp3" type="audio/mpeg"></audio></div>
            <div class="download-wrapper"><a href="audio/al-anfal-1.mp3" download class="btn-down"><i class="fas fa-cloud-download-alt"></i></a></div>
        </div>

        <div class="lesson-card">
            <div class="lesson-info"><h3>الدرس رقم 2</h3><i class="fas fa-file-audio"></i></div>
            <div class="audio-wrapper"><audio controls preload="none"><source src="audio/al-anfal-2.mp3" type="audio/mpeg"></audio></div>
            <div class="download-wrapper"><a href="audio/al-anfal-2.mp3" download class="btn-down"><i class="fas fa-cloud-download-alt"></i></a></div>
        </div>

        <div class="lesson-card">
            <div class="lesson-info"><h3>الدرس رقم 12</h3><i class="fas fa-file-audio"></i></div>
            <div class="audio-wrapper"><audio controls preload="none"><source src="audio/al-anfal-12.mp3" type="audio/mpeg"></audio></div>
            <div class="download-wrapper"><a href="audio/al-anfal-12.mp3" download class="btn-down"><i class="fas fa-cloud-download-alt"></i></a></div>
        </div>
    </div>

    <div class="pagination">
        <a href="al-anfal-p2.html" class="page-num">2</a>
        <a href="#" class="page-num active">1</a>
    </div>
</div>

<footer style="text-align:center; padding: 20px; font-size: 0.8rem; color: #888;">
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
