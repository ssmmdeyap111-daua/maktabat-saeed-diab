<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الأنفال - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #2c5d87; 
            --accent-blue: #add8e6; 
            --gold: #d4af37; 
            --prayer-bg: #fdfae7; 
            --dark-green: #1b5e20;
        }

        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: #f4f7f9; color: #333; 
        }

        /* شريط المعلومات العلوي */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 8px 30px; background: var(--prayer-bg); border-bottom: 2px solid var(--accent-blue); 
        }
        .date-info { font-weight: 700; color: var(--primary); font-size: 0.9rem; }
        .prayer-times { display: flex; gap: 8px; }
        .prayer-item { background: white; border: 1px solid #ddd; padding: 4px 8px; border-radius: 6px; text-align: center; }
        .prayer-name { display: block; font-size: 0.65rem; color: #666; font-weight: bold; }
        .prayer-time { font-weight: 900; color: var(--dark-green); font-size: 0.8rem; }

        /* الهيدر واللوجو */
        .site-header { 
            text-align: center; padding: 20px 0; 
            background-color: var(--accent-blue); 
            border-bottom: 4px solid #fff; 
        }
        .site-logo { 
            max-width: 420px; width: 90%; height: auto; 
            display: inline-block;
            mix-blend-mode: multiply;
        }

        /* شريط التنقل */
        .main-nav { 
            display: flex; justify-content: center; align-items: center; gap: 10px; padding: 12px; 
            background: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            flex-wrap: nowrap; overflow-x: auto; 
        }
        .nav-link { 
            text-decoration: none; padding: 8px 15px; border-radius: 8px; font-weight: 700; color: white; 
            display: flex; align-items: center; gap: 6px; background: var(--primary); transition: 0.3s; 
            font-size: 0.85rem; white-space: nowrap;
        }
        .nav-link:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .nav-gold { background: var(--gold); }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px 60px; }
        .page-title { 
            text-align: center; color: var(--primary); font-weight: 900; 
            font-size: 2.2rem; margin-bottom: 30px; 
        }

        /* تنسيق صفوف الدروس */
        .lesson-row { 
            background: white; border-radius: 12px; padding: 15px 25px; 
            margin-bottom: 12px; display: flex; align-items: center; 
            justify-content: space-between; gap: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee;
            border-right: 8px solid var(--gold);
        }
        .lesson-right { 
            flex: 1.5; font-weight: 800; color: var(--primary); font-size: 1.1rem;
            display: flex; align-items: center; gap: 10px;
        }
        .audio-part { flex: 4; }
        audio { width: 100%; height: 38px; }
        
        .btn-download { color: var(--dark-green); font-size: 1.6rem; text-decoration: none; }

        /* الصفحات المخفية */
        .page-content { display: none; }
        .page-content.active { display: block; }

        /* ترقيم الصفحات */
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .page-btn { 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; 
            border-radius: 8px; border: 1px solid var(--primary); color: var(--primary);
            cursor: pointer; font-weight: bold; transition: 0.3s; background: white;
        }
        .page-btn.active { background: var(--primary); color: white; }

        footer { text-align: center; padding: 30px; background: #e0f2f7; color: var(--primary); font-weight: bold; }

        @media (max-width: 768px) {
            .lesson-row { flex-direction: column; text-align: center; gap: 10px; }
            .main-nav { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="date-info" id="current-date">جاري التحميل...</div>
        <div class="prayer-times" id="prayer-api"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="main-nav">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="tafseer.html" class="nav-link nav-gold"><i class="fas fa-book-open"></i> دروس التفسير</a>
        <a href="khutab.html" class="nav-link"><i class="fas fa-microphone-lines"></i> الخطب</a>
        <a href="lessons.html" class="nav-link"><i class="fas fa-volume-high"></i> الصوتيات</a>
        <a href="books.html" class="nav-link"><i class="fas fa-book"></i> الكتب</a>
        <a href="articles.html" class="nav-link"><i class="fas fa-pen-nib"></i> المقالات</a>
    </nav>

    <div class="container">
        <h1 class="page-title">تفسير سورة الأنفال</h1>
        
        <div id="page1" class="page-content active"></div>
        <div id="page2" class="page-content"></div>

        <div class="pagination">
            <div class="page-btn active" id="btn1" onclick="showPage(1)">1</div>
            <div class="page-btn" id="btn2" onclick="showPage(2)">2</div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        function updateDate() {
            const now = new Date();
            const h = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now);
            const m = new Intl.DateTimeFormat('ar-EG', {day:'numeric', month:'long', year:'numeric'}).format(now);
            document.getElementById('current-date').innerText = `${h} هـ | ${m} م`;
        }

        async function getPrayers() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const data = await res.json();
                const t = data.data.timings;
                const prayers = [
                    {n:"الفجر", v:t.Fajr}, {n:"الظهر", v:t.Dhuhr}, {n:"العصر", v:t.Asr}, {n:"المغرب", v:t.Maghrib}, {n:"العشاء", v:t.Isha}
                ];
                document.getElementById('prayer-api').innerHTML = prayers.map(p => `
                    <div class="prayer-item"><span class="prayer-name">${p.n}</span><span class="prayer-time">${p.v}</span></div>
                `).join('');
            } catch (e) {}
        }

        function generateLessons() {
            const p1 = document.getElementById('page1');
            const p2 = document.getElementById('page2');

            for (let i = 1; i <= 16; i++) {
                const fileUrl = `audio/al-anfal-${i}.mp3`;
                const html = `
                    <div class="lesson-row">
                        <div class="lesson-right">
                            <i class="fas fa-book-open" style="color:var(--gold)"></i>
                            <span class="lesson-name">الدرس رقم (${i})</span>
                        </div>
                        <div class="audio-part">
                            <audio controls preload="none"><source src="${fileUrl}" type="audio/mpeg"></audio>
                        </div>
                        <div>
                            <a href="${fileUrl}" download class="btn-download">
                                <i class="fas fa-circle-down"></i>
                            </a>
                        </div>
                    </div>`;
                
                if (i <= 10) p1.innerHTML += html;
                else p2.innerHTML += html;
            }
        }

        function showPage(num) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('page' + num).classList.add('active');
            document.getElementById('btn' + num).classList.add('active');
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        window.onload = () => {
            updateDate();
            getPrayers();
            generateLessons();
        };
    </script>
</body>
</html>
