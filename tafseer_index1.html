        body { margin: 0; font-family: 'Cairo', sans-serif; background: #fff; text-align: center; }

        /* شبكة السور - أيقونات مستطيلة */
        .surah-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }

            background: #87ceeb; color: white; padding: 20px; border-radius: 10px;
            font-weight: 900; font-size: 1.4rem; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 0 var(--dark-blue); transition: 0.2s; 
            min-height: 50px; border: none;
        }
        .btn-surah:hover { transform: translateY(-3px); background: var(--dark-blue); }

        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 50px; }
        .page-link { padding: 10px 18px; background: #fff; border: 2px solid var(--accent-blue); color: var(--dark-blue); text-decoration: none; border-radius: 10px; font-weight: bold; }
        .page-link.active { background: var(--gold-color); border-color: var(--gold-color); color: white; }
    </style>
