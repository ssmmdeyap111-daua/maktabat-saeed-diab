<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس التفسير - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --accent: #add8e6; --gold: #d4af37; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #fff; }

        .site-header { text-align: center; padding: 30px; background: var(--accent); border-bottom: 10px solid #fff; }
        .site-logo { max-width: 600px; width: 100%; mix-blend-mode: multiply; }

        .main-nav { display: flex; justify-content: center; gap: 15px; padding: 20px; }
        .nav-btn-3d { 
            padding: 12px 25px; border-radius: 12px; font-weight: 900; text-decoration: none; color: white; 
            background: var(--primary); box-shadow: 0 6px 0 #1a3a54; transition: 0.2s;
        }

        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        
        /* شبكة الأيقونات: 7 أعمدة */
        .surah-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 20px; 
        }

        .surah-card {
            background: white; border: 2px solid var(--accent); border-radius: 15px;
            padding: 20px 10px; text-align: center; text-decoration: none; color: var(--primary);
            font-weight: 900; box-shadow: 0 6px 0 var(--accent); transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .surah-card:hover { transform: translateY(-5px); box-shadow: 0 10px 0 var(--accent); background: #f0faff; }
        .surah-card i { color: var(--gold); font-size: 1.8rem; }
        .surah-name { font-size: 1.1rem; }

        /* أزرار الصفحات */
        .pagination { display: flex; justify-content: center; gap: 10px; margin: 40px 0; }
        .page-btn {
            padding: 10px 20px; border-radius: 10px; background: #fff;
            border: 2px solid var(--primary); color: var(--primary); font-weight: 900; cursor: pointer;
        }
        .page-btn.active { background: var(--primary); color: #fff; }

        footer { text-align: center; padding: 25px; background: var(--accent); color: var(--primary); font-weight: bold; }

        @media (max-width: 1024px) { .surah-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 600px) { .surah-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <header class="site-header"><img src="images/logo.png.jpg" class="site-logo"></header>
    <nav class="main-nav"><a href="index.html" class="nav-btn-3d">الرئيسية</a></nav>

    <div class="container">
        <h1 style="text-align: center; color: var(--primary); margin-bottom: 30px;">فهرس حياة القلوب في تفسير كلام علام الغيوب</h1>
        <div class="surah-grid" id="surahContainer"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        const surahData = [
            {ar: "الفاتحة", en: "fatiha"}, {ar: "البقرة", en: "baqara"}, {ar: "آل عمران", en: "al-imran"}, {ar: "النساء", en: "al-nesa"}, {ar: "المائدة", en: "maeda"}, {ar: "الأنعام", en: "anaam"}, {ar: "الأعراف", en: "al-aaraf"}, {ar: "الأنفال", en: "anfal"}, {ar: "التوبة", en: "tauba"}, {ar: "يونس", en: "yunus"}, {ar: "هود", en: "hud"}, {ar: "يوسف", en: "yusuf"}, {ar: "الرعد", en: "rad"}, {ar: "إبراهيم", en: "ibrahim"}, {ar: "الحجر", en: "hijr"}, {ar: "النحل", en: "nahl"}, {ar: "الإسراء", en: "isra"}, {ar: "الكهف", en: "kahf"}, {ar: "مريم", en: "maryam"}, {ar: "طه", en: "taha"}, {ar: "الأنبياء", en: "anbiya"}, {ar: "الحج", en: "hajj"}, {ar: "المؤمنون", en: "muminun"}, {ar: "النور", en: "nur"}, {ar: "الفرقان", en: "furqan"}, {ar: "الشعراء", en: "shuara"}, {ar: "النمل", en: "naml"}, {ar: "القصص", en: "qasas"}, {ar: "العنكبوت", en: "ankabut"}, {ar: "الروم", en: "rum"}, {ar: "لقمان", en: "luqman"}, {ar: "السجدة", en: "sajdah"}, {ar: "الأحزاب", en: "ahzab"}, {ar: "سبأ", en: "saba"}, {ar: "فاطر", en: "fatir"}, {ar: "يس", en: "yasin"}, {ar: "الصافات", en: "saffat"}, {ar: "ص", en: "sad"}, {ar: "الزمر", en: "zumar"}, {ar: "غافر", en: "ghafir"}, {ar: "فصلت", en: "fussilat"}, {ar: "الشورى", en: "shura"}, {ar: "الزخرف", en: "zukhruf"}, {ar: "الدخان", en: "dukhan"}, {ar: "الجاثية", en: "jathiyah"}, {ar: "الأحقاف", en: "ahqaf"}, {ar: "محمد", en: "muhammad"}, {ar: "الفتح", en: "fath"}, {ar: "الحجرات", en: "hujurat"}, {ar: "ق", en: "qaf"}, {ar: "الذاريات", en: "dhariyat"}, {ar: "الطور", en: "tur"}, {ar: "النجم", en: "najm"}, {ar: "القمر", en: "qamar"}, {ar: "الرحمن", en: "rahman"}, {ar: "الواقعة", en: "waqiah"}, {ar: "الحديد", en: "hadid"}, {ar: "المجادلة", en: "mujadilah"}, {ar: "الحشر", en: "hashr"}, {ar: "الممتحنة", en: "mumtahanah"}, {ar: "الصف", en: "saff"}, {ar: "الجمعة", en: "jumuah"}, {ar: "المنافقون", en: "munafiqun"}, {ar: "التغابن", en: "taghabun"}, {ar: "الطلاق", en: "talaq"}, {ar: "التحريم", en: "tahrim"}, {ar: "الملك", en: "mulk"}, {ar: "القلم", en: "qalam"}, {ar: "الحاقة", en: "haqqah"}, {ar: "المعارج", en: "maarij"}, {ar: "نوح", en: "nuh"}, {ar: "الجن", en: "jinn"}, {ar: "المزمل", en: "muzzammil"}, {ar: "المدثر", en: "muddathir"}, {ar: "القيامة", en: "qiyamah"}, {ar: "الإنسان", en: "insan"}, {ar: "المرسلات", en: "mursalat"}, {ar: "النبأ", en: "naba"}, {ar: "النازعات", en: "naziat"}, {ar: "عبس", en: "abasa"}, {ar: "التكوير", en: "takwir"}, {ar: "الانفطار", en: "infitar"}, {ar: "المطففين", en: "mutaffifin"}, {ar: "الانشقاق", en: "inshiqaq"}, {ar: "البروج", en: "buruj"}, {ar: "الطارق", en: "tariq"}, {ar: "الأعلى", en: "ala"}, {ar: "الغاشية", en: "ghashiyah"}, {ar: "الفجر", en: "fajr"}, {ar: "البلد", en: "balad"}, {ar: "الشمس", en: "shams"}, {ar: "الليل", en: "layl"}, {ar: "الضحى", en: "duha"}, {ar: "الشرح", en: "sharh"}, {ar: "التين", en: "tin"}, {ar: "العلق", en: "alaq"}, {ar: "القدر", en: "qadr"}, {ar: "البينة", en: "bayyinah"}, {ar: "الزلزلة", en: "zalzalah"}, {ar: "العاديات", en: "adiyat"}, {ar: "القارعة", en: "qariah"}, {ar: "التكاثر", en: "takathur"}, {ar: "العصر", en: "asr"}, {ar: "الهمزة", en: "humazah"}, {ar: "الفيل", en: "fil"}, {ar: "قريش", en: "quraysh"}, {ar: "الماعون", en: "maun"}, {ar: "الكوثر", en: "kawthar"}, {ar: "الكافرون", en: "kafirun"}, {ar: "النصر", en: "nasr"}, {ar: "المسد", en: "masad"}, {ar: "الإخلاص", en: "ikhlas"}, {ar: "الفلق", en: "falaq"}, {ar: "الناس", en: "nas"}
        ]; {ar: "يونس", en: "yones"}, {ar: "هود", en: "hood"}, 

        const itemsPerPage = 28; 
        let currentPage = 1;

        function displaySurahs(page) {
            const container = document.getElementById('surahContainer');
            container.innerHTML = "";
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = surahData.slice(start, end);

            pageItems.forEach((s, i) => {
                const globalIndex = start + i + 1;
                container.innerHTML += `
                    <a href="tafseer-${s.en}.html" class="surah-card">
                        <span style="font-size:0.8rem; color:#888;">${globalIndex}</span>
                        <i class="fas fa-book-quran"></i>
                        <span class="surah-name">سورة ${s.ar}</span>
                    </a>`;
            });
            renderPagination();
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = "";
            const totalPages = Math.ceil(surahData.length / itemsPerPage);
            for (let i = 1; i <= totalPages; i++) {
                pagination.innerHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
        }

        function goToPage(p) { currentPage = p; displaySurahs(p); window.scrollTo(0, 0); }

        displaySurahs(1);
    </script>
</body>
</html>
