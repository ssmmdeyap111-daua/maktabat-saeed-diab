<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس تفسير القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --dark-blue: #2c5d87; --light-blue: #add8e6; --gold: #d4af37; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f4f7f9; text-align: center; }
        
        .header-tafseer { background: linear-gradient(to right, #add8e6, #e0f2f7); padding: 30px; border-bottom: 5px solid #fff; }
        .back-btn { padding: 10px 20px; background: var(--dark-blue); color: white; text-decoration: none; border-radius: 25px; font-weight: bold; display: inline-block; margin-bottom: 20px; }

        .surah-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .surah-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 15px; 
        }
        
        /* أيقونات السور الصغيرة */
        .surah-card { 
            background: white; border: 2px solid var(--light-blue); padding: 15px 5px; 
            border-radius: 12px; text-decoration: none; color: var(--dark-blue); 
            font-weight: bold; font-size: 1rem; transition: 0.3s;
            box-shadow: 0 4px 0 var(--light-blue);
        }
        .surah-card:hover { background: var(--gold); color: white; border-color: var(--gold); transform: translateY(-3px); }
        .surah-num { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .surah-card:hover .surah-num { color: white; }

        footer { padding: 25px; background: #e0f2f7; font-weight: bold; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="header-tafseer">

        <center><img src="images/logo.png.jpg" style="max-width:350px; mix-blend-mode: multiply;"></center>
        <h2 style="color: var(--dark-blue); margin-top: 20px;">فهرس تفسير سور القرآن الكريم</h2>
    </div>

    <div class="surah-container">
        <div class="surah-grid">
            <a href="surah_fateha.html" class="surah-card"><span class="surah-num">١</span>الفاتحة</a>
            <a href="surah_baqarah.html" class="surah-card"><span class="surah-num">٢</span>البقرة</a>
            <a href="surah_imran.html" class="surah-card"><span class="surah-num">٣</span>آل عمران</a>
            <a href="surah_nisa.html" class="surah-card"><span class="surah-num">٤</span>النساء</a>
            <a href="surah_maedah.html" class="surah-card"><span class="surah-num">٥</span>المائدة</a>
            <a href="surah_anaam.html" class="surah-card"><span class="surah-num">٦</span>الأنعام</a>
            <a href="surah_araaf.html" class="surah-card"><span class="surah-num">٧</span>الأعراف</a>
            <a href="surah_anfal.html" class="surah-card"><span class="surah-num">٨</span>الأنفال</a>
            <a href="surah_tawbah.html" class="surah-card"><span class="surah-num">٩</span>التوبة</a>
            <a href="surah_yunus.html" class="surah-card"><span class="surah-num">١٠</span>يونس</a>
            <a href="surah_houd.html" class="surah-card"><span class="surah-num">١١</span>هود</a>
            <a href="surah_yusuf.html" class="surah-card"><span class="surah-num">١٢</span>يوسف</a>
            <a href="surah_raad.html" class="surah-card"><span class="surah-num">١٣</span>الرعد</a>
            <a href="surah_ibrahim.html" class="surah-card"><span class="surah-num">١٤</span>إبراهيم</a>
            <a href="surah_hijr.html" class="surah-card"><span class="surah-num">١٥</span>الحجر</a>
            <a href="surah_nahl.html" class="surah-card"><span class="surah-num">١٦</span>النحل</a>
            </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>
</body>
</html>
