<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الشيخ سعيد دياب الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { margin: 0; font-family: 'Cairo', sans-serif; background-color: #f8fcff; text-align: center; }
        
        /* ضبط شريط المواقيت العلوي ليكون التاريخ يميناً والمواقيت يساراً */
        .top-info-bar { 
            background-color: #fdfae9; padding: 10px 30px; display: flex; 
            justify-content: space-between; align-items: center; flex-direction: row-reverse; 
            border-bottom: 1px solid #ddd;
        }
        .prayer-times { display: flex; gap: 6px; }
        .prayer-box { 
            text-align: center; background: #4f814f; color: white; border-radius: 6px; 
            padding: 4px 10px; font-size: 0.8rem; min-width: 60px;
        }
        .time-val { background: white; color: #4f814f; margin-top: 3px; border-radius: 4px; font-weight: bold; }
        .date-box { 
            background: white; border: 1px solid #c59d31; border-radius: 25px; 
            padding: 7px 25px; color: #333; font-weight: bold; font-size: 1rem;
        }

        .site-header { background-color: #e0f2f7; padding: 40px 0; border-bottom: 5px solid #72bcd4; }
        .site-header img { max-width: 600px; width: 95%; mix-blend-mode: multiply; }

        /* القائمة الرئيسية المحدثة */
        .main-nav { display: flex; justify-content: center; gap: 15px; padding: 30px; flex-wrap: wrap; background: #fff; }
        .nav-item { 
            text-decoration: none; color: white; padding: 15px 30px; border-radius: 12px; 
            font-weight: 900; font-size: 1.2rem; min-width: 140px; 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            box-shadow: 0 4px 0 rgba(0,0,0,0.15); transition: 0.2s;
        }

        footer { padding: 40px; background: #222; color: #bbb; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="top-info-bar">
        <div class="prayer-times">
            <div class="prayer-box"><div>الفجر</div><div class="time-val">03:26</div></div>
            <div class="prayer-box"><div>الظهر</div><div class="time-val">11:30</div></div>
            <div class="prayer-box"><div>العصر</div><div class="time-val">14:57</div></div>
            <div class="prayer-box"><div>المغرب</div><div class="time-val">18:09</div></div>
            <div class="prayer-box"><div>العشاء</div><div class="time-val">19:39</div></div>
        </div>
        <div class="date-box">الأحد | ٢٣ ذو القعدة ١٤٤٧ هـ | ١٠ مايو ٢٠٢٦ م</div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="موقع الشيخ سعيد دياب الرسمي">
    </header>

    <nav class="main-nav">
        <a href="index.html" class="nav-item" style="background:#c59d31;"><i class="fas fa-home"></i>الرئيسية</a>
        <a href="audio.html" class="nav-item" style="background:#72bcd4;"><i class="fas fa-volume-up"></i>الصوتيات</a>
        <a href="khutbah.html" class="nav-item" style="background:#5b9bd5;"><i class="fas fa-microphone"></i>الخطب</a>
        <a href="articles.html" class="nav-item" style="background:#4f814f;"><i class="fas fa-file-alt"></i>المقالات</a>
    </nav>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>
</body>
</html>
