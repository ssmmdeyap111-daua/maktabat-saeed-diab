<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس التفسير - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --accent: #add8e6; --gold: #d4af37; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #fff; }

        .site-header { text-align: center; padding: 20px; background: var(--accent); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; mix-blend-mode: multiply; }

        .main-nav { display: flex; justify-content: center; gap: 15px; padding: 20px; }
        .nav-btn-3d { 
            padding: 12px 25px; border-radius: 12px; font-weight: 900; text-decoration: none; color: white; 
            background: var(--primary); box-shadow: 0 6px 0 #1a3a54; transition: 0.2s;
        }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        /* شبكة الأيقونات: 7 أعمدة */
        .surah-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 15px; 
        }

        .surah-card {
            background: white; border: 2px solid var(--accent); border-radius: 15px;
            padding: 20px 10px; text-align: center; text-decoration: none; color: var(--primary);
            font-weight: 900; box-shadow: 0 6px 0 var(--accent); transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 140px;
        }
        .surah-card:hover { transform: translateY(-5px); box-shadow: 0 10px 0 var(--accent); background: #f0faff; }
        .surah-card i { color: var(--gold); font-size: 1.8rem; }
        .surah-name { font-size: 1rem; line-height: 1.4; }

        .pagination { display: flex; justify-content: center; gap: 10px; margin: 40px 0; }
        .page-btn {
            padding: 10px 20px; border-radius: 10px; background: #fff;
            border: 2px solid var(--primary); color: var(--primary); font-weight: 900; cursor: pointer;
        }
        .page-btn.active { background: var(--primary); color: #fff; }

        footer { text-align: center; padding: 25px; background: var(--accent); color: var(--primary); font-weight: bold; }

        @media (max-width: 1024px) { .surah-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 600px) { .surah-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <header class="site-header"><img src="images/logo.png.jpg" class="site-logo"></header>
    <nav class="main-nav">
        <a href="index.html" class="nav-btn-3d">الرئيسية</a>
        <a href="lessons.html" class="nav-btn-3d">الصوتيات</a>
    </nav>

    <div class="container">
        <h1 style="text-align: center; color: var(--primary); margin-bottom: 30px;">فهرس التفسير (حياة القلوب)</h1>
        <div class="surah-grid" id="surahContainer"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        // مصفوفة مطابقة لأسماء ملفاتك الحقيقية في الموقع
        const surahData = [
            {ar: "الفاتحة", file: "tafseer-fatiha.html"}, 
            {ar: "البقرة", file: "tafseer-baqara.html"}, 
            {ar: "آل عمران", file: "tafseer-imran.html"}, 
            {ar: "النساء", file: "tafseer-al-nesa.html"}, 
            {ar: "المائدة", file: "tafseer-maeda.html"}, 
            {ar: "الأنعام", file: "tafseer-anaam.html"}, 
            {ar: "الأعراف", file: "tafseer-al-aaraf.html"}, 
            {ar: "الأنفال", file: "al-anfal.html"}, 
            {ar: "التوبة", file: "tauba.html"}, 
            {ar: "يونس", file: "yones.html"}, 
            {ar: "هود", file: "tafseer-hood.html"}, 
            {ar: "يوسف", file: "tafseer-yusef.html"}, 
            {ar: "الرعد", file: "tafseer-rad.html"}, 
            {ar: "إبراهيم", file: "tafseer-ebrahem.html"}, 
            {ar: "الحجر", file: "tafseer-al-hegr.html"}, 
            {ar: "النحل", file: "tafseer-alnah.html"},
            // بقية السور تستخدم النمط الافتراضي s[رقم].html لحين توفر ملفاتها الخاصة
        ];

        // تكملة بقية الـ 114 سورة تلقائياً لمنع تعطل الصفحة
        const allSurahsNames = ["الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

        const fullData = [...surahData];
        allSurahsNames.forEach((name, index) => {
            if (index + 16 > fullData.length) { // البدء من بعد النحل (رقم 16)
                fullData.push({ar: name, file: `s${index + 17}.html`});
            }
        });

        const itemsPerPage = 28; 
        let currentPage = 1;

        function displaySurahs(page) {
            const container = document.getElementById('surahContainer');
            container.innerHTML = "";
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = fullData.slice(start, end);

            pageItems.forEach((s, i) => {
                const globalIndex = start + i + 1;
                container.innerHTML += `
                    <a href="${s.file}" class="surah-card">
                        <span style="font-size:0.8rem; color:#888;">${globalIndex}</span>
                        <i class="fas fa-book-quran"></i>
                        <span class="surah-name">سورة ${s.ar}</span>
                    </a>`;
            });
            renderPagination();
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = "";
            const totalPages = Math.ceil(fullData.length / itemsPerPage);
            for (let i = 1; i <= totalPages; i++) {
                pagination.innerHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
        }

        function goToPage(p) { currentPage = p; displaySurahs(p); window.scrollTo(0, 0); }

        displaySurahs(1);
    </script>
</body>
</html>
