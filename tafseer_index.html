<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير القرآن الكريم - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #2c5d87; 
            --accent-blue: #add8e6; 
            --gold: #d4af37; 
            --prayer-bg: #fdfae7; 
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: #fff; color: #333; }

        /* الهيدر واللوجو */
        .site-header { text-align: center; padding: 20px; background: var(--accent-blue); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 500px; width: 100%; mix-blend-mode: multiply; }

        /* التنقل العلوي 3D */
        .main-nav { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .nav-btn-3d { 
            padding: 12px 25px; border-radius: 12px; font-weight: 900; text-decoration: none; color: white; 
            background: var(--primary); box-shadow: 0 6px 0 #1a3a54; transition: 0.2s; min-width: 140px; text-align: center;
        }
        .btn-gold { background: var(--gold); box-shadow: 0 6px 0 #8c6d1a; }

        /* شبكة الأيقونات 3D */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .surah-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); /* 7 أيقونات في الصف */
            gap: 15px; 
            margin-top: 30px;
        }

        .surah-card {
            background: white;
            border: 2px solid var(--accent-blue);
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: var(--primary);
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow: 0 6px 0 var(--accent-blue);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .surah-card:hover { transform: translateY(-5px); box-shadow: 0 10px 0 var(--accent-blue); background: #f0faff; }
        .surah-card i { color: var(--gold); font-size: 1.8rem; }
        .surah-num { font-size: 0.8rem; color: #888; }

        /* أزرار الصفحات */
        .pagination { display: flex; justify-content: center; gap: 10px; margin: 40px 0; }
        .page-btn {
            padding: 10px 20px;
            border-radius: 10px;
            background: #fff;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }
        .page-btn.active { background: var(--primary); color: #fff; }

        footer { text-align: center; padding: 25px; background: var(--accent-blue); color: var(--primary); font-weight: bold; margin-top: 50px; }

        @media (max-width: 1024px) { .surah-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 600px) { .surah-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" class="site-logo">
    </header>

    <nav class="main-nav">
        <a href="index.html" class="nav-btn-3d">الرئيسية</a>
        <a href="lessons.html" class="nav-btn-3d btn-gold">الصوتيات</a>
    </nav>

    <div class="container">
        <h1 style="text-align: center; color: var(--primary); font-weight: 900;">فهرس تفسير القرآن الكريم</h1>
        <div class="surah-grid" id="surahContainer">
            </div>

        <div class="pagination" id="pagination">
            </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        const surahs = [
            "الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"
        ];

        const itemsPerPage = 28; // 4 صفوف × 7 أعمدة
        let currentPage = 1;

        function displaySurahs(page) {
            const container = document.getElementById('surahContainer');
            container.innerHTML = "";
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = surahs.slice(start, end);

            pageItems.forEach((name, index) => {
                const surahIndex = start + index + 1;
                // رابط السورة يوجه لملف اسمه مثلا s1.html, s2.html الخ
                container.innerHTML += `
                    <a href="s${surahIndex}.html" class="surah-card">
                        <span class="surah-num">سورة رقم ${surahIndex}</span>
                        <i class="fas fa-book-quran"></i>
                        <span>سورة ${name}</span>
                    </a>
                `;
            });

            renderPagination();
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = "";
            const totalPages = Math.ceil(surahs.length / itemsPerPage);

            for (let i = 1; i <= totalPages; i++) {
                pagination.innerHTML += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>
                `;
            }
        }

        function goToPage(page) {
            currentPage = page;
            displaySurahs(page);
            window.scrollTo(0, 300);
        }

        // تشغيل الصفحة الأولى عند التحميل
        displaySurahs(1);
    </script>
</body>
</html>
