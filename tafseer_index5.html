
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
        :root { --dark-blue: #2c5d87; --accent-blue: #87ceeb; --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #fff; }
        .site-header { text-align: center; padding: 20px; background: var(--header-bg); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 400px; width: 100%; mix-blend-mode: multiply; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; text-align: center; }
        .page-title { color: var(--dark-blue); font-weight: 900; margin-bottom: 30px; font-size: 1.8rem; border-bottom: 2px solid var(--gold-color); display: inline-block; padding-bottom: 5px; }
        .top-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .btn-top { background: var(--accent-blue); color: var(--dark-blue); padding: 12px 25px; border-radius: 10px; font-weight: 900; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 0 #5fa9c9; transition: 0.2s; font-size: 1.1rem; }
        .btn-top:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .surah-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; }
        .btn-3d-surah { background: #87ceeb; color: white; padding: 20px 10px; border-radius: 12px; font-weight: 900; font-size: 1.2rem; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 0 var(--dark-blue); border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; min-height: 100px; }
        .btn-3d-surah:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .surah-num { font-size: 0.9rem; opacity: 0.9; margin-bottom: 10px; background: rgba(0,0,0,0.2); padding: 2px 10px; border-radius: 10px; }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 50px; }
        .page-link { padding: 10px 18px; background: #fff; border: 2px solid var(--accent-blue); color: var(--dark-blue); text-decoration: none; border-radius: 10px; font-weight: bold; }
        .page-link.active { background: var(--gold-color); border-color: var(--gold-color); color: white; box-shadow: 0 4px 0 #8c6d1a; }
        footer { text-align: center; padding: 25px; background: var(--header-bg); font-weight: bold; margin-top: 50px; }
    </style>
</head>
<body>

        </div>
        <h2 class="page-title">تفسير القرآن الكريم - الصفحة ٥</h2>
        <div class="surah-grid">
            <a href="tafseer-falaq.html" class="btn-3d-surah"><span class="surah-num">١١٣</span>الفلق</a>
            <a href="tafseer-nas.html" class="btn-3d-surah"><span class="surah-num">١١٤</span>الناس</a>
        </div>
        <div class="pagination">

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

</html>
