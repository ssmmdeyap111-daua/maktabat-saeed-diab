<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطب المنبرية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: linear-gradient(to bottom, var(--light-sky), #d0e4ff); min-height: 100vh; }
        
        /* التاريخ والمواقيت */
        .top-info-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; position: absolute; width: 100%; box-sizing: border-box; z-index: 1000; }
        .oval-box { background: white; padding: 8px 22px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 2px solid var(--accent-blue); color: var(--dark-blue); font-weight: 900; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; }
        .prayer-table { display: flex; gap: 5px; }
        .prayer-column { display: flex; flex-direction: column; align-items: center; width: 55px; }
        .prayer-name { background: var(--dark-blue); color: white; width: 100%; text-align: center; font-size: 0.7rem; border-radius: 8px 8px 0 0; }
        .prayer-time { background: white; color: var(--dark-blue); width: 100%; text-align: center; font-size: 0.8rem; font-weight: 900; border: 1px solid #ddd; border-radius: 0 0 5px 5px; }

        /* الهيدر الجديد مع المخطوطة */
        .site-header { text-align: center; padding: 60px 20px 30px; background: var(--header-bg); border-bottom: 4px solid #fff; }
        .site-logo {
            max-width: 500px; /* حجم المخطوطة */
            width: 100%;
            height: auto;
            margin-top: 40px;
            mix-blend-mode: multiply; /* لجعل الخلفية شفافة */
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.05));
        }

        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .nav-link-3d { padding: 10px 18px; background: var(--accent-blue); color: white; text-decoration: none; border-radius: 12px; font-weight: bold; min-width: 100px; text-align: center; box-shadow: 0 5px 0 var(--dark-blue); transition: 0.2s; }
        .nav-link-3d:hover { transform: translateY(-2px); background: #9cdfff; }
        .active-link { background: var(--gold-color); box-shadow: 0 5px 0 #b38f2d; }

        .container { max-width: 1150px; margin: 30px auto; padding: 0 20px; }
        .section-title { color: var(--dark-blue); border-right: 6px solid var(--gold-color); padding-right: 15px; margin: 40px 0 25px; font-weight: 900; font-size: 1.6rem; }

        .khutbah-item {
            background: white; border-radius: 15px; padding: 25px 40px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06); border-right: 6px solid var(--accent-blue);
            transition: 0.3s;
        }
        .khutbah-item:hover { transform: translateX(-5px); border-right-color: var(--gold-color); }

        .khutbah-info { flex: 1.2; text-align: right; }
        .khutbah-info h3 { margin: 0; color: var(--dark-blue); font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 15px; }
        .lesson-number { color: var(--gold-color); font-size: 1.5rem; font-weight: 900; min-width: 40px; }

        .khutbah-controls { display: flex; align-items: center; gap: 30px; flex: 1.8; justify-content: flex-end; }
        audio { height: 45px; width: 350px; }
        .download-btn { color: var(--gold-color); font-size: 1.8rem; transition: 0.3s; text-decoration: none; }
        .download-btn:hover { color: var(--dark-blue); transform: translateY(-3px); }

        .pagination { display: flex; justify-content: center; gap: 12px; margin: 60px 0; }
        .page-num { cursor: pointer; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; background: white; color: var(--dark-blue); border-radius: 12px; font-weight: bold; border: 2px solid var(--accent-blue); transition: 0.3s; }
        .page-num.active { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

        @media (max-width: 992px) {
            .khutbah-item { flex-direction: column; text-align: center; gap: 20px; padding: 20px; }
            .khutbah-controls { justify-content: center; width: 100%; }
            audio { width: 100%; }
