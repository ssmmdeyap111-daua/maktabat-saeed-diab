<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطب المنبرية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; --shadow-color: #5da0bc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        
        .site-header { 
            text-align: center; 
            padding: 60px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 6px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .site-header h1 { margin: 0; font-size: 2.5rem; color: var(--dark-blue); font-weight: 900; }
        
        .nav-bar { display: flex; justify-content: center; padding: 20px; flex-wrap: wrap; gap: 10px; }
        
        /* تصميم الأزرار 3D */
        .btn-3d { 
            padding: 12px 25px; background: white; border-radius: 15px;
            text-decoration: none; color: var(--dark-blue); font-weight: bold;
            box-shadow: 0 5px 0 var(--shadow-color); transition: 0.1s;
            display: flex; align-items: center; justify-content: center; min-width: 120px;
        }
        .btn-3d:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow-color); }
        .active-btn { background: var(--bright-blue); color: white; border: none; }

        .container { max-width: 900px; margin: 20px auto; padding: 15px; }

        /* تصميم كرت الخطبة */
        .khutbah-item {
            background: white;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 15px;
            border-right: 6px solid var(--bright-blue);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .khutbah-info h3 { margin: 0; color: var(--dark-blue); font-size: 1.3rem; }
        .khutbah-controls { display: flex; align-items: center; gap: 15px; }
        audio { height: 40px; width: 250px; }
        .download-link {
            text-decoration: none;
            background: #27ae60;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: 0.2s;
        }
        .download-link:hover { background: #219150; }

        @media (max-width: 600px) {
            .khutbah-item { flex-direction: column; text-align: center; }
            audio { width: 100%; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>الخطب المنبرية للشيخ سعيد مصطفى دياب</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-3d">الرئيسية</a>
    <a href="books.html" class="btn-3d">المكتبة</a>
    <a href="lessons.html" class="btn-3d">الدروس</a>
    <a href="khutbah.html" class="btn-3d active-btn">الخطب</a>
</div>

<div class="container">
    <div class="khutbah-item">
        <div class="khutbah-info">
            <h3>رمضان شهر القرآن</h3>
        </div>
        <div class="khutbah-controls">
            <audio controls preload="none">
                <source src="audio/shahr-alqoran.mp3" type="audio/mpeg">
                متصفحك لا يدعم مشغل الصوت.
            </audio>
            <a href="audio/shahr-alqoran.mp3" download class="download-link">تحميل 📥</a>
        </div>
    </div>

    <div class="khutbah-item">
        <div class="khutbah-info">
            <h3>أهمية السعي في طلب الرزق</h3>
        </div>
        <div class="khutbah-controls">
            <audio controls preload="none">
                <source src="audio/alsai.mp3" type="audio/mpeg">
            </audio>
            <a href="audio/alsai.mp3" download class="download-link">تحميل 📥</a>
        </div>
    </div>
</div>

</body>
</html>
