<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم الخطب والمواعظ - الشيخ سعيد مصطفى دياب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --primary:#2d5f8b;
    --gold:#caa230;
}

body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:#eef1f4;
}

/* الهيدر */
.site-header{
    text-align:center;
    padding:20px;
}
.site-logo{max-width:500px;width:100%;}

/* القائمة */
.main-nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    padding:10px;
}

.nav-link{
    background:var(--primary);
    color:#fff;
    padding:10px 20px;
    border-radius:8px;
    text-decoration:none;
}

/* العنوان */
.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
    text-align:center;
}

.section-title{
    color:var(--primary);
    font-size:2rem;
}

/* الكارد */
.audio-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#fff;
    padding:12px;
    border-radius:12px;
    margin:10px 0;
    border-right:5px solid var(--gold);
}

.audio-title{
    flex:1;
    font-weight:800;
    color:var(--primary);
    text-align:right;
}

.play-btn{
    background:var(--primary);
    color:#fff;
    border:none;
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
}

.download-btn{
    color:green;
    font-size:20px;
    text-decoration:none;
}

/* pagination */
.pagination{
    margin-top:20px;
}

.page-btn{
    padding:8px 15px;
    margin:3px;
    border:none;
    border-radius:6px;
    background:var(--gold);
    cursor:pointer;
}

.page-btn.active{
    outline:3px solid var(--primary);
}
</style>
</head>

<body>

<header class="site-header">
    <img src="images/logo.png.jpg" class="site-logo">
</header>

<nav class="main-nav">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="khutab.html" class="nav-link">الخطب</a>
</nav>

<div class="container">

<h1 class="section-title">قسم الخطب والمواعظ</h1>

<div id="list"></div>
<div class="pagination" id="pagination"></div>

<audio id="player" controls style="width:100%; margin-top:20px;"></audio>

</div>

<script>
const itemsPerPage = 10;
let page = 1;
const player = document.getElementById("player");
const tracks = [

    // علامات الساعة (43 درسًا)
    ...Array.from({ length: 43 }, (_, i) => ({
        title: `علامات الساعة (${i + 1})`,
        src: `audio/alamat-${i + 1}.mp3`,
        category: "علامات الساعة"
    })),

    // أمرني بخمس (11 درسًا)
    ...Array.from({ length: 11 }, (_, i) => ({
        title: `أمرني بخمس (${i + 1})`,
        src: `audio/amrany-bekams-${i + 1}.mp3`,
        category: "أمرني بخمس"
    })),

    // فضل الدعاء (6 دروس)
    ...Array.from({ length: 6 }, (_, i) => ({
        title: `فضل الدعاء (${i + 1})`,
        src: `audio/fadl-aldoaa-${i + 1}.mp3`,
        category: "فضل الدعاء"
    })),

    // فضل يوم الجمعة
    {
        title: "فضل يوم الجمعة",
        src: "audio/fadl-algomaa.mp3",
        category: "خطب منوعة"
    },

    // فضل يوم عرفة
    {
        title: "فضل يوم عرفة",
        src: "audio/fadl-arafa-1.mp3",
        category: "خطب منوعة"
    },

    // فضل الحج
    {
        title: "فضل الحج",
        src: "audio/fadl-al-hag-1.mp3",
        category: "خطب منوعة"
    },

    // الميثاق الأول لحقوق الإنسان
    {
        title: "الميثاق الأول لحقوق الإنسان",
        src: "audio/almethaq.mp3",
        category: "خطب منوعة"
    }

];

// بعد تعريف القائمة شغّل الصفحة
render();
loadLast();

render();
loadLast();

/* عرض */
function render(){
    const box = document.getElementById("list");
    box.innerHTML = "";

    const start = (page-1)*itemsPerPage;
    const items = tracks.slice(start, start+itemsPerPage);

    items.forEach((t,i) => {

        const realIndex = start + i;

        box.innerHTML += `
        <div class="audio-box">
            <button class="play-btn" onclick="play(${realIndex})">▶</button>

            <div class="audio-title">${t.title}</div>

            <a class="download-btn" href="${t.src}" download>⬇</a>
        </div>`;
    });

    renderPages();
}

/* تشغيل */
function play(i){
    currentIndex = i;
    player.src = tracks[i].src;
    player.play();

    localStorage.setItem("last", i);
}

/* تشغيل تلقائي */
player.addEventListener("ended", () => {
    if(currentIndex < tracks.length-1){
        play(currentIndex+1);
    }
});

/* آخر تشغيل */
function loadLast(){
    let last = localStorage.getItem("last");
    if(last !== null){
        play(parseInt(last));
    }
}

/* صفحات */
function renderPages(){
    const pages = Math.ceil(tracks.length/itemsPerPage);
    const box = document.getElementById("pagination");

    box.innerHTML = "";

    for(let i=1;i<=pages;i++){
        box.innerHTML += `
        <button class="page-btn ${i===page?'active':''}" onclick="go(${i})">${i}</button>
        `;
    }
}

function go(p){
    page = p;
    render();
    window.scrollTo({top:200, behavior:"smooth"});
}
</script>

</body>
</html>
