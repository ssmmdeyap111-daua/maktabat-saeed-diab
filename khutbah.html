<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مكتبة الخطب - Spotify Style</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background:#121212;
color:#fff;
}

/* الهيدر */
header{
background:#1f1f1f;
padding:15px;
text-align:center;
font-weight:900;
color:#1db954;
}

/* الأقسام */
.tabs{
display:flex;
gap:8px;
overflow:auto;
padding:10px;
background:#181818;
}

.tab{
background:#282828;
padding:8px 14px;
border-radius:20px;
cursor:pointer;
white-space:nowrap;
font-weight:700;
}

.tab.active{
background:#1db954;
color:#000;
}

/* القائمة */
.container{
padding:10px;
padding-bottom:120px;
}

.card{
background:#181818;
padding:12px;
margin:8px 0;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

.title{
font-weight:700;
}

.play{
background:#1db954;
border:none;
padding:8px 12px;
border-radius:10px;
cursor:pointer;
font-weight:900;
}

/* شريط التشغيل */
.player{
position:fixed;
bottom:0;
left:0;
right:0;
background:#181818;
padding:10px;
border-top:1px solid #333;
}

.controls{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.ctrl-btn{
background:#1db954;
border:none;
padding:8px 12px;
border-radius:10px;
cursor:pointer;
font-weight:900;
}

audio{
width:100%;
margin-top:8px;
}
</style>
</head>

<body>

<header>🎧 مكتبة الخطب - Spotify Style</header>

<div class="tabs">
<div class="tab active" onclick="setCat('all')">الكل</div>
<div class="tab" onclick="setCat('علامات')">علامات الساعة</div>
<div class="tab" onclick="setCat('خمس')">أمرني بخمس</div>
<div class="tab" onclick="setCat('دعاء')">فضل الدعاء</div>
<div class="tab" onclick="setCat('منوع')">منوعات</div>
</div>

<div class="container" id="list"></div>

<div class="player">
<div class="controls">
<button class="ctrl-btn" onclick="prev()">⏮</button>
<button class="ctrl-btn" onclick="toggle()">⏯</button>
<button class="ctrl-btn" onclick="next()">⏭</button>
</div>

<audio id="audio" controls></audio>
</div>

<script>

const tracks = [

...Array.from({length:43},(_,i)=>({
t:`علامات الساعة ${i+1}`,
s:`audio/alamat-${i+1}.mp3`,
c:"علامات"
})),

...Array.from({length:11},(_,i)=>({
t:`أمرني بخمس ${i+1}`,
s:`audio/amrany-bekams-${i+1}.mp3`,
c:"خمس"
})),

...Array.from({length:6},(_,i)=>({
t:`فضل الدعاء ${i+1}`,
s:`audio/fadl-aldoaa-${i+1}.mp3`,
c:"دعاء"
})),

{t:"فضل الجمعة",s:"audio/fadl-algomaa.mp3",c:"منوع"},
{t:"فضل عرفة",s:"audio/fadl-arafa-1.mp3",c:"منوع"},
{t:"فضل الحج",s:"audio/fadl-al-hag-1.mp3",c:"منوع"},
{t:"الميثاق",s:"audio/almethaq.mp3",c:"منوع"}

];

let cat="all";
let current=0;
const audio=document.getElementById("audio");

function filtered(){
return tracks.filter(x=>cat=="all"?true:x.c==cat);
}

/* عرض */
function render(){
let list=document.getElementById("list");
list.innerHTML="";

filtered().forEach((x,i)=>{
list.innerHTML+=`
<div class="card">
<div class="title">${x.t}</div>
<button class="play" onclick="playGlobal(${tracks.indexOf(x)})">▶</button>
</div>
`;
});
}

/* تشغيل */
function playGlobal(i){
current=i;
audio.src=tracks[i].s;
audio.play();
}

/* تحكم */
function next(){
if(current<tracks.length-1) playGlobal(current+1);
}

function prev(){
if(current>0) playGlobal(current-1);
}

function toggle(){
if(audio.paused) audio.play();
else audio.pause();
}

/* قسم */
function setCat(c){
cat=c;
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
event.target.classList.add("active");
render();
}

render();

</script>

</body>
</html>
