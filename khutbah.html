<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم الخطب والمواعظ - الشيخ سعيد مصطفى دياب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
font-family:'Cairo',sans-serif;
background:#f5fbff;
margin:0;
color: #333;
}

/* TOP BAR */
.topbar{
background:#fdfae9;
display:flex;
justify-content:space-between;
align-items: center;
padding:10px 20px;
flex-wrap: wrap;
gap: 10px;
border-bottom: 1px solid #ddd;
}

.box{
background:#fff;
padding:6px 14px;
border-radius:20px;
border:1px solid #c59d31;
font-weight:bold;
font-size: 0.9rem;
}

.prayer-times {
display: flex;
gap: 5px;
flex-wrap: wrap;
}

.prayer-item {
background: white;
padding: 3px 8px;
border-radius: 6px;
border: 1px solid #ddd;
font-size: 0.8rem;
font-weight: bold;
}

.prayer-time {
color: #2c5d87;
margin-right: 3px;
}

/* HEADER */
.site-header {
background: #e0f2f7;
padding: 60px 20px;
border-bottom: 5px solid #72bcd4;
text-align: center;
}

/* مكان اللوجو */
.site-header .logo-container {
margin-bottom: 20px;
}

.site-header .logo-container img {
max-height: 200px;
width: auto;
mix-blend-mode: multiply; /* تقوم بإخفاء الخلفية البيضاء للصورة */
}

.site-header h2 {
color: #2c5d87;
font-weight: 900;
margin: 0;
font-size: 2.4rem;
}

/* NAV 3D */
.nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:12px;
padding:20px;
background:#fff;
border-bottom: 1px solid #eee;
}

.nav a{
background:#2c5d87;
color:#fff;
padding:12px 24px;
border-radius:10px;
text-decoration:none;
font-weight: bold;
box-shadow:0 5px 0 #1b3c59;
transition: 0.2s;
}

.nav a:hover {
transform: translateY(-2px);
box-shadow: 0 7px 0 #1b3c59;
}

/* MAIN CONTAINER */
.container{
max-width:900px;
margin:auto;
padding:30px 20px;
}

.page-main-title {
text-align: center;
color: #2c5d87;
font-weight: 900;
font-size: 2rem;
margin-bottom: 5px;
}

.title-line {
width: 150px;
height: 4px;
background: #c59d31;
margin: 0 auto 30px;
border-radius: 5px;
}

/* SERIES BUTTONS */
.series-btn{
width:100%;
background:#2c5d87;
border:none;
padding:16px 24px;
margin:15px 0 0 0;
border-radius:10px;
color:#fff;
font-size:1.1rem;
font-weight:bold;
cursor:pointer;
box-shadow:0 5px 0 #1b3c59;
text-align:right;
font-family: 'Cairo', sans-serif;
transition: 0.2s;
display: flex;
justify-content: space-between;
align-items: center;
box-sizing: border-box;
}

.series-btn::after {
content: '\f107';
font-family: 'Font Awesome 6 Free';
font-weight: 900;
transition: 0.3s;
}

.series-btn:hover {
transform: translateY(-2px);
box-shadow: 0 7px 0 #1b3c59;
}

.series-btn.active{
background:#c59d31;
box-shadow:0 5px 0 #8e6f1e;
}

.series-btn.active::after {
transform: rotate(180deg);
}

/* زر العودة */
.back-btn-container {
text-align: center;
margin-top: 40px;
}

.back-btn {
background: #c59d31;
color: #fff;
padding: 12px 35px;
border-radius: 10px;
text-decoration: none;
font-weight: bold;
box-shadow: 0 5px 0 #8e6f1e;
display: inline-flex;
align-items: center;
gap: 8px;
transition: 0.2s;
border: none;
cursor: pointer;
font-family: 'Cairo', sans-serif;
font-size: 1rem;
}

.back-btn:hover {
transform: translateY(-2px);
box-shadow: 0 7px 0 #8e6f1e;
}

/* LESSONS CONTAINER */
.series-box{
display:none;
background: #fcfdfe;
border: 1px solid #e2f0f7;
border-top: none;
padding: 15px;
border-radius: 0 0 12px 12px;
margin-bottom: 20px;
box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
}

.lesson{
background:#fff;
margin:8px 0;
padding:14px 18px;
border-right:5px solid #c59d31;
display:flex;
justify-content:space-between;
align-items:center;
border-radius:10px;
box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}

.lesson span {
font-weight: bold;
color: #444;
}

.lesson.active{
background:#eaf6ff;
border-right-color: #2c5d87;
}

.lesson.active span {
color: #2c5d87;
}

.actions {
display: flex;
align-items: center;
gap: 8px;
}

.actions button,
.actions a{
border:none;
cursor:pointer;
padding:8px 14px;
border-radius:8px;
font-family: 'Cairo', sans-serif;
font-weight: bold;
display: inline-flex;
align-items: center;
justify-content: center;
text-decoration:none;
transition: 0.2s;
}

.play{
background:#2c5d87;
color:#fff;
}

.play:hover { background: #1e4261; }

.download{
background:#27ae60;
color:#fff;
}

.download:hover { background: #1e8449; }

/* PAGINATION */
.pagination{
text-align:center;
margin-top:20px;
padding-top:10px;
border-top: 1px dashed #ddd;
}

.pagination button{
margin:4px;
padding:8px 14px;
border:1px solid #ddd;
background:#fff;
cursor:pointer;
border-radius:8px;
font-family: 'Cairo', sans-serif;
font-weight: bold;
color: #555;
transition: 0.2s;
}

.pagination button:hover {
background: #eee;
}

.pagination button.active{
background:#2c5d87;
color:#fff;
border-color: #2c5d87;
}

/* PLAYER */
.player{
position:sticky;
bottom:15px;
background:#fff;
padding:15px;
border-radius:12px;
box-shadow:0 4px 20px rgba(0,0,0,.15);
margin: 30px auto;
max-width: 900px;
width: calc(100% - 40px);
border: 1px solid #ddd;
z-index: 100;
}

.player-title {
font-size: 0.85rem;
font-weight: bold;
color: #2c5d87;
margin-bottom: 6px;
display: none;
}

audio{width:100%; height: 40px;}

@media (max-width: 768px) {
    .topbar { flex-direction: column; text-align: center; }
    .lesson { flex-direction: column; gap: 10px; text-align: center; }
    .actions { width: 100%; }
    .actions button, .actions a { flex-grow: 1; }
}
</style>

</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div class="box" id="date">جاري تحميل التاريخ...</div>
<div class="prayer-times" id="prayer-box">جاري تحميل مواقيت الصلاة...</div>
</div>

<!-- HEADER - تم تصحيح الإغلاق وإضافة العناوين بالكامل هنا -->
<div class="site-header">
    <div class="logo-container">
       <img src="images/logo.png.jpg" alt="شعار موقع الشيخ سعيد مصطفى دياب">
    </div>
    <h2></h2>
</div>

<!-- NAV -->
<div class="nav">
<a href="index.html">الرئيسية</a>
<a href="audio.html">الصوتيات</a>
<a href="tafseer_index1.html">التفسير</a>
<a href="books.html">الكتب</a>
<a href="articles.html">المقالات</a>
<a href="khutbah.html">الخطب</a>
</div>

<!-- MAIN CONTENT -->
<div class="container">

<h2 class="page-main-title">قسم الخطب والمواعظ</h2>
<div class="title-line"></div>

<!-- SERIES ITEMS -->
<button class="series-btn" onclick="toggleSeries('علامات الساعة',this)">سلسلة علامات الساعة</button>
<div class="series-box"></div>

<button class="series-btn" onclick="toggleSeries('أمرني بخمس',this)">سلسلة أمرني بخمس</button>
<div class="series-box"></div>

<button class="series-btn" onclick="toggleSeries('فضل الدعاء',this)">سلسلة فضل الدعاء</button>
<div class="series-box"></div>

<!-- زر خطب منوعة -->
<button class="series-btn" onclick="toggleSeries('خطب منوعة',this)">خطب منوعة</button>
<div class="series-box"></div>

<!-- زر العودة إلى الصفحة الرئيسية -->
<div class="back-btn-container">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
</div>

</div>

<!-- FLOATING PLAYER -->
<div class="player">
<div class="player-title" id="track-title">🔊 يستمع الآن إلى: <span></span></div>
<audio id="audio" controls></audio>
</div>

<script>
const data = {
"علامات الساعة": Array.from({length:43},(_, i)=>({
title:`علامات الساعة (الدرس ${i+1})`,
file:`audio/alamat-${i+1}.mp3`
})),

"أمرني بخمس": Array.from({length:11},(_, i)=>({
title:`أمرني بخمس (الدرس ${i+1})`,
file:`audio/amrany-bekams-${i+1}.mp3`
})),

"فضل الدعاء": Array.from({length:6},(_, i)=>({
title:`فضل الدعاء (الدرس ${i+1})`,
file:`audio/fadl-aldoaa-${i+1}.mp3`
})),

"خطب منوعة": Array.from({length:10},(_, i)=>({
title:`خطبة منوعة (${i+1})`,
file:`audio/monawaa-${i+1}.mp3`
}))
};

let current=[], currentBox=null, currentSeriesName="", page=1, perPage=10;

function toggleSeries(name, btn) {
    const targetBox = btn.nextElementSibling;

    if (btn.classList.contains("active")) {
        btn.classList.remove("active");
        targetBox.style.display = "none";
        targetBox.innerHTML = "";
        return;
    }

    document.querySelectorAll(".series-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".series-box").forEach(box => {
        box.style.display = "none";
        box.innerHTML = "";
    });

    btn.classList.add("active");
    currentSeriesName = name;
    current = data[name] || [];
    page = 1;

    render(targetBox);
}

function render(box){
    currentBox = box;
    let start = (page - 1) * perPage;
    let list = current.slice(start, start + perPage);

    let html = "";

    list.forEach((l, i) => {
        html += `
        <div class="lesson" id="lesson-${start + i}">
            <span>${l.title}</span>
            <div class="actions">
                <button class="play" onclick="play(${start + i}, this)">▶ تشغيل</button>
                <a class="download" href="${l.file}" download>⬇ تحميل</a>
            </div>
        </div>`;
    });

    let pages = Math.ceil(current.length / perPage);
    if (pages > 1) {
        html += `<div class="pagination">`;
        for (let i = 1; i <= pages; i++) {
            html += `<button onclick="go(${i})" class="${i === page ? 'active' : ''}">الصفحة ${i}</button>`;
        }
        html += `</div>`;
    }

    box.innerHTML = html;
    box.style.display = "block";
}

function go(p){
    page = p;
    render(currentBox);
    window.scrollTo({
        top: currentBox.previousElementSibling.offsetTop - 20,
        behavior: "smooth"
    });
}

function play(i, btn){
    document.querySelectorAll(".lesson").forEach(l => l.classList.remove("active"));
    btn.closest(".lesson").classList.add("active");

    const audioPlayer = document.getElementById("audio");
    audioPlayer.src = current[i].file;
    
    const trackTitle = document.getElementById("track-title");
    trackTitle.style.display = "block";
    trackTitle.querySelector("span").innerText = current[i].title;

    audioPlayer.play().catch(e => console.log("تحتاج لتفاعل واجهة المستخدم أولاً"));
}

document.getElementById("audio").onended = function() {
    let nextIndex = document.querySelector(".lesson.active") ? 
                    parseInt(document.querySelector(".lesson.active").id.split("-")[1]) + 1 : -1;
                    
    if (nextIndex !== -1 && nextIndex < current.length) {
        let targetPage = Math.floor(nextIndex / perPage) + 1;
        if (targetPage !== page) {
            page = targetPage;
            render(currentBox);
        }
        
        const nextLessonElement = document.getElementById(`lesson-${nextIndex}`);
        if (nextLessonElement) {
            const nextPlayBtn = nextLessonElement.querySelector(".play");
            play(nextIndex, nextPlayBtn);
        }
    }
};

const now = new Date();
const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now);
const miladi = new Intl.DateTimeFormat('ar-EG', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now);
document.getElementById("date").innerText = `${hijri} هـ | ${miladi} م`;

async function loadPrayers() {
    try {
        const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
        const json = await res.json();
        const t = json.data.timings;
        document.getElementById("prayer-box").innerHTML = `
            <span class="prayer-item">الفجر: <span class="prayer-time">${t.Fajr}</span></span>
            <span class="prayer-item">الظهر: <span class="prayer-time">${t.Dhuhr}</span></span>
            <span class="prayer-item">العصر: <span class="prayer-time">${t.Asr}</span></span>
            <span class="prayer-item">المغرب: <span class="prayer-time">${t.Maghrib}</span></span>
            <span class="prayer-item">العشاء: <span class="prayer-time">${t.Isha}</span></span>
        `;
    } catch (e) {
        document.getElementById("prayer-box").innerText = "مواقيت الصلاة متوفرة عبر تطبيق الأذان";
    }
}
loadPrayers();
</script>

</body>
</html>
