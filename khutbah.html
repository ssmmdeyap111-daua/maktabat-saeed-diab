<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخطب والمواعظ</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
font-family:'Cairo',sans-serif;
background:#f5fbff;
margin:0;
direction:rtl;
}

/* ===== TOP BAR ===== */
.topbar{
background:#fdfae9;
display:flex;
justify-content:space-between;
padding:10px 20px;
border-bottom:1px solid #ddd;
}

.box{
background:#fff;
padding:6px 15px;
border-radius:20px;
border:1px solid #c59d31;
font-weight:bold;
}

/* ===== NAV 3D ===== */
.nav{
display:flex;
justify-content:center;
gap:10px;
padding:15px;
background:#fff;
flex-wrap:wrap;
}

.nav a{
background:#2c5d87;
color:#fff;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
box-shadow:0 5px 0 #1b3c59;
font-weight:bold;
transition:.2s;
}

.nav a:hover{
transform:translateY(-2px);
}

/* ===== CONTAINER ===== */
.container{
max-width:1100px;
margin:auto;
padding:20px;
}

/* ===== SERIES BUTTONS ===== */
.series{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
margin-top:20px;
}

.series button{
background:#72bcd4;
color:#fff;
border:none;
padding:15px;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
box-shadow:0 6px 0 #2c5d87;
}

.series button:active{
transform:translateY(2px);
box-shadow:0 3px 0 #2c5d87;
}

/* ===== LESSONS ===== */
.series-box{
display:none;
margin-top:20px;
}

.lesson{
background:#fff;
margin:10px 0;
padding:12px;
border-right:5px solid #c59d31;
display:flex;
justify-content:space-between;
align-items:center;
border-radius:10px;
}

.lesson span{
font-weight:bold;
color:#2c5d87;
}

.actions{
display:flex;
gap:10px;
align-items:center;
}

.play{
background:#2c5d87;
color:#fff;
border:none;
padding:6px 12px;
border-radius:8px;
cursor:pointer;
}

.download{
background:#27ae60;
color:#fff;
padding:6px 10px;
border-radius:50%;
text-decoration:none;
font-size:14px;
}

/* ===== PAGINATION ===== */
.pagination{
text-align:center;
margin-top:15px;
}

.pagination button{
margin:3px;
padding:5px 10px;
border:none;
background:#eee;
cursor:pointer;
border-radius:6px;
}

.pagination button.active{
background:#2c5d87;
color:#fff;
}

/* ===== PLAYER ===== */
.player{
position:sticky;
bottom:10px;
background:#fff;
padding:10px;
border-radius:10px;
margin-top:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

audio{width:100%;}
</style>

</head>

<body>

<!-- TOP -->
<div class="topbar">
<div class="box" id="date"></div>
<div class="box">مواقيت الصلاة</div>
</div>

<!-- NAV -->
<div class="nav">
<a href="index.html">الرئيسية</a>
<a href="audio.html">الصوتيات</a>
<a href="tafseer.html">التفسير</a>
<a href="books.html">الكتب</a>
<a href="articles.html">المقالات</a>
<a href="khutbah.html">الخطب</a>
</div>

<div class="container">

<h2 style="text-align:center;color:#2c5d87">قسم الخطب والمواعظ</h2>

<!-- SERIES -->
<div class="series">
<button onclick="openSeries('علامات الساعة')">علامات الساعة</button>
<button onclick="openSeries('أمرني بخمس')">أمرني بخمس</button>
<button onclick="openSeries('فضل الدعاء')">فضل الدعاء</button>
</div>

<!-- BOX -->
<div id="box" class="series-box"></div>

<!-- PLAYER -->
<div class="player">
<audio id="audio" controls></audio>
</div>

</div>

<script>

const data = {
"علامات الساعة": Array.from({length:43},(_,i)=>({
title:`علامات الساعة (${i+1})`,
file:`audio/alamat-${i+1}.mp3`
})),

"أمرني بخمس": Array.from({length:11},(_,i)=>({
title:`أمرني بخمس (${i+1})`,
file:`audio/amrany-bekams-${i+1}.mp3`
})),

"فضل الدعاء": Array.from({length:6},(_,i)=>({
title:`فضل الدعاء (${i+1})`,
file:`audio/fadl-aldoaa-${i+1}.mp3`
}))
};

let current = [];
let page = 1;
const perPage = 10;

function openSeries(name){
current = data[name];
page = 1;
render();
}

function render(){

let box = document.getElementById("box");
box.style.display = "block";

let start = (page-1)*perPage;
let end = start + perPage;

let list = current.slice(start,end);

let html = "";

list.forEach((l,i)=>{
html += `
<div class="lesson">
<span>${l.title}</span>
<div class="actions">
<button class="play" onclick="play(${start+i})">▶</button>
<a class="download" href="${l.file}" download>⬇</a>
</div>
</div>`;
});

html += `<div class="pagination">`;

let pages = Math.ceil(current.length/perPage);

for(let i=1;i<=pages;i++){
html += `<button onclick="go(${i})" class="${i===page?'active':''}">${i}</button>`;
}

html += `</div>`;

box.innerHTML = html;
}

function go(p){
page = p;
render();
}

function play(i){
document.getElementById("audio").src = current[i].file;
document.getElementById("audio").play();
}

document.getElementById("date").innerText =
new Date().toLocaleDateString("ar-EG");

</script>

</body>
</html>
