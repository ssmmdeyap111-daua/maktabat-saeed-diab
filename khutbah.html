<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطب المنبرية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #add8e6; --dark-blue: #2c5d87; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        .site-header { text-align: center; padding: 60px 20px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-size: 2.2rem; color: var(--dark-blue); font-weight: 900; }
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        .nav-link { padding: 10px 25px; background: var(--dark-blue); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        
        /* تصميم العناوين الجانبية */
        .section-group-title { color: var(--dark-blue); margin: 30px 0 15px; border-right: 8px solid var(--dark-blue); padding-right: 15px; font-weight: 900; font-size: 1.4rem; }
        
        .item-wrapper { background: white; margin-bottom: 12px; border-radius: 12px; overflow: hidden; border-right: 6px solid var(--bright-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .item-header { background: #f8fbff; padding: 18px; cursor: pointer; font-weight: 900; display: flex; justify-content: space-between; align-items: center; color: var(--dark-blue); }
        .item-content { display: none; padding: 10px; background: #fff; border-top: 1px solid #eee; }
        .lesson-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f5f5f5; flex-wrap: wrap; gap: 10px; }
        audio { height: 35px; width: 230px; }
        .download-btn { text-decoration: none; color: #27ae60; font-size: 1.2rem; font-weight: bold; }
        @media (max-width: 600px) { .lesson-item { flex-direction: column; text-align: center; } audio { width: 100%; } }
    </style>
</head>
<body>

<header class="site-header"><h1>الخطب المنبرية</h1></header>

<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="books.html" class="nav-link">المكتبة</a>
    <a href="lessons.html" class="nav-link">الدروس</a>
    <a href="khutbah.html" class="nav-link" style="background:var(--bright-blue); color: var(--dark-blue);">الخطب</a>
</div>

<div class="container">

    <div class="section-group-title">سلاسل فضائل الأعمال</div>

    <div class="item-wrapper">
        <div class="item-header" onclick="toggleItem('siam-list')"><span>فضائل الصيام</span><small>▼</small></div>
        <div class="item-content" id="siam-list"></div>
    </div>

    <div class="item-wrapper">
        <div class="item-header" onclick="toggleItem('salat-list')"><span>فضائل الصلاة</span><small>▼</small></div>
        <div class="item-content" id="salat-list"></div>
    </div>

    <div class="item-wrapper">
        <div class="item-header" onclick="toggleItem('hajj-list')"><span>فضائل الحج</span><small>▼</small></div>
        <div class="item-content" id="hajj-list"></div>
    </div>

    <div class="item-wrapper">
        <div class="item-header" onclick="toggleItem('zikr-list')"><span>فضائل ذكر الله</span><small>▼</small></div>
        <div class="item-content" id="zikr-list"></div>
    </div>

    <div class="item-wrapper">
        <div class="item-header" onclick="toggleItem('khuluq-list')"><span>فضائل حسن الخلق</span><small>▼</small></div>
        <div class="item-content" id="khuluq-list"></div>
    </div>

    <div class="item-wrapper">
        <div class="item-header" onclick="toggleItem('qiyam-list')"><span>فضائل قيام الليل</span><small>▼</small></div>
        <div class="item-content" id="qiyam-list"></div>
    </div>

    <div class="section-group-title">السلاسل الكبرى</div>

    <div class="item-wrapper">
        <div class="item-header" onclick="toggleItem('ganna-list')"><span>سلسلة وصف الجنة ونعيمها</span><small>▼</small></div>
        <div class="item-content" id="ganna-list"></div>
    </div>

    <div class="item-wrapper">
        <div class="item-header" onclick="toggleItem('sa-list')"><span>سلسلة علامات الساعة</span><small>▼</small></div>
        <div class="item-content" id="sa-list"></div>
    </div>

</div>

<script>
    function generateList(prefix, count, elementId, label) {
        const container = document.getElementById(elementId);
        if(!container) return;
        let html = "";
        for (let i = 1; i <= count; i++) {
            let audioUrl = "audio/" + prefix + "-" + i;
            html += `<div class="lesson-item">
                <span>${label} - الخطبة ${i}</span>
                <audio controls preload="none">
                    <source src="${audioUrl}.mp3" type="audio/mpeg">
                    <source src="${audioUrl}.MP3" type="audio/mpeg">
                </audio>
                <a href="${audioUrl}.mp3" download class="download-btn">📥</a>
            </div>`;
        }
        container.innerHTML = html;
    }

    function toggleItem(id) {
        const content = document.getElementById(id);
        content.style.display = (content.style.display === 'block') ? 'none' : 'block';
    }

    window.onload = function() {
        // توزيع السلاسل حسب طلبك (يمكنك تعديل الأعداد هنا)
        generateList('fdl-siam', 20, 'siam-list', 'فضائل الصيام');
        generateList('fdl-salat', 5, 'salat-list', 'فضائل الصلاة');
        generateList('fdl-hajj', 3, 'hajj-list', 'فضائل الحج');
        generateList('fdl-zikr', 5, 'zikr-list', 'فضائل ذكر الله');
        generateList('fdl-khuluq', 5, 'khuluq-list', 'فضائل حسن الخلق');
        generateList('fdl-qiyam', 3, 'qiyam-list', 'فضائل قيام الليل');
        
        // السلاسل الأخرى
        generateList('wasf-algana', 14, 'ganna-list', 'وصف الجنة');
        generateList('alamat', 40, 'sa-list', 'علامات الساعة');
    };
</script>
</body>
</html>
