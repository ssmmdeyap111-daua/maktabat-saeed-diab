<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قسم الخطب والمواعظ</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background:#f5f7fb;
}

/* الهيدر مثل موقعك */
.header{
background:linear-gradient(135deg,#cfe9f2,#b7dce8);
text-align:center;
padding:20px;
}

.header img{
max-width:600px;
width:100%;
}

/* الآية */
.ayah{
background:#fff;
border-top:2px solid #d4a017;
border-bottom:2px solid #d4a017;
padding:12px;
text-align:center;
color:#1f4e79;
font-size:18px;
}

/* البحث */
.search{
text-align:center;
margin:20px;
}

.search input{
width:60%;
padding:12px;
border-radius:25px;
border:1px solid #ccc;
font-family:'Cairo';
outline:none;
}

/* الأزرار */
.cats{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin:20px;
}

.cat{
padding:12px 18px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:900;
font-family:'Cairo';
color:#fff;
}

.cat1{background:#d4a017;}
.cat2{background:#5aa9e6;}
.cat3{background:#2d5f8b;}
.cat4{background:#3a7d44;}
.cat5{background:#8e44ad;}

/* الكتب (نفس موقعك تقريبًا) */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px;
padding:20px;
}

.book{
background:#fff;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
overflow:hidden;
cursor:pointer;
transition:.2s;
}

.book:hover{
transform:scale(1.03);
}

.book img{
width:100%;
height:180px;
object-fit:cover;
}

.book h3{
text-align:center;
padding:10px;
font-size:14px;
color:#1f4e79;
}

/* مشغل */
.player{
position:fixed;
bottom:0;
left:0;
right:0;
background:#fff;
border-top:1px solid #ccc;
padding:10px;
}

audio{
width:100%;
}
</style>
</head>

<body>

<!-- الهيدر -->
<div class="header">
    <img src="images/logo.png.jpg">
</div>

<!-- الآية -->
<div class="ayah">
قال الله تعالى: ﴿وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ﴾
</div>

<!-- البحث -->
<div class="search">
<input type="text" placeholder="ابحث عن خطبة..." oninput="search(this.value)">
</div>

<!-- الأقسام -->
<div class="cats">
<button class="cat cat1" onclick="filter('all')">الكل</button>
<button class="cat cat2" onclick="filter('علامات')">علامات الساعة</button>
<button class="cat cat3" onclick="filter('خمس')">أمرني بخمس</button>
<button class="cat cat4" onclick="filter('دعاء')">فضل الدعاء</button>
<button class="cat cat5" onclick="filter('منوع')">منوعات</button>
</div>

<!-- الكتب -->
<div class="grid" id="grid"></div>

<!-- مشغل -->
<div class="player">
<audio id="audio" controls></audio>
</div>

<script>

const tracks = [

...Array.from({length:43},(_,i)=>({
t:`علامات الساعة ${i+1}`,
s:`audio/alamat-${i+1}.mp3`,
c:"علامات",
img:"images/book1.jpg"
})),

...Array.from({length:11},(_,i)=>({
t:`أمرني بخمس ${i+1}`,
s:`audio/amrany-bekams-${i+1}.mp3`,
c:"خمس",
img:"images/book2.jpg"
})),

...Array.from({length:6},(_,i)=>({
t:`فضل الدعاء ${i+1}`,
s:`audio/fadl-aldoaa-${i+1}.mp3`,
c:"دعاء",
img:"images/book3.jpg"
})),

{t:"فضل الجمعة",s:"audio/fadl-algomaa.mp3",c:"منوع",img:"images/friday.jpg"},
{t:"فضل عرفة",s:"audio/fadl-arafa-1.mp3",c:"منوع",img:"images/arafa.jpg"},
{t:"فضل الحج",s:"audio/fadl-al-hag-1.mp3",c:"منوع",img:"images/hajj.jpg"},
{t:"الميثاق",s:"audio/almethaq.mp3",c:"منوع",img:"images/methaq.jpg"}

];

let currentList = tracks;
let audio = document.getElementById("audio");

/* عرض */
function render(list=tracks){
let box=document.getElementById("grid");
box.innerHTML="";

list.forEach((x,i)=>{
box.innerHTML+=`
<div class="book" onclick="play(${tracks.indexOf(x)})">
<img src="${x.img}">
<h3>${x.t}</h3>
</div>
`;
});
}

/* تشغيل */
function play(i){
audio.src=tracks[i].s;
audio.play();
}

/* فلترة */
function filter(c){
currentList = (c=="all") ? tracks : tracks.filter(x=>x.c==c);
render(currentList);
}

/* بحث */
function search(v){
let r = tracks.filter(x=>x.t.includes(v));
render(r);
}

render();

</script>

</body>
</html>
