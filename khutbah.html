<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطب المنبرية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: linear-gradient(to bottom, var(--light-sky), #d0e4ff); min-height: 100vh; }
        
        /* الهيدر والمواقيت */
        .top-info-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; position: absolute; width: 100%; box-sizing: border-box; z-index: 1000; }
        .oval-box { background: white; padding: 6px 20px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 2px solid var(--accent-blue); color: var(--dark-blue); font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .prayer-table { display: flex; gap: 5px; }
        .prayer-column { display: flex; flex-direction: column; align-items: center; width: 55px; }
        .prayer-name { background: var(--dark-blue); color: white; width: 100%; text-align: center; font-size: 0.7rem; border-radius: 8px 8px 0 0; }
        .prayer-time { background: white; color: var(--dark-blue); width: 100%; text-align: center; font-size: 0.8rem; font-weight: 900; border: 1px solid #ddd; border-radius: 0 0 5px 5px; }

        .site-header { text-align: center; padding: 45px 20px 25px; background: var(--header-bg); border-bottom: 4px solid #fff; }
        .site-header h1 { font-family: 'Reem Kufi', sans-serif; font-size: 2.2rem; color: var(--dark-blue); margin-top: 55px; }

        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .nav-link-3d { padding: 10px 18px; background: var(--accent-blue); color: white; text-decoration: none; border-radius: 12px; font-weight: bold; min-width: 100px; text-align: center; box-shadow: 0 5px 0 var(--dark-blue); display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .active-link { background: var(--gold-color); box-shadow: 0 5px 0 #b38f2d; }

        /* الحاوية */
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .section-title { color: var(--dark-blue); border-right: 6px solid var(--gold-color); padding-right: 15px; margin: 40px 0 20px; font-weight: 900; display: flex; align-items: center; gap: 10px; }

        /* تنسيق الخطبة (يمين - يسار) */
        .khutbah-item {
            background: white; border-radius: 15px; padding: 20px 30px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-right: 4px solid var(--accent-blue);
            transition: 0.3s;
        }
        .khutbah-item:hover { transform: scale(1.01); border-right-color: var(--gold-color); }

        .khutbah-info { flex: 1; text-align: right; }
        .khutbah-info h3 { margin: 0; color: var(--dark-blue); font-size: 1.25rem; font-weight: 800; }
        
        .khutbah-controls { display: flex; align-items: center; gap: 20px; flex: 1; justify-content: flex-end; }
        audio { height: 35px; width: 220px; }
        .download-btn { color: var(--gold-color); font-size: 1.5rem; transition: 0.3s; }
        .download-btn:hover { color: var(--dark-blue); transform: translateY(-3px); }

        /* الترقيم */
        .pagination { display: flex; justify-content: center; gap: 10px; margin: 50px 0; }
        .page-num { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: white; color: var(--dark-blue); border-radius: 10px; text-decoration: none; font-weight: bold; border: 1px solid var(--accent-blue); }
        .page-num.active { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }

        @media (max-width: 768px) {
            .khutbah-item { flex-direction: column; gap: 15px; text-align: center; }
            .khutbah-info { text-align: center; }
            .khutbah-controls { justify-content: center; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="top-info-bar">
        <div class="oval-box"><i class="fas fa-calendar-alt"></i><span id="full-date-display">...</span></div>
        <div class="oval-box" style="padding: 5px 10px;"><div class="prayer-table" id="prayer-table-display">...</div></div>
    </div>

    <header class="site-header"><h1>الخطب المنبرية</h1></header>

    <nav class="nav-bar">
        <a href="index.html" class="nav-link-3d"><i class="fas fa-home"></i>الرئيسية</a>
        <a href="books.html" class="nav-link-3d"><i class="fas fa-book-open"></i>الكتب</a>
        <a href="lessons.html" class="nav-link-3d"><i class="fas fa-microphone"></i>الدروس</a>
        <a href="khutbah.html" class="nav-link-3d active-link"><i class="fas fa-mosque"></i>الخطب</a>
        <a href="articles.html" class="nav-link-3d"><i class="fas fa-pen-nib"></i>المقالات</a>
    </nav>

    <div class="container">
        
        <h2 class="section-title"><i class="fas fa-moon"></i> خطب شهر رمضان المبارك</h2>
        
        <div class="khutbah-item">
            <div class="khutbah-info"><h3>كيف نستقبل شهر رمضان؟</h3></div>
            <div class="khutbah-controls">
                <audio controls preload="none"><source src="audio/ramadan.mp3" type="audio/mpeg"></audio>
                <a href="audio/ramadan.mp3" download class="download-btn"><i class="fas fa-file-download"></i></a>
            </div>
        </div>

        <div class="khutbah-item">
            <div class="khutbah-info"><h3>رمضان شهر القرآن</h3></div>
            <div class="khutbah-controls">
                <audio controls preload="none"><source src="audio/shahr-alqoran.mp3" type="audio/mpeg"></audio>
                <a href="audio/shahr-alqoran.mp3" download class="download-btn"><i class="fas fa-file-download"></i></a>
            </div>
        </div>

        <div class="khutbah-item">
            <div class="khutbah-info"><h3>فضل الاجتهاد في العشر الأواخر من رمضان</h3></div>
            <div class="khutbah-controls">
                <audio controls preload="none"><source src="audio/egthad.mp3" type="audio/mpeg"></audio>
                <a href="audio/egthad.mp3" download class="download-btn"><i class="fas fa-file-download"></i></a>
            </div>
        </div>

        <h2 class="section-title"><i class="fas fa- hourglass-half"></i> سلسلة علامات الساعة (35 خطبة)</h2>
        
        <div class="khutbah-item">
            <div class="khutbah-info"><h3>علامات الساعة - الدرس 01</h3></div>
            <div class="khutbah-controls">
                <audio controls preload="none"><source src="audio/alamat-20.mp3" type="audio/mpeg"></audio>
                <a href="audio/alamat-20.mp3" download class="download-btn"><i class="fas fa-file-download"></i></a>
            </div>
        </div>
        
        <div class="pagination">
            <a href="#" class="page-num active">1</a>
            <a href="#" class="page-num">2</a>
            <a href="#" class="page-num">3</a>
            <a href="#" class="page-num"><i class="fas fa-chevron-left"></i></a>
        </div>
    </div>

    <script>
        function updateLiveDate() {
            const today = new Date();
            const hijriOptions = { day: 'numeric', month: 'long', year: 'numeric' };
            let hijriDate = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', hijriOptions).format(today);
            document.getElementById('full-date-display').innerText = hijriDate + " هـ";
        }
        async function getPrayerTimes() {
            try {
                const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const data = await response.json();
                const t = data.data.timings;
                const prayers = [{name:"فجر",time:t.Fajr},{name:"ظهر",time:t.Dhuhr},{name:"عصر",time:t.Asr},{name:"مغرب",time:t.Maghrib},{name:"عشاء",time:t.Isha}];
                let html = '';
                prayers.forEach(p => {
                    html += `<div class="prayer-column"><div class="prayer-name">${p.name}</div><div class="prayer-time">${p.time}</div></div>`;
                });
                document.getElementById('prayer-table-display').innerHTML = html;
            } catch (e) { }
        }
        updateLiveDate(); getPrayerTimes();
    </script>
</body>
</html>
