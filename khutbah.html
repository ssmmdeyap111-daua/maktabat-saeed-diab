<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطب المنبرية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #eef5ff; 
            --accent-blue: #87ceeb; 
            --dark-blue: #2c5d87;
            --shadow-blue: #5f9ea0;
            --gold-color: #d4af37;
            --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: linear-gradient(to bottom, var(--light-sky), #d0e4ff); min-height: 100vh; }
        
        /* الهيدر الموحد */
        .site-header { text-align: center; padding: 50px 20px; background: var(--header-bg); border-bottom: 4px solid #ffffff; }
        .site-header h1 { margin: 0; font-size: 2.5rem; font-weight: 900; color: var(--dark-blue); }

        /* شريط التنقل */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .nav-link-3d { padding: 12px 20px; background: var(--accent-blue); color: white; text-decoration: none; border-radius: 12px; font-weight: bold; box-shadow: 0 5px 0 var(--shadow-blue); transition: 0.2s; }
        .nav-link-3d:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow-blue); }

        /* شريط الآية المذهب */
        .quran-strip-gold {
            background: rgba(255, 255, 255, 0.5); margin: 20px auto; width: 92%;
            padding: 15px 0; text-align: center; backdrop-filter: blur(5px);
            border-top: 3px double var(--gold-color); border-bottom: 3px double var(--gold-color);
        }
        .quran-text { font-family: 'Amiri', serif; font-size: 2rem; color: #8a6d3b; }

        /* تنسيق قسم الخطب */
        .section-title { text-align: center; color: var(--dark-blue); margin: 40px 0 20px; font-size: 2rem; }

        .khutbah-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px; max-width: 1200px; margin: 0 auto; padding: 20px;
        }

        .khutbah-card {
            background: white; border-radius: 15px; padding: 20px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-right: 6px solid var(--accent-blue);
            transition: 0.3s;
        }
        .khutbah-card:hover { transform: translateY(-5px); }

        .series-icon { font-size: 1.5rem; color: #e67e22; margin-left: 15px; }

        .khutbah-info h3 { margin: 0; color: var(--dark-blue); font-size: 1.1rem; }
        .khutbah-info p { margin: 5px 0 0; color: #888; font-size: 0.8rem; }
        
        .play-btn {
            background: var(--dark-blue); color: white; width: 45px; height: 45px;
            border-radius: 50%; display: flex; justify-content: center;
            align-items: center; text-decoration: none; transition: 0.3s;
        }

        .footer-rights { background: var(--header-bg); color: var(--dark-blue); text-align: center; padding: 25px; font-weight: bold; border-top: 4px solid #ffffff; margin-top: 50px; }

        .back-fixed { position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; background: var(--dark-blue); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 24px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <header class="site-header">
        <h1>الموقع الرسمي للشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-link-3d">الرئيسية</a>
        <a href="books.html" class="nav-link-3d">الكتب</a>
        <a href="lessons.html" class="nav-link-3d">الدروس</a>
        <a href="khutbah.html" class="nav-link-3d" style="background:var(--dark-blue)">الخطب</a>
        <a href="articles.html" class="nav-link-3d">المقالات</a>
    </div>

    <div class="quran-strip-gold">
        <span class="quran-text">﴿ اقْتَرَبَ لِلنَّاسِ حِسَابُهُمْ وَهُمْ فِي غَفْلَةٍ مُّعْرِضُونَ ﴾</span>
    </div>

    <div class="section-title">⏳ سلسلة علامات الساعة</div>

    <div class="khutbah-grid" id="khutbah-list">
        </div>

    <a href="index.html" class="back-fixed">🏠</a>

    <div class="footer-rights">
        جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب &copy; 2026
    </div>

    <script src="khutbah.data.js"></script>
</body>
</html>
