<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطب المنبرية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #eef5ff;
            --main-blue: #add8e6;
            --dark-blue: #2c5d87;
            --accent-blue: #87ceeb;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(to bottom, var(--light-blue), #d0e4ff);
            min-height: 100vh;
            padding-bottom: 120px;
        }

        /* العنوان الرئيسي الموحد */
        .site-header { 
            text-align: center; padding: 60px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }
        .sheikh-title { font-size: 2.2rem; color: var(--dark-blue); margin: 0; font-weight: 700; }

        /* شريط التنقل العلوي */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; background: rgba(255,255,255,0.2); }
        .nav-link { 
            padding: 10px 18px; background: var(--accent-blue); color: white; 
            text-decoration: none; border-radius: 10px; font-weight: bold;
            box-shadow: 0 4px 0 #5f9ea0; transition: 0.2s;
        }
        .nav-link:hover { transform: translateY(-2px); }

        /* بطاقات الخطب المحدثة */
        .lesson-card {
            background: white;
            margin: 25px auto;
            width: 85%;
            max-width: 800px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-right: 6px solid var(--accent-blue);
            transition: 0.3s;
        }
        .lesson-card:hover { transform: scale(1.01); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .lesson-card h3 { margin: 0 0 15px 0; color: var(--dark-blue); font-size: 1.3rem; }

        audio { width: 100%; height: 45px; margin-bottom: 15px; }

        /* زر التحميل 3D */
        .download-btn {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 0 #1e8449;
            transition: 0.1s;
        }
        .download-btn:active { transform: translateY(3px); box-shadow: 0 0 0; }

        /* أيقونة العودة أسفل اليسار */
        .back-fixed {
            position: fixed; bottom: 30px; left: 30px;
            width: 65px; height: 65px;
            background: linear-gradient(145deg, #add8e6, #87ceeb);
            color: var(--dark-blue); text-decoration: none;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 28px; box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border: 2px solid #ffffff; transition: 0.3s; z-index: 1000;
        }
        .back-fixed:hover { transform: scale(1.1) rotate(5deg); }

        footer { text-align: center; padding: 40px; color: var(--dark-blue); font-weight: bold; }
    </style>
</head>

<body>

    <header class="site-header">
        <h1 class="sheikh-title">الموقع الرسمي للشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">الرئيسية</a>
        <a href="books.html" class="nav-link">الكتب</a>
        <a href="lessons.html" class="nav-link">الدروس</a>
        <a href="khutbah.html" class="nav-link">الخطب</a>
        <a href="articles.html" class="nav-link">المقالات</a>
    </div>

    <h2 style="text-align: center; color: var(--dark-blue); margin-top: 40px;">الخطب المنبرية</h2>

    <div id="khutbahContainer"></div>

    <a href="index.html" class="back-fixed" title="الرئيسية">🏠</a>

    <footer>
        جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب &copy; 2026
    </footer>

    <script src="khutbahData.js"></script>

    <script>
        const container = document.getElementById("khutbahContainer");

        khutbahLessons.forEach(lesson => {
            container.innerHTML += `
            <div class="lesson-card">
                <h3>${lesson.title}</h3>
                <audio controls>
                    <source src="audio/${lesson.file}" type="audio/mpeg">
                    متصفحك لا يدعم مشغل الصوت.
                </audio>
                <a href="audio/${lesson.file}" download class="download-btn">
                    📥 تحميل الخطبة (MP3)
                </a>
            </div>
            `;
        });
    </script>

</body>
</html>
