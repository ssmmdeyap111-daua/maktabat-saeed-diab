<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطب المنبرية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #add8e6; --accent-blue: #5a9bd5; --dark-blue: #2c5d87;
            --gold-color: #c5a03d; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f4f7f9; color: #333; }

        /* الهيدر */
        .site-header { text-align: center; padding: 15px; background: var(--header-bg); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; height: auto; mix-blend-mode: multiply; }

        /* شريط التنقل - أيقونات صغيرة ومتناسقة */
        .nav-bar { display: flex; justify-content: center; gap: 8px; padding: 15px; flex-wrap: wrap; background: #fff; }
        .btn-small { 
            min-width: 120px; padding: 8px 15px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; 
            text-decoration: none; color: white; text-align: center; display: flex; align-items: center; 
            justify-content: center; gap: 6px; box-shadow: 0 4px 0 var(--dark-blue); transition: 0.2s; 
        }
        .btn-blue { background: linear-gradient(to bottom, #87ceeb, #5a9bd5); }
        .btn-gold { background: linear-gradient(to bottom, #d4af37, #b38f2d); box-shadow: 0 4px 0 #8c6d1a; }
        .btn-small:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--dark-blue); }

        /* الحاوية الرئيسية */
        .content-container { max-width: 1200px; margin: 20px auto 60px; padding: 0 20px; }
        .section-box { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .section-title { color: var(--dark-blue); font-size: 1.8rem; border-right: 6px solid var(--gold-color); padding-right: 12px; margin-bottom: 25px; text-align: center; }

        /* جدول الخطب - متسع ومنظم */
        .khutbah-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 1.1rem; }
        .khutbah-table th { background: #f8f9fa; color: var(--dark-blue); padding: 15px; border-bottom: 2px solid #eee; text-align: center; }
        .khutbah-table td { padding: 15px; border-bottom: 1px solid #f0f0f0; text-align: center; font-weight: bold; }
        .khutbah-table tr:hover { background: #fcfcfc; }
        
        .audio-player { width: 280px; height: 35px; }
        .btn-download { color: var(--dark-blue); font-size: 1.4rem; transition: 0.3s; }
        .btn-download:hover { color: var(--gold-color); }

        /* أزرار التنقل بين الصفحات */
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .page-link { padding: 8px 16px; border: 1px solid var(--accent-blue); border-radius: 5px; text-decoration: none; color: var(--dark-blue); font-weight: bold; transition: 0.3s; }
        .page-link.active { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }
        .page-link:hover:not(.active) { background: var(--light-sky); }

        footer { text-align: center; padding: 25px; color: #555; background: #e0f2f7; border-top: 3px solid #fff; font-weight: bold; }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="btn-small btn-blue"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="lessons.html" class="btn-small btn-blue"><i class="fas fa-microphone"></i> الصوتيات</a>
        <a href="khutbah.html" class="btn-small btn-gold"><i class="fas fa-mosque"></i> الخطب</a>
        <a href="books.html" class="btn-small btn-blue"><i class="fas fa-book"></i> الكتب</a>
        <a href="articles.html" class="btn-small btn-blue"><i class="fas fa-pen-nib"></i> المقالات</a>
    </nav>

    <div class="content-container">
        
        <div class="section-box">
            <h2 class="section-title">خطب شهر رمضان وفضل الصيام</h2>
            <table class="khutbah-table">
                <thead>
                    <tr>
                        <th width="40%">عنوان الخطبة</th>
                        <th width="45%">الاستماع</th>
                        <th width="15%">تحميل</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>ما أعده الله لك في رمضان</td>
                        <td><audio controls class="audio-player"><source src="audio/ramadan.mp3" type="audio/mpeg"></audio></td>
                        <td><a href="audio/ramadan.mp3" download class="btn-download"><i class="fas fa-cloud-download-alt"></i></a></td>
                    </tr>
                    <tr>
                    
                </tbody>
            </table>
        </div>

        <div class="section-box">
            <h2 class="section-title">سلسلة علامات الساعة (50 خطبة)</h2>
            <table class="khutbah-table">
                <thead>
                    <tr>
                        <th width="10%">رقم</th>
                        <th width="35%">عنوان الخطبة</th>
                        <th width="45%">الاستماع</th>
                        <th width="10%">تحميل</th>
                    </tr>
                </thead>
                <tbody id="alamat-list">
                    </tbody>
            </table>
            
            <div class="pagination" id="pagination-controls">
                </div>
        </div>

    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب الرسمي &copy; 2026</footer>

    <script>
        const totalAlamat = 50;
        const perPage = 12;
        let currentPage = 1;

        function displayAlamat(page) {
            const list = document.getElementById('alamat-list');
            list.innerHTML = "";
            
            const start = (page - 1) * perPage + 1;
            const end = Math.min(page * perPage, totalAlamat);

            for (let i = start; i <= end; i++) {
                list.innerHTML += `
                    <tr>
                        <td>${i}</td>
                        <td style="text-align:right;">سلسلة علامات الساعة - الجزء ${i}</td>
                        <td><audio controls class="audio-player"><source src="audio/alamat-${i}.mp3" type="audio/mpeg"></audio></td>
                        <td><a href="audio/alamat-${i}.mp3" download class="btn-download"><i class="fas fa-download"></i></a></td>
                    </tr>
                `;
            }
            updatePagination();
        }

        function updatePagination() {
            const controls = document.getElementById('pagination-controls');
            controls.innerHTML = "";
            const totalPages = Math.ceil(totalAlamat / perPage);

            for (let i = 1; i <= totalPages; i++) {
                const activeClass = (i === currentPage) ? "active" : "";
                controls.innerHTML += `<a href="#" class="page-link ${activeClass}" onclick="changePage(${i})">${i}</a>`;
            }
        }

        function changePage(i) {
            currentPage = i;
            displayAlamat(i);
            window.scrollTo(0, 500); // للعودة لأعلى الجدول عند تغيير الصفحة
        }

        // تشغيل الصفحة الأولى عند التحميل
        displayAlamat(1);
    </script>
</body>
</html>
