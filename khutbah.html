<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قسم الخطب والمواعظ - الشيخ سعيد مصطفى دياب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Cairo',sans-serif;
background:#f8fcff;
direction:rtl;
color: #333;
}

/* top bar */
.top-info-bar{
background:#fdfae9;
padding:10px 30px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
gap: 10px;
}

.date-box{
background:#fff;
border:1px solid #c59d31;
border-radius:25px;
padding:7px 25px;
font-weight:bold;
}

/* header */
.site-header{
background:#e0f2f7;
padding:30px 0;
border-bottom:5px solid #72bcd4;
text-align:center;
}

/* nav */
.main-nav{
display:flex;
justify-content:center;
gap:12px;
padding:25px;
flex-wrap:wrap;
background:#fff;
border-bottom:1px solid #eee;
}

.nav-item{
text-decoration:none;
color:#fff;
padding:14px 25px;
border-radius:12px;
font-weight:900;
font-size:1.05rem;
min-width:130px;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
box-shadow:0 6px 0 rgba(0,0,0,.15);
background:#2c5d87;
transition: 0.2s;
}

.nav-item:hover {
transform: translateY(-2px);
box-shadow: 0 8px 0 rgba(0,0,0,.15);
}

/* main */
.main-wrapper{
max-width:1200px;
margin:40px auto;
padding:0 20px;
text-align: center;
}

.page-title{
color:#2c5d87;
border-bottom:4px solid #c59d31;
padding-bottom:8px;
margin-bottom:25px;
font-size:2rem;
font-weight:900;
display:inline-block;
}

/* search */
.search-box{
margin:25px auto;
max-width:700px;
}

.search-box input{
width:100%;
padding:15px 25px;
border-radius:30px;
border:2px solid #72bcd4;
font-size:17px;
font-family: 'Cairo', sans-serif;
outline: none;
}

/* series buttons */
.series-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-top:35px;
}

.series-btn{
background:#72bcd4;
color:#fff;
border:none;
height:72px;
border-radius:12px;
cursor:pointer;
font-size:1.2rem;
font-weight:900;
box-shadow:0 6px 0 #2c5d87;
transition:.2s;
font-family: 'Cairo', sans-serif;
}

.series-btn:hover{
transform:translateY(-3px);
box-shadow:0 9px 0 #2c5d87;
}

.series-btn.active-series {
background: #2c5d87;
box-shadow: 0 6px 0 #c59d31;
}

/* lessons */
.lesson-list{
margin-top:35px;
display:none;
text-align: right;
}

.lesson-item{
background:#fff;
border-right:5px solid #c59d31;
padding:16px 20px;
margin-bottom:12px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 8px rgba(0,0,0,.05);
gap: 15px;
}

.lesson-title {
font-weight: bold;
font-size: 1.1rem;
color: #2c5d87;
}

.actions-container {
display: flex;
align-items: center;
gap: 15px;
}

.play-btn{
background:#2c5d87;
color:#fff;
border:none;
padding:8px 20px;
border-radius:8px;
cursor:pointer;
font-weight:900;
font-family: 'Cairo', sans-serif;
transition: 0.2s;
}

.play-btn:hover {
background: #1e4363;
}

.play-btn.playing {
background: #4f814f;
}

.download-btn{
color:#4f814f;
font-size:24px;
text-decoration: none;
display: flex;
align-items: center;
transition: 0.2s;
}

.download-btn:hover {
color: #c59d31;
}

/* player */
.player-box{
position: sticky;
bottom: 20px;
margin-top:40px;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 4px 20px rgba(0,0,0,.15);
border: 1px solid #ddd;
z-index: 100;
}

.player-title {
font-weight: bold;
color: #2c5d87;
margin-bottom: 8px;
font-size: 0.95rem;
text-align: right;
display: none;
}

audio{width:100%; height: 40px;}

/* footer */
footer{
padding:40px;
background:#fdfae9;
margin-top:60px;
border-top:1px solid #ddd;
font-weight:bold;
color:#555;
text-align:center;
}

@media (max-width: 768px) {
    .lesson-item {
        flex-direction: column;
        text-align: center;
        padding: 20px;
    }
    .actions-container {
        width: 100%;
        justify-content: center;
        margin-top: 10px;
    }
    .play-btn {
        flex-grow: 1;
    }
}
</style>
</head>

<body>

<!-- TOP -->
<div class="top-info-bar">
<div class="date-box" id="current-date">📅 جاري تحميل التاريخ...</div>
</div>

<!-- HEADER -->
<div class="site-header">
<h2>قسم الخطب والمواعظ</h2>
</div>

<!-- NAV -->
<div class="main-nav">
<a class="nav-item" href="index.html">الرئيسية</a>
<a class="nav-item" href="#">الخطب</a>
<a class="nav-item" href="#">الأذكار</a>
</div>

<!-- MAIN -->
<div class="main-wrapper">

<div class="page-title">قسم الخطب والمواعظ</div>

<div class="search-box">
<input id="searchInput" placeholder="ابحث عن سلسلة...">
</div>

<!-- SERIES -->
<div class="series-grid">
<button class="series-btn" onclick="loadSeries('علامات الساعة', this)">علامات الساعة</button>
<button class="series-btn" onclick="loadSeries('أمرني بخمس', this)">أمرني بخمس</button>
<button class="series-btn" onclick="loadSeries('فضل الدعاء', this)">فضل الدعاء</button>
<button class="series-btn" onclick="loadSeries('فضل يوم الجمعة', this)">فضل يوم الجمعة</button>
<button class="series-btn" onclick="loadSeries('فضل يوم عرفة', this)">فضل يوم عرفة</button>
<button class="series-btn" onclick="loadSeries('فضل الحج', this)">فضل الحج</button>
</div>

<!-- LESSON LIST -->
<div id="lessonList" class="lesson-list"></div>

<!-- PLAYER -->
<div class="player-box">
<div class="player-title" id="player-title">🔊 مشغل الآن: <span></span></div>
<audio id="player" controls></audio>
</div>

</div>

<footer>
جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب © 2026
</footer>

<script>
const data = {
"علامات الساعة":[...Array.from({length:43},(_,i)=>({
title:`الدرس ${i+1}`,
file:`audio/alamat-${i+1}.mp3`
}))],

"أمرني بخمس":[...Array.from({length:11},(_,i)=>({
title:`الدرس ${i+1}`,
file:`audio/amrany-bekams-${i+1}.mp3`
}))],

"فضل الدعاء":[...Array.from({length:6},(_,i)=>({
title:`الدرس ${i+1}`,
file:`audio/fadl-aldoaa-${i+1}.mp3`
}))],

"فضل يوم الجمعة":[{
title:"فضل يوم الجمعة",
file:"audio/fadl-algomaa.mp3"
}],

"فضل يوم عرفة":[{
title:"فضل يوم عرفة",
file:"audio/fadl-arafa-1.mp3"
}],

"فضل الحج":[{
title:"فضل الحج",
file:"audio/fadl-al-hag-1.mp3"
}]
};

const lessonList = document.getElementById("lessonList");
const player = document.getElementById("player");
const search = document.getElementById("searchInput");
const playerTitle = document.getElementById("player-title");

let playlist = [];
let currentIndex = 0;
let currentSeriesName = "";

// ربط تشغيل السلسلة بطريقة مستقرة
function loadSeries(name, btnElement) {
    document.querySelectorAll(".series-btn").forEach(b => b.classList.remove("active-series"));
    if(btnElement) btnElement.classList.add("active-series");
    
    currentSeriesName = name;
    playlist = data[name];
    showLessons(name);
}

/* عرض الدروس */
function showLessons(series){
    lessonList.style.display = "block";
    lessonList.innerHTML = "";

    data[series].forEach((lesson, index)=>{
        lessonList.innerHTML += `
        <div class="lesson-item">
            <div class="lesson-title">${series} - ${lesson.title}</div>
            <div class="actions-container">
                <button class="play-btn" id="btn-${index}" onclick="play(${index})">▶ تشغيل</button>
                <a class="download-btn" href="${lesson.file}" download title="تحميل الملف">
                    <i class="fas fa-circle-down"></i>
                </a>
            </div>
        </div>`;
    });

    window.scrollTo({
        top: lessonList.offsetTop - 80,
        behavior: "smooth"
    });
    
    updatePlayButtonVisuals();
}

/* دالة التشغيل المستقرة */
function play(i){
    if (!playlist || playlist.length === 0 || !playlist[i]) return;
    
    currentIndex = i;
    player.src = playlist[currentIndex].file;
    
    // تحديث عنوان المشغل الحالي
    playerTitle.style.display = "block";
    playerTitle.querySelector("span").innerText = `${currentSeriesName} (${playlist[currentIndex].title})`;
    
    player.play().catch(e => console.log("تم حظر التشغيل التلقائي مؤقتاً حتى يتفاعل المستخدم"));

    localStorage.setItem("khutbah-last", JSON.stringify({
        seriesName: currentSeriesName,
        index: currentIndex
    }));
    
    updatePlayButtonVisuals();
}

function updatePlayButtonVisuals() {
    document.querySelectorAll(".play-btn").forEach(btn => {
        btn.classList.remove("playing");
        btn.innerText = "▶ تشغيل";
    });
    const currentBtn = document.getElementById(`btn-${currentIndex}`);
    if (currentBtn && playlist === data[currentSeriesName]) {
        currentBtn.classList.add("playing");
        currentBtn.innerText = "⏸ قيد التشغيل";
    }
}

/* تشغيل التالي تلقائياً */
player.onended = function(){
    if(currentIndex < playlist.length - 1){
        play(currentIndex + 1);
    }
};

/* البحث المطور */
search.addEventListener("input", function(){
    const txt = this.value.trim();
    document.querySelectorAll(".series-btn").forEach(btn=>{
        btn.style.display = btn.innerText.includes(txt) ? "block" : "none";
    });
});

/* استرجاع هادئ لآخر ملف بدون كسر سياسة المتصفح */
window.addEventListener("DOMContentLoaded", () => {
    try {
        const last = JSON.parse(localStorage.getItem("khutbah-last"));
        if (last && data[last.seriesName]) {
            currentSeriesName = last.seriesName;
            playlist = data[last.seriesName];
            currentIndex = last.index;
            
            player.src = playlist[currentIndex].file;
            playerTitle.style.display = "block";
            playerTitle.querySelector("span").innerText = `${currentSeriesName} (${playlist[currentIndex].title})`;
        }
    } catch(e) {}
    
    // تحديث التاريخ الحالي تلقائياً
    const now = new Date();
    const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now);
    const miladi = new Intl.DateTimeFormat('ar-EG', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now);
    document.getElementById('current-date').innerHTML = `📅 ${hijri} هـ | ${miladi} م`;
});
</script>

</body>
</html>
