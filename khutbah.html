<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قسم الخطب والمواعظ - الشيخ سعيد مصطفى دياب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Cairo',sans-serif;
background:#f8fcff;
direction:rtl;
}

/* top bar */
.top-info-bar{
background:#fdfae9;
padding:10px 30px;
display:flex;
justify-content:space-between;
flex-wrap:wrap;
border-bottom:1px solid #ddd;
}

.date-box{
background:#fff;
border:1px solid #c59d31;
border-radius:25px;
padding:7px 20px;
font-weight:bold;
}

/* header */
.site-header{
background:#e0f2f7;
padding:25px;
text-align:center;
border-bottom:5px solid #72bcd4;
}

/* nav */
.main-nav{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
background:#fff;
padding:15px;
}

.nav-item{
background:#2c5d87;
color:#fff;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

/* main */
.main-wrapper{
max-width:1200px;
margin:30px auto;
padding:0 15px;
}

.page-title{
color:#2c5d87;
font-size:1.8rem;
font-weight:900;
margin-bottom:20px;
border-bottom:3px solid #c59d31;
display:inline-block;
padding-bottom:5px;
}

/* search */
.search-box input{
width:100%;
padding:12px;
border-radius:25px;
border:2px solid #72bcd4;
font-size:16px;
}

/* series */
.series-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:25px;
}

.series-btn{
background:#72bcd4;
color:#fff;
border:none;
padding:15px;
border-radius:10px;
font-size:18px;
font-weight:900;
cursor:pointer;
box-shadow:0 5px 0 #2c5d87;
}

/* lessons */
.lesson-list{margin-top:25px;display:none;}

.lesson-item{
background:#fff;
padding:12px;
margin-bottom:10px;
border-right:5px solid #c59d31;
display:flex;
justify-content:space-between;
border-radius:10px;
}

.play-btn{
background:#2c5d87;
color:#fff;
border:none;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
}

.download-btn{
color:#4f814f;
font-size:20px;
margin-right:10px;
}

/* player */
.player-box{
margin-top:25px;
background:#fff;
padding:10px;
border-radius:10px;
}

audio{width:100%;}

/* footer */
footer{
text-align:center;
padding:30px;
background:#fdfae9;
margin-top:40px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-info-bar">
<div class="date-box">📅 اليوم</div>
</div>

<!-- HEADER -->
<div class="site-header">
<h2>مكتبة الخطب والمواعظ</h2>
</div>

<!-- NAV -->
<div class="main-nav">
<a class="nav-item" href="index.html">الرئيسية</a>
<a class="nav-item" href="#">الخطب</a>
<a class="nav-item" href="#">الأذكار</a>
</div>

<!-- MAIN -->
<div class="main-wrapper">

<div class="page-title">قسم الخطب</div>

<div class="search-box">
<input id="searchInput" placeholder="ابحث عن سلسلة...">
</div>

<!-- SERIES -->
<div class="series-grid">

<button class="series-btn">علامات الساعة</button>
<button class="series-btn">أمرني بخمس</button>
<button class="series-btn">فضل الدعاء</button>
<button class="series-btn">فضل يوم الجمعة</button>
<button class="series-btn">فضل يوم عرفة</button>
<button class="series-btn">فضل الحج</button>

</div>

<!-- LESSON LIST -->
<div id="lessonList" class="lesson-list"></div>

<!-- PLAYER -->
<div class="player-box">
<audio id="player" controls></audio>
</div>

</div>

<footer>
جميع الحقوق محفوظة © 2026
</footer>

<script>

const data = {
"علامات الساعة":[...Array.from({length:5},(_,i)=>({title:`درس ${i+1}`,file:`audio/alamat-${i+1}.mp3`}))],
"أمرني بخمس":[...Array.from({length:3},(_,i)=>({title:`درس ${i+1}`,file:`audio/amrany-${i+1}.mp3`}))],
"فضل الدعاء":[...Array.from({length:3},(_,i)=>({title:`درس ${i+1}`,file:`audio/dua-${i+1}.mp3`}))],
"فضل يوم الجمعة":[{title:"درس",file:"audio/jumaa.mp3"}],
"فضل يوم عرفة":[{title:"درس",file:"audio/arafa.mp3"}],
"فضل الحج":[{title:"درس",file:"audio/hajj.mp3"}]
};

const lessonList=document.getElementById("lessonList");
const player=document.getElementById("player");
const search=document.getElementById("searchInput");

let playlist=[];
let currentIndex=0;

document.querySelectorAll(".series-btn").forEach(btn=>{
btn.onclick=function(){
const name=this.innerText;
playlist=data[name]||[];
showLessons(name);
};
});

function showLessons(series){
lessonList.style.display="block";
lessonList.innerHTML="";

data[series].forEach((lesson,index)=>{
lessonList.innerHTML+=`
<div class="lesson-item">
<div>${lesson.title}</div>
<div>
<button class="play-btn" onclick="play(${index})">▶</button>
<a class="download-btn" href="${lesson.file}" download>⬇</a>
</div>
</div>`;
});
}

function play(i){
currentIndex=i;
player.src=playlist[i].file;
player.play();
}

search.addEventListener("keyup",function(){
const txt=this.value;
document.querySelectorAll(".series-btn").forEach(btn=>{
btn.style.display=btn.innerText.includes(txt)?"block":"none";
});
});

</script>

</body>
</html>
