<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخطب والمواعظ</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
font-family:'Cairo',sans-serif;
background:#f5fbff;
margin:0;
}

/* TOP */
.topbar{
background:#fdfae9;
display:flex;
justify-content:space-between;
padding:10px 20px;
}

.box{
background:#fff;
padding:6px 14px;
border-radius:20px;
border:1px solid #c59d31;
font-weight:bold;
}

/* NAV 3D */
.nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:15px;
background:#fff;
}

.nav a{
background:#2c5d87;
color:#fff;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
box-shadow:0 5px 0 #1b3c59;
}

/* SERIES */
.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.series-btn{
width:100%;
background:#72bcd4;
border:none;
padding:15px;
margin:8px 0;
border-radius:12px;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
box-shadow:0 6px 0 #2c5d87;
text-align:right;
}

.series-btn.active{
background:#2c5d87;
}

/* LESSONS */
.series-box{
display:none;
margin-bottom:20px;
}

.lesson{
background:#fff;
margin:8px 0;
padding:12px;
border-right:5px solid #c59d31;
display:flex;
justify-content:space-between;
align-items:center;
border-radius:10px;
transition:.2s;
}

.lesson.active{
background:#eaf6ff;
}

.actions button,
.actions a{
margin-left:5px;
border:none;
cursor:pointer;
padding:6px 10px;
border-radius:8px;
}

.play{
background:#2c5d87;
color:#fff;
}

.download{
background:#27ae60;
color:#fff;
text-decoration:none;
}

/* PAGINATION */
.pagination{
text-align:center;
margin-top:10px;
}

.pagination button{
margin:3px;
padding:6px 10px;
border:none;
background:#eee;
cursor:pointer;
border-radius:6px;
}

.pagination button.active{
background:#2c5d87;
color:#fff;
}

/* PLAYER */
.player{
position:sticky;
bottom:10px;
background:#fff;
padding:10px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-top:20px;
}

audio{width:100%;}
</style>

</head>

<body>

<div class="topbar">
<div class="box" id="date"></div>
<div class="box">مواقيت الصلاة</div>
</div>

<div class="nav">
<a href="index.html">الرئيسية</a>
<a href="audio.html">الصوتيات</a>
<a href="tafseer.html">التفسير</a>
<a href="books.html">الكتب</a>
<a href="articles.html">المقالات</a>
<a href="khutbah.html">الخطب</a>
</div>

<div class="container">

<h2 style="text-align:center;color:#2c5d87">قسم الخطب والمواعظ</h2>

<!-- SERIES -->
<button class="series-btn" onclick="toggleSeries('علامات الساعة',this)">علامات الساعة</button>
<div class="series-box"></div>

<button class="series-btn" onclick="toggleSeries('أمرني بخمس',this)">أمرني بخمس</button>
<div class="series-box"></div>

<button class="series-btn" onclick="toggleSeries('فضل الدعاء',this)">فضل الدعاء</button>
<div class="series-box"></div>

</div>

<div class="player">
<audio id="audio" controls></audio>
</div>

<script>

const data = {
"علامات الساعة": Array.from({length:43},(_,i)=>({
title:`علامات الساعة (${i+1})`,
file:`audio/alamat-${i+1}.mp3`
})),

"أمرني بخمس": Array.from({length:11},(_,i)=>({
title:`أمرني بخمس (${i+1})`,
file:`audio/amrany-bekams-${i+1}.mp3`
})),

"فضل الدعاء": Array.from({length:6},(_,i)=>({
title:`فضل الدعاء (${i+1})`,
file:`audio/fadl-aldoaa-${i+1}.mp3`
}))
};

let current=[], currentBox=null, page=1, perPage=10;

function toggleSeries(name,btn){

document.querySelectorAll(".series-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");

current = data[name] || [];
page = 1;

render(btn.nextElementSibling);
}

function render(box){

currentBox = box;

let start=(page-1)*perPage;
let list=current.slice(start,start+perPage);

let html="";

list.forEach((l,i)=>{
html+=`
<div class="lesson">
<span>${l.title}</span>
<div class="actions">
<button class="play" onclick="play(${start+i},this)">▶</button>
<a class="download" href="${l.file}" download>⬇</a>
</div>
</div>`;
});

let pages=Math.ceil(current.length/perPage);

html+=`<div class="pagination">`;

for(let i=1;i<=pages;i++){
html+=`<button onclick="go(${i})" class="${i===page?'active':''}">${i}</button>`;
}

html+=`</div>`;

box.innerHTML=html;
box.style.display="block";
}

function go(p){
page=p;
render(currentBox);
}

function play(i,btn){

document.querySelectorAll(".lesson").forEach(l=>l.classList.remove("active"));
btn.closest(".lesson").classList.add("active");

document.getElementById("audio").src=current[i].file;
document.getElementById("audio").play();
}

document.getElementById("date").innerText=
new Date().toLocaleDateString("ar-EG");

</script>

</body>
</html>
