<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قسم الخطب والمواعظ - الشيخ سعيد مصطفى دياب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Cairo',sans-serif;
background:#f8fcff;
direction:rtl;
color:#333;
}

.top-info-bar{
background:#fdfae9;
padding:10px 25px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.date-box{
background:#fff;
border:1px solid #c59d31;
border-radius:20px;
padding:7px 18px;
font-weight:bold;
}

.site-header{
background:#e0f2f7;
padding:25px;
text-align:center;
border-bottom:4px solid #72bcd4;
}

.main-nav{
display:flex;
justify-content:center;
gap:10px;
padding:15px;
background:#fff;
flex-wrap:wrap;
}

.nav-item{
background:#2c5d87;
color:#fff;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.main-wrapper{
max-width:1100px;
margin:auto;
padding:20px;
text-align:center;
}

.series-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
margin-top:20px;
}

.series-btn{
background:#72bcd4;
color:#fff;
border:none;
padding:14px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
transition:.2s;
}

.series-btn:hover{
transform:scale(1.03);
}

.series-btn.active-series{
background:#2c5d87;
}

.lesson-list{
margin-top:20px;
display:none;
}

.lesson-item{
background:#fff;
margin:10px 0;
padding:12px;
border-right:4px solid #c59d31;
display:flex;
justify-content:space-between;
align-items:center;
border-radius:8px;
}

.play-btn{
background:#2c5d87;
color:#fff;
border:none;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
}

.player-box{
position:sticky;
bottom:10px;
background:#fff;
padding:15px;
border-radius:10px;
margin-top:20px;
box-shadow:0 3px 15px rgba(0,0,0,.1);
}

audio{width:100%;}
</style>

</head>

<body>

<div class="top-info-bar">
<div class="date-box" id="date"></div>
</div>

<div class="site-header">
<h2>قسم الخطب والمواعظ</h2>
</div>

<div class="main-nav">
<a class="nav-item" href="index.html">الرئيسية</a>
<a class="nav-item" href="khutbah.html">الخطب</a>
<a class="nav-item" href="raq_azkar.html">الأذكار</a>
</div>

<div class="main-wrapper">

<div class="series-grid">
<button class="series-btn" onclick="load('علامات الساعة',this)">علامات الساعة</button>
<button class="series-btn" onclick="load('أمرني بخمس',this)">أمرني بخمس</button>
<button class="series-btn" onclick="load('فضل الدعاء',this)">فضل الدعاء</button>
<button class="series-btn" onclick="load('فضل يوم الجمعة',this)">فضل يوم الجمعة</button>
<button class="series-btn" onclick="load('فضل يوم عرفة',this)">فضل يوم عرفة</button>
<button class="series-btn" onclick="load('فضل الحج',this)">فضل الحج</button>
</div>

<div id="list" class="lesson-list"></div>

<div class="player-box">
<audio id="player" controls></audio>
</div>

</div>

<script>

const data = {
"علامات الساعة": Array.from({length:43},(_,i)=>({
title:`علامات الساعة - ${i+1}`,
file:`audio/alamat-${i+1}.mp3`
})),

"أمرني بخمس": Array.from({length:11},(_,i)=>({
title:`أمرني بخمس - ${i+1}`,
file:`audio/amrany-bekams-${i+1}.mp3`
})),

"فضل الدعاء": Array.from({length:6},(_,i)=>({
title:`فضل الدعاء - ${i+1}`,
file:`audio/fadl-aldoaa-${i+1}.mp3`
}))
};

let current=[];

function load(name,btn){

document.querySelectorAll(".series-btn").forEach(b=>b.classList.remove("active-series"));
if(btn) btn.classList.add("active-series");

current = data[name] || [];

let html = "";

current.forEach((l,i)=>{
html += `
<div class="lesson-item">
<span>${l.title}</span>
<button class="play-btn" onclick="play(${i})">تشغيل</button>
</div>`;
});

document.getElementById("list").style.display="block";
document.getElementById("list").innerHTML = html;
}

function play(i){
document.getElementById("player").src = current[i].file;
document.getElementById("player").play();
}

document.getElementById("date").innerText = new Date().toLocaleDateString("ar-EG");

</script>

</body>
</html>
