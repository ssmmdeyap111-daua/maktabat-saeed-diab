<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>متجر مكتبة الخطب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background:#f4f6f9;
}

/* الهيدر */
header{
background:#1e3c72;
color:#fff;
padding:15px;
text-align:center;
font-weight:900;
}

/* بحث */
.search{
padding:10px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
font-family:'Cairo';
}

/* grid */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px;
padding:10px;
}

/* card */
.card{
background:#fff;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.1);
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:120px;
object-fit:cover;
}

.card .title{
padding:8px;
font-weight:800;
text-align:center;
color:#1e3c72;
}

/* صفحة التفاصيل */
.detail{
display:none;
position:fixed;
top:0;left:0;right:0;bottom:0;
background:#fff;
z-index:10;
padding:15px;
overflow:auto;
}

.detail img{
width:100%;
border-radius:10px;
}

.btn{
display:block;
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:900;
cursor:pointer;
}

.play{background:#1db954;color:#fff;}
.download{background:#1e3c72;color:#fff;}
.fav{background:#ffcc00;}

.back{
background:#333;
color:#fff;
margin-bottom:10px;
}
</style>
</head>

<body>

<header>🛒 متجر مكتبة الخطب</header>

<div class="search">
<input type="text" placeholder="ابحث عن خطبة..." oninput="search(this.value)">
</div>

<div class="grid" id="grid"></div>

<!-- صفحة التفاصيل -->
<div class="detail" id="detail">

<button class="btn back" onclick="closeDetail()">⬅ رجوع</button>

<img id="dimg">
<h2 id="dtitle"></h2>

<button class="btn play" onclick="play()">▶ تشغيل</button>
<button class="btn download" id="dlink">⬇ تحميل</button>
<button class="btn fav" onclick="fav()">❤️ مفضلة</button>

<audio id="audio" controls style="width:100%;margin-top:10px;"></audio>

</div>

<script>

/* البيانات */
const tracks = [

...Array.from({length:43},(_,i)=>({
t:`علامات الساعة ${i+1}`,
s:`audio/alamat-${i+1}.mp3`,
img:"images/alamats.jpg"
})),

...Array.from({length:11},(_,i)=>({
t:`أمرني بخمس ${i+1}`,
s:`audio/amrany-bekams-${i+1}.mp3`,
img:"images/dua.jpg"
})),

...Array.from({length:6},(_,i)=>({
t:`فضل الدعاء ${i+1}`,
s:`audio/fadl-aldoaa-${i+1}.mp3`,
img:"images/dua.jpg"
})),

{t:"فضل الجمعة",s:"audio/fadl-algomaa.mp3",img:"images/friday.jpg"},
{t:"فضل عرفة",s:"audio/fadl-arafa-1.mp3",img:"images/arafa.jpg"},
{t:"فضل الحج",s:"audio/fadl-al-hag-1.mp3",img:"images/hajj.jpg"},
{t:"الميثاق",s:"audio/almethaq.mp3",img:"images/methaq.jpg"}

];

let current=null;
let audio=document.getElementById("audio");

/* عرض */
function render(list=tracks){
let g=document.getElementById("grid");
g.innerHTML="";

list.forEach((x,i)=>{
g.innerHTML+=`
<div class="card" onclick="openDetail(${i})">
<img src="${x.img}">
<div class="title">${x.t}</div>
</div>
`;
});
}

/* فتح التفاصيل */
function openDetail(i){
current=i;

document.getElementById("detail").style.display="block";
document.getElementById("dimg").src=tracks[i].img;
document.getElementById("dtitle").innerText=tracks[i].t;

document.getElementById("dlink").href=tracks[i].s;

audio.src=tracks[i].s;

}

/* إغلاق */
function closeDetail(){
document.getElementById("detail").style.display="none";
audio.pause();
}

/* تشغيل */
function play(){
audio.play();
}

/* مفضلة */
function fav(){
let favs=JSON.parse(localStorage.getItem("fav")||"[]");
favs.push(tracks[current]);
localStorage.setItem("fav",JSON.stringify(favs));
alert("تمت الإضافة للمفضلة ❤️");
}

/* بحث */
function search(v){
let r=tracks.filter(x=>x.t.includes(v));
render(r);
}

render();

</script>

</body>
</html>
