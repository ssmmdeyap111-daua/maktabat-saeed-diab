<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطب المنبرية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; --shadow-color: #5da0bc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        
        .site-header { 
            text-align: center; 
            padding: 60px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 6px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .site-header h1 { margin: 0; font-size: 2.5rem; color: var(--dark-blue); font-weight: 900; }
        
        .nav-bar { display: flex; justify-content: center; padding: 20px; flex-wrap: wrap; gap: 10px; }
        
        .btn-3d { 
            padding: 12px 25px; background: white; border-radius: 15px;
            text-decoration: none; color: var(--dark-blue); font-weight: bold;
            box-shadow: 0 5px 0 var(--shadow-color); transition: 0.1s;
            display: flex; align-items: center; justify-content: center; min-width: 120px;
        }
        .btn-3d:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow-color); }
        .active-btn { background: var(--bright-blue); color: white; box-shadow: 0 5px 0 var(--dark-blue); }

        .container { max-width: 900px; margin: 20px auto; padding: 15px; }
        .section-title { color: var(--dark-blue); border-bottom: 3px solid var(--bright-blue); padding-bottom: 10px; margin: 40px 0 20px; font-weight: 900; display: flex; align-items: center; gap: 10px; }

        .khutbah-item {
            background: white;
            margin-bottom: 12px;
            padding: 15px 20px;
            border-radius: 12px;
            border-right: 6px solid var(--bright-blue);
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .khutbah-info h3 { margin: 0; color: var(--dark-blue); font-size: 1.1rem; }
        .khutbah-controls { display: flex; align-items: center; gap: 15px; }
        audio { height: 35px; width: 220px; }
        .download-btn { text-decoration: none; color: #27ae60; font-size: 1.4rem; transition: 0.2s; }
        .download-btn:hover { transform: scale(1.2); }

        @media (max-width: 600px) {
            .khutbah-item { flex-direction: column; text-align: center; }
            audio { width: 100%; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>الخطب المنبرية للشيخ سعيد مصطفى دياب</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-3d">الرئيسية</a>
    <a href="books.html" class="btn-3d">المكتبة</a>
    <a href="lessons.html" class="btn-3d">الدروس</a>
    <a href="khutbah.html" class="btn-3d active-btn">الخطب</a>
</div>

<div class="container">
    
    <h2 class="section-title"><i class="fas fa-moon"></i> خطب شهر رمضان المبارك</h2>
    
    <div class="khutbah-item">
        <div class="khutbah-info"><h3>كيف نستقبل شهر رمضان؟</h3></div>
        <div class="khutbah-controls">
            <audio controls preload="none"><source src="audio/ramadan.mp3" type="audio/mpeg"></audio>
            <a href="audio/ramadan.mp3" download class="download-btn"><i class="fas fa-file-download"></i></a>
        </div>
    </div>

    <div class="khutbah-item">
        <div class="khutbah-info"><h3>رمضان شهر القرآن</h3></div>
        <div class="khutbah-controls">
            <audio controls preload="none"><source src="audio/shahr-alqoran.mp3" type="audio/mpeg"></audio>
            <a href="audio/shahr-alqoran.mp3" download class="download-btn"><i class="fas fa-file-download"></i></a>
        </div>
    </div>

    <h2 class="section-title"><i class="fas fa-history"></i> سلسلة علامات الساعة (30 خطبة)</h2>
    <div id="series-container"></div>

    <h2 class="section-title"><i class="fas fa-microphone"></i> خطب متنوعة</h2>
    <div class="khutbah-item">
        <div class="khutbah-info"><h3>أهمية السعي في طلب الرزق</h3></div>
        <div class="khutbah-controls">
            <audio controls preload="none"><source src="audio/alsai.mp3" type="audio/mpeg"></audio>
            <a href="audio/alsai.mp3" download class="download-btn"><i class="fas fa-file-download"></i></a>
        </div>
    </div>

</div>

<script>
    // توليد سلسلة علامات الساعة تلقائياً
    const container = document.getElementById('series-container');
    let htmlContent = '';
    for (let i = 1; i <= 30; i++) {
        let num = i < 10 ? '0' + i : i;
        htmlContent += `
        <div class="khutbah-item">
            <div class="khutbah-info"><h3>علامات الساعة - الخطبة رقم (${num})</h3></div>
            <div class="khutbah-controls">
                <audio controls preload="none"><source src="audio/alamat-${num}.mp3" type="audio/mpeg"></audio>
                <a href="audio/alamat-${num}.mp3" download class="download-btn"><i class="fas fa-file-download"></i></a>
            </div>
        </div>`;
    }
    container.innerHTML = htmlContent;
</script>

</body>
</html>
