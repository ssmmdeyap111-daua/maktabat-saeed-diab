<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قسم الخطب والمواعظ - الشيخ سعيد مصطفى دياب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cairo',sans-serif;
background:#f8fcff;
direction:rtl;
}

/*==========================
شريط التاريخ ومواقيت الصلاة
==========================*/

.top-info-bar{
background:#fdfae9;
padding:10px 30px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.prayer-times{
display:flex;
gap:6px;
flex-wrap:wrap;
}

.prayer-box{
background:#4f814f;
color:#fff;
border-radius:6px;
padding:4px 10px;
font-size:.8rem;
text-align:center;
min-width:60px;
}

.time-val{
background:#fff;
color:#4f814f;
margin-top:3px;
border-radius:4px;
font-weight:bold;
}

.date-box{
background:#fff;
border:1px solid #c59d31;
border-radius:25px;
padding:7px 25px;
font-weight:bold;
}

/*==========================
الهيدر
==========================*/

.site-header{
background:#e0f2f7;
padding:30px 0;
border-bottom:5px solid #72bcd4;
}

.site-header img{
max-width:600px;
width:90%;
display:block;
margin:auto;
mix-blend-mode:multiply;
}

/*==========================
القائمة الرئيسية
==========================*/

.main-nav{

display:flex;
justify-content:center;
gap:12px;
padding:25px;
flex-wrap:wrap;
background:#fff;
border-bottom:1px solid #eee;

}

.nav-item{

text-decoration:none;
color:#fff;
padding:14px 25px;
border-radius:12px;
font-weight:900;
font-size:1.05rem;
min-width:130px;
display:flex;
align-items:center;
justify-content:center;
gap:8px;

box-shadow:
0 6px 0 rgba(0,0,0,.15);

transition:.25s;

}

.nav-item:hover{

transform:translateY(-3px);

}

/*==========================
محتوى الصفحة
==========================*/

.main-wrapper{

max-width:1200px;
margin:40px auto;
padding:0 20px;

}

.page-title{

color:#2c5d87;

display:inline-block;

border-bottom:4px solid #c59d31;

padding-bottom:8px;

margin-bottom:25px;

font-size:2rem;

font-weight:900;

}

/*==========================
البحث
==========================*/

.search-box{

margin:25px auto;

max-width:700px;

}

.search-box input{

width:100%;

padding:15px;

border-radius:30px;

border:2px solid #72bcd4;

font-family:'Cairo';

font-size:17px;

outline:none;

}

/*==========================
أزرار السلاسل
==========================*/

.series-grid{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(220px,1fr));

gap:18px;

margin-top:35px;

}

.series-btn{

background:#72bcd4;

color:#fff;

border:none;

height:72px;

border-radius:12px;

cursor:pointer;

font-family:'Cairo';

font-size:1.2rem;

font-weight:900;

box-shadow:0 6px 0 #2c5d87;

transition:.2s;

}

.series-btn:hover{

background:#2c5d87;

transform:translateY(-3px);

box-shadow:0 3px 0 #2c5d87;

}

/*==========================
قائمة الدروس
==========================*/

.lesson-list{

margin-top:35px;

display:none;

}

.lesson-item{

background:#fff;

border-right:5px solid #c59d31;

padding:14px;

margin-bottom:10px;

border-radius:10px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.lesson-title{

font-weight:800;

color:#2c5d87;

}

.play-btn{

background:#2c5d87;

color:#fff;

border:none;

padding:8px 18px;

border-radius:8px;

cursor:pointer;

font-family:'Cairo';

font-weight:900;

margin-left:8px;

}

.download-btn{

color:#4f814f;

font-size:22px;

text-decoration:none;

}

/*==========================
المشغل
==========================*/

.player-box{

margin-top:40px;

background:#fff;

padding:15px;

border-radius:12px;

box-shadow:0 2px 8px rgba(0,0,0,.1);

}

audio{

width:100%;

}

/*==========================
الفوتر
==========================*/

footer{

padding:40px;

background:#fdfae9;

margin-top:60px;

border-top:1px solid #ddd;

font-weight:bold;

color:#555;

text-align:center;

}

</style>

</head>
<script>

//==========================
// بيانات السلاسل
//==========================

const data = {

"علامات الساعة":[

...Array.from({length:43},(_,i)=>({

title:`الدرس ${i+1}`,

file:`audio/alamat-${i+1}.mp3`

}))

],

"أمرني بخمس":[

...Array.from({length:11},(_,i)=>({

title:`الدرس ${i+1}`,

file:`audio/amrany-bekams-${i+1}.mp3`

}))

],

"فضل الدعاء":[

...Array.from({length:6},(_,i)=>({

title:`الدرس ${i+1}`,

file:`audio/fadl-aldoaa-${i+1}.mp3`

}))

],

"فضل يوم الجمعة":[

{

title:"فضل يوم الجمعة",

file:"audio/fadl-algomaa.mp3"

}

],

"فضل يوم عرفة":[

{

title:"فضل يوم عرفة",

file:"audio/fadl-arafa-1.mp3"

}

],

"فضل الحج":[

{

title:"فضل الحج",

file:"audio/fadl-al-hag-1.mp3"

}

],

"الميثاق الأول لحقوق الإنسان":[

{

title:"الميثاق الأول لحقوق الإنسان",

file:"audio/almethaq.mp3"

}

]

};

//==========================
// عناصر الصفحة
//==========================

const lessonList=document.getElementById("lessonList");

const player=document.getElementById("player");

const search=document.getElementById("searchInput");

let playlist=[];

let currentIndex=0;


//==========================
// فتح السلسلة
//==========================

document.querySelectorAll(".series-btn")

.forEach(btn=>{

btn.onclick=function(){

const name=this.innerText;

playlist=data[name];

showLessons(name);

};

});


//==========================
// عرض الدروس
//==========================

function showLessons(series){

lessonList.style.display="block";

lessonList.innerHTML="";

data[series].forEach((lesson,index)=>{

lessonList.innerHTML+=`

<div class="lesson-item">

<div class="lesson-title">

${lesson.title}

</div>

<div>

<button class="play-btn"

onclick="play(${index})">

▶ تشغيل

</button>

<a

class="download-btn"

href="${lesson.file}"

download>

<i class="fas fa-download"></i>

</a>

</div>

</div>

`;

});

window.scrollTo({

top:lessonList.offsetTop-80,

behavior:"smooth"

});

}


//==========================
// تشغيل
//==========================

function play(i){

currentIndex=i;

player.src=playlist[i].file;

player.play();

localStorage.setItem(

"khutbah-last",

JSON.stringify({

series:playlist,

index:i

})

);

}


//==========================
// التالي تلقائياً
//==========================

player.onended=function(){

if(currentIndex<playlist.length-1){

play(currentIndex+1);

}

};


//==========================
// البحث
//==========================

search.addEventListener("keyup",function(){

const txt=this.value.trim();

document.querySelectorAll(".series-btn")

.forEach(btn=>{

btn.style.display=

btn.innerText.includes(txt)

?

"block"

:

"none";

});

});


//==========================
// استرجاع آخر تشغيل
//==========================

try{

const last=

JSON.parse(

localStorage.getItem("khutbah-last")

);

if(last){

playlist=last.series;

play(last.index);

}

}catch(e){}

</script>

<footer>

جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب © 2026

</footer>

</body>

</html>
