<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطب والدروس المنبرية - الشيخ سعيد دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #add8e6; --dark-blue: #2c5d87; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        
        .site-header { text-align: center; padding: 60px 20px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-size: 2rem; color: var(--dark-blue); font-weight: 900; }

        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        .nav-link { padding: 10px 25px; background: var(--dark-blue); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
        
        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        
        .item-wrapper { background: white; margin-bottom: 10px; border-radius: 10px; overflow: hidden; border-right: 5px solid var(--bright-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item-header { background: #f8fbff; padding: 15px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; color: var(--dark-blue); }
        .item-content { padding: 10px; background: #fff; border-top: 1px solid #eee; }
        
        .lesson-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px; border-bottom: 1px solid #f5f5f5; flex-wrap: wrap; gap: 10px; 
        }
        audio { height: 35px; width: 220px; }

        @media (max-width: 600px) {
            .lesson-item { flex-direction: column; text-align: center; }
            audio { width: 100%; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>الخطب والدروس المنبرية</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="books.html" class="nav-link">الكتب</a>
    <a href="lessons.html" class="nav-link">الدروس</a>
    <a href="khutbah.html" class="nav-link" style="background:var(--bright-blue); color: var(--dark-blue);">الخطب</a>
</div>

<div class="container">
    <div class="item-wrapper">
        <div class="item-header"><span>سلسلة علامات الساعة</span></div>
        <div class="item-content">
            <div id="sa-list"></div>
        </div>
    </div>

    <div class="item-wrapper">
        <div class="item-header"><span>خطب جمعة مختارة</span></div>
        <div class="item-content">
            <div id="kh-list"></div>
        </div>
    </div>
</div>

<script>
    // 1. قائمة علامات الساعة (توليد تلقائي لـ 40 درس مثلاً كما كانت)
    const saData = Array.from({length: 40}, (_, i) => ({
        t: `علامات الساعة - الدرس ${i+1}`, 
        f: `sa-${i+1}.mp3` 
    }));

    // 2. قائمة الخطب (يمكنك إضافة روابط الأرشيف هنا)
    const khData = [
        { t: "خطبة من الأرشيف (تجربة)", f: "https://archive.org/download/your-link/khutbah.mp3" },
        { t: "خطبة الجمعة 1", f: "khutbah-1.mp3" }
    ];

    function renderList(data, elementId) {
        const listDiv = document.getElementById(elementId);
        listDiv.innerHTML = data.map(item => {
            // التحقق من المسار (أرشيف أم جيت هاب)
            let finalPath = item.f.startsWith('http') ? item.f : `audio/${item.f}`;
            return `
                <div class="lesson-item">
                    <span style="font-weight:bold">${item.t}</span>
                    <audio controls preload="none"><source src="${finalPath}" type="audio/mpeg"></audio>
                </div>`;
        }).join('');
    }

    // تشغيل العرض عند تحميل الصفحة
    window.onload = function() {
        renderList(saData, 'sa-list');
        renderList(khData, 'kh-list');
    };
</script>

</body>
</html>
