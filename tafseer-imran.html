<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة آل عمران - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --dark-blue: #2c5d87; --gold: #b59410; --green: #27ae60; }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: url('images/library-bg.jpg') no-repeat center center fixed; background-size: cover; }
        
        .site-header { padding: 30px; text-align: center; }
        .site-header h1 { font-size: 2.2rem; color: white; background: rgba(44, 93, 135, 0.85); display: inline-block; padding: 12px 60px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        /* مساحة عرض واسعة كما طلبت */
        .container { max-width: 1250px; margin: 0 auto; padding: 0 20px 50px; }

        .main-box { background: rgba(255, 255, 255, 0.98); border-radius: 15px; border: 1px solid #ddd; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .box-header { padding: 20px 30px; background: #fff; border-right: 10px solid var(--gold); border-bottom: 2px solid #eee; display: flex; align-items: center; gap: 15px; }
        .box-header span { font-weight: 900; color: var(--dark-blue); font-size: 1.5rem; }

        .lesson-row { padding: 15px 30px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 20px; transition: 0.3s; }
        .lesson-row:hover { background: #f9fbff; }
        
        /* جهة اليمين: اسم الدرس */
        .lesson-right { flex: 1.2; display: flex; align-items: center; gap: 15px; justify-content: flex-start; }
        .lesson-name { color: var(--dark-blue); font-weight: 800; font-size: 1.1rem; text-align: right; }
        
        /* المنتصف: مشغل الصوت */
        .audio-part { flex: 1; display: flex; justify-content: center; }
        audio { height: 38px; width: 100%; max-width: 380px; }
        
        /* جهة اليسار: أيقونة التحميل */
        .download-side { flex: 0.3; display: flex; justify-content: flex-end; }
        .btn-download { color: var(--green); font-size: 1.8rem; text-decoration: none; transition: 0.3s; }
        .btn-download:hover { transform: scale(1.2); }

        /* أزرار الترقيم */
        .pagination { display: flex; justify-content: center; gap: 10px; padding: 30px; flex-wrap: wrap; background: #fff; }
        .page-btn { padding: 10px 20px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 8px; font-weight: bold; color: var(--dark-blue); transition: 0.3s; }
        .page-btn.active { background: var(--dark-blue); color: white; border-color: var(--dark-blue); }
        .page-btn:hover:not(.active) { background: #f0f0f0; }

        footer { text-align: center; color: white; padding: 40px; font-weight: bold; text-shadow: 1px 1px 3px black; }

        @media (max-width: 992px) { .lesson-row { flex-direction: column; text-align: center; } .lesson-right, .download-side { justify-content: center; } }
    </style>
</head>
<body>

<header class="site-header">
    <h1>تفسير سورة آل عمران</h1>
</header>

<div class="container">
    <div class="main-box">
        <div class="box-header">
            <i class="fas fa-book-open" style="color: var(--gold); font-size: 2rem;"></i>
            <span>سلسلة تفسير سورة آل عمران كاملة</span>
        </div>
        
        <div id="lessons-list">
            </div>

        <div class="pagination" id="pagination-controls">
            </div>
    </div>
</div>

<script>
    const totalLessons = 52;
    const lessonsPerPage = 13; 
    let currentPage = 1;

    function displayLessons(page) {
        const listElement = document.getElementById('lessons-list');
        listElement.innerHTML = '';
        
        const start = (page - 1) * lessonsPerPage + 1;
        const end = Math.min(page * lessonsPerPage, totalLessons);

        for (let i = start; i <= end; i++) {
            const fileName = `al-imran-${i}.mp3`;
            const row = `
                <div class="lesson-row">
                    <div class="lesson-right">
                        <i class="fas fa-headphones" style="color: var(--dark-blue)"></i>
                        <span class="lesson-name">تفسير سورة آل عمران - الدرس ${i}</span>
                    </div>
                    <div class="audio-part">
                        <audio controls preload="none">
                            <source src="audio/${fileName}" type="audio/mpeg">
                        </audio>
                    </div>
                    <div class="download-side">
                        <a href="audio/${fileName}" download class="btn-download" title="تحميل الدرس">
                            <i class="fas fa-cloud-download-alt"></i>
                        </a>
                    </div>
                </div>`;
            listElement.innerHTML += row;
        }
        setupPagination();
    }

    function setupPagination() {
        const pagElement = document.getElementById('pagination-controls');
        pagElement.innerHTML = '';
        const pageCount = Math.ceil(totalLessons / lessonsPerPage);

        for (let i = 1; i <= pageCount; i++) {
            const btn = document.createElement('button');
            btn.innerText = `صفحة ${i}`;
            btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            btn.onclick = () => {
                currentPage = i;
                displayLessons(i);
                window.scrollTo(0, 200);
            };
            pagElement.appendChild(btn);
        }
    }

    // التشغيل المبدئي
    window.onload = () => displayLessons(1);
</script>

<footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

</body>
</html>
