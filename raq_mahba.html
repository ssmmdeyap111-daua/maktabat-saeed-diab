<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسباب محبة الله - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --accent-blue: #add8e6; --sky-blue: #87CEEB; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f0f7fa; }
        .site-header { text-align: center; padding: 20px; background: var(--accent-blue); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; mix-blend-mode: multiply; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .series-header { text-align: center; background: white; padding: 25px; border-radius: 20px; border-bottom: 5px solid var(--sky-blue); margin-bottom: 30px; }
        .series-title { color: var(--primary); font-weight: 900; font-size: 1.8rem; margin: 0; }
        .lesson-row { 
            background: white; margin-bottom: 12px; padding: 15px 25px; border-radius: 15px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03); border-right: 8px solid var(--sky-blue);
        }
        .lesson-text { font-weight: 700; color: var(--primary); flex: 1; }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .page-btn { padding: 10px 18px; background: white; border: 2px solid var(--sky-blue); color: var(--primary); cursor: pointer; border-radius: 8px; font-weight: 900; }
        .page-btn.active { background: var(--sky-blue); color: white; }
        audio { height: 35px; width: 220px; }
        .btn-download { color: #2e7d32; font-size: 1.6rem; text-decoration: none; }
        footer { text-align: center; padding: 30px; background: var(--accent-blue); color: var(--primary); font-weight: bold; margin-top: 60px; }
    </style>
</head>
<body>

    <header class="site-header"><img src="images/logo.png.jpg" class="site-logo"></header>

    <div class="container">
        <div class="series-header">
            <h1 class="series-title">سلسلة أسباب محبة الله</h1>
        </div>
        
        <div id="lessons-container"></div>
        
        <div class="pagination">
            <button class="page-btn active" onclick="showPage(1)">1</button>
            <button class="page-btn" onclick="showPage(2)">2</button>
        </div>

        <a href="raqaeq.html" style="display:block; width:fit-content; margin:30px auto; color:var(--primary); font-weight:bold; text-decoration:none;">
            <i class="fas fa-arrow-right"></i> عودة لقسم الرقائق
        </a>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        // إعدادات السلسلة (تم الضبط بناءً على mahba-5.mp3)
        const totalLessons = 20; // يمكنك تعديل العدد الكلي هنا
        const lessonsPerPage = 10;
        const config = {
            prefix: "mahba-", 
            extension: ".mp3" 
        };

        function showPage(pageNumber) {
            const container = document.getElementById('lessons-container');
            container.innerHTML = ""; 

            document.querySelectorAll('.page-btn').forEach((btn, index) => {
                btn.classList.toggle('active', index + 1 === pageNumber);
            });

            const start = (pageNumber - 1) * lessonsPerPage + 1;
            const end = Math.min(pageNumber * lessonsPerPage, totalLessons);

            for (let i = start; i <= end; i++) {
                const fileName = `audio/${config.prefix}${i}${config.extension}`;
                container.innerHTML += `
                <div class="lesson-row">
                    <span class="lesson-text">الدرس رقم (${i})</span>
                    <audio controls preload="none">
                        <source src="${fileName}" type="audio/mpeg">
                    </audio>
                    <a href="${fileName}" download class="btn-download">
                        <i class="fas fa-circle-down"></i>
                    </a>
                </div>`;
            }
        }

        window.onload = () => showPage(1);
    </script>
</body>
</html>
