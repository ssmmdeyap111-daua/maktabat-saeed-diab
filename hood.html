
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة هود - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --prayer-green: #e8f5e9; 
            --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
            --beige-bg: #fdfae7; 
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f8f9fa; color: #333; }

        /* شريط المعلومات العلوي */
        .top-info-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 40px; background: var(--beige-bg); border-bottom: 2px solid var(--accent-blue); }
        .date-box { background: white; padding: 8px 20px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 2px solid var(--gold-color); font-weight: 900; font-size: 0.85rem; }
        .prayer-table { display: flex; gap: 6px; }
        .prayer-column { display: flex; flex-direction: column; align-items: center; width: 65px; }
        .prayer-name { background: #3e7d3e; color: white; width: 100%; text-align: center; font-size: 0.75rem; border-radius: 6px 6px 0 0; padding: 2px 0; }
        .prayer-time { background: var(--prayer-green); color: #1b5e20; width: 100%; text-align: center; font-weight: 900; border: 1px solid #c8e6c9; border-radius: 0 0 6px 6px; font-size: 0.85rem; }

        /* الهيدر */
        .site-header { text-align: center; padding: 20px; background: var(--header-bg); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; height: auto; mix-blend-mode: multiply; }

        /* أزرار التنقل */
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        .btn-small { padding: 10px 25px; border-radius: 10px; font-weight: 700; text-decoration: none; color: white; background: var(--accent-blue); box-shadow: 0 4px 0 var(--dark-blue); transition: 0.2s; font-size: 0.9rem; }
        .btn-gold { background: var(--gold-color); box-shadow: 0 4px 0 #8c6d1a; }

        /* حاوية السلسلة */
        .series-container { max-width: 1000px; margin: 30px auto 80px; padding: 0 20px; }
        .series-header { text-align: center; margin-bottom: 40px; }
        .series-title { font-family: 'Amiri', serif; font-size: 3rem; color: var(--dark-blue); margin: 0; }
        .series-count { color: var(--gold-color); font-weight: 900; font-size: 1.2rem; margin-top: 10px; }

        /* جدول الدروس */
        .lessons-table { width: 100%; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.05); border-collapse: collapse; }
        .lessons-table thead { background: var(--dark-blue); color: white; }
        .lessons-table th { padding: 15px; font-size: 1rem; }
        .lessons-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        .lesson-name { font-weight: 700; color: #444; text-align: right !important; padding-right: 25px !important; }
        .audio-player { width: 220px; height: 32px; }
        .download-link { color: #27ae60; font-size: 1.5rem; transition: 0.3s; }
        .download-link:hover { color: var(--dark-blue); transform: scale(1.1); }

        footer { text-align: center; padding: 35px; color: var(--dark-blue); font-weight: bold; background: var(--header-bg); margin-top: 50px; }

        @media (max-width: 768px) {
            .top-info-bar { flex-direction: column; gap: 10px; }
            .prayer-table { flex-wrap: wrap; justify-content: center; }
            .audio-player { width: 160px; }
        }
    </style>
</head>
<body>

    <div class="top-info-bar">
        <div class="date-box" id="full-date">جاري التحميل...</div>
        <div class="prayer-table" id="prayer-times"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="btn-small">الرئيسية</a>
        <a href="tafseer.html" class="btn-small btn-gold">فهرس التفسير</a>
        <a href="lessons.html" class="btn-small">المكتبة الصوتية</a>
    </nav>

    <div class="series-container">
        <div class="series-header">
            <h1 class="series-title">تفسير سورة هود</h1>
            <p class="series-count">سلسلة كاملة (22 درساً صوتاً)</p>
        </div>

        <table class="lessons-table">
            <thead>
                <tr>
                    <th>رقم الدرس</th>
                    <th>عنوان الدرس</th>
                    <th>الاستماع</th>
                    <th>تحميل</th>
                </tr>
            </thead>
            <tbody id="lessons-list">
                </tbody>
        </table>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        // إعدادات الدروس
        const listContainer = document.getElementById('lessons-list');
        const total = 22; 
        const prefix = "hood"; // ليتطابق مع hood-1.mp3 إلى hood-22.mp3

        for (let i = 1; i <= total; i++) {
            const row = `
                <tr>
                    <td><span style="background:var(--gold-color); color:white; padding:4px 12px; border-radius:50%; font-weight:bold;">${i}</span></td>
                    <td class="lesson-name">تفسير سورة هود - الدرس رقم ${i}</td>
                    <td><audio controls class="audio-player" preload="none"><source src="audio/${prefix}-${i}.mp3" type="audio/mpeg"></audio></td>
                    <td><a href="audio/${prefix}-${i}.mp3" download class="download-link"><i class="fas fa-cloud-arrow-down"></i></a></td>
                </tr>
            `;
            listContainer.innerHTML += row;
        }

        // جلب التاريخ الهجري
        const now = new Date();
        document.getElementById('full-date').innerText = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now) + " هـ";

        // جلب مواقيت الصلاة
        async function getPrayers() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const data = await res.json();
                const t = data.data.timings;
                const prayers = [{n:"الفجر",t:t.Fajr},{n:"الظهر",t:t.Dhuhr},{n:"العصر",t:t.Asr},{n:"المغرب",t:t.Maghrib},{n:"العشاء",t:t.Isha}];
                document.getElementById('prayer-times').innerHTML = prayers.map(p => `
                    <div class="prayer-column"><div class="prayer-name">${p.n}</div><div class="prayer-time">${p.t}</div></div>`).join('');
            } catch { document.getElementById('prayer-times').innerText = ""; }
        }
        getPrayers();
    </script>
</body>
</html>
