<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس الشيخ سعيد مصطفى دياب الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; --shadow-color: #5da0bc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        
        .site-header { 
            text-align: center; padding: 50px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 6px solid white;
        }
        .site-header h1 { margin: 0; font-family: 'Reem Kufi', sans-serif; font-size: 2.5rem; color: var(--dark-blue); }
        
        .nav-bar { display: flex; justify-content: center; padding: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-3d { 
            padding: 12px 25px; background: white; border-radius: 15px;
            text-decoration: none; color: var(--dark-blue); font-weight: bold;
            box-shadow: 0 5px 0 var(--shadow-color); transition: 0.1s;
            display: flex; align-items: center; gap: 8px;
        }
        .active-btn { background: var(--bright-blue); color: white; box-shadow: 0 5px 0 var(--dark-blue); }

        .container { max-width: 1100px; margin: 20px auto; padding: 15px; }
        
        /* تصميم الأقسام الرئيسية */
        .category-title { 
            color: #d4af37; font-family: 'Reem Kufi', sans-serif; font-size: 1.8rem; 
            margin: 40px 0 20px; border-bottom: 2px solid #d4af37; display: inline-block; padding-bottom: 5px;
        }

        .surah-section { 
            background: white; border-radius: 20px; padding: 20px; margin-bottom: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-right: 8px solid var(--dark-blue);
        }
        .surah-title { 
            color: var(--dark-blue); font-size: 1.4rem; font-weight: 900; 
            margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
        }

        /* الدروس السابقة بأيقوناتها */
        .old-lessons-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;
        }
        .old-lesson-card {
            background: white; padding: 20px; border-radius: 15px; text-align: center;
            box-shadow: 0 5px 0 var(--shadow-color); transition: 0.2s; text-decoration: none; color: var(--dark-blue);
        }
        .old-lesson-card:hover { transform: translateY(-5px); }
        .old-lesson-card i { font-size: 2.5rem; color: #d4af37; margin-bottom: 10px; }
        .old-lesson-card h4 { margin: 0; font-weight: 900; }

        /* شبكة دروس التفسير */
        .lessons-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; 
        }
        .lesson-card {
            background: #f9fbfd; border: 1px solid #e0eaf3; padding: 12px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .lesson-card h5 { margin: 0; color: #444; font-size: 0.9rem; white-space: nowrap; }
        audio { height: 28px; width: 140px; }
        .dl-icon { color: #27ae60; font-size: 1.1rem; }

        @media (max-width: 600px) {
            .lessons-grid { grid-template-columns: 1fr; }
            .site-header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>دروس الشيخ سعيد مصطفى دياب الرسمي</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-3d"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="books.html" class="btn-3d"><i class="fas fa-book"></i> المكتبة</a>
    <a href="lessons.html" class="btn-3d active-btn"><i class="fas fa-microphone"></i> الدروس</a>
    <a href="khutbah.html" class="btn-3d"><i class="fas fa-bullhorn"></i> الخطب</a>
</div>

<div class="container">

    <h2 class="category-title"><i class="fas fa-star"></i> السلاسل العلمية</h2>
    <div class="old-lessons-grid">
        <a href="#" class="old-lesson-card">
            <i class="fas fa-mosque"></i>
            <h4>دروس العقيدة</h4>
        </a>
        <a href="#" class="old-lesson-card">
            <i class="fas fa-gavel"></i>
            <h4>دروس الفقه</h4>
        </a>
        <a href="#" class="old-lesson-card">
            <i class="fas fa-history"></i>
            <h4>السيرة النبوية</h4>
        </a>
        <a href="#" class="old-lesson-card">
            <i class="fas fa-heart"></i>
            <h4>الرقائق والزهد</h4>
        </a>
    </div>

    <h2 class="category-title"><i class="fas fa-book-quran"></i> سلاسل التفسير</h2>

    <div class="surah-section">
        <div class="surah-title"><i class="fas fa-bookmark"></i> تفسير سورة البقرة (75 درساً)</div>
        <div class="lessons-grid" id="baqarah-list"></div>
    </div>

    <div class="surah-section">
        <div class="surah-title"><i class="fas fa-bookmark"></i> تفسير سورة آل عمران (52 درساً)</div>
        <div class="lessons-grid" id="imran-list"></div>
    </div>

    <div class="surah-section">
        <div class="surah-title"><i class="fas fa-bookmark"></i> تفسير سورة النساء (53 درساً)</div>
        <div class="lessons-grid" id="nisa-list"></div>
    </div>

    <div class="surah-section">
        <div class="surah-title"><i class="fas fa-bookmark"></i> تفسير سورة المائدة (34 درساً)</div>
        <div class="lessons-grid" id="maidah-list"></div>
    </div>

</div>

<script>
    // وظيفة توليد دروس التفسير تلقائياً لتقليل حجم الكود
    function generateTafseer(containerId, prefix, count) {
        const container = document.getElementById(containerId);
        let html = '';
        for (let i = 1; i <= count; i++) {
            let num = i < 10 ? '0' + i : i;
            html += `
            <div class="lesson-card">
                <h5>الدرس ${num}</h5>
                <audio controls preload="none">
                    <source src="audio/tafseer/${prefix}-${num}.mp3" type="audio/mpeg">
                </audio>
                <a href="audio/tafseer/${prefix}-${num}.mp3" download class="dl-icon"><i class="fas fa-download"></i></a>
            </div>`;
        }
        container.innerHTML = html;
    }

    // تشغيل التوليد
    generateTafseer('baqarah-list', 'baqarah', 75);
    generateTafseer('imran-list', 'imran', 52);
    generateTafseer('nisa-list', 'nisa', 53);
    generateTafseer('maidah-list', 'maidah', 34);
</script>

</body>
</html>
