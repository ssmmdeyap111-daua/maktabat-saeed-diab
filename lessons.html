<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); }
        .site-header { text-align: center; padding: 40px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 4px solid white; }
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        .nav-link { padding: 10px 20px; background: var(--accent-blue); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }

        /* حاوية الأقسام */
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; padding: 20px; }
        .cat-card { background: white; padding: 20px; border-radius: 15px; display: flex; align-items: center; cursor: pointer; border-right: 6px solid var(--accent-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
        .icon-box { width: 60px; height: 60px; background: var(--light-sky); border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-left: 15px; font-size: 1.8rem; color: var(--dark-blue); }

        /* حاوية الدروس (تظهر وتختفي) */
        #details-view { max-width: 900px; margin: 30px auto; padding: 20px; display: none; }
        .lesson-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border-right: 5px solid var(--dark-blue); flex-wrap: wrap; }
        .back-btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-bottom: 20px; font-family: 'Cairo'; }
        audio { height: 35px; width: 250px; }
    </style>
</head>
<body>

<header class="site-header"><h1>الدروس العلمية</h1></header>

<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="khutbah.html" class="nav-link">الخطب</a>
    <a href="lessons.html" class="nav-link" style="background:var(--dark-blue)">الدروس</a>
</div>

<div id="main-view">
    <div class="categories-grid" id="categories-container"></div>
</div>

<div id="details-view">
    <button class="back-btn" onclick="toggleView(false)">← عودة للأقسام</button>
    <h2 id="section-title" style="color: var(--dark-blue);"></h2>
    <div id="lessons-container"></div>
</div>

<script src="lessons.data.js"></script>

<script>
    // وظيفة المحرك: عرض البيانات فقط
    function renderApp() {
        const catContainer = document.getElementById('categories-container');
        // عرض الأقسام من ملف الـ JS
        catContainer.innerHTML = allData.categories.map(cat => `
            <div class="cat-card" onclick="loadCategory('${cat.id}')">
                <div class="icon-box"><i class="${cat.icon}"></i></div>
                <h3>${cat.name}</h3>
            </div>
        `).join('');
    }

    function loadCategory(id) {
        const category = allData.lessons[id];
        if (!category || category.length === 0) return alert("سيتم إضافة الدروس قريباً");

        document.getElementById('section-title').innerText = allData.categories.find(c => c.id === id).name;
        const lessonsContainer = document.getElementById('lessons-container');
        
        lessonsContainer.innerHTML = category.map(lesson => `
            <div class="lesson-item">
                <span style="font-weight:bold">${lesson.title}</span>
                <audio controls preload="none">
                    <source src="audio/${id}/${lesson.file}" type="audio/mpeg">
                </audio>
            </div>
        `).join('');

        toggleView(true);
    }

    function toggleView(showDetails) {
        document.getElementById('main-view').style.display = showDetails ? 'none' : 'block';
        document.getElementById('details-view').style.display = showDetails ? 'block' : 'none';
        window.scrollTo(0,0);
    }

    // تشغيل التطبيق
    if (typeof allData !== 'undefined') renderApp();
</script>
</body>
</html>
