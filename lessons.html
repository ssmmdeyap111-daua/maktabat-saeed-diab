<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الصوتية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main-blue: #add8e6; --dark-blue: #2c5d87; }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background-color: #f8fbff; }
        .site-header { text-align: center; padding: 25px; background-color: var(--main-blue); border-bottom: 4px solid #fff; }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        
        .category-grid { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .cat-card {
            background: white; padding: 12px 20px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 4px 0 #ccd1d9; border: 1px solid #ddd; font-weight: bold; color: var(--dark-blue);
        }
        .cat-card.active { background: var(--dark-blue); color: white; box-shadow: 0 4px 0 #1a3a5a; border-color: var(--dark-blue); }

        /* شريط اختيار السورة - مخفي افتراضياً */
        #surahFilterContainer { 
            display: none; text-align: center; margin-bottom: 30px; 
            background: #eef5f9; padding: 15px; border-radius: 15px; border: 1px dashed var(--dark-blue);
        }
        #surahSelect { padding: 10px; border-radius: 8px; font-family: 'Cairo'; width: 250px; border: 1px solid #ccc; }

        .lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .lesson-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-right: 5px solid var(--main-blue); }
        audio { width: 100%; height: 35px; }
        .download-btn { display: block; text-align: center; margin-top: 10px; padding: 8px; background: #f9f9f9; color: #2c5d87; text-decoration: none; border-radius: 5px; font-size: 11px; font-weight: bold; border: 1px solid #eee; }
    </style>
</head>
<body>

<header class="site-header">
    <h1 style="margin:0;">الشيخ سعيد مصطفى دياب</h1>
</header>

<div class="container">
    <div class="category-grid">
        <div class="cat-card active" onclick="filterMain('all', this)">الكل</div>
        <div class="cat-card" onclick="filterMain('تفسير', this)">التفسير</div>
        <div class="cat-card" onclick="filterMain('حديث', this)">الأحاديث</div>
        <div class="cat-card" onclick="filterMain('فرائض', this)">الفرائض</div>
    </div>

    <div id="surahFilterContainer">
        <label style="font-weight: bold; color: var(--dark-blue);">اختر السورة: </label>
        <select id="surahSelect" onchange="filterBySurah(this.value)">
            <option value="all">كل السور</option>
            </select>
    </div>

    <div class="lessons-grid" id="list"></div>
</div>

<script src="tafseerData.js"></script>
<script src="faraidData.js"></script>

<script>
    let allData = [];
    let currentCategory = 'all';

    function init() {
        allData = [];
        if (typeof tafseerData !== 'undefined') {
            tafseerData.forEach(i => allData.push({...i, cat: 'تفسير'}));
            setupSurahDropdown();
        }
        if (typeof faraidLessons !== 'undefined') {
            faraidLessons.forEach(i => allData.push({...i, cat: 'فرائض'}));
        }
        render(allData);
    }

    // بناء قائمة السور بناءً على الدروس الموجودة فعلياً في ملف tafseerData
    function setupSurahDropdown() {
        const select = document.getElementById("surahSelect");
        const surahs = [...new Set(tafseerData.map(item => item.surah))]; // استخراج السور بدون تكرار
        surahs.forEach(s => {
            if(s) {
                let opt = document.createElement("option");
                opt.value = s;
                opt.textContent = s;
                select.appendChild(opt);
            }
        });
    }

    function render(items) {
        const list = document.getElementById("list");
        list.innerHTML = items.length ? "" : "<p style='text-align:center; grid-column:1/-1;'>لا توجد دروس حالياً.</p>";
        
        items.forEach(item => {
            let path = item.file.startsWith('audio/') ? item.file : 'audio/' + item.file;
            list.innerHTML += `
                <div class="lesson-card">
                    <small># ${item.cat} ${item.surah ? '- سورة ' + item.surah : ''}</small>
                    <h3>${item.title}</h3>
                    <audio controls preload="none"><source src="${path}" type="audio/mpeg"></audio>
                    <a href="${path}" download class="download-btn">📥 تحميل</a>
                </div>`;
        });
    }

    function filterMain(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.cat-card').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // إظهار أو إخفاء فلتر السور
        const surahBox = document.getElementById("surahFilterContainer");
        surahBox.style.display = (cat === 'تفسير') ? 'block' : 'none';

        if (cat === 'all') render(allData);
        else render(allData.filter(i => i.cat === cat));
    }

    function filterBySurah(surahName) {
        if (surahName === 'all') {
            render(allData.filter(i => i.cat === 'تفسير'));
        } else {
            render(allData.filter(i => i.cat === 'تفسير' && i.surah === surahName));
        }
    }

    window.onload = init;
</script>
</body>
</html>
