<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        .site-header { text-align: center; padding: 40px 20px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-size: 1.8rem; color: var(--dark-blue); font-weight: 900; }
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; flex-wrap: wrap; }
        .nav-link { padding: 8px 20px; background: var(--dark-blue); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; max-width: 1000px; margin: 20px auto; padding: 15px; }
        .cat-card { background: var(--bright-blue); padding: 25px 10px; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.2s; text-align: center; }
        .cat-card:hover { transform: translateY(-3px); background: #b0e2f5; }
        .cat-card h3 { margin: 0; font-size: 1rem; color: var(--dark-blue); font-weight: 900; }
        #details-view { max-width: 850px; margin: 20px auto; padding: 15px; display: none; }
        .back-btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-family: 'Cairo'; font-weight: bold; }
        .item-wrapper { background: white; margin-bottom: 10px; border-radius: 10px; border-right: 5px solid var(--bright-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item-header { background: #f8fbff; padding: 15px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; color: var(--dark-blue); }
        .item-content { display: none; padding: 10px; background: #fff; border-top: 1px solid #eee; }
        .lesson-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f5f5f5; flex-wrap: wrap; gap: 10px; }
        audio { height: 35px; width: 220px; }
        .download-icon { text-decoration: none; color: #27ae60; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>
<header class="site-header"><h1>الدروس العلمية للشيخ سعيد مصطفى دياب</h1></header>
<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="books.html" class="nav-link">المكتبة</a>
    <a href="lessons.html" class="nav-link" style="background:var(--bright-blue); color: var(--dark-blue);">الدروس</a>
    <a href="khutbah.html" class="nav-link">الخطب</a>
</div>
<div id="main-view">
    <div class="categories-grid">
        <div class="cat-card" onclick="showContent('tafseer')"><h3>تفسير القرآن</h3></div>
        <div class="cat-card" onclick="showContent('quran_sciences')"><h3>علوم القرآن</h3></div>
        <div class="cat-card" onclick="showContent('hadith')"><h3>شروح الحديث</h3></div>
        <div class="cat-card" onclick="showContent('tawheed')"><h3>العقيدة</h3></div>
        <div class="cat-card" onclick="showContent('fiqh')"><h3>الفقه</h3></div>
        <div class="cat-card" onclick="showContent('seerah')"><h3>السيرة النبوية</h3></div>
        <div class="cat-card" onclick="showContent('rakaik')"><h3>الرقائق</h3></div>
        <div class="cat-card" onclick="showContent('faraid')"><h3>علم الفرائض</h3></div>
    </div>
</div>
<div id="details-view">
    <button class="back-btn" onclick="backToMain()">← عودة للقائمة</button>
    <h2 id="section-title"></h2>
    <div id="lessons-render"></div>
</div>
<script>
    const data = {
        tafseer: { title: "تفسير القرآن", items: [
            { name: "سورة الفاتحة", lessons: [{t: "الدرس 1", f: "fatiha-1.mp3"}, {t: "الدرس 2", f: "fatiha-2.mp3"}] },
            { name: "سورة البقرة", lessons: Array.from({length: 13}, (_, i) => ({t: `الدرس ${i+1}`, f: (i+1==3||i+1==7||i+1==10||i+1==11||i+1==12||i+1==13) ? `https://archive.org/download/bakara-10_202602/bakara-${i+1}.mp3` : `bakara-${i+1}.mp3`})) }
        ]},
        quran_sciences: { title: "علوم القرآن", items: [
            { name: "شرح منظومة الناسخ والمنسوخ للسيوطي", lessons: Array.from({length: 10}, (_, i) => ({ t: `الدرس ${i+1}`, f: `nasekh-${i+1}.mp3` })) },
            { name: "شرح مقدمة في أصول التفسير", lessons: Array.from({length: 27}, (_, i) => ({ t: `الدرس ${i+1}`, f: `osol-altfser-${i+1}.mp3` })) },
            { name: "دروس علوم القرآن", lessons: [{ t: "مقدمة", f: "quran-1.mp3" }] }
        ]},
        hadith: { title: "شروح الحديث", items: [
            { name: "شرح عمدة الأحكام", lessons: Array.from({length: 71}, (_, i) => ({ t: `الدرس ${i+1}`, f: `omda-${i+1}` })) },
            { name: "رياض الصالحين", lessons: Array.from({length: 30}, (_, i) => ({ t: `الدرس ${i+1}`, f: `reyad-${i+1}.mp3` })) }
        ]},
        tawheed: { title: "العقيدة", items: [
            { name: "شرح العقيدة الواسطية", lessons: Array.from({length: 26}, (_, i) => ({t: `الدرس ${i+1}`, f: `wastya-${i+1}.mp3`})) },
            { name: "شرح أسماء الله الحسنى", lessons: Array.from({length: 33}, (_, i) => ({t: `الدرس ${i+1}`, f: `asma${i+1}.mp3`})) },
            { name: "شرح العقيدة الطحاوية", lessons: Array.from({length: 21}, (_, i) => ({t: `الدرس ${i+1}`, f: `tahawiya-${i+1}.mp3`})) },
            { name: "شرح كتاب التوحيد", lessons: Array.from({length: 23}, (_, i) => ({t: `الدرس ${i+1}`, f: `tawheed-${i+1}.mp3`})) }
        ]},
        seerah: { title: "السيرة النبوية", items: [{ name: "السيرة النبوية", lessons: Array.from({length: 32}, (_, i) => ({t: `الدرس ${i+1}`, f: `sera${i+1}`})) }] },
        rakaik: { title: "الرقائق", items: [
            { name: "سلسلة مكارم الأخلاق", lessons: Array.from({length: 40}, (_, i) => ({ t: `الدرس ${i+1}`, f: `mkarem-${i+1}` })) },
            { name: "أنوار الأذكار", lessons: Array.from({length: 30}, (_, i) => ({t: `الدرس ${i+1}`, f: `al-azkar-${i+1}.mp3`})) }
        ]},
        fiqh: { title: "الفقه", items: [
            { name: "شرح كتاب أخصر المختصرات", lessons: Array.from({length: 27}, (_, i) => ({ t: `الدرس ${i+1}`, f: `akhasar-${i+1}.mp3` })) },
            { name: "دورة الزكاة والصيام", lessons: Array.from({length: 6}, (_, i) => ({t: `الدرس ${i+1}`, f: `lesson${i+1}.mp3`})) }
        ]},
        faraid: { title: "علم الفرائض", items: [{ name: "المنظومة الرحبية", lessons: Array.from({length: 11}, (_, i) => ({ t: `الدرس ${i+1}`, f: `al-rhapih${i+1}.mp3` })) }] }
    };

    function showContent(key) {
        const section = data[key];
        document.getElementById('section-title').innerText = section.title;
        const container = document.getElementById('lessons-render');
        container.innerHTML = "";
        section.items.forEach((group, gIdx) => {
            let lessonsHTML = group.lessons.map(l => {
                let path = l.f.startsWith('http') ? l.f : `audio/${l.f}`;
                let isSpecial = (l.f.includes('omda') || l.f.includes('sera') || l.f.includes('mkarem'));
                let sources = isSpecial 
                    ? `<source src="${path}.MP3" type="audio/mpeg"><source src="${path}.mp3" type="audio/mpeg">` 
                    : `<source src="${path}" type="audio/mpeg">`;
                
                let downloadPath = isSpecial ? `${path}.MP3` : path;
                
                return `<div class="lesson-item"><span>${l.t}</span><audio controls preload="none">${sources}</audio><a href="${downloadPath}" download class="download-icon">📥</a></div>`;
            }).join('');
            container.innerHTML += `<div class="item-wrapper"><div class="item-header" onclick="toggle('${key}-${gIdx}')"><span>${group.name}</span><small>▼</small></div><div class="item-content" id="${key}-${gIdx}">${lessonsHTML}</div></div>`;
        });
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('details-view').style.display = 'block';
    }

    function toggle(id) { const el = document.getElementById(id); el.style.display = (el.style.display === 'block') ? 'none' : 'block'; }
    function backToMain() { document.getElementById('main-view').style.display = 'block'; document.getElementById('details-view').style.display = 'none'; }
</script>
</body>
</html>
