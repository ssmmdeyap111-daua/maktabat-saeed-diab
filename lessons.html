<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #add8e6; /* لون الشريط العلوي */
            --dark-blue: #2c5d87;
            --bg-body: #f4f7f9;
        }

        body {
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body); color: #333;
        }

        .site-header { 
            text-align: center; padding: 25px; 
            background-color: var(--light-blue); 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container { max-width: 1200px; margin: auto; padding: 20px; }

        /* الأيقونات 3D بدون صور */
        .category-grid {
            display: flex; justify-content: center; gap: 10px; 
            flex-wrap: wrap; margin-bottom: 30px;
        }

        .cat-card {
            background: white; padding: 12px 25px; border-radius: 10px;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 0 #ccd1d9;
            border: 1px solid #ddd; font-weight: bold; color: var(--dark-blue);
            min-width: 100px; text-align: center;
        }

        .cat-card:active { transform: translateY(3px); box-shadow: none; }
        
        .cat-card.active { 
            background: var(--dark-blue); color: white; 
            box-shadow: 0 4px 0 #1a3a5a; border-color: var(--dark-blue);
        }

        .lessons-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }

        .lesson-card {
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-right: 5px solid var(--light-blue);
        }

        .tag { font-size: 11px; color: #777; background: #eee; padding: 2px 8px; border-radius: 5px; }
        .lesson-card h3 { margin: 10px 0; font-size: 1rem; color: var(--dark-blue); line-height: 1.5; }

        audio { width: 100%; height: 35px; margin-top: 10px; }
        .download-link { 
            display: block; text-align: center; margin-top: 10px;
            font-size: 12px; text-decoration: none; color: #2c5d87;
            font-weight: bold; border-top: 1px solid #eee; padding-top: 10px;
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1 style="margin:0; font-size: 1.5rem; color: var(--dark-blue);">الشيخ سعيد مصطفى دياب</h1>
</header>

<div class="container">
    <div class="category-grid">
        <div class="cat-card active" onclick="filterData('all', this)">الكل</div>
        <div class="cat-card" onclick="filterData('تفسير', this)">التفسير</div>
        <div class="cat-card" onclick="filterData('حديث', this)">شروح الأحاديث</div>
        <div class="cat-card" onclick="filterData('فقه', this)">الفقه</div>
        <div class="cat-card" onclick="filterData('فرائض', this)">الفرائض</div>
        <div class="cat-card" onclick="filterData('سيرة', this)">السيرة</div>
        <div class="cat-card" onclick="filterData('رقائق', this)">الرقائق</div>
    </div>

    <div class="lessons-grid" id="mainContainer"></div>
</div>

<script>
    /* نضع البيانات هنا مباشرة لضمان ظهورها مهما حدث */
    const myLessons = [
        {
            title: "شرح رياض الصالحين - الدرس 1",
            file: "reyad-alsalehen1.mp3",
            category: "حديث"
        },
        /* أضف دروسك القديمة هنا بنفس الطريقة */
        {
            title: "تفسير سورة الفاتحة",
            file: "tafseer1.mp3",
            category: "تفسير"
        },
        {
            title: "الدروس الفقهية - كتاب الصلاة",
            file: "figh1.mp3",
            category: "فقه"
        }
    ];

    function render(data) {
        const container = document.getElementById("mainContainer");
        container.innerHTML = "";

        if (data.length === 0) {
            container.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>قريباً إن شاء الله في هذا القسم.</p>";
            return;
        }

        data.forEach(lesson => {
            container.innerHTML += `
                <div class="lesson-card">
                    <span class="tag">${lesson.category}</span>
                    <h3>${lesson.title}</h3>
                    <audio controls preload="none">
                        <source src="audio/${lesson.file}" type="audio/mpeg">
                    </audio>
                    <a href="audio/${lesson.file}" download class="download-link">📥 تحميل الملف الصوتي</a>
                </div>
            `;
        });
    }

    function filterData(cat, el) {
        document.querySelectorAll('.cat-card').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');

        if (cat === 'all') {
            render(myLessons);
        } else {
            const filtered = myLessons.filter(item => item.category === cat);
            render(filtered);
        }
    }

    // تشغيل الصفحة
    window.onload = () => render(myLessons);
</script>

</body>
</html>
