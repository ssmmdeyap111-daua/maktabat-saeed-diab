<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الصوتية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #add8e6; --accent-blue: #5a9bd5; --dark-blue: #2c5d87;
            --gold-color: #c5a03d; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f4f7f9; color: #333; }

        /* الهيدر */
        .site-header { text-align: center; padding: 15px; background: var(--header-bg); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; height: auto; mix-blend-mode: multiply; }

        /* شريط التنقل العلوي (نفس حجم صفحة الخطب) */
        .nav-bar { display: flex; justify-content: center; gap: 8px; padding: 15px; flex-wrap: wrap; background: #fff; border-bottom: 1px solid #eee; }
        .btn-small { 
            min-width: 120px; padding: 8px 15px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; 
            text-decoration: none; color: white; text-align: center; display: flex; align-items: center; 
            justify-content: center; gap: 6px; box-shadow: 0 4px 0 var(--dark-blue); transition: 0.2s; 
        }
        .btn-blue { background: linear-gradient(to bottom, #87ceeb, #5a9bd5); }
        .btn-gold { background: linear-gradient(to bottom, #d4af37, #b38f2d); box-shadow: 0 4px 0 #8c6d1a; }
        .btn-small:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--dark-blue); }

        /* أزرار الأقسام (متوسطة الحجم - أزرق فاتح - بدون رسومات) */
        .categories-container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .cat-btn {
            background: var(--light-sky); color: var(--dark-blue); padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-weight: 800; font-size: 1rem; border: none;
            box-shadow: 0 4px 0 var(--accent-blue); transition: 0.2s; text-align: center;
        }
        .cat-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .cat-btn.active { background: var(--gold-color); color: white; box-shadow: 0 4px 0 #8c6d1a; }

        /* الحاوية والجداول */
        .content-container { max-width: 1200px; margin: 20px auto 60px; padding: 0 20px; }
        .section-box { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .lesson-table { width: 100%; border-collapse: collapse; font-size: 1.05rem; }
        .lesson-table th { background: #f8f9fa; color: var(--dark-blue); padding: 15px; border-bottom: 2px solid #eee; }
        .lesson-table td { padding: 12px; border-bottom: 1px solid #f0f0f0; text-align: center; font-weight: bold; }
        
        .audio-player { width: 260px; height: 32px; }
        .btn-download { color: var(--dark-blue); font-size: 1.3rem; }

        footer { text-align: center; padding: 25px; color: #555; background: #e0f2f7; font-weight: bold; }

        @media (max-width: 768px) {
            .audio-player { width: 180px; }
            .lesson-table { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="btn-small btn-blue"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="lessons.html" class="btn-small btn-gold"><i class="fas fa-microphone"></i> الصوتيات</a>
        <a href="khutbah.html" class="btn-small btn-blue"><i class="fas fa-mosque"></i> الخطب</a>
        <a href="books.html" class="btn-small btn-blue"><i class="fas fa-book"></i> الكتب</a>
        <a href="articles.html" class="btn-small btn-blue"><i class="fas fa-pen-nib"></i> المقالات</a>
    </nav>

    <div class="categories-container">
        <button class="cat-btn active" onclick="filterCat('all', this)">الكل</button>
        <button class="cat-btn" onclick="filterCat('tafseer', this)">تفسير القرآن</button>
        <button class="cat-btn" onclick="filterCat('hadith', this)">شروح الحديث</button>
        <button class="cat-btn" onclick="filterCat('aqidah', this)">العقيدة</button>
        <button class="cat-btn" onclick="filterCat('fiqh', this)">الفقه</button>
        <button class="cat-btn" onclick="filterCat('faraid', this)">علم الفرائض</button>
    </div>

    <div class="content-container">
        <div class="section-box">
            <table class="lesson-table">
                <thead>
                    <tr>
                        <th width="40%">عنوان الدرس</th>
                        <th width="45%">الاستماع</th>
                        <th width="15%">تحميل</th>
                    </tr>
                </thead>
                <tbody id="lessons-body">
                    <tr data-category="faraid">
                        <td>شرح الرحبية - الدرس 1</td>
                        <td><audio controls class="audio-player"><source src="audio/faraid-1.mp3" type="audio/mpeg"></audio></td>
                        <td><a href="audio/faraid-1.mp3" download class="btn-download"><i class="fas fa-download"></i></a></td>
                    </tr>
                    <tr data-category="tafseer">
                        <td>تفسير سورة الفاتحة</td>
                        <td><audio controls class="audio-player"><source src="audio/tafseer-1.mp3" type="audio/mpeg"></audio></td>
                        <td><a href="audio/tafseer-1.mp3" download class="btn-download"><i class="fas fa-download"></i></a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        function filterCat(category, btn) {
            // تحديث الأزرار
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // تصفية الجداول
            const rows = document.querySelectorAll('#lessons-body tr');
            rows.forEach(row => {
                if (category === 'all' || row.getAttribute('data-category') === category) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
