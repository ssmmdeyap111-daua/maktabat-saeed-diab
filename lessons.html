<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        .site-header { text-align: center; padding: 40px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 4px solid white; }
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        .nav-link { padding: 10px 20px; background: var(--accent-blue); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
        
        /* شبكة الأقسام */
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; padding: 20px; }
        .cat-card { background: white; padding: 20px; border-radius: 15px; display: flex; align-items: center; cursor: pointer; border-right: 6px solid var(--accent-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
        .cat-card:hover { transform: translateY(-5px); background: #f0f7ff; }
        .icon-box { width: 60px; height: 60px; background: var(--light-sky); border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-left: 15px; font-size: 1.8rem; color: var(--dark-blue); }

        /* واجهة الدروس */
        #details-view { max-width: 900px; margin: 30px auto; padding: 20px; display: none; }
        .back-btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-bottom: 20px; font-family: 'Cairo'; font-weight: bold; }

        /* تصميم القوائم المنسدلة للسور */
        .surah-wrapper { background: white; margin-bottom: 10px; border-radius: 10px; overflow: hidden; border-right: 5px solid var(--accent-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .surah-header { background: #f8fbff; padding: 18px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; color: var(--dark-blue); font-size: 1.1rem; }
        .surah-header:hover { background: #edf5ff; }
        .surah-content { display: none; padding: 10px; background: #fff; border-top: 1px solid #eee; }
        
        .lesson-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f5f5f5; flex-wrap: wrap; gap: 10px; }
        .lesson-item:last-child { border-bottom: none; }
        audio { height: 35px; width: 250px; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>المكتبة العلمية للشيخ سعيد مصطفى دياب</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="khutbah.html" class="nav-link">الخطب</a>
    <a href="lessons.html" class="nav-link" style="background:var(--dark-blue)">الدروس</a>
</div>

<div id="main-view">
    <div class="categories-grid">
        <div class="cat-card" onclick="showSection('tafseer')"><div class="icon-box"><i class="fas fa-book-open"></i></div><h3>تفسير القرآن الكريم</h3></div>
        <div class="cat-card" onclick="showSection('hadith')"><div class="icon-box"><i class="fas fa-scroll"></i></div><h3>شرح الحديث</h3></div>
        <div class="cat-card" onclick="showSection('tawheed')"><div class="icon-box"><i class="fas fa-shield-halved"></i></div><h3>العقيدة (كتاب التوحيد)</h3></div>
        <div class="cat-card" onclick="showSection('faraid')"><div class="icon-box"><i class="fas fa-calculator"></i></div><h3>علم الفرائض</h3></div>
    </div>
</div>

<div id="details-view">
    <button class="back-btn" onclick="hideSection()">← عودة لقائمة العلوم</button>
    <h2 id="section-title" style="color: var(--dark-blue); margin-bottom: 20px; border-bottom: 2px solid var(--accent-blue); padding-bottom: 10px;"></h2>
    <div id="lessons-list"></div>
</div>

<script>
    // 1. بيانات التفسير (نظام السور المنسدلة)
    const tafseerBySurah = [
        { 
            name: "سورة الفاتحة", 
            lessons: [
                {t: "تفسير سورة الفاتحة - الدرس 1", f: "fatiha-1.mp3"}, 
                {t: "تفسير سورة الفاتحة - الدرس 2", f: "fatiha-2.mp3"}
            ] 
        },
        { 
            name: "سورة البقرة", 
            lessons: Array.from({length: 40}, (_, i) => ({t: `تفسير سورة البقرة - الدرس ${i+1}`, f: `bakara-${i+1}.mp3`})) 
        },
        { 
            name: "سورة آل عمران", 
            lessons: Array.from({length: 52}, (_, i) => ({t: `تفسير آل عمران - الدرس ${i+1}`, f: `aleimran-${i+1}.mp3`})) 
        },
        { 
            name: "سورة النساء", 
            lessons: Array.from({length: 53}, (_, i) => ({t: `تفسير سورة النساء - الدرس ${i+1}`, f: `nesa-${i+1}.mp3`})) 
        }
    ];

    // 2. بيانات العلوم الأخرى
    const otherData = {
        hadith: { 
            title: "شرح رياض الصالحين", 
            list: Array.from({length: 30}, (_, i) => ({ t: `رياض الصالحين - الدرس ${i+1}`, f: `reyad-${i+1}.mp3` })) 
        },
        tawheed: { 
            title: "شرح كتاب التوحيد", 
            list: Array.from({length: 35}, (_, i) => ({ 
                t: `كتاب التوحيد - الدرس ${i+1}`, 
                f: `tawheed-${i+1}.mp3`, 
                f2: `tawheed${i+1}.mp3` 
            })) 
        },
        faraid: { 
            title: "شرح المنظومة الرحبية", 
            list: Array.from({length: 11}, (_, i) => ({ t: `المنظومة الرحبية - الدرس ${i+1}`, f: `al-rhapih${i+1}.mp3` })) 
        }
    };

    function showSection(key) {
        const listDiv = document.getElementById('lessons-list');
        listDiv.innerHTML = "";
        
        if (key === 'tafseer') {
            document.getElementById('section-title').innerText = "تفسير القرآن الكريم";
            tafseerBySurah.forEach((surah, index) => {
                const html = `
                    <div class="surah-wrapper">
                        <div class="surah-header" onclick="toggleSurah(${index})">
                            <span>${surah.name}</span>
                            <i class="fas fa-chevron-down" id="icon-${index}"></i>
                        </div>
                        <div class="surah-content" id="surah-${index}">
                            ${surah.lessons.map(l => `
                                <div class="lesson-item">
                                    <span style="font-weight:bold; color:#444">${l.t}</span>
                                    <audio controls preload="none"><source src="audio/${l.f}" type="audio/mpeg"></audio>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                listDiv.innerHTML += html;
            });
        } else {
            const section = otherData[key];
            document.getElementById('section-title').innerText = section.title;
            listDiv.innerHTML = section.list.map(item => `
                <div class="lesson-item" style="background:white; margin-bottom:8px; padding:15px; border-radius:10px; border-right:5px solid var(--dark-blue);">
                    <span style="font-weight:bold; color:var(--dark-blue)">${item.t}</span>
                    <audio controls preload="none">
                        <source src="audio/${item.f}" type="audio/mpeg">
                        ${item.f2 ? `<source src="audio/${item.f2}" type="audio/mpeg">` : ''}
                    </audio>
                </div>
            `).join('');
        }

        document.getElementById('main-view').style.display = 'none';
        document.getElementById('details-view').style.display = 'block';
        window.scrollTo(0,0);
    }

    function toggleSurah(index) {
        const content = document.getElementById(`surah-${index}`);
        const icon = document.getElementById(`icon-${index}`);
        const isOpen = content.style.display === 'block';
        
        content.style.display = isOpen ? 'none' : 'block';
        icon.className = isOpen ? 'fas fa-chevron-down' : 'fas fa-chevron-up';
    }

    function hideSection() {
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('details-view').style.display = 'none';
    }
</script>

</body>
</html>
