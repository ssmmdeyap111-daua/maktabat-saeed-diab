<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        .site-header { text-align: center; padding: 30px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 4px solid white; }
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; flex-wrap: wrap; }
        .nav-link { padding: 8px 18px; background: var(--accent-blue); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; }
        
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; max-width: 1000px; margin: 20px auto; padding: 20px; }
        .cat-card { background: white; padding: 15px; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; border-right: 5px solid var(--accent-blue); box-shadow: 0 3px 8px rgba(0,0,0,0.05); transition: 0.3s; text-align: center; }
        .cat-card:hover { transform: translateY(-3px); background: #f0f7ff; }
        .cat-card h3 { margin: 0; font-size: 1.1rem; color: var(--dark-blue); }

        #details-view { max-width: 900px; margin: 20px auto; padding: 20px; display: none; }
        .back-btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-family: 'Cairo'; font-weight: bold; }

        .item-wrapper { background: white; margin-bottom: 10px; border-radius: 10px; overflow: hidden; border-right: 5px solid var(--accent-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item-header { background: #f8fbff; padding: 15px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; color: var(--dark-blue); }
        .item-content { display: none; padding: 10px; background: #fff; border-top: 1px solid #eee; }
        
        .lesson-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f5f5f5; flex-wrap: wrap; gap: 10px; }
        audio { height: 35px; width: 230px; }
    </style>
</head>
<body>

<header class="site-header">
    <h1 style="font-size: 1.8rem; margin: 0;">الدروس العلمية للشيخ سعيد دياب</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="khutbah.html" class="nav-link">الخطب</a>
    <a href="lessons.html" class="nav-link" style="background:var(--dark-blue)">الدروس</a>
</div>

<div id="main-view">
    <div class="categories-grid">
        <div class="cat-card" onclick="showSection('tafseer')"><h3>تفسير القرآن الكريم</h3></div>
        <div class="cat-card" onclick="showSection('hadith')"><h3>شروح الحديث</h3></div>
        <div class="cat-card" onclick="showSection('tawheed')"><h3>العقيدة</h3></div>
        <div class="cat-card" onclick="showSection('faraid')"><h3>علم الفرائض</h3></div>
    </div>
</div>

<div id="details-view">
    <button class="back-btn" onclick="hideSection()">← عودة للقائمة</button>
    <h2 id="section-title" style="color: var(--dark-blue); border-bottom: 2px solid var(--accent-blue); padding-bottom: 10px;"></h2>
    <div id="lessons-list"></div>
</div>

<script>
    // 1. بيانات التفسير
    const tafseerData = [
        { name: "سورة الفاتحة", lessons: [{t: "الدرس 1", f: "fatiha-1.mp3"}, {t: "الدرس 2", f: "fatiha-2.mp3"}] },
        { name: "سورة البقرة", lessons: Array.from({length: 40}, (_, i) => ({t: `الدرس ${i+1}`, f: `bakara-${i+1}.mp3`})) },
        { name: "سورة آل عمران", lessons: Array.from({length: 52}, (_, i) => ({t: `الدرس ${i+1}`, f: `aleimran-${i+1}.mp3`})) },
        { name: "سورة النساء", lessons: Array.from({length: 53}, (_, i) => ({t: `الدرس ${i+1}`, f: `nesa-${i+1}.mp3`})) },
        { name: "سورة المائدة", lessons: Array.from({length: 34}, (_, i) => ({t: `الدرس ${i+1}`, f: `maida-${i+1}.mp3`})) },
        { name: "سورة الأنعام", lessons: Array.from({length: 36}, (_, i) => ({t: `الدرس ${i+1}`, f: `anaam-${i+1}.mp3`})) },
        { name: "سورة الأعراف", lessons: Array.from({length: 41}, (_, i) => ({t: `الدرس ${i+1}`, f: `araf-${i+1}.mp3`})) },
        { name: "سورة الأنفال", lessons: Array.from({length: 16}, (_, i) => ({t: `الدرس ${i+1}`, f: `anfal-${i+1}.mp3`})) },
        { name: "سورة التوبة", lessons: Array.from({length: 33}, (_, i) => ({t: `الدرس ${i+1}`, f: `tawba-${i+1}.mp3`})) },
        { name: "سورة يونس", lessons: Array.from({length: 23}, (_, i) => ({t: `الدرس ${i+1}`, f: `younis-${i+1}.mp3`})) },
        { name: "سورة هود", lessons: Array.from({length: 22}, (_, i) => ({t: `الدرس ${i+1}`, f: `houd-${i+1}.mp3`})) },
        { name: "سورة يوسف", lessons: Array.from({length: 17}, (_, i) => ({t: `الدرس ${i+1}`, f: `yousif-${i+1}.mp3`})) },
        { name: "سورة الرعد", lessons: Array.from({length: 11}, (_, i) => ({t: `الدرس ${i+1}`, f: `raad-${i+1}.mp3`})) }
    ];

    // 2. بيانات العقيدة المحدثة (4 كتب بقوائم منسدلة)
    const tawheedData = [
        { name: "شرح العقيدة الطحاوية", lessons: Array.from({length: 21}, (_, i) => ({t: `الدرس ${i+1}`, f: `tahawiya-${i+1}.mp3`})) },
        { name: "شرح العقيدة الواسطية", lessons: Array.from({length: 26}, (_, i) => ({t: `الدرس ${i+1}`, f: `wasitiya-${i+1}.mp3`})) },
        { name: "شرح سلم الوصول", lessons: Array.from({length: 25}, (_, i) => ({t: `الدرس ${i+1}`, f: `sollam-${i+1}.mp3`})) },
        { name: "شرح كتاب التوحيد", lessons: Array.from({length: 23}, (_, i) => ({t: `الدرس ${i+1}`, f: `tawheed-${i+1}.mp3`})) }
    ];

    // 3. البيانات الأخرى (القوائم المباشرة)
    const otherData = {
        hadith: { title: "شروح الحديث", list: Array.from({length: 30}, (_, i) => ({ t: `رياض الصالحين - الدرس ${i+1}`, f: `reyad-${i+1}.mp3` })) },
        faraid: { title: "علم الفرائض", list: Array.from({length: 11}, (_, i) => ({ t: `المنظومة الرحبية - الدرس ${i+1}`, f: `al-rhapih${i+1}.mp3` })) }
    };

    function showSection(key) {
        const listDiv = document.getElementById('lessons-list');
        listDiv.innerHTML = "";
        
        if (key === 'tafseer' || key === 'tawheed') {
            const currentData = (key === 'tafseer') ? tafseerData : tawheedData;
            document.getElementById('section-title').innerText = (key === 'tafseer') ? "تفسير القرآن الكريم" : "العقيدة";
            
            currentData.forEach((item, index) => {
                listDiv.innerHTML += `
                    <div class="item-wrapper">
                        <div class="item-header" onclick="toggleItem('${key}-${index}')"><span>${item.name}</span> <small>▼</small></div>
                        <div class="item-content" id="${key}-${index}">
                            ${item.lessons.map(l => `<div class="lesson-item"><span>${l.t}</span><audio controls preload="none"><source src="audio/${l.f}" type="audio/mpeg"></audio></div>`).join('')}
                        </div>
                    </div>`;
            });
        } else {
            const section = otherData[key];
            document.getElementById('section-title').innerText = section.title;
            listDiv.innerHTML = section.list.map(item => `
                <div class="lesson-item" style="background:white; margin-bottom:8px; padding:15px; border-radius:10px; border-right:5px solid var(--dark-blue);">
                    <span style="font-weight:bold">${item.t}</span>
                    <audio controls preload="none"><source src="audio/${item.f}" type="audio/mpeg"></audio>
                </div>`).join('');
        }
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('details-view').style.display = 'block';
        window.scrollTo(0,0);
    }

    function toggleItem(id) {
        const content = document.getElementById(id);
        content.style.display = (content.style.display === 'block') ? 'none' : 'block';
    }

    function hideSection() {
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('details-view').style.display = 'none';
    }
</script>
</body>
</html>
