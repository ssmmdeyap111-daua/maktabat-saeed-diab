<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); }
        .site-header { text-align: center; padding: 40px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 4px solid white; }
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        .nav-link { padding: 10px 20px; background: var(--accent-blue); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }

        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; padding: 20px; }
        .cat-card { background: white; padding: 20px; border-radius: 15px; display: flex; align-items: center; cursor: pointer; border-right: 6px solid var(--accent-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
        .icon-box { width: 60px; height: 60px; background: var(--light-sky); border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-left: 15px; font-size: 1.8rem; color: var(--dark-blue); }

        #details-view { max-width: 900px; margin: 30px auto; padding: 20px; display: none; }
        .lesson-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border-right: 5px solid var(--dark-blue); flex-wrap: wrap; }
        .back-btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-bottom: 20px; font-family: 'Cairo'; }
        audio { height: 35px; width: 250px; }
    </style>
</head>
<body>

<header class="site-header"><h1>الدروس العلمية</h1></header>

<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="lessons.html" class="nav-link" style="background:var(--dark-blue)">الدروس</a>
</div>

<div id="main-view">
    <div class="categories-grid">
        <div class="cat-card" onclick="loadLessons('tafseerData', 'التفسير')"><div class="icon-box"><i class="fas fa-book-open"></i></div><h3>التفسير</h3></div>
        <div class="cat-card" onclick="loadLessons('quranData', 'علوم القرآن')"><div class="icon-box"><i class="fas fa-quran"></i></div><h3>علوم القرآن</h3></div>
        <div class="cat-card" onclick="loadLessons('hadithData', 'شرح الحديث')"><div class="icon-box"><i class="fas fa-scroll"></i></div><h3>شرح الحديث</h3></div>
        <div class="cat-card" onclick="loadLessons('tawheedData', 'العقيدة')"><div class="icon-box"><i class="fas fa-shield-halved"></i></div><h3>العقيدة</h3></div>
        <div class="cat-card" onclick="loadLessons('fiqhData', 'الفقه')"><div class="icon-box"><i class="fas fa-gavel"></i></div><h3>الفقه</h3></div>
        <div class="cat-card" onclick="loadLessons('seerahData', 'السيرة')"><div class="icon-box"><i class="fas fa-mosque"></i></div><h3>السيرة</h3></div>
        <div class="cat-card" onclick="loadLessons('faraidData', 'الفرائض')"><div class="icon-box"><i class="fas fa-calculator"></i></div><h3>الفرائض</h3></div>
        <div class="cat-card" onclick="loadLessons('raqaeqData', 'الرقائق')"><div class="icon-box"><i class="fas fa-heart"></i></div><h3>الرقائق</h3></div>
    </div>
</div>

<div id="details-view">
    <button class="back-btn" onclick="toggleView(false)">← عودة للأقسام</button>
    <h2 id="section-title" style="color: var(--dark-blue);"></h2>
    <div id="lessons-container"></div>
</div>

<script src="tafseer.data.js"></script>
<script src="quran.data.js"></script>
<script src="hadith.data.js"></script>
<script src="aqidah.data.js"></script>
<script src="fiqh.data.js"></script>
<script src="seerah.data.js"></script>
<script src="faraid.data.js"></script>
<script src="raqaeq.data.js"></script>

<script>
    function loadLessons(variableName, title) {
        // هذه السطور تجعل البرنامج يبحث عن البيانات بأكثر من مسمى لضمان التشغيل
        let data = window[variableName];
        
        // محاولة إضافية للبحث عن مسميات أخرى (مثل faraidLessons بدلاً من faraidData)
        if (!data) {
            if (variableName === 'faraidData') data = window['faraidLessons'];
            if (variableName === 'hadithData') data = window['hadithLessons'];
            if (variableName === 'tawheedData') data = window['tawheedLessons'];
        }

        if (!data || data.length === 0) {
            alert("لا توجد دروس حالياً في قسم " + title);
            return;
        }

        document.getElementById('section-title').innerText = title;
        const container = document.getElementById('lessons-container');
        
        container.innerHTML = data.map(lesson => `
            <div class="lesson-item">
                <span style="font-weight:bold">${lesson.title}</span>
                <audio controls preload="none">
                    <source src="audio/${lesson.file}" type="audio/mpeg">
                </audio>
            </div>
        `).join('');

        toggleView(true);
    }

    function toggleView(showDetails) {
        document.getElementById('main-view').style.display = showDetails ? 'none' : 'block';
        document.getElementById('details-view').style.display = showDetails ? 'block' : 'none';
        window.scrollTo(0,0);
    }
</script>
</body>
</html>
