<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس الشيخ سعيد مصطفى دياب الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; --gold: #d4af37; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); }
        .site-header { text-align: center; padding: 50px 20px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-family: 'Reem Kufi', sans-serif; font-size: 2.5rem; color: var(--dark-blue); }
        .nav-bar { display: flex; justify-content: center; padding: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-3d { padding: 12px 25px; background: white; border-radius: 12px; text-decoration: none; color: var(--dark-blue); font-weight: bold; box-shadow: 0 4px 0 #5da0bc; transition: 0.1s; }
        .active-btn { background: var(--bright-blue); color: white; box-shadow: 0 4px 0 var(--dark-blue); }
        .container { max-width: 1000px; margin: 20px auto; padding: 15px; }
        
        /* تصميم فهرس الأقسام */
        .main-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .cat-card { background: white; padding: 20px; border-radius: 15px; text-align: center; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .cat-card i { font-size: 2.5rem; color: var(--gold); margin-bottom: 10px; display: block; }
        .cat-card span { font-weight: 900; color: var(--dark-blue); }

        /* تصميم قوائم الدروس */
        .lesson-section { background: white; border-radius: 15px; padding: 20px; margin-bottom: 30px; border-right: 6px solid var(--gold); }
        .sec-title { color: var(--dark-blue); border-bottom: 2px solid var(--light-sky); padding-bottom: 10px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .lessons-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
        .lesson-item { background: #f9fbfd; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #edf2f7; }
        audio { height: 30px; width: 160px; }
        .dl { color: #27ae60; font-size: 1.2rem; }
    </style>
</head>
<body>

<header class="site-header"><h1>دروس الشيخ سعيد مصطفى دياب</h1></header>

<div class="nav-bar">
    <a href="index.html" class="btn-3d">الرئيسية</a>
    <a href="tafseer.html" class="btn-3d active-btn"><i class="fas fa-book-quran"></i> دروس التفسير</a>
    <a href="khutbah.html" class="btn-3d">الخطب</a>
</div>

<div class="container">

    <div class="lesson-section">
        <h2 class="sec-title"><i class="fas fa-mosque"></i> دروس العقيدة والتوحيد</h2>
        <div class="lessons-list">
            <div class="lesson-item"><span>شرح كتاب التوحيد 01</span><audio controls><source src="audio/aqidah-01.mp3"></audio></div>
            <div class="lesson-item"><span>شرح كتاب التوحيد 02</span><audio controls><source src="audio/aqidah-02.mp3"></audio></div>
            <div class="lesson-item"><span>الأصول الثلاثة</span><audio controls><source src="audio/osol.mp3"></audio></div>
        </div>
    </div>

    <div class="lesson-section">
        <h2 class="sec-title"><i class="fas fa-gavel"></i> دروس الفقه وأصوله</h2>
        <div class="lessons-list">
            <div class="lesson-item"><span>كتاب الصلاة 01</span><audio controls><source src="audio/fiqh-01.mp3"></audio></div>
            <div class="lesson-item"><span>أحكام الصيام</span><audio controls><source src="audio/siyam.mp3"></audio></div>
        </div>
    </div>

    <div class="lesson-section">
        <h2 class="sec-title"><i class="fas fa-history"></i> السيرة النبوية العطرة</h2>
        <div class="lessons-list">
            <div class="lesson-item"><span>نسب النبي ﷺ</span><audio controls><source src="audio/seerah-01.mp3"></audio></div>
            <div class="lesson-item"><span>بعثته ﷺ</span><audio controls><source src="audio/seerah-02.mp3"></audio></div>
        </div>
    </div>

    <div class="lesson-section">
        <h2 class="sec-title"><i class="fas fa-heart"></i> الرقائق وتربية القلوب</h2>
        <div class="lessons-list">
            <div class="lesson-item"><span>الإخلاص</span><audio controls><source src="audio/zuhd-01.mp3"></audio></div>
            <div class="lesson-item"><span>التوبة الصادقة</span><audio controls><source src="audio/zuhd-02.mp3"></audio></div>
        </div>
    </div>

</div>

<footer style="text-align: center; padding: 20px; color: #888;">جميع الحقوق محفوظة &copy; 2026</footer>

</body>
</html>
