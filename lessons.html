<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); }
        
        /* الهيدر والقائمة بنفس ستايل موقعك الأساسي */
        .site-header { text-align: center; padding: 40px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 4px solid white; }
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        .nav-link { padding: 10px 20px; background: var(--accent-blue); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; box-shadow: 0 4px 0 #5f9ea0; }

        /* تنسيق الأيقونات المتوحد (الذي طلبته) */
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; padding: 20px; }
        .cat-card { background: white; padding: 20px; border-radius: 15px; display: flex; align-items: center; cursor: pointer; border-right: 6px solid var(--accent-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
        .cat-card:hover { transform: translateY(-5px); background: #f0f7ff; }
        
        .icon-box { 
            width: 60px; height: 60px; background: var(--light-sky); 
            border-radius: 12px; display: flex; justify-content: center; 
            align-items: center; margin-left: 15px; flex-shrink: 0; font-size: 1.8rem; color: var(--dark-blue);
        }

        /* قائمة الدروس الصوتية */
        #details-section { max-width: 900px; margin: 30px auto; padding: 20px; display: none; }
        .lesson-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border-right: 5px solid var(--dark-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.05); flex-wrap: wrap; }
        .lesson-title { font-weight: bold; color: var(--dark-blue); flex: 1; min-width: 200px; }
        audio { height: 35px; }
        .back-btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-bottom: 20px; font-family: 'Cairo'; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>الدروس العلمية - الشيخ سعيد مصطفى دياب</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="khutbah.html" class="nav-link">الخطب</a>
    <a href="lessons.html" class="nav-link" style="background:var(--dark-blue)">الدروس</a>
</div>

<div id="categories-view">
    <div class="categories-grid" id="cat-list">
        </div>
</div>

<div id="details-section">
    <button class="back-btn" onclick="hideLessons()"><i class="fas fa-arrow-right"></i> عودة للأقسام</button>
    <h2 id="section-title" style="color: var(--dark-blue); margin-bottom: 20px; border-bottom: 2px solid var(--accent-blue); padding-bottom: 10px;"></h2>
    <div id="lessons-list"></div>
</div>

<script src="lessons.data.js"></script> <script>
    // في حال عدم وجود ملف خارجي، سنضع البيانات هنا كاحتياط
    const localData = {
        hadith: { title: "شرح رياض الصالحين", folder: "hadith", list: typeof hadithLessons !== 'undefined' ? hadithLessons : [] },
        tawheed: { title: "شرح كتاب التوحيد", folder: "tawheed", list: typeof tawheedLessons !== 'undefined' ? tawheedLessons : [] },
        faraid: { title: "شرح المنظومة الرحبية", folder: "faraid", list: typeof faraidLessons !== 'undefined' ? faraidLessons : [] }
    };

    const categories = [
        { key: 'tawheed', title: "العقيدة", icon: "fas fa-shield-halved" },
        { key: 'hadith', title: "شرح الحديث", icon: "fas fa-scroll" },
        { key: 'faraid', title: "الفرائض", icon: "fas fa-calculator" },
        { key: 'tafseer', title: "التفسير", icon: "fas fa-book-open" },
        { key: 'quran', title: "علوم القرآن", icon: "fas fa-quran" },
        { key: 'fiqh', title: "الفقه", icon: "fas fa-gavel" },
        { key: 'seerah', title: "السيرة", icon: "fas fa-mosque" },
        { key: 'raqaeq', title: "الرقائق", icon: "fas fa-heart" }
    ];

    function init() {
        const catList = document.getElementById('cat-list');
        catList.innerHTML = categories.map(c => `
            <div class="cat-card" onclick="showLessons('${c.key}')">
                <div class="icon-box"><i class="${c.icon}"></i></div>
                <h3>${c.title}</h3>
            </div>
        `).join('');
    }

    function showLessons(key) {
        const section = localData[key];
        if (!section || section.list.length === 0) {
            alert("هذا القسم سيتم إضافة دروسه قريباً بإذن الله");
            return;
        }
        document.getElementById('categories-view').style.display = 'none';
        document.getElementById('details-section').style.display = 'block';
        document.getElementById('section-title').innerText = section.title;
        
        const listContainer = document.getElementById('lessons-list');
        listContainer.innerHTML = section.list.map(l => `
            <div class="lesson-item">
                <span class="lesson-title">${l.title}</span>
                <audio controls preload="none">
                    <source src="audio/${section.folder}/${l.file}" type="audio/mpeg">
                    <source src="${l.file}" type="audio/mpeg"> </audio>
            </div>
        `).join('');
    }

    function hideLessons() {
        document.getElementById('categories-view').style.display = 'block';
        document.getElementById('details-section').style.display = 'none';
    }

    init();
</script>
</body>
</html>
