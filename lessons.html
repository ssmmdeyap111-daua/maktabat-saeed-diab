<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أقسام الصوتيات - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
            --beige-bg: #fdfae7; --prayer-green: #e8f5e9;
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: #fff; min-height: 100vh; }

        /* شريط المعلومات العلوي (المواقيت والتاريخ) */
        .top-info-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: var(--beige-bg); border-bottom: 2px solid var(--accent-blue); }
        .date-box { background: white; padding: 10px 25px; border-radius: 50px; border: 2px solid var(--gold-color); font-weight: 900; font-size: 1rem; }
        .prayer-table { display: flex; gap: 5px; }
        .prayer-column { display: flex; flex-direction: column; align-items: center; width: 70px; }
        .prayer-name { background: #3e7d3e; color: white; width: 100%; text-align: center; font-size: 0.8rem; border-radius: 8px 8px 0 0; padding: 2px 0; }
        .prayer-time { background: var(--prayer-green); color: #1b5e20; width: 100%; text-align: center; font-weight: 900; border: 1px solid #c8e6c9; border-radius: 0 0 8px 8px; }

        /* الهيدر */
        .site-header { text-align: center; padding: 20px; background: var(--header-bg); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 650px; width: 100%; height: auto; mix-blend-mode: multiply; }

        /* شريط التنقل */
        .nav-bar { display: flex; justify-content: center; gap: 12px; padding: 25px; flex-wrap: wrap; background: rgba(255,255,255,0.4); }
        
        .btn-3d-style { 
            flex: 1; min-width: 160px; padding: 15px 20px; border-radius: 15px; 
            font-weight: 900; font-size: 1.3rem; text-decoration: none; color: white;
            text-align: center; transition: 0.2s; display: flex; align-items: center; 
            justify-content: center; gap: 10px;
            box-shadow: 0 8px 0 var(--dark-blue); border: 2px solid rgba(255,255,255,0.2);
        }
        .btn-3d-style:hover { transform: translateY(-3px); box-shadow: 0 10px 0 var(--dark-blue); }
        .btn-3d-style:active { transform: translateY(3px); box-shadow: 0 4px 0 var(--dark-blue); }

        .btn-blue { background: linear-gradient(to bottom, #87ceeb, #5a9bd5); }
        .btn-gold { background: linear-gradient(to bottom, #d4af37, #b38f2d); box-shadow: 0 8px 0 #8c6d1a; }

        /* عنوان الصفحة */
        .page-info { text-align: center; padding: 40px 20px; }
        .page-title { color: var(--dark-blue); font-size: 2.5rem; font-weight: 900; border-bottom: 3px solid var(--gold-color); display: inline-block; padding-bottom: 10px; }

        /* شبكة الأقسام */
        .categories-grid { display: flex; justify-content: center; gap: 20px; padding: 20px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto 80px; }
        
        /* تصميم خاص لأزرار الأقسام لتمييزها */
        .cat-btn { background: #fff; color: var(--dark-blue); border: 2px solid var(--accent-blue); box-shadow: 0 6px 0 var(--accent-blue); }
        .cat-btn:hover { background: var(--light-sky); box-shadow: 0 8px 0 var(--accent-blue); }

        footer { text-align: center; padding: 30px; color: var(--dark-blue); font-weight: bold; background: var(--header-bg); border-top: 4px solid #fff; }
    </style>
</head>
<body>

    <div class="top-info-bar">
        <div class="date-box" id="full-date"></div>
        <div class="prayer-table" id="prayer-times"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="btn-3d-style btn-blue"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="lessons.html" class="btn-3d-style btn-gold"><i class="fas fa-microphone"></i> الصوتيات</a>
        <a href="khutbah.html" class="btn-3d-style btn-blue"><i class="fas fa-mosque"></i> الخطب</a>
        <a href="books.html" class="btn-3d-style btn-blue"><i class="fas fa-book"></i> الكتب</a>
        <a href="articles.html" class="btn-3d-style btn-blue"><i class="fas fa-pen-nib"></i> المقالات</a>
    </nav>

    <div class="page-info">
        <h2 class="page-title">أقسام الصوتيات</h2>
    </div>

    <div class="categories-grid">
        <a href="tafseer.html" class="btn-3d-style btn-blue"><i class="fas fa-book-open"></i> تفسير القرآن</a>
        
        <a href="hadith.html" class="btn-3d-style btn-blue"><i class="fas fa-scroll"></i> شروح الحديث</a>
        <a href="aqidah.html" class="btn-3d-style btn-blue"><i class="fas fa-shield-halved"></i> العقيدة والتوحيد</a>
        <a href="raqaeq.html" class="btn-3d-style btn-blue"><i class="fas fa-heart"></i> الرقائق والزهد</a>
        <a href="seerah.html" class="btn-3d-style btn-blue"><i class="fas fa-history"></i> السيرة النبوية</a>
        <a href="fiqh.html" class="btn-3d-style btn-blue"><i class="fas fa-gavel"></i> الفقه وأصوله</a>
    </div>

    <footer>جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب الرسمي &copy; 2026</footer>

    <script>
        // تحديث التاريخ والمواقيت تلقائياً
        const now = new Date();
        document.getElementById('full-date').innerText = `${new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now)} هـ | ${new Intl.DateTimeFormat('ar-EG', {day:'numeric', month:'long', year:'numeric'}).format(now)} م`;

        async function getPrayers() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const data = await res.json();
                const t = data.data.timings;
                const prayers = [{n:"الفجر",t:t.Fajr},{n:"الظهر",t:t.Dhuhr},{n:"العصر",t:t.Asr},{n:"المغرب",t:t.Maghrib},{n:"العشاء",t:t.Isha}];
                document.getElementById('prayer-times').innerHTML = prayers.map(p => `
                    <div class="prayer-column"><div class="prayer-name">${p.n}</div><div class="prayer-time">${p.t}</div></div>`).join('');
            } catch { document.getElementById('prayer-times').innerText = "خطأ"; }
        }
        getPrayers();
    </script>
</body>
</html>
