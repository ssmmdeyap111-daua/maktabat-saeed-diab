<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #eef5ff;
            --main-blue: #add8e6;
            --dark-blue: #2c5d87;
            --accent-blue: #87ceeb;
            --azkar-color: #a29bfe; /* لون مميز للأذكار */
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(to bottom, var(--light-blue), #d0e4ff);
            min-height: 100vh;
        }

        .site-header { 
            text-align: center; padding: 40px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }

        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; flex-wrap: wrap; }
        .nav-link { 
            padding: 8px 15px; background: var(--accent-blue); color: white; 
            text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px;
        }

        .container { max-width: 1200px; margin: auto; padding: 20px; }
        
        .page-title { text-align: center; color: var(--dark-blue); margin-bottom: 30px; }

        /* شبكة الدروس */
        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .lesson-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-right: 6px solid var(--accent-blue); /* افتراضي للدروس العلمية */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* تنسيق خاص لبطاقة الأذكار */
        .lesson-card.azkar-type {
            border-right-color: var(--azkar-color);
        }

        .category-tag {
            display: inline-block;
            font-size: 11px;
            background: #f0f0f0;
            padding: 2px 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #666;
        }

        .lesson-card h3 { margin: 0 0 10px 0; color: var(--dark-blue); font-size: 1.1rem; }
        
        audio { width: 100%; height: 35px; margin: 15px 0; }

        .download-btn {
            background: #f8f9fa;
            color: var(--dark-blue);
            text-align: center;
            padding: 8px;
            text-decoration: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #ddd;
        }

        .download-btn:hover { background: #eee; }

        .back-fixed {
            position: fixed; bottom: 20px; left: 20px;
            width: 50px; height: 50px;
            background: var(--dark-blue); color: white;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            text-decoration: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 style="margin:0; color: var(--dark-blue);">الشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">الرئيسية</a>
        <a href="tafseer.html" class="nav-link">التفسير</a>
        <a href="khutbah.html" class="nav-link">الخطب</a>
    </div>

    <div class="container">
        <h2 class="page-title">📚 الدروس العلمية والسلاسل</h2>
        
        <div class="lessons-grid" id="mainContainer">
            </div>
    </div>

    <a href="index.html" class="back-fixed">🏠</a>

    <script src="lessonsData.js"></script>
    <script src="azkardata.js"></script>

    <script>
        const mainContainer = document.getElementById("mainContainer");

        function loadAllContent() {
            let allContent = [];

            // 1. جلب الدروس العلمية العامة
            if (typeof allLessons !== 'undefined') {
                allLessons.forEach(item => {
                    item.type = 'general'; // لتمييز النوع
                    allContent.push(item);
                });
            }

            // 2. جلب دروس الأذكار
            if (typeof azkarLessons !== 'undefined') {
                azkarLessons.forEach(item => {
                    item.type = 'azkar'; // لتمييز النوع
                    allContent.push(item);
                });
            }

            // 3. عرض المحتوى المدمج
            if (allContent.length === 0) {
                mainContainer.innerHTML = "<p style='text-align:center;'>لا توجد دروس محملة حالياً.</p>";
                return;
            }

          allContent.forEach(lesson => {
    const isAzkar = (lesson.type === 'azkar');
    const cardClass = isAzkar ? 'lesson-card azkar-type' : 'lesson-card';
    const tagLabel = isAzkar ? '✨ قسم الأذكار' : (lesson.category || 'درس علمي');

    mainContainer.innerHTML += `
        <div class="${cardClass}">
            <div>
                <span class="category-tag">${tagLabel}</span>
                <h3>${lesson.title}</h3>
            </div>
            <audio controls preload="metadata">
                <source src="audio/${lesson.file}">
                متصفحك لا يدعم مشغل الصوت.
            </audio>
            <a href="audio/${lesson.file}" download class="download-btn">📥 تحميل الملف</a>
        </div>
    `;
});

        // بدء التنفيذ
        window.onload = loadAllContent;
    </script>

</body>
</html>
