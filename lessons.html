<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الصوتية - الشيخ سعيد مصطفى دياب</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        :root{
            --primary:#2c5d87;
            --light-blue:#7ec8e3;
            --beige:#d9b56d;
            --gold:#d4af37;
            --accent:#c7e5ef;
            --sky-blue:#87CEEB;
        }

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:'Cairo',sans-serif;
            background:#f0f7fa;
        }

        /* الشريط العلوي */

        .top-bar{
            background:white;
            border-bottom:1px solid #d8e6ee;
            padding:12px 25px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:20px;
            flex-wrap:wrap;
        }

        /* التاريخ */

        .top-date{
            color:var(--primary);
            font-weight:900;
            line-height:1.9;
            font-size:1rem;
            text-align:left;
        }

        /* مواقيت الصلاة */

        .top-prayers{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            justify-content:flex-end;
        }

        .prayer-box{
            background:#eef7fb;
            color:var(--primary);
            padding:10px 15px;
            border-radius:12px;
            font-weight:800;
            box-shadow:0 3px 8px rgba(0,0,0,0.08);
            font-size:0.95rem;
        }

        /* الهيدر */

        .site-header{
            text-align:center;
            padding:20px;
            background:var(--accent);
            border-bottom:5px solid #fff;
        }

        .site-logo{
            max-width:600px;
            width:100%;
            mix-blend-mode:multiply;
        }

        /* أزرار التنقل */

        .main-nav{
            display:flex;
            justify-content:center;
            gap:18px;
            padding:22px;
            background:white;
            flex-wrap:wrap;
        }

        .nav-btn-3d{
            padding:18px 38px;
            border-radius:16px;
            font-weight:900;
            text-decoration:none;
            color:white;
            font-size:1.18rem;
            transition:0.25s;
        }

        /* ألوان متبادلة */

        .main-nav a:nth-child(odd){
            background:var(--light-blue);
            box-shadow:0 6px 0 #4f9ab5;
        }

        .main-nav a:nth-child(even){
            background:var(--beige);
            box-shadow:0 6px 0 #9c7a37;
        }

        .nav-btn-3d:hover{
            transform:translateY(-4px);
        }

        .nav-btn-3d.active{
            transform:scale(1.05);
        }

        /* المحتوى */

        .container{
            max-width:1100px;
            margin:40px auto;
            padding:0 20px;
            text-align:center;
        }

        .section-title{
            color:var(--primary);
            font-weight:900;
            font-size:2.5rem;
            margin-bottom:40px;
            position:relative;
            display:inline-block;
        }

        .section-title::after{
            content:"";
            display:block;
            width:60%;
            height:5px;
            background:var(--gold);
            margin:10px auto;
            border-radius:5px;
        }

        /* شبكة الدروس */

        .lessons-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
            gap:20px;
            margin-top:20px;
        }

        .lesson-card{
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            border-radius:18px;
            text-decoration:none;
            color:white !important;
            font-weight:900;
            font-size:1.4rem;
            transition:0.3s;
            background:var(--sky-blue);
            box-shadow:0 6px 0 #5f9ea0;
            height:85px;
            text-align:center;
        }

        .lesson-card:hover{
            transform:translateY(-5px);
            box-shadow:0 9px 0 #5f9ea0;
        }

        /* الفوتر */

        footer{
            text-align:center;
            padding:30px;
            background:#e0f0f8;
            color:var(--primary);
            font-weight:bold;
            margin-top:60px;
            font-size:1.05rem;
        }

        /* الجوال */

        @media(max-width:768px){

            .top-bar{
                flex-direction:column;
                text-align:center;
            }

            .top-date{
                text-align:center;
            }

            .top-prayers{
                justify-content:center;
            }

            .nav-btn-3d{
                width:100%;
                text-align:center;
                font-size:1.1rem;
            }

            .section-title{
                font-size:2rem;
            }

            .prayer-box{
                min-width:90px;
                font-size:0.9rem;
            }

        }

    </style>
</head>

<body>

    <!-- الشريط العلوي -->

    <div class="top-bar">

        <!-- التاريخ -->

        <div class="top-date">

            <div id="miladi-date"></div>

            <div id="hijri-date"></div>

        </div>

        <!-- مواقيت الصلاة - الدوحة -->

        <div class="top-prayers">

            <div class="prayer-box">
                <i class="fa-solid fa-mosque"></i>
                الفجر 3:18
            </div>

            <div class="prayer-box">
                <i class="fa-solid fa-sun"></i>
                الشروق 4:45
            </div>

            <div class="prayer-box">
                <i class="fa-solid fa-cloud-sun"></i>
                الظهر 11:25
            </div>

            <div class="prayer-box">
                <i class="fa-solid fa-cloud"></i>
                العصر 2:52
            </div>

            <div class="prayer-box">
                <i class="fa-solid fa-sun"></i>
                المغرب 6:05
            </div>

            <div class="prayer-box">
                <i class="fa-solid fa-moon"></i>
                العشاء 7:35
            </div>

        </div>

    </div>

    <!-- الهيدر -->

    <header class="site-header">
        <img src="images/logo.png.jpg" class="site-logo">
    </header>

    <!-- أزرار التنقل -->

    <nav class="main-nav">

        <a href="index.html" class="nav-btn-3d">
            الرئيسية
        </a>

        <a href="tafseer_index.html" class="nav-btn-3d">
            دروس التفسير
        </a>

        <a href="lessons.html" class="nav-btn-3d active">
            الصوتيات
        </a>

        <a href="khutbah.html" class="nav-btn-3d">
            الخطب
        </a>

    </nav>

    <!-- المحتوى -->

    <div class="container">

        <h2 class="section-title">
            المكتبة الصوتية
        </h2>

        <div class="lessons-grid">

            <a href="hadith.html" class="lesson-card">
                <span>شروحات الحديث</span>
            </a>

            <a href="quran_sciences.html" class="lesson-card">
                <span>علوم القرآن</span>
            </a>

            <a href="aqidah.html" class="lesson-card">
                <span>العقيدة والتوحيد</span>
            </a>

            <a href="fiqh.html" class="lesson-card">
                <span>الفقه وأصوله</span>
            </a>

            <a href="seerah.html" class="lesson-card">
                <span>السيرة النبوية</span>
            </a>

            <a href="faraid.html" class="lesson-card">
                <span>شرح الرحبية</span>
            </a>

            <a href="raqaeq.html" class="lesson-card">
                <span>الرقائق والآداب</span>
            </a>

            <a href="radio_programs.html" class="lesson-card">
                <span>برامج إذاعية</span>
            </a>

        </div>

    </div>

    <!-- الفوتر -->

    <footer>
        جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026
    </footer>

    <!-- التاريخ -->

    <script>

        const today = new Date();

        /* التاريخ الميلادي */

        const miladiOptions = {
            weekday:'long',
            year:'numeric',
            month:'long',
            day:'numeric'
        };

        document.getElementById("miladi-date").innerHTML =
            "📅 " + today.toLocaleDateString('ar-EG', miladiOptions);

        /* التاريخ الهجري */

        const hijriOptions = {
            day:'numeric',
            month:'long',
            year:'numeric'
        };

        const hijriDate = new Intl.DateTimeFormat(
            'ar-TN-u-ca-islamic',
            hijriOptions
        ).format(today);

        document.getElementById("hijri-date").innerHTML =
            "🌙 " + hijriDate;

    </script>

</body>
</html>
