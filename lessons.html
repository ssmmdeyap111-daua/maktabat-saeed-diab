<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير القرآن الكريم - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
            --beige-bg: #fdfae7; --prayer-green: #e8f5e9;
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f9fbff; }

        /* شريط المعلومات العلوي */
        .top-info-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: var(--beige-bg); border-bottom: 2px solid var(--accent-blue); }
        .date-box { background: white; padding: 10px 25px; border-radius: 50px; border: 2px solid var(--gold-color); font-weight: 900; }
        .prayer-table { display: flex; gap: 5px; }
        .prayer-column { display: flex; flex-direction: column; align-items: center; width: 70px; }
        .prayer-name { background: #3e7d3e; color: white; width: 100%; text-align: center; font-size: 0.8rem; border-radius: 8px 8px 0 0; }
        .prayer-time { background: var(--prayer-green); color: #1b5e20; width: 100%; text-align: center; font-weight: 900; border: 1px solid #c8e6c9; border-radius: 0 0 8px 8px; }

        .site-header { text-align: center; padding: 20px; background: var(--header-bg); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 550px; width: 100%; height: auto; mix-blend-mode: multiply; }

        .nav-bar { display: flex; justify-content: center; gap: 12px; padding: 20px; flex-wrap: wrap; }
        .btn-3d { flex: 1; min-width: 140px; padding: 12px; border-radius: 12px; font-weight: 900; text-decoration: none; color: white; text-align: center; box-shadow: 0 6px 0 var(--dark-blue); transition: 0.2s; }
        .btn-blue { background: linear-gradient(to bottom, #87ceeb, #5a9bd5); }
        .btn-gold { background: linear-gradient(to bottom, #d4af37, #b38f2d); box-shadow: 0 6px 0 #8c6d1a; }

        /* حاوية الفهرس */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .section-header { text-align: center; margin-bottom: 40px; }
        .section-header h2 { font-size: 2.5rem; color: var(--dark-blue); font-weight: 900; border-bottom: 4px solid var(--gold-color); display: inline-block; padding-bottom: 10px; }

        /* كروت السور */
        .surah-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .surah-card { 
            background: white; border-radius: 20px; padding: 30px; text-align: center;
            border: 2px solid #eee; transition: 0.3s; text-decoration: none;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .surah-card:hover { border-color: var(--accent-blue); transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .surah-card i { font-size: 3rem; color: var(--gold-color); margin-bottom: 15px; }
        .surah-card h3 { font-family: 'Amiri', serif; font-size: 2rem; color: var(--dark-blue); margin: 0; }
        .surah-card p { color: #666; font-weight: bold; margin-top: 10px; }
        .btn-listen { margin-top: 15px; background: var(--dark-blue); color: white; padding: 8px 20px; border-radius: 10px; font-weight: bold; }

        footer { text-align: center; padding: 30px; color: var(--dark-blue); font-weight: bold; background: var(--header-bg); border-top: 4px solid #fff; }
    </style>
</head>
<body>

    <div class="top-info-bar">
        <div class="date-box" id="full-date"></div>
        <div class="prayer-table" id="prayer-times"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="btn-3d btn-blue">الرئيسية</a>
        <a href="lessons.html" class="btn-3d btn-gold">الصوتيات</a>
        <a href="khutbah.html" class="btn-3d btn-blue">الخطب المنبرية</a>
        <a href="articles.html" class="btn-3d btn-blue">المقالات</a>
    </nav>

    <div class="container">
        <div class="section-header">
            <h2>تفسير القرآن الكريم</h2>
            <p style="font-weight: bold; color: #555;">اختر السورة للاستماع إلى سلسلة الدروس</p>
        </div>

        <div class="surah-grid">
            
            <a href="yones.html" class="surah-card">
                <i class="fas fa-quran"></i>
                <h3>سورة يونس</h3>
                <p>سلسلة كاملة (23 درساً)</p>
                <div class="btn-listen">عرض الدروس</div>
            </a>

            <div class="surah-card" style="opacity: 0.5;">
                <i class="fas fa-book-open"></i>
                <h3>سور أخرى</h3>
                <p>قريباً إن شاء الله</p>
            </div>

        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب الرسمي &copy; 2026</footer>

    <script>
        const now = new Date();
        document.getElementById('full-date').innerText = `${new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now)} هـ | ${new Intl.DateTimeFormat('ar-EG', {day:'numeric', month:'long', year:'numeric'}).format(now)} م`;
        async function getPrayers() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const data = await res.json();
                const t = data.data.timings;
                const prayers = [{n:"الفجر",t:t.Fajr},{n:"الظهر",t:t.Dhuhr},{n:"العصر",t:t.Asr},{n:"المغرب",t:t.Maghrib},{n:"العشاء",t:t.Isha}];
                document.getElementById('prayer-times').innerHTML = prayers.map(p => `<div class="prayer-column"><div class="prayer-name">${p.n}</div><div class="prayer-time">${p.t}</div></div>`).join('');
            } catch { document.getElementById('prayer-times').innerText = "خطأ"; }
        }
        getPrayers();
    </script>
</body>
</html>
