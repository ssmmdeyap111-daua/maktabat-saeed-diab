<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس الصوتية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #eef5ff;
            --main-blue: #add8e6;
            --dark-blue: #2c5d87;
            --accent-blue: #87ceeb;
            --3d-shadow: 0 6px 0 #5f9ea0;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(to bottom, var(--light-blue), #d0e4ff);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* العنوان الرئيسي الموحد (مصغر) */
        .site-header { 
            text-align: center; padding: 60px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }
        .sheikh-title { font-size: 2.2rem; color: var(--dark-blue); margin: 0; font-weight: 700; }

        /* شريط التنقل العلوي الموحد */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; background: rgba(255,255,255,0.2); }
        .nav-link { 
            padding: 10px 18px; background: var(--accent-blue); color: white; 
            text-decoration: none; border-radius: 10px; font-weight: bold;
            box-shadow: 0 4px 0 #5f9ea0; transition: 0.2s;
        }
        .nav-link:hover { transform: translateY(-2px); }

        /* أيقونات أقسام الدروس 3D */
        .main-icons {
            display: flex; justify-content: center; flex-wrap: wrap;
            gap: 20px; margin: 50px auto; width: 90%;
        }
        .icon-btn {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            width: 160px; height: 100px;
            background: white; color: var(--dark-blue);
            text-decoration: none; font-size: 18px; font-weight: bold;
            border-radius: 15px;
            box-shadow: 0 8px 0 var(--main-blue), 0 10px 20px rgba(0,0,0,0.1);
            transition: .2s;
            border: 1px solid #fff;
        }
        .icon-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 0 var(--main-blue), 0 5px 10px rgba(0,0,0,0.1);
            background: var(--light-blue);
        }

        /* أيقونة العودة أسفل اليسار */
        .back-fixed {
            position: fixed; bottom: 30px; left: 30px;
            width: 65px; height: 65px;
            background: linear-gradient(145deg, #add8e6, #87ceeb);
            color: var(--dark-blue); text-decoration: none;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 28px; box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border: 2px solid #ffffff; transition: 0.3s; z-index: 1000;
        }
        .back-fixed:hover { transform: scale(1.1); }

        .page-title { color: var(--dark-blue); text-align: center; margin-top: 30px; font-size: 1.8rem; }
    </style>
</head>

<body>

    <header class="site-header">
        <h1 class="sheikh-title">الموقع الرسمي للشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">الرئيسية</a>
        <a href="books.html" class="nav-link">الكتب</a>
        <a href="lessons.html" class="nav-link">الدروس</a>
        <a href="khutbah.html" class="nav-link">الخطب</a>
        <a href="articles.html" class="nav-link">المقالات</a>
    </div>

    <h2 class="page-title">الأقسام العلمية للدروس</h2>

    <div class="main-icons">
        <a href="tafseer.html" class="icon-btn">📖 التفسير</a>
        <a href="hadith.html" class="icon-btn">📜 شروح الحديث</a>
        <a href="tawheed.html" class="icon-btn">💎 التوحيد</a>
        <a href="faraid.html" class="icon-btn">⚖️ الفرائض</a>
        <a href="fiqh.html" class="icon-btn">🕋 الفقه</a>
        <a href="seerah.html" class="icon-btn">📜 السيرة</a>
        <a href="raqaiq.html" class="icon-btn">✨ الرقائق</a>
    </div>

    <a href="index.html" class="back-fixed" title="الرئيسية">🏠</a>

</body>
</html>
