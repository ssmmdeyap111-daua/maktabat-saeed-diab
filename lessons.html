<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الصوتية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main-blue: #add8e6; --dark-blue: #2c5d87; }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background-color: #f8fbff; }
        
        .site-header { 
            text-align: center; padding: 20px; 
            background-color: var(--main-blue); 
            border-bottom: 3px solid #fff;
        }

        .container { max-width: 1100px; margin: auto; padding: 20px; }

        /* الأيقونات 3D بدون صور */
        .category-grid { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
        .cat-card {
            background: white; padding: 10px 20px; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 #ccd1d9; border: 1px solid #ddd; font-weight: bold; color: var(--dark-blue);
        }
        .cat-card.active { background: var(--dark-blue); color: white; box-shadow: 0 4px 0 #1a3a5a; border-color: var(--dark-blue); }

        .lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .lesson-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-right: 5px solid var(--main-blue); }
        .lesson-card h3 { margin: 0 0 10px 0; font-size: 1rem; color: var(--dark-blue); min-height: 3em; }
        
        audio { width: 100%; height: 35px; }
        .download-btn { 
            display: block; text-align: center; margin-top: 10px; padding: 8px;
            background: #f9f9f9; color: #2c5d87; text-decoration: none; 
            border-radius: 5px; font-size: 12px; font-weight: bold; border: 1px solid #eee;
        }
    </style>
</head>
<body>

<header class="site-header">
    <h2 style="margin:0; color: var(--dark-blue);">الشيخ سعيد مصطفى دياب</h2>
</header>

<div class="container">
    <div class="category-grid">
        <div class="cat-card active" onclick="filterItems('all', this)">الكل</div>
        <div class="cat-card" onclick="filterItems('تفسير', this)">التفسير</div>
        <div class="cat-card" onclick="filterItems('حديث', this)">الأحاديث</div>
        <div class="cat-card" onclick="filterItems('فرائض', this)">الفرائض</div>
        <div class="cat-card" onclick="filterItems('فقه', this)">الفقه</div>
        <div class="cat-card" onclick="filterItems('سيرة', this)">السيرة</div>
        <div class="cat-card" onclick="filterItems('رقائق', this)">الرقائق</div>
    </div>

    <div class="lessons-grid" id="list"></div>
</div>

<script>
    const data = [
        // دروس التفسير الجديدة
        { title: "تفسير سورة الفاتحة - الدرس الأول", file: "fatiha-1.mp3", cat: "تفسير" },
        { title: "تفسير سورة الفاتحة - الدرس الثاني", file: "fatiha-2.mp3", cat: "تفسير" },
        { title: "تفسير سورة البقرة - الدرس الأول", file: "bakara-1.mp3", cat: "تفسير" },
        { title: "تفسير سورة البقرة - الدرس الثاني", file: "bakara-2.mp3", cat: "تفسير" },
        { title: "تفسير سورة البقرة - الدرس الثالث", file: "bakara-3.mp3", cat: "تفسير" },
        { title: "تفسير سورة البقرة - الدرس الرابع", file: "bakara-4.mp3", cat: "تفسير" },
        { title: "تفسير سورة البقرة - الدرس الخامس", file: "bakara-5.mp3", cat: "تفسير" },

        // دروس الفرائض
        { title: "شرح المنظومة الرحبية - الدرس 1", file: "audio/al-rhapih1.mp3", cat: "فرائض" },
        { title: "شرح المنظومة الرحبية - الدرس 2", file: "audio/al-rhapih2.mp3", cat: "فرائض" },
        { title: "شرح المنظومة الرحبية - الدرس 3", file: "audio/al-rhapih3.mp3", cat: "فرائض" },
        { title: "شرح المنظومة الرحبية - الدرس 4", file: "audio/al-rhapih4.mp3", cat: "فرائض" },
        { title: "شرح المنظومة الرحبية - الدرس 5", file: "audio/al-rhapih5.mp3", cat: "فرائض" },

        // دروس الأحاديث
        { title: "شرح رياض الصالحين - الدرس 1", file: "audio/reyad-alsalehen1.mp3", cat: "حديث" }
    ];

    function show(items) {
        const list = document.getElementById("list");
        list.innerHTML = "";
        items.forEach(item => {
            // معالجة المسار: إذا كان الاسم لا يبدأ بـ audio/ نقوم بإضافتها
            let filePath = item.file;
            if (!filePath.startsWith('audio/')) {
                filePath = 'audio/' + filePath;
            }

            list.innerHTML += `
                <div class="lesson-card">
                    <small style="color:#777"># ${item.cat}</small>
                    <h3>${item.title}</h3>
                    <audio controls preload="none">
                        <source src="${filePath}" type="audio/mpeg">
                    </audio>
                    <a href="${filePath}" download class="download-btn">📥 تحميل المادة</a>
                </div>
            `;
        });
    }

    function filterItems(c, btn) {
        document.querySelectorAll('.cat-card').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (c === 'all') show(data);
        else show(data.filter(i => i.cat === c));
    }

    window.onload = () => show(data);
</script>

</body>
</html>
