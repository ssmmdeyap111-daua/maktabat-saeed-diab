<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس العلمية للشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; --header-bg: #add8e6; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        .site-header { text-align: center; padding: 60px 20px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-size: 2rem; color: var(--dark-blue); font-weight: 900; }
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        .nav-link { padding: 10px 25px; background: var(--dark-blue); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
        .categories-grid { display: flex; flex-wrap: nowrap; justify-content: center; gap: 12px; max-width: 1400px; margin: 30px auto; padding: 15px; overflow-x: auto; }
        .cat-card { background: var(--bright-blue); padding: 20px 10px; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; min-width: 130px; flex: 1; }
        .cat-card:hover { transform: translateY(-5px); background: #b0e2f5; }
        .cat-card h3 { margin: 0; font-size: 1rem; color: var(--dark-blue); font-weight: 900; white-space: nowrap; }
        #details-view { max-width: 900px; margin: 20px auto; padding: 20px; display: none; }
        .back-btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-family: 'Cairo'; font-weight: bold; }
        .item-wrapper { background: white; margin-bottom: 10px; border-radius: 10px; overflow: hidden; border-right: 5px solid var(--bright-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item-header { background: #f8fbff; padding: 15px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; color: var(--dark-blue); }
        .item-content { display: none; padding: 10px; background: #fff; border-top: 1px solid #eee; }
        .lesson-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f5f5f5; flex-wrap: wrap; gap: 10px; }
        audio { height: 35px; width: 220px; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>الدروس العلمية للشيخ سعيد مصطفى دياب</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="books.html" class="nav-link">الكتب</a>
    <a href="lessons.html" class="nav-link" style="background:var(--bright-blue); color: var(--dark-blue);">الدروس</a>
</div>

<div id="main-view">
    <div class="categories-grid">
        <div class="cat-card" onclick="showSection('tafseer')"><h3>تفسير القرآن</h3></div>
        <div class="cat-card" onclick="showSection('tawheed')"><h3>العقيدة</h3></div>
        <div class="cat-card" onclick="showSection('hadith')"><h3>شروح الحديث</h3></div>
        <div class="cat-card" onclick="showSection('faraid')"><h3>علم الفرائض</h3></div>
    </div>
</div>

<div id="details-view">
    <button class="back-btn" onclick="hideSection()">← عودة للقائمة</button>
    <h2 id="section-title" style="color: var(--dark-blue); border-bottom: 3px solid var(--bright-blue); padding-bottom: 10px;"></h2>
    <div id="lessons-list"></div>
</div>

<script>
    const dataStore = {
        'tafseer': [
            { 
                name: "سورة البقرة", 
                lessons: [
                    // دروس الأرشيف (الجديدة)
                    {t: "الدرس 11", f: "https://archive.org/download/bakara-11_202602/bakara-11.mp3"},
                    {t: "الدرس 10", f: "https://archive.org/download/bakara-10/bakara-10.mp3"},
                    // دروس جيت هاب (القديمة - سيقرأها الكود من مجلد audio تلقائياً)
                    {t: "الدرس 1", f: "bakara-1.mp3"},
                    {t: "الدرس 2", f: "bakara-2.mp3"}
                ] 
            },
            { name: "سورة الفاتحة", lessons: [{t: "الدرس 1", f: "fatiha-1.mp3"}] }
        ],
        'tawheed': [
            { name: "شرح العقيدة الطحاوية", lessons: [{t: "الدرس 1", f: "tahawiya-1.mp3"}] },
            { name: "شرح كتاب التوحيد", lessons: [{t: "الدرس 1", f: "tawheed-1.mp3"}] }
        ],
        'hadith': [
            { name: "رياض الصالحين", lessons: [{t: "الدرس 1", f: "reyad-1.mp3"}] }
        ],
        'faraid': [
            { name: "المنظومة الرحبية", lessons: [{t: "الدرس 1", f: "al-rhapih1.mp3"}] }
        ]
    };

    function showSection(key) {
        const listDiv = document.getElementById('lessons-list');
        listDiv.innerHTML = "";
        const sectionData = dataStore[key];
        
        const titles = { 'tafseer': 'تفسير القرآن', 'tawheed': 'العقيدة', 'hadith': 'شروح الحديث', 'faraid': 'علم الفرائض' };
        document.getElementById('section-title').innerText = titles[key];

        sectionData.forEach((item, index) => {
            listDiv.innerHTML += `
                <div class="item-wrapper">
                    <div class="item-header" onclick="toggleItem('${key}-${index}')">
                        <span>${item.name}</span> <small>▼</small>
                    </div>
                    <div class="item-content" id="${key}-${index}">
                        ${item.lessons.map(l => {
                            // إذا كان الرابط يبدأ بـ http يستخدمه كما هو، وإلا يضيف مسار audio/
                            let finalPath = l.f.startsWith('http') ? l.f : `audio/${l.f}`;
                            return `
                            <div class="lesson-item">
                                <span>${l.t}</span>
                                <audio controls preload="none"><source src="${finalPath}" type="audio/mpeg"></audio>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
        });

        document.getElementById('main-view').style.display = 'none';
        document.getElementById('details-view').style.display = 'block';
    }

    function toggleItem(id) {
        const content = document.getElementById(id);
        content.style.display = (content.style.display === 'block') ? 'none' : 'block';
    }

    function hideSection() {
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('details-view').style.display = 'none';
    }

    // لفتح التفسير مباشرة إذا جاء من صفحة الكتب
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const book = params.get('book');
        if (book && dataStore[book]) showSection(book);
    };
</script>
</body>
</html>
