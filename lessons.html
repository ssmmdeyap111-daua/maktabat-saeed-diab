<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --light-blue: #add8e6; /* الأزرق الفاتح المطلوب */
            --dark-blue: #2c5d87; 
            --bg-color: #fcfdfe;
        }

        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-color); color: #333; 
        }

        /* شريط العنوان بلون أزرق فاتح */
        .site-header { 
            text-align: center; padding: 30px 20px; 
            background-color: var(--light-blue); 
            color: var(--dark-blue);
            border-bottom: 4px solid #fff;
        }
        .site-header h1 { margin: 0; font-size: 1.8rem; font-weight: 700; }

        .container { max-width: 1200px; margin: auto; padding: 20px; }

        /* أيقونات الأقسام بلون أزرق فاتح */
        .category-grid { 
            display: flex; justify-content: center; gap: 10px; 
            flex-wrap: wrap; margin-bottom: 30px; 
        }
        .cat-card {
            background: #fff; padding: 12px 20px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 2px solid var(--light-blue); 
            font-weight: bold; color: var(--dark-blue); transition: 0.3s;
            min-width: 85px; text-align: center;
        }
        .cat-card.active { 
            background: var(--light-blue); 
            color: var(--dark-blue);
            box-shadow: 0 4px 12px rgba(173, 216, 230, 0.4);
        }

        .lessons-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
        }
        .lesson-card { 
            background: white; padding: 20px; border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border-top: 5px solid var(--light-blue);
            display: flex; flex-direction: column;
        }
        .lesson-card h3 { margin: 0 0 15px 0; font-size: 1.1rem; color: var(--dark-blue); min-height: 2.5em; }
        
        audio { width: 100%; height: 35px; margin-top: auto; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn {
            flex: 1; text-align: center; padding: 9px;
            text-decoration: none; border-radius: 7px; 
            font-size: 13px; font-weight: bold;
        }
        .download-btn { background: #f0f2f5; color: #555; }
        .play-btn { background: var(--light-blue); color: var(--dark-blue); }
    </style>
</head>
<body>

<header class="site-header">
    <h1>المكتبة العلمية الصوتية</h1>
    <p>فضيلة الشيخ سعيد مصطفى دياب</p>
</header>

<div class="container">
    <div class="category-grid">
        <div class="cat-card active" onclick="filterMain('all', this)">الكل</div>
        <div class="cat-card" onclick="filterMain('حديث', this)">الأحاديث</div>
        <div class="cat-card" onclick="filterMain('تفسير', this)">التفسير</div>
        <div class="cat-card" onclick="filterMain('فقه', this)">الفقه</div>
        <div class="cat-card" onclick="filterMain('سيرة', this)">السيرة</div>
        <div class="cat-card" onclick="filterMain('رقائق', this)">الرقائق</div>
        <div class="cat-card" onclick="filterMain('فرائض', this)">الفرائض</div>
    </div>

    <div class="lessons-grid" id="list"></div>
</div>

<script>
    // --- ضع دروسك هنا لكي لا تختفي ---
    const allData = [
        // دروس الأحاديث
        { title: "شرح رياض الصالحين - الدرس 1", file: "reyad-1.mp3", cat: "حديث" },
        { title: "شرح رياض الصالحين - الدرس 2", file: "reyad-2.mp3", cat: "حديث" },
        
        // دروس التفسير
        { title: "تفسير سورة الفاتحة", file: "fateha.mp3", cat: "تفسير" },

        // دروس الفرائض (أضف دروس الفرائض القديمة هنا)
        { title: "درس الفرائض 1", file: "faraid-1.mp3", cat: "فرائض" },

        // يمكنك إضافة الفقه والسيرة والرقائق بنفس الطريقة
    ];

    function render(items) {
        const list = document.getElementById("list");
        list.innerHTML = "";
        
        if (items.length === 0) {
            list.innerHTML = "<p style='grid-column:1/-1; text-align:center; padding:50px; color:#999;'>قريباً إن شاء الله..</p>";
            return;
        }

        items.forEach(item => {
            let path = "audio/" + item.file.trim();
            list.innerHTML += `
                <div class="lesson-card">
                    <small style="color:var(--dark-blue); font-weight:bold; margin-bottom:5px; display:block;">📂 ${item.cat}</small>
                    <h3>${item.title}</h3>
                    <audio controls preload="metadata">
                        <source src="${path}" type="audio/mpeg">
                    </audio>
                    <div class="btn-group">
                        <a href="${path}" download class="btn download-btn">تحميل</a>
                        <a href="${path}" target="_blank" class="btn play-btn">تشغيل مباشر</a>
                    </div>
                </div>`;
        });
    }

    function filterMain(cat, btn) {
        document.querySelectorAll('.cat-card').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (cat === 'all') render(allData);
        else render(allData.filter(i => i.cat === cat));
    }

    window.onload = function() { render(allData); };
</script>
</body>
</html>
