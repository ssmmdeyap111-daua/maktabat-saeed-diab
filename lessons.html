<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>الفهرس العام للمواد العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --gold: #b59410; --primary: #2c5d87; --bg-overlay: rgba(255, 255, 255, 0.1); }
        
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; 
            background: url('library-bg.jpg') no-repeat center center fixed; 
            background-size: cover; overflow-x: hidden;
        }

        /* شريط التنقل العلوي الموحد */
        .main-nav {
            background: rgba(255, 255, 255, 0.95);
            display: flex; justify-content: center; gap: 30px;
            padding: 12px; border-bottom: 3px solid var(--primary);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000;
        }
        .nav-item {
            text-decoration: none; color: var(--primary);
            font-weight: bold; font-size: 0.85rem;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            transition: 0.3s;
        }
        .nav-item i { font-size: 1.3rem; color: var(--gold); }
        .nav-item:hover { transform: translateY(-2px); color: var(--gold); }

        .header-title {
            text-align: center; margin: 40px 0 20px 0;
        }
        .header-title h1 { 
            color: white; font-size: 1.8rem; text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
            background: rgba(44, 93, 135, 0.7); display: inline-block; padding: 10px 40px; border-radius: 50px;
        }

        /* شبكة الأيقونات الثمانية (تصميم مستطيل وأصغر) */
        .index-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 أعمدة في السطر */
            gap: 15px; max-width: 1000px; margin: 0 auto; padding: 20px;
        }

        .cat-card {
            background: rgba(255, 255, 255, 0.9);
            text-decoration: none; color: var(--primary);
            height: 80px; /* طول مستطيل صغير */
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; border-bottom: 4px solid var(--gold);
            transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .cat-card h3 { 
            margin: 0; font-size: 1.1rem; font-weight: 700; 
        }

        .cat-card:hover { 
            transform: translateY(-5px); background: white; border-bottom-color: var(--primary);
        }

        /* للموبايل */
        @media (max-width: 768px) {
            .index-grid { grid-template-columns: repeat(2, 1fr); padding: 10px; }
            .main-nav { gap: 15px; }
            .nav-item { font-size: 0.75rem; }
            .header-title h1 { font-size: 1.4rem; }
        }
    </style>
</head>
