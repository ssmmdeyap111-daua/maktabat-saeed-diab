<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس العلمية للشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        
        /* الهيدر العريض */
        .site-header { text-align: center; padding: 80px 20px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-size: 2.2rem; color: var(--dark-blue); font-weight: 900; }

        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        .nav-link { padding: 10px 25px; background: var(--dark-blue); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
        
        /* تنسيق شريط الأغلفة في الصفحة الرئيسية */
        .categories-grid { 
            display: flex; 
            flex-wrap: nowrap; 
            justify-content: flex-start; 
            gap: 20px; 
            max-width: 1400px; 
            margin: 40px auto; 
            padding: 20px; 
            overflow-x: auto; /* تمرير جانبي سلس */
            scrollbar-width: thin;
        }
        
        .cat-card { 
            background: var(--bright-blue); 
            padding: 10px; 
            border-radius: 15px; 
            cursor: pointer; 
            border: 3px solid white; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.1); 
            transition: 0.3s; 
            min-width: 160px; /* عرض الغلاف */
            text-align: center;
            flex-shrink: 0;
        }
        
        .cat-card:hover { transform: translateY(-10px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        /* حجم الصورة داخل الأيقونة */
        .cat-card img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            border-radius: 10px; 
            margin-bottom: 10px;
            background: #fff; /* خلفية بيضاء في حال لم تظهر الصورة */
        }
        
        .cat-card h3 { margin: 0; font-size: 0.95rem; color: var(--dark-blue); font-weight: 900; }

        /* تنسيق عرض الدروس (بعد الضغط) */
        #details-view { max-width: 900px; margin: 20px auto; padding: 20px; display: none; }
        .back-btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-family: 'Cairo'; font-weight: bold; }
        .book-main-cover { width: 200px; height: auto; border-radius: 10px; margin: 0 auto 20px; display: block; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .pdf-link { display: inline-block; background: #d9534f; color: white; text-decoration: none; padding: 10px 25px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }

        .lesson-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; margin-bottom: 10px; border-radius: 10px; border-right: 5px solid var(--bright-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        audio { height: 35px; width: 220px; }

        @media (max-width: 768px) { .site-header h1 { font-size: 1.5rem; } }
    </style>
</head>
<body>

<header class="site-header">
    <h1>الدروس العلمية للشيخ سعيد مصطفى دياب</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="khutbah.html" class="nav-link">الخطب</a>
    <a href="lessons.html" class="nav-link" style="background:var(--bright-blue); color: var(--dark-blue);">الدروس</a>
</div>

<div id="main-view">
    <div class="categories-grid">
        <div class="cat-card" onclick="showSection('tafseer')">
            <img src="images/waqfat-tdaboria.jpg" alt="تفسير القرآن">
            <h3>وقفات تدبرية</h3>
        </div>
        
        <div class="cat-card" onclick="showSection('tawheed')">
            <img src="images/tahawiya.jpg" alt="العقيدة">
            <h3>شرح الطحاوية</h3>
        </div>

        <div class="cat-card" onclick="showSection('hadith')">
            <img src="images/hadith-cover.jpg" alt="الحديث">
            <h3>شروح الحديث</h3>
        </div>

        <div class="cat-card" onclick="showSection('seerah')">
            <img src="images/seerah-cover.jpg" alt="السيرة">
            <h3>السيرة النبوية</h3>
        </div>

        <div class="cat-card" onclick="showSection('faraid')">
            <img src="images/faraid-cover.jpg" alt="الفرائض">
            <h3>علم الفرائض</h3>
        </div>
        
        <div class="cat-card" onclick="showSection('raqaeq')">
            <img src="images/raqaeq-cover.jpg" alt="الرقائق">
            <h3>الرقائق</h3>
        </div>
    </div>
</div>

<div id="details-view">
    <button class="back-btn" onclick="hideSection()">← عودة للرئيسية</button>
    <div id="book-info" style="text-align: center;"></div>
    <div id="lessons-list"></div>
</div>

<script>
    const data = {
        tafseer: {
            title: "وقفات تدبرية",
            cover: "images/waqfat-tdaboria.jpg",
            pdf: "images/waqfat-tdaboria.pdf",
            lessons: Array.from({length: 10}, (_, i) => ({t: `الدرس ${i+1}`, f: `waqfat-${i+1}.mp3`}))
        },
        tawheed: {
            title: "شرح العقيدة الطحاوية",
            cover: "images/tahawiya.jpg",
            lessons: Array.from({length: 21}, (_, i) => ({t: `الدرس ${i+1}`, f: `tahawiya-${i+1}.mp3`}))
        },
        // أضف بيانات باقي الأقسام هنا بنفس النمط
    };

    function showSection(key) {
        const book = data[key];
        if(!book) return alert("سيتم إضافة الدروس قريباً إن شاء الله");

        const infoDiv = document.getElementById('book-info');
        const listDiv = document.getElementById('lessons-list');
        
        infoDiv.innerHTML = `
            <img src="${book.cover}" class="book-main-cover">
            <h2 style="color:var(--dark-blue)">${book.title}</h2>
            ${book.pdf ? `<a href="${book.pdf}" target="_blank" class="pdf-link">📄 تحميل الكتاب PDF</a>` : ""}
        `;

        listDiv.innerHTML = book.lessons.map(l => `
            <div class="lesson-item">
                <span style="font-weight:bold">${l.t}</span>
                <audio controls preload="none"><source src="audio/${l.f}" type="audio/mpeg"></audio>
            </div>
        `).join('');

        document.getElementById('main-view').style.display = 'none';
        document.getElementById('details-view').style.display = 'block';
    }

    function hideSection() {
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('details-view').style.display = 'none';
    }
</script>
</body>
</html>
