<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدروس الصوتية</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    font-family:'Noto Kufi Arabic',sans-serif;
    background:linear-gradient(to bottom,#eef5ff,#d0e4ff);
}

/* الهيدر */
.header-bar{
    background:linear-gradient(to right,#3fa1d6,#70c0e8);
    color:white;
    padding:60px 20px;
    text-align:center;
    font-size:26px;
}

/* الأيقونات */
.main-icons{
    text-align:center;
    margin:25px 0;
}

.icon-btn{
    display:inline-block;
    padding:9px 18px;
    margin:6px;
    background:#70c0e8;
    color:white;
    border-radius:12px;
    text-decoration:none;
    font-size:14px;
    box-shadow:0 6px 0 #3fa1d6;
    cursor:pointer;
    transition:all 0.2s;
}

.icon-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 9px 0 #3fa1d6;
}

/* سلاسل الدروس */
.accordion{
    width:90%;
    margin:15px auto;
}

.accordion-header{
    background:#3fa1d6;
    color:white;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.accordion-content{
    display:none;
    background:white;
    padding:15px;
    border-radius:0 0 10px 10px;
}

/* بطاقة الدرس */
.lesson-card{
    background:#eef5ff;
    padding:12px;
    border-radius:10px;
    margin-bottom:12px;
}

.lesson-card h3{
    margin-bottom:8px;
    color:#065f46;
}

audio{
    width:100%;
}

.download-btn{
    display:inline-block;
    margin-top:8px;
    background:#70c0e8;
    color:white;
    padding:6px 14px;
    border-radius:8px;
    text-decoration:none;
    font-size:13px;
}

/* زر العودة */
.back-home{
    display:inline-block;
    margin:30px;
    padding:10px 20px;
    background:#70c0e8;
    color:white;
    border-radius:12px;
    text-decoration:none;
    box-shadow:0 6px 0 #3fa1d6;
}

/* حقوق الموقع */
.footer{
    text-align:center;
    padding:20px;
    clear:both;
}
</style>
</head>
<body>

<div class="header-bar">
الدروس الصوتية
</div>

<!-- أيقونات التنقل -->
<div class="main-icons">
<a href="index.html" class="icon-btn">الرئيسية</a>
<a href="books.html" class="icon-btn">الكتب</a>
<a href="articles.html" class="icon-btn">المقالات</a>
<a href="lessons.html" class="icon-btn">الدروس</a>
<a href="khutbah.html" class="icon-btn">الخطب</a>
<a href="contact.html" class="icon-btn">تواصل</a>
</div>

<div id="lessons-container"></div>

<a href="index.html" class="back-home">العودة للرئيسية</a>

<div class="footer">
جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب
</div>

<!-- جلب بيانات الدروس -->
<script src="lessonsData.js"></script>
<script>
const container = document.getElementById('lessons-container');

lessonsData.forEach(series => {
    // إنشاء سلاسل
    const accordion = document.createElement('div');
    accordion.className = 'accordion';

    const header = document.createElement('div');
    header.className = 'accordion-header';
    header.textContent = series.name;
    accordion.appendChild(header);

    const content = document.createElement('div');
    content.className = 'accordion-content';

    series.lessons.forEach(lesson => {
        const lessonCard = document.createElement('div');
        lessonCard.className = 'lesson-card';

        const title = document.createElement('h3');
        title.textContent = lesson.title;
        lessonCard.appendChild(title);

        const audio = document.createElement('audio');
        audio.controls = true;
        const source = document.createElement('source');
        source.src = lesson.src;
        source.type = 'audio/mpeg';
        audio.appendChild(source);
        lessonCard.appendChild(audio);

        const download = document.createElement('a');
        download.href = lesson.src;
        download.className = 'download-btn';
        download.download = '';
        download.textContent = 'تحميل الدرس';
        lessonCard.appendChild(download);

        content.appendChild(lessonCard);
    });

    accordion.appendChild(content);
    container.appendChild(accordion);
});

// تفعيل الأكورديون
document.querySelectorAll(".accordion-header").forEach(header => {
    header.addEventListener("click", () => {
        const content = header.nextElementSibling;
        content.style.display = content.style.display === "block" ? "none" : "block";
    });
});
</script>

</body>
</html>
