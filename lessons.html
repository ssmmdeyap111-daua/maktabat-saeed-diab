<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الصوتية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --accent: #add8e6; --gold: #d4af37; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f0f7fa; }

        .site-header { text-align: center; padding: 20px; background: var(--accent); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; mix-blend-mode: multiply; }

        /* التنقل العلوي 3D */
        .main-nav { display: flex; justify-content: center; gap: 15px; padding: 20px; background: white; }
        .nav-btn-3d { 
            padding: 12px 25px; border-radius: 12px; font-weight: 900; text-decoration: none; color: white; 
            background: var(--primary); box-shadow: 0 6px 0 #1a3a54; transition: 0.2s;
        }
        .nav-btn-3d.active { background: var(--gold); box-shadow: 0 6px 0 #8c6d1a; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .section-title { color: var(--primary); font-weight: 900; font-size: 2.2rem; margin-bottom: 40px; position: relative; display: inline-block; }
        .section-title::after { content: ""; display: block; width: 60%; height: 5px; background: var(--gold); margin: 10px auto; border-radius: 5px; }

        /* شبكة الأيقونات المصلحة */
        .lessons-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); 
            gap: 25px; 
            margin-top: 20px;
        }

        .lesson-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 20px; border-radius: 20px; text-decoration: none; color: white !important; /* ضمان بقاء اللون أبيض */
            font-weight: 900; font-size: 1.4rem; transition: 0.3s;
            box-shadow: 0 10px 0 rgba(0,0,0,0.15); height: 180px; position: relative; overflow: hidden;
        }
        .lesson-card:hover { transform: translateY(-8px); }
        .lesson-card i { font-size: 3.5rem; margin-bottom: 15px; }

        /* ألوان الأيقونات كما في صورتك */
        .card-hadith { background: #b18e3a; box-shadow: 0 8px 0 #8c6d1a; }
        .card-quran { background: #69a9e2; box-shadow: 0 8px 0 #4a8dc7; }
        .card-aqidah { background: #96d6eb; box-shadow: 0 8px 0 #6eb6cc; }
        .card-fiqh { background: #33618d; box-shadow: 0 8px 0 #1e3d5c; }
        .card-seerah { background: #4b8a53; box-shadow: 0 8px 0 #36663c; }
        .card-rahbia { background: #8e4f81; box-shadow: 0 8px 0 #68365e; }
        .card-radio { background: #448048; box-shadow: 0 8px 0 #316034; }

        footer { text-align: center; padding: 30px; background: #e0f0f8; color: var(--primary); font-weight: bold; margin-top: 60px; }
    </style>
</head>
<body>

    <header class="site-header"><img src="images/logo.png.jpg" class="site-logo"></header>

    <nav class="main-nav">
        <a href="index.html" class="nav-btn-3d">الرئيسية</a>
        <a href="tafseer_index.html" class="nav-btn-3d">دروس التفسير</a>
        <a href="lessons.html" class="nav-btn-3d active">الصوتيات</a>
        <a href="khutbah.html" class="nav-btn-3d">الخطب</a>
    </nav>

    <div class="container">
        <h2 class="section-title">المكتبة الصوتية</h2>
        
        <div class="lessons-grid">
            <a href="hadith.html" class="lesson-card card-hadith">
                <i class="fas fa-mosque"></i>
                <span>شروح الحديث</span>
            </a>

            <a href="quran_sciences.html" class="lesson-card card-quran">
                <i class="fas fa-scroll"></i>
                <span>علوم القرآن</span>
            </a>

            <a href="aqidah.html" class="lesson-card card-aqidah">
                <i class="fas fa-heart"></i>
                <span>العقيدة والتوحيد</span>
            </a>

            <a href="fiqh.html" class="lesson-card card-fiqh">
                <i class="fas fa-gavel"></i>
                <span>الفقه وأصوله</span>
            </a>

            <a href="seerah.html" class="lesson-card card-seerah">
                <i class="fas fa-feather-pointed"></i>
                <span>السيرة النبوية</span>
            </a>

            <a href="faraid.html" class="lesson-card card-rahbia">
                <i class="fas fa-calculator"></i>
                <span>شرح الرحبية</span>
            </a>

            <a href="radio_programs.html" class="lesson-card card-radio">
                <i class="fas fa-radio"></i>
                <span>برامج إذاعية</span>
            </a>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

</body>
</html>
