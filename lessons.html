<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --light-sky: #eef5ff; 
            --bright-blue: #87ceeb; 
            --dark-blue: #2c5d87; 
            --pdf-red: #d9534f;
        }
        
        body { 
            margin: 0; 
            font-family: 'Cairo', sans-serif; 
            background: var(--light-sky); 
            direction: rtl; 
        }
        
        /* الهيدر */
        .site-header { 
            text-align: center; 
            padding: 60px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 5px solid white; 
        }
        .site-header h1 { margin: 0; font-size: 2rem; color: var(--dark-blue); font-weight: 900; }

        /* روابط التنقل */
        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        .nav-link { 
            padding: 10px 25px; 
            background: var(--dark-blue); 
            color: white; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: bold; 
            transition: 0.3s;
        }
        .nav-link:hover { opacity: 0.8; }
        
        /* شريط الأغلفة في الصفحة الرئيسية */
        .categories-grid { 
            display: flex; 
            flex-wrap: nowrap; 
            justify-content: flex-start; 
            gap: 20px; 
            max-width: 1200px; 
            margin: 40px auto; 
            padding: 20px; 
            overflow-x: auto; /* يسمح بالتمرير لليسار واليمين */
            scrollbar-width: thin;
        }
        
        .cat-card { 
            background: var(--bright-blue); 
            padding: 12px; 
            border-radius: 15px; 
            cursor: pointer; 
            border: 3px solid white; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.1); 
            transition: 0.3s; 
            min-width: 180px; 
            text-align: center;
            flex-shrink: 0;
        }
        
        .cat-card:hover { transform: translateY(-10px); background: #b0e2f5; }
        
        .cat-card img { 
            width: 100%; 
            height: 250px; 
            object-fit: cover; 
            border-radius: 10px; 
            margin-bottom: 12px;
            background: #fff;
        }
        
        .cat-card h3 { margin: 0; font-size: 1rem; color: var(--dark-blue); font-weight: 900; }

        /* عرض التفاصيل والدروس */
        #details-view { max-width: 800px; margin: 30px auto; padding: 20px; display: none; }
        .back-btn { 
            background: var(--dark-blue); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-bottom: 25px; 
            font-family: 'Cairo'; 
            font-weight: bold; 
        }
        
        .book-info-box { text-align: center; background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .book-main-cover { width: 200px; height: auto; border-radius: 10px; margin: 0 auto 15px; display: block; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .pdf-link { 
            display: inline-block; 
            background: var(--pdf-red); 
            color: white; 
            text-decoration: none; 
            padding: 12px 25px; 
            border-radius: 8px; 
            margin: 10px 0; 
            font-weight: bold; 
            transition: 0.3s;
        }
        .pdf-link:hover { background: #c9302c; }

        .lesson-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px; 
            background: white; 
            margin-bottom: 10px; 
            border-radius: 12px; 
            border-right: 6px solid var(--bright-blue); 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        audio { height: 35px; width: 240px; }

        @media (max-width: 600px) {
            .cat-card { min-width: 150px; }
            .cat-card img { height: 200px; }
            .lesson-item { flex-direction: column; text-align: center; }
            audio { width: 100%; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>المكتبة العلمية للشيخ سعيد مصطفى دياب</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="khutbah.html" class="nav-link">الخطب</a>
    <a href="lessons.html" class="nav-link" style="background:var(--bright-blue); color: var(--dark-blue);">الدروس</a>
</div>

<div id="main-view">
    <div class="categories-grid">
        
        <div class="cat-card" onclick="showSection('tafseer')">
            <img src="images/waqfat-tdaboria.jpg" alt="وقفات تدبرية">
            <h3>وقفات تدبرية</h3>
        </div>
        
        <div class="cat-card" onclick="showSection('slsapel')">
            <img src="images/alslsapel.jpg" alt="كتاب السلاسل">
            <h3>كتاب السلاسل</h3>
        </div>

        <div class="cat-card" onclick="showSection('tawheed')">
            <img src="images/tahawiya.jpg" alt="العقيدة الطحاوية">
            <h3>شرح الطحاوية</h3>
        </div>

        </div>
</div>

<div id="details-view">
    <button class="back-btn" onclick="hideSection()">← عودة لرف الكتب</button>
    
    <div id="book-info" class="book-info-box">
        </div>
    
    <div id="lessons-list">
        </div>
</div>

<script>
    // قاعدة بيانات الكتب والدروس
    const data = {
        tafseer: {
            title: "وقفات تدبرية",
            cover: "images/waqfat-tdaboria.jpg",
            pdf: "images/waqfat-tdaboria.pdf",
            lessons: Array.from({length: 5}, (_, i) => ({t: `الدرس ${i+1}`, f: `waqfat-${i+1}.mp3`}))
        },
        slsapel: {
            title: "كتاب السلاسل",
            cover: "images/alslsapel.jpg",
            pdf: "images/alslsapel.pdf",
            lessons: [
                {t: "الدرس الأول", f: "slsapel-1.mp3"},
                {t: "الدرس الثاني", f: "slsapel-2.mp3"},
                {t: "الدرس الثالث", f: "slsapel-3.mp3"}
            ]
        },
        tawheed: {
            title: "شرح العقيدة الطحاوية",
            cover: "images/tahawiya.jpg",
            lessons: Array.from({length: 10}, (_, i) => ({t: `الدرس ${i+1}`, f: `tahawiya-${i+1}.mp3`}))
        }
    };

    function showSection(key) {
        const book = data[key];
        if(!book) return;

        const infoDiv = document.getElementById('book-info');
        const listDiv = document.getElementById('lessons-list');
        
        // عرض معلومات الكتاب والـ PDF
        infoDiv.innerHTML = `
            <img src="${book.cover}" class="book-main-cover" onerror="this.src='https://via.placeholder.com/200x280?text=No+Cover'">
            <h2 style="color:var(--dark-blue); margin:10px 0;">${book.title}</h2>
            ${book.pdf ? `<a href="${book.pdf}" target="_blank" class="pdf-link">📄 تحميل الكتاب (PDF)</a>` : ""}
        `;

        // عرض قائمة الدروس الصوتية
        listDiv.innerHTML = book.lessons.map(l => `
            <div class="lesson-item">
                <span style="font-weight:bold; color:var(--dark-blue);">${l.t}</span>
                <audio controls preload="none">
                    <source src="audio/${l.f}" type="audio/mpeg">
                    متصفحك لا يدعم تشغيل الصوت.
                </audio>
            </div>
        `).join('');

        // التبديل بين الواجهات
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('details-view').style.display = 'block';
        window.scrollTo(0, 0); // العودة لأعلى الصفحة
    }

    function hideSection() {
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('details-view').style.display = 'none';
    }
</script>

</body>
</html>
