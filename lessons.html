<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الصوتية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #add8e6; --accent-blue: #5a9bd5; --dark-blue: #2c5d87;
            --gold-color: #c5a03d; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f4f7f9; color: #333; }

        /* الهيدر */
        .site-header { text-align: center; padding: 15px; background: var(--header-bg); border-bottom: 5px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; height: auto; mix-blend-mode: multiply; }

        /* شريط التنقل العلوي */
        .nav-bar { display: flex; justify-content: center; gap: 8px; padding: 15px; flex-wrap: wrap; background: #fff; border-bottom: 1px solid #eee; }
        .btn-small { 
            min-width: 120px; padding: 8px 15px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; 
            text-decoration: none; color: white; text-align: center; display: flex; align-items: center; 
            justify-content: center; gap: 6px; box-shadow: 0 4px 0 var(--dark-blue); transition: 0.2s; 
        }
        .btn-blue { background: linear-gradient(to bottom, #87ceeb, #5a9bd5); }
        .btn-gold { background: linear-gradient(to bottom, #d4af37, #b38f2d); box-shadow: 0 4px 0 #8c6d1a; }

        /* أزرار الأقسام - متوسطة وبدون رسومات */
        .categories-container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .cat-btn {
            background: var(--light-sky); color: var(--dark-blue); padding: 12px 25px; border-radius: 8px;
            cursor: pointer; font-weight: 800; font-size: 1.1rem; border: none;
            box-shadow: 0 4px 0 var(--accent-blue); transition: 0.2s;
        }
        .cat-btn.active { background: var(--gold-color); color: white; box-shadow: 0 4px 0 #8c6d1a; }

        /* الجدول */
        .content-container { max-width: 1200px; margin: 10px auto 60px; padding: 0 20px; }
        .section-box { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .lesson-table { width: 100%; border-collapse: collapse; }
        .lesson-table th { background: #f8f9fa; color: var(--dark-blue); padding: 15px; border-bottom: 2px solid #eee; }
        .lesson-table td { padding: 15px; border-bottom: 1px solid #f0f0f0; text-align: center; font-weight: bold; }
        
        .audio-player { width: 280px; height: 35px; }
        .btn-download { color: var(--dark-blue); font-size: 1.4rem; }

        footer { text-align: center; padding: 25px; background: #e0f2f7; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="btn-small btn-blue">الرئيسية</a>
        <a href="lessons.html" class="btn-small btn-gold">الصوتيات</a>
        <a href="khutbah.html" class="btn-small btn-blue">الخطب</a>
        <a href="books.html" class="btn-small btn-blue">الكتب</a>
        <a href="articles.html" class="btn-small btn-blue">المقالات</a>
    </nav>

    <div class="categories-container">
        <button class="cat-btn active" onclick="filterCat('all', this)">الكل</button>
        <button class="cat-btn" onclick="filterCat('tafseer', this)">دروس التفسير</button>
        <button class="cat-btn" onclick="filterCat('hadith', this)">شروح الحديث</button>
        <button class="cat-btn" onclick="filterCat('aqidah', this)">العقيدة</button>
        <button class="cat-btn" onclick="filterCat('fiqh', this)">الفقه</button>
        <button class="cat-btn" onclick="filterCat('seerah', this)">السيرة</button>
        <button class="cat-btn" onclick="filterCat('faraid', this)">شرح الرحبية</button>
    </div>

    <div class="content-container">
        <div class="section-box">
            <table class="lesson-table">
                <thead>
                    <tr>
                        <th width="40%">عنوان الدرس</th>
                        <th width="45%">الاستماع</th>
                        <th width="15%">تحميل</th>
                    </tr>
                </thead>
                <tbody id="lessons-body">
                    <script>
                        for(let i=1; i<=11; i++){
                            document.write(`
                                <tr data-category="faraid">
                                    <td style="color:var(--gold-color)">شرح الرحبية - الدرس ${i}</td>
                                    <td><audio controls class="audio-player"><source src="audio/faraid-${i}.mp3" type="audio/mpeg"></audio></td>
                                    <td><a href="audio/faraid-${i}.mp3" download class="btn-download"><i class="fas fa-cloud-download-alt"></i></a></td>
                                </tr>
                            `);
                        }
                    </script>
                    <tr data-category="tafseer">
                        <td>تفسير سورة الفاتحة</td>
                        <td><audio controls class="audio-player"><source src="audio/tafseer-1.mp3" type="audio/mpeg"></audio></td>
                        <td><a href="audio/tafseer-1.mp3" download class="btn-download"><i class="fas fa-cloud-download-alt"></i></a></td>
                    </tr>
                    <tr data-category="fiqh">
                        <td>شرح كتاب الطهارة</td>
                        <td><audio controls class="audio-player"><source src="audio/fiqh-1.mp3" type="audio/mpeg"></audio></td>
                        <td><a href="audio/fiqh-1.mp3" download class="btn-download"><i class="fas fa-cloud-download-alt"></i></a></td>
                    </tr>
                    <tr data-category="aqidah">
                        <td>شرح الأصول الثلاثة</td>
                        <td><audio controls class="audio-player"><source src="audio/aqidah-1.mp3" type="audio/mpeg"></audio></td>
                        <td><a href="audio/aqidah-1.mp3" download class="btn-download"><i class="fas fa-cloud-download-alt"></i></a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        function filterCat(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const rows = document.querySelectorAll('#lessons-body tr');
            rows.forEach(row => {
                if (category === 'all' || row.getAttribute('data-category') === category) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
