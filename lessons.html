<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --accent-blue: #87ceeb; --dark-blue: #2c5d87; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        .site-header { text-align: center; padding: 40px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 4px solid white; }
        
        /* توحيد الأيقونات في الأقسام */
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; padding: 20px; }
        .cat-card { background: white; padding: 20px; border-radius: 15px; display: flex; align-items: center; cursor: pointer; border-right: 6px solid var(--accent-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
        .cat-card:hover { transform: translateY(-5px); background: #f0f7ff; }
        
        /* دائرة الأيقونة الموحدة */
        .icon-circle { 
            width: 60px; height: 60px; background: var(--light-sky); 
            border-radius: 50%; display: flex; justify-content: center; 
            align-items: center; margin-left: 15px; flex-shrink: 0;
        }
        .cat-card i { font-size: 1.8rem; color: var(--dark-blue); }
        .cat-card h3 { margin: 0; font-size: 1.3rem; color: var(--dark-blue); font-weight: 700; }

        /* منطقة الدروس */
        #details-section { max-width: 900px; margin: 30px auto; padding: 20px; display: none; }
        .lesson-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border-right: 5px solid var(--dark-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .lesson-title { font-weight: bold; color: var(--dark-blue); flex: 1; margin-left: 10px; }
        audio { height: 35px; width: 250px; }
        .back-btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-bottom: 20px; font-family: 'Cairo'; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>الدروس العلمية - الشيخ سعيد مصطفى دياب</h1>
</header>

<div id="categories-view">
    <div class="categories-grid">
        <div class="cat-card" onclick="showLessons('tawheed')"><div class="icon-circle"><i class="fas fa-shield-halved"></i></div><h3>العقيدة</h3></div>
        <div class="cat-card" onclick="showLessons('hadith')"><div class="icon-circle"><i class="fas fa-scroll"></i></div><h3>شرح الحديث</h3></div>
        <div class="cat-card" onclick="showLessons('faraid')"><div class="icon-circle"><i class="fas fa-calculator"></i></div><h3>الفرائض</h3></div>
        <div class="cat-card"><div class="icon-circle"><i class="fas fa-book-open"></i></div><h3>التفسير</h3></div>
        <div class="cat-card"><div class="icon-circle"><i class="fas fa-quran"></i></div><h3>علوم القرآن</h3></div>
        <div class="cat-card"><div class="icon-circle"><i class="fas fa-gavel"></i></div><h3>الفقه</h3></div>
        <div class="cat-card"><div class="icon-circle"><i class="fas fa-mosque"></i></div><h3>السيرة</h3></div>
        <div class="cat-card"><div class="icon-circle"><i class="fas fa-heart"></i></div><h3>الرقائق</h3></div>
    </div>
</div>

<div id="details-section">
    <button class="back-btn" onclick="hideLessons()"><i class="fas fa-arrow-right"></i> عودة للأقسام</button>
    <h2 id="section-title" style="color: var(--dark-blue); margin-bottom: 20px;"></h2>
    <div id="lessons-list"></div>
</div>

<script>
    const data = {
        hadith: { title: "شرح رياض الصالحين", folder: "hadith", list: Array.from({length: 30}, (_, i) => ({ title: `رياض الصالحين - الدرس ${i+1}`, file: `reyad-${i+1}.mp3` })) },
        tawheed: { title: "شرح كتاب التوحيد", folder: "tawheed", list: Array.from({length: 30}, (_, i) => ({ title: `كتاب التوحيد - الدرس ${i+1}`, file: `tawheed-${i+1}.mp3` })) },
        faraid: { title: "شرح المنظومة الرحبية", folder: "faraid", list: Array.from({length: 11}, (_, i) => ({ title: `المنظومة الرحبية - الدرس ${i+1}`, file: `al-rhapih${i+1}.mp3` })) }
    };

    function showLessons(key) {
        const section = data[key];
        if (!section) { alert("سيتم إضافة دروس هذا القسم قريباً"); return; }
        document.getElementById('categories-view').style.display = 'none';
        document.getElementById('details-section').style.display = 'block';
        document.getElementById('section-title').innerText = section.title;
        const listContainer = document.getElementById('lessons-list');
        listContainer.innerHTML = section.list.map(l => `
            <div class="lesson-item">
                <span class="lesson-title">${l.title}</span>
                <audio controls preload="none">
                    <source src="audio/${section.folder}/${l.file}" type="audio/mpeg">
                </audio>
            </div>
        `).join('');
    }

    function hideLessons() {
        document.getElementById('categories-view').style.display = 'block';
        document.getElementById('details-section').style.display = 'none';
    }
</script>
</body>
</html>
