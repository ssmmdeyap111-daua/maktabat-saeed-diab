<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس التفسير - الشيخ سعيد مصطفى دياب الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; --shadow-color: #5da0bc; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        
        .site-header { 
            text-align: center; padding: 50px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 6px solid white;
        }
        .site-header h1 { margin: 0; font-family: 'Reem Kufi', sans-serif; font-size: 2.5rem; color: var(--dark-blue); }
        
        .nav-bar { display: flex; justify-content: center; padding: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-3d { 
            padding: 12px 25px; background: white; border-radius: 15px;
            text-decoration: none; color: var(--dark-blue); font-weight: bold;
            box-shadow: 0 5px 0 var(--shadow-color); transition: 0.1s;
        }
        .active-btn { background: var(--bright-blue); color: white; box-shadow: 0 5px 0 var(--dark-blue); }

        .container { max-width: 1000px; margin: 20px auto; padding: 15px; }
        
        /* تصميم الأقسام (السور) */
        .surah-section { 
            background: white; border-radius: 20px; padding: 20px; margin-bottom: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-top: 5px solid var(--dark-blue);
        }
        .surah-title { 
            color: var(--dark-blue); font-size: 1.5rem; font-weight: 900; 
            margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
            border-bottom: 2px solid var(--light-sky); padding-bottom: 10px;
        }

        .lessons-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; 
        }
        .lesson-card {
            background: #f9fbfd; border: 1px solid #e0eaf3; padding: 15px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .lesson-card h4 { margin: 0; color: #444; font-size: 1rem; }
        audio { height: 30px; width: 180px; }
        .dl-icon { color: #27ae60; font-size: 1.2rem; text-decoration: none; }

        @media (max-width: 600px) {
            .lessons-grid { grid-template-columns: 1fr; }
            audio { width: 140px; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>سلاسل دروس التفسير</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-3d">الرئيسية</a>
    <a href="books.html" class="btn-3d">المكتبة</a>
    <a href="lessons.html" class="btn-3d active-btn">الدروس</a>
    <a href="khutbah.html" class="btn-3d">الخطب</a>
</div>

<div class="container">

    <div class="surah-section">
        <div class="surah-title"><i class="fas fa-book-open"></i> تفسير سورة البقرة (75 درساً)</div>
        <div class="lessons-grid" id="baqarah-list"></div>
    </div>

    <div class="surah-section">
        <div class="surah-title"><i class="fas fa-book-open"></i> تفسير سورة آل عمران (52 درساً)</div>
        <div class="lessons-grid" id="imran-list"></div>
    </div>

    <div class="surah-section">
        <div class="surah-title"><i class="fas fa-book-open"></i> تفسير سورة النساء (53 درساً)</div>
        <div class="lessons-grid" id="nisa-list"></div>
    </div>

    <div class="surah-section">
        <div class="surah-title"><i class="fas fa-book-open"></i> تفسير سورة المائدة (34 درساً)</div>
        <div class="lessons-grid" id="maidah-list"></div>
    </div>

</div>

<script>
    function generateLessons(containerId, prefix, count) {
        const container = document.getElementById(containerId);
        let html = '';
        for (let i = 1; i <= count; i++) {
            let num = i < 10 ? '0' + i : i;
            html += `
            <div class="lesson-card">
                <h4>الدرس ${num}</h4>
                <audio controls preload="none">
                    <source src="audio/tafseer/${prefix}-${num}.mp3" type="audio/mpeg">
                </audio>
                <a href="audio/tafseer/${prefix}-${num}.mp3" download class="dl-icon"><i class="fas fa-download"></i></a>
            </div>`;
        }
        container.innerHTML = html;
    }

    // توليد الدروس تلقائياً بناءً على الأعداد المطلوبة
    generateLessons('baqarah-list', 'baqarah', 75);
    generateLessons('imran-list', 'imran', 52);
    generateLessons('nisa-list', 'nisa', 53);
    generateLessons('maidah-list', 'maidah', 34);
</script>

</body>
</html>
