<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; --gold: #d4af37; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); }
        .site-header { text-align: center; padding: 40px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-family: 'Reem Kufi', sans-serif; color: var(--dark-blue); }
        .container { max-width: 1100px; margin: 20px auto; padding: 15px; }
        .section-box { background: white; border-radius: 15px; padding: 25px; margin-bottom: 30px; border-right: 8px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section-title { color: var(--dark-blue); font-family: 'Reem Kufi', sans-serif; font-size: 1.6rem; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .lesson-card { background: #f8f9fa; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        audio { height: 30px; width: 150px; }
        .download-btn { color: #27ae60; text-decoration: none; font-size: 1.2rem; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>المكتبة الصوتية الشاملة</h1>
</header>

<div class="container">
    <div class="section-box">
        <h2 class="section-title"><i class="fas fa-mosque"></i> دروس العقيدة والتوحيد</h2>
        <div class="lessons-grid">
            <div class="lesson-card"><span>شرح العقيدة الطحاوية</span><audio controls><source src="audio/tahawiya.mp3"></audio></div>
            <div class="lesson-card"><span>شرح العقيدة الواسطية</span><audio controls><source src="audio/wasitiya.mp3"></audio></div>
            <div class="lesson-card"><span>شرح كتاب التوحيد</span><audio controls><source src="audio/tawheed.mp3"></audio></div>
        </div>
    </div>

    <div class="section-box">
        <h2 class="section-title"><i class="fas fa-gavel"></i> دروس الفقه</h2>
        <div class="lessons-grid">
            <div class="lesson-card"><span>شرح منار السبيل</span><audio controls><source src="audio/manar.mp3"></audio></div>
            <div class="lesson-card"><span>أحكام العبادات</span><audio controls><source src="audio/fiqh-general.mp3"></audio></div>
        </div>
    </div>

    <div class="section-box">
        <h2 class="section-title"><i class="fas fa-scroll"></i> شروح الحديث</h2>
        <div class="lessons-grid">
            <div class="lesson-card"><span>شرح رياض الصالحين</span><audio controls><source src="audio/riyadh.mp3"></audio></div>
            <div class="lesson-card"><span>شرح الأربعين النووية</span><audio controls><source src="audio/nawawi.mp3"></audio></div>
        </div>
    </div>

    <div class="section-box">
        <h2 class="section-title"><i class="fas fa-heart"></i> الرقائق والمواعظ</h2>
        <div class="lessons-grid">
            <div class="lesson-card"><span>أعمال القلوب</span><audio controls><source src="audio/hearts.mp3"></audio></div>
            <div class="lesson-card"><span>الاستعداد للآخرة</span><audio controls><source src="audio/akhirah.mp3"></audio></div>
        </div>
    </div>
</div>

</body>
</html>
