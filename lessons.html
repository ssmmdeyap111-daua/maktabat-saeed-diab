<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --light-blue: #add8e6; 
            --dark-blue: #2c5d87; 
            --bg-color: #f8fbff;
        }

        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-color); color: #333; 
        }

        /* تنسيق العناوين الجديد */
        .site-header { 
            text-align: center; padding: 30px 20px; 
            background-color: var(--light-blue); 
            color: var(--dark-blue);
            border-bottom: 5px solid #fff;
        }
        .site-header h1 { 
            margin: 0; 
            font-size: 2.0rem; /* الحجم المطلوب */
            font-weight: 900; 
        }
        .site-header p { 
            margin: 5px 0 0; 
            font-size: 1.5rem; /* أكبر من السابق وأصغر من 2.0rem */
            font-weight: bold; 
            opacity: 0.9;
        }

        .container { max-width: 1200px; margin: auto; padding: 20px; padding-bottom: 120px; }

        /* شريط الأقسام */
        .category-grid { 
            display: flex; justify-content: center; gap: 12px; 
            flex-wrap: wrap; margin-bottom: 30px; 
        }

        /* تصميم ثلاثي الأبعاد للأزرار */
        .cat-card {
            background: var(--light-blue);
            padding: 12px 20px; border-radius: 12px; cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            font-weight: bold; color: var(--dark-blue); transition: 0.2s;
            min-width: 100px; text-align: center;
            box-shadow: 0 6px 0 #87b8c9;
            position: relative;
        }
        .cat-card:active { transform: translateY(4px); box-shadow: 0 2px 0 #87b8c9; }
        .cat-card.active { background: var(--dark-blue); color: white; box-shadow: 0 4px 0 #1a3a5a; }

        /* القائمة المنسدلة للتفسير */
        .dropdown-content {
            display: none;
            width: 100%;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            background: #eef6f9;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed var(--dark-blue);
        }
        .sub-cat-card {
            padding: 8px 15px; background: white; border-radius: 5px;
            cursor: pointer; font-size: 14px; border: 1px solid var(--light-blue);
        }

        /* زر الرئيسية العائم (ثلاثي الأبعاد بدون صورة) */
        .fixed-home-btn {
            position: fixed; bottom: 30px; right: 30px;
            background: var(--light-blue); color: var(--dark-blue);
            padding: 15px 25px; border-radius: 12px;
            text-decoration: none; font-weight: bold;
            box-shadow: 0 6px 0 #87b8c9;
            z-index: 1000; transition: 0.2s;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .fixed-home-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #87b8c9; }

        .lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .lesson-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid var(--light-blue); }
        audio { width: 100%; margin-top: 15px; }
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn { flex: 1; text-align: center; padding: 8px; text-decoration: none; border-radius: 5px; font-size: 13px; font-weight: bold; }
        .play-btn { background: var(--light-blue); color: var(--dark-blue); }
    </style>
</head>
<body>

<a href="index.html" class="fixed-home-btn">🏠 الرئيسية</a>

<header class="site-header">
    <h1>موقع الشيخ سعيد مصطفى دياب</h1>
    <p>المكتبة الصوتية</p>
</header>

<div class="container">
    <div class="category-grid">
        <div class="cat-card active" onclick="filterMain('حديث', this)">الأحاديث</div>
        <div class="cat-card" id="tafseerBtn" onclick="toggleDropdown()">التفسير ▾</div>
        <div class="cat-card" onclick="filterMain('فقه', this)">الفقه</div>
        <div class="cat-card" onclick="filterMain('سيرة', this)">السيرة</div>
        <div class="cat-card" onclick="filterMain('رقائق', this)">الرقائق</div>
        <div class="cat-card" onclick="filterMain('فرائض', this)">الفرائض</div>
    </div>

    <div id="tafseerDropdown" class="dropdown-content">
        <div class="sub-cat-card" onclick="filterSub('تفسير', 'سورة الفاتحة')">سورة الفاتحة</div>
        <div class="sub-cat-card" onclick="filterSub('تفسير', 'سورة البقرة')">سورة البقرة</div>
        <div class="sub-cat-card" onclick="filterSub('تفسير', 'جزء عم')">جزء عم</div>
    </div>

    <div class="lessons-grid" id="list"></div>
</div>

<script src="tafseerData.js"></script>
<script src="faraidData.js"></script>
<script src="hadithData.js"></script>

<script>
    let allData = [];

    function init() {
        allData = [];
        // دمج البيانات من الملفات الخارجية
        try { if(typeof hadithData !== 'undefined') hadithData.forEach(i => allData.push({...i, cat:'حديث'})); } catch(e){}
        try { if(typeof tafseerData !== 'undefined') tafseerData.forEach(i => allData.push({...i, cat:'تفسير'})); } catch(e){}
        try { if(typeof faraidLessons !== 'undefined') faraidLessons.forEach(i => allData.push({...i, cat:'فرائض'})); } catch(e){}

        render(allData.filter(i => i.cat === 'حديث'));
    }

    function toggleDropdown() {
        const drop = document.getElementById('tafseerDropdown');
        drop.style.display = (drop.style.display === 'flex') ? 'none' : 'flex';
        filterMain('تفسير', document.getElementById('tafseerBtn'));
    }

    function filterMain(cat, btn) {
        document.querySelectorAll('.cat-card').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (cat !== 'تفسير') document.getElementById('tafseerDropdown').style.display = 'none';
        render(allData.filter(i => i.cat === cat));
    }

    function filterSub(cat, subName) {
        // يمكنك هنا فلترة الدروس بناءً على كلمة في العنوان
        render(allData.filter(i => i.cat === cat && i.title.includes(subName)));
    }

    function render(items) {
        const list = document.getElementById("list");
        list.innerHTML = items.length === 0 ? "<p style='grid-column:1/-1; text-align:center; padding:50px;'>قريباً إن شاء الله..</p>" : "";
        items.forEach(item => {
            let path = "audio/" + item.file.trim();
            list.innerHTML += `
                <div class="lesson-card">
                    <small>📂 ${item.cat}</small>
                    <h3>${item.title}</h3>
                    <audio controls preload="none"><source src="${path}" type="audio/mpeg"></audio>
                    <div class="btn-group">
                        <a href="${path}" download class="btn" style="background:#f0f4f8;">تحميل</a>
                        <a href="${path}" target="_blank" class="btn play-btn">تشغيل مباشر</a>
                    </div>
                </div>`;
        });
    }

    window.onload = init;
</script>
</body>
</html>
