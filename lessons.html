<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة العلمية - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* الألوان المتوافقة مع الصفحة الرئيسية */
        :root { 
            --main-color: #2c5d87; /* الأزرق الغامق */
            --light-bg: #f4f7f9;
            --accent-color: #add8e6; /* الأزرق السماوي */
        }

        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background-color: var(--light-bg); color: #333; 
        }

        /* الهيدر بنفس نمط الصفحة الرئيسية */
        .site-header { 
            text-align: center; padding: 30px 20px; 
            background-color: var(--main-color); 
            color: white; border-bottom: 5px solid var(--accent-color);
        }
        .site-header h1 { margin: 0; font-size: 1.8rem; }
        .site-header p { margin: 10px 0 0; opacity: 0.9; font-size: 1rem; }

        .container { max-width: 1200px; margin: auto; padding: 20px; }

        /* شريط الأقسام (الأيقونات) */
        .category-grid { 
            display: flex; justify-content: center; gap: 8px; 
            flex-wrap: wrap; margin-bottom: 30px; 
        }
        .cat-card {
            background: white; padding: 10px 15px; border-radius: 8px; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid #ddd; 
            font-weight: bold; color: var(--main-color); transition: 0.3s;
            min-width: 80px; text-align: center; font-size: 14px;
        }
        .cat-card:hover { background: #eef6fc; }
        .cat-card.active { 
            background: var(--main-color); color: white; 
            border-color: var(--main-color); box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* شبكة الدروس */
        .lessons-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
        }
        .lesson-card { 
            background: white; padding: 20px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border-top: 5px solid var(--main-color);
            display: flex; flex-direction: column; transition: transform 0.2s;
        }
        .lesson-card:hover { transform: translateY(-5px); }
        .lesson-card small { color: #7f8c8d; font-weight: bold; display: block; margin-bottom: 5px; }
        .lesson-card h3 { margin: 0 0 15px 0; font-size: 1.1rem; color: #2c3e50; min-height: 3em; line-height: 1.4; }
        
        audio { width: 100%; height: 35px; margin-top: auto; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn {
            flex: 1; text-align: center; padding: 10px;
            text-decoration: none; border-radius: 6px; 
            font-size: 13px; font-weight: bold; transition: 0.3s;
        }
        .download-btn { background: #f8f9fa; color: #333; border: 1px solid #ccc; }
        .play-btn { background: var(--main-color); color: white; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

<header class="site-header">
    <h1>المكتبة العلمية الصوتية</h1>
    <p>فضيلة الشيخ سعيد مصطفى دياب</p>
</header>

<div class="container">
    <div class="category-grid">
        <div class="cat-card active" onclick="filterMain('all', this)">الكل</div>
        <div class="cat-card" onclick="filterMain('حديث', this)">الأحاديث</div>
        <div class="cat-card" onclick="filterMain('تفسير', this)">التفسير</div>
        <div class="cat-card" onclick="filterMain('فقه', this)">الفقه</div>
        <div class="cat-card" onclick="filterMain('سيرة', this)">السيرة</div>
        <div class="cat-card" onclick="filterMain('رقائق', this)">الرقائق</div>
        <div class="cat-card" onclick="filterMain('فرائض', this)">الفرائض</div>
    </div>

    <div class="lessons-grid" id="list"></div>
</div>

<script>
    // مصفوفة البيانات (أضف دروسك هنا تحت كل قسم)
    const allData = [
        // قسم الأحاديث
        { title: "شرح رياض الصالحين - الدرس 1", file: "reyad-1.mp3", cat: "حديث" },
        { title: "شرح رياض الصالحين - الدرس 2", file: "reyad-2.mp3", cat: "حديث" },
        
        // قسم التفسير
        { title: "تفسير سورة الفاتحة", file: "fateha.mp3", cat: "تفسير" },
        
        // قسم الفقه (مثال)
        { title: "كتاب الطهارة - الدرس 1", file: "fiqh-1.mp3", cat: "فقه" },

        // قسم السيرة (مثال)
        { title: "السيرة النبوية - مقدمة", file: "seerah-1.mp3", cat: "سيرة" },

        // قسم الرقائق (مثال)
        { title: "أعمال القلوب", file: "rakaek-1.mp3", cat: "رقائق" },

        // قسم الفرائض (مثال)
        { title: "علم المواريث - مقدمة", file: "faraid-1.mp3", cat: "فرائض" }
    ];

    function render(items) {
        const list = document.getElementById("list");
        list.innerHTML = "";
        
        if (items.length === 0) {
            list.innerHTML = "<p style='grid-column:1/-1; text-align:center; padding:50px;'>قريباً إن شاء الله..</p>";
            return;
        }

        items.forEach(item => {
            let path = "audio/" + item.file.trim();
            list.innerHTML += `
                <div class="lesson-card">
                    <small>📂 قسم ${item.cat}</small>
                    <h3>${item.title}</h3>
                    <audio controls preload="none">
                        <source src="${path}" type="audio/mpeg">
                    </audio>
                    <div class="btn-group">
                        <a href="${path}" download class="btn download-btn">📥 تحميل</a>
                        <a href="${path}" target="_blank" class="btn play-btn">▶️ تشغيل مستقل</a>
                    </div>
                </div>`;
        });
    }

    function filterMain(cat, btn) {
        document.querySelectorAll('.cat-card').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        if (cat === 'all') {
            render(allData);
        } else {
            const filtered = allData.filter(i => i.cat === cat);
            render(filtered);
        }
    }

    window.onload = function() {
        render(allData);
    };
</script>

</body>
</html>
