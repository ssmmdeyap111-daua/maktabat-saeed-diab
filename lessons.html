<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصوتيات - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #eef5ff; 
            --accent-blue: #87ceeb; 
            --dark-blue: #2c5d87;
            --gold-color: #d4af37;
            --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { 
            margin: 0; font-family: 'Cairo', sans-serif; 
            background: linear-gradient(to bottom, var(--light-sky), #d0e4ff);
            min-height: 100vh;
        }

        /* الهيدر الموحد */
        .site-header { 
            text-align: center; padding: 20px; 
            background: var(--header-bg); border-bottom: 4px solid #fff; 
        }
        .site-logo {
            max-width: 450px; width: 100%; height: auto;
            mix-blend-mode: multiply;
        }

        /* شريط التنقل العلوي 3D */
        .nav-bar { 
            display: flex; justify-content: center; gap: 15px; padding: 20px; 
            flex-wrap: wrap; background: rgba(255,255,255,0.3); 
        }
        .nav-link-3d { 
            padding: 10px 18px; background: var(--accent-blue); color: white; text-decoration: none; 
            border-radius: 12px; font-weight: bold; min-width: 110px; text-align: center;
            box-shadow: 0 5px 0 var(--dark-blue); transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .nav-link-3d:hover { transform: translateY(-2px); background: #9cdfff; }
        .active-link { background: var(--gold-color); box-shadow: 0 5px 0 #b38f2d; }

        /* عنوان الصفحة والبحث */
        .page-info { text-align: center; padding: 20px; }
        .page-title { color: var(--dark-blue); font-size: 2.5rem; font-weight: 900; margin: 10px 0; }
        .search-wrapper { margin: 10px auto; max-width: 700px; }
        .search-input { 
            width: 100%; padding: 15px 25px; border-radius: 50px; 
            border: 2px solid var(--accent-blue); outline: none; 
            font-family: 'Cairo'; font-size: 1.1rem;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        /* حاوية الأقسام المحدثة */
        .categories-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
            flex-wrap: wrap; /* للسماح بالالتفاف في الشاشات الصغيرة */
            max-width: 1400px;
            margin: 0 auto 50px;
        }

        /* البطاقة الكبيرة الجديدة */
        .category-card-3d { 
            flex: 0 1 240px; /* زيادة العرض */
            min-height: 160px; /* زيادة الارتفاع */
            background: white; 
            padding: 25px 15px; 
            border-radius: 20px; 
            text-align: center; 
            text-decoration: none; 
            color: var(--dark-blue); 
            transition: 0.3s; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            box-shadow: 0 10px 0 var(--accent-blue);
            border: 2px solid var(--accent-blue);
            gap: 15px;
        }
        
        .category-card-3d i {
            font-size: 3rem; /* تكبير الأيقونة */
            color: var(--gold-color);
        }

        .category-card-3d:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 15px 0 var(--dark-blue); 
            border-color: var(--dark-blue);
        }

        .category-card-3d h3 { 
            margin: 0; font-size: 1.3rem; font-weight: 900; line-height: 1.4;
        }
        
        footer { text-align: center; padding: 30px; color: var(--dark-blue); font-weight: bold; border-top: 4px solid #fff; background: var(--header-bg); }

        @media (max-width: 768px) {
            .category-card-3d { flex: 0 1 45%; } /* بطاقتين في الصف في الجوال */
            .page-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="المخطوطة الشريفة" class="site-logo">
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="nav-link-3d"><i class="fas fa-home"></i>الرئيسية</a>
        <a href="lessons.html" class="nav-link-3d active-link"><i class="fas fa-microphone"></i>الصوتيات</a>
        <a href="khutbah.html" class="nav-link-3d"><i class="fas fa-bullhorn"></i>الخطب</a>
        <a href="books.html" class="nav-link-3d"><i class="fas fa-book"></i>الكتب</a>
    </nav>

    <div class="page-info">
        <h2 class="page-title">الصوتيات</h2>
        <div class="search-wrapper">
            <input type="text" class="search-input" placeholder="ابحث عن موضوع أو سلسلة صوتية...">
        </div>
    </div>

    <div class="categories-container">
        <a href="tafseer_index.html" class="category-card-3d">
            <i class="fas fa-quran"></i>
            <h3>تفسير القرآن الكريم</h3>
        </a>

        <a href="hadith.html" class="category-card-3d">
            <i class="fas fa-book-open-reader"></i>
            <h3>شروح الحديث الشريف</h3>
        </a>

        <a href="aqidah.html" class="category-card-3d">
            <i class="fas fa-star-and-crescent"></i>
            <h3>العقيدة والتوحيد</h3>
        </a>

        <a href="raqaeq.html" class="category-card-3d">
            <i class="fas fa-heart"></i>
            <h3>الرقائق والزهد</h3>
        </a>

        <a href="fiqh.html" class="category-card-3d">
            <i class="fas fa-gavel"></i>
            <h3>الفقه وأصوله</h3>
        </a>

        <a href="seerah.html" class="category-card-3d">
            <i class="fas fa-mosque"></i>
            <h3>السيرة النبوية</h3>
        </a>

        <a href="articles.html" class="category-card-3d" style="border-color: var(--gold-color); box-shadow: 0 10px 0 #b38f2d;">
            <i class="fas fa-pen-nib" style="color: var(--dark-blue);"></i>
            <h3>المقالات</h3>
        </a>
    </div>

    <footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

</body>
</html>
