<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس الشيخ سعيد مصطفى دياب الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; --gold: #d4af37; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); }
        .site-header { text-align: center; padding: 40px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-family: 'Reem Kufi', sans-serif; color: var(--dark-blue); font-size: 2.5rem; }
        
        .container { max-width: 1000px; margin: 30px auto; padding: 15px; }

        /* شبكة الأيقونات */
        .icons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .science-card { 
            background: white; padding: 25px; border-radius: 20px; text-align: center; 
            cursor: pointer; transition: 0.3s; box-shadow: 0 5px 0 #5da0bc; border: 1px solid #eef;
        }
        .science-card:hover { transform: translateY(-5px); background: #f0faff; }
        .science-card i { font-size: 3rem; color: var(--gold); margin-bottom: 10px; display: block; }
        .science-card span { font-weight: 900; color: var(--dark-blue); font-size: 1.1rem; }

        /* نظام القوائم المنسدلة */
        .dropdown-content { display: none; background: white; border-radius: 15px; padding: 20px; margin-top: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 5px solid var(--gold); }
        .active-content { display: block; animation: fadeIn 0.5s; }

        .series-title { background: var(--light-sky); padding: 10px 15px; border-radius: 8px; color: var(--dark-blue); font-weight: bold; margin: 15px 0 10px; border-right: 4px solid var(--dark-blue); }
        .lessons-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
        .lesson-item { background: #f9fbfd; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        audio { height: 28px; width: 140px; }
        .dl { color: #27ae60; font-size: 1.1rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="site-header">
    <h1>المكتبة الصوتية المنظمة</h1>
</header>

<div class="container">
    <div class="icons-grid">
        <div class="science-card" onclick="showContent('quran-sci')"><i class="fas fa-microscope"></i><span>علوم القرآن</span></div>
        <div class="science-card" onclick="showContent('tafseer-sci')"><i class="fas fa-book-quran"></i><span>التفسير</span></div>
        <div class="science-card" onclick="showContent('hadith-sci')"><i class="fas fa-scroll"></i><span>شروح الحديث</span></div>
        <div class="science-card" onclick="showContent('fiqh-sci')"><i class="fas fa-gavel"></i><span>الفقه</span></div>
        <div class="science-card" onclick="showContent('faraid-sci')"><i class="fas fa-divide"></i><span>الفرائض</span></div>
        <div class="science-card" onclick="showContent('seerah-sci')"><i class="fas fa-history"></i><span>السيرة</span></div>
        <div class="science-card" onclick="showContent('zuhd-sci')"><i class="fas fa-heart"></i><span>الرقائق</span></div>
    </div>

    <div id="quran-sci" class="dropdown-content">
        <div class="series-title">مقدمة في أصول التفسير (27 درساً)</div>
        <div class="lessons-list" id="osol-list"></div>
        <div class="series-title">الناسخ والمنسوخ (10 دروس)</div>
        <div class="lessons-grid" id="nasikh-list"></div>
    </div>

    <div id="tafseer-sci" class="dropdown-content">
        <div class="series-title">تفسير سورة البقرة (75 درساً)</div>
        <div class="lessons-list" id="baqarah-list"></div>
        <div class="series-title">تفسير سورة آل عمران (52 درساً)</div>
        <div class="lessons-list" id="imran-list"></div>
    </div>

    <div id="fiqh-sci" class="dropdown-content">
        <div class="series-title">أخصر المختصرات (26 درساً)</div>
        <div class="lessons-list" id="akhasar-list"></div>
    </div>

    <div id="faraid-sci" class="dropdown-content">
        <div class="series-title">شرح متن الرحبية (11 درساً)</div>
        <div class="lessons-list" id="rahbiya-list"></div>
    </div>

    </div>

<script>
    function showContent(id) {
        // إخفاء كافة القوائم أولاً
        document.querySelectorAll('.dropdown-content').forEach(el => el.classList.remove('active-content'));
        // إظهار القائمة المختارة
        document.getElementById(id).classList.add('active-content');
    }

    function generate(id, prefix, count) {
        const container = document.getElementById(id);
        if(!container) return;
        let html = '';
        for (let i = 1; i <= count; i++) {
            html += `<div class="lesson-item"><span>درس ${i}</span><audio controls preload="none"><source src="audio/${prefix}-${i}.mp3"></audio><a href="audio/${prefix}-${i}.mp3" download class="dl"><i class="fas fa-download"></i></a></div>`;
        }
        container.innerHTML = html;
    }

    // توليد الدروس بناءً على أسماء الملفات التي ذكرتها
    generate('akhasar-list', 'akhasar', 26);
    generate('baqarah-list', 'baqarah', 75);
    generate('imran-list', 'imran', 52);
    generate('osol-list', 'osol-tafseer', 27);
    generate('nasikh-list', 'nasikh', 10);
    generate('rahbiya-list', 'rahbiya', 11);
</script>

</body>
</html>
