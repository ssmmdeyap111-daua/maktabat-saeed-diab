<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس العلمية للشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --light-sky: #eef5ff; --bright-blue: #87ceeb; --dark-blue: #2c5d87; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); direction: rtl; }
        
        .site-header { text-align: center; padding: 80px 20px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 5px solid white; }
        .site-header h1 { margin: 0; font-size: 2.2rem; color: var(--dark-blue); font-weight: 900; }

        .nav-bar { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        .nav-link { padding: 10px 25px; background: var(--dark-blue); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
        
        .categories-grid { display: flex; flex-wrap: nowrap; justify-content: center; gap: 12px; max-width: 1400px; margin: 30px auto; padding: 15px; overflow-x: auto; }
        .cat-card { background: var(--bright-blue); padding: 20px 10px; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; min-width: 130px; flex: 1; }
        .cat-card:hover { transform: translateY(-5px); background: #b0e2f5; }
        .cat-card h3 { margin: 0; font-size: 1rem; color: var(--dark-blue); font-weight: 900; white-space: nowrap; }

        #details-view { max-width: 900px; margin: 20px auto; padding: 20px; display: none; }
        .back-btn { background: var(--dark-blue); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-family: 'Cairo'; font-weight: bold; }
        
        .item-wrapper { background: white; margin-bottom: 10px; border-radius: 10px; overflow: hidden; border-right: 5px solid var(--bright-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item-header { background: #f8fbff; padding: 15px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; color: var(--dark-blue); }
        .item-content { display: none; padding: 15px; background: #fff; border-top: 1px solid #eee; text-align: center; }
        
        /* تنسيق غلاف الكتاب */
        .book-cover { width: 180px; height: auto; border-radius: 8px; margin: 0 auto 20px auto; display: block; box-shadow: 0 5px 15px rgba(0,0,0,0.15); border: 1px solid #ddd; }

        .lessons-container { text-align: right; }
        .lesson-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f5f5f5; flex-wrap: wrap; gap: 10px; }
        audio { height: 35px; width: 220px; }

        @media (max-width: 900px) { .categories-grid { justify-content: flex-start; } .site-header h1 { font-size: 1.6rem; } }
    </style>
</head>
<body>

<header class="site-header">
    <h1>الدروس العلمية للشيخ سعيد مصطفى دياب</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="khutbah.html" class="nav-link">الخطب</a>
    <a href="lessons.html" class="nav-link" style="background:var(--bright-blue); color: var(--dark-blue);">الدروس</a>
</div>

<div id="main-view">
    <div class="categories-grid">
        <div class="cat-card" onclick="showSection('tafseer')"><h3>تفسير القرآن</h3></div>
        <div class="cat-card" onclick="showSection('quran_sciences')"><h3>علوم القرآن</h3></div>
        <div class="cat-card" onclick="showSection('hadith')"><h3>شروح الحديث</h3></div>
        <div class="cat-card" onclick="showSection('tawheed')"><h3>العقيدة</h3></div>
        <div class="cat-card" onclick="showSection('faraid')"><h3>علم الفرائض</h3></div>
        <div class="cat-card" onclick="showSection('seerah')"><h3>السيرة</h3></div>
        <div class="cat-card" onclick="showSection('raqaeq')"><h3>الرقائق</h3></div>
        <div class="cat-card" onclick="showSection('fiker')"><h3>المذاهب</h3></div>
    </div>
</div>

<div id="details-view">
    <button class="back-btn" onclick="hideSection()">← عودة للقائمة</button>
    <h2 id="section-title" style="color: var(--dark-blue); border-bottom: 3px solid var(--bright-blue); padding-bottom: 10px;"></h2>
    <div id="lessons-list"></div>
</div>

<script>
    // 1. بيانات التفسير مع الأغلفة
    const tafseerData = [
        { 
            name: "وقفات تدبرية", 
            cover: "images/waqfat-tdaboria.jpg", 
            lessons: Array.from({length: 10}, (_, i) => ({t: `الدرس ${i+1}`, f: `waqfat-${i+1}.mp3`})) 
        },
        { name: "سورة الفاتحة", lessons: [{t: "الدرس 1", f: "fatiha-1.mp3"}] },
        { name: "سورة البقرة", lessons: Array.from({length: 40}, (_, i) => ({t: `الدرس ${i+1}`, f: `bakara-${i+1}.mp3`})) }
        // يمكن إضافة باقي السور هنا بنفس الطريقة
    ];

    // 2. بيانات العقيدة مع الأغلفة (أضف مسار الصورة إذا توفرت)
    const tawheedData = [
        { name: "شرح العقيدة الطحاوية", cover: "images/tahawiya.jpg", lessons: Array.from({length: 21}, (_, i) => ({t: `الدرس ${i+1}`, f: `tahawiya-${i+1}.mp3`})) },
        { name: "شرح العقيدة الواسطية", lessons: Array.from({length: 26}, (_, i) => ({t: `الدرس ${i+1}`, f: `wasitiya-${i+1}.mp3`})) },
        { name: "شرح سلم الوصول", lessons: Array.from({length: 25}, (_, i) => ({t: `الدرس ${i+1}`, f: `sollam-${i+1}.mp3`})) },
        { name: "شرح كتاب التوحيد", lessons: Array.from({length: 23}, (_, i) => ({t: `الدرس ${i+1}`, f: `tawheed-${i+1}.mp3`})) }
    ];

    const otherData = {
        hadith: { title: "شروح الحديث", list: Array.from({length: 30}, (_, i) => ({ t: `رياض الصالحين - الدرس ${i+1}`, f: `reyad-${i+1}.mp3` })) },
        faraid: { title: "علم الفرائض", list: Array.from({length: 11}, (_, i) => ({ t: `المنظومة الرحبية - الدرس ${i+1}`, f: `al-rhapih${i+1}.mp3` })) },
        quran_sciences: { title: "علوم القرآن", list: [{ t: "مقدمة", f: "quran-1.mp3" }] },
        seerah: { title: "السيرة", list: [{ t: "مقدمة", f: "seerah-1.mp3" }] },
        raqaeq: { title: "الرقائق", list: [{ t: "مقدمة", f: "raqaeq-1.mp3" }] },
        fiker: { title: "المذاهب", list: [{ t: "مقدمة", f: "fiker-1.mp3" }] }
    };

    function showSection(key) {
        const listDiv = document.getElementById('lessons-list');
        listDiv.innerHTML = "";
        if (key === 'tafseer' || key === 'tawheed') {
            const currentData = (key === 'tafseer') ? tafseerData : tawheedData;
            document.getElementById('section-title').innerText = (key === 'tafseer') ? "تفسير القرآن" : "العقيدة";
            currentData.forEach((item, index) => {
                let coverHtml = item.cover ? `<img src="${item.cover}" class="book-cover" onerror="this.style.display='none'">` : "";
                listDiv.innerHTML += `
                    <div class="item-wrapper">
                        <div class="item-header" onclick="toggleItem('${key}-${index}')"><span>${item.name}</span> <small>▼</small></div>
                        <div class="item-content" id="${key}-${index}">
                            ${coverHtml}
                            <div class="lessons-container">
                                ${item.lessons.map(l => `<div class="lesson-item"><span>${l.t}</span><audio controls preload="none"><source src="audio/${l.f}" type="audio/mpeg"></audio></div>`).join('')}
                            </div>
                        </div>
                    </div>`;
            });
        } else {
            const section = otherData[key];
            document.getElementById('section-title').innerText = section.title;
            listDiv.innerHTML = section.list.map(item => `
                <div class="lesson-item" style="background:white; margin-bottom:8px; padding:15px; border-radius:10px; border-right:5px solid var(--dark-blue);">
                    <span style="font-weight:bold">${item.t}</span>
                    <audio controls preload="none"><source src="audio/${item.f}" type="audio/mpeg"></audio>
                </div>`).join('');
        }
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('details-view').style.display = 'block';
    }

    function toggleItem(id) {
        const content = document.getElementById(id);
        content.style.display = (content.style.display === 'block') ? 'none' : 'block';
    }

    function hideSection() {
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('details-view').style.display = 'none';
    }
</script>
</body>
</html>
