<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الأعراف - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --dark-blue: #2c5d87; 
            --gold: #b59410; 
            --card-bg: rgba(255, 255, 255, 0.92); 
        }

        body { 
            margin: 0; font-family: 'Cairo', sans-serif; direction: rtl; 
            background: #2c5d87 url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }

        .header-section { 
            background: rgba(44, 93, 135, 0.85); 
            padding: 30px; text-align: center; border-bottom: 5px solid var(--gold); 
            backdrop-filter: blur(10px); color: white;
        }

        .nav-bar { 
            display: flex; justify-content: center; gap: 15px; padding: 15px; 
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(5px);
        }

        .btn-link { 
            padding: 8px 20px; border: 1px solid var(--dark-blue); border-radius: 8px; 
            text-decoration: none; color: var(--dark-blue); font-weight: bold; background: white;
        }

        .main-container { max-width: 800px; margin: 30px auto; padding: 20px; }

        /* مشغل الصوت الرئيسي */
        .audio-player-card { 
            background: var(--card-bg); border-radius: 15px; padding: 25px; 
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            backdrop-filter: blur(8px); margin-bottom: 30px; border: 1px solid var(--gold);
        }
        
        .audio-player-card h2 { color: var(--dark-blue); margin: 0 0 10px 0; }
        #current-lesson-title { color: var(--gold); font-weight: bold; }
        
        audio { width: 100%; margin-top: 15px; }

        /* قائمة الدروس */
        .lessons-list { 
            background: var(--card-bg); border-radius: 15px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); backdrop-filter: blur(5px);
        }

        .lesson-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; border-bottom: 1px solid #eee; transition: 0.3s;
            cursor: pointer; color: #333;
        }
        
        .lesson-item:hover { background: rgba(44, 93, 135, 0.1); }
        .lesson-item.active { background: rgba(181, 148, 16, 0.15); border-right: 5px solid var(--gold); }
        
        .lesson-info { display: flex; align-items: center; gap: 15px; }
        .lesson-number { 
            background: var(--dark-blue); color: white; width: 30px; height: 30px; 
            display: flex; align-items: center; justify-content: center; border-radius: 50%; 
            font-size: 0.8rem; font-weight: bold;
        }

        .play-btn { color: var(--dark-blue); font-size: 1.3rem; }

        footer { text-align: center; padding: 40px; color: #fff; text-shadow: 1px 1px 3px #000; }
    </style>
</head>
<body>

<header class="header-section">
    <h1>تفسير سورة الأعراف</h1>
    <p>فضيلة الشيخ سعيد مصطفى دياب</p>
</header>

<div class="nav-bar">
    <a href="tafseer.html" class="btn-link"><i class="fas fa-arrow-right"></i> العودة للفهرس</a>
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
</div>

<div class="main-container">
    <div class="audio-player-card">
        <h2 id="current-lesson-title">الدرس الأول</h2>
        <audio id="main-audio" controls>
            <source id="audio-source" src="al-aaraf-1.mp3" type="audio/mpeg">
            متصفحك لا يدعم مشغل الصوت.
        </audio>
    </div>

    <div class="lessons-list" id="lessons-container">
        </div>
</div>

<script>
    const totalLessons = 11; // عدد الدروس التي رفعتها
    const lessonsContainer = document.getElementById('lessons-container');
    const mainAudio = document.getElementById('main-audio');
    const audioSource = document.getElementById('audio-source');
    const titleDisplay = document.getElementById('current-lesson-title');

    for (let i = 1; i <= totalLessons; i++) {
        const lessonDiv = document.createElement('div');
        lessonDiv.className = 'lesson-item';
        if(i === 1) lessonDiv.classList.add('active');

        lessonDiv.innerHTML = `
            <div class="lesson-info">
                <div class="lesson-number">${i}</div>
                <span>الدرس رقم ${i} من تفسير سورة الأعراف</span>
            </div>
            <i class="fas fa-play-circle play-btn"></i>
        `;

        lessonDiv.onclick = function() {
            // تغيير ملف الصوت
            audioSource.src = `al-aaraf-${i}.mp3`;
            mainAudio.load();
            mainAudio.play();

            // تحديث العنوان
            titleDisplay.innerText = `الدرس رقم ${i}`;

            // تحديث الشكل (إزالة اللون من القديم وإضافته للجديد)
            document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
            lessonDiv.classList.add('active');
        };

        lessonsContainer.appendChild(lessonDiv);
    }
</script>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
