<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفسير سورة الأعراف - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --dark-blue: #2c5d87; 
            --gold: #b59410; 
            --success-green: #27ae60;
            --card-transparent: rgba(255, 255, 255, 0.9); 
        }

        body { 
            margin: 0; font-family: 'Cairo', sans-serif; direction: rtl; 
            background: #2c5d87 url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }

        /* الهيدر المتناسق */
        .site-header { 
            background: rgba(44, 93, 135, 0.85); 
            padding: 40px 20px; text-align: center; border-bottom: 5px solid var(--gold); 
            backdrop-filter: blur(10px); color: white;
        }
        .site-header h1 { margin: 0; font-size: 2.3rem; font-weight: 900; }

        .nav-bar { 
            display: flex; justify-content: center; gap: 15px; padding: 15px; 
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(5px);
            border-bottom: 1px solid #ddd;
        }

        .btn-link { 
            padding: 8px 20px; border: 1px solid var(--dark-blue); border-radius: 10px; 
            text-decoration: none; color: var(--dark-blue); font-weight: bold; 
            background: white; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .btn-link:hover { background: var(--dark-blue); color: white; }

        .main-container { max-width: 900px; margin: 30px auto; padding: 0 20px; }

        /* مشغل الصوت الرئيسي */
        .audio-player-card { 
            background: var(--card-transparent); border-radius: 15px; padding: 25px; 
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            backdrop-filter: blur(8px); margin-bottom: 30px; border: 1px solid var(--gold);
        }
        .audio-player-card h2 { color: var(--dark-blue); margin-bottom: 15px; }
        audio { width: 100%; height: 45px; }

        /* قائمة الدروس بتنسيق السور */
        .lessons-grid { 
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 50px;
        }

        .lesson-card { 
            background: var(--card-transparent); 
            border-radius: 12px; 
            padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.4);
            transition: 0.3s;
        }
        .lesson-card:hover { transform: scale(1.01); border-color: var(--gold); }
        .lesson-card.active { border-right: 6px solid var(--gold); background: #fff; }

        .lesson-info { display: flex; align-items: center; gap: 15px; }
        .lesson-index { 
            background: var(--dark-blue); color: white; width: 35px; height: 35px; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 50%; font-weight: bold; font-size: 0.9rem;
        }
        .lesson-name { color: var(--dark-blue); font-weight: 700; font-size: 1.1rem; }

        .lesson-actions { display: flex; gap: 10px; }
        
        /* أزرار التشغيل والتحميل */
        .btn-action {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; text-decoration: none; font-size: 1.1rem;
        }
        .play-btn { background: var(--dark-blue); color: white; }
        .play-btn:hover { background: var(--gold); }
        
        .download-btn { background: var(--success-green); color: white; }
        .download-btn:hover { background: #1e8449; }

        footer { text-align: center; padding: 40px; color: #fff; font-weight: bold; text-shadow: 2px 2px 4px #000; background: rgba(0,0,0,0.4); }

        @media (max-width: 600px) {
            .lesson-card { flex-direction: column; gap: 15px; text-align: center; }
            .lesson-info { flex-direction: column; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>تفسير سورة الأعراف</h1>
    <p>بصوت الشيخ سعيد مصطفى دياب</p>
</header>

<div class="nav-bar">
    <a href="tafseer.html" class="btn-link"><i class="fas fa-arrow-right"></i> العودة للفهرس</a>
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
</div>

<div class="main-container">
    <div class="audio-player-card">
        <h2 id="current-title">الدرس رقم 1</h2>
        <audio id="main-audio" controls>
            <source id="audio-source" src="al-aaraf-1.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="lessons-grid" id="lessons-container">
        </div>
</div>

<script>
    const totalLessons = 11;
    const container = document.getElementById('lessons-container');
    const mainAudio = document.getElementById('main-audio');
    const audioSource = document.getElementById('audio-source');
    const currentTitle = document.getElementById('current-title');

    for (let i = 1; i <= totalLessons; i++) {
        const lessonFile = `al-aaraf-${i}.mp3`;
        const card = document.createElement('div');
        card.className = 'lesson-card';
        if(i === 1) card.classList.add('active');

        card.innerHTML = `
            <div class="lesson-info">
                <div class="lesson-index">${i}</div>
                <div class="lesson-name">الدرس رقم ${i} من سورة الأعراف</div>
            </div>
            <div class="lesson-actions">
                <button class="btn-action play-btn" onclick="playLesson(${i}, '${lessonFile}', this)" title="تشغيل">
                    <i class="fas fa-play"></i>
                </button>
                <a href="${lessonFile}" download class="btn-action download-btn" title="تحميل">
                    <i class="fas fa-download"></i>
                </a>
            </div>
        `;
        container.appendChild(card);
    }

    function playLesson(num, file, btn) {
        // تحديث الملف وتشغيله
        audioSource.src = file;
        mainAudio.load();
        mainAudio.play();
        
        // تحديث العنوان العلوي
        currentTitle.innerText = `الدرس رقم ${num}`;
        
        // تحديث تأثير الاختيار (Active)
        document.querySelectorAll('.lesson-card').forEach(c => c.classList.remove('active'));
        btn.closest('.lesson-card').classList.add('active');
        
        // تمرير الصفحة للأعلى بسلاسة لرؤية المشغل
        window.scrollTo({ top: 150, behavior: 'smooth' });
    }
</script>

<footer>
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
