<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلسلة من مشاهد يوم القيامة - الشيخ سعيد مصطفى دياب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --primary:#2d5f8b;
    --gold:#caa230;
    --beige-light:#efe6d6;
    --beige-dark:#d8c7a8;
}

*{ box-sizing:border-box; }

body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:#eef1f4;
    color:#333;
}

/* top bar */
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 25px;
    background:var(--beige-light);
    border-bottom:2px solid var(--beige-dark);
    flex-wrap:wrap;
    gap: 10px;
}

.date-info{
    font-weight:700;
    color:#555;
}

.prayer-times{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.prayer-item{
    background:white;
    padding:5px 10px;
    border-radius:8px;
    border:1px solid #ddd;
    text-align:center;
}

.prayer-name{
    font-size:0.7rem;
    color:#777;
    font-weight:bold;
}

.prayer-time{
    font-weight:900;
    color:var(--primary);
}

/* header */
.site-header{
    text-align:center;
    padding:30px 10px;
    background:#dce7ea;
}

.site-logo{
    max-width:600px;
    width:100%;
}

/* nav */
.main-nav{
    display:flex;
    justify-content:center;
    gap:15px;
    padding:20px;
    background:var(--beige-light);
    flex-wrap:wrap;
}

.nav-link{
    text-decoration:none;
    color:white;
    padding:12px 35px;
    border-radius:10px;
    font-weight:900;
    background:var(--primary);
    box-shadow:0 5px 0 rgba(0,0,0,0.2);
    transition:0.3s;
}

.nav-link:hover{
    transform:translateY(-3px);
}

/* content */
.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
    text-align:center;
}

.section-title{
    font-size:2rem;
    color:var(--primary);
    font-weight:900;
}

.title-line{
    width:180px;
    height:4px;
    background:var(--gold);
    margin:10px auto 30px;
    border-radius:10px;
}

.series-info-box{
    background:white;
    display:inline-block;
    padding:8px 20px;
    border-radius:20px;
    margin-bottom:20px;
    font-weight:bold;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

/* player */
.dropdown-container{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.05);
    border-top: 4px solid var(--primary);
}

.lessons-dropdown{
    width:100%;
    padding:12px;
    font-size:1.1rem;
    font-family: 'Cairo', sans-serif;
    font-weight: bold;
    border-radius:10px;
    margin-bottom:20px;
    border: 2px solid var(--beige-dark);
    outline: none;
    text-align: right;
}
.lessons-dropdown:focus { border-color: var(--primary); }

.player-box{
    display:flex;
    gap:15px;
    align-items:center;
    justify-content:center;
    background: #f8fafc;
    padding: 15px;
    border-radius: 10px;
}

.player-box audio{
    width:100%;
    height: 40px;
}

.btn-download-audio{
    font-size:1.8rem;
    color: green;
    text-decoration: none;
    transition: 0.2s;
}
.btn-download-audio:hover { color: var(--gold); }

/* pagination */
.pagination{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.page-btn{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:var(--gold);
    color:white;
    cursor:pointer;
    font-weight:bold;
    font-family: 'Cairo', sans-serif;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transition: 0.2s;
}
.page-btn:hover { transform: translateY(-2px); }

.page-btn.active{
    outline:3px solid var(--primary);
    outline-offset: 2px;
}

@media(max-width:768px){
    .player-box { flex-direction: column; }
    .nav-link, .page-btn { width: 100%; text-align: center; }
}
</style>
</head>

<body>

<div class="top-bar">
    <div class="date-info" id="current-date">جاري التحميل...</div>
    <div class="prayer-times" id="prayer-api"></div>
</div>

<header class="site-header">
    <img src="images/logo.png.jpg" class="site-logo" alt="الشيخ سعيد مصطفى دياب">
</header>

<nav class="main-nav">
    <a class="nav-link" href="index.html">الرئيسية</a>
    <a class="nav-link" href="tafseer.html">التفسير</a>
    <a class="nav-link" href="lessons.html">الصوتيات</a>
    <a class="nav-link" href="khutab.html">الخطب</a>
    <a class="nav-link" href="articles.html">المقالات</a>
</nav>

<div class="container">

<h1 class="section-title">سلسلة من مشاهد يوم القيامة</h1>
<div class="title-line"></div>

<div class="series-info-box" id="count">...</div>

<div class="dropdown-container">

<select id="lessonsSelect" class="lessons-dropdown" onchange="playSelectedLesson()"></select>

<div class="player-box">
    <audio id="audioPlayer" controls preload="none">
        <source id="audioSource" src="" type="audio/mpeg">
    </audio>
    <a id="downloadBtn" class="btn-download-audio" download title="تحميل الدرس">
        <i class="fa-solid fa-circle-down"></i>
    </a>
</div>

</div>

<div class="pagination" id="pagination"></div>

</div>

<footer style="text-align:center;padding:35px;background:var(--beige-light);border-top:2px solid var(--beige-dark);font-weight:700;margin-top:50px;">
جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب © 2026
</footer>

<script>
// تحديد الرابط الأساسي للموقع لمنع المتصفح من الخلط بين المجلدات الفرعية
const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

const allFiles = [
"mashahed-alqeyama-1.mp3",
"mashahed-alqeyama-2.mp3",
"mashahed-alqeyama-3.mp3",
"mashahed-alqeyama-4.mp3",
"mashahed-alqeyama-5.mp3",
"mashahed-alqeyama-6.mp3",
"mashahed-alqeyama-7.mp3",
"mashahed-alqeyama-8.mp3",
"mashahed-alqeyama-9.mp3",
"mashahed-alqeyama-10.mp3",
"mashahed-alqeyama-11.mp3",
"mashahed-alqeyama-12.mp3",
"mashahed-alqeyama-13.mp3",
"mashahed-alqeyama-14.mp3",
"mashahed-alqeyama-15.mp3",
"mashahed-alqeyama-16.mp3",
"mashahed-alqeyama-17.mp3",
"mashahed-alqeyama-18.mp3",
"mashahed-alqeyama-19.mp3",
"mashahed-alqeyama-20.mp3",
"mashahed-alqeyama-21.mp3",
"mashahed-alqeyama-22.mp3",
"mashahed-alqeyama-23.mp3"
];

const perPage = 10;
let page = 1;

const select = document.getElementById("lessonsSelect");
const audio = document.getElementById("audioPlayer");
const audioSource = document.getElementById("audioSource");
const download = document.getElementById("downloadBtn");
const pagination = document.getElementById("pagination");

function render(){
select.innerHTML="";

let start=(page-1)*perPage;
let end=start+perPage;

let items=allFiles.slice(start,end);

items.forEach((file,i)=>{
let opt=document.createElement("option");
// دمج اسم الملف مع الرابط المباشر للموقع لضمان تخطي الـ Cache للـ audio/
opt.value = baseUrl + file; 
opt.textContent="الدرس رقم "+(start+i+1);
select.appendChild(opt);
});

document.getElementById("count").innerText=
`عرض الدروس من ${start+1} إلى ${Math.min(end,allFiles.length)} من أصل ${allFiles.length}`;

playSelectedLesson();
renderPagination();
}

function playSelectedLesson(){
if(!select.value) return;
// تغيير مسار السورس الداخلي مباشرة للمشغل وإعادة تحميل البنية برابط مطلق
audioSource.src = select.value;
audio.load(); 
download.href = select.value;
}

function renderPagination() {
    pagination.innerHTML = "";

    const totalPages = Math.ceil(allFiles.length / perPage);

    if (totalPages <= 1) return;

    for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");

        btn.textContent = "الصفحة " + i;
        btn.classList.add("page-btn");

        if (i === page) {
            btn.classList.add("active");
        }

        btn.addEventListener("click", function () {
            page = i;
            render();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        });

        pagination.appendChild(btn);
    }
}

function updateDate(){
let now=new Date();
document.getElementById("current-date").innerText=
new Intl.DateTimeFormat("ar-SA",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(now);
}

async function getPrayers(){
try{
let res=await fetch("https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4");
let data=await res.json();
let t=data.data.timings;

document.getElementById("prayer-api").innerHTML=
`<div class="prayer-item"><div class="prayer-name">الفجر</div><div class="prayer-time">${t.Fajr}</div></div>
<div class="prayer-item"><div class="prayer-name">الظهر</div><div class="prayer-time">${t.Dhuhr}</div></div>
<div class="prayer-item"><div class="prayer-name">العصر</div><div class="prayer-time">${t.Asr}</div></div>
<div class="prayer-item"><div class="prayer-name">المغرب</div><div class="prayer-time">${t.Maghrib}</div></div>
<div class="prayer-item"><div class="prayer-name">العشاء</div><div class="prayer-time">${t.Isha}</div></div>`;
}catch(e){}
}

window.onload = function () {
    render();
    updateDate();
    getPrayers();
};
</script>

</body>
</html>
