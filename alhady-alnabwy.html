<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الهدي النبوي في العبادات - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #f4f7f9; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); color: #333; }
        .site-header { text-align: center; padding: 20px; background: var(--header-bg); border-bottom: 4px solid #fff; }
        .site-logo { max-width: 400px; width: 100%; mix-blend-mode: multiply; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .series-title { color: var(--dark-blue); text-align: center; font-weight: 900; margin-bottom: 30px; }
        .lessons-list { display: flex; flex-direction: column; gap: 15px; }
        .lesson-item { background: white; padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-right: 5px solid var(--gold-color); }
        .lesson-info h4 { margin: 0; color: var(--dark-blue); font-size: 1.1rem; }
        .audio-player { width: 100%; max-width: 300px; height: 35px; }
        .back-btn { display: inline-block; margin-top: 30px; padding: 10px 25px; background: var(--dark-blue); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: var(--gold-color); }
        @media (max-width: 600px) { .lesson-item { flex-direction: column; text-align: center; gap: 15px; } .audio-player { max-width: 100%; } }
    </style>
</head>
<body>

<header class="site-header">
    <img src="images/logo.png" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
</header>

<div class="container">
    <a href="fiqh.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة لقسم الفقه</a>
    <h1 class="series-title">سلسلة الهدي النبوي في العبادات</h1>

    <div class="lessons-list">
        <!-- الدرس 5 كمثال مباشر للتأكد من المسار السليم -->
        <div class="lesson-item">
            <div class="lesson-info"><h4>الدرس رقم 5</h4></div>
            <audio controls class="audio-player">
                <source src="alhady-alnabwy/alhady-alnabwy-5.mp3" type="audio/mpeg">
                متصفحك لا يدعم تشغيل الصوت.
            </audio>
        </div>

        <!-- يمكنك تكرار هذا الجزء لبقية الدروس يدويًا لضمان الاستقرار التام إن لزم الأمر -->
    </div>
</div>

</body>
</html>
