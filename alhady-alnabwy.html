<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلسلة الهدي النبوي في العبادات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --blue:#1f4e79;
    --gold:#d4af37;
    --bg:#f4f7f9;
}

body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:var(--bg);
}

/* ===== TOP BAR ===== */
.top-bar{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    padding:10px;
    background:#fff;
    font-size:13px;
    border-bottom:2px solid #eee;
}

/* ===== NAV ===== */
.nav{
    background:var(--blue);
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    padding:10px;
}

.nav a{
    color:#fff;
    text-decoration:none;
    padding:8px 14px;
    border-radius:8px;
    background:rgba(255,255,255,0.1);
    transition:0.3s;
}
.nav a:hover{
    background:var(--gold);
    color:#000;
}

/* ===== HERO HEADER (ANIMATED) ===== */
.hero{
    position:relative;
    text-align:center;
    padding:40px 20px;
    overflow:hidden;
    background:linear-gradient(-45deg,#1f4e79,#2c7da0,#144a6a,#1f4e79);
    background-size:400% 400%;
    animation:gradientMove 10s ease infinite;
    color:white;
}

@keyframes gradientMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* glow effect */
.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle,rgba(255,255,255,0.1),transparent);
}

/* logo */
.hero img{
    max-width:180px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,0.4);
    box-shadow:0 0 20px rgba(255,255,255,0.3);
    position:relative;
    z-index:2;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

/* title */
.hero h1{
    margin:10px 0 0;
    font-size:1.6rem;
    font-weight:900;
    position:relative;
    z-index:2;
    animation:fadeIn 2s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
}

/* ===== SEARCH ===== */
.search{
    text-align:center;
    margin:15px;
}

.search input{
    width:80%;
    max-width:400px;
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

/* ===== LESSONS ===== */
.lesson{
    background:#fff;
    margin:10px auto;
    max-width:900px;
    padding:15px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-right:5px solid var(--gold);
}

.lesson audio{
    width:250px;
}

.ctrl button{
    padding:6px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* mobile */
@media(max-width:600px){
    .lesson{flex-direction:column;gap:10px}
    .lesson audio{width:100%}
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
    <div id="date"></div>
    <div id="hijri"></div>
    <div id="prayer">جاري تحميل مواقيت الصلاة...</div>
</div>

<!-- NAV -->
<div class="nav">
    <a href="#">الرئيسية</a>
    <a href="#">التفسير</a>
    <a href="#">الصوتيات</a>
    <a href="#">الخطب</a>
    <a href="#">المقالات</a>
</div>

<!-- HERO HEADER -->
<div class="hero">
    <img src="images/logo.png.jpg" alt="logo">
    <h1>سلسلة الهدي النبوي في العبادات</h1>
</div>

<!-- SEARCH -->
<div class="search">
    <input type="text" id="search" placeholder="ابحث عن درس...">
</div>

<div id="count" style="text-align:center;margin:10px;"></div>

<!-- LESSONS -->
<div id="lessons"></div>

<script>

// ===== FILES =====
const files = [
    "alhady-alnabwy-1.mp3",
    "alhady-alnabwy-2.mp3",
    "alhady-alnabwy-3.mp3"
];

// ===== RENDER =====
const container = document.getElementById("lessons");

function render(list){
    container.innerHTML = "";

    list.forEach((file,i)=>{
        container.innerHTML += `
        <div class="lesson">
            <audio controls preload="none">
                <source src="audio/${file}" type="audio/mpeg">
            </audio>

            <div>الدرس رقم ${i+1}</div>

            <div class="ctrl">
                <button onclick="next(${i})">⏭</button>
                <button onclick="prev(${i})">⏮</button>
            </div>
        </div>`;
    });

    document.getElementById("count").innerText =
    "عدد الدروس: " + list.length;
}

render(files);

// ===== SEARCH =====
document.getElementById("search").addEventListener("input",function(){
    const val = this.value;
    const filtered = files.filter((f,i)=>
        ("الدرس رقم "+(i+1)).includes(val)
    );
    render(filtered);
});

// ===== NEXT/PREV =====
function next(i){
    const audios = document.querySelectorAll("audio");
    if(audios[i+1]) audios[i+1].play();
}

function prev(i){
    const audios = document.querySelectorAll("audio");
    if(audios[i-1]) audios[i-1].play();
}

// ===== DATE =====
document.getElementById("date").innerText =
"ميلادي: " + new Date().toLocaleDateString('ar-EG');

document.getElementById("hijri").innerText =
"هجري: " + new Intl.DateTimeFormat('ar-SA-u-ca-islamic').format(new Date());

// ===== PRAYER TIMES =====
fetch("https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=3")
.then(r=>r.json())
.then(data=>{
    const t = data.data.timings;
    document.getElementById("prayer").innerText =
    `الفجر ${t.Fajr} | الظهر ${t.Dhuhr} | العصر ${t.Asr} | المغرب ${t.Maghrib} | العشاء ${t.Isha}`;
});

</script>

</body>
</html>
