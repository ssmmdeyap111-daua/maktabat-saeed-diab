<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلسلة الهدي النبوي في العبادات - الشيخ سعيد مصطفى دياب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --primary:#2d5f8b;
    --gold:#c8a44d;
    --beige-light:#efe6d6;
    --beige-dark:#d8c7a8;
}

*{ box-sizing:border-box; }

body{
    margin:0; padding:0;
    font-family:'Cairo',sans-serif;
    background:#eef1f4; color:#333;
}

/* الشريط العلوي */
.top-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 25px; background:var(--beige-light);
    border-bottom:2px solid var(--beige-dark); flex-wrap:wrap; gap:10px;
}

.date-info{ font-size:0.95rem; font-weight:700; color:#555; }
.prayer-times{ display:flex; gap:8px; flex-wrap:wrap; }
.prayer-item{ background:white; padding:5px 10px; border-radius:8px; border:1px solid #ddd; text-align:center; }
.prayer-name{ display:block; font-size:0.7rem; color:#777; font-weight:bold; }
.prayer-time{ font-weight:900; color:var(--primary); font-size:0.85rem; }

/* الهيدر */
.site-header{ text-align:center; padding:30px 10px; background:#dce7ea; }
.site-logo{ max-width:650px; width:100%; height:auto; mix-blend-mode:multiply; }

/* القائمة الرئيسية */
.main-nav{
    display:flex; justify-content:center; align-items:center; gap:16px;
    padding:22px; background:var(--beige-light); border-top:1px solid #ddd; border-bottom:1px solid #ddd; flex-wrap:wrap;
}

.nav-link, .page-btn {
    text-decoration:none; color:white; border:none;
    padding:15px 45px; border-radius:12px;
    font-weight:900; transition:0.3s; font-size:1.25rem; 
    box-shadow:0 5px 0 rgba(0,0,0,0.2); cursor: pointer;
    font-family: 'Cairo', sans-serif;
}

.nav-link:hover, .page-btn:hover{ transform:translateY(-3px); box-shadow:0 8px 0 rgba(0,0,0,0.15); }

.btn-home { background:#caa230; }
.btn-tafseer { background:#73b8d4; }
.btn-audio { background:#6eb6d1; }
.btn-khutab { background:#5b90cb; }
.btn-articles { background:#4f7f49; }

/* المحتوى */
.container{ max-width:1000px; margin:auto; padding:60px 20px; text-align:center; }
.section-title{ color:var(--primary); font-size:2.4rem; font-weight:900; margin-bottom:10px; }
.title-line{ width:200px; height:5px; background:#caa230; margin:0 auto 30px; border-radius:10px; }

.series-info-box {
    display: inline-block; background: white; padding: 8px 25px; border-radius: 30px;
    font-weight: bold; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    margin-bottom: 35px; font-size: 1.05rem;
}

/* صندوق القائمة المنسدلة والمشغل الموحد */
.dropdown-container {
    background: white; padding: 30px; border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 600px;
    margin: 0 auto; border-top: 5px solid var(--gold);
}

.dropdown-label { display: block; font-weight: 900; color: var(--primary); margin-bottom: 12px; font-size: 1.2rem; }

.lessons-dropdown {
    width: 100%; padding: 12px 20px; font-family: 'Cairo', sans-serif; font-weight: bold;
    font-size: 1.1rem; border: 2px solid var(--beige-dark); border-radius: 10px;
    background-color: #fafafa; color: #333; outline: none; cursor: pointer;
    margin-bottom: 25px; text-align: right;
}
.lessons-dropdown:focus { border-color: var(--primary); }

.player-box { display: flex; align-items: center; justify-content: center; gap: 20px; background: #f0f4f8; padding: 15px; border-radius: 12px; }
.player-box audio { flex-grow: 1; height: 40px; }
.btn-download-audio { color: #4f7f49; font-size: 1.8rem; text-decoration: none; transition: 0.2s; }
.btn-download-audio:hover { color: var(--gold); }

/* أزرار الصفحات السفلية */
.pagination { display: flex; justify-content: center; gap: 20px; margin-top: 50px; flex-wrap: wrap; padding: 20px; }
.page-btn.active { outline: 4px solid var(--primary); outline-offset: 3px; }

footer{ background:var(--beige-light); color:#555; text-align:center; padding:35px 15px; font-weight:700; margin-top:50px; border-top:2px solid var(--beige-dark); }

@media(max-width:768px){
    .player-box { flex-direction: column; }
    .player-box audio { width: 100%; }
    .nav-link, .page-btn { padding: 12px 25px; font-size: 1.1rem; width: 100%; }
}
</style>
</head>

<body>

<div class="top-bar">
    <div class="date-info" id="current-date">جاري التحميل...</div>
    <div class="prayer-times" id="prayer-api"></div>
</div>

<header class="site-header">
    <img src="images/logo.png.jpg" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
</header>

<nav class="main-nav">
    <a href="index.html" class="nav-link btn-home">الرئيسية</a>
    <a href="tafseer.html" class="nav-link btn-tafseer">التفسير</a>
    <a href="lessons.html" class="nav-link btn-audio">الصوتيات</a>
    <a href="khutab.html" class="nav-link btn-khutab">الخطب</a>
    <a href="articles.html" class="nav-link btn-articles">المقالات</a>
</nav>

<div class="container">
    <h1 class="section-title">سلسلة الهدي النبوي في العبادات</h1>
    <div class="title-line"></div>

    <div class="series-info-box" id="count">جاري حساب الدروس...</div>

    <div class="dropdown-container">
        <label class="dropdown-label" for="lessonsSelect">اختر الدرس من القائمة المنسدلة:</label>
        <select id="lessonsSelect" class="lessons-dropdown" onchange="playSelectedLesson()">
            </select>

        <div class="player-box">
            <audio id="mainAudioPlayer" controls preload="none">
                <source id="audioSource" src="" type="audio/mpeg">
            </audio>
            <a id="downloadBtn" href="#" download class="btn-download-audio" title="تحميل الدرس الحالي">
                <i class="fas fa-circle-down"></i>
            </a>
        </div>
    </div>

    <div class="pagination" id="pagination-controls"></div>
</div>

<footer>
    جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب © 2026
</footer>

<script>
// تحديد الرابط الأساسي للموقع برمجياً لمنع مشاكل الـ Cache والبحث عن المجلدات الفرعية
const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

// تم تحديث المصفوفة وإضافة ملف الدرس السادس الجديد alhady-alnabwy-6.mp3 بنجاح
const allFiles = [
    "alhady-alnabwy-1.mp3",
    "alhady-alnabwy-2.mp3",
    "alhady-alnabwy-3.mp3",
    "alhady-alnabwy-4.mp3",
    "alhady-alnabwy-5.mp3",
    "alhady-alnabwy-6.mp3"
]; 

const itemsPerPage = 10;
let currentPage = 1;

const selectEl = document.getElementById("lessonsSelect");
const audioPlayer = document.getElementById("mainAudioPlayer");
const audioSource = document.getElementById("audioSource");
const downloadBtn = document.getElementById("downloadBtn");
const paginationControls = document.getElementById("pagination-controls");

function renderDropdown() {
    selectEl.innerHTML = "";
    
    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const pageItems = allFiles.slice(start, end);

    pageItems.forEach((file) => {
        const realIndex = allFiles.indexOf(file);
        const option = document.createElement("option");
        // دمج الرابط الأساسي المطلق مع اسم الملف مباشرة لحل مشكلة الدرس الثاني بشكل نهائي
        option.value = baseUrl + file; 
        option.innerText = `الدرس رقم ${realIndex + 1}`;
        selectEl.appendChild(option);
    });

    document.getElementById("count").innerText = `إجمالي عدد الدروس الحالية: ${allFiles.length}`;
    
    playSelectedLesson();
    setupPagination();
}

function playSelectedLesson() {
    const selectedFile = selectEl.value;
    if (selectedFile) {
        audioSource.src = selectedFile;
        audioPlayer.load(); 
        downloadBtn.href = selectedFile;
    }
}

function setupPagination() {
    paginationControls.innerHTML = "";
    const pageCount = Math.ceil(allFiles.length / itemsPerPage);
    if (pageCount <= 1) return;

    for (let i = 1; i <= pageCount; i++) {
        const btn = document.createElement("button");
        btn.innerText = `الصفحة ${i}`;
        btn.classList.add("page-btn");
        if (i === currentPage) btn.classList.add("active");
        
        btn.addEventListener("click", () => {
            currentPage = i;
            renderDropdown();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        });
        paginationControls.appendChild(btn);
    }
}

window.onload = () => {
    renderDropdown();
    updateDate();
    getPrayers();
};

function updateDate(){
    const now = new Date();
    const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now);
    const miladi = new Intl.DateTimeFormat('ar-EG', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now);
    document.getElementById('current-date').innerHTML = `${hijri} هـ | ${miladi} م`;
}

async function getPrayers(){
    try{
        const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
        const data = await res.json();
        const t = data.data.timings;
        document.getElementById('prayer-api').innerHTML = `
            <div class="prayer-item"><span class="prayer-name">الفجر</span><span class="prayer-time">${t.Fajr}</span></div>
            <div class="prayer-item"><span class="prayer-name">الظهر</span><span class="prayer-time">${t.Dhuhr}</span></div>
            <div class="prayer-item"><span class="prayer-name">العصر</span><span class="prayer-time">${t.Asr}</span></div>
            <div class="prayer-item"><span class="prayer-name">المغرب</span><span class="prayer-time">${t.Maghrib}</span></div>
            <div class="prayer-item"><span class="prayer-name">العشاء</span><span class="prayer-time">${t.Isha}</span></div>
        `;
    } catch(e) { }
}
</script>

</body>
</html>
