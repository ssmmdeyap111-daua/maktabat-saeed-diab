<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علوم القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #2c5d87; 
            --accent-light-blue: #add8e6; 
            --gold: #d4af37; 
            --prayer-bg: #fdfae7; 
            --dark-green: #1b5e20;
        }

        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: #f4f7f9; color: #333; }

        /* شريط المعلومات العلوي */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 30px; background: var(--prayer-bg); border-bottom: 2px solid var(--accent-light-blue); }
        .date-info { font-weight: 700; color: var(--primary); font-size: 0.9rem; }
        .prayer-times { display: flex; gap: 8px; }
        .prayer-item { background: white; border: 1px solid #ddd; padding: 4px 8px; border-radius: 6px; text-align: center; }
        .prayer-name { display: block; font-size: 0.65rem; color: #666; font-weight: bold; }
        .prayer-time { font-weight: 900; color: var(--dark-green); font-size: 0.8rem; }

        /* الهيدر واللوجو المصلح */
        .site-header { 
            text-align: center; 
            padding: 20px 0; 
            background-color: var(--accent-light-blue); 
            border-bottom: 4px solid #fff; 
        }
        .site-logo { 
            max-width: 420px; 
            width: 90%; 
            height: auto; 
            display: inline-block;
        }

        /* شريط التنقل الأفقي */
        .main-nav { 
            display: flex; justify-content: center; align-items: center; gap: 12px; padding: 12px; 
            background: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            flex-wrap: nowrap; overflow-x: auto; 
        }
        .nav-link { 
            text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; color: white; 
            display: flex; align-items: center; gap: 6px; background: var(--primary); transition: 0.3s; 
            font-size: 0.85rem; white-space: nowrap;
        }
        .nav-link:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .nav-gold { background: var(--gold); }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px 60px; }
        .page-title { text-align: center; color: var(--primary); font-weight: 900; font-size: 2rem; margin-bottom: 30px; }

        /* الأكورديون */
        .accordion-item { background: white; border-radius: 15px; margin-bottom: 15px; border: 1px solid #ddd; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .accordion-header { padding: 20px 25px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-right: 10px solid var(--gold); background: #fff; }
        .accordion-header span { font-weight: 800; color: var(--primary); font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .accordion-content { display: none; padding: 15px; background: #fcfdfe; border-top: 1px solid #eee; }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: #f0f8ff; border-right-color: var(--primary); }

        /* الدروس */
        .lesson-row { padding: 12px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .lesson-right { flex: 1.5; font-weight: 700; color: var(--primary); }
        .audio-part { flex: 4; }
        audio { width: 100%; height: 35px; }
        .btn-download { color: var(--dark-green); font-size: 1.6rem; text-decoration: none; }

        footer { text-align: center; padding: 30px; background: #e0f2f7; color: var(--primary); font-weight: bold; }

        @media (max-width: 768px) { .lesson-row { flex-direction: column; text-align: center; } .main-nav { flex-wrap: wrap; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="date-info" id="current-date">جاري التحميل...</div>
        <div class="prayer-times" id="prayer-api"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png.jpg" alt="فضيلة الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="main-nav">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="tafseer.html" class="nav-link"><i class="fas fa-book-open"></i> التفسير</a>
        <a href="khutab.html" class="nav-link"><i class="fas fa-microphone-lines"></i> الخطب</a>
        <a href="lessons.html" class="nav-link nav-gold"><i class="fas fa-volume-high"></i> الصوتيات</a>
        <a href="books.html" class="nav-link"><i class="fas fa-book"></i> الكتب</a>
        <a href="articles.html" class="nav-link"><i class="fas fa-pen-nib"></i> المقالات</a>
    </nav>

    <div class="container">
        <h1 class="page-title">علوم القرآن الكريم</h1>

        <div class="accordion-item" id="item-osol">
            <div class="accordion-header" onclick="toggleAccordion('osol')">
                <span><i class="fas fa-book-quran"></i> شرح مقدمة أصول التفسير (27 درساً)</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-content" id="osol-list"></div>
        </div>

        <div class="accordion-item" id="item-nasekh">
            <div class="accordion-header" onclick="toggleAccordion('nasekh')">
                <span><i class="fas fa-scroll"></i> شرح منظومة المنسوخ للسيوطي (10 دروس)</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-content" id="nasekh-list"></div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لموقع الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        function updateDate() {
            const now = new Date();
            const h = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now);
            const m = new Intl.DateTimeFormat('ar-EG', {day:'numeric', month:'long', year:'numeric'}).format(now);
            document.getElementById('current-date').innerText = `${h} هـ | ${m} م`;
        }

        async function getPrayers() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const data = await res.json();
                const t = data.data.timings;
                document.getElementById('prayer-api').innerHTML = [
                    {n:"الفجر", v:t.Fajr}, {n:"الظهر", v:t.Dhuhr}, {n:"العصر", v:t.Asr}, {n:"المغرب", v:t.Maghrib}, {n:"العشاء", v:t.Isha}
                ].map(p => `<div class="prayer-item"><span class="prayer-name">${p.n}</span><span class="prayer-time">${p.v}</span></div>`).join('');
            } catch (e) {}
        }

        function toggleAccordion(key) {
            const item = document.getElementById('item-' + key);
            item.classList.toggle('active');
            if(key === 'osol') renderLessons('osol-list', 'osol-altfser', 27);
            if(key === 'nasekh') renderLessons('nasekh-list', 'nasekh', 10);
        }

        function renderLessons(elementId, prefix, count) {
            const container = document.getElementById(elementId);
            if (container.innerHTML !== "") return;
            for (let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div class="lesson-row">
                        <div class="lesson-right">الدرس (${i})</div>
                        <div class="audio-part"><audio controls preload="none"><source src="audio/${prefix}-${i}.mp3" type="audio/mpeg"></audio></div>
                        <div><a href="audio/${prefix}-${i}.mp3" download class="btn-download"><i class="fas fa-circle-down"></i></a></div>
                    </div>`;
            }
        }

        window.onload = () => { updateDate(); getPrayers(); toggleAccordion('osol'); };
    </script>
</body>
</html>
