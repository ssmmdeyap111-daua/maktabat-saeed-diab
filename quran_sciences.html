<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علوم القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #2c5d87; --accent: #87ceeb; --gold: #d4af37; 
            --bg: #f4f7f9; --prayer-bg: #fdfae7; --dark-green: #1b5e20;
            --header-gradient: linear-gradient(to right, #add8e6, #e0f2f7);
        }

        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover; color: #333; 
        }

        /* شريط المعلومات العلوي */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 8px 30px; background: var(--prayer-bg); border-bottom: 2px solid var(--accent); 
        }
        .date-info { font-weight: 700; color: var(--primary); font-size: 0.95rem; }
        .prayer-times { display: flex; gap: 10px; }
        .prayer-item { background: white; border: 1px solid #ddd; padding: 4px 10px; border-radius: 6px; text-align: center; }
        .prayer-name { display: block; font-size: 0.7rem; color: #666; font-weight: bold; }
        .prayer-time { font-weight: 900; color: var(--dark-green); font-size: 0.85rem; }

        /* الهيدر واللوجو */
        .site-header { text-align: center; padding: 25px 0; background: var(--header-gradient); border-bottom: 3px solid #fff; }
        .site-logo { max-width: 450px; width: 90%; height: auto; mix-blend-mode: multiply; display: inline-block; }

        /* الحل الجذري لتنسيق الأيقونات الأفقي */
        .main-nav { 
            display: flex; justify-content: center; align-items: center;
            gap: 12px; padding: 12px; background: rgba(255, 255, 255, 0.95); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-wrap: nowrap; overflow-x: auto;
        }
        .nav-link { 
            text-decoration: none; padding: 8px 18px; border-radius: 8px; 
            font-weight: 700; color: white; display: flex; align-items: center; 
            gap: 8px; background: var(--primary); transition: 0.3s; font-size: 0.9rem; white-space: nowrap;
        }
        .nav-link:hover { transform: translateY(-3px); filter: brightness(1.2); }
        .nav-gold { background: var(--gold); }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px 60px; }
        .page-title { 
            text-align: center; color: white; font-weight: 900; font-size: 2.2rem; 
            margin-bottom: 35px; background: rgba(44, 93, 135, 0.85); 
            display: block; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* تنسيق السلاسل (الأكورديون) */
        .accordion-item { background: rgba(255, 255, 255, 0.98); border-radius: 15px; margin-bottom: 20px; border: 1px solid #ddd; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .accordion-header { padding: 22px 28px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-right: 10px solid var(--gold); transition: 0.3s; background: #fff; }
        .accordion-header span { font-weight: 800; color: var(--primary); font-size: 1.3rem; display: flex; align-items: center; gap: 12px; }
        .accordion-content { display: none; padding: 20px; background: #fcfdfe; border-top: 1px solid #eee; }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: #f0f8ff; border-right-color: var(--primary); }

        /* تنسيق الدروس ومشغل الصوت الواسع */
        .lesson-row { 
            padding: 15px 25px; border-bottom: 1px solid #f0f0f0; display: flex; 
            align-items: center; justify-content: space-between; gap: 20px; 
        }
        .lesson-row:hover { background: #f8fbff; border-right: 5px solid var(--primary); }
        .lesson-right { flex: 1.5; display: flex; align-items: center; gap: 12px; color: var(--primary); font-weight: 700; }
        .audio-part { flex: 4; display: flex; justify-content: center; }
        audio { width: 100%; max-width: 750px; height: 38px; }
        .download-side { flex: 0.3; text-align: left; }
        .btn-download { color: var(--dark-green); font-size: 1.8rem; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .page-num { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; font-weight: bold; background: #fff; border: 1px solid #ddd; color: var(--primary); }
        .page-num.active { background: var(--primary); color: white; border-color: var(--primary); }

        footer { text-align: center; padding: 40px; color: white; font-weight: bold; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }

        @media (max-width: 900px) {
            .lesson-row { flex-direction: column; text-align: center; }
            .audio-part { width: 100%; }
            .main-nav { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="date-info" id="current-date"></div>
        <div class="prayer-times" id="prayer-api"></div>
    </div>

    <header class="site-header">
        <img src="images/logo.png" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
    </header>

    <nav class="main-nav">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="tafseer.html" class="nav-link"><i class="fas fa-book-open"></i> التفسير</a>
        <a href="khutab.html" class="nav-link"><i class="fas fa-microphone-lines"></i> الخطب</a>
        <a href="lessons.html" class="nav-link nav-gold"><i class="fas fa-volume-high"></i> الصوتيات</a>
        <a href="books.html" class="nav-link"><i class="fas fa-book"></i> الكتب</a>
        <a href="articles.html" class="nav-link"><i class="fas fa-pen-nib"></i> المقالات</a>
    </nav>

    <div class="container">
        <h1 class="page-title">علوم القرآن الكريم</h1>

        <div class="accordion-item" id="item-osol">
            <div class="accordion-header" onclick="toggleAccordion('osol')">
                <span><i class="fas fa-book-quran"></i> شرح مقدمة في أصول التفسير (27 درساً)</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-content">
                <div id="osol-list"></div>
                <div class="pagination" id="osol-pagination"></div>
            </div>
        </div>

        <div class="accordion-item" id="item-nasekh">
            <div class="accordion-header" onclick="toggleAccordion('nasekh')">
                <span><i class="fas fa-scroll"></i> شرح منظومة المنسوخ للسيوطي (10 دروس)</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-content">
                <div id="nasekh-list"></div>
                <div class="pagination" id="nasekh-pagination"></div>
            </div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

    <script>
        function updateDate() {
            const now = new Date();
            const h = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {day:'numeric', month:'long', year:'numeric'}).format(now);
            const m = new Intl.DateTimeFormat('ar-EG', {day:'numeric', month:'long', year:'numeric'}).format(now);
            document.getElementById('current-date').innerText = `${h} هـ | ${m} م`;
        }

        async function getPrayers() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=4');
                const data = await res.json();
                const t = data.data.timings;
                const prayers = [{n:"الفجر", v:t.Fajr}, {n:"الظهر", v:t.Dhuhr}, {n:"العصر", v:t.Asr}, {n:"المغرب", v:t.Maghrib}, {n:"العشاء", v:t.Isha}];
                document.getElementById('prayer-api').innerHTML = prayers.map(p => `
                    <div class="prayer-item"><span class="prayer-name">${p.
