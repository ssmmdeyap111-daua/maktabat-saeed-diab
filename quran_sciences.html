<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شرح أصول التفسير - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --blue: #2c5d87; 
            --3d-green: #2ecc71; 
            --dark-green: #27ae60;
            --gold: #d4af37; 
            --bg: #f4f7f9; 
        }

        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: #333; }

        /* الهيدر */
        .site-header { text-align: center; padding: 20px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 4px solid #fff; }
        .site-logo { max-width: 450px; width: 100%; height: auto; mix-blend-mode: multiply; }

        /* شريط التنقل */
        .main-nav { display: flex; justify-content: center; gap: 10px; padding: 15px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-item { 
            padding: 8px 20px; background: var(--3d-green); color: white; text-decoration: none; 
            border-radius: 10px; font-weight: bold; font-size: 0.9rem; 
            box-shadow: 0 4px 0 var(--dark-green); transition: 0.2s; 
        }
        .nav-item:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--dark-green); }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px 50px; }
        .page-title { 
            text-align: center; color: var(--blue); font-weight: 900; 
            margin-bottom: 35px; font-size: 2.2rem; position: relative;
            padding-bottom: 15px;
        }
        .page-title::after {
            content: ""; display: block; width: 120px; height: 4px; 
            background: var(--gold); margin: 10px auto; border-radius: 2px;
        }

        /* صفوف الدروس */
        .lesson-row { 
            background: white; border-radius: 12px; padding: 15px 20px; 
            margin-bottom: 10px; display: flex; align-items: center; 
            justify-content: space-between; gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #eee;
        }
        .lesson-right { 
            flex: 1; font-weight: 800; color: var(--blue); font-size: 1.1rem;
            display: flex; align-items: center; gap: 10px;
        }
        /* أيقونة خاصة لعلوم القرآن */
        .lesson-right::before {
            content: "\f5da"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            color: var(--gold); font-size: 1.1rem;
        }

        .audio-player { flex: 2; display: flex; justify-content: center; }
        audio { width: 95%; height: 35px; }

        .download-left { flex: 0.2; text-align: left; }
        .btn-download { color: var(--dark-green); font-size: 1.6rem; transition: 0.3s; }
        .btn-download:hover { transform: scale(1.2); color: var(--blue); }

        /* الترقيم */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 30px; flex-wrap: wrap; }
        .page-num { 
            min-width: 40px; height: 40px; border: 1px solid #ddd; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; border-radius: 8px; background: white; 
            font-weight: bold; color: var(--blue);
        }
        .page-num.active { background: var(--blue); color: white; border-color: var(--blue); }

        footer { text-align: center; padding: 40px; background: white; color: var(--blue); font-weight: bold; border-top: 2px solid #eee; }

        @media (max-width: 768px) {
            .lesson-row { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <img src="images/logo.png" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
</header>

<nav class="main-nav">
    <a href="index.html" class="nav-item">الرئيسية</a>
    <a href="lessons.html" class="nav-item">الأقسام الرئيسية</a>
</nav>

<div class="container">
    <h1 class="page-title">شرح أصول التفسير</h1>
    <div id="list"></div>
    <div class="pagination" id="pag"></div>
</div>

<footer>جميع الحقوق محفوظة لموقع فضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>

<script>
    const settings = {
        prefix: "osol-altfser", // تم ضبطه ليتناسب مع osol-altfser-27.mp3
        total: 27,
        perPage: 10
    };

    let current = 1;

    function draw(page) {
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = "";
        
        const start = (page - 1) * settings.perPage + 1;
        const end = Math.min(page * settings.perPage, settings.total);

        for (let i = start; i <= end; i++) {
            const url = `audio/${settings.prefix}-${i}.mp3`;
            listDiv.innerHTML += `
                <div class="lesson-row">
                    <div class="lesson-right">الدرس ${i}</div>
                    <div class="audio-player">
                        <audio controls preload="none"><source src="${url}" type="audio/mpeg"></audio>
                    </div>
                    <div class="download-left">
                        <a href="${url}" download class="btn-download" title="تحميل الملف">
                            <i class="fas fa-cloud-arrow-down"></i>
                        </a>
                    </div>
                </div>`;
        }
        drawPager();
    }

    function drawPager() {
        const pagDiv = document.getElementById('pag');
        pagDiv.innerHTML = "";
        const pages = Math.ceil(settings.total / settings.perPage);

        for (let i = 1; i <= pages; i++) {
            const btn = document.createElement('div');
            btn.className = `page-num ${i === current ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => { 
                current = i; 
                draw(i); 
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            };
            pagDiv.appendChild(btn);
        }
    }

    window.onload = () => draw(1);
</script>

</body>
</html>
