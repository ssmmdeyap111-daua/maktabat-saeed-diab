<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علوم القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --gold: #b59410; --bg: #f4f7f9; }
        body { 
            margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: #333; 
        }

        /* شريط التنقل العلوي بالأيقونات الكبيرة */
        .main-nav {
            background: rgba(255, 255, 255, 0.95);
            display: flex; justify-content: center; gap: 40px;
            padding: 20px; border-bottom: 4px solid var(--primary);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000;
        }
        .nav-item {
            text-decoration: none; color: var(--primary);
            font-weight: 900; font-size: 1.1rem;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            transition: 0.3s;
        }
        .nav-item i { font-size: 2.2rem; color: var(--gold); }
        .nav-item:hover { transform: translateY(-5px); color: var(--gold); }

        .site-header { padding: 30px; text-align: center; }
        .site-header h2 { margin: 0; color: var(--primary); font-size: 2rem; }

        .container { max-width: 900px; margin: 0 auto 50px auto; padding: 0 15px; }
        
        /* تصميم بطاقات الدروس */
        .lesson-card {
            background: white; border-radius: 8px; padding: 15px 25px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; border: 1px solid #e0e6ed;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
        }
        
        .lesson-info { display: flex; align-items: center; gap: 15px; width: 200px; justify-content: flex-end; }
        .lesson-info h3 { margin: 0; font-size: 1rem; color: var(--primary); font-weight: 700; }
        .lesson-info i { color: #bdc3c7; font-size: 1.1rem; }

        .audio-wrapper { flex-grow: 1; display: flex; justify-content: center; }
        audio { width: 90%; height: 38px; }

        .download-wrapper { width: 60px; text-align: left; }
        .btn-down { 
            color: #27ae60; font-size: 1.5rem; transition: 0.3s; 
            display: inline-block; text-decoration: none;
        }
        .btn-down:hover { transform: scale(1.2); }

        @media (max-width: 768px) {
            .main-nav { gap: 15px; padding: 10px; }
            .nav-item i { font-size: 1.5rem; }
            .nav-item { font-size: 0.8rem; }
            .lesson-card { flex-direction: column; gap: 15px; text-align: center; }
            .lesson-info, .audio-wrapper, .download-wrapper { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<nav class="main-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i>الرئيسية</a>
    <a href="lessons.html" class="nav-item"><i class="fas fa-microphone"></i>الدروس</a>
    <a href="khotab.html" class="nav-item"><i class="fas fa-mosque"></i>الخطب</a>
    <a href="articles.html" class="nav-item"><i class="fas fa-pen-nib"></i>المقالات</a>
    <a href="books.html" class="nav-item"><i class="fas fa-book-open"></i>الكتب والمؤلفات</a>
</nav>

<header class="site-header">
    <h2>قسم علوم القرآن</h2>
</header>

<div class="container">
    <div id="lessons-list">
        <div class="lesson-card">
            <div class="lesson-info"><h3>مقدمة في علوم القرآن</h3><i class="fas fa-file-audio"></i></div>
            <div class="audio-wrapper"><audio controls preload="none"><source src="audio/quran_sci_1.mp3" type="audio/mpeg"></audio></div>
            <div class="download-wrapper"><a href="audio/quran_sci_1.mp3" download class="btn-down"><i class="fas fa-cloud-download-alt"></i></a></div>
        </div>

        <div class="lesson-card">
            <div class="lesson-info"><h3>الدرس الثاني</h3><i class="fas fa-file-audio"></i></div>
            <div class="audio-wrapper"><audio controls preload="none"><source src="audio/quran_sci_2.mp3" type="audio/mpeg"></audio></div>
            <div class="download-wrapper"><a href="audio/quran_sci_2.mp3" download class="btn-down"><i class="fas fa-cloud-download-alt"></i></a></div>
        </div>
        
        </div>
</div>

<footer style="text-align:center; padding: 30px; color: #888; font-size: 0.9rem;">
    جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026
</footer>

</body>
</html>
