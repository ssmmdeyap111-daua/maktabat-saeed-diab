<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علوم القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --light-blue: #e3effb; --dark-blue: #2c5d87; --gold: #b59410; --bg-body: #f4f7f9; --green-dl: #27ae60; }
        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }

        /* شريط التنقل العلوي الثابت */
        .main-nav {
            background: white; display: flex; justify-content: center; gap: 40px;
            padding: 15px 0; border-bottom: 4px solid var(--dark-blue);
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
        }
        .nav-item {
            text-decoration: none; color: var(--dark-blue); font-weight: 900;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .nav-item i { font-size: 2rem; color: var(--gold); }

        .header-box { margin-top: 130px; text-align: center; margin-bottom: 30px; }
        .header-box h1 {
            background: var(--dark-blue); color: white; display: inline-block;
            padding: 12px 50px; border-radius: 50px; font-size: 2rem;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px 20px 100px; }

        .accordion-item { background: rgba(255, 255, 255, 0.95); border-radius: 12px; margin-bottom: 20px; border: 1px solid #ddd; overflow: hidden; }
        .accordion-header { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-right: 8px solid var(--gold); background: #fff; }
        .accordion-header span { font-weight: 900; color: var(--dark-blue); font-size: 1.2rem; display: flex; align-items: center; gap: 15px; }
        
        .accordion-content { display: none; padding: 15px; background: #fff; border-top: 1px solid #eee; }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: var(--light-blue); }

        .lesson-row { 
            background: white; border: 1px solid #edf2f7; border-radius: 10px; 
            padding: 10px 15px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
        }
        .lesson-right { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; }
        .audio-player { flex: 2; display: flex; justify-content: center; }
        audio { height: 30px; width: 100%; }
        .btn-download { color: var(--green-dl); font-size: 1.3rem; }

        @media (max-width: 768px) {
            .main-nav { gap: 15px; }
            .nav-item i { font-size: 1.5rem; }
            .lesson-row { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

<nav class="main-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i>الرئيسية</a>
    <a href="lessons.html" class="nav-item"><i class="fas fa-microphone"></i>الدروس</a>
    <a href="khotab.html" class="nav-item"><i class="fas fa-mosque"></i>الخطب</a>
    <a href="articles.html" class="nav-item"><i class="fas fa-pen-nib"></i>المقالات</a>
    <a href="books.html" class="nav-item"><i class="fas fa-book-open"></i>الكتب</a>
</nav>

<div class="header-box">
    <h1>علوم القرآن الكريم</h1>
</div>

<div class="container">
    <div class="accordion-item" id="item-itqan">
        <div class="accordion-header" onclick="toggleAccordion('itqan')">
            <span><i class="fas fa-book-quran"></i> شرح كتاب الإتقان في علوم القرآن (12 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content" id="itqan-list">
            </div>
    </div>

    <div class="accordion-item" id="item-tajweed">
        <div class="accordion-header" onclick="toggleAccordion('tajweed')">
            <span><i class="fas fa-microphone-alt"></i> دروس في قواعد التجويد (10 دروس)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content" id="tajweed-list"></div>
    </div>
</div>

<script>
    const seriesData = {
        itqan: { prefix: 'quran-itqan', count: 12 },
        tajweed: { prefix: 'quran-tajweed', count: 10 }
    };

    function toggleAccordion(key) {
        const item = document.getElementById('item-' + key);
        const isActive = item.classList.contains('active');
        document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
        if (!isActive) {
            item.classList.add('active');
            renderLessons(key);
        }
    }

    function renderLessons(key) {
        const data = seriesData[key];
        const container = document.getElementById(key + '-list');
        if (container.innerHTML !== "") return; // لمنع التكرار

        for (let i = 1; i <= data.count; i++) {
            const fileUrl = `audio/${data.prefix}-${i}.mp3`;
            container.innerHTML += `
                <div class="lesson-row">
                    <a href="${fileUrl}" download class="btn-download"><i class="fas fa-cloud-download-alt"></i></a>
                    <div class="audio-player"><audio controls preload="none"><source src="${fileUrl}" type="audio/mpeg"></audio></div>
                    <div class="lesson-right"><span class="lesson-name">الدرس ${i}</span><i class="fas fa-headphones" style="color:var(--dark-blue)"></i></div>
                </div>`;
        }
    }

    window.onload = () => toggleAccordion('itqan');
</script>

<footer>
    <p style="text-align: center; color: white; padding: 20px;">جميع الحقوق محفوظة &copy; 2026</p>
</footer>

</body>
</html>
