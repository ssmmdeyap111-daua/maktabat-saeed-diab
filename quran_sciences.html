<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علوم القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --light-blue: #e3effb; --dark-blue: #2c5d87; --gold: #b59410; }
        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: url('images/library-bg.jpg') no-repeat center center fixed; 
            background-size: cover;
        }

        /* القائمة العلوية المكبرة الموحدة */
        .main-nav {
            background: rgba(255, 255, 255, 0.98);
            display: flex; justify-content: center; gap: 45px;
            padding: 20px 10px; border-bottom: 4px solid var(--dark-blue);
            position: sticky; top: 0; z-index: 1000;
        }
        .nav-item {
            text-decoration: none; color: var(--dark-blue);
            font-weight: 900; font-size: 1.1rem;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .nav-item i { font-size: 2.6rem; color: var(--gold); }

        .site-header { padding: 50px 20px; text-align: center; }
        .site-header h1 { 
            font-size: 2.2rem; color: white; margin: 0; font-weight: 900; 
            background: #6c8eb0; display: inline-block; padding: 15px 60px; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px 60px; }

        .accordion-item { background: rgba(255, 255, 255, 0.95); border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .accordion-header { padding: 22px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-right: 8px solid var(--gold); transition: 0.3s; }
        .accordion-header span { font-weight: 900; color: var(--dark-blue); font-size: 1.25rem; display: flex; align-items: center; gap: 12px; }
        .accordion-content { display: none; padding: 20px; background: #fff; border-top: 1px solid #eee; }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: var(--light-blue); }

        .lesson-row { 
            background: white; border: 1px solid #edf2f7; border-radius: 10px; 
            padding: 12px 20px; margin-bottom: 10px; display: flex; 
            align-items: center; justify-content: space-between;
        }
        .lesson-right { display: flex; align-items: center; gap: 12px; flex: 1; justify-content: flex-end; }
        .lesson-name { color: var(--dark-blue); font-weight: 700; }
        .audio-player { flex: 2; display: flex; justify-content: center; }
        audio { height: 35px; width: 95%; }
        .btn-download { color: #27ae60; font-size: 1.4rem; text-decoration: none; }

        footer { text-align: center; color: white; padding: 30px; font-weight: bold; text-shadow: 1px 1px 2px black; }
    </style>
</head>
<body>

<nav class="main-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i>الرئيسية</a>
    <a href="lessons.html" class="nav-item"><i class="fas fa-microphone"></i>الدروس</a>
    <a href="khotab.html" class="nav-item"><i class="fas fa-mosque"></i>الخطب</a>
    <a href="articles.html" class="nav-item"><i class="fas fa-pen-nib"></i>المقالات</a>
    <a href="books.html" class="nav-item"><i class="fas fa-book-open"></i>الكتب</a>
</nav>

<header class="site-header">
    <h1>علوم القرآن</h1>
</header>

<div class="container">
    
    <div class="accordion-item" id="item-nasikh">
        <div class="accordion-header" onclick="toggleAccordion('nasikh')">
            <span><i class="fas fa-sync-alt"></i> دروس الناسخ والمنسوخ</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content" id="nasikh-list">
            <div class="lesson-row">
                <div class="download-side"><a href="audio/nasikh-1.mp3" download class="btn-download"><i class="fas fa-cloud-download-alt"></i></a></div>
                <div class="audio-player"><audio controls preload="none"><source src="audio/nasikh-1.mp3" type="audio/mpeg"></audio></div>
                <div class="lesson-right"><span class="lesson-name">الناسخ والمنسوخ - الدرس 1</span><i class="fas fa-file-audio" style="color:#2c5d87"></i></div>
            </div>
            </div>
    </div>

    <div class="accordion-item" id="item-osol">
        <div class="accordion-header" onclick="toggleAccordion('osol')">
            <span><i class="fas fa-book-open"></i> شرح مقدمة في أصول التفسير</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content" id="osol-list">
            <div class="lesson-row">
                <div class="download-side"><a href="audio/osol-1.mp3" download class="btn-download"><i class="fas fa-cloud-download-alt"></i></a></div>
                <div class="audio-player"><audio controls preload="none"><source src="audio/osol-1.mp3" type="audio/mpeg"></audio></div>
                <div class="lesson-right"><span class="lesson-name">أصول التفسير - الدرس 1</span><i class="fas fa-file-audio" style="color:#2c5d87"></i></div>
            </div>
        </div>
    </div>

</div>

<script>
    function toggleAccordion(key) {
        const item = document.getElementById('item-' + key);
        const isActive = item.classList.contains('active');
        document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
        if (!isActive) { item.classList.add('active'); }
    }
</script>

<footer>جميع الحقوق محفوظة لفضيلة الشيخ سعيد مصطفى دياب &copy; 2026</footer>
</body>
</html>
