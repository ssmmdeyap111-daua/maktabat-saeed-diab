<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علوم القرآن - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* التنسيق الجديد الذي سيغير شكل الصفحة تماماً */
        :root {
            --dark-blue: #2c5d87;
            --gold: #b59410;
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
        }

        body { 
            margin: 0; 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--light-bg); 
            direction: rtl;
        }

        /* الهيدر المطور */
        .site-header { 
            background: #e3effb; 
            padding: 40px 20px; 
            text-align: center; 
            border-bottom: 5px solid var(--dark-blue); 
        }
        .site-header h1 { 
            margin: 0; 
            color: var(--dark-blue); 
            font-size: 2.2rem; 
            font-weight: 900; 
        }

        /* أزرار التنقل */
        .nav-bar { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            padding: 20px; 
            background: white; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .btn-link { 
            padding: 10px 20px; 
            background: white; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            text-decoration: none; 
            color: var(--dark-blue); 
            font-weight: bold; 
            transition: 0.3s;
        }
        .btn-link:hover { 
            background: var(--dark-blue); 
            color: white; 
        }

        .container { 
            max-width: 900px; 
            margin: 30px auto; 
            padding: 0 15px; 
        }

        /* شكل الأكورديون الجديد */
        .accordion-item { 
            background: white; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); 
            overflow: hidden; 
        }
        .accordion-header { 
            padding: 20px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: 700; 
            color: var(--dark-blue); 
            background: #fff;
            border-right: 5px solid var(--gold);
        }
        .accordion-header:hover { background: #f1f5f9; }
        
        .accordion-content { 
            display: none; 
            padding: 20px; 
            background: #fafbfc; 
            border-top: 1px solid #eee; 
        }
        .active .accordion-content { display: block; }
        .active .accordion-header { background: #eef5ff; }

        /* قائمة الدروس */
        .lesson-card { 
            background: white; 
            padding: 12px 15px; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid #eee;
        }
        .lesson-card span { font-weight: bold; color: #444; }

        .audio-controls { display: flex; align-items: center; gap: 10px; }
        audio { height: 30px; width: 200px; }

        .download-btn { color: #27ae60; font-size: 1.2rem; text-decoration: none; }

        footer { text-align: center; padding: 40px; color: #888; font-weight: bold; }

        /* للجوال */
        @media (max-width: 600px) {
            .lesson-card { flex-direction: column; gap: 10px; text-align: center; }
            audio { width: 100%; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>دروس علوم القرآن الكريم</h1>
</header>

<div class="nav-bar">
    <a href="index.html" class="btn-link"><i class="fas fa-home"></i> الرئيسية</a>
    <a href="lessons.html" class="btn-link"><i class="fas fa-arrow-right"></i> الفهرس</a>
</div>

<div class="container">
    <div class="accordion-item">
        <div class="accordion-header" onclick="this.parentElement.classList.toggle('active')">
            <span><i class="fas fa-scroll"></i> منظومة ناسخ الحديث ومنسوخه (10 دروس)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div id="nasekh-list"></div>
        </div>
    </div>

    <div class="accordion-item">
        <div class="accordion-header" onclick="this.parentElement.classList.toggle('active')">
            <span><i class="fas fa-book-open"></i> أصول التفسير (27 درساً)</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="accordion-content">
            <div id="osol-list"></div>
        </div>
    </div>
</div>

<script>
    function generate(id, prefix, count) {
        const container = document.getElementById(id);
        let html = '';
        for (let i = 1; i <= count; i++) {
            const url = `audio/${prefix}-${i}.mp3`;
            html += `
            <div class="lesson-card">
                <span>الدرس ${i}</span>
                <div class="audio-controls">
                    <audio controls preload="none"><source src="${url}" type="audio/mpeg"></audio>
                    <a href="${url}" download class="download-btn"><i class="fas fa-download"></i></a>
                </div>
            </div>`;
        }
        container.innerHTML = html;
    }

    // تشغيل التوليد
    generate('nasekh-list', 'nasekh', 10);
    generate('osol-list', 'osol-altfser', 27);
</script>

<footer>
    جميع الحقوق محفوظة &copy; 2026
</footer>

</body>
</html>
