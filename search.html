<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث في الموقع - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #eef5ff;
            --main-blue: #add8e6;
            --dark-blue: #2c5d87;
            --accent-blue: #87ceeb;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(to bottom, var(--light-blue), #d0e4ff);
            min-height: 100vh;
            padding-bottom: 120px;
        }

        /* الهيدر الموحد */
        .site-header { 
            text-align: center; padding: 60px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }
        .sheikh-title { font-size: 2.2rem; color: var(--dark-blue); margin: 0; font-weight: 700; }

        /* صندوق البحث 3D */
        .search-container {
            max-width: 800px;
            margin: -30px auto 40px;
            padding: 0 20px;
            text-align: center;
        }

        .search-box {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            font-family: 'Cairo';
            border: 2px solid white;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            outline: none;
            color: var(--dark-blue);
            transition: 0.3s;
        }

        .search-box:focus {
            box-shadow: 0 15px 35px rgba(135, 206, 235, 0.4);
            transform: translateY(-3px);
        }

        /* نتائج البحث */
        .results-container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .result-item {
            background: white;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-right: 5px solid var(--accent-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-info h3 { margin: 0; color: var(--dark-blue); font-size: 1.1rem; }
        .result-info span { font-size: 12px; color: #888; background: #f0f0f0; padding: 2px 8px; border-radius: 5px; }

        .go-btn {
            background: var(--accent-blue);
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 0 #5f9ea0;
        }

        /* أيقونة العودة الدائرية */
        .back-fixed {
            position: fixed; bottom: 30px; left: 30px;
            width: 65px; height: 65px;
            background: linear-gradient(145deg, #add8e6, #87ceeb);
            color: var(--dark-blue); text-decoration: none;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 28px; box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border: 2px solid #ffffff; transition: 0.3s; z-index: 1000;
        }

        .no-results { text-align: center; color: #888; margin-top: 50px; font-style: italic; }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="sheikh-title">الموقع الرسمي للشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن عنوان درس، خطبة، أو مقال..." onkeyup="performSearch()">
    </div>

    <div class="results-container" id="resultsList">
        <p class="no-results">ابدأ الكتابة للبحث في محتوى الموقع...</p>
    </div>

    <a href="index.html" class="back-fixed" title="الرئيسية">🏠</a>

    <script>
        // مصفوفة بيانات تجريبية (يجب أن تملأها ببيانات موقعك أو تربطها بملفات الـ JS الأخرى)
        const allData = [
            { title: "فضل الدعاء", type: "مقالات", link: "articles.html" },
            { title: "شرح الأصول الثلاثة", type: "توحيد", link: "tawheed.html" },
            { title: "كتاب الطهارة - الدرس 1", type: "فقه", link: "fiqh.html" },
            { title: "خطبة الجمعة: الصبر", type: "خطب", link: "khutbah.html" },
            { title: "تفسير سورة الفاتحة", type: "تفسير", link: "tafseer.html" },
            { title: "الصدق والإخلاص", type: "رقائق", link: "raqaiq.html" }
        ];

        function performSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const container = document.getElementById("resultsList");
            container.innerHTML = "";

            if (query === "") {
                container.innerHTML = '<p class="no-results">ابدأ الكتابة للبحث في محتوى الموقع...</p>';
                return;
            }

            const filtered = allData.filter(item => item.title.toLowerCase().includes(query));

            if (filtered.length === 0) {
                container.innerHTML = '<p class="no-results">عذراً، لم يتم العثور على نتائج تطابق بحثك.</p>';
            } else {
                filtered.forEach(item => {
                    container.innerHTML += `
                        <div class="result-item">
                            <div class="result-info">
                                <span>${item.type}</span>
                                <h3>${item.title}</h3>
                            </div>
                            <a href="${item.link}" class="go-btn">انتقال ⬅️</a>
                        </div>
                    `;
                });
            }
        }
    </script>

</body>
</html>
