<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث الشامل - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #eef5ff;
            --main-blue: #add8e6;
            --dark-blue: #2c5d87;
            --accent-blue: #87ceeb;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(to bottom, var(--light-blue), #d0e4ff);
            min-height: 100vh;
        }

        /* الهيدر الموحد */
        .site-header { 
            text-align: center; padding: 60px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }
        .sheikh-title { font-size: 2.2rem; color: var(--dark-blue); margin: 0; font-weight: 700; }

        /* صندوق البحث */
        .search-container {
            max-width: 800px;
            margin: -30px auto 40px;
            padding: 0 20px;
        }

        .search-box {
            width: 100%;
            padding: 18px 25px;
            font-size: 18px;
            font-family: 'Cairo';
            border: 2px solid white;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            outline: none;
            color: var(--dark-blue);
            box-sizing: border-box;
        }

        /* النتائج */
        .results-container {
            max-width: 850px;
            margin: auto;
            padding: 20px;
        }

        .result-item {
            background: white;
            margin-bottom: 15px;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-right: 5px solid var(--accent-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-info h3 { margin: 0; color: var(--dark-blue); font-size: 1.1rem; }
        .result-tag { font-size: 11px; background: var(--light-blue); color: var(--dark-blue); padding: 2px 10px; border-radius: 20px; font-weight: bold; }

        .go-btn {
            background: var(--accent-blue);
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 3px 0 #5f9ea0;
        }

        .back-fixed {
            position: fixed; bottom: 30px; left: 30px;
            width: 60px; height: 60px;
            background: linear-gradient(145deg, #add8e6, #87ceeb);
            color: var(--dark-blue); text-decoration: none;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border: 2px solid #ffffff; z-index: 1000;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="sheikh-title">الموقع الرسمي للشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن درس، خطبة، أو باب فقهي..." onkeyup="startSearch()">
    </div>

    <div class="results-container" id="resultsList">
        <p style="text-align: center; color: #888;">اكتب كلمة للبحث (مثلاً: الصلاة، الزكاة، الموت...)</p>
    </div>

    <a href="index.html" class="back-fixed">🏠</a>

    <script src="fiqhData.js"></script>
    <script src="khutbahData.js"></script>
    <script src="faraidData.js"></script>
    <script>
        // 1. تجميع كل البيانات في مصفوفة واحدة ضخمة عند تحميل الصفحة
        let masterData = [];

        window.onload = () => {
            // دمج دروس الفقه
            if (typeof fiqhLessons !== 'undefined') {
                fiqhLessons.forEach(l => masterData.push({ title: l.title, link: 'fiqh.html', tag: 'فقه' }));
            }
            // دمج الخطب
            if (typeof khutbahLessons !== 'undefined') {
                khutbahLessons.forEach(l => masterData.push({ title: l.title, link: 'khutbah.html', tag: 'خطب' }));
            }
            // دمج الفرائض
            if (typeof faraidLessons !== 'undefined') {
                faraidLessons.forEach(l => masterData.push({ title: l.title, link: 'faraid.html', tag: 'فرائض' }));
            }
            // أضف أي أقسام أخرى بنفس الطريقة
        };

        function startSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const container = document.getElementById("resultsList");
            container.innerHTML = "";

            if (query.length < 2) return; // يبدأ البحث بعد كتابة حرفين

            const filtered = masterData.filter(item => item.title.toLowerCase().includes(query));

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">لم يتم العثور على نتائج.</p>';
            } else {
                filtered.forEach(item => {
                    container.innerHTML += `
                        <div class="result-item">
                            <div class="result-info">
                                <span class="result-tag">${item.tag}</span>
                                <h3 style="margin-top:5px;">${item.title}</h3>
                            </div>
                            <a href="${item.link}" class="go-btn">عرض ⬅️</a>
                        </div>
                    `;
                });
            }
        }
    </script>
</body>
</html>
