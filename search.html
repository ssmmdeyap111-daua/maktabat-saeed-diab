<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>البحث في الموقع</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<h2 style="text-align:center;">نتائج البحث</h2>

<div class="search-box">
<input type="text" id="searchInput" placeholder="اكتب كلمة البحث..." onkeyup="searchSite()">
</div>

<div id="results"></div>

<script src="search-data.js"></script>

<script>
function searchSite() {

let input = document.getElementById("searchInput").value.toLowerCase();
let results = document.getElementById("results");

results.innerHTML = "";

siteData.forEach(item => {

if(item.title.toLowerCase().includes(input)){

results.innerHTML += `
<div class="card">
<a href="${item.link}">
<h3>${item.title}</h3>
<p>${item.category}</p>
</a>
</div>
`;

}

});

}
</script>

</body>
</html>
