<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلسلة الهدي النبوي في العبادات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --blue:#2c5d87;
    --gold:#d4af37;
    --bg:#f4f7f9;
}

body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:var(--bg);
}

/* ===== TOP BAR ===== */
.top-bar{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    background:#fff;
    padding:10px;
    border-bottom:2px solid #eee;
    font-size:14px;
}

/* ===== NAV ===== */
.nav{
    background:var(--blue);
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    padding:10px;
}
.nav a{
    color:#fff;
    text-decoration:none;
    padding:8px 14px;
    border-radius:8px;
    background:rgba(255,255,255,0.1);
}
.nav a:hover{background:var(--gold);color:#000}

/* HEADER */
header{
    text-align:center;
    padding:20px;
}
header img{
    max-width:280px;
}

/* SEARCH */
.search-box{
    text-align:center;
    margin:10px;
}
.search-box input{
    width:80%;
    max-width:400px;
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

/* TITLE */
h1{
    text-align:center;
    color:var(--blue);
    font-size:1.8rem;
}

/* LESSONS */
.lesson{
    background:#fff;
    margin:10px auto;
    max-width:900px;
    padding:15px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-right:5px solid var(--gold);
}

.lesson audio{
    width:250px;
}

/* BUTTONS */
.ctrl{
    display:flex;
    gap:5px;
}
.ctrl button{
    padding:6px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){
    .lesson{flex-direction:column;gap:10px}
    .lesson audio{width:100%}
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
    <div id="date"></div>
    <div id="hijri"></div>
    <div id="prayer">مواقيت الصلاة: جارٍ التحميل...</div>
</div>

<!-- NAV -->
<div class="nav">
    <a href="index.html">الرئيسية</a>
    <a href="tafsir.html">التفسير</a>
    <a href="audio.html">الصوتيات</a>
    <a href="khutab.html">الخطب</a>
    <a href="articles.html">المقالات</a>
</div>

<header>
    <img src="images/logo.png.jpg">
</header>

<h1>سلسلة الهدي النبوي في العبادات</h1>

<div class="search-box">
    <input type="text" id="search" placeholder="ابحث عن درس...">
</div>

<div id="count" style="text-align:center;margin:10px;"></div>

<div id="lessons"></div>

<script>

// ===== DATA (أفضل من التخمين) =====
const files = [
    "alhady-alnabwy-1.mp3",
    "alhady-alnabwy-2.mp3",
    "alhady-alnabwy-3.mp3"
];

// ===== BUILD LESSONS =====
const container = document.getElementById("lessons");

function render(list){
    container.innerHTML = "";

    list.forEach((file,i)=>{

        const div = document.createElement("div");
        div.className = "lesson";

        div.innerHTML = `
            <audio controls preload="none">
                <source src="audio/${file}" type="audio/mpeg">
            </audio>

            <div>
                الدرس رقم ${i+1}
            </div>

            <div class="ctrl">
                <button onclick="playPrev(${i})">⏮</button>
                <button onclick="playNext(${i})">⏭</button>
            </div>
        `;

        container.appendChild(div);
    });

    document.getElementById("count").innerText =
    "عدد الدروس المتاحة: " + list.length;
}

render(files);

// ===== SEARCH =====
document.getElementById("search").addEventListener("input",function(){
    const val = this.value;
    const filtered = files.filter((f,i)=>
        ("الدرس رقم "+(i+1)).includes(val)
    );
    render(filtered);
});

// ===== NEXT / PREV =====
function playNext(i){
    const audios = document.querySelectorAll("audio");
    if(audios[i+1]) audios[i+1].play();
}
function playPrev(i){
    const audios = document.querySelectorAll("audio");
    if(audios[i-1]) audios[i-1].play();
}

// ===== DATE =====
document.getElementById("date").innerText =
"ميلادي: " + new Date().toLocaleDateString('ar-EG');

document.getElementById("hijri").innerText =
"هجري: " + new Intl.DateTimeFormat('ar-SA-u-ca-islamic').format(new Date());


// ===== PRAYER TIMES (API مجاني) =====
fetch("https://api.aladhan.com/v1/timingsByCity?city=Doha&country=Qatar&method=3")
.then(r=>r.json())
.then(data=>{
    const t = data.data.timings;
    document.getElementById("prayer").innerText =
    "الفجر " + t.Fajr + " | الظهر " + t.Dhuhr + " | العصر " + t.Asr + " | المغرب " + t.Maghrib + " | العشاء " + t.Isha;
});

// ===== OPTIONAL: HIDE MISSING FILES =====
document.addEventListener("error",function(e){
    if(e.target.tagName==="SOURCE"){
        e.target.parentElement.parentElement.style.display="none";
    }
},true);

</script>

</body>
</html>
