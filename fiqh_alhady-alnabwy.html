
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلسلة الهدي النبوي في العبادات - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-sky: #f4f7f9; --accent-blue: #87ceeb; --dark-blue: #2c5d87;
            --gold-color: #d4af37; --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); color: #333; }
        
        .site-header { text-align: center; padding: 20px; background: var(--header-bg); border-bottom: 4px solid #fff; }
        .site-logo { max-width: 400px; width: 100%; mix-blend-mode: multiply; }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        
        .back-btn-container { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .back-btn {
            padding: 12px 26px; background: var(--dark-blue); color: white; 
            text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 1rem;
            transition: 0.3s; display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 0 #183752;
        }
        .back-btn:hover { background: var(--gold-color); box-shadow: 0 4px 0 #8c6d1a; transform: translateY(-1px); }

        .series-title { color: var(--dark-blue); text-align: center; font-weight: 900; margin-bottom: 40px; font-size: 2rem; }

        .lessons-list { display: flex; flex-direction: column; gap: 15px; }
        .lesson-item {
            background: white; padding: 15px 30px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-right: 5px solid var(--gold-color);
            border-left: 1px solid #eee; border-top: 1px solid #eee; border-bottom: 1px solid #eee;
        }
        .lesson-info h4 { margin: 0; color: var(--dark-blue); font-size: 1.1rem; font-weight: bold; }
        
        .audio-player { width: 100%; max-width: 350px; height: 40px; }

        @media (max-width: 600px) {
            .lesson-item { flex-direction: column-reverse; text-align: center; gap: 15px; padding: 20px; }
            .audio-player { max-width: 100%; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <img src="images/logo.png" alt="الشيخ سعيد مصطفى دياب" class="site-logo">
</header>

<div class="container">
    <div class="back-btn-container">
        <a href="fiqh.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة لقسم الفقه</a>
    </div>
    
    <h1 class="series-title">سلسلة الهدي النبوي في العبادات</h1>

    <div id="lessons-container" class="lessons-list">
        </div>
</div>

<script>
    const container = document.getElementById('lessons-container');
    const totalLessons = 40;

    for (let i = 1; i <= totalLessons; i++) {
        const lessonDiv = document.createElement('div');
        lessonDiv.className = 'lesson-item';
        
        lessonDiv.innerHTML = `
            <audio controls class="audio-player" preload="none">
                <source src="alhady-alnabwy/alhady-alnabwy-${i}.mp3" type="audio/mpeg">
                <source src="alhady-alnabwy-${i}.mp3" type="audio/mpeg">
                متصفحك لا يدعم تشغيل الصوت.
            </audio>
            <div class="lesson-info">
                <h4>الدرس رقم ${i}</h4>
            </div>
        `;
        container.appendChild(lessonDiv);
    }
</script>

</body>
</html>
