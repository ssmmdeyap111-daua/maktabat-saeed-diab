
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفسير سورة البقرة - المنهج الجديد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #eef5ff; text-align: center; padding: 20px; }
        .card { background: white; padding: 20px; margin: 15px auto; max-width: 650px; border-radius: 12px; border-right: 8px solid #2c5d87; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        audio { width: 100%; margin: 10px 0; }
        .download { color: white; background: #27ae60; padding: 8px 20px; text-decoration: none; border-radius: 6px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>
    <h1 style="color:#2c5d87;">تفسير سورة البقرة (13 درساً مصلحاً)</h1>
    <p>هذا الملف الجديد لتجاوز مشكلة تعليق الصفحة القديمة</p>

    <script>
        const local = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        local.forEach(n => {
            document.write(`
                <div class="card">
                    <h3>سورة البقرة - الدرس ${n}</h3>
                    <audio controls preload="none"><source src="audio/bakara-${n}.mp3" type="audio/mpeg"></audio>
                    <a href="audio/bakara-${n}.mp3" download class="download">تحميل الدرس ${n}</a>
                </div>
            `);
        });
    </script>

    <script>
        const archive = [
            {n:10, url:"https://archive.org/download/bakara-10_202602/bakara-10.mp3"},
            {n:11, url:"https://archive.org/download/bakara-11_202602/bakara-11.mp3"},
            {n:12, url:"https://archive.org/download/bakara-10_202602/bakara-12.mp3"},
            {n:13, url:"https://archive.org/download/bakara-10_202602/bakara-13.mp3"}
        ];
        archive.forEach(item => {
            document.write(`
                <div class="card">
                    <h3>سورة البقرة - الدرس ${item.n}</h3>
                    <audio controls preload="none"><source src="${item.url}" type="audio/mpeg"></audio>
                    <a href="${item.url}" download class="download">تحميل الدرس ${item.n}</a>
                </div>
            `);
        });
    </script>

    <br><br>
    <a href="index.html" style="color:#2c5d87; font-weight:bold; text-decoration:none;">← العودة للرئيسية</a>
</body>
</html>
