<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أنوار الأذكار - الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #2c5d87; --sky: #87CEEB; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #f0f7fa; direction: rtl; }
        .site-header { text-align: center; padding: 20px; background: #add8e6; }
        .site-logo { max-width: 400px; width: 100%; mix-blend-mode: multiply; }
        .container { max-width: 900px; margin: 30px auto; padding: 20px; }
        .lesson-row { 
            background: white; margin-bottom: 10px; padding: 15px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between; gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-right: 6px solid var(--sky);
        }
        .lesson-text { font-weight: 700; color: var(--primary); flex: 1; }
        audio { height: 35px; width: 200px; }
        .download-btn { color: #27ae60; font-size: 1.5rem; text-decoration: none; }
        .back-btn { display: block; width: fit-content; margin: 20px auto; padding: 10px 20px; background: var(--primary); color: white; border-radius: 8px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <header class="site-header"><img src="images/logo.png.jpg" class="site-logo"></header>
    <div class="container">
        <h2 style="text-align:center; color:var(--primary)">سلسلة أنوار الأذكار</h2>
        <div id="list"></div>
        <a href="raqaeq.html" class="back-btn">عودة لقسم الرقائق</a>
    </div>
    <script>
        const list = document.getElementById('list');
        for (let i = 1; i <= 30; i++) {
            const file = `audio/azkar${i}.mp3`;
            list.innerHTML += `<div class="lesson-row">
                <span class="lesson-text">الدرس رقم (${i})</span>
                <audio controls preload="none"><source src="${file}" type="audio/mpeg"></audio>
                <a href="${file}" download class="download-btn"><i class="fas fa-circle-down"></i></a>
            </div>`;
        }
    </script>
</body>
</html>
