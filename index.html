/* شريط الآية */
.ayah-bar {
    width: 100%;
    overflow: hidden;
    background: #d0e4ff;
    border-bottom: 1px solid #b0d4f0;
    padding: 16px 0;
    margin-bottom: 30px;
}

.ayah-slider {
    display: flex;
    width: max-content;
    animation: ayahMove 25s linear infinite reverse; /* عكس الاتجاه */
}

.ayah-slider span {
    font-size: 26px;
    font-weight: bold;
    color: #065f46;
    white-space: nowrap;
    margin-right: 60px;
    font-family: "Amiri", serif;
}

@keyframes ayahMove {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

/* شريط الكتب */
.books-wrapper {
    position: relative;
    overflow: hidden;
    width: 90%;
    margin: auto;
    background: #e6f2fa;
    padding: 20px 0;
    border-radius: 12px;
}

.books-slider {
    display: flex;
    transition: transform 0.3s ease-in-out;
}

.book-slide {
    flex: 0 0 auto;
    width: 150px;
    margin: 0 12px;
    text-align: center;
}

.book-slide img {
    width: 100%;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}

.book-slide img:hover {
    transform: scale(1.08);
}

/* الأسهم */
.book-prev, .book-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background:#4aa3d6;
    color:white;
    font-size:24px;
    width:50px;
    height:50px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
    z-index:10;
}

.book-prev:hover, .book-next:hover {
    background:#3a8ec2;
}

.book-prev { left:10px; }
.book-next { right:10px; }

/* أسفل الصفحة */
footer {
    text-align:center;
    padding:20px;
    background:#3fa1d6;
    color:white;
    margin-top:40px;
}

</style>
</head>
<body>

<div class="header-bar">
    <div class="site-title">موقع الشيخ سعيد مصطفى دياب الرسمي</div>
    <div class="top-icons">
        <a href="books.html">الكتب</a>
        <a href="articles.html">المقالات</a>
        <a href="lessons.html">الدروس</a>
    </div>
</div>

<div class="ayah-bar">
    <div class="ayah-slider">
       
        <span>قال الله تعالى: ﴿قُلْ ‌هذِهِ ‌سَبِيلِي أَدْعُوا إِلَى اللَّهِ عَلى بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي وَسُبْحانَ اللَّهِ وَما أَنَا مِنَ الْمُشْرِكِينَ (108)﴾. سورة يوسف</span>
       
    </div>
</div>

<h2 style="text-align:center; margin:30px 0;">أحدث الكتب</h2>

<div class="books-wrapper">
    <div class="book-prev">&#10094;</div>
    <div class="book-next">&#10095;</div>
    <div class="books-slider">
        <div class="book-slide"><img src="images/al-arbon-veal-amthal.jpg.jpg"></div>
        <div class="book-slide"><img src="images/al-eatbaar-ptraef-alakbaar.jpg.jpg"></div>
        <div class="book-slide"><img src="images/al-ilmam-siyam.jpg"></div>
        <div class="book-slide"><img src="images/al-irshad.jpg"></div>
        <div class="book-slide"><img src="images/allaalea-wa-aldorr.jpg.jpg"></div>
        <div class="book-slide"><img src="images/asaleeb-alquran.jpg"></div>
        <div class="book-slide"><img src="images/fadhl-duaa.jpg"></div>
        <div class="book-slide"><img src="images/ithaf-ahl-alrusoukh.jpg.jpg"></div>
        <div class="book-slide"><img src="images/kabar-al-ahad.jpg.jpg"></div>
        <div class="book-slide"><img src="images/kashf-alnqab.jpg"></div>
        <div class="book-slide"><img src="images/katar-al-reba.jpg.jpg"></div>
        <div class="book-slide"><img src="images/shmael-al-rasool.jpg.jpg"></div>
        <div class="book-slide"><img src="images/tamam-al-minah.jpg"></div>
        <div class="book-slide"><img src="images/tazkirat-al-abaha.jpg.jpg"></div>
        <div class="book-slide"><img src="images/wageb-al-muslmeen.jpg.jpg"></div>
    </div>
</div>

<footer>
&copy; الحقوق محفوظة للشيخ سعيد مصطفى دياب
</footer>

<script>
const slider = document.querySelector('.books-slider');
const prev = document.querySelector('.book-prev');
const next = document.querySelector('.book-next');
let scrollAmount = 0;
const slideWidth = 174; // عرض الكتاب + المارجن

prev.addEventListener('click', () => {
    scrollAmount = Math.max(scrollAmount - slideWidth, 0);
    slider.style.transform = `translateX(-${scrollAmount}px)`;
});

next.addEventListener('click', () => {
    const maxScroll = slider.scrollWidth - slider.parentElement.offsetWidth;
    scrollAmount = Math.min(scrollAmount + slideWidth, maxScroll);
    slider.style.transform = `translateX(-${scrollAmount}px)`;
});
</script>

</body>
</html>
