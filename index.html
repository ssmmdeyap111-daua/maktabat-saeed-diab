<div class="header-bar">
    <h1 class="site-title">موقع الشيخ سعيد مصطفى دياب الرسمي</h1>
    
    <div class="button-grid">
        <a href="index.html" class="btn">الرئيسية</a>

</div>

<!-- ====== شريط الآية ====== -->
<div class="ayah-bar">
    <div class="ayah-slider reverse">
        <span>﴿ إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ ﴾</span>
        <span>﴿ إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ ﴾</span>
    </div>
</div>

<!-- ====== شريط الكتب مع الأسهم ====== -->
<h2 style="text-align:center; margin:30px 0; color: #000;">أحدث الكتب</h2>

<div class="books-slider-wrapper">
    <button class="scroll-btn left-btn">&#8592;</button>

    <div class="books-slider" id="booksSlider">
        <div class="book-slide"><img src="images/al-arbon-veal-amthal.jpg" alt="كتاب 1"></div>
        <div class="book-slide"><img src="images/al-eatbaar-ptraef-alakbaar.jpg" alt="كتاب 2"></div>
        <div class="book-slide"><img src="images/al-ilmam-siyam.jpg" alt="كتاب 3"></div>
        <div class="book-slide"><img src="images/al-irshad.jpg" alt="كتاب 4"></div>
        <div class="book-slide"><img src="images/allaalea-wa-aldorr.jpg" alt="كتاب 5"></div>
        <div class="book-slide"><img src="images/asaleeb-alquran.jpg" alt="كتاب 6"></div>
        <div class="book-slide"><img src="images/fadhl-duaa.jpg" alt="كتاب 7"></div>
        <div class="book-slide"><img src="images/ithaf-ahl-alrusoukh.jpg" alt="كتاب 8"></div>
        <div class="book-slide"><img src="images/kabar-al-ahad.jpg" alt="كتاب 9"></div>
        <div class="book-slide"><img src="images/kashf-alnqab.jpg" alt="كتاب 10"></div>
        <div class="book-slide"><img src="images/katar-al-reba.jpg" alt="كتاب 11"></div>

        <div class="book-slide"><img src="images/tamam-al-minah.jpg" alt="كتاب 13"></div>
        <div class="book-slide"><img src="images/tazkirat-al-abaha.jpg" alt="كتاب 14"></div>
        <div class="book-slide"><img src="images/wageb-al-muslmeen.jpg" alt="كتاب 15"></div>
    </div>

    <button class="scroll-btn right-btn">&#8594;</button>
</div>

<!-- ====== حقوق النشر أسفل الصفحة ====== -->
<footer class="footer">
    © جميع الحقوق محفوظة للشيخ سعيد مصطفى دياب
</footer>

<!-- ====== JavaScript لتفعيل الأسهم ====== -->
<script>
const slider = document.getElementById('booksSlider');
const leftBtn = document.querySelector('.left-btn');
const rightBtn = document.querySelector('.right-btn');

const scrollAmount = 300;

leftBtn.addEventListener('click', () => {
    slider.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
});

rightBtn.addEventListener('click', () => {
    slider.scrollBy({ left: scrollAmount, behavior: 'smooth' });
});
</script>

</body>
