<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع الشيخ سعيد مصطفى دياب الرسمي</title>
<link rel="stylesheet" href="css/style.css">

<style>

body{
margin:0;
font-family:'Noto Kufi Arabic',sans-serif;
background: linear-gradient(to bottom,#c0e0f0,#e6f2fa);
}

/* الهيدر */
.header-bar{
background: linear-gradient(to right,#3fa1d6,#70c0e8);
color:white;
padding:80px 20px 40px;
text-align:center;
}

.site-title{
font-size:32px;
}

/* الأيقونات */
.main-icons{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
margin:20px 0;
}

.icon-btn{
display:flex;
justify-content:center;
align-items:center;
width:110px;
height:50px;
background: linear-gradient(145deg,#4aa3d6,#3a8ec2);
color:white;
text-decoration:none;
font-size:18px;
font-weight:bold;
border-radius:12px;
box-shadow:4px 4px 10px rgba(0,0,0,0.3),
           inset -2px -2px 5px rgba(255,255,255,0.2);
transition:0.3s;
}

.icon-btn:hover{
transform:translateY(-6px);
}

/* شريط الآية */
.ayah-bar{
width:100%;
overflow:hidden;
background:#d0e4ff;
padding:16px 0;
margin-bottom:30px;
}

.ayah-slider{
display:flex;
width:max-content;
animation: ayahMove 25s linear infinite reverse;
}

.ayah-slider span{
font-size:26px;
font-weight:bold;
color:#065f46;
white-space:nowrap;
margin-right:60px;
}

@keyframes ayahMove{
from{ transform:translateX(100%);}
to{ transform:translateX(-100%);}
}

/* مربع البحث */
.search-wrapper{
display:flex;
justify-content:center;
margin:30px 0;
}

#searchInput{
width:60%;
max-width:500px;
padding:16px 25px;
font-size:18px;
border:none;
border-radius:50px;
outline:none;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
box-shadow:0 8px 20px rgba(0,0,0,0.15);
text-align:center;
transition:0.3s;
}

#searchInput:focus{
width:65%;
background:rgba(255,255,255,0.3);
}

/* الكتب */
.books-wrapper{
position:relative;
overflow:hidden;
width:90%;
margin:auto;
background:#e6f2fa;
padding:20px 0;
border-radius:12px;
}

.books-slider{
display:flex;
transition:0.3s;
}

.book-slide{
flex:0 0 auto;
width:150px;
margin:0 12px;
text-align:center;
}

.book-slide img{
width:100%;
border-radius:8px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
transition:0.3s;
}

.book-slide img:hover{
transform:scale(1.08);
}

.book-prev,.book-next{
position:absolute;
top:50%;
transform:translateY(-50%);
background:#4aa3d6;
color:white;
font-size:24px;
width:50px;
height:50px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
}

.book-prev{ left:10px;}
.book-next{ right:10px;}

footer{
text-align:center;
padding:20px;
background:#3fa1d6;
color:white;
margin-top:40px;
}

</style>
</head>

<body>

<div class="header-bar">
<div class="site-title">موقع الشيخ سعيد مصطفى دياب الرسمي</div>
</div>

<!-- الأيقونات -->
<div class="main-icons">
<a href="index.html" class="icon-btn">الرئيسية</a>
<a href="books.html" class="icon-btn">الكتب</a>
<a href="articles.html" class="icon-btn">المقالات</a>
<a href="lessons.html" class="icon-btn">الدروس</a>
<a href="tafseer.html" class="icon-btn">التفسير</a>
<a href="khutbah.html" class="icon-btn">الخطب</a>
<a href="about.html" class="icon-btn">من نحن</a>
<a href="contact.html" class="icon-btn">تواصل</a>
</div>

<!-- شريط الآية القرآنية -->
<div class="ayah-bar">
    <div class="ayah-slider">
        <span>
قال الله تعالى: ﴿قُلْ هذِهِ سَبِيلِي أَدْعُوا إِلَى اللَّهِ...﴾
        </span>
    </div>
</div>

<!-- خانة البحث -->
<div class="search-wrapper">
  <input type="text"
  placeholder="🔍 ابحث في الموقع ..."
  onclick="window.location.href='search.html'">
</div>


<!-- الكتب -->
<h2 style="text-align:center;">أحدث الكتب</h2>

<div class="books-wrapper">

<div class="book-prev">&#10094;</div>

<div class="books-slider">

<div class="book-slide"><img src="images/al-irshad.jpg"></div>
<div class="book-slide"><img src="images/asaleeb-alquran.jpg"></div>
<div class="book-slide"><img src="images/fadhl-duaa.jpg"></div>

</div>

<div class="book-next">&#10095;</div>

</div>

<footer>
© جميع الحقوق محفوظة
</footer>

<script>

const slider=document.querySelector('.books-slider');
const prev=document.querySelector('.book-prev');
const next=document.querySelector('.book-next');

let scrollAmount=0;
const slideWidth=174;

prev.onclick=()=>{
scrollAmount=Math.max(scrollAmount-slideWidth,0);
slider.style.transform=`translateX(-${scrollAmount}px)`;
}

next.onclick=()=>{
const maxScroll=slider.scrollWidth-slider.parentElement.offsetWidth;
scrollAmount=Math.min(scrollAmount+slideWidth,maxScroll);
slider.style.transform=`translateX(-${scrollAmount}px)`;
}

</script>

</body>
</html>
