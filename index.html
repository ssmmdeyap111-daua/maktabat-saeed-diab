<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #eef5ff; /* اللون اللبني الفاتح جداً للخلفية */
            --accent-blue: #87ceeb; /* نفس لون أيقونات صفحة الدروس */
            --dark-blue: #2c5d87;
            --shadow-blue: #5f9ea0; /* لون ظل الأيقونات 3D */
        }

        body { 
            margin: 0; 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(to bottom, var(--light-sky), #d0e4ff); 
            color: #333; 
            min-height: 100vh;
        }
        
        /* 1. شريط اسم الموقع */
        .site-header {
            text-align: center; 
            padding: 60px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }
        .site-header h1 {
            margin: 0; font-size: 2.5rem; font-weight: 900;
            color: var(--dark-blue);
        }

        /* 2. الأيقونات (مطابقة تماماً لصفحة الدروس - مستطيلة 3D) */
        .nav-bar { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            padding: 30px 20px; 
            flex-wrap: wrap; 
        }
        .nav-link-3d { 
            padding: 15px 25px; 
            background: var(--accent-blue); 
            color: white; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: bold;
            font-size: 1.1rem;
            min-width: 130px;
            text-align: center;
            box-shadow: 0 5px 0 var(--shadow-blue); /* تأثير 3D */
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .nav-link-3d:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--shadow-blue); }
        .nav-link-3d:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow-blue); }
        .nav-link-3d i { font-size: 1.8rem; } /* أيقونات فقط بدون صور */

        /* 3. شريط الآية (عريض وشفاف) */
        .quran-strip {
            background: rgba(44, 93, 135, 0.75); 
            color: white; 
            padding: 25px 0; 
            text-align: center;
            font-size: 1.5rem; 
            font-weight: bold; 
            margin: 30px 0;
            backdrop-filter: blur(8px);
        }

        /* 4. شريط الكتب الموسع (من اليمين للشمال) */
        .books-container-wide { 
            width: 96%; 
            margin: 40px auto; 
        }
        .books-container-wide h3 { color: var(--dark-blue); margin-bottom: 20px; font-weight: 900; }
        
        .slider-box {
            display: flex; 
            align-items: center; 
            background: rgba(255, 255, 255, 0.4);
            padding: 25px 10px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .arrow { font-size: 40px; color: var(--dark-blue); cursor: pointer; transition: 0.3s; }
        .arrow:hover { transform: scale(1.2); color: var(--accent-blue); }
        
        .books-scroll {
            display: flex; 
            gap: 20px; 
            overflow-x: auto; 
            scroll-behavior: smooth;
            scrollbar-width: none; 
            flex: 1;
        }
        .books-scroll::-webkit-scrollbar { display: none; }
        
        .book-img {
            width: 145px; 
            height: 210px; 
            object-fit: cover;
            border-radius: 10px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 3px solid #fff; 
            transition: 0.3s;
        }
        .book-img:hover { transform: scale(1.05) rotate(1deg); }

        /* 5. وسائل التواصل */
        .social-section { text-align: center; padding: 40px 0; }
        .social-flex { display: flex; justify-content: center; gap: 20px; }
        .s-icon { 
            font-size: 28px; color: white; width: 60px; height: 60px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .s-icon:hover { transform: translateY(-5px); }
        .fb { background: #1877F2; } .wa { background: #25D366; } .tg { background: #229ED9; }

        /* 6. الحقوق */
        .footer {
            background: var(--dark-blue); 
            color: white; 
            text-align: center;
            padding: 25px; 
            font-weight: bold;
            font-size: 0.95rem;
        }
    </style>
</head>
