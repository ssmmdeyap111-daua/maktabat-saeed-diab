<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع الرسمي للشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Noto+Kufi+Arabic:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Kufi Arabic', sans-serif; background: linear-gradient(to bottom, #eef5ff, #d0e4ff); min-height: 100vh; overflow-x: hidden; }
        
        /* الشريط العلوي الضخم */
        .site-header { 
            text-align: center; 
            padding: 90px 20px; 
            background: linear-gradient(to right, #70c0e8, #a2d9ff); 
            border-bottom: 5px solid #ffffff; 
        }
        .sheikh-title { 
            font-family: 'Reem Kufi', sans-serif; 
            font-size: 3.8rem; 
            color: #1a508b; 
            margin: 0; 
            white-space: nowrap;
        }

        /* شريط الأيقونات الموحد لجميع الصفحات */
        .main-nav { 
            background: rgba(255, 255, 255, 0.5); 
            padding: 15px 0; 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            flex-wrap: wrap; 
            border-bottom: 1px solid #ffffff;
        }
        .nav-btn { 
            padding: 12px 25px; 
            font-size: 16px; 
            font-weight: bold; 
            text-decoration: none; 
            color: white; 
            background: linear-gradient(145deg, #4aa3d6, #1a508b); 
            border-radius: 8px; 
            box-shadow: 0 4px 0 #0d2a4a; 
            transition: 0.2s; 
        }
        .nav-btn:hover { transform: translateY(-3px); }

        /* شريط الآية المتحرك */
        .ayah-bar { width: 100%; overflow: hidden; background: #1a508b; padding: 12px 0; white-space: nowrap; }
        .ayah-slider { display: inline-block; animation: moveLTR 25s linear infinite; }
        .ayah-slider span { font-size: 22px; color: #ffffff; font-family: "Amiri", serif; padding: 0 50px; }
        @keyframes moveLTR { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        /* سلايدر الكتب المصلح */
        .slider-section { position: relative; width: 90%; margin: 50px auto; padding: 20px; background: rgba(255,255,255,0.3); border-radius: 20px; }
        .slider-wrapper { overflow: hidden; position: relative; }
        .books-container { display: flex; gap: 20px; transition: transform 0.5s ease-in-out; }
        .book-item { flex: 0 0 auto; width: 160px; }
        .book-item img { width: 100%; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        
        .arrow { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: #1a508b; color: white; border: none; width: 50px; height: 50px; 
            border-radius: 50%; cursor: pointer; z-index: 10; font-size: 20px; 
        }
        .arrow-right { right: -25px; } .arrow-left { left: -25px; }

        footer { text-align: center; padding: 30px; background: #1a508b; color: white; margin-top: 50px; }
    </style>
</head>
<body>

<header class="site-header">
    <h1 class="sheikh-title">الموقع الرسمي للشيخ سعيد مصطفى دياب</h1>
</header>

<nav class="main-nav">
    <a href="index.html" class="nav-btn">الرئيسية</a>
    <a href="books.html" class="nav-btn">الكتب</a>
    <a href="lessons.html" class="nav-btn">الدروس</a>
    <a href="khutbah.html" class="nav-btn">الخطب</a>
    <a href="articles.html" class="nav-btn">المقالات</a>
    <a href="contact.html" class="nav-btn">اتصل بنا</a>
</nav>

<div class="ayah-bar">
    <div class="ayah-slider">
        <span>قال الله تعالى: ﴿قُلْ ‌هذِهِ ‌سَبِيلِي أَدْعُوا إِلَى اللَّهِ عَلى بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي﴾</span>
    </div>
</div>

<div class="slider-section">
    <button class="arrow arrow-right" onclick="move(1)">&#10094;</button>
    <div class="slider-wrapper">
        <div class="books-container" id="slider">
            <div class="book-item"><img src="images/book1.jpg"></div>
            <div class="book-item"><img src="images/book2.jpg"></div>
            <div class="book-item"><img src="images/book3.jpg"></div>
            <div class="book-item"><img src="images/book4.jpg"></div>
            <div class="book-item"><img src="images/book5.jpg"></div>
            <div class="book-item"><img src="images/book6.jpg"></div>
            <div class="book-item"><img src="images/book7.jpg"></div>
            <div class="book-item"><img src="images/book8.jpg"></div>
            <div class="book-item"><img src="images/book9.jpg"></div>
            <div class="book-item"><img src="images/book10.jpg"></div>
            <div class="book-item"><img src="images/book11.jpg"></div>
            <div class="book-item"><img src="images/book12.jpg"></div>
        </div>
    </div>
    <button class="arrow arrow-left" onclick="move(-1)">&#10095;</button>
</div>

<footer>&copy; 2026 جميع الحقوق محفوظة لـ موقع الشيخ سعيد مصطفى دياب</footer>

<script>
    let pos = 0;
    function move(dir) {
        const slider = document.getElementById('slider');
        const step = 180; // عرض الكتاب + الفراغ
        const max = slider.scrollWidth - slider.parentElement.offsetWidth;
        pos += (dir * step);
        if (pos > 0) pos = 0;
        if (Math.abs(pos) > max) pos = -max;
        slider.style.transform = `translateX(${pos}px)`;
    }
</script>

</body>
</html>
