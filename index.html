<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #e3f2fd; /* اللون اللبني الفاتح جداً */
            --soft-blue: #add8e6; 
            --primary-blue: #2c5d87;
        }

        body { 
            margin: 0; 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--light-sky); /* لون الخلفية اللبني */
            color: #333; 
            min-height: 100vh;
        }
        
        /* 1. شريط اسم الموقع */
        .site-banner {
            background-color: var(--soft-blue);
            padding: 50px 20px;
            text-align: center;
            border-bottom: 5px solid #fff;
        }
        .site-banner h1 {
            margin: 0; font-size: 2.8rem; font-weight: 900;
            color: var(--primary-blue);
        }

        /* 2. الأيقونات المستطيلة (لبنية 3D بدون صور) */
        .nav-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 40px 20px;
        }
        .cat-card-3d { 
            background: #ffffff; 
            padding: 18px 30px; 
            border-radius: 12px; 
            font-weight: bold; 
            color: var(--primary-blue); 
            text-decoration: none;
            transition: 0.2s; 
            min-width: 120px; 
            text-align: center; 
            box-shadow: 0 6px 0 var(--soft-blue); /* تأثير 3D باللون اللبني */
            border: 1px solid var(--soft-blue);
        }
        .cat-card-3d:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--soft-blue); }
        .cat-card-3d i { display: block; margin-bottom: 10px; font-size: 1.8rem; color: var(--soft-blue); }

        /* 3. شريط الآية (عريض وشفاف) */
        .quran-strip-transparent {
            background: rgba(44, 93, 135, 0.7); 
            color: white; 
            padding: 25px 0; 
            text-align: center;
            font-size: 1.6rem; 
            font-weight: bold; 
            margin: 30px 0;
            backdrop-filter: blur(5px);
        }

        /* 4. شريط الكتب (موسع ليشمل عرض الصفحة) */
        .books-wrapper-wide { 
            width: 95%; /* تم توسيع الحاوية */
            margin: 40px auto; 
        }
        .books-wrapper-wide h3 { color: var(--primary-blue); margin-bottom: 20px; padding-right: 10px; }
        
        .slider-box-wide {
            display: flex; 
            align-items: center; 
            background: rgba(255, 255, 255, 0.4);
            padding: 30px 10px; 
            border-radius: 20px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .arrow { font-size: 35px; color: var(--primary-blue); cursor: pointer; padding: 0 15px; }
        
        .books-scroll {
            display: flex; 
            gap: 25px; 
            overflow-x: auto; 
            scroll-behavior: smooth;
            scrollbar-width: none; 
            flex: 1;
        }
        .books-scroll::-webkit-scrollbar { display: none; }
        
        /* أغلفة الكتب */
        .book-img {
            width: 150px; 
            height: 220px; 
            object-fit: cover;
            border-radius: 10px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
            border: 3px solid #fff; 
            transition: 0.3s;
        }
        .book-img:hover { transform: scale(1.08); }

        /* 5. وسائل التواصل */
        .social-area { text-align: center; padding: 40px; }
        .social-flex { display: flex; justify-content: center; gap: 20px; }
        .s-icon { 
            font-size: 30px; color: white; width: 60px; height: 60px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .fb { background: #1877F2; } .wa { background: #25D366; } .tg { background: #229ED9; }

        /* 6. الحقوق */
        .footer-rights {
            background: var(--primary-blue); 
            color: white; 
            text-align: center;
            padding: 25px; 
            font-weight: bold;
        }
    </style>
</head>
