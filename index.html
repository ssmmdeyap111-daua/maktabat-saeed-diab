<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>موقع الشيخ سعيد مصطفى دياب</title>

<link rel="stylesheet" href="css/style.css">

<style>
/* ====== إعدادات عامة ====== */
body {
    margin: 0;
    font-family: Tahoma, Arial;
    background: #fafafa;
}

/* ====== الشريط الأخضر ====== */
.header-bar {
    background: #1f8f4a;
    color: white;
    padding: 50px;
    text-align: center;
}

.site-title {
    margin: 0 0 10px;
    font-size: 26px;
}

.main-nav a {
    color: white;
    text-decoration: none;
    margin: 0 12px;
    font-size: 16px;
}

.main-nav a:hover {
    text-decoration: underline;
}

/* ====== شريط الآية ====== */
.ayah-bar {
    width: 100%;
    overflow: hidden;
    background: #f8fafc;
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 0;
}

.ayah-slider {
    display: flex;
    width: max-content;
    animation: ayahMove 25s linear infinite;
}

.ayah-slider span {
    font-size: 30px;
    font-weight: bold;
    color: #065f46;
    white-space: nowrap;
    margin-right: 60px;
    font-family: "Amiri", serif;
}

@keyframes ayahMove {
    from {
        transform: translateX(100%);
    }
    to {
        transform: translateX(-100%);
    }
}

/* ====== شريط الكتب ====== */
.books-slider-wrapper {
    overflow: hidden;
    width: 100%;
    background: #f1f5f9;
    padding: 25px 0;
}

.books-slider {
    display: flex;
    animation: slideBooks 30s linear infinite;
}

.book-slide {
    flex: 0 0 auto;
    width: 150px;
    margin: 0 12px;
}

.book-slide img {
    width: 100%;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}

.book-slide img:hover {
    transform: scale(1.08);
}

@keyframes slideBooks {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-50%); }
}
</style>
</head>

<body>

<!-- ====== الشريط الأخضر ====== -->
<div class="header-bar">
    <h1 class="site-title">موقع الشيخ سعيد مصطفى دياب</h1>

</div>

<!-- ====== شريط الآية ====== -->

    </div>
</div>

<!-- ====== شريط الكتب ====== -->

        <div class="book-slide"><img src="images/allaalea-wa-aldorr.jpg"></div>
        <div class="book-slide"><img src="images/asaleeb-alquran.jpg"></div>
        <div class="book-slide"><img src="images/fadhl-duaa.jpg"></div>
        <div class="book-slide"><img src="images/ithaf-ahl-alrusoukh.jpg"></div>
