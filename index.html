<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع الشيخ سعيد مصطفى دياب الرسمي</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic&display=swap" rel="stylesheet">
<style>
/* ====== إعدادات عامة ====== */
body {
    margin:0;
    font-family: 'Noto Kufi Arabic', sans-serif;
    background: linear-gradient(to bottom, #c0e0f0, #e6f2fa); /* أزرق فاتح متدرج */
}

/* ====== الشريط العلوي ====== */
.header-bar {
    background: #4aa3d6; /* نفس لون الأيقونات الثلاثية */
    color:white;
    padding:50px 20px 20px;
    text-align:center;
    position: relative;
}
.site-title {
    margin:0 0 10px;
    font-size:28px;
}

/* ====== الأيقونات الثلاثية ====== */
.main-nav {
    margin-top: 10px;
}
.main-nav a {
    color:white;
    text-decoration:none;
    margin:0 12px;
    padding:8px 16px;
    font-size:16px;
    border-radius:8px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    background:#4aa3d6;
    transition: all 0.3s;
}
.main-nav a:hover {
    background:#3a8ec2;
}

/* ====== شريط الآية ====== */
.ayah-bar {
    width: 100%;
    overflow: hidden;
    background: #eef5ff;
    border-bottom: 1px solid #d0e4ff;
    padding: 16px 0;
}
.ayah-slider {
    display: flex;
    width: max-content;
    animation: ayahMove 25s linear infinite reverse; /* عكس الاتجاه */
}
.ayah-slider span {
    font-size: 30px;
    font-weight: bold;
    color: #065f46;
    white-space: nowrap;
    margin-right: 60px;
    font-family: "Amiri", serif;
}
@keyframes ayahMove {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

/* ====== شريط الكتب ====== */
.books-slider-wrapper {
    position: relative;
    overflow: hidden;
    width: 100%;
    background: #f1f5f9;
    padding: 25px 0;
}
.books-slider {
    display: flex;
    transition: all 0.3s;
}
.book-slide {
    flex: 0 0 auto;
    width: 150px;
    margin: 0 12px;
}
.book-slide img {
    width: 100%;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}
.book-slide img:hover {
    transform: scale(1.08);
}
/* الأسهم */
.book-prev, .book-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background:#4aa3d6;
    color:white;
    border:none;
    font-size:24px;
    padding:10px;
    border-radius:50%;
    cursor:pointer;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
}
.book-prev { left:10px; }
.book-next { right:10px; }

/* ====== أسفل الصفحة ====== */
footer {
    text-align:center;
    padding:20px;
    background:#4aa3d6;
    color:white;
    margin-top:40px;
}
</style>
</head>
<body>

<div class="header-bar">
    <div class="site-title">موقع الشيخ سعيد مصطفى دياب الرسمي</div>
    <div class="main-nav">
        <a href="index.html">الرئيسية</a>
        <a href="books.html">الكتب</a>
        <a href="articles.html">المقالات</a>
        <a href="lessons.html">الدروس</a>
        <a href="contact.html">تواصل معنا</a>
    </div>
</div>

<!-- ====== شريط الآية ====== -->
<div class="ayah-bar">
    <div class="ayah-slider">
        <span>وَإِنَّكَ لَعَلَى خُلُقٍ عَظِيمٍ</span>
        <span>اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ</span>
        <span>كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ</span>
    </div>
</div>

<!-- ====== شريط الكتب ====== -->
<h2 style="text-align:center; margin:30px 0;">أحدث الكتب</h2>
<div class="books-slider-wrapper">
    <button class="book-prev">&#10094;</button>
    <div class="books-slider">
        <div class="book-slide"><img src="images/al-arbon-veal-amthal.jpg.jpg"></div>
        <div class="book-slide"><img src="images/al-eatbaar-ptraef-alakbaar.jpg.jpg"></div>
        <div class="book-slide"><img src="images/al-ilmam-siyam.jpg"></div>
        <div class="book-slide"><img src="images/al-irshad.jpg"></div>
        <div class="book-slide"><img src="images/allaalea-wa-aldorr.jpg.jpg"></div>
        <div class="book-slide"><img src="images/asaleeb-alquran.jpg"></div>
    </div>
    <button class="book-next">&#10095;</button>
</div>

<footer>
&copy; الحقوق محفوظة للشيخ سعيد مصطفى دياب
</footer>

<script>
// ====== JS شريط الكتب ======
const slider = document.querySelector('.books-slider');
const prev = document.querySelector('.book-prev');
const next = document.querySelector('.book-next');
let scrollAmount = 0;
const slideWidth = 174; // عرض الكتاب + المارجن
prev.addEventListener('click', () => {
    scrollAmount = Math.max(scrollAmount - slideWidth, 0);
    slider.style.transform = `translateX(-${scrollAmount}px)`;
});
next.addEventListener('click', () => {
    scrollAmount = Math.min(scrollAmount + slideWidth, slider.scrollWidth - slider.clientWidth);
    slider.style.transform = `translateX(-${scrollAmount}px)`;
});
</script>

</body>
</html>
