<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع الرسمي للشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --main-blue: #add8e6; --dark-blue: #2c5d87; --accent-blue: #87ceeb; }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: linear-gradient(to bottom, #eef5ff, #d0e4ff); min-height: 100vh; overflow-x: hidden; }

        /* العنوان الرئيسي */
        .site-header { text-align: center; padding: 60px 20px; background: linear-gradient(to right, #add8e6, #e0f2f7); border-bottom: 4px solid #ffffff; }
        .sheikh-title { font-size: 2.2rem; color: var(--dark-blue); margin: 0; }

        /* الأيقونات ثلاثية الأبعاد */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 25px; flex-wrap: wrap; }
        .nav-item { 
            padding: 10px 20px; background: var(--accent-blue); color: white; 
            text-decoration: none; border-radius: 12px; font-weight: bold;
            box-shadow: 0 5px 0 #5f9ea0; transition: 0.1s;
        }
        .nav-item:active { transform: translateY(3px); box-shadow: 0 2px 0 #5f9ea0; }

        /* الآية بخط كبير */
        .ayah-bar { width: 100%; overflow: hidden; background: var(--main-blue); padding: 20px 0; }
        .ayah-text { display: inline-block; white-space: nowrap; font-family: 'Amiri', serif; font-size: 38px; color: var(--dark-blue); animation: moveLTR 25s linear infinite; }
        @keyframes moveLTR { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        /* حاوية الكتب المصلحة */
        .slider-section { position: relative; width: 90%; margin: 50px auto; display: flex; align-items: center; }
        .books-view { 
            display: flex; gap: 20px; overflow-x: auto; 
            scroll-behavior: smooth; width: 100%; padding: 10px;
            scrollbar-width: none; /* لإخفاء الشريط في فايرفوكس */
        }
        .books-view::-webkit-scrollbar { display: none; /* لإخفاء الشريط في كروم */ }
        .book-box { flex: 0 0 auto; width: 150px; }
        .book-box img { width: 100%; border-radius: 10px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }

        .btn-arrow { 
            background: var(--dark-blue); color: white; border: none; 
            width: 50px; height: 50px; border-radius: 50%; 
            cursor: pointer; font-size: 25px; z-index: 10; flex-shrink: 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        footer { text-align: center; padding: 40px; background: var(--main-blue); color: var(--dark-blue); margin-top: 50px; }
        .social-links { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .s-icon { width: 40px; height: 40px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: bold; color: var(--dark-blue); box-shadow: 0 4px 0 #ccc; }
    </style>
</head>
<body>

<header class="site-header"><h1 class="sheikh-title">الموقع الرسمي للشيخ سعيد مصطفى دياب</h1></header>

<div class="nav-bar">
    <a href="index.html" class="nav-item">الرئيسية</a>
    <a href="books.html" class="nav-item">الكتب</a>
    <a href="lessons.html" class="nav-item">الدروس</a>
    <a href="khutbah.html" class="nav-item">الخطب</a>
    <a href="articles.html" class="nav-item">المقالات</a>
</div>

<div class="ayah-bar"><div class="ayah-text">قال الله تعالى: ﴿قُلْ ‌هذِهِ ‌سَبِيلِي أَدْعُوا إِلَى اللَّهِ عَلى بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي﴾</div></div>

<div class="slider-section">
    <button class="btn-arrow" onclick="document.getElementById('bv').scrollBy({left: 200, behavior: 'smooth'})">❯</button>
    
    <div class="books-view" id="bv">
        <div class="book-box"><img src="images/al-arbon-veal-amthal.jpg.jpg"></div>
        <div class="book-box"><img src="images/al-eatbaar-ptraef-alakbaar.jpg.jpg"></div>
        <div class="book-box"><img src="images/al-ilmam-siyam.jpg.jpg"></div>
        <div class="book-box"><img src="images/al-irshad.jpg"></div>
        <div class="book-box"><img src="images/allaalea-wa-aldorr.jpg.jpg"></div>
        <div class="book-box"><img src="images/asaleeb-alquran.jpg"></div>
        <div class="book-box"><img src="images/fadhl-duaa.jpg"></div>
        <div class="book-box"><img src="images/ithaf-ahl-alrusoukh.jpg.jpg"></div>
        <div class="book-box"><img src="images/kabar-al-ahad.jpg.jpg"></div>
        <div class="book-box"><img src="images/kashf-alnqab.jpg.jpg"></div>
        <div class="book-box"><img src="images/katar-al-reba.jpg.jpg"></div>
        <div class="book-box"><img src="images/shmael-al-rasool.jpg.jpg"></div>
    </div>

    <button class="btn-arrow" onclick="document.getElementById('bv').scrollBy({left: -200, behavior: 'smooth'})">❮</button>
</div>

<footer>
    <p>&copy; 2026 جميع الحقوق محفوظة لـ موقع الشيخ سعيد مصطفى دياب</p>
    <div class="social-links">
        <a href="#" class="s-icon">FB</a>
        <a href="#" class="s-icon">TG</a>
        <a href="#" class="s-icon">WA</a>
    </div>
</footer>

</body>
</html>
