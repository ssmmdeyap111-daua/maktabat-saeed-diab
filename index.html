<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع الرسمي للشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa&family=Noto+Kufi+Arabic:wght@300;500&family=Amiri&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; padding: 0; 
            font-family: 'Noto Kufi Arabic', sans-serif; 
            background: linear-gradient(to bottom, #eef5ff, #d0e4ff); 
            min-height: 100vh;
        }

        /* شريط علوي ضخم أزرق فاتح */
        .site-header { 
            text-align: center; 
            padding: 100px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 3px solid #ffffff;
        }
        .sheikh-title { 
            font-family: 'Aref Ruqaa', serif; 
            font-size: 3.5rem; 
            color: #2c5d87; 
            margin: 0; 
            font-weight: normal; /* خط غير عريض */
        }

        /* شريط الأيقونات تحت العنوان */
        .nav-bar { 
            display: flex; justify-content: center; gap: 15px; 
            padding: 20px; flex-wrap: wrap; background: rgba(255,255,255,0.3);
        }
        .nav-item { 
            padding: 10px 20px; background: #87ceeb; color: white; 
            text-decoration: none; border-radius: 30px; font-weight: bold;
            box-shadow: 0 4px 0 #5f9ea0; transition: 0.2s;
        }
        .nav-item:hover { transform: translateY(-3px); background: #00bfff; }

        /* شريط الآية (يسار إلى يمين) */
        .ayah-bar { 
            width: 100%; overflow: hidden; background: #add8e6; 
            padding: 15px 0; border-bottom: 1px solid #ffffff;
        }
        .ayah-text { 
            display: inline-block; white-space: nowrap; 
            font-family: 'Amiri', serif; font-size: 24px; color: #2c5d87;
            animation: moveLTR 20s linear infinite;
        }
        @keyframes moveLTR { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        /* سلايدر الكتب المضمون */
        .slider-container { 
            position: relative; width: 90%; margin: 50px auto; 
            display: flex; align-items: center; gap: 10px;
        }
        .books-view { 
            overflow-x: auto; display: flex; gap: 20px; 
            scroll-behavior: smooth; padding: 20px 0;
            scrollbar-width: none; /* إخفاء المسطرة */
        }
        .books-view::-webkit-scrollbar { display: none; }
        
        .book-box { flex: 0 0 auto; width: 160px; text-align: center; }
        .book-box img { 
            width: 100%; border-radius: 10px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); 
            background: #ccc; /* لون مؤقت في حال لم تظهر الصورة */
        }

        .btn-arrow { 
            background: #87ceeb; color: white; border: none; 
            width: 50px; height: 50px; border-radius: 50%; 
            cursor: pointer; font-size: 24px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        footer { text-align: center; padding: 40px; background: #add8e6; color: #2c5d87; margin-top: 50px; }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="sheikh-title">الموقع الرسمي للشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-item">الرئيسية</a>
        <a href="books.html" class="nav-item">الكتب</a>
        <a href="lessons.html" class="nav-item">الدروس</a>
        <a href="khutbah.html" class="nav-item">الخطب</a>
        <a href="articles.html" class="nav-item">المقالات</a>
    </div>

    <div class="ayah-bar">
        <div class="ayah-text">
            <span>قال الله تعالى: ﴿قُلْ ‌هذِهِ ‌سَبِيلِي أَدْعُوا إِلَى اللَّهِ عَلى بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي﴾</span>
        </div>
    </div>

    <div class="slider-container">
        <button class="btn-arrow" onclick="document.getElementById('bv').scrollBy(200, 0)">&#10094;</button>
        
        <div class="books-view" id="bv">
            <div class="book-box"><img src="images/al-arbon-veal-amthal.jpg.jpg" alt="كتاب"></div>
            <div class="book-box"><img src="images/al-eatbaar-ptraef-alakbaar.jpg.jpg" alt="كتاب"></div>
            <div class="book-box"><img src="images/al-ilmam-siyam.jpg.jpg" alt="كتاب"></div>
            <div class="book-box"><img src="images/al-irshad.jpg" alt="كتاب"></div>
            <div class="book-box"><img src="images/allaalea-wa-aldorr.jpg.jpg" alt="كتاب"></div>
            <div class="book-box"><img src="images/asaleeb-alquran.jpg" alt="كتاب"></div>
            <div class="book-box"><img src="images/fadhl-duaa.jpg" alt="كتاب"></div>
            <div class="book-box"><img src="images/ithaf-ahl-alrusoukh.jpg.jpg" alt="كتاب"></div>
            <div class="book-box"><img src="images/kabar-al-ahad.jpg.jpg" alt="كتاب"></div>
            <div class="book-box"><img src="images/kashf-alnqab.jpg.jpg" alt="كتاب"></div>
            <div class="book-box"><img src="images/katar-al-reba.jpg.jpg" alt="كتاب"></div>
            <div class="book-box"><img src="images/shmael-al-rasool.jpg.jpg" alt="كتاب"></div>
        </div>

        <button class="btn-arrow" onclick="document.getElementById('bv').scrollBy(-200, 0)">&#10095;</button>
    </div>

    <footer>&copy; 2026 جميع الحقوق محفوظة لـ موقع الشيخ سعيد مصطفى دياب</footer>

</body>
</html>
