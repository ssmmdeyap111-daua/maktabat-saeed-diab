<!-- ====== الشريط الأخضر + الاسم + الأزرار ====== -->
<div class="header-bar">
    <h1 class="site-title">موقع الشيخ سعيد مصطفى دياب الرسمي</h1>
    
    <div class="button-grid">
        <a href="index.html" class="btn">الرئيسية</a>
        <a href="books.html" class="btn">الكتب والمؤلفات</a>
        <a href="#" class="btn">الدروس</a>
        <a href="#" class="btn">خطب الجمعة</a>
        <a href="#" class="btn">تواصل معنا</a>
    </div>
</div>

<!-- ====== شريط الآية ====== -->
<div class="ayah-bar">
    <div class="ayah-slider">
        <span>﴿ إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ ﴾</span>
        <span>﴿ إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ ﴾</span>
    </div>
</div>
</body>
</html>

<!-- ====== شريط الكتب مع الأسهم ====== -->
<div class="books-slider-wrapper">
    <button class="scroll-btn left-btn">&#8592;</button>
    
    <div class="books-slider" id="booksSlider">
        <div class="book-slide">
            <img src="images/allaalea-wa-aldorr.jpg" alt="اللآلئ والدرر">
        </div>
        <div class="book-slide">
            <img src="images/al-eatbaar-ptraef-alakbaar.jpg" alt="الاعتبار بطرائف الأخبار">
        </div>
        <div class="book-slide">
            <img src="images/katar-al-reba.jpg" alt="خطر الربا">
        </div>
        <div class="book-slide">
            <img src="images/al-irshad.jpg" alt="الإرشاد">
        </div>
        <div class="book-slide">
            <img src="images/asaleeb-alquran.jpg" alt="أساليب القرآن البلاغية">
        </div>
        <!-- أضف باقي الكتب بنفس الطريقة -->
    </div>
    
    <button class="scroll-btn right-btn">&#8594;</button>
</div>

</body>
<script>
const slider = document.getElementById('booksSlider');
const leftBtn = document.querySelector('.left-btn');
const rightBtn = document.querySelector('.right-btn');

const scrollAmount = 300; // عدد البيكسل للتحريك

leftBtn.addEventListener('click', () => {
    slider.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
});

rightBtn.addEventListener('click', () => {
    slider.scrollBy({ left: scrollAmount, behavior: 'smooth' });
});
</script>
