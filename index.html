    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-blue: #2c5d87; 
            --light-blue: #add8e6; 
            --gradient-bg: linear-gradient(135deg, #eef5ff 0%, #add8e6 100%); 
        }

        body { 
            margin: 0; 
            font-family: 'Cairo', sans-serif; 
            background: var(--gradient-bg); /* الخلفية المتدرجة */
            color: #333; 
            min-height: 100vh;
        }
        
        /* 1. شريط اسم الموقع (عريض) */
        .site-banner {
            background-color: var(--light-blue);
            padding: 45px 20px;
            text-align: center;
            border-bottom: 5px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .site-banner h1 {
            margin: 0; font-size: 2.8rem; font-weight: 900;
            color: var(--primary-blue);
        }

        /* 2. الأيقونات المستطيلة (نفس نمط صفحة الدروس) */
        .nav-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 30px 20px;
        }
        .cat-card-3d { 
            background: var(--light-blue); 
            padding: 15px 25px; 
            border-radius: 12px; 
            cursor: pointer; 
            border: 1px solid rgba(0,0,0,0.1); 
            font-weight: bold; 
            color: var(--primary-blue); 
            text-decoration: none;
            transition: 0.2s; 
            min-width: 110px; 
            text-align: center; 
            box-shadow: 0 5px 0 #87b8c9, 0 8px 15px rgba(0,0,0,0.1); /* تأثير 3D */
            font-size: 1rem;
        }
        .cat-card-3d:active { transform: translateY(3px); box-shadow: 0 2px 0 #87b8c9; }
        .cat-card-3d i { display: block; margin-bottom: 8px; font-size: 1.5rem; }

        /* 3. شريط الآية (عريض وشفاف) */
        .quran-strip-transparent {
            background: rgba(44, 93, 135, 0.75); /* شفافية */
            color: white; 
            padding: 25px 10px; 
            text-align: center;
            font-size: 1.5rem; 
            font-weight: bold; 
            margin: 20px 0;
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255,255,255,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        /* 4. شريط الكتب بالأغلفة والسهمين */
        .books-wrapper { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .books-wrapper h3 { color: var(--primary-blue); margin-bottom: 15px; }
        .slider-box {
            display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.5);
            padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .arrow { font-size: 30px; color: var(--primary-blue); cursor: pointer; }
        .books-scroll {
            display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth;
            scrollbar-width: none; flex: 1;
        }
        .books-scroll::-webkit-scrollbar { display: none; }
        .book-img {
            width: 130px; height: 190px; object-fit: cover;
            border-radius: 8px; box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
            border: 2px solid #fff; transition: 0.3s;
        }

        /* 5. وسائل التواصل */
        .social-area { text-align: center; padding: 40px; margin-top: 20px; }
        .social-flex { display: flex; justify-content: center; gap: 20px; }
        .s-icon { 
            font-size: 28px; color: white; width: 55px; height: 55px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            text-decoration: none; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .fb { background: #1877F2; } .wa { background: #25D366; } .tg { background: #229ED9; }
        .s-icon:hover { transform: translateY(-5px); }

        /* 6. الحقوق */
        .footer-rights {
            background: var(--primary-blue); color: white; text-align: center;
            padding: 20px; font-size: 0.9rem; font-weight: bold;
        }
    </style>
</head>
