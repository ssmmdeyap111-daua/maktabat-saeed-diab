<style>
body {
    margin:0;
    font-family: 'Noto Kufi Arabic', sans-serif;
    background: linear-gradient(to bottom, #c0e0f0, #e6f2fa);
}

/* الشريط العلوي */
.header-bar {
    background: linear-gradient(to right, #3fa1d6, #70c0e8);
    color:white;
    padding:50px 20px 20px;
    text-align:center;
}
.site-title {
    margin:0 0 10px;
    font-size:28px;
}
.main-nav a {
    color:white;
    text-decoration:none;
    margin:0 12px;
    padding:8px 16px;
    font-size:16px;
    border-radius:8px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    background:#4aa3d6;
    transition: all 0.3s;
}
.main-nav a:hover {
    background:#3a8ec2;
}

/* شريط الكتب */
.books-slider-wrapper {
    overflow:hidden;
    width:100%;
    background:#f1f5f9;
    padding:25px 0;
}
.books-slider {
    display:flex;
    animation: slideBooks 30s linear infinite;
}
.book-slide {
    flex:0 0 auto;
    width:150px;
    margin:0 12px;
}
.book-slide img {
    width:100%;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}
.book-slide img:hover {
    transform: scale(1.08);
}
@keyframes slideBooks {
    0% {transform: translateX(0%);}
    100% {transform: translateX(-50%);}
}

/* زر العودة للصفحة الرئيسية */
.back-home {
    display:block;
    text-align:right;
    margin:20px;
    font-size:18px;
    color:#0a7aaf;
}

/* أسفل الصفحة */
footer {
    text-align:center;
    padding:20px;
    background:#3fa1d6;
    color:white;
    margin-top:40px;
}
</style>
</head>
