<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع الرسمي للشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #eef5ff;
            --main-blue: #add8e6;
            --dark-blue: #2c5d87;
            --accent-blue: #87ceeb;
        }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(to bottom, var(--light-blue), #d0e4ff); 
            min-height: 100vh; overflow-x: hidden;
        }

        /* عنوان أصغر وأرشق */
        .site-header { 
            text-align: center; padding: 70px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }
        .sheikh-title { font-size: 2.2rem; color: var(--dark-blue); margin: 0; font-weight: 700; }

        /* أيقونات 3D */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 25px; flex-wrap: wrap; }
        .nav-item { 
            padding: 10px 20px; background: var(--accent-blue); color: white; 
            text-decoration: none; border-radius: 12px; font-weight: bold;
            box-shadow: 0 5px 0 #5f9ea0; transition: 0.2s;
        }
        .nav-item:hover { transform: translateY(-2px); box-shadow: 0 3px 0 #5f9ea0; }

        /* آية بخط كبير جداً */
        .ayah-bar { width: 100%; overflow: hidden; background: var(--main-blue); padding: 20px 0; border-bottom: 2px solid #ffffff; }
        .ayah-text { 
            display: inline-block; white-space: nowrap; 
            font-family: 'Amiri', serif; font-size: 38px; color: var(--dark-blue);
            animation: moveLTR 25s linear infinite;
        }
        @keyframes moveLTR { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        /* سلايدر الكتب والأسهم */
        .slider-container { 
            position: relative; width: 90%; margin: 50px auto; 
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.2); padding: 20px; border-radius: 20px;
        }
        .books-view { 
            overflow-x: hidden; display: flex; gap: 20px; 
            scroll-behavior: smooth; width: 100%;
        }
        .book-box { flex: 0 0 auto; width: 150px; }
        .book-box img { width: 100%; border-radius: 10px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }

        .btn-arrow { 
            background: var(--dark-blue); color: white; border: none; 
            width: 45px; height: 45px; border-radius: 50%; 
            cursor: pointer; font-size: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 10;
        }

        /* فوتر مع أيقونات تواصل */
        footer { text-align: center; padding: 40px; background: var(--main-blue); color: var(--dark-blue); margin-top: 50px; }
        .social-links { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .s-icon { 
            width: 45px; height: 45px; background: white; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-weight: bold; color: var(--dark-blue);
            box-shadow: 0 4px 0 #ccc; transition: 0.2s;
        }
        .s-icon:hover { transform: translateY(-3px); box-shadow: 0 6px 0 #ccc; }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="sheikh-title">الموقع الرسمي للشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-item">الرئيسية</a>
        <a href="books.html" class="nav-item">الكتب</a>
        <a href="#" class="nav-item">الدروس</a>
        <a href="#" class="nav-item">الخطب</a>
        <a href="#" class="nav-item">المقالات</a>
    </div>

    <div class="ayah-bar">
        <div class="ayah-text">
            <span>قال الله تعالى: ﴿قُلْ ‌هذِهِ ‌سَبِيلِي أَدْعُوا إِلَى اللَّهِ عَلى بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي﴾</span>
        </div>
    </div>

    <div class="slider-container">
        <button class="btn-arrow" onclick="document.getElementById('bv').scrollBy(170, 0)">&#10094;</button>
        <div class="books-view" id="bv">
            <div class="book-box"><img src="images/al-arbon-veal-amthal.jpg.jpg"></div>
            <div class="book-box"><img src="images/al-eatbaar-ptraef-alakbaar.jpg.jpg"></div>
            <div class="book-box"><img src="images/al-ilmam-siyam.jpg.jpg"></div>
            <div class="book-box"><img src="images/al-irshad.jpg"></div>
            <div class="book-box"><img src="images/allaalea-wa-aldorr.jpg.jpg"></div>
            <div class="book-box"><img src="images/asaleeb-alquran.jpg"></div>
            <div class="book-box"><img src="images/fadhl-duaa.jpg"></div>
            <div class="book-box"><img src="images/ithaf-ahl-alrusoukh.jpg.jpg"></div>
            <div class="book-box"><img src="images/kabar-al-ahad.jpg.jpg"></div>
            <div class="book-box"><img src="images/kashf-alnqab.jpg.jpg"></div>
            <div class="book-box"><img src="images/katar-al-reba.jpg.jpg"></div>
            <div class="book-box"><img src="images/shmael-al-rasool.jpg.jpg"></div>
        </div>
        <button class="btn-arrow" onclick="document.getElementById('bv').scrollBy(-170, 0)">&#10095;</button>
    </div>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة لـ موقع الشيخ سعيد مصطفى دياب</p>
        <div class="social-links">
            <a href="https://facebook.com/YOUR_PAGE" class="s-icon">FB</a>
            <a href="https://t.me/YOUR_CHANNEL" class="s-icon">TG</a>
            <a href="https://wa.me/YOUR_NUMBER" class="s-icon">WA</a>
        </div>
    </footer>

</body>
</html>
