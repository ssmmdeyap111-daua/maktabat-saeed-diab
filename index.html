<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع الشيخ سعيد مصطفى دياب الرسمي</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family: 'Noto Kufi Arabic', sans-serif;
    background: linear-gradient(to bottom, #eef5ff, #d0e4ff);
}

/* ===== شريط العنوان ===== */
.header-bar {
    background: linear-gradient(to right, #3fa1d6, #70c0e8);
    color:white;
    padding: 60px 20px 40px;
    text-align: center;
    font-size:32px;
}

/* ===== شريط الآية ===== */
.ayah-bar {
    width: 100%;
    overflow: hidden;
    background: #d0e4ff;
    border-bottom: 1px solid #b0d4f0;
    padding: 16px 0;
    margin-bottom: 30px;
}
.ayah-slider {
    display: flex;
    width: max-content;
    animation: ayahMove 25s linear infinite reverse;
}
.ayah-slider span {
    font-size: 26px;
    font-weight: bold;
    color: #065f46;
    white-space: nowrap;
    margin-right: 60px;
    font-family: "Amiri", serif;
}
@keyframes ayahMove {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

/* ===== مربع البحث الزجاجي ===== */
.search-wrapper {
    display: flex;
    justify-content: center;
    margin: 30px 0;
}
#searchInput {
    width: 60%;
    max-width: 500px;
    padding: 16px 25px;
    font-size: 18px;
    border: none;
    border-radius: 50px;
    outline: none;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #0f172a;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    text-align: center;
    transition: all 0.3s ease;
}
#searchInput:focus {
    width: 65%;
    box-shadow: 0 10px 25px rgba(63, 161, 214, 0.4);
    background: rgba(255, 255, 255, 0.3);
}

/* ===== أيقونات الصفحة الرئيسية ===== */
.main-icons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin: 30px 0;
}
.icon-btn {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 160px;
    height: 80px;
    background: #4aa3d6;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    border-radius: 12px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    transition: all 0.3s;
}
.icon-btn:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 20px rgba(0,0,0,0.35);
    background: #3a8ec2;
}

/* ===== شريط الكتب ===== */
.books-wrapper {
    position: relative;
    overflow: hidden;
    width: 90%;
    margin: auto;
    background: #e6f2fa;
    padding: 20px 0;
    border-radius: 12px;
}
.books-slider {
    display: flex;
    transition: transform 0.3s ease-in-out;
}
.book-slide {
    flex: 0 0 auto;
    width: 150px;
    margin: 0 12px;
    text-align: center;
}
.book-slide img {
    width: 100%;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}
.book-slide img:hover {
    transform: scale(1.08);
}
/* الأسهم */
.book-prev, .book-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background:#4aa3d6;
    color:white;
    font-size:24px;
    width:50px;
    height:50px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
    z-index:10;
}
.book-prev:hover, .book-next:hover {
    background:#3a8ec2;
}
.book-prev { left:10px; }
.book-next { right:10px; }

/* ===== أسفل الصفحة ===== */
footer {
    text-align:center;
    padding:20px;
    background:#3fa1d6;
    color:white;
    margin-top:40px;
}
</style>
</head>
<body>

<div class="header-bar">
موقع الشيخ سعيد مصطفى دياب الرسمي
</div>

<div class="ayah-bar">
<div class="ayah-slider">
<span>قال الله تعالى: ﴿قُلْ ‌هذِهِ ‌سَبِيلِي أَدْعُوا إِلَى اللَّهِ عَلَى بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي﴾. سورة يوسف</span>
</div>
</div>

<!-- مربع البحث -->
<div class="search-wrapper">
  <input type="text" id="searchInput" placeholder="🔍 ابحث في الموقع ...">
</div>

<style>
.search-wrapper {
    display: flex;
    justify-content: center;
    margin: 30px 0;
}
#searchInput {
    width: 60%;
    max-width: 500px;
    padding: 16px 25px;
    font-size: 18px;
    border: none;
    border-radius: 50px;
    outline: none;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #0f172a;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    text-align: center;
    transition: all 0.3s ease;
}
#searchInput:focus {
    width: 65%;
    box-shadow: 0 10px 25px rgba(63, 161, 214, 0.4);
    background: rgba(255, 255, 255, 0.3);
}
</style>

<script>
document.getElementById("searchInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        let query = e.target.value.trim();
        if(query !== "") {
            // توجه إلى صفحة البحث مع تمرير الكلمة
            window.location.href = "search.html?q=" + encodeURIComponent(query);
        }
    }
});
</script>
