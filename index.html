<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الشيخ سعيد مصطفى دياب الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --light-sky: #eef5ff; 
            --accent-blue: #87ceeb; 
            --dark-blue: #2c5d87;
            --gold-color: #d4af37;
            --header-bg: linear-gradient(to right, #add8e6, #e0f2f7); 
        }

        body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--light-sky); }
        
        /* الخانة البيضاوية المحدثة */
        .date-oval-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid var(--accent-blue);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-text {
            font-size: 1rem;
            color: var(--dark-blue);
            font-weight: 700;
            white-space: nowrap;
        }

        .date-text i { color: var(--gold-color); margin-left: 8px; }

        .site-header {
            text-align: center; 
            padding: 80px 20px; 
            background: var(--header-bg); 
            border-bottom: 4px solid #ffffff;
            position: relative;
        }
        .site-header h1 { margin: 0; font-size: 2.5rem; font-weight: 900; color: var(--dark-blue); }

        /* باقي التنسيقات كما هي في ملفك الأصلي */
        .nav-bar { display: flex; justify-content: center; gap: 15px; padding: 30px 20px; flex-wrap: wrap; }
        .nav-link-3d { padding: 15px 25px; background: var(--accent-blue); color: white; text-decoration: none; border-radius: 12px; font-weight: bold; min-width: 130px; text-align: center; box-shadow: 0 5px 0 #5f9ea0; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: 0.2s; }
        .nav-link-3d:active { transform: translateY(3px); box-shadow: 0 2px 0 #5f9ea0; }
        
        .quran-strip-gold { background: rgba(255, 255, 255, 0.5); margin: 30px auto; width: 92%; padding: 15px 0; text-align: center; border-top: 3px double var(--gold-color); border-bottom: 3px double var(--gold-color); }
        .quran-text { font-family: 'Amiri', serif; font-size: 2rem; color: #8a6d3b; font-weight: 700; }

        @media (max-width: 850px) {
            .date-oval-box { position: static; margin: 10px auto; width: fit-content; padding: 8px 20px; }
            .site-header { padding: 40px 10px; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="date-oval-box">
            <span class="date-text">
                <i class="fas fa-calendar-alt"></i>
                <span id="full-date-string">جارٍ حساب التاريخ...</span>
            </span>
        </div>
        
        <h1>موقع الشيخ سعيد مصطفى دياب الرسمي</h1>
    </header>

    <nav class="nav-bar">
        <a href="index.html" class="nav-link-3d"><i class="fas fa-home"></i>الرئيسية</a>
        <a href="books.html" class="nav-link-3d"><i class="fas fa-book"></i>الكتب</a>
        <a href="lessons.html" class="nav-link-3d"><i class="fas fa-microphone"></i>الدروس</a>
        <a href="khutbah.html" class="nav-link-3d"><i class="fas fa-bullhorn"></i>الخطب</a>
        <a href="articles.html" class="nav-link-3d"><i class="fas fa-pen-nib"></i>المقالات</a>
    </nav>

    <div class="quran-strip-gold">
        <marquee scrollamount="5" direction="right">
            <span class="quran-text">قال الله تعالى: ﴿قُلْ ‌هذِهِ ‌سَبِيلِي أَدْعُوا إِلَى اللَّهِ عَلى بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي وَسُبْحانَ اللَّهِ وَما أَنَا مِنَ الْمُشْرِكِينَ (108)﴾. سورة يوسف</span>
        </marquee>
    </div>

    <script>
        function getArabicDate() {
            const now = new Date();
            
            // 1. اسم اليوم
            const dayName = now.toLocaleDateString('ar-SA', { weekday: 'long' });
            
            // 2. التاريخ الهجري (9 رمضان 1447هـ)
            const hijriDate = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-uma-nu-latn', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            }).format(now);

            // 3. التاريخ الميلادي (26 / 2 / 2026م)
            const gregDay = now.getDate();
            const gregMonth = now.getMonth() + 1;
            const gregYear = now.getFullYear();
            const gregDate = `${gregDay} / ${gregMonth} / ${gregYear}م`;

            // تجميع السطر بالكامل
            // النتيجة المتوقعة: الخميس، 9 رمضان 1447 هـ - 26 / 2 / 2026 م
            const finalString = `${dayName}، ${hijriDate} هـ - ${gregDate}`;
            
            document.getElementById('full-date-string').innerText = finalString;
        }

        // تشغيل الدالة عند تحميل الصفحة
        window.onload = getArabicDate;
    </script>
</body>
</html>
