<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع الرسمي للشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri&display=swap" rel="stylesheet">
    <style>
        :root {
            --light-blue: #eef5ff;
            --main-blue: #add8e6;
            --dark-blue: #2c5d87;
            --accent-blue: #87ceeb;
            --3d-shadow: 0 6px 0 #5f9ea0;
        }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(to bottom, var(--light-blue), #d0e4ff); 
            min-height: 100vh;
        }

        .site-header { 
            text-align: center; padding: 90px 20px; 
            background: linear-gradient(to right, #add8e6, #e0f2f7); 
            border-bottom: 4px solid #ffffff;
        }
        .sheikh-title { font-size: 3rem; color: var(--dark-blue); margin: 0; font-weight: 700; }

        .nav-bar { display: flex; justify-content: center; gap: 20px; padding: 30px; flex-wrap: wrap; }
        .nav-item { 
            padding: 12px 25px; background: var(--accent-blue); color: white; 
            text-decoration: none; border-radius: 12px; font-weight: bold;
            box-shadow: var(--3d-shadow); transition: 0.2s;
        }
        .nav-item:hover { transform: translateY(-2px); box-shadow: 0 4px 0 #5f9ea0; }
        .nav-item:active { transform: translateY(4px); box-shadow: 0 0 0 #5f9ea0; }

        .ayah-bar { width: 100%; overflow: hidden; background: var(--main-blue); padding: 15px 0; border-bottom: 2px solid #ffffff; }
        .ayah-text { 
            display: inline-block; white-space: nowrap; 
            font-family: 'Amiri', serif; font-size: 26px; color: var(--dark-blue);
            animation: moveLTR 22s linear infinite;
        }
        @keyframes moveLTR { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        /* سلايدر الكتب */
        .slider-container { 
            position: relative; width: 85%; margin: 60px auto; 
            display: flex; align-items: center; gap: 15px;
            background: rgba(255,255,255,0.2); padding: 25px; border-radius: 30px;
        }
        .books-view { 
            overflow-x: hidden; display: flex; gap: 25px; 
            scroll-behavior: smooth; width: 100%;
        }
        .book-box { flex: 0 0 auto; width: 155px; }
        .book-box img { width: 100%; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); transition: 0.3s; }

        .btn-arrow { 
            background: var(--dark-blue); color: white; border: none; 
            width: 55px; height: 55px; border-radius: 50%; 
            cursor: pointer; font-size: 24px; box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        /* أيقونات التواصل الاجتماعي 3D */
        .social-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .social-icon {
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            background: white; border-radius: 50%; text-decoration: none; font-size: 20px;
            box-shadow: 0 4px 0 #ccc; transition: 0.3s; color: var(--dark-blue);
        }
        .social-icon:hover { transform: translateY(-3px); box-shadow: 0 7px 0 #ccc; }
        .social-icon.fb { color: #1877F2; }
        .social-icon.tg { color: #0088cc; }
        .social-icon.wa { color: #25D366; }

        footer { text-align: center; padding: 40px; background: var(--main-blue); color: var(--dark-blue); margin-top: 50px; font-weight: bold; }
    </style>
</head>
<body>

    <header class="site-header">
        <h1 class="sheikh-title">الموقع الرسمي للشيخ سعيد مصطفى دياب</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="nav-item">الرئيسية</a>
        <a href="books.html" class="nav-item">الكتب</a>
        <a href="lessons.html" class="nav-item">الدروس</a>
        <a href="khutbah.html" class="nav-item">الخطب</a>
        <a href="articles.html" class="nav-item">المقالات</a>
    </div>

    <div class="ayah-bar">
        <div class="ayah-text">
            <span>قال الله تعالى: ﴿قُلْ ‌هذِهِ ‌سَبِيلِي أَدْعُوا إِلَى اللَّهِ عَلى بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي﴾</span>
        </div>
    </div>

    <div class="slider-container">
        <button class="btn-arrow" onclick="document.getElementById('bv').scrollBy(-220, 0)">&#10094;</button>
        <div class="books-view" id="bv">
            <div class="book-box"><img src="images/al-arbon-veal-amthal.jpg.jpg"></div>
            <div class="book-box"><img src="images/al-eatbaar-ptraef-alakbaar.jpg.jpg"></div>
            <div class="book-box"><img src="images/al-ilmam-siyam.jpg.jpg"></div>
            <div class="book-box"><img src="images/al-irshad.jpg"></div>
            <div class="book-box"><img src="images/allaalea-wa-aldorr.jpg.jpg"></div>
            <div class="book-box"><img src="images/asaleeb-alquran.jpg"></div>
            <div class="book-box"><img src="images/fadhl-duaa.jpg"></div>
            <div class="book-box"><img src="images/ithaf-ahl-alrusoukh.jpg.jpg"></div>
            <div class="book-box"><img src="images/kabar-al-ahad.jpg.jpg"></div>
            <div class="book-box"><img src="images/kashf-alnqab.jpg.jpg"></div>
            <div class="book-box"><img src="images/katar-al-reba.jpg.jpg"></div>
            <div class="book-box"><img src="images/shmael-al-rasool.jpg.jpg"></div>
        </div>
        <button class="btn-arrow" onclick="document.getElementById('bv').scrollBy(220, 0)">&#10095;</button>
    </div>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة لـ موقع الشيخ سعيد مصطفى دياب</p>
        <div class="social-container">
            <a href="#" class="social-icon fb" title="فيسبوك">f</a>
            <a href="#" class="social-icon tg" title="تلجرام">T</a>
            <a href="#" class="social-icon wa" title="واتساب">W</a>
        </div>
    </footer>

</body>
</html>
