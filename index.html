<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الشيخ سعيد مصطفى دياب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-blue: #2c5d87; --light-blue: #add8e6; --bg-color: #f8fbff; }
        body { margin: 0; font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: #333; }
        
        .main-header { background-color: var(--light-blue); padding: 40px 20px; text-align: center; border-bottom: 5px solid #fff; }
        .main-header h1 { margin: 0; font-size: 2.2rem; color: var(--primary-blue); font-weight: 900; }
        
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; }

        /* أزرار الأقسام الرئيسية */
        .main-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .nav-card { 
            background: white; padding: 30px; border-radius: 20px; text-decoration: none; 
            text-align: center; border-bottom: 5px solid var(--light-blue); 
            transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .nav-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .nav-card i { font-size: 40px; color: var(--primary-blue); margin-bottom: 15px; display: block; }
        .nav-card h2 { margin: 0; color: var(--primary-blue); font-size: 1.5rem; }
        .nav-card p { color: #666; margin-top: 10px; font-size: 0.95rem; }

        /* قسم التواصل الاجتماعي */
        .social-section { background: white; padding: 30px; border-radius: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .social-section h3 { color: var(--primary-blue); margin-bottom: 25px; }
        .social-container { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; }
        .social-item { text-decoration: none; text-align: center; }
        .social-icon { 
            width: 60px; height: 60px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 28px; 
            color: white; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .social-icon:hover { transform: scale(1.1); }
        .whatsapp { background: linear-gradient(45deg, #25D366, #128C7E); }
        .telegram { background: linear-gradient(45deg, #229ED9, #0088cc); }
        .facebook { background: linear-gradient(45deg, #1877F2, #0056b3); }
        .social-label { display: block; margin-top: 8px; font-weight: bold; color: #555; font-size: 13px; }
    </style>
</head>
<body>

    <header class="main-header">
        <h1>موقع الشيخ سعيد مصطفى دياب</h1>
        <p>المكتبة العلمية والدعوية</p>
    </header>

    <div class="container">
        
        <div class="main-grid">
            <a href="lessons.html" class="nav-card">
                <i class="fas fa-microphone-alt"></i>
                <h2>المكتبة الصوتية</h2>
                <p>شروحات العقيدة والتفسير والحديث</p>
            </a>

            <a href="#" class="nav-card">
                <i class="fas fa-book-open"></i>
                <h2>المكتبة المقروءة</h2>
                <p>سلسلة حياة القلوب والمؤلفات النصية</p>
            </a>
        </div>

        <div class="social-section">
            <h3>تواصل معنا عبر المنصات الرسمية</h3>
            <div class="social-container">
                
                <a href="https://wa.me/97455703316" target="_blank" class="social-item">
                    <div class="social-icon whatsapp"><i class="fab fa-whatsapp"></i></div>
                    <span class="social-label">واتساب</span>
                </a>

                <a href="https://t.me/haiatelqloop3" target="_blank" class="social-item">
                    <div class="social-icon telegram"><i class="fab fa-telegram-plane"></i></div>
                    <span class="social-label">تليجرام</span>
                </a>

                <a href="https://www.facebook.com/share/1A3tyjPjy4/" target="_blank" class="social-item">
                    <div class="social-icon facebook"><i class="fab fa-facebook-f"></i></div>
                    <span class="social-label">فيسبوك</span>
                </a>

            </div>
        </div>

    </div>

</body>
</html>
